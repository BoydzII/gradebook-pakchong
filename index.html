<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KruSpace</title>
<!-- ติดตั้งเป็นแอปบนคอม มือถือ และไอแพด (PWA) -->
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#1f6feb">
<meta name="description" content="KruSpace — บันทึกคะแนน เวลาเรียน ตารางสอน แลกคาบและการลา สำหรับครูและผู้บริหาร">
<link rel="icon" href="./icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="KruSpace">
<style>
/* ============================================================
   ธีมและตัวแปรสี
   ============================================================ */
:root{
  --bg:#f4f6fa; --panel:#ffffff; --panel2:#f9fafc; --ink:#16202e; --muted:#67748a;
  --line:#dde3ec; --line2:#eef2f7; --brand:#1f6feb; --brand-ink:#ffffff;
  --ok:#0f8a53; --ok-bg:#e6f6ee; --bad:#c62828; --bad-bg:#fdecec;
  --warn:#a05a00; --warn-bg:#fff5e2; --group:#6b3fd4; --group-bg:#f1ecfd; --swapc:#b0560c; --swapc-bg:#fff0e0;
  --shadow:0 1px 2px rgba(16,30,54,.06),0 8px 24px rgba(16,30,54,.08);
  --r:14px; --brand2:#7457e8; --cyan:#0891b2; --hero:linear-gradient(135deg,#0f5fbb 0%,#1f6feb 52%,#6b4fd3 100%);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#11151c; --panel:#181e27; --panel2:#1e2530; --ink:#e6ecf5; --muted:#95a3b8;
    --line:#2b3441; --line2:#232b36; --brand:#4d8dfb; --brand-ink:#0b1220;
    --ok:#4bd08b; --ok-bg:#123024; --bad:#ff7b7b; --bad-bg:#3a1c1c;
    --warn:#ffc46b; --warn-bg:#3a2c12; --group:#b79bff; --group-bg:#2a2340; --swapc:#ffab5e; --swapc-bg:#3a2a15;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="light"]{
  --bg:#f3f6fb;--panel:#fff;--panel2:#f7f9fc;--ink:#142033;--muted:#64748b;--line:#dce4ef;--line2:#edf2f7;
  --brand:#1769d2;--brand-ink:#fff;--ok:#078651;--ok-bg:#e7f8ef;--bad:#c72c3b;--bad-bg:#fff0f1;
  --warn:#9a5b00;--warn-bg:#fff6df;--group:#6842ca;--group-bg:#f1edff;--swapc:#ad540b;--swapc-bg:#fff1e1;--shadow:0 1px 2px rgba(16,30,54,.04),0 10px 30px rgba(16,46,90,.08);
}
:root[data-theme="dark"]{
  --bg:#0d1420;--panel:#151e2c;--panel2:#1b2636;--ink:#edf3fb;--muted:#98a8bd;--line:#2a394d;--line2:#223044;
  --brand:#69a3ff;--brand-ink:#07111f;--ok:#53d99a;--ok-bg:#153628;--bad:#ff8790;--bad-bg:#3a2027;
  --warn:#ffd078;--warn-bg:#3a301b;--group:#b8a1ff;--group-bg:#2d2745;--swapc:#ffb26b;--swapc-bg:#3d2d18;--shadow:0 1px 2px rgba(0,0,0,.25),0 12px 34px rgba(0,0,0,.32);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Sarabun","Leelawadee UI","Noto Sans Thai","Segoe UI",Tahoma,sans-serif;
  font-size:15px; line-height:1.55;min-height:100vh;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}

/* ---------- แถบบนสุด ---------- */
/* ห่อแถบเลือกชั้น/วิชากับแถบแท็บไว้ด้วยกัน เพื่อให้ติดขอบบนได้ถูกต้องแม้แถบบนจะขึ้นบรรทัดใหม่ */
.stickytop{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px)}
.topbar{
  background:color-mix(in srgb,var(--panel) 94%,transparent);
  border-bottom:1px solid var(--line);padding:9px 16px;
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;box-shadow:0 1px 10px rgba(20,44,80,.06);
}
.brand{font-weight:800;font-size:17px;white-space:nowrap;display:flex;align-items:center;gap:9px;letter-spacing:-.2px}
.brand small{display:block;font-size:10.5px;line-height:1.1;color:var(--muted);font-weight:600;letter-spacing:.2px}
.brand .dot{width:30px;height:30px;border-radius:10px;background:var(--hero);display:inline-grid;place-items:center;color:#fff;box-shadow:0 6px 14px rgba(31,111,235,.28)}
.brand .dot:after{content:'S';font-size:17px;font-weight:800}
.pickers{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pick{display:flex;align-items:center;gap:5px}
.pick label{font-size:13px;color:var(--muted);white-space:nowrap}
.spacer{flex:1 1 auto}
.savestate{font-size:12.5px;color:var(--muted);white-space:nowrap;min-width:86px;text-align:right}
.savestate.on{color:var(--ok)}

select,input:not([type]),input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],textarea{
  background:var(--panel2); border:1px solid var(--line); border-radius:8px;
  padding:6px 9px; outline:none; max-width:100%;
}
select:focus,input:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(31,111,235,.15)}
button{
  background:var(--panel2); border:1px solid var(--line); border-radius:8px;
  padding:7px 12px;cursor:pointer;white-space:nowrap;transition:border-color .18s,background .18s,transform .18s,box-shadow .18s;
}
button:hover{border-color:var(--brand);transform:translateY(-1px)}
/* ระหว่างสลับโหมดสี ให้ทุกอย่างเปลี่ยนทันที กันสีพื้นค้างค่าเดิมจนอ่านตัวหนังสือไม่ออก */
html.theme-switching *,html.theme-switching *::before,html.theme-switching *::after{transition:none!important;animation:none!important}
button.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:600}
button.primary:hover{filter:brightness(1.08)}
button.danger{color:var(--bad);border-color:var(--line)}
button.danger:hover{border-color:var(--bad);background:var(--bad-bg)}
button.ghost{background:transparent}
button.sm{padding:3px 8px;font-size:13px;border-radius:7px}
button:disabled{opacity:.45;cursor:not-allowed}
a.button{display:inline-flex;align-items:center;text-decoration:none;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 12px;white-space:nowrap}
a.button:hover{border-color:var(--brand)}

/* ---------- แท็บ ---------- */
.tabs{
  display:flex;gap:3px;padding:4px 14px 0;
  background:transparent;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin;
}
.tabs button{
  border:none;background:none;border-radius:0;border-bottom:3px solid transparent;
  padding:10px 14px;color:var(--muted);font-weight:600;
}
.tabs button.active{color:var(--brand);border-bottom-color:var(--brand);background:color-mix(in srgb,var(--brand) 7%,transparent)}
.tabs button:hover{color:var(--ink)}

main{padding:16px 14px 80px;max-width:1500px;margin:0 auto}
section.tabpane{display:none}
section.tabpane.active{display:block}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h3{margin:0 0 10px;font-size:15.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .sub{font-weight:400;color:var(--muted);font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.tight{gap:6px}
.hint{color:var(--muted);font-size:13px}
.empty{padding:26px 14px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}

.badge{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12.5px;border:1px solid var(--line);background:var(--panel2)}
.badge.ok{color:var(--ok);background:var(--ok-bg);border-color:transparent}
.badge.bad{color:var(--bad);background:var(--bad-bg);border-color:transparent}
.badge.warn{color:var(--warn);background:var(--warn-bg);border-color:transparent}
.badge.grp{color:var(--group);background:var(--group-bg);border-color:transparent}

.notice{padding:9px 12px;border-radius:9px;background:var(--warn-bg);color:var(--warn);font-size:13.5px;margin-bottom:10px}
.notice.bad{background:var(--bad-bg);color:var(--bad)}
.notice.ok{background:var(--ok-bg);color:var(--ok)}

/* ---------- ตาราง ---------- */
table{border-collapse:separate;border-spacing:0;width:100%}
th,td{border-bottom:1px solid var(--line2);padding:6px 8px;text-align:left;vertical-align:middle}
thead th{background:var(--panel2);font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap;border-bottom:1px solid var(--line)}
tbody tr:hover td{background:var(--panel2)}
tbody tr.focus-row td{background:color-mix(in srgb,var(--brand) 13%,var(--panel))!important;box-shadow:inset 0 1px 0 color-mix(in srgb,var(--brand) 35%,transparent),inset 0 -1px 0 color-mix(in srgb,var(--brand) 35%,transparent)}
td.num,th.num{text-align:center}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.tablewrap.tall{max-height:74vh}

/* ตารางกรอกคะแนน */
.grid{font-size:14px}
.grid th,.grid td{border-right:1px solid var(--line2);padding:0}
.grid thead th{position:sticky;top:0;z-index:8;padding:5px 6px;text-align:center;line-height:1.25}
.grid thead th.c-no{left:0;z-index:12;min-width:42px}
.grid thead th.c-name{left:42px;z-index:12;min-width:210px}
.grid tbody td.c-no,.grid tbody td.c-name{position:sticky;background:var(--panel);z-index:5;padding:4px 8px}
.grid tbody td.c-no{left:0;text-align:center;color:var(--muted);min-width:42px}
.grid tbody td.c-name{left:42px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px}
.grid tbody tr:hover td.c-no,.grid tbody tr:hover td.c-name{background:var(--panel2)}
.grid th .hmax{display:block;font-weight:400;font-size:11.5px;color:var(--muted)}
.grid th.grpcol{color:var(--group)}
.grid input.cell{
  width:100%;min-width:56px;border:none;background:transparent;border-radius:0;
  padding:6px 4px;text-align:center;
}
.grid input.cell:focus{background:rgba(31,111,235,.12);box-shadow:inset 0 0 0 2px var(--brand)}
.grid input.cell.over{color:var(--bad);font-weight:700;background:var(--bad-bg)}
.grid input.cell.fail{color:var(--bad);font-weight:700;background:var(--bad-bg)}
.grid input.cell:disabled{cursor:not-allowed;opacity:.42;background:var(--panel2);color:var(--muted)}
.grid td.gcell input.cell{background:var(--group-bg)}
.grid td.gcell input.cell:focus{background:rgba(107,63,212,.18)}
.grid td.calc{text-align:center;font-weight:600;padding:4px 8px;white-space:nowrap}
.grid col.sep,.grid .sepcol{border-left:2px solid var(--line)}
.grid th.sepcol,.grid td.sepcol{border-left:2px solid var(--line)}

/* ตารางประเมินคุณลักษณะ / อ่านคิดวิเคราะห์ */
.assessgrid th,.assessgrid td{text-align:center;white-space:nowrap}
.assessgrid thead th{position:sticky;top:0;z-index:4}
.assessgrid .a-no{position:sticky;left:0;z-index:6;background:var(--panel);min-width:72px}
.assessgrid .a-name{position:sticky;left:72px;z-index:6;background:var(--panel);min-width:210px;text-align:left;max-width:250px;overflow:hidden;text-overflow:ellipsis}
.assessgrid thead .a-no,.assessgrid thead .a-name{background:var(--panel2);z-index:8}
.assessgrid select.assess-cell{width:54px;padding:5px 4px;text-align:center;font-weight:700}
.assessgrid td.count3{color:var(--ok)}
.assessgrid td.count0{color:var(--bad)}
.assess-legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:5px 14px;margin:8px 0 12px}

/* สรุปแบบปก ปพ.5 */
.cover5{border:2px solid var(--ink);padding:20px;background:var(--panel)}
.cover5 .cover-title{text-align:center;margin-bottom:18px}
.cover5 .cover-title h2{font-size:21px;margin:0 0 6px}
.cover5 .cover-title p{margin:3px 0}
.cover-meta{display:grid;grid-template-columns:1fr 1fr;gap:7px 28px;margin:14px 0 18px}
.cover-meta>div{border-bottom:1px dotted var(--muted);padding:3px 2px}
.cover-table{border-collapse:collapse;width:100%}
.cover-table th,.cover-table td{border:1px solid var(--ink);text-align:center;padding:7px 8px}
.cover-assess{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
@media(max-width:800px){.cover-meta,.cover-assess{grid-template-columns:1fr}}

/* ตารางสอน / เวลาเรียน */
.timetable{border-collapse:separate;border-spacing:0;min-width:1040px;width:100%;table-layout:fixed;font-size:12px}
.timetable th,.timetable td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;vertical-align:top}
.timetable th:first-child,.timetable td:first-child{border-left:1px solid var(--line)}
.timetable thead th{border-top:1px solid #0e5fb5;background:#1769bd;color:#fff;text-align:center;padding:7px 3px}
.timetable thead th .hint{color:#e9f3ff}
.timetable .slot-info{width:68px;white-space:nowrap;text-align:center;background:var(--panel2);padding-left:3px;padding-right:3px}
.timetable thead th:first-child{width:68px;white-space:nowrap;background:#0e4f9b;padding-left:3px;padding-right:3px}
.timetable thead th:not(:first-child){width:auto;padding:7px 3px}
.tt-cell{width:100%;min-height:72px;text-align:left;border:1px solid transparent;background:transparent;padding:6px;border-radius:7px;position:relative;overflow:hidden}
.tt-cell:hover{border-color:var(--brand);background:var(--brandSoft)}
.tt-cell.filled{display:flex;flex-direction:column;background:#eef8ed;border-color:#b9dfb8;box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
.tt-cell.filled:hover{background:#e2f3df;border-color:#74bd72}
.tt-cell.empty{display:flex;align-items:center;justify-content:center;color:#b7a44c;background:#fff9d9;border-style:dashed;border-color:#e9cb58}
.timetable tbody tr:nth-child(even) td{background:#fbfcfe}
.timetable tbody tr.today-row .slot-info{background:#fff3c5;color:#6f5200}
:root[data-theme="dark"] .timetable thead th{background:#155b9e;border-color:#314a67;color:#eef7ff}
:root[data-theme="dark"] .timetable thead th:first-child{background:#104778}
:root[data-theme="dark"] .timetable .slot-info{background:#192638;color:#e6eef8;border-color:#2c3d53}
:root[data-theme="dark"] .timetable tbody tr:nth-child(even) td{background:#111b29}
:root[data-theme="dark"] .timetable tbody tr.today-row .slot-info{background:#3b321d;color:#ffe298}
:root[data-theme="dark"] .tt-cell.filled{background:#183426;border-color:#326647;color:#e9f8ef}
:root[data-theme="dark"] .tt-cell.filled:hover{background:#204630;border-color:#52a46f}
:root[data-theme="dark"] .tt-cell.empty{background:#332d19;border-color:#756426;color:#dfbd55}
:root[data-theme="dark"] .tt-cell.empty:hover{background:#403820;border-color:#b79532}
:root[data-theme="dark"] .tt-code{color:#78aaff}
:root[data-theme="dark"] .tt-name{color:#edf3fb}
:root[data-theme="dark"] .tt-room{color:#9fb0c5}
.tt-cell.exchange{background:#f1eaff;border-color:#9b77df}.tt-cell.substitute{background:#eef3ff;border-color:#a8bced}.tt-cell.makeup{background:#fff1e4;border-color:#e8b47f}
:root[data-theme="dark"] .tt-cell.exchange{background:#32234d;border-color:#805bb9}:root[data-theme="dark"] .tt-cell.substitute{background:#202e49;border-color:#426395}:root[data-theme="dark"] .tt-cell.makeup{background:#3b2b1e;border-color:#8c623d}
.tt-code{font-weight:800;color:var(--brand);font-size:11px;overflow:hidden;text-overflow:ellipsis}
.tt-name{font-size:10.5px;margin-top:3px;padding-right:22px;line-height:1.28;white-space:normal;overflow:visible;overflow-wrap:anywhere;word-break:normal;max-height:none}
.tt-room{font-size:9.5px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tt-edit{position:absolute;right:3px;top:3px;border:0;background:var(--panel);padding:2px 6px;font-size:11px;min-height:0}
.att-grid select{min-width:115px}
/* ---------- ตารางเช็กชื่อ: ติ๊กทีละสถานะ แยกสีให้กวาดตาเจอทันที ---------- */
:root{--att-present:#12a05c;--att-late:#c98a00;--att-leave:#4f6bd8;--att-activity:#0d94ad;--att-absent:#d43b3b}
:root[data-theme="dark"]{--att-present:#4fd394;--att-late:#ffcb63;--att-leave:#8ea4ff;--att-activity:#54c9e0;--att-absent:#ff8a8a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--att-present:#4fd394;--att-late:#ffcb63;--att-leave:#8ea4ff;--att-activity:#54c9e0;--att-absent:#ff8a8a}}
.att-present{background:#e9f9ef}.att-late{background:#fff7dc}.att-absent{background:#ffe9e9}.att-leave{background:#eef2ff}.att-activity{background:#e8f8fb}
:root[data-theme="dark"] .att-present{background:#173426}:root[data-theme="dark"] .att-late{background:#392f18}:root[data-theme="dark"] .att-absent{background:#3b2023}:root[data-theme="dark"] .att-leave{background:#202944}:root[data-theme="dark"] .att-activity{background:#17333a}
/* โหมดมืดของระบบที่ยังไม่ได้เลือกธีมเอง ก็ต้องได้พื้นเข้มเหมือนกัน ไม่งั้นตัวหนังสืออ่อนบนพื้นสว่าง */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .att-present{background:#173426}
  :root:not([data-theme="light"]) .att-late{background:#392f18}:root:not([data-theme="light"]) .att-absent{background:#3b2023}
  :root:not([data-theme="light"]) .att-leave{background:#202944}:root:not([data-theme="light"]) .att-activity{background:#17333a}}
.att-grid th.c-no,.att-grid td.c-no{width:52px;text-align:center;font-variant-numeric:tabular-nums;font-weight:700}
.att-grid th.att-col,.att-grid td.att-col{width:62px;text-align:center;padding:4px 2px}
.att-grid th.att-col{font-size:12.5px;border-bottom-width:3px;border-bottom-style:solid}
.att-present-h{color:var(--att-present);border-bottom-color:var(--att-present)}
.att-late-h{color:var(--att-late);border-bottom-color:var(--att-late)}
.att-leave-h{color:var(--att-leave);border-bottom-color:var(--att-leave)}
.att-activity-h{color:var(--att-activity);border-bottom-color:var(--att-activity)}
.att-absent-h{color:var(--att-absent);border-bottom-color:var(--att-absent)}
.att-tick{display:grid;place-items:center;cursor:pointer;padding:5px 0;--tick:var(--muted)}
.att-present-t{--tick:var(--att-present)}.att-late-t{--tick:var(--att-late)}.att-leave-t{--tick:var(--att-leave)}
.att-activity-t{--tick:var(--att-activity)}.att-absent-t{--tick:var(--att-absent)}
.att-tick input{position:absolute;opacity:0;width:0;height:0}
.att-tick span{width:27px;height:27px;border-radius:9px;border:2px solid var(--line);background:var(--panel);
  display:grid;place-items:center;transition:background .12s,border-color .12s,transform .12s}
.att-tick:hover span{border-color:var(--tick)}
.att-tick input:checked + span{background:var(--tick);border-color:var(--tick)}
.att-tick input:checked + span:after{content:'';width:9px;height:15px;margin-top:-4px;border:solid #fff;
  border-width:0 3px 3px 0;transform:rotate(42deg)}
.att-tick input:focus-visible + span{outline:3px solid var(--brand);outline-offset:2px}
.att-tick .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.att-grid td.c-hist{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px}
.att-grid tbody td{padding-top:5px;padding-bottom:5px}
.att-grid tbody .hint{font-size:11.5px;line-height:1.3}
.att-summary{max-height:22vh;overflow:auto}
.att-grid .hist-num{font-weight:700;color:var(--ink)}
/* แถบสรุป อยู่เหนือตาราง เห็นยอดสดขณะติ๊ก */
.att-summary{margin-bottom:10px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);padding:10px 12px}
.att-chips{display:flex;gap:7px;align-items:center;flex-wrap:wrap}

/* ---- วงล้อเลือกบทบาทหน้าแรก : กลีบกังหัน 5 สี หมุนช้า ๆ ---- */
.gateway-brand{text-align:center;margin-bottom:clamp(8px,1.6vw,18px)}

.role-wheel{position:relative;width:min(74vmin,460px);margin:0 auto;aspect-ratio:1}

/* วงล้อหมุนทั้งชุด ส่วนไอคอนหมุนสวนกลับด้วยจังหวะเดียวกัน จึงตั้งตรงเสมอไม่กลับหัว */
.wheel-rotor{transform-box:view-box;transform-origin:250px 250px;animation:wheelSpin 48s linear infinite}
.wheel-icon{transform-box:fill-box;transform-origin:center;animation:wheelSpinBack 48s linear infinite}
@keyframes wheelSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes wheelSpinBack{from{transform:rotate(0deg)}to{transform:rotate(-360deg)}}
/* หยุดหมุนเมื่อชี้หรือโฟกัส เพื่อให้กดเลือกได้ง่าย */
.role-wheel:hover .wheel-rotor,.role-wheel:hover .wheel-icon,
.role-wheel:focus-within .wheel-rotor,.role-wheel:focus-within .wheel-icon{animation-play-state:paused}
.wheel-hub{fill:url(#wheelHubFill);stroke:color-mix(in srgb,var(--line) 70%,transparent);stroke-width:2;
  filter:drop-shadow(0 4px 16px rgba(15,35,65,.10))}
.wheel-seg{cursor:pointer;outline:none}
.wheel-fill{stroke:var(--bg);stroke-width:13;stroke-linejoin:round;stroke-linecap:round;
  transition:filter .22s ease,opacity .22s ease}
.wheel-icon path{fill:#fff;fill-opacity:1;pointer-events:none;
  filter:drop-shadow(0 3px 6px rgba(6,16,34,.42))}

.wheel-seg:hover .wheel-fill,.wheel-seg:focus-visible .wheel-fill{filter:brightness(1.12) saturate(1.14) drop-shadow(0 4px 10px rgba(6,16,34,.3))}
.wheel-seg:focus-visible .wheel-fill{stroke:var(--ink);stroke-width:5}
.role-wheel:hover .wheel-seg:not(:hover) .wheel-fill{opacity:.75}
.wheel-center{position:absolute;inset:0;display:grid;place-content:center;pointer-events:none;text-align:center;padding:0 22%}
.wheel-name{font-weight:800;font-size:clamp(14px,2.1vw,19px);color:var(--ink);line-height:1.35}

  border-left:4px solid var(--warn);border-radius:10px;background:var(--panel)}

.gap-fix{margin-top:5px;font-size:12.5px;color:var(--ink);background:var(--warn-bg);
  border-radius:8px;padding:5px 9px;display:inline-block}
/* กล่องรายการยาว ๆ ย่อให้เหลือความสูงพอดีจอ แล้วเลื่อนอ่านข้างในแทน */
.listbox.folded{max-height:340px;overflow:auto}
.listbox.folded thead th{position:sticky;top:0;z-index:1;background:var(--panel)}
.exec-note{font-size:12px;color:var(--muted);margin:0 0 10px;padding:8px 11px;border-radius:9px;background:var(--panel2);border:1px dashed var(--line)}
.exec-more{margin-top:10px}
.exec-more>summary{cursor:pointer;font-size:12.5px;font-weight:700;color:var(--muted);padding:6px 2px;list-style:none}
.exec-more>summary::-webkit-details-marker{display:none}
.exec-more>summary:before{content:'▸ ';color:var(--brand)}
.exec-more[open]>summary:before{content:'▾ '}
.pr-tag{display:inline-flex;align-items:center;justify-content:center;min-width:32px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:800;border:1px solid transparent}
.pr-zero{background:var(--bad-bg);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.pr-r{background:var(--warn-bg);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.pr-ms{background:var(--group-bg);color:var(--group);border-color:color-mix(in srgb,var(--group) 35%,transparent)}
.pr-mp{background:var(--line2);color:var(--muted);border-color:var(--line)}
.pr-check{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);font-weight:600}
tr.pr-done{opacity:.62}
.cover-note{margin-top:8px;padding:9px 12px;border-radius:10px;font-size:12.5px;line-height:1.5;
  background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.cover-note b{color:var(--ink)}
.cover-note.locked{background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 32%,transparent);color:var(--warn)}
.cover-note.locked b{color:var(--warn)}
.cover-group{border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:10px;background:var(--panel2)}
.cover-group-head{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.cover-rank{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:var(--brand);color:var(--brand-ink);font-size:12.5px;font-weight:800}
.cover-group:first-child .cover-group-head b{color:var(--brand)}
.cover-list{display:grid;gap:7px}
.cover-pick{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);
  border-radius:10px;background:var(--panel);cursor:pointer}
.cover-pick:hover{border-color:var(--brand)}
.cover-pick:has(input:checked){border-color:var(--brand);background:color-mix(in srgb,var(--brand) 9%,var(--panel))}
.cover-pick input{flex:none;width:17px;height:17px;accent-color:var(--brand)}
.cover-pick.used{opacity:.6;background:var(--panel2)}
.ind-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.ind-action{display:grid;gap:3px;text-align:left;padding:13px 14px;border:1px solid var(--line);border-radius:12px;
  background:var(--panel2);align-content:start}
.ind-action:hover{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 7%,var(--panel))}
.ind-action b{font-size:14px;color:var(--ink)}
.ind-action span{font-size:12px;color:var(--muted);line-height:1.45;font-weight:500}
.ind-pick-list{max-height:52vh;overflow:auto;padding-right:4px}
#pane-indicators textarea{resize:vertical;line-height:1.5}
#pane-indicators .ind-code{font-weight:700}
#pane-indicators td input,#pane-indicators td select,#pane-indicators td textarea{background:var(--panel)}
@media(max-width:720px){.ind-actions{grid-template-columns:1fr}}

/* ---------- ปุ่มซิงก์ผลการเรียนคงค้าง ---------- */
.sync-fab{position:fixed;right:20px;bottom:calc(24px + env(safe-area-inset-bottom));z-index:96;
  display:none;align-items:center;gap:11px;background:none;border:0;padding:0;cursor:pointer}
.sync-fab.show{display:inline-flex}
body.gateway-open .sync-fab,body:has(#studentPortal:not([hidden])) .sync-fab{display:none}
.sync-label{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:999px;
  padding:9px 15px;font-size:12.5px;font-weight:700;box-shadow:var(--shadow);white-space:nowrap;
  opacity:0;transform:translateX(10px);transition:opacity .2s ease,transform .2s ease;pointer-events:none}
.sync-fab:hover .sync-label,.sync-fab:focus-visible .sync-label{opacity:1;transform:none}
.sync-orb{position:relative;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;
  background:var(--hero);color:#fff;box-shadow:0 14px 32px rgba(16,46,90,.34),0 2px 6px rgba(16,46,90,.22);
  transition:transform .18s ease,box-shadow .18s ease}
.sync-fab:hover .sync-orb{transform:translateY(-2px);box-shadow:0 18px 38px rgba(16,46,90,.4),0 2px 6px rgba(16,46,90,.24)}
.sync-fab:active .sync-orb{transform:translateY(0) scale(.96)}
.sync-fab:focus-visible .sync-orb{outline:3px solid var(--brand);outline-offset:4px}
.sync-orb:before{content:'';position:absolute;inset:-7px;border-radius:50%;
  border:2px solid color-mix(in srgb,var(--brand) 60%,transparent);opacity:0;pointer-events:none}
.sync-fab.dirty .sync-orb:before{animation:syncPulse 2.6s ease-out infinite}
@keyframes syncPulse{0%{opacity:.7;transform:scale(.93)}70%{opacity:0;transform:scale(1.28)}100%{opacity:0;transform:scale(1.28)}}
.sync-ico{display:grid;place-items:center}
.sync-ico svg{width:27px;height:27px;display:block}
.sync-fab.busy .sync-ico{animation:syncRise 1s ease-in-out infinite}
@keyframes syncRise{0%{transform:translateY(4px);opacity:.5}50%{transform:translateY(-4px);opacity:1}100%{transform:translateY(4px);opacity:.5}}
.sync-count{position:absolute;top:-2px;right:-2px;min-width:23px;height:23px;padding:0 6px;border-radius:999px;
  background:var(--bad);color:#fff;font-size:11.5px;font-weight:800;display:grid;place-items:center;
  border:2px solid var(--bg);font-variant-numeric:tabular-nums}
.sync-fab:not(.has-count) .sync-count{display:none}
.sync-fab.off .sync-count{background:var(--muted)}
.sync-fab.off .sync-orb{background:var(--line2);color:var(--muted);box-shadow:var(--shadow)}
.sync-fab.done .sync-orb{background:linear-gradient(135deg,#0f8a53 0%,#22c55e 100%)}
@media(max-width:720px){.sync-fab{right:14px;bottom:calc(80px + env(safe-area-inset-bottom))}.sync-label{display:none}
  .sync-orb{width:56px;height:56px}.sync-ico svg{width:25px;height:25px}}
@media(prefers-reduced-motion:reduce){.sync-fab.dirty .sync-orb:before,.sync-fab.busy .sync-ico{animation:none}
  .sync-fab:hover .sync-orb,.sync-fab:active .sync-orb{transform:none}}
@media(max-width:700px){.roster-grid{grid-template-columns:repeat(2,1fr)}.exec-toolbar input,.exec-toolbar select{min-width:0;flex:1 1 130px}}
.exchange-request{border-left:4px solid var(--group);padding:10px 12px;border-radius:9px;background:var(--group-bg);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.exchange-layout{display:grid;grid-template-columns:minmax(320px,.9fr) minmax(0,1.25fr);gap:14px}.candidate-list{display:grid;gap:9px}.candidate-card{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel2)}
/* สามวิธีนี้ผลต่างกันมาก จึงต้องแยกด้วยสีให้ครูเห็นตั้งแต่แวบแรก
   แลกคาบ = เขาว่างคาบเรา เราว่างคาบเขา (ม่วง) • สลับคาบ = ห้องเดียวกันคนละวัน (ส้มอำพัน)
   สอนแทน = ไม่ต้องสอนคืน (ฟ้าเขียว) */
.candidate-card.mode-trade{border-color:color-mix(in srgb,var(--group) 55%,var(--line));
  box-shadow:inset 4px 0 0 var(--group)}
.candidate-card.mode-swap{border-color:color-mix(in srgb,var(--swapc) 55%,var(--line));
  box-shadow:inset 4px 0 0 var(--swapc)}
.candidate-card.mode-substitute{border-color:color-mix(in srgb,var(--cyan) 55%,var(--line));
  box-shadow:inset 4px 0 0 var(--cyan)}
.mode-tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.02em;
  padding:3px 10px;border-radius:999px;margin-bottom:6px}
.mode-tag.mode-trade{background:var(--group-bg);color:var(--group)}
.mode-tag.mode-swap{background:var(--swapc-bg);color:var(--swapc)}
.mode-tag.mode-substitute{background:color-mix(in srgb,var(--cyan) 14%,transparent);color:var(--cyan)}
.candidate-card.mode-swap .candidate-rank{color:var(--swapc)}
.candidate-card.mode-substitute .candidate-rank{color:var(--cyan)}
.candidate-card.mode-swap .pick-chip.on{background:var(--swapc);border-color:var(--swapc);
  box-shadow:0 4px 12px color-mix(in srgb,var(--swapc) 35%,transparent)}
.candidate-card.mode-substitute .pick-chip.on{background:var(--cyan);border-color:var(--cyan);
  box-shadow:0 4px 12px color-mix(in srgb,var(--cyan) 35%,transparent)}
.candidate-card.recommended{outline:2px solid color-mix(in srgb,var(--brand) 42%,transparent);outline-offset:1px}.candidate-rank{font-size:10px;font-weight:900;color:var(--group);letter-spacing:.03em}.leave-card{border-left:4px solid var(--warn)}.request-flow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.request-flow i{width:24px;height:1px;background:var(--line)}
/* เบอร์โทรครูที่จับคู่กันได้ตอนแลกคาบ/สอนแทน — แตะเพื่อโทรได้บนมือถือ */
.phone-link{display:inline-flex;align-items:center;gap:4px;font-weight:800;color:var(--group);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:1px 8px;background:var(--panel)}
.phone-link:hover{border-color:var(--group)}
/* ย่อ/ขยายกล่อง — ปุ่มลูกศรมุมหัวข้อ จำสถานะไว้ให้ผู้ใช้ */
.card-collapse{margin-left:8px;padding:0 7px;line-height:1.6;border-radius:8px;font-size:12px}
.card.collapsed > *:not(.card-head-row){display:none}
.card.collapsed{align-self:start}
.card.collapsed .card-collapse{transform:rotate(-90deg)}
.request-pick{margin-right:8px;transform:scale(1.15)}
/* แถบคาบสำหรับดูความเหมาะสมในการแลก — เขียว=ว่าง แดง=ไม่ว่าง ม่วง=คาบที่จะแลก */
.slot-strip{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin-top:7px}
.slot-box{min-width:27px;height:27px;padding:0 5px;display:grid;place-items:center;border-radius:8px;
  font-size:12px;font-weight:800;border:1.5px solid;line-height:1}
.slot-box.free{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent);background:var(--ok-bg)}
.slot-box.busy{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent);background:var(--bad-bg)}
/* คู่สีของคาบที่จับคู่กัน: ทึบ = คาบที่ยกให้ครูอีกฝ่าย • เส้นประอ่อน = คาบที่ต้องไปสอนคืน */
.slot-box.mark,.slot-block{--tone:var(--group);--tone-bg:var(--group-bg)}
.slot-box.mark.swap,.slot-block.swap{--tone:var(--swapc);--tone-bg:var(--swapc-bg)}
.slot-box.mark.sub,.slot-block.sub{--tone:var(--cyan);--tone-bg:color-mix(in srgb,var(--cyan) 15%,transparent)}
.slot-box.mark.pick,.slot-block.pick{--tone:var(--brand);--tone-bg:color-mix(in srgb,var(--brand) 13%,transparent)}
.slot-box.mark.give{color:var(--brand-ink);background:var(--tone);border-color:var(--tone);box-shadow:0 3px 10px color-mix(in srgb,var(--tone) 40%,transparent)}
.slot-box.mark.take{color:var(--tone);background:var(--tone-bg);border-color:var(--tone);border-style:dashed}
/* คาบคู่ต้องย้ายพร้อมกันทั้งก้อน จึงล้อมเป็นกรอบเดียวและติดป้ายว่านับเป็นกี่คาบ */
.slot-block{display:inline-flex;align-items:center;gap:3px;padding:2px 7px 2px 3px;border-radius:12px;
  background:var(--tone-bg);outline:1.5px dashed color-mix(in srgb,var(--tone) 62%,transparent)}
.slot-block .blk-tag{font-size:10px;font-weight:900;color:var(--tone);letter-spacing:.02em;white-space:nowrap}
.slot-count{font-size:11.5px;font-weight:700;color:var(--muted);margin-left:4px}
/* ชิปเลือกวัน/คาบที่จะแลก — ทรงรียาว อ่านง่าย ไม่ใช้คลาส .chip เดิมที่ถูกล็อกความกว้างไว้ */
.pick-week{margin-top:8px}
.pick-week-label{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.02em;margin-bottom:4px}
.pick-chips{display:flex;flex-wrap:wrap;gap:6px}
.pick-chip{display:inline-flex;align-items:center;gap:6px;min-width:96px;height:34px;padding:0 14px;
  border-radius:999px;font-size:13px;font-weight:700;line-height:1;white-space:nowrap;
  border:1px solid var(--line);background:var(--panel2);color:var(--ink)}
.pick-chip b{font-weight:800}
.pick-chip:hover{border-color:var(--brand)}
.pick-chip.on{background:var(--group);color:var(--brand-ink);border-color:var(--group);box-shadow:0 4px 12px color-mix(in srgb,var(--group) 35%,transparent)}
/* กล่องคาบที่กดเลือกได้ */
.slot-box.pickable{cursor:pointer;outline:2px dashed color-mix(in srgb,var(--brand) 60%,transparent);outline-offset:1px}
.slot-box.pickable:hover{transform:translateY(-1px)}
.slot-legend{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:11.5px;font-weight:700;color:var(--muted);margin-top:8px}
.slot-legend span.k{display:inline-flex;align-items:center;gap:5px}
.slot-legend i{width:13px;height:13px;border-radius:5px;border:1.5px solid;display:inline-block}
.slot-legend i.free{background:var(--ok-bg);border-color:var(--ok)}
.slot-legend i.busy{background:var(--bad-bg);border-color:var(--bad)}
.slot-legend i.mark,.slot-legend i.blk{--tone:var(--group);--tone-bg:var(--group-bg)}
.slot-legend i.mark.swap{--tone:var(--swapc);--tone-bg:var(--swapc-bg)}
.slot-legend i.mark.sub{--tone:var(--cyan);--tone-bg:color-mix(in srgb,var(--cyan) 16%,transparent)}
.slot-legend i.mark.pick{--tone:var(--brand);--tone-bg:color-mix(in srgb,var(--brand) 14%,transparent)}
.slot-legend i.mark.give{background:var(--tone);border-color:var(--tone)}
.slot-legend i.mark.take{background:var(--tone-bg);border-color:var(--tone);border-style:dashed}
.slot-legend i.blk{background:transparent;border-style:dashed;border-color:var(--muted)}
.audit-item{border-left:3px solid var(--bad)}
/* การ์ดแจ้งเตือนงานที่รอเราดำเนินการ */
.alert-card{border-left:4px solid var(--bad)}
.accepted-box{margin-top:10px;padding:10px 12px;border-radius:10px;border:1px solid color-mix(in srgb,var(--ok) 40%,var(--line));background:var(--ok-bg)}
.accepted-box b{color:var(--ok)}
.approval-item{align-items:flex-start;gap:10px}
.approval-item.bad{border-color:color-mix(in srgb,var(--bad) 45%,var(--line));background:color-mix(in srgb,var(--bad-bg) 60%,var(--panel))}
.approval-item.warn{border-color:color-mix(in srgb,var(--warn) 45%,var(--line));background:color-mix(in srgb,var(--warn-bg) 60%,var(--panel))}
.approval-ico{width:28px;height:28px;flex:0 0 28px;display:grid;place-items:center;border-radius:9px;
  background:var(--panel);border:1px solid var(--line);font-weight:800}
.alert-bell{position:relative;font-size:14px}

/* ---------- ปรับหน้าตาให้ใช้ง่ายขึ้นทั้งคอม ไอแพด และมือถือ ---------- */
/* แตะแล้วตอบสนองทันที ไม่มีไฮไลต์สีฟ้าแบบเบราว์เซอร์มือถือ */
button,.tabs button,a.button,select,input{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.tablewrap{-webkit-overflow-scrolling:touch}

/* ชิปบอกว่ากำลังใช้งานเป็นใคร บทบาทอะไร */
.who-chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--brand);
  background:color-mix(in srgb,var(--brand) 10%,transparent);border:1px solid color-mix(in srgb,var(--brand) 28%,transparent);
  border-radius:999px;padding:4px 11px;white-space:nowrap;max-width:42vw;overflow:hidden;text-overflow:ellipsis}
.who-chip b{font-weight:800}

/* เมนู ⋯ รวมปุ่มที่ไม่ได้ใช้บ่อย ให้แถบบนโล่ง */
.icon-btn{min-width:38px;justify-content:center}
.more-title{font-size:11px;font-weight:800;letter-spacing:.04em;color:var(--muted);padding:2px 10px 4px}
.logout-btn{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
/* แถวแท็บ: แท็บหลักปักหมุดไว้ ที่เหลืออยู่ในเมนูที่กางออกด้านข้าง */
.tabsrow{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding-right:12px}
.tabsrow .tabs{flex:1;min-width:0;border-bottom:none}
.tabs-more-btn{flex:0 0 auto;font-size:17px;line-height:1;padding:7px 13px;border-radius:11px;font-weight:700}
/* ปุ่มติดตั้งแอป — ไอคอนเล็กมุมล่างขวา เห็นเฉพาะหน้าเข้าสู่ระบบ */
.install-fab{display:none;position:fixed;right:24px;bottom:calc(26px + env(safe-area-inset-bottom));z-index:95;
  width:46px;height:46px;padding:0;border-radius:14px;font-size:20px;font-weight:800;align-items:center;justify-content:center;
  background:var(--panel);border:1px solid var(--line);color:var(--brand);box-shadow:0 10px 26px rgba(15,23,42,.18)}
.install-fab:not([hidden]){display:inline-flex}
.install-fab:hover{border-color:var(--brand);transform:translateY(-2px)}
/* เมื่อปุ่มซิงก์โผล่อยู่ ให้ปุ่มติดตั้งขยับขึ้นไปวางซ้อนกันเป็นแถว ไม่ทับกัน */
body.has-syncfab .install-fab{bottom:calc(26px + 74px + env(safe-area-inset-bottom))}
@media(max-width:720px){.install-fab{right:18px;bottom:calc(82px + env(safe-area-inset-bottom))}
  body.has-syncfab .install-fab{bottom:calc(82px + 68px + env(safe-area-inset-bottom))}}
body.gateway-open .sync-fab{display:none}
.more-sep{height:1px;background:var(--line);margin:3px 0}

/* แท็บทรงแคปซูล อ่านง่ายและกดง่ายขึ้น */
.tabs{gap:6px;padding:8px 14px;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border-radius:999px;border-bottom:none;padding:8px 15px;white-space:nowrap;font-weight:700;
  background:transparent;transition:background .15s,color .15s}
.tabs button.active{background:var(--brand);color:#fff;border-bottom-color:transparent;box-shadow:0 6px 16px rgba(31,111,235,.24)}
.tabs button:hover:not(.active){background:var(--panel2);color:var(--ink)}

/* แถบล่างบนมือถือ — เข้าถึงงานหลัก 5 อย่างด้วยนิ้วโป้ง */
.bottomnav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:color-mix(in srgb,var(--panel) 96%,transparent);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  grid-template-columns:repeat(5,1fr);gap:2px}
.bottomnav button{display:grid;gap:2px;justify-items:center;background:none;border:none;padding:6px 2px;
  border-radius:12px;color:var(--muted);font-size:11px;font-weight:700;line-height:1.25;min-height:52px}
.bottomnav button .bn-ico{font-size:19px;line-height:1}
.bottomnav button.active{color:var(--brand);background:color-mix(in srgb,var(--brand) 10%,transparent)}
.bottomnav .bn-dot{position:absolute;transform:translate(14px,-4px);width:7px;height:7px;border-radius:50%;background:var(--bad)}

/* แผ่นเมนูรวมทุกหน้า เปิดจากปุ่ม "เพิ่มเติม" */
.tabsheet{position:fixed;inset:0;z-index:120;background:rgba(15,23,42,.45);display:grid;align-items:end;justify-items:stretch}
.tabsheet-inner{background:var(--panel);border-radius:18px 18px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom));
  max-height:78vh;overflow:auto;display:grid;gap:8px}
.tabsheet-head{display:flex;align-items:center;gap:8px}
.tabsheet-head b{font-size:15px}
.tabsheet-close{margin-left:auto;min-width:38px;height:38px;border-radius:10px;font-size:17px;font-weight:800}
@media(min-width:721px){
  .tabsheet{align-items:start;justify-items:end;padding:70px 16px 16px}
  .tabsheet-inner{border-radius:16px;max-width:520px;padding:14px;box-shadow:0 24px 60px rgba(15,23,42,.28)}
  .tabsheet-handle{display:none}
}
.tabsheet-sec{font-size:11.5px;font-weight:800;letter-spacing:.06em;color:var(--muted);
  margin:14px 2px 7px;padding-bottom:5px;border-bottom:1px solid var(--line2)}
.tabsheet-sec:first-of-type{margin-top:6px}
.tabsheet-grid button .ts-ico{margin-right:6px;opacity:.75}
.tabsheet-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tabsheet-grid button{justify-content:flex-start;padding:14px 12px;border-radius:12px;font-weight:700;text-align:left}
.tabsheet-grid button.active{border-color:var(--brand);color:var(--brand);background:color-mix(in srgb,var(--brand) 8%,transparent)}
.tabsheet-handle{width:44px;height:4px;border-radius:999px;background:var(--line);margin:0 auto 4px}
.tabsheet-foot{display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}
.tabsheet-tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.tabsheet-tools button{justify-content:flex-start;padding:11px 12px;border-radius:11px;font-weight:700}
.tabsheet-tools button:last-child{grid-column:1/-1}
@media(min-width:721px){.tabsheet-tools{display:none}}

@media(max-width:720px){
  /* iOS จะซูมเองถ้าตัวอักษรในช่องกรอกเล็กกว่า 16px */
  input,select,textarea{font-size:16px}
  /* กันเนื้อหาดันจอจนตกขอบ ทุกอย่างต้องยุบลงมาอยู่ในความกว้างจอเสมอ */
  html,body{max-width:100%;overflow-x:hidden}
  main{padding-left:10px;padding-right:10px}
  .card{padding:13px;border-radius:12px}
  .row{flex-wrap:wrap}
  .grid2{grid-template-columns:1fr}
  .tablewrap{max-width:100%}
  .exec-sum,.att-chips,.exec-toolbar{max-width:100%}
  .exec-toolbar input,.exec-toolbar select{min-width:0;width:100%}
  .dash-hero{padding:16px}
  .modal-bg{padding:8px}
  .modal{width:100%;max-width:100%}
  .badge,.pr-tag,.att-chip,.level-tag{white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .alert-item{flex-wrap:wrap}
  .alert-item .spacer{flex-basis:100%;height:0}
  .cover-pick,.roster-card{min-width:0}
  .ind-actions,.quick-grid{grid-template-columns:1fr}
  h1{font-size:20px;overflow-wrap:anywhere}
  h3{overflow-wrap:anywhere}
  .topbar{padding:8px 10px;gap:6px}
  .brand{font-size:15px}.brand small{display:none}
  .pickers{width:100%;gap:6px}.pickers .pick{flex:1 1 46%}
  .pick label{display:none}
  .icon-btn .lbl{display:none}
  .tabsrow{display:none}
  .bottomnav{display:grid}
  main{padding-bottom:calc(80px + env(safe-area-inset-bottom))}
  .who-chip{max-width:38vw}
  button.sm{min-height:36px}
  /* บนมือถือให้เมนูเป็นแผ่นด้านล่าง กดง่ายด้วยนิ้วโป้ง */
}
@media(min-width:721px) and (max-width:1100px){
  .pickers .pick{flex:1 1 auto}.tabs button{padding:8px 12px;font-size:13.5px}
}
.school-logo{width:76px;height:76px;object-fit:contain;display:block;margin:0 auto 6px}
.cover-approvals{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:8px 24px;font-size:11px}
.approval-line{border-bottom:1px dotted #555;min-height:30px;padding:4px 2px}

/* ---------- ชิปเลขที่ (แท็บกลุ่ม) ---------- */
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.chip{
  width:38px;height:34px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line);border-radius:8px;background:var(--panel2);cursor:pointer;
  font-size:13.5px;user-select:none;
}
.chip:hover{border-color:var(--brand)}
.chip.on{background:var(--group);color:#fff;border-color:var(--group);font-weight:700}
.chip.taken{opacity:.4}
.chip.taken.on{opacity:1}

.grpcard{border:1px solid var(--line);border-radius:var(--r);padding:10px;margin-bottom:10px;background:var(--panel2)}
.grpcard .ghead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.grpcard .ghead input.gname{font-weight:700;min-width:180px}
.memlist{font-size:13.5px;color:var(--muted);margin-top:4px}
.group-assess{border-top:1px dashed var(--line);padding-top:8px;margin-top:8px}
.present-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px}
.presenter-chip{border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:3px 9px;cursor:pointer;font-size:12.5px}
.presenter-chip.on{background:var(--group);border-color:var(--group);color:#fff;font-weight:700}
.present-stats{font-size:12.5px;color:var(--muted);margin-top:8px;padding-top:7px;border-top:1px dotted var(--line)}

/* ---------- โมดัล ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(8,14,24,.55);display:flex;align-items:flex-start;justify-content:center;padding:5vh 12px;z-index:140;overflow:auto}
/* หน้าต่างเต็มจอ ใช้กับงานที่ต้องเห็นรายชื่อยาว ๆ อย่างการเช็กชื่อ
   หัวกับแถวปุ่มตรึงไว้ เนื้อหาเลื่อนเองข้างใน จอเล็กจึงไม่ต้องเลื่อนทั้งหน้า */
html:has(body.modal-open){overflow:hidden}
body.modal-open{position:fixed;left:0;right:0;width:100%;overflow:hidden}
/* ฉากหลังของหน้าต่างเต็มจอไม่ต้องเลื่อน เพราะเนื้อหาเลื่อนเองอยู่แล้วข้างใน
   ต้องเป็น clip ไม่ใช่ hidden — hidden ยังนับเป็นกล่องเลื่อน เบราว์เซอร์จึงเลื่อนเองได้
   ตอนโฟกัสช่องติ๊กที่อยู่นอกจอ แล้วดันหน้าต่างเช็กชื่อลอยพ้นจอไปทั้งบาน
   clip ไม่สร้างกล่องเลื่อน จึงไม่มีทางถูกเลื่อนได้ไม่ว่าด้วยวิธีใด */
.modal-bg:has(.modal-full){overflow:clip;padding:0;align-items:stretch}
.modal.modal-full{max-width:none;width:100%;height:100%;max-height:100%;border-radius:0;
  display:flex;flex-direction:column;overflow:hidden}
/* เนื้อหาแบ่งเป็นสองส่วน ส่วนบนอยู่กับที่ ตารางรายชื่อกินพื้นที่ที่เหลือและเลื่อนเอง
   หัวตารางจึงตรึงอยู่ได้จริงขณะเลื่อนดูรายชื่อ */
.modal.modal-full > .body{flex:1;min-height:0;max-height:none;overflow:hidden;display:flex;flex-direction:column;gap:9px;padding:12px 14px}
.modal.modal-full > .body > *{flex:none;margin:0}
.modal.modal-full > .body > .tablewrap{flex:1;min-height:0;overflow:auto;max-height:none}
.modal.modal-full > header{gap:10px;flex-wrap:wrap}
.modal-acts{display:flex;gap:8px;align-items:center}
.modal-acts button{white-space:nowrap}
.att-grid thead th{position:sticky;top:0;z-index:3;background:var(--panel);box-shadow:0 2px 0 var(--line)}
.att-topline{margin:0;flex-wrap:wrap;gap:7px;align-items:center}
/* เลขที่ที่ต้องตรวจซ้ำในคาบนี้ กดแล้วเลื่อนไปที่แถวนั้น */
.need-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.need-chip{font-variant-numeric:tabular-nums;font-weight:800;padding:3px 10px;border-radius:999px}
.need-chip .hint{font-weight:600;margin-left:3px}
.att-col-btn{width:100%;padding:5px 2px;border:0;background:none;color:inherit;font:inherit;font-weight:800;
  border-radius:8px;cursor:pointer;min-height:0}
.att-col-btn:hover{background:color-mix(in srgb,currentColor 14%,transparent)}
.att-col-btn:active{transform:scale(.95)}
.modal.modal-full > header,.modal.modal-full > footer{flex:none}
.modal.modal-full .tablewrap.tall{max-height:none}
@media(max-width:900px){.modal.modal-full{height:100dvh}}
.modal{background:var(--panel);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.35);width:100%;max-width:820px;border:1px solid var(--line)}
.modal header{padding:13px 16px;border-bottom:1px solid var(--line);font-weight:700;display:flex;align-items:center;gap:8px}
.modal .body{padding:16px;max-height:66vh;overflow:auto}
.modal footer{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.modal .x{margin-left:auto;background:none;border:none;font-size:20px;line-height:1;padding:0 4px;color:var(--muted)}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#1e2732;color:#fff;padding:9px 16px;border-radius:22px;box-shadow:0 8px 24px rgba(0,0,0,.3);font-size:14px;animation:tin .2s ease}
.toast.bad{background:var(--bad)}
.toast.ok{background:var(--ok)}
.toast.warn{background:var(--warn);color:#1e2732}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* PWA: ป้ายออฟไลน์ และแถบแจ้งเวอร์ชันใหม่ */
.offline-chip{background:var(--warn);color:#1e2732;font-weight:700;font-size:12px;padding:4px 10px;border-radius:999px;align-self:center}
.sync-chip{font-size:11.5px;font-weight:700;padding:4px 11px;border-radius:999px;align-self:center;white-space:nowrap;
  border:1px solid var(--line);background:var(--panel2);color:var(--muted);min-height:0}
.sync-chip.ok{background:var(--ok-bg);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 30%,transparent)}
.sync-chip.wait{background:var(--warn-bg);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.sync-chip.bad{background:var(--bad-bg);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.sync-chip.busy{background:var(--brandSoft);color:var(--brand);border-color:color-mix(in srgb,var(--brand) 30%,transparent)}
.sync-chip.busy:after{content:'';display:inline-block;width:6px;height:6px;margin-left:6px;border-radius:50%;
  background:currentColor;animation:syncBlink 1s ease-in-out infinite;vertical-align:middle}
@keyframes syncBlink{0%,100%{opacity:.25}50%{opacity:1}}
@media(max-width:720px){.sync-chip{font-size:11px;padding:3px 9px}}
@media(prefers-reduced-motion:reduce){.sync-chip.busy:after{animation:none}}
@media print{.sync-chip{display:none!important}}
.update-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:60;display:flex;gap:10px;align-items:center;
  background:var(--panel);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.18);border-radius:999px;padding:8px 12px;font-size:14px}
body.is-offline .topbar{box-shadow:inset 0 -3px 0 var(--warn)}
@media print{.update-bar,.offline-chip{display:none!important}}
/* ปุ่มเรียงลำดับและหัวตารางที่คลิกเรียงได้ */
.sort-group{display:flex;gap:6px;flex-wrap:wrap}
/* คอนโซลผู้ดูแลระบบ: แถบกลุ่มงานแทนการ์ดเรียงยาว เลื่อนแนวนอนได้บนจอแคบ */
.console-nav{display:flex;gap:8px;overflow-x:auto;padding:0 0 4px;margin-bottom:14px;-webkit-overflow-scrolling:touch}
.console-nav::-webkit-scrollbar{height:0}
.console-tab{flex:1 1 0;min-width:170px;text-align:left;white-space:normal;padding:11px 13px;line-height:1.25;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.console-tab .ct-top{display:flex;align-items:center;gap:7px;font-weight:800;font-size:13.5px}
.console-tab .ct-ico{font-size:15px}
.console-tab .ct-hint{display:block;margin-top:3px;font-size:11.5px;color:var(--muted)}
.console-tab:hover{border-color:var(--brand)}
.console-tab.on{background:var(--brand);border-color:var(--brand);color:#fff}
.console-tab.on .ct-hint{color:rgba(255,255,255,.82)}
@media(max-width:820px){.console-tab{flex:0 0 auto;min-width:152px}}
.sort-group button.active{background:var(--brand);color:#fff;border-color:var(--brand)}
/* ปุ่มซ่อน/แสดงคะแนนแต่ละส่วน — ตารางกรอกคะแนนกว้างมากเมื่อหัวข้อเยอะ
   ครูที่กำลังกรอกเฉพาะส่วนใดส่วนหนึ่งจึงพับส่วนที่ยังไม่ใช้เก็บไว้ก่อนได้ */
.part-toggle{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:9px}
.part-toggle .pt-label{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.02em}
.part-toggle button{border:1px solid var(--line);background:var(--panel2);color:var(--muted);
  border-radius:999px;padding:5px 13px;font-size:12.5px;font-weight:700;line-height:1.3}
.part-toggle button:hover{border-color:var(--brand);color:var(--ink)}
.part-toggle button.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.part-toggle button.on:hover{color:var(--brand-ink)}
.part-toggle .pt-hidden{font-size:11.5px;font-weight:700;color:var(--warn)}
th.sortable{cursor:pointer;user-select:none;white-space:nowrap}
th.sortable:hover{color:var(--brand);text-decoration:underline}
/* วันหยุดตามปฏิทินสถานศึกษา */
.holiday-card{border-left:6px solid var(--warn)}
/* แผงสถานะการกรอกข้อมูลของภาคเรียน — ต้องเห็นชัดว่าตอนนี้ล็อกอยู่หรือเปล่า */
.lock-box{margin-top:12px;padding:11px 13px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel2)}
.lock-box.on{border-color:color-mix(in srgb,var(--bad) 45%,var(--line));background:var(--bad-bg)}
.holiday-card .hero-sub{color:var(--warn);font-weight:700;letter-spacing:.06em}

.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.stat .v{font-size:22px;font-weight:700}
.stat .k{font-size:12.5px;color:var(--muted)}

.bar{height:9px;border-radius:5px;background:var(--line2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brand)}

/* เอกสารราชการ: ใบลา / บันทึกขอแลกคาบ */
.doc-sheet{background:#fff;color:#000;padding:18mm 16mm;max-width:210mm;margin:0 auto;font-size:15px;line-height:1.9}
.doc-sheet .doc-logo{display:block;width:70px;margin:0 auto 6px}
.doc-sheet h2{text-align:center;font-size:19px;margin:0 0 4px}
.doc-sheet .doc-head{text-align:center;margin-bottom:14px}
.doc-sheet .doc-line{margin:6px 0}
.doc-sheet .doc-indent{text-indent:2.5cm}
.doc-sheet .doc-table{width:100%;border-collapse:collapse;margin:10px 0}
.doc-sheet .doc-table th,.doc-sheet .doc-table td{border:1px solid #000;padding:5px 7px;font-size:13.5px}
.doc-sheet .doc-table th{background:#eee;text-align:center}
.doc-sheet .doc-sign{display:flex;flex-wrap:wrap;gap:18px;margin-top:22px}
.doc-sheet .doc-sign>div{flex:1 1 45%;text-align:center;line-height:2.2}
.doc-sheet .doc-approve{border:1px solid #000;padding:10px 14px;margin-top:16px}
/* แบบฟอร์มราชการตามต้นฉบับโรงเรียน */
.form-sheet{font-size:14.5px;line-height:2.05}
.form-sheet h2{font-size:20px}
.doc-fill{display:inline-block;border-bottom:1px dotted #000;padding:0 4px;text-align:center;line-height:1.4}
/* บรรทัดที่มีช่องเติมหลายช่อง เดิมกะความกว้างเป็นพิกเซล พอชื่อครูยาวก็ล้นไปขึ้นบรรทัดใหม่
   จึงเปลี่ยนเป็นให้ช่องเติมยืดแบ่งพื้นที่ที่เหลือกันเอง บรรทัดจะพอดีหน้ากระดาษเสมอ */
.form-sheet .doc-flow{display:flex;align-items:baseline;flex-wrap:nowrap;gap:5px;white-space:nowrap}
.form-sheet .doc-flow>.doc-fill{flex:1 1 0;min-width:14px}
.form-sheet .doc-flow>.nw{flex:0 0 auto}
.form-sheet .doc-flow.doc-indent{text-indent:0;padding-left:2.5cm}
.doc-tick{margin-right:26px;white-space:nowrap}
.dotted-line{border-bottom:1px dotted #000;min-height:1.7em;margin:2px 0}
.form-bottom{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:16px;font-size:13px;line-height:1.9}
.stat-table{border-collapse:collapse;width:100%;margin-top:6px;font-size:12px;text-align:center}
.stat-table th,.stat-table td{border:1px solid #000;padding:3px 4px}
.stat-table td.lt{text-align:left}
.memo-head{--emblem:62px;display:flex;align-items:center;gap:14px;margin-bottom:10px}
.memo-head img{flex:0 0 var(--emblem);width:var(--emblem);height:auto}
.memo-head h2{flex:1;text-align:center;margin:0;font-size:24px}
.memo-head::after{content:'';flex:0 0 var(--emblem)}
.memo-table{border-collapse:collapse;width:100%;margin:10px 0;font-size:11.5px;text-align:center}
/* กฎรวม th,td ของทั้งแอปตั้ง text-align:left ไว้ ซึ่งชนะการสืบทอด center จาก .memo-table
   ตารางในเอกสารราชการเลยชิดซ้ายทั้งใบทั้งที่ตั้งใจให้อยู่กึ่งกลาง จึงต้องระบุตรงนี้ */
.memo-table th,.memo-table td{border:1px solid #000;padding:3px 4px;height:26px;text-align:center;vertical-align:middle}
.memo-table td.lt{text-align:left}
.memo-table .memo-sub{font-size:9.5px;line-height:1.3;color:#333}
/* คำขอเยอะ ๆ ตารางจะยาวเกินหนึ่งหน้า จึงบีบขนาดอัตโนมัติให้ยังลงแผ่นเดียว */
.memo-dense .memo-table{font-size:10.5px}
.memo-dense .memo-table th,.memo-dense .memo-table td{padding:2px 3px;height:20px}
/* ตัวเลือกด้านบนหน้าต่างพรีวิวเอกสาร */
.doc-opt{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;margin-bottom:4px}
.doc-opt input{transform:scale(1.15)}
.memo-opinion{border-collapse:collapse;width:100%;margin-top:14px;font-size:12.5px}
.memo-opinion td{border:1px solid #000;padding:8px 10px;vertical-align:top;width:50%}
/* ---- ใบคะแนน 4 ส่วน ---- */
.score-sheet .ss-head{display:flex;align-items:center;gap:14px;margin:10px 0 12px}
.score-sheet .ss-logo{height:62px;width:auto}
.score-sheet .ss-school{font-size:17px;font-weight:800;line-height:1.2}
.score-sheet .ss-title{font-size:15px;font-weight:700;margin-top:2px}
.score-sheet .ss-meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.score-sheet .ss-table{width:100%;border-collapse:collapse;font-size:13px}
.score-sheet .ss-table th,.score-sheet .ss-table td{border:1px solid var(--line);padding:5px 7px}
.score-sheet .ss-table thead th{background:var(--panel2);font-size:12px;line-height:1.25;vertical-align:bottom}
.score-sheet .ss-full{display:block;font-size:10.5px;font-weight:600;color:var(--muted)}
.score-sheet .ss-table td.num{font-variant-numeric:tabular-nums}
.score-sheet .ss-grade{font-weight:800}
.score-sheet .ss-foot{margin-top:12px}
.score-sheet .ss-dist{font-size:12.5px;padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel2)}
.score-sheet .ss-signs{display:flex;gap:26px;margin-top:26px;text-align:center;font-size:12.5px}
.score-sheet .ss-sign{flex:1}
.score-sheet .ss-line{border-bottom:1px dotted var(--ink);margin:0 6px 6px}
.score-sheet .ss-sign span{color:var(--muted)}
/* โหมดใบคะแนน — ใช้ทั้งตอนดูตัวอย่างบนจอและตอนพิมพ์จริง กฎชุดเดียวกัน
   จึงไม่มีทางที่ตัวอย่างกับของที่พิมพ์ออกมาจะไม่ตรงกัน
   บังคับเป็นตัวดำบนพื้นขาวเสมอ ไม่ว่าครูจะเปิดโหมดมืดอยู่หรือไม่ */
body.print-scores main>section:not(#pane-summary),
body.print-scores #pane-summary>.card:not(.score-sheet),
body.print-scores .score-sheet .noprint{display:none!important}
body.print-scores #pane-summary{display:block!important}
body.print-scores .score-sheet{--ink:#111;--muted:#555;--line:#8a8a8a;--panel:#fff;--panel2:#f1f1f1;
  background:#fff;color:#111;border:0;box-shadow:none}
body.print-scores .score-sheet .tablewrap{border:0;overflow:visible;max-height:none}
body.print-scores .ss-table th,body.print-scores .ss-table td{border:1px solid #666}
body.print-scores .ss-dist{border:1px solid #666;background:transparent}
/* แถบเครื่องมือตอนดูตัวอย่าง วางบนกระดาษจำลองขนาด A4 */
body.print-scores.print-preview{background:#6b7280}
body.print-scores.print-preview .score-sheet{max-width:820px;margin:18px auto 96px;padding:34px 30px;
  box-shadow:0 10px 40px rgba(0,0,0,.35)}
.preview-bar{position:fixed;left:0;right:0;bottom:0;z-index:150;display:flex;gap:9px;align-items:center;
  justify-content:center;padding:11px 14px;background:var(--panel);border-top:1px solid var(--line);
  box-shadow:0 -6px 24px rgba(0,0,0,.16)}
.preview-bar .hint{margin-right:6px}
@media print{
  /* หัวตารางซ้ำทุกหน้า แถวไม่ขาดกลางหน้า และไม่ต้องมีกระดาษจำลอง */
  body.print-scores .score-sheet{padding:0;margin:0;max-width:none;box-shadow:none}
  body.print-scores.print-preview{background:#fff}
  body.print-scores .ss-table{font-size:10.5px}
  body.print-scores .ss-table th,body.print-scores .ss-table td{padding:2.5px 4px}
  body.print-scores .ss-table thead{display:table-header-group}
  body.print-scores .ss-table tr{break-inside:avoid;page-break-inside:avoid}
  body.print-scores .ss-signs{break-inside:avoid;page-break-inside:avoid}
  .preview-bar{display:none!important}
  .printonly{display:block!important}
  body.print-doc>*:not(#docSheet){display:none!important}
  body.print-doc #docSheet{display:block!important;padding:0;max-width:none}
  body.print-doc .doc-sheet{page:docSheet;padding:0;max-width:none;font-size:12px}
  /* แบบฟอร์มราชการต้องพอดี A4 หนึ่งหน้า จึงบีบระยะบรรทัดเฉพาะตอนพิมพ์ */
  body.print-doc .form-sheet{font-size:12.5px;line-height:1.62}
  body.print-doc .form-sheet h2{font-size:17px;margin-bottom:6px}
  body.print-doc .form-bottom{font-size:10.5px;line-height:1.5;gap:12px;margin-top:8px}
  body.print-doc .stat-table{font-size:9.5px}
  body.print-doc .stat-table th,body.print-doc .stat-table td{padding:1px 2px}
  body.print-doc .memo-table{font-size:9.5px}
  body.print-doc .memo-table .memo-sub{font-size:8px}
  body.print-doc .memo-table th,body.print-doc .memo-table td{padding:2px 3px;height:22px}
  body.print-doc .memo-dense .memo-table{font-size:8.5px}
  body.print-doc .memo-dense .memo-table th,body.print-doc .memo-dense .memo-table td{padding:1px 2px;height:16px}
  body.print-doc .memo-dense.form-sheet{line-height:1.45}
  body.print-doc .memo-opinion{font-size:11px}
  body.print-doc .memo-head h2{font-size:20px}
  body.print-doc .memo-head{--emblem:1.83cm}
  body.print-doc .dotted-line{min-height:1.4em}
  @page docSheet{size:A4 portrait;margin:15mm}
  .stickytop,.topbar,.tabs,.noprint{display:none !important}
  body{background:#fff;font-size:12px}
  .card{box-shadow:none;border:none;padding:0}
  .tablewrap{max-height:none;border:1px solid #999}
  th,td{border-bottom:1px solid #bbb !important}
  section.tabpane{display:none}
  section.tabpane.active{display:block}
  .cover5{border:2px solid #000;padding:14px;page-break-inside:avoid}
  .cover-table th,.cover-table td{border:1px solid #000 !important}
  body.print-schedule main>section:not(#pane-schedule),body.print-schedule #pane-schedule>.card:not(.schedule-sheet){display:none!important}
  body.print-schedule #pane-schedule{display:block!important}
  body.print-schedule .schedule-sheet{page:scheduleSheet;border:0;padding:0;margin:0;break-inside:avoid;page-break-inside:avoid}
  body.print-schedule .schedule-sheet .tablewrap{border:0;overflow:visible}
  body.print-schedule .timetable{min-width:0;width:100%;font-size:8px;table-layout:fixed}
  body.print-schedule .timetable .slot-info,body.print-schedule .timetable thead th:first-child{width:48px}
  body.print-schedule .tt-cell{min-height:42px;padding:2px;border:0}
  body.print-schedule .tt-edit{display:none}
  body.print-schedule .tt-name{font-size:6.6px;line-height:1.02;max-height:none;padding-right:0;overflow-wrap:anywhere}
  body.print-schedule .tt-code{font-size:7.5px}.tt-room{font-size:6.5px}
  body.print-cover main>section:not(#pane-summary),body.print-cover #pane-summary>.card:not(.cover5){display:none!important}
  body.print-cover #pane-summary{display:block!important}
  body.print-cover .cover5{page:coverSheet;margin:0;border:1.5px solid #000;padding:7mm;font-size:10px;break-inside:avoid;page-break-inside:avoid}
  body.print-cover .cover-title{margin-bottom:8px}.cover5 .cover-title h2{font-size:16px}
  body.print-cover .cover-meta{gap:3px 18px;margin:8px 0 10px}
  body.print-cover .cover-table th,body.print-cover .cover-table td{padding:4px 5px}
  body.print-cover .cover-assess{gap:8px;margin-top:8px}
  body.print-cover .cover-approvals{gap:5px 18px;margin-top:8px}
}
@page scheduleSheet{size:A4 landscape;margin:7mm}
@page coverSheet{size:A4 portrait;margin:7mm}
</style>
</head>

<script>
"use strict";
/* ============================================================================
   0) UTIL — ตัวช่วยทั่วไป
   ========================================================================== */
const MAX_STUDENTS = 40;
const PUBLIC_GOOGLE_CLIENT_ID = (window.GRADEBOOK_CONFIG && window.GRADEBOOK_CONFIG.googleClientId) || '';
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const uid = p => (p || 'id') + '_' + Math.random().toString(36).slice(2, 9);
const esc = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const has = v => v !== undefined && v !== null && v !== '' && !Number.isNaN(v);
/** ปัดเศษครึ่งขึ้น (0.5 -> 1) แบบกันความคลาดเคลื่อนทศนิยม */
const rnd = x => Math.round(x + 1e-9);
/** ตัดทศนิยมส่วนเกินให้อ่านง่าย 12.500 -> 12.5 */
const fmt = (x, d) => {
  if (!isFinite(x)) return '–';
  const s = Number(x).toFixed(d === undefined ? 2 : d);
  return s.replace(/\.?0+$/, '') || '0';
};

const pad2 = n => String(n).padStart(2, '0');
const todayISO = () => {
  const d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
};
const parseISODate = s => {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s || ''));
  return m ? new Date(+m[1], +m[2] - 1, +m[3], 12, 0, 0, 0) : null;
};
const isoDate = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const thaiDate = s => {
  const d = parseISODate(s);
  return d ? d.toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' }) : '–';
};
const timeToMinutes = s => {
  const m = /^(\d{1,2}):(\d{2})$/.exec(String(s || ''));
  return m ? (+m[1] * 60 + +m[2]) : 0;
};
const minutesToTime = m => pad2(Math.floor((m % 1440) / 60)) + ':' + pad2(m % 60);
function defaultTimetableSlots(start, duration) {
  const slots = [{ id: 'assembly', label: 'เข้าแถวเช้า', start: '08:00', end: '08:30' }];
  let at = timeToMinutes(start || '08:30'), len = Math.max(1, num(duration) || 55);
  for (let i = 1; i <= 9; i++) {
    slots.push({ id: String(i), label: 'คาบ ' + i, start: minutesToTime(at), end: minutesToTime(at + len) });
    at += len;
  }
  return slots;
}
function defaultTimetable() {
  return { slots: defaultTimetableSlots('08:30', 55), entries: [], exceptions: [], exchangeRequests: [], leaveRequests: [], terms: {}, attendance: {}, startTime: '08:30', duration: 55 };
}

function toast(msg, kind) {

function download(blob, filename) {

/** เปิดกล่องเลือกไฟล์ คืนค่า File หรือ null */
function pickFile(accept) {

    inp.type = 'file'; inp.accept = accept || '';
