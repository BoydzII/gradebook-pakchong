        '<div class="portal-metrics"><div class="portal-metric"><b>' + (a.counts.present + a.counts.late) + '</b>มา/สาย</div><div class="portal-metric"><b>' + a.counts.absent + '</b>ขาด</div><div class="portal-metric"><b>' + a.counts.leave + '</b>ลา</div><div class="portal-metric"><b>' + a.counts.activity + '</b>กิจกรรม</div></div>' +
        '<div class="row" style="margin-top:12px"><span>เวลาเรียน ' + a.checked + ' คาบ</span><div class="spacer"></div>' + attendanceOutcomeBadge(a.pct) + '</div>' +
        '<div class="tablewrap" style="margin-top:10px"><table><thead><tr><th>ก่อนกลาง</th><th>กลางภาค</th><th>หลังกลาง</th><th>ปลายภาค</th><th>รวม</th></tr></thead><tbody><tr><td>' + fmt(r.wBefore) + '</td><td>' + fmt(r.wM) + '</td><td>' + fmt(r.wAfter) + '</td><td>' + fmt(r.wF) + '</td><td><b>' + fmt(r.total) + '</b></td></tr></tbody></table></div></div>';
    }).join('') + '</div>' : '<div class="card"><div class="empty">ยังไม่พบสมุดคะแนนหรือตารางเรียนที่เชื่อมกับนักเรียนในภาคเรียนนี้</div></div>') +
    '<div class="portal-login-note" style="margin-top:16px">ข้อมูลแต่ละวิชาแยกตามห้อง วิชา ปี/ภาค และครูผู้สอน จึงรองรับนักเรียนหนึ่งคนเรียนหลายวิชาและมีครูหลายคนได้ภายในฐานข้อมูลกลางเดียวกัน</div></div>';
  $('#portalPeriod').addEventListener('change', e => { studentSession.periodId = e.target.value; renderStudentPortal(); });
  $('#portalPassword').addEventListener('click', openStudentChangePassword);
  $('#portalLogout').addEventListener('click', closeStudentPortal);
}

function openStudentChangePassword() {
  if (!studentSession) return;
  openModal({ title: 'เปลี่ยนรหัสผ่านนักเรียน', bodyHTML:
    '<div class="pick"><label>รหัสผ่านปัจจุบัน</label><input type="password" id="studentOldPassword" autocomplete="current-password" style="width:100%"></div>' +
    '<div class="grid2" style="margin-top:10px"><div class="pick"><label>รหัสผ่านใหม่ (อย่างน้อย 4 ตัว)</label><input type="password" id="studentNewPassword" autocomplete="new-password"></div><div class="pick"><label>ยืนยันรหัสผ่านใหม่</label><input type="password" id="studentConfirmPassword" autocomplete="new-password"></div></div>',
    buttons: [{ label: 'ยกเลิก' }, { label: 'บันทึกรหัสใหม่', cls: 'primary', async act(close, root) {
      const sid = studentSession.sid, oldPass = $('#studentOldPassword', root).value, next = $('#studentNewPassword', root).value, confirm = $('#studentConfirmPassword', root).value;
      const account = DB.studentAccounts[sid], oldOK = account && account.passwordHash ? await passwordDigest(oldPass) === account.passwordHash : oldPass === '1234';
      if (!oldOK) return toast('รหัสผ่านปัจจุบันไม่ถูกต้อง', 'bad');
      if (next.length < 4) return toast('รหัสผ่านใหม่ต้องมีอย่างน้อย 4 ตัว', 'bad');
      if (next !== confirm) return toast('ยืนยันรหัสผ่านใหม่ไม่ตรงกัน', 'bad');
      DB.studentAccounts[sid] = { passwordHash: await passwordDigest(next), changedAt: new Date().toISOString() };
      save(true); close(); toast('เปลี่ยนรหัสผ่านเรียบร้อย', 'ok');
    } }]
  });
}

function openStudentLogin() {
  openModal({ title: 'นักเรียนเข้าสู่ระบบ', bodyHTML:
    '<div class="portal-login-note" style="margin-bottom:12px">ใช้เลขประจำตัวนักเรียนเป็น Username และรหัสเริ่มต้น <b>1234</b> เมื่อเข้าสู่ระบบแล้วควรเปลี่ยนรหัสทันที</div>' +
    '<div class="pick"><label>เลขประจำตัวนักเรียน / Username</label><input id="studentLoginUser" autocomplete="username" style="width:100%" placeholder="กรอกเลขประจำตัว"></div>' +
    '<div class="pick" style="margin-top:10px"><label>รหัสผ่าน</label><input type="password" id="studentLoginPassword" autocomplete="current-password" style="width:100%" placeholder="กรอกรหัสผ่าน"></div>',
    buttons: [{ label: 'ยกเลิก' }, { label: 'เข้าสู่ระบบ', cls: 'primary', async act(close, root) {
      const sid = $('#studentLoginUser', root).value.trim(), pass = $('#studentLoginPassword', root).value;
      if (!sid || !pass) return toast('กรุณากรอก Username และรหัสผ่าน', 'bad');
      if (!studentMatches(sid).length) return toast('ไม่พบเลขประจำตัวนักเรียนในฐานข้อมูล', 'bad');
      const account = DB.studentAccounts[sid], valid = account && account.passwordHash ? await passwordDigest(pass) === account.passwordHash : pass === '1234';
      if (!valid) return toast('Username หรือรหัสผ่านไม่ถูกต้อง', 'bad');
      studentSession = { sid: sid, periodId: DB.ui.periodId }; close(); hideRoleGateway(); renderStudentPortal();
    } }],
    onMount(root) { $('#studentLoginUser', root).focus(); }
  });
}

/* ============================================================================
   15) ติดตั้งเป็นแอป (PWA) — คอม มือถือ ไอแพด
   ========================================================================== */
let deferredInstallPrompt = null;

const isStandaloneApp = () => window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
const isIOSDevice = () => /iphone|ipad|ipod/i.test(navigator.userAgent) ||
  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);   // iPadOS รายงานตัวเป็น Mac

function updateInstallButton() {
  const btn = $('#btnInstall'); if (!btn) return;
  btn.hidden = isStandaloneApp() || (!deferredInstallPrompt && !isIOSDevice());
}

/** ขั้นตอนติดตั้งของ iOS ที่ต้องทำเอง เพราะ Safari ไม่มีปุ่มติดตั้งอัตโนมัติ */
function showIOSInstallHelp() {
  openModal({ title: 'ติดตั้งแอปบนไอแพด / ไอโฟน',
    bodyHTML: '<div class="notice">Safari ไม่มีปุ่มติดตั้งอัตโนมัติ ต้องเพิ่มเองด้วย 3 ขั้นตอน</div>' +
      '<ol style="margin:12px 0 0 18px;line-height:2">' +
      '<li>กดปุ่ม <b>แชร์</b> (รูปสี่เหลี่ยมมีลูกศรขึ้น) ที่แถบล่างหรือมุมขวาบนของ Safari</li>' +
      '<li>เลื่อนหาแล้วกด <b>เพิ่มไปยังหน้าจอโฮม</b> (Add to Home Screen)</li>' +
      '<li>กด <b>เพิ่ม</b> มุมขวาบน จะได้ไอคอน “KruSpace” บนหน้าจอ</li></ol>' +
      '<div class="hint" style="margin-top:12px">ต้องเปิดด้วย Safari เท่านั้น ถ้าเปิดจาก Chrome บน iOS จะไม่มีเมนูนี้</div>' });
}

async function installApp() {
  if (isIOSDevice() && !deferredInstallPrompt) return showIOSInstallHelp();
  if (!deferredInstallPrompt) return toast('เบราว์เซอร์นี้ยังไม่พร้อมติดตั้ง ลองเปิดด้วย Chrome หรือ Edge', 'bad');
  deferredInstallPrompt.prompt();
  const choice = await deferredInstallPrompt.userChoice.catch(() => null);
  deferredInstallPrompt = null; updateInstallButton();
  if (choice && choice.outcome === 'accepted') toast('ติดตั้งแอปแล้ว เปิดใช้จากไอคอนได้เลย', 'ok');
}

window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstallPrompt = e; updateInstallButton(); });
window.addEventListener('appinstalled', () => { deferredInstallPrompt = null; updateInstallButton(); toast('ติดตั้งแอปเรียบร้อย', 'ok'); });

/* ---------- ตรวจหาเวอร์ชันใหม่เอง ------------------------------------------
   เมื่อติดตั้งเป็นแอป จะไม่มีปุ่มรีเฟรชของเบราว์เซอร์ให้กด ถ้า service worker
   ยังไม่ทันเจอไฟล์ใหม่ ผู้ใช้จะติดอยู่กับเวอร์ชันเก่าโดยไม่มีทางออก
   ปุ่มนี้บังคับตรวจ ถ้ามีเวอร์ชันใหม่รออยู่ก็ข้ามคิวให้เลย ถ้าไม่มีก็ล้างแคชแล้วโหลดใหม่ */
let appVersionText = '';
function askAppVersion() {
  if (!('serviceWorker' in navigator) || !navigator.serviceWorker.controller) return;
  navigator.serviceWorker.controller.postMessage('get-version');
}
if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', e => {
  const d = e.data || {};
  if (d.type === 'version' && d.version) { appVersionText = d.version; renderAppVersionChips(); }
});
function renderAppVersionChips() {
  $$('[data-app-version]').forEach(el => { el.textContent = appVersionText ? 'เวอร์ชัน ' + appVersionText : ''; });
}

async function forceAppRefresh(btn) {
  if (btn) { btn.disabled = true; btn.textContent = 'กำลังตรวจ...'; }
  let updated = false;
  try {
    const reg = 'serviceWorker' in navigator ? await navigator.serviceWorker.getRegistration() : null;
    if (reg) {
      await reg.update();
      const waiting = reg.waiting || reg.installing;
      if (waiting) {
        // มีเวอร์ชันใหม่รออยู่แล้ว ข้ามคิวให้ทันที
        if (reg.waiting) reg.waiting.postMessage('skip-waiting');
        else await new Promise(r => { waiting.addEventListener('statechange', function h() {
          if (waiting.state === 'installed') { reg.waiting && reg.waiting.postMessage('skip-waiting'); waiting.removeEventListener('statechange', h); r(); }
        }); setTimeout(r, 4000); });
        updated = true;
      }
    }
    // ไม่มีเวอร์ชันใหม่รออยู่ ล้างแคชของแอปแล้วโหลดใหม่ให้แน่ใจ
    // ทำเฉพาะตอนออนไลน์ ไม่งั้นจะเหลือแต่หน้าเปล่าเพราะไม่มีไฟล์ในเครื่องแล้ว
    if (!updated && navigator.onLine && window.caches) {
      const keys = await caches.keys();
      await Promise.all(keys.filter(k => k.indexOf('gradebook-') === 0).map(k => caches.delete(k)));
    }
  } catch (e) { /* ตรวจไม่ได้ก็ยังโหลดหน้าใหม่ได้ */ }
  if (!navigator.onLine) {
    if (btn) { btn.disabled = false; btn.textContent = 'ตรวจหาเวอร์ชันใหม่'; }
    return toast('ออฟไลน์อยู่ ต้องต่อเน็ตก่อนจึงจะดึงเวอร์ชันใหม่ได้', 'bad');
  }
  location.reload();
}

/** แจ้งเมื่อมีเวอร์ชันใหม่รออยู่ ให้ผู้ใช้เลือกเวลาที่จะอัปเดตเอง */
function showUpdateBar(worker) {
  if ($('#updateBar')) return;
  const bar = document.createElement('div');
  bar.id = 'updateBar'; bar.className = 'update-bar';
  bar.innerHTML = '<span>มีเวอร์ชันใหม่ของระบบพร้อมใช้งาน</span><button class="sm primary" id="updateNow">อัปเดตตอนนี้</button><button class="sm" id="updateLater">ไว้ก่อน</button>';
  document.body.appendChild(bar);
  $('#updateNow', bar).addEventListener('click', () => { worker.postMessage('skip-waiting'); location.reload(); });
  $('#updateLater', bar).addEventListener('click', () => bar.remove());
}

if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then(reg => {
      if (reg.waiting) showUpdateBar(reg.waiting);
      askAppVersion(); setTimeout(askAppVersion, 1200);
      reg.addEventListener('updatefound', () => {
        const sw = reg.installing; if (!sw) return;
        sw.addEventListener('statechange', () => {
          if (sw.state === 'installed' && navigator.serviceWorker.controller) showUpdateBar(sw);
        });
      });
    }).catch(() => { /* เปิดจากไฟล์ในเครื่องหรือไม่ใช่ https ก็ใช้งานได้ตามปกติ เพียงแต่ไม่มีโหมดออฟไลน์ */ });
  });
}

/* แจ้งสถานะเน็ต เพื่อให้รู้ว่าที่ทำอยู่จะยังไม่ถูกซิงก์ขึ้น Google */
function renderOnlineState() {
  document.body.classList.toggle('is-offline', !navigator.onLine);
  const chip = $('#offlineChip');
  if (chip) chip.hidden = navigator.onLine;
}
window.addEventListener('online', () => { renderOnlineState(); toast('กลับมาออนไลน์แล้ว', 'ok'); });
window.addEventListener('offline', () => { renderOnlineState(); toast('ออฟไลน์ • ยังบันทึกลงเครื่องได้ตามปกติ', 'warn'); });

$('#btnInstall').addEventListener('click', installApp);
updateInstallButton();

if (syncChipEl) syncChipEl.addEventListener('click', () => { if (unsyncedBookCount()) runBookSync(); else toast('ส่งขึ้นส่วนกลางครบแล้ว', 'ok'); });
renderSyncChip();
renderOnlineState();
</script>
