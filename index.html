  });
  const levelNames = Object.keys(levels).sort((a, b) => levelSortKey(a) - levelSortKey(b) || a.localeCompare(b, 'th'));

    '<div class="metric-card" style="--metric:var(--bad)"><div class="metric-value">' + streaks.length + '</div><div class="metric-label">ขาดติดต่อกันเกิน ' + minDays + ' วัน</div></div>' +
    '<div class="metric-card" style="--metric:var(--warn)"><div class="metric-value">' + short.length + '</div><div class="metric-label">ห้องปกติที่นักเรียนไม่ครบ</div></div></div>';

  const streakCard = '<div class="card"><div class="exec-head"><div><div class="exec-eyebrow">EARLY WARNING</div><h3>นักเรียนขาดเรียนติดต่อกัน</h3></div><div class="spacer"></div>' +
    '<label class="exec-eyebrow" for="execStreakDays">เกณฑ์</label><select id="execStreakDays">' +
    [3, 5, 7, 10].map(d => '<option value="' + d + '"' + (d === minDays ? ' selected' : '') + '>เกินกว่า ' + d + ' วัน</option>').join('') + '</select>' +
    '<span class="badge ' + (streaks.length ? 'bad' : 'ok') + '">' + streaks.length + ' คน</span></div>' +
    '<div class="exec-note">นับเฉพาะวันที่มีการเช็กชื่อและนักเรียนขาดทุกคาบของวันนั้น วันที่ไม่มีคาบเรียนจะไม่ตัดช่วงการขาดติดต่อกัน</div>' +
    (streaks.length ? '<div class="streak-list">' + streaks.slice(0, 80).map(x => {
      const homeroom = homeroomTeacherName(x.classId);
      return '<div class="streak-item" style="--sev:' + streakSeverity(x.days) + '">' +
        '<div class="streak-days"><b>' + x.days + '</b><small>วันติดกัน</small></div>' +
        '<div><b>' + esc(x.name) + '</b><div class="hint">' + esc(x.className || 'ยังไม่ระบุห้อง') + (x.no ? ' • เลขที่ ' + esc(x.no) : '') +

        '<div class="spacer"></div>' + (x.rate == null ? '' : '<span class="badge ' + (x.rate < 60 ? 'bad' : x.rate < 80 ? 'warn' : '') + '">เข้าเรียนรวม ' + fmt(x.rate, 1) + '%</span>') +

    }).join('') + '</div>' + (streaks.length > 80 ? '<div class="hint" style="margin-top:8px">แสดง 80 รายแรกจากทั้งหมด ' + streaks.length + ' ราย</div>' : '')

  const capRow = a => {
    const pct = a.target ? Math.min(100, a.count * 100 / a.target) : 0;

      '<td><div class="cap-bar' + (a.diff > 0 ? ' over' : '') + '" style="--capc:' + color + '"><i style="width:' + fmt(pct, 0) + '%"></i></div></td>' +

    (subRooms.length ? '<details class="exec-more"><summary>ห้องเรียนย่อย ' + subRooms.length + ' ห้อง (นับรวมอยู่ในห้องหลักแล้ว)</summary><div class="tablewrap"><table><thead><tr><th>ห้องย่อย</th><th>สังกัดห้อง</th><th class="numcell">รายชื่อในกลุ่ม</th></tr></thead><tbody>' +

      '</tbody></table></div></details>' : '') +
    (special.length ? '<details class="exec-more"><summary>ห้องเรียนพิเศษและห้องนอกผัง ' + special.length + ' ห้อง (ไม่เทียบเกณฑ์)</summary><div class="tablewrap"><table><thead><tr><th>ห้อง</th><th>ระดับชั้น</th><th>ประเภท</th><th class="numcell">นักเรียน</th><th>ครูที่ปรึกษา</th></tr></thead><tbody>' +

      '</tbody></table></div></details>' : '') + '</div>';

  const rosterCard = '<div class="card"><div class="exec-head"><div><div class="exec-eyebrow">STUDENT ROSTER</div><h3>ข้อมูลนักเรียนทั้งหมด</h3></div><div class="spacer"></div>' +
    '<span class="badge">' + rows.length + ' คน • ' + roomsTotal + ' ห้อง</span></div>' +
    (levelNames.length ? '<div class="roster-grid">' + levelNames.map(name => {
      const L = levels[name], avg = L.rooms.size ? L.total / L.rooms.size : 0, unknown = L.total - L.male - L.female;
      return '<div class="roster-card"><div class="roster-level">' + esc(name) + '</div>' +
        '<div class="roster-count">' + L.total + '<small>คน</small></div>' +
        '<div class="roster-meta">' + L.rooms.size + ' ห้อง • เฉลี่ย ' + fmt(avg, 1) + ' คน/ห้อง</div>' +
        '<div class="roster-split"><span>ชาย ' + L.male + '</span><span>หญิง ' + L.female + '</span>' + (unknown ? '<span>ไม่ระบุ ' + unknown + '</span>' : '') + '</div></div>';
    }).join('') + '</div>' : '<div class="empty">ยังไม่มีรายชื่อนักเรียนในระบบ</div>') +
    '<div class="exec-toolbar"><input id="execStudentQ" type="search" placeholder="ค้นหาชื่อ เลขประจำตัว หรือห้อง" value="' + esc(DB.ui.execStudentQ || '') + '">' +
    '<select id="execStudentLevel"><option value="">ทุกระดับชั้น</option>' + levelNames.map(n => '<option value="' + esc(n) + '"' + (DB.ui.execStudentLevel === n ? ' selected' : '') + '>' + esc(n) + '</option>').join('') + '</select>' +
    '<div class="spacer"></div><button class="sm" id="execStudentCsv">ส่งออก CSV</button></div>' +
    '<div id="execStudentBox"></div></div>';

  return metrics + streakCard + capacityCard + rosterCard;
}

/** ตารางรายชื่อนักเรียน เรนเดอร์แยกเพื่อให้ค้นหาแล้วช่องพิมพ์ไม่เสียโฟกัส */
function execStudentFiltered() {
  const q = String(DB.ui.execStudentQ || '').trim().toLowerCase(), level = DB.ui.execStudentLevel || '';
  return schoolRosterRows().filter(r => (!level || r.level === level) &&
    (!q || (r.name + ' ' + r.sid + ' ' + r.className + ' ' + r.no).toLowerCase().includes(q)))
    .sort((a, b) => levelSortKey(a.level) - levelSortKey(b.level) || a.room - b.room ||
      String(a.className).localeCompare(String(b.className), 'th') || num(a.no) - num(b.no));
}

/* ---- ผลการเรียนคงค้าง (0 / ร / มส / มผ) ----------------------------------
   เมื่อครูตัดสินผลการเรียนแล้ว รายชื่อนักเรียนที่ไม่ผ่านจะถูกบันทึกไว้เป็นรายการติดตาม
   รายการจะค้างข้ามภาคเรียนและข้ามปีการศึกษาไปเรื่อย ๆ จนกว่าครูจะกรอกว่าผ่านแล้ว
   หรือกดว่านักเรียนพ้นสภาพ */
const PENDING_REASONS = [
  { value: '0', label: '0', desc: 'คะแนนไม่ถึงเกณฑ์' },
  { value: 'ร', label: 'ร', desc: 'ประเมินไม่ครบ มีงานค้างส่ง' },
  { value: 'มส', label: 'มส', desc: 'เวลาเรียนไม่ถึงเกณฑ์' },
  { value: 'มผ', label: 'มผ', desc: 'ไม่ผ่านกิจกรรมหรือคุณลักษณะ' }
];
const PENDING_STATUS_LABEL = { pending: 'ยังไม่ผ่าน', passed: 'แก้ผ่านแล้ว', dropped: 'พ้นสภาพ' };
const pendingReasonDesc = v => (PENDING_REASONS.find(r => r.value === v) || {}).desc || '';

const semesterRank = sem => String(sem) === '1' ? 1 : String(sem) === '2' ? 2 : 3;
const periodCmp = (a, b) => num(a.academicYear) - num(b.academicYear) || semesterRank(a.semester) - semesterRank(b.semester);
function periodsSorted() { return (DB.periods || []).slice().sort(periodCmp); }
function periodIndexOf(pid) { return periodsSorted().findIndex(p => p.id === pid); }
function periodText(pid) { const p = (DB.periods || []).find(x => x.id === pid); return p ? 'ปี ' + p.academicYear + ' ภาค ' + p.semester : 'ไม่ทราบภาคเรียน'; }
/** ค้างมาแล้วกี่ภาคเรียน นับจากภาคที่ติดถึงภาคที่เลือกอยู่ */
function pendingCarryTerms(r) {
  const from = periodIndexOf(r.periodId), now = periodIndexOf(DB.ui.periodId);
  return from < 0 || now < 0 ? 0 : Math.max(0, now - from);
}

/** คู่ (ห้อง, วิชา) ที่ครูคนนี้สอนในภาคเรียนที่เลือก */
function myTeachingPairs(periodId) {
  const me = curTeacher(); if (!me) return [];
  const seen = new Set(), out = [];
  (DB.timetable.entries || []).filter(e => e.periodId === periodId && e.teacherId === me.id).forEach(e => {
    const k = e.classId + '::' + e.subjectId; if (seen.has(k)) return; seen.add(k);
    out.push({ classId: e.classId, subjectId: e.subjectId });
  });
  return out;
}

/** อ่านผลการตัดสินจากสมุดคะแนน แล้วคัดเฉพาะคนที่ไม่ผ่าน */
function scanPendingCandidates(periodId) {
  const out = [];
  myTeachingPairs(periodId).forEach(pair => {
    const cls = DB.classes.find(c => c.id === pair.classId), sub = DB.subjects.find(x => x.id === pair.subjectId);
    const raw = DB.books[pair.classId + '::' + pair.subjectId + '::' + periodId];
    if (!cls || !sub || !raw) return;
    const b = normalizeBook(raw), sts = (cls.students || []).slice().sort((a, c) => num(a.no) - num(c.no));
    summaryRows(b, sts, cls.id, sub.id).forEach(x => {
      let reason = '';
      if (x.att && x.att.isMS) reason = 'มส';
      else if (!x.r.complete) reason = 'ร';
      else if (String(x.r.grade) === '0') reason = '0';
      if (!reason) return;
      out.push({ sid: String(x.st.sid || ''), name: x.st.name || '', no: x.st.no || '', classId: cls.id, className: cls.name,
        subjectId: sub.id, subjectCode: sub.code || '', subjectName: sub.name || '', periodId: periodId, reason: reason,
        score: x.r.total, attPct: x.att ? x.att.pct : null });
    });
  });
  return out.sort((a, b) => String(a.className).localeCompare(String(b.className), 'th') || num(a.no) - num(b.no));
}

const pendingKeyOf = r => [r.sid, r.subjectId, r.periodId].join('::');

/** เพิ่มรายการที่ยังไม่มี และอัปเดตผลที่ติดของรายการเดิมที่ยังไม่ผ่าน */
function mergePendingResults(list) {
  const me = curTeacher(), byKey = new Map();
  (DB.pendingResults || []).forEach(r => byKey.set(pendingKeyOf(r), r));
  let added = 0, updated = 0;
  list.forEach(c => {
    const old = byKey.get(pendingKeyOf(c));
    if (old) {
      if (old.status !== 'pending') return;
      if (old.reason !== c.reason || old.score !== c.score) { Object.assign(old, { reason: c.reason, score: c.score, attPct: c.attPct, updatedAt: new Date().toISOString() }); updated++; }
      return;
    }
    DB.pendingResults.push(Object.assign({ id: uid('pr'), status: 'pending', resultGrade: '', note: '',
      teacherId: me ? me.id : '', teacherName: me ? (me.name || me.email || '') : '',
      createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(), resolvedAt: '', resolvedBy: '' }, c));
    added++;
  });
  if (added || updated) save(true);
  return { added: added, updated: updated };
}

/** รายการที่ครูคนนี้ต้องติดตาม — ของฉัน / ห้องที่ปรึกษา / ทั้งหมด */
function pendingForTeacher(scope) {
  const me = curTeacher(); if (!me) return [];
  const pairs = new Set(myTeachingPairs(DB.ui.periodId).map(p => p.classId + '::' + p.subjectId));
  const homeroom = me.homeroomClassId || '';
  const homeroomSids = new Set(((DB.classes.find(c => c.id === homeroom) || {}).students || []).map(x => String(x.sid || '')));
  return (DB.pendingResults || []).filter(r => {
    if (scope === 'all') return true;
    if (scope === 'homeroom') return homeroom && (r.classId === homeroom || homeroomSids.has(r.sid));
    return r.teacherId === me.id || pairs.has(r.classId + '::' + r.subjectId);
  }).sort((a, b) => (a.status === 'pending' ? 0 : 1) - (b.status === 'pending' ? 0 : 1) ||
    periodIndexOf(a.periodId) - periodIndexOf(b.periodId) ||
    String(a.className).localeCompare(String(b.className), 'th') || num(a.no) - num(b.no));
}

/** สถิติภาพรวมสำหรับผู้บริหาร: นับเป็นคน และนับเป็นรายวิชาที่ติด */
function pendingResultStats() {
  const pending = (DB.pendingResults || []).filter(r => r.status === 'pending');
  const students = new Set(pending.map(r => r.sid));
  const totalStudents = schoolRosterRows().length;
  const enrollments = totalEnrollments(DB.ui.periodId);
  const byReason = {}; PENDING_REASONS.forEach(x => byReason[x.value] = 0);
  pending.forEach(r => { if (byReason[r.reason] === undefined) byReason[r.reason] = 0; byReason[r.reason]++; });
  const byLevel = {};
  pending.forEach(r => {
    const cls = DB.classes.find(c => c.id === r.classId), lv = classLevel(cls ? cls.name : r.className) || 'ไม่ระบุระดับชั้น';
    if (!byLevel[lv]) byLevel[lv] = { subjects: 0, sids: new Set() };
    byLevel[lv].subjects++; byLevel[lv].sids.add(r.sid);
  });
  const perStudent = {};
  pending.forEach(r => { perStudent[r.sid] = (perStudent[r.sid] || 0) + 1; });
  const heavy = Object.entries(perStudent).filter(([, n]) => n >= 3).length;
  return { items: pending, count: pending.length, students: students.size, totalStudents: totalStudents,
    enrollments: enrollments, byReason: byReason, byLevel: byLevel, heavy: heavy,
    pctStudents: totalStudents ? students.size * 100 / totalStudents : null,
    pctSubjects: enrollments ? pending.length * 100 / enrollments : null,
    resolved: (DB.pendingResults || []).filter(r => r.status === 'passed').length,
    dropped: (DB.pendingResults || []).filter(r => r.status === 'dropped').length };
}

/** จำนวนการลงทะเบียนเรียนทั้งหมด = ผลรวมของ (นักเรียนในห้อง × วิชาที่ห้องนั้นเรียน)
    ห้องเรียนย่อยถูกยุบเข้ากับห้องหลักก่อน จะได้ไม่นับซ้ำ */
function totalEnrollments(periodId) {
  const groups = new Map();
  (DB.timetable.entries || []).filter(e => e.periodId === periodId).forEach(e => {
    const cls = DB.classes.find(c => c.id === e.classId); if (!cls) return;
    const key = classRoomKind(cls).baseName + '::' + e.subjectId;
    if (!groups.has(key)) groups.set(key, new Set());
    groups.get(key).add(cls.id);
  });
  let n = 0;
  groups.forEach(ids => {
    const list = Array.from(ids).map(id => DB.classes.find(c => c.id === id)).filter(Boolean);
    const mains = list.filter(c => !isSubRoom(c));
    (mains.length ? mains : list).forEach(c => { n += (c.students || []).length; });
  });
  return n;
}

const pendingReasonBadge = v => '<span class="pr-tag pr-' + (v === '0' ? 'zero' : v === 'ร' ? 'r' : v === 'มส' ? 'ms' : 'mp') + '">' + esc(v) + '</span>';

/** การ์ดติดตามผลการเรียนคงค้างในหน้าภาพรวมครู */
function renderPendingCard(pane) {
  const box = $('#pendingBox', pane); if (!box) return;
  const scope = DB.ui.pendingScope || 'mine', showDone = !!DB.ui.pendingShowDone;
  const all = pendingForTeacher(scope), list = showDone ? all : all.filter(r => r.status === 'pending');
  const pendingCount = all.filter(r => r.status === 'pending').length;
  const carried = all.filter(r => r.status === 'pending' && pendingCarryTerms(r) > 0).length;
  box.innerHTML = '<div class="exec-head row"><div><div class="exec-eyebrow">FOLLOW-UP</div><h3>นักเรียนคงค้างผลการเรียน</h3></div><div class="spacer"></div>' +
    '<select id="prScope">' + [['mine', 'วิชาที่ฉันสอน'], ['homeroom', 'ห้องที่ปรึกษา'], ['all', 'ทั้งหมดในเครื่องนี้']]
      .map(x => '<option value="' + x[0] + '"' + (scope === x[0] ? ' selected' : '') + '>' + x[1] + '</option>').join('') + '</select>' +
    '<button class="sm" id="prAdd">+ เพิ่มเอง</button><button class="sm primary" id="prScan">ดึงจากผลการเรียนภาคนี้</button>' +
    '<span class="badge ' + (pendingCount ? 'bad' : 'ok') + '">' + pendingCount + ' รายการ</span></div>' +
    '<div class="exec-note">ดึงรายชื่อได้เมื่อตัดสินผลการเรียนแล้ว ระบบอ่านจากสมุดคะแนนของวิชาที่คุณสอนในภาคเรียนนี้' +
    (carried ? ' • มี <b>' + carried + '</b> รายการที่ค้างข้ามภาคเรียนมาแล้ว' : '') + '</div>' +
    '<div class="exec-toolbar"><label class="pr-check"><input type="checkbox" id="prShowDone"' + (showDone ? ' checked' : '') + '> แสดงรายการที่จบแล้วด้วย</label></div>' +
    (list.length ? '<div class="tablewrap"><table><thead><tr><th>นักเรียน</th><th>ห้อง</th><th>วิชา</th><th>ผลที่ติด</th><th>ภาคที่ติด</th><th>สถานะ</th><th>บันทึกผล</th></tr></thead><tbody>' +
      list.map(r => {
        const carry = pendingCarryTerms(r), done = r.status !== 'pending';
        return '<tr' + (done ? ' class="pr-done"' : '') + '><td><b>' + esc(r.name) + '</b>' + (r.no ? '<div class="hint">เลขที่ ' + esc(r.no) + '</div>' : '') + '</td>' +
          '<td>' + esc(r.className) + '</td>' +
          '<td>' + esc((r.subjectCode ? r.subjectCode + ' ' : '') + r.subjectName) + '</td>' +
          '<td>' + pendingReasonBadge(r.reason) + '<div class="hint">' + esc(pendingReasonDesc(r.reason)) + '</div></td>' +
          '<td>' + esc(periodText(r.periodId)) + (carry ? '<div class="hint badtext">ค้างมาแล้ว ' + carry + ' ภาคเรียน</div>' : '') + '</td>' +
          '<td>' + (r.status === 'passed' ? '<span class="badge ok">แก้ผ่านแล้ว' + (r.resultGrade ? ' • ' + esc(r.resultGrade) : '') + '</span>' :
            r.status === 'dropped' ? '<span class="badge">พ้นสภาพ</span>' : '<span class="badge bad">ยังไม่ผ่าน</span>') + '</td>' +
          '<td>' + (done ? '<button class="sm" data-pr-undo="' + r.id + '">ย้อนกลับ</button>' :
            '<button class="sm primary" data-pr-pass="' + r.id + '">แก้ผ่านแล้ว</button><button class="sm danger" data-pr-drop="' + r.id + '">พ้นสภาพ</button>') +
          '<button class="sm" data-pr-del="' + r.id + '">ลบ</button></td></tr>';
      }).join('') + '</tbody></table></div>'
      : '<div class="empty">ยังไม่มีรายการคงค้าง — กด “ดึงจากผลการเรียนภาคนี้” เมื่อตัดสินผลเรียบร้อยแล้ว</div>');

  // วาดใหม่แล้วปุ่มย่อ/ขยายหายไป จึงต้องให้ระบบใส่กลับทุกครั้ง
  delete box.dataset.collapsible;
  $$('.card-collapse', box).forEach(b => b.remove());
  initCollapsibles(box.parentNode || document);
  const rerender = () => renderPendingCard(pane);
  $('#prScope', box).addEventListener('change', e => { DB.ui.pendingScope = e.target.value; save(); rerender(); });
  $('#prShowDone', box).addEventListener('change', e => { DB.ui.pendingShowDone = e.target.checked; save(); rerender(); });
  $('#prScan', box).addEventListener('click', () => openPendingScan(rerender));
  $('#prAdd', box).addEventListener('click', () => openPendingAdd(rerender));
  $$('[data-pr-pass]', box).forEach(b => b.addEventListener('click', () => openPendingResolve(b.dataset.prPass, rerender)));
  $$('[data-pr-drop]', box).forEach(b => b.addEventListener('click', () => dropPendingStudent(b.dataset.prDrop, rerender)));
  $$('[data-pr-undo]', box).forEach(b => b.addEventListener('click', () => {
    const r = (DB.pendingResults || []).find(x => x.id === b.dataset.prUndo); if (!r) return;
    Object.assign(r, { status: 'pending', resultGrade: '', resolvedAt: '', resolvedBy: '', updatedAt: new Date().toISOString() });
    save(true); rerender(); toast('ย้อนกลับเป็นยังไม่ผ่านแล้ว', 'ok');

/* ---- ซิงก์ผลการเรียนคงค้างขึ้นส่วนกลาง ------------------------------------
   ผลการเรียนคงค้างเก็บในเครื่องของครูแต่ละคน หน้าผู้บริหารจึงเห็นเฉพาะของเครื่องนั้น
   ปุ่มนี้ส่งของตัวเองขึ้น pendingResults บนส่วนกลาง แล้วดึงของครูทุกคนลงมารวมกัน */
const pendingOwnerId = r => String(r.ownerId || '').trim().toLowerCase();
function myPendingRecords() {
  const me = myEmailForSync();
  return (DB.pendingResults || []).filter(r => !pendingOwnerId(r) || pendingOwnerId(r) === me);
}
/** รายการของฉันที่ยังไม่ได้ส่งขึ้น หรือแก้ไขหลังส่งครั้งล่าสุด */
function pendingUnsyncedCount() {
  return myPendingRecords().filter(r => !r.syncedAt || String(r.syncedAt) < String(r.updatedAt || '')).length;
}
const pendingSyncReady = () => !!(firebaseReady() && fbSignedIn() && myEmailForSync());

async function pushPendingResults() {
  const me = myEmailForSync();
  if (!pendingSyncReady()) throw new Error('ต้องเข้าสู่ระบบด้วยบัญชีโรงเรียน และมีอีเมลในโปรไฟล์ครูก่อน');
  const col = fbDb.collection('pendingResults'), mine = myPendingRecords(), stamp = new Date().toISOString();
  const teacher = curTeacher() || {}, jobs = [];
  mine.forEach(r => {
    r.ownerId = me; r.ownerName = teacher.name || teacher.email || ''; r.syncedAt = stamp;
    jobs.push(fbSetDoc(col.doc(r.id), fbPlain(r), 'ผลการเรียนคงค้างของ ' + (r.name || '')));
  });
  // รายการที่ลบไปแล้วในเครื่อง ต้องลบบนส่วนกลางด้วย ไม่งั้นดึงกลับมาใหม่ทุกครั้ง
  const localIds = new Set(mine.map(r => r.id));
  const snap = await col.where('ownerId', '==', me).get({ source: 'server' });
  snap.docs.forEach(d => { if (!localIds.has(d.id)) jobs.push(d.ref.delete()); });
  await Promise.all(jobs);
  return mine.length;
}

async function pullPendingResults() {
  const me = myEmailForSync();
  const snap = await fbDb.collection('pendingResults').get({ source: 'server' });
  const byId = new Map((DB.pendingResults || []).map(r => [r.id, r]));
  let added = 0, updated = 0;
  snap.docs.forEach(d => {
    const data = fbDecodeNested(d.data() || {}); if (!data.id) data.id = d.id;
    const old = byId.get(data.id);
    if (!old) { DB.pendingResults.push(data); byId.set(data.id, data); added++; return; }
    // ของคนอื่นเชื่อส่วนกลางเสมอ ของตัวเองเชื่อเครื่องนี้ถ้าแก้ทีหลัง
    if (pendingOwnerId(data) !== me || String(data.updatedAt || '') >= String(old.updatedAt || '')) {
      Object.assign(old, data); updated++;
    }
  });
  const remoteIds = new Set(snap.docs.map(d => d.id));
  DB.pendingResults = DB.pendingResults.filter(r => !pendingOwnerId(r) || pendingOwnerId(r) === me || remoteIds.has(r.id));
  return { added: added, updated: updated, total: snap.size };
}

/** ปุ่มโผล่เฉพาะหน้าภาพรวมครูและภาพรวมผู้บริหาร */
function updateSyncFab() {
  const el = syncFabEl(), tab = DB.ui.tab || 'dashboard';
  const portal = $('#studentPortal');
  const blocked = document.body.classList.contains('gateway-open') || !!(portal && !portal.hidden);
  const on = !blocked && (tab === 'dashboard' || tab === 'executive');
  el.classList.toggle('show', on);
  document.body.classList.toggle('has-syncfab', on);   // ให้ปุ่มติดตั้งแอปเลื่อนหลบ
  if (!on) return;
  const ready = pendingSyncReady(), n = pendingUnsyncedCount();
  const last = (DB.cloud || {}).lastPendingSync ? new Date(DB.cloud.lastPendingSync).toLocaleString('th-TH') : '';
  el.classList.toggle('off', !ready);
  el.classList.toggle('has-count', n > 0);
  el.classList.toggle('dirty', ready && n > 0);
  $('.sync-count', el).textContent = n > 99 ? '99+' : String(n);
  const text = !ready ? (n ? 'มีข้อมูล ' + n + ' รายการรอส่ง — ยังไม่ได้เข้าสู่ระบบส่วนกลาง' : 'ยังไม่ได้เข้าสู่ระบบส่วนกลาง')

    : last ? 'ซิงก์ข้อมูลของฉัน • ล่าสุด ' + last : 'ซิงก์คะแนนและข้อมูลของฉันขึ้นส่วนกลาง';
  $('.sync-label', el).textContent = text;
  el.title = text; el.setAttribute('aria-label', text);

  if (!pendingSyncReady()) return toast('ต้องเข้าสู่ระบบด้วยบัญชีโรงเรียนก่อน จึงจะซิงก์ขึ้นส่วนกลางได้', 'bad');

  const last = (DB.cloud || {}).lastPendingSync ? new Date(DB.cloud.lastPendingSync).toLocaleString('th-TH') : 'ยังไม่เคยซิงก์';
  const bookCount = Object.keys(DB.books || {}).length;
  const attCount = Object.keys(myAttendanceByMonth()).length;
  const lastBook = DB.cloud.lastBookSync ? new Date(DB.cloud.lastBookSync).toLocaleString('th-TH') : 'ยังไม่เคยซิงก์';

    'แล้วดึงรายการคงค้างของครูทุกคนลงมารวมกัน เพื่อให้หน้าภาพรวมผู้บริหารเห็นยอดทั้งโรงเรียน<br>' +
    '<b>คะแนนของคุณครูท่านอื่นเปิดดูไม่ได้</b> และการดึงคะแนนกลับมาทับเครื่องนี้ต้องกดเองที่หน้าสรุป/ส่งออก</div>' +
    '<div class="exec-sum"><span>สมุดคะแนน <b>' + bookCount + '</b> เล่ม</span>' +
    '<span>การเช็กชื่อ <b>' + attCount + '</b> เดือน</span>' +
    '<span>คงค้าง <b>' + mine.length + '</b> รายการ' + (n ? ' (ใหม่ ' + n + ')' : '') + '</span></div>' +
    '<div class="exec-sum"><span>คะแนนซิงก์ล่าสุด <b>' + esc(lastBook) + '</b></span>' +
    '<span>คงค้างซิงก์ล่าสุด <b>' + esc(last) + '</b></span>' +
    (others.length ? '<span>มีของครูอื่นในเครื่อง <b>' + others.length + '</b> รายการ จาก <b>' + ownerCount + '</b> คน</span>' : '') + '</div>' +

  catch (e) { failed.push('คะแนน: ' + fbErrorMessage(e)); }
  try {
    const pushed = await pushPendingResults();
    const got = await pullPendingResults();
    DB.cloud.lastPendingSync = new Date().toISOString();
    done.push('คงค้างส่งขึ้น ' + pushed + ' • รวมทั้งโรงเรียน ' + got.total + ' รายการ');
  } catch (e) { failed.push('คงค้าง: ' + fbErrorMessage(e)); }
  save(true);
  el.classList.remove('busy'); el.disabled = false;
  if (done.length) flashSyncDone(el);
  if (failed.length) toast('ซิงก์ไม่ครบ • ' + failed.join(' | '), 'bad');
  else toast('ซิงก์แล้ว • ' + done.join(' • '), 'ok');
  render();
}

function flashSyncDone(el) {
  const ico = $('.sync-ico', el); if (!ico) return;
  el.classList.add('done'); ico.innerHTML = SYNC_CHECK_SVG;
  setTimeout(() => { el.classList.remove('done'); ico.innerHTML = SYNC_ARROW_SVG; updateSyncFab(); }, 1800);
}

/* ---- ภาระงานสอนรายครู -----------------------------------------------------
   นับเฉพาะคาบประจำในตารางสอนของปี/ภาคที่เลือก (ไม่รวมคาบสอนแทนและสอนชดเชย) */
const NO_AREA_LABEL = 'ยังไม่ระบุกลุ่มสาระ';
const LOAD_SORTS = [{ key: 'periods', label: 'คาบสอน' }, { key: 'name', label: 'ชื่อ' },
  { key: 'area', label: 'กลุ่มสาระ' }, { key: 'classes', label: 'จำนวนห้อง' }];

function teachingLoadStats(area) {
  const entries = (DB.timetable.entries || []).filter(e => e.periodId === DB.ui.periodId);
  const rows = DB.teachers.filter(t => teacherHasRole(t, 'teacher')).map(t => {
    // คาบเข้าแถวเช้า/โฮมรูมไม่ใช่คาบสอน จึงไม่นับเป็นภาระงาน
    const own = entries.filter(e => e.teacherId === t.id && !isHomeroomEntry(e));
    return { id: t.id, name: t.name || t.email || 'ไม่ระบุชื่อ', area: teacherArea(t) || NO_AREA_LABEL,
      periods: own.length, subjects: new Set(own.map(e => e.subjectId)).size,
      classes: new Set(own.map(e => e.classId)).size, days: new Set(own.map(e => num(e.day))).size };
  });
  const scoped = area ? rows.filter(r => r.area === area) : rows;
  const teaching = scoped.filter(r => r.periods > 0);
  const total = scoped.reduce((a, r) => a + r.periods, 0);
  const summary = { teachers: scoped.length, teaching: teaching.length, total: total,
    avg: teaching.length ? total / teaching.length : 0,
    max: teaching.length ? Math.max.apply(null, teaching.map(r => r.periods)) : 0,
    min: teaching.length ? Math.min.apply(null, teaching.map(r => r.periods)) : 0 };
  // สรุปรายกลุ่มสาระ ใช้ตอนเลือก “ทุกกลุ่มสาระ”
  const groups = {};
  rows.forEach(r => {
    if (!groups[r.area]) groups[r.area] = { area: r.area, teachers: 0, teaching: 0, total: 0 };
    groups[r.area].teachers++; groups[r.area].total += r.periods; if (r.periods > 0) groups[r.area].teaching++;
  });
  const byArea = Object.values(groups).map(g => Object.assign(g, { avg: g.teaching ? g.total / g.teaching : 0 }))
    .sort((a, b) => b.avg - a.avg || b.total - a.total);
  return { rows: scoped, summary: summary, byArea: byArea };
}

  const area = DB.ui.loadArea || '', data = teachingLoadStats(area), s = data.summary;

    ? String(a[key]).localeCompare(String(b[key]), 'th') * (DB.ui.loadSortDir === 'asc' ? 1 : -1) * -1

      '<div class="metric-card" style="--metric:var(--group)"><div class="metric-value">' + s.total + '</div><div class="metric-label">คาบรวมต่อสัปดาห์</div></div>' +

      '<div class="metric-card" style="--metric:var(--warn)"><div class="metric-value">' + s.max + '–' + s.min + '</div><div class="metric-label">สูงสุด–ต่ำสุด</div></div></div>' +
      '<div class="tablewrap" style="margin-top:12px"><table><thead><tr>' +
      cols.map(c => '<th' + (c.key ? ' class="sortable" data-load-sort="' + c.key + '" title="คลิกเพื่อเรียงลำดับ"' : '') + '>' + esc(c.label) + arrow(c.key) + '</th>').join('') + '</tr></thead><tbody>' +
      (sorted.length ? sorted.map(r => {
        const diff = r.periods - s.avg, width = s.max ? Math.round(r.periods * 100 / s.max) : 0;
        return '<tr><td><b>' + esc(r.name) + '</b></td>' + (area ? '' : '<td>' + esc(r.area) + '</td>') +

      }).join('') : '<tr><td colspan="' + cols.length + '"><div class="empty">ไม่มีครูในกลุ่มสาระนี้</div></td></tr>') +
      '</tbody></table></div>' +
      (area ? '' : '<h3 style="font-size:14px;margin-top:16px">เปรียบเทียบระหว่างกลุ่มสาระ</h3>' +
        '<div class="tablewrap"><table><thead><tr><th>กลุ่มสาระ/กลุ่มงาน</th><th>ครูทั้งหมด</th><th>ครูที่มีคาบสอน</th><th>คาบรวม</th><th>เฉลี่ยต่อคน</th><th>เทียบทั้งโรงเรียน</th></tr></thead><tbody>' +
        (data.byArea.length ? data.byArea.map(g => { const top = data.byArea[0].avg || 1;

            '<td style="min-width:140px"><div class="bar"><i style="width:' + Math.round(g.avg * 100 / top) + '%"></i></div></td></tr>'; }).join('')
          : '<tr><td colspan="6"><div class="empty">ยังไม่มีข้อมูลตารางสอน</div></td></tr>') + '</tbody></table></div>')

function teacherRolesFromText(value) {
  const v = String(value || '').toLowerCase(), roles = [];
  if (/ครู|teacher/.test(v) || !v) roles.push('teacher');
  if (/หัวหน้ากลุ่มสาระ|หัวหน้ากลุ่ม|head/.test(v)) roles.push('head');
  if (/ผู้บริหาร|executive|director/.test(v)) roles.push('executive'); if (/ผู้ดูแล|admin/.test(v)) roles.push('admin');
  return Array.from(new Set(roles.length ? roles : ['teacher']));
}
/** จับคู่ข้อความกลุ่มสาระจากไฟล์นำเข้ากับรายการมาตรฐาน */
function learningAreaFromText(value) {
  const v = String(value || '').trim(); if (!v) return '';
  const exact = LEARNING_AREAS.find(a => a === v); if (exact) return exact;
  const key = v.toLowerCase().replace(/\s|กลุ่มสาระการเรียนรู้|กลุ่มสาระ|กลุ่มงาน/g, '');
  const found = LEARNING_AREAS.find(a => a.toLowerCase().replace(/\s|กลุ่มสาระการเรียนรู้|กลุ่มสาระ|กลุ่มงาน/g, '').includes(key) || key.includes(a.toLowerCase().replace(/\s|\(.*\)/g, '')));
  return found || v;
}

/** เทียบชื่อโดยไม่สนใจช่องว่างและคำนำหน้า เพื่อจับรายชื่อซ้ำตอนนำเข้า */
function normalizeName(value) {
  return String(value || '').replace(/\s+/g, '')
    .replace(/^(นาย|นางสาว|นาง|น\.ส\.|ด\.ช\.|ด\.ญ\.|เด็กชาย|เด็กหญิง|ครู|อาจารย์|ว่าที่ร้อยตรี|ว่าที่ร\.ต\.)/, '')
    .toLowerCase();
}
/** แจ้งรายการที่ซ้ำหลังนำเข้า พร้อมบอกว่าซ้ำกับข้อมูลใดในระบบ

function duplicateReport(title, columns, list, note) {
  if (!list.length) return;
  openModal({ title: title, wide: true,
    bodyHTML: '<div class="notice bad">' + (note ? note.replace('{n}', '<b>' + list.length + '</b>') : 'มี <b>' + list.length + '</b> รายการที่ <b>มีชื่อนี้ในระบบอยู่แล้ว</b> ระบบจึงไม่นำเข้าซ้ำ') + '</div>' +
      '<div class="tablewrap" style="margin-top:10px;max-height:50vh"><table><thead><tr>' + columns.map(c => '<th>' + esc(c) + '</th>').join('') + '</tr></thead><tbody>' +
      list.map(r => '<tr>' + r.map(v => '<td>' + esc(v) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>' });
}

async function importTeachersExcel() {
  const f = await pickFile('.xlsx'); if (!f) return;

    const heads = rows[0].map(x => String(x || '').trim().toLowerCase()), find = names => heads.findIndex(h => names.some(n => h.includes(n)));
    const ix = { name: find(['ชื่อครู','ชื่อ-นามสกุล','name']), email: find(['อีเมล','email']), phone: find(['เบอร์โทร','โทรศัพท์','phone']), roles: find(['บทบาท','role']), room: find(['ห้องที่ปรึกษา','homeroom']), area: find(['กลุ่มสาระ','กลุ่มงาน','learningarea']) };
    if (ix.name < 0) throw new Error('ไม่พบคอลัมน์ “ชื่อครู”'); let added = 0, updated = 0, homerooms = 0;

    rows.slice(1).forEach((row, i) => { const name = String(row[ix.name] || '').trim(); if (!name) return;
      const email = ix.email >= 0 ? String(row[ix.email] || '').trim() : '', roomName = ix.room >= 0 ? String(row[ix.room] || '').trim() : '',
        phone = ix.phone >= 0 ? String(row[ix.phone] || '').trim() : '', area = ix.area >= 0 ? learningAreaFromText(row[ix.area]) : '';
      const key = normalizeName(name), note = (reason) => attention.push(['แถว ' + (i + 2), name, roomName || '—', reason]);
      if (batch.has(key)) return note('ซ้ำกับแถว ' + batch.get(key) + ' ในไฟล์เดียวกัน จึงข้ามแถวนี้');
      batch.set(key, i + 2);
      // ครูที่มีอยู่แล้วจะไม่ถูกสร้างซ้ำ แต่ใช้ไฟล์เติมช่องที่ยังว่าง เช่น ห้องที่ปรึกษา เบอร์โทร กลุ่มสาระ
      let t = DB.teachers.find(x => normalizeName(x.name) === key) || (email ? DB.teachers.find(x => x.email && String(x.email).toLowerCase() === email.toLowerCase()) : null);
      const isNew = !t; let changed = false;
      if (isNew) { t = { id: uid('teacher'), name: name, email: email, phone: phone, learningArea: area, homeroomClassId: '', roles: ix.roles >= 0 ? teacherRolesFromText(row[ix.roles]) : ['teacher'] }; DB.teachers.push(t); added++; }
      else {

        if (!cls) note('ยังไม่มีห้อง “' + roomName + '” ในระบบ — นำเข้าตารางสอนก่อนแล้วนำเข้าไฟล์นี้ซ้ำ');
        else if (t.homeroomClassId === cls.id) { /* ผูกไว้อยู่แล้ว ไม่ต้องทำอะไร */ }

      'มี {n} รายการที่ระบบ <b>ไม่ได้เปลี่ยนให้</b> เพื่อไม่ทับข้อมูลเดิม ตรวจสอบแล้วแก้ในศูนย์จัดการระบบได้');

function timetableImportDay(value) {
  const raw = String(value == null ? '' : value).trim().toLowerCase().replace(/^วัน/, '');
  if (/^[1-5]$/.test(raw)) return num(raw);
  const map = { 'จันทร์': 1, 'อังคาร': 2, 'พุธ': 3, 'พฤหัสบดี': 4, 'พฤหัส': 4, 'ศุกร์': 5, 'monday': 1, 'mon': 1, 'tuesday': 2, 'tue': 2, 'wednesday': 3, 'wed': 3, 'thursday': 4, 'thu': 4, 'friday': 5, 'fri': 5 };
  return map[raw] || 0;
}
function timetableImportSlot(value) {
  const raw = String(value == null ? '' : value).trim().toLowerCase();
  if (/เข้าแถว|assembly|homeroom/.test(raw)) return 'assembly';
  const m = raw.match(/(?:คาบ\s*)?(\d+)/), n = m ? num(m[1]) : 0; return n >= 1 && n <= 9 ? String(n) : '';
}
function normalizeImportHeader(value) { return String(value || '').toLowerCase().replace(/[\s_\-\/().]/g, ''); }

function analyzeTimetableImport(rows) {
  if (!rows || rows.length < 2) throw new Error('ไม่พบข้อมูลในชีต “ตารางสอน”');
  const headers = rows[0].map(normalizeImportHeader), col = names => headers.findIndex(h => names.some(n => h.includes(normalizeImportHeader(n))));
  const ix = { year: col(['ปีการศึกษา','ปี']), semester: col(['ภาคเรียน','ภาค']), email: col(['อีเมลครู','email']), teacher: col(['ชื่อครู','ครูผู้สอน','teacher']), phone: col(['เบอร์โทร','โทรศัพท์','phone']), area: col(['กลุ่มสาระ','กลุ่มงาน','learningarea']), day: col(['วัน','day']), slot: col(['คาบ','period','slot']), code: col(['รหัสวิชา','subjectcode']), subject: col(['ชื่อวิชา','รายวิชา','subjectname']), className: col(['ห้องเรียน','ชั้นเรียน','class']), room: col(['สถานที่','ห้องสอน','room']) };
  const required = [['ชื่อครู/อีเมลครู', ix.teacher >= 0 || ix.email >= 0], ['วัน', ix.day >= 0], ['คาบ', ix.slot >= 0], ['รหัสวิชา/ชื่อวิชา', ix.code >= 0 || ix.subject >= 0], ['ห้องเรียน', ix.className >= 0]];
  const missing = required.filter(x => !x[1]).map(x => x[0]); if (missing.length) throw new Error('ขาดคอลัมน์สำคัญ: ' + missing.join(', '));
  const period = curPeriod(), seen = new Set();
  return rows.slice(1).map((row, index) => {
    const get = i => i >= 0 ? String(row[i] == null ? '' : row[i]).trim() : '', item = { rowNo: index + 2, year: get(ix.year), semester: get(ix.semester), email: get(ix.email).toLowerCase(), teacherName: get(ix.teacher), phone: get(ix.phone), learningArea: ix.area >= 0 ? learningAreaFromText(get(ix.area)) : '', day: timetableImportDay(get(ix.day)), slotId: timetableImportSlot(get(ix.slot)), code: get(ix.code), subjectName: get(ix.subject), className: get(ix.className), room: get(ix.room), errors: [], warnings: [] };
    if (!item.email && !item.teacherName) item.errors.push('ไม่มีชื่อหรืออีเมลครู'); if (!item.day) item.errors.push('วันไม่ถูกต้อง'); if (!item.slotId) item.errors.push('คาบไม่ถูกต้อง'); if (!item.code && !item.subjectName) item.errors.push('ไม่มีรายวิชา'); if (!item.className) item.errors.push('ไม่มีห้องเรียน');
    if (period && item.year && String(item.year) !== String(period.academicYear)) item.errors.push('ปีการศึกษาไม่ตรงกับที่เลือก'); if (period && item.semester && String(item.semester) !== String(period.semester)) item.errors.push('ภาคเรียนไม่ตรงกับที่เลือก');
    const teacher = DB.teachers.find(t => item.email && String(t.email || '').toLowerCase() === item.email) || DB.teachers.find(t => item.teacherName && t.name === item.teacherName), subject = DB.subjects.find(s => item.code && String(s.code || '').toLowerCase() === item.code.toLowerCase()) || DB.subjects.find(s => item.subjectName && s.name === item.subjectName), cls = DB.classes.find(c => c.name === item.className);
    item.teacherId = teacher ? teacher.id : ''; item.subjectId = subject ? subject.id : ''; item.classId = cls ? cls.id : '';
    if (!teacher) item.warnings.push('ต้องสร้างข้อมูลครู'); if (!subject) item.warnings.push('ต้องสร้างรายวิชา'); if (!cls) item.warnings.push('ต้องสร้างห้องเรียน');
    const duplicateKey = (item.email || item.teacherName) + '::' + item.day + '::' + item.slotId; if (seen.has(duplicateKey)) item.errors.push('ครูมีมากกว่า 1 แถวในวัน/คาบเดียวกัน'); else seen.add(duplicateKey);
    return item;
  }).filter(x => x.email || x.teacherName || x.day || x.slotId || x.code || x.subjectName || x.className);
}

function wipePeriodTimetable() {
  const pid = DB.ui.periodId;
  const gone = new Set((DB.timetable.entries || []).filter(e => e.periodId === pid).map(e => e.id));
  (DB.timetable.exceptions || []).filter(e => e.periodId === pid).forEach(e => gone.add(e.id));
  let records = 0;
  Object.keys(DB.timetable.attendance || {}).forEach(k => {
    if (gone.has(DB.timetable.attendance[k].entryId)) { delete DB.timetable.attendance[k]; records++; }
  });
  DB.timetable.entries = (DB.timetable.entries || []).filter(e => e.periodId !== pid);
  DB.timetable.exceptions = (DB.timetable.exceptions || []).filter(e => e.periodId !== pid);
  return { entries: gone.size, records: records };
}

function commitTimetableImport(items, autoCreate, conflictMode) {
  let added = 0, updated = 0, skipped = 0, createdTeachers = 0, createdSubjects = 0, createdClasses = 0, conflicts = 0, filledPhones = 0, filledAreas = 0;
  items.forEach(item => {
    if (item.errors.length) { skipped++; return; }
    let teacher = DB.teachers.find(t => item.email && String(t.email || '').toLowerCase() === item.email) || DB.teachers.find(t => item.teacherName && t.name === item.teacherName);
    let subject = DB.subjects.find(s => item.code && String(s.code || '').toLowerCase() === item.code.toLowerCase()) || DB.subjects.find(s => item.subjectName && s.name === item.subjectName);
    let cls = DB.classes.find(c => c.name === item.className);
    if ((!teacher || !subject || !cls) && !autoCreate) { skipped++; return; }
    if (!teacher) { teacher = { id: uid('teacher'), name: item.teacherName || item.email, email: item.email, phone: item.phone || '', learningArea: item.learningArea || '', homeroomClassId: '', roles: ['teacher'] }; DB.teachers.push(teacher); createdTeachers++; if (item.phone) filledPhones++; if (item.learningArea) filledAreas++; }
    else { if (!teacher.email && item.email) teacher.email = item.email; if (!teacher.name && item.teacherName) teacher.name = item.teacherName;
      // เบอร์โทรและกลุ่มสาระจากไฟล์ใช้เติมเฉพาะครูที่ยังไม่มีข้อมูล เพื่อไม่ทับที่แก้ไว้ในระบบ
      if (!teacher.phone && item.phone) { teacher.phone = item.phone; filledPhones++; }
      if (!teacherArea(teacher) && item.learningArea) { teacher.learningArea = item.learningArea; filledAreas++; } }
    if (!cls) { cls = { id: uid('c'), name: item.className, students: [] }; DB.classes.push(cls); createdClasses++; }
    if (!subject) { subject = { id: uid('s'), code: item.code, name: item.subjectName || item.code, gradeLevels: classLevel(cls.name) ? [classLevel(cls.name)] : [] }; DB.subjects.push(subject); createdSubjects++; }
    else { if (!subject.code && item.code) subject.code = item.code; if (!subject.name && item.subjectName) subject.name = item.subjectName; }
    const teacherEntry = DB.timetable.entries.find(e => e.periodId === DB.ui.periodId && e.teacherId === teacher.id && num(e.day) === item.day && String(e.slotId) === item.slotId);
    const classCollision = DB.timetable.entries.find(e => e.periodId === DB.ui.periodId && e.teacherId !== teacher.id && e.classId === cls.id && num(e.day) === item.day && String(e.slotId) === item.slotId);
    if (classCollision) { conflicts++; skipped++; return; }
    if (teacherEntry) {
      if (conflictMode === 'skip') { skipped++; return; }
      Object.assign(teacherEntry, { subjectId: subject.id, classId: cls.id, room: item.room }); updated++;
    } else { DB.timetable.entries.push({ id: uid('tt'), periodId: DB.ui.periodId, teacherId: teacher.id, day: item.day, slotId: item.slotId, subjectId: subject.id, classId: cls.id, room: item.room }); added++; }
  });
  if (!DB.ui.teacherId && DB.teachers[0]) DB.ui.teacherId = DB.teachers[0].id;
  save(true); render();
  return { added: added, updated: updated, skipped: skipped, conflicts: conflicts, createdTeachers: createdTeachers, createdSubjects: createdSubjects, createdClasses: createdClasses, filledPhones: filledPhones, filledAreas: filledAreas };
}

/* ---- นำเข้าวันหยุดราชการจากปฏิทิน Google ----------------------------------
   ปฏิทิน "วันหยุดในประเทศไทย" ของ Google แยกประเภทไว้ในช่องคำอธิบาย
   ขึ้นต้นด้วย "วันหยุด" = วันหยุดนักขัตฤกษ์ ราชการหยุดจริง
   ขึ้นต้นด้วย "วันสำคัญ" = เช่น วันวาเลนไทน์ วันคริสต์มาส ซึ่งโรงเรียนยังเปิดสอน
   ระบบจึงติ๊กให้เฉพาะกลุ่มแรก ที่เหลือแสดงไว้ให้ผู้ดูแลติ๊กเองถ้าโรงเรียนหยุดด้วย
   ดึงได้สองทาง: ออนไลน์ผ่าน Calendar API หรือเลือกไฟล์ .ics ที่โหลดมาจาก Google */
const GOOGLE_TH_HOLIDAY_CALENDAR = 'th.th#holiday@group.v.calendar.google.com';
const GOOGLE_HOLIDAY_ICS_URL = 'https://calendar.google.com/calendar/ical/' +
  encodeURIComponent(GOOGLE_TH_HOLIDAY_CALENDAR) + '/public/basic.ics';
/* ต้องดูแค่ "ขึ้นต้นด้วย" เท่านั้น เพราะคำอธิบายของวันสำคัญมีคำว่า "วันหยุดในไทย" อยู่ท้ายข้อความด้วย
   ถ้าค้นทั้งข้อความจะเหมาเอาวันวาเลนไทน์เป็นวันหยุดราชการไปด้วย */
const isOfficialHolidayNote = text => /^\s*(วันหยุด|public holiday)/i.test(String(text || ''));
const icsToISO = v => /^\d{8}$/.test(v) ? v.slice(0, 4) + '-' + v.slice(4, 6) + '-' + v.slice(6) : '';
const unescapeIcsText = v => String(v || '').replace(/\\n/gi, ' ').replace(/\\([,;\\])/g, '$1').trim();

async function fetchGoogleHolidays(fromISO, toISO) {
  const key = ((window.GRADEBOOK_CONFIG || {}).firebase || {}).apiKey || '';
  if (!key) { const e = new Error('ยังไม่ได้กรอก apiKey ในไฟล์ config.js'); e.code = 'noKey'; throw e; }
  const url = 'https://www.googleapis.com/calendar/v3/calendars/' + encodeURIComponent(GOOGLE_TH_HOLIDAY_CALENDAR) +
    '/events?key=' + encodeURIComponent(key) + '&timeMin=' + fromISO + 'T00:00:00Z&timeMax=' + toISO + 'T23:59:59Z' +
    '&singleEvents=true&orderBy=startTime&maxResults=250';
  const res = await fetch(url);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = data.error || {}, reason = ((err.errors || [])[0] || {}).reason || '';
    const e = new Error(err.message || ('ดึงข้อมูลไม่สำเร็จ (HTTP ' + res.status + ')'));
    /* คีย์ของ Firebase มักถูกจำกัดว่าเรียกได้เฉพาะบาง API ต้องไปปลดที่หน้าข้อมูลรับรองด้วย
       ไม่ใช่แค่เปิด Calendar API อย่างเดียว จึงต้องแยกสองกรณีนี้ให้ผู้ดูแลรู้ว่าต้องแก้ตรงไหน */
    e.code = reason === 'accessNotConfigured' ? 'apiOff'
      : (reason === 'API_KEY_SERVICE_BLOCKED' || /blocked/i.test(err.message || '')) ? 'keyBlocked'
      : reason || 'failed';
    throw e;
  }
  return (data.items || []).map(ev => ({
    date: (ev.start || {}).date || String((ev.start || {}).dateTime || '').slice(0, 10),
    endDate: (ev.end || {}).date || '',
    name: String(ev.summary || '').trim(),
    official: isOfficialHolidayNote(ev.description)
  })).filter(x => /^\d{4}-\d{2}-\d{2}$/.test(x.date));
}

/** อ่านไฟล์ .ics โดยคลี่บรรทัดที่ถูกพับตั้งแต่ยังเป็นไบต์
    Google พับบรรทัดทุก 75 ไบต์ ซึ่งตัดกลางตัวอักษรไทยได้ ถ้าถอดรหัสก่อนคลี่ ชื่อวันหยุดจะเพี้ยน */
async function parseHolidayIcs(file) {
  const bytes = new Uint8Array(await file.arrayBuffer()), flat = [];
  for (let i = 0; i < bytes.length; i++) {
    if (bytes[i] === 13 && bytes[i + 1] === 10 && (bytes[i + 2] === 32 || bytes[i + 2] === 9)) { i += 2; continue; }
    if (bytes[i] === 10 && (bytes[i + 1] === 32 || bytes[i + 1] === 9)) { i += 1; continue; }
    flat.push(bytes[i]);
  }
  const text = new TextDecoder('utf-8').decode(new Uint8Array(flat));
  return text.split('BEGIN:VEVENT').slice(1).map(chunk => {
    const body = chunk.split('END:VEVENT')[0];
    const pick = re => { const m = body.match(re); return m ? m[1] : ''; };
    return { date: icsToISO(pick(/DTSTART[^:\n]*:(\d{8})/)), endDate: icsToISO(pick(/DTEND[^:\n]*:(\d{8})/)),
      name: unescapeIcsText(pick(/[\r\n]SUMMARY[^:\n]*:([^\r\n]*)/)),
      official: isOfficialHolidayNote(unescapeIcsText(pick(/[\r\n]DESCRIPTION[^:\n]*:([^\r\n]*)/))) };
  }).filter(x => x.date);
}

/** DTEND ของ ICS และ end.date ของ Calendar API เป็นวันถัดจากวันสุดท้าย จึงต้องถอยหนึ่งวัน
    วันหยุดยาวอย่างสงกรานต์จะได้กระจายออกเป็นรายวันครบทุกวัน */
function expandHolidayEvent(ev) {
  const out = [], last = ev.endDate && ev.endDate > ev.date ? shiftISODate(ev.endDate, -1) : ev.date;
  const d = parseISODate(ev.date);
  for (let guard = 0; d && guard < 31; guard++) {
    const iso = isoDate(d);
    out.push({ date: iso, name: ev.name, official: ev.official });
    if (iso >= last) break;
    d.setDate(d.getDate() + 1);
  }
  return out;
}

/* วันหยุดกระทบครูทั้งโรงเรียน ทั้งการเช็กชื่อและการคิด % เวลาเรียน
   จึงต้องให้ผู้ดูแลเห็นรายการและติ๊กยืนยันก่อนเสมอ ไม่เพิ่มให้เองอัตโนมัติ */
function openHolidayImport(events, sourceLabel) {
  const term = currentTerm(true);
  const have = new Set((term.holidays || []).map(h => h.date));
  const seen = new Set(), all = [];
  (events || []).forEach(ev => expandHolidayEvent(ev).forEach(x => { if (!seen.has(x.date)) { seen.add(x.date); all.push(x); } }));
  all.sort((a, b) => a.date.localeCompare(b.date));
  const list = all.filter(x => !term.openDate || !term.closeDate || (x.date >= term.openDate && x.date <= term.closeDate));
  const skipped = all.length - list.length;
  if (!list.length) return toast('ไม่พบวันหยุดในช่วงเปิด-ปิดภาคเรียนนี้ (อ่านมาทั้งหมด ' + all.length + ' วัน)', 'bad');
  const weekendOf = iso => { const d = (parseISODate(iso) || new Date()).getDay(); return d === 0 || d === 6; };
  const dayNameOf = iso => (SCHOOL_DAYS.find(x => x.value === (parseISODate(iso) || new Date()).getDay()) || { label: 'เสาร์-อาทิตย์' }).label;
  const rows = list.map((x, i) => {
    const exists = have.has(x.date), weekend = weekendOf(x.date), day = (parseISODate(x.date) || new Date()).getDay();
    const affected = weekend ? 0 : (DB.timetable.entries || []).filter(e => e.periodId === DB.ui.periodId && num(e.day) === day).length;
    return '<tr><td><input type="checkbox" class="hol-pick" data-i="' + i + '"' + (x.official && !weekend && !exists ? ' checked' : '') + '></td>' +
      '<td><b>' + esc(thaiDate(x.date)) + '</b><br><span class="hint">' + esc(dayNameOf(x.date)) + '</span></td>' +
      '<td class="lt">' + esc(x.name || 'วันหยุด') + '</td>' +
      '<td><span class="badge ' + (x.official ? 'grp' : 'warn') + '">' + (x.official ? 'วันหยุดนักขัตฤกษ์' : 'วันสำคัญ • ไม่ใช่วันหยุดราชการ') + '</span></td>' +
      '<td>' + (weekend ? '<span class="badge">เสาร์-อาทิตย์ ไม่มีคาบเรียนอยู่แล้ว</span>' : affected + ' คาบ') +
        (exists ? '<br><span class="badge ok">มีในปฏิทินแล้ว</span>' : '') + '</td></tr>';
  }).join('');
  openModal({ title: 'วันหยุดจากปฏิทิน Google • ' + sourceLabel, wide: true,
    bodyHTML: '<div class="notice">พบ <b>' + list.length + '</b> วันในช่วงเปิด-ปิดภาคเรียนนี้' +
        (skipped ? ' (อีก ' + skipped + ' วันอยู่นอกช่วง จึงไม่แสดง)' : '') +
        '<br>ระบบติ๊กให้เฉพาะ <b>วันหยุดนักขัตฤกษ์</b> ที่ยังไม่มีในปฏิทินและไม่ตรงเสาร์-อาทิตย์' +
        '<br>วันสำคัญอย่างวันวาเลนไทน์หรือวันคริสต์มาส โรงเรียนยังเปิดสอนตามปกติ จึงไม่ติ๊กให้ ถ้าโรงเรียนหยุดจริงติ๊กเองได้</div>' +
      '<div class="row" style="margin-bottom:8px"><button class="sm" id="holPickOfficial">ติ๊กเฉพาะวันหยุดนักขัตฤกษ์</button>' +
        '<button class="sm" id="holPickNone">ล้างการติ๊ก</button><div class="spacer"></div><span class="badge" id="holPickCount"></span></div>' +
      '<div class="tablewrap" style="max-height:50vh"><table><thead><tr><th></th><th>วันที่</th><th>ชื่อวันหยุด</th><th>ประเภท</th><th>ผลกับตารางสอน</th></tr></thead><tbody>' +
        rows + '</tbody></table></div>',
    buttons: [{ label: 'ยกเลิก' }, { label: 'เพิ่มวันที่ติ๊กไว้ลงปฏิทิน', cls: 'primary', act(close, root) {
      const picked = $$('.hol-pick:checked', root).map(x => list[num(x.dataset.i)]).filter(Boolean);
      if (!picked.length) return toast('ยังไม่ได้ติ๊กวันไหนเลย', 'bad');
      term.holidays = Array.isArray(term.holidays) ? term.holidays : [];
      let added = 0, updated = 0;
      picked.forEach(x => {
        const found = term.holidays.find(h => h.date === x.date);
        if (found) { if (x.name && found.name !== x.name) { found.name = x.name; updated++; } }
        else { term.holidays.push({ date: x.date, name: x.name || 'วันหยุดราชการ' }); added++; }
      });
      save(true); close(); renderAdminHolidays(); renderTop();
      toast('เพิ่มวันหยุด ' + added + ' วัน' + (updated ? ' • อัปเดตชื่อ ' + updated + ' วัน' : ''), 'ok');
    } }],
    onMount(root) {
      const count = () => { $('#holPickCount', root).textContent = 'ติ๊กไว้ ' + $$('.hol-pick:checked', root).length + ' วัน'; };
      $$('.hol-pick', root).forEach(x => x.addEventListener('change', count));
      $('#holPickOfficial', root).addEventListener('click', () => {
        $$('.hol-pick', root).forEach(x => { const it = list[num(x.dataset.i)]; x.checked = !!(it && it.official && !weekendOf(it.date)); });
        count();
      });
      $('#holPickNone', root).addEventListener('click', () => { $$('.hol-pick', root).forEach(x => { x.checked = false; }); count(); });
      count();
    } });
}

      '<b>วิธีที่ 2 — ตั้งค่าให้กดดึงออนไลน์ได้ตลอด (ทำครั้งเดียว ไม่มีค่าใช้จ่าย)</b>' +

      '<li>เปิด <a href="https://console.cloud.google.com/apis/credentials?project=' + esc(project) + '" target="_blank" rel="noopener">หน้าข้อมูลรับรอง (Credentials)</a> → เลือกคีย์ที่เว็บนี้ใช้ → หัวข้อ <b>ข้อจำกัดของ API</b> → เพิ่ม <b>Google Calendar API</b> เข้าไปในรายการที่อนุญาต แล้วบันทึก</li>' +
      '<li>รอสักครู่ให้ Google อัปเดต แล้วกลับมากด <b>ดึงวันหยุดราชการจาก Google</b> อีกครั้ง</li></ol>' +

async function startGoogleHolidayImport(btn) {
  const term = currentTerm(true);
  if (!curPeriod()) return toast('กรุณาเลือกปี/ภาคเรียนก่อน', 'bad');
  if (!term.openDate || !term.closeDate) return toast('กรุณากำหนดวันเปิด-ปิดภาคเรียนก่อน ระบบจะได้ดึงเฉพาะช่วงนั้น', 'bad');
  const label = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = 'กำลังดึงจาก Google…'; }
  try {
    const events = await fetchGoogleHolidays(term.openDate, term.closeDate);
    if (!events.length) return toast('ปฏิทิน Google ไม่มีวันหยุดในช่วงเปิด-ปิดภาคเรียนนี้', 'bad');
    openHolidayImport(events, 'ดึงออนไลน์');
  } catch (e) {
    openHolidayApiHelp(e);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = label; }
  }
}

function renderAdminHolidays() {
  const box = $('#adminHolidayBox'); if (!box) return;
  const term = currentTerm(true), period = curPeriod();
  box.innerHTML = '<div class="row"><div><h3 style="margin:0">ปฏิทินวันหยุด • ' + esc(period ? 'ปี ' + period.academicYear + ' ภาค ' + period.semester : 'ยังไม่เลือกปี/ภาค') + '</h3>' +
      '<div class="hint">วันที่กำหนดไว้ที่นี่ ครูจะไม่ต้องเช็กชื่อ และระบบไม่นำไปคิดเป็นคาบเรียนของนักเรียน</div></div><div class="spacer"></div>' +
      '<span class="badge">' + sortedHolidays(term).length + ' วัน</span></div>' +
    '<div class="grid2" style="margin-top:12px"><div class="pick"><label>ตั้งแต่วันที่</label><input type="date" id="holidayFrom"></div>' +
      '<div class="pick"><label>ถึงวันที่ (เว้นว่างถ้าหยุดวันเดียว)</label><input type="date" id="holidayTo"></div>' +
      '<div class="pick"><label>ชื่อวันหยุด / เหตุผล</label><input id="holidayName" list="holidayPresets" placeholder="เช่น วันแม่แห่งชาติ" style="width:100%">' +
      '<datalist id="holidayPresets">' + HOLIDAY_PRESETS.map(x => '<option value="' + esc(x) + '">').join('') + '</datalist></div>' +
      '<div class="pick"><label>&nbsp;</label><button class="primary" id="holidayAdd" style="width:100%">+ เพิ่มวันหยุด</button></div></div>' +
    '<label style="display:block;margin:8px 0"><input type="checkbox" id="holidaySkipWeekend" checked> ข้ามเสาร์-อาทิตย์เมื่อเพิ่มเป็นช่วงวัน</label>' +
    '<div class="row" style="margin-top:4px"><button id="holidayGoogle">⤓ ดึงวันหยุดราชการจาก Google</button>' +
      '<button id="holidayIcsPick">นำเข้าไฟล์ .ics</button>' +
      '<input type="file" id="holidayIcsFile" accept=".ics,text/calendar" hidden>' +
      '<div class="spacer"></div><span class="hint">ปฏิทิน “วันหยุดในประเทศไทย” ของ Google • แสดงให้ติ๊กยืนยันก่อนเพิ่มเสมอ</span></div>' +
    '<div style="margin-top:10px">' + holidayRowsHtml(term) + '</div>' +
    '<div class="row" style="margin-top:10px"><div class="spacer"></div><button id="holidaySaveNames">บันทึกชื่อวันหยุดที่แก้ไข</button></div>';

  $('#holidayAdd', box).addEventListener('click', () => {
    const from = $('#holidayFrom', box).value, to = $('#holidayTo', box).value || from, name = $('#holidayName', box).value.trim();
    if (!from) return toast('กรุณาเลือกวันที่', 'bad');
    if (to < from) return toast('ช่วงวันที่ไม่ถูกต้อง', 'bad');
    if (!name) return toast('กรุณาระบุชื่อวันหยุดหรือเหตุผล', 'bad');
    const skipWeekend = $('#holidaySkipWeekend', box).checked;
    term.holidays = Array.isArray(term.holidays) ? term.holidays : [];
    let added = 0, updated = 0, outside = 0;
    const d = parseISODate(from), end = parseISODate(to);
    for (let guard = 0; d && end && d <= end && guard < 400; guard++, d.setDate(d.getDate() + 1)) {
      const iso = isoDate(d), day = d.getDay();
      if (skipWeekend && (day === 0 || day === 6)) continue;
      if (term.openDate && term.closeDate && (iso < term.openDate || iso > term.closeDate)) outside++;
      const found = term.holidays.find(h => h.date === iso);
      if (found) { found.name = name; updated++; } else { term.holidays.push({ date: iso, name: name }); added++; }
    }
    if (!added && !updated) return toast('ไม่มีวันที่ถูกเพิ่ม (อาจเป็นเสาร์-อาทิตย์ทั้งช่วง)', 'bad');
    save(true); renderAdminHolidays(); renderTop();
    toast('เพิ่มวันหยุด ' + added + ' วัน' + (updated ? ' • อัปเดต ' + updated : '') + (outside ? ' • มี ' + outside + ' วันอยู่นอกช่วงเปิด-ปิดภาคเรียน' : ''), outside ? 'warn' : 'ok');
  });
  $('#holidayGoogle', box).addEventListener('click', e => startGoogleHolidayImport(e.currentTarget));
  $('#holidayIcsPick', box).addEventListener('click', () => $('#holidayIcsFile', box).click());
  $('#holidayIcsFile', box).addEventListener('change', async e => {
    const file = e.target.files && e.target.files[0]; e.target.value = '';
    if (!file) return;
    const term = currentTerm(true);
    if (!term.openDate || !term.closeDate) return toast('กรุณากำหนดวันเปิด-ปิดภาคเรียนก่อน', 'bad');
    try {
      const events = await parseHolidayIcs(file);
      if (!events.length) return toast('ไม่พบรายการวันหยุดในไฟล์นี้ • ต้องเป็นไฟล์ .ics จากปฏิทิน Google', 'bad');
      openHolidayImport(events, file.name);
    } catch (err) { toast('อ่านไฟล์ไม่สำเร็จ: ' + (err && err.message ? err.message : 'รูปแบบไฟล์ไม่ถูกต้อง'), 'bad'); }
  });
  $('#holidaySaveNames', box).addEventListener('click', () => {
    $$('.holiday-name', box).forEach(inp => { const h = (term.holidays || []).find(x => x.date === inp.dataset.holidayDate); if (h) h.name = inp.value.trim(); });
    save(true); renderAdminHolidays(); toast('บันทึกชื่อวันหยุดแล้ว', 'ok');
  });
  $$('[data-del-holiday]', box).forEach(btn => btn.addEventListener('click', async () => {
    const date = btn.dataset.delHoliday, h = (term.holidays || []).find(x => x.date === date);
    if (!await confirmBox('ลบวันหยุด', 'ลบ <b>' + esc(thaiDate(date)) + (h && h.name ? ' • ' + esc(h.name) : '') + '</b> ออกจากปฏิทิน?<br>ครูจะต้องกลับมาเช็กชื่อในวันนี้ตามปกติ', 'ลบวันหยุด')) return;
    term.holidays = (term.holidays || []).filter(x => x.date !== date);
    save(true); renderAdminHolidays(); renderTop(); toast('ลบวันหยุดแล้ว', 'ok');
  }));
}

/* ---- ปฏิทินสลับวันเรียน/สลับคาบ (หน้าผู้ดูแลระบบ) ------------------------
   ใช้ตอนโรงเรียนยกตารางของอีกวันมาเรียน เช่น เอาคาบวันศุกร์มาเรียนวันพุธ
   หรือเปลี่ยนคาบชุมนุมเป็นคาบ 1 ของวันศุกร์
   กำหนดที่นี่ที่เดียว ครูทุกคนได้ตารางและคาบที่ต้องเช็กชื่อใหม่พร้อมกัน */
function dayShiftImpact(shift) {
  if (!shift || !shift.date) return { periods: 0, teachers: 0, checked: 0 };
  const list = effectiveDayEntries(shift.date, true).filter(x => x.from);
  const checked = Object.values(DB.timetable.attendance || {})
    .filter(r => r.date === shift.date && r.periodId === DB.ui.periodId).length;
  return { periods: list.length, teachers: new Set(list.map(x => x.entry.teacherId)).size, checked: checked };
}

  const box = $('#adminDayShiftBox'); if (!box) return;

      '<div class="spacer"></div><span class="badge">' + list.length + ' วัน</span><button class="primary" id="dayShiftAdd">+ เพิ่มการสลับวัน</button></div>' +

    openDayShiftEditor((term.dayShifts || []).find(x => x.id === btn.dataset.editShift) || null)));
  $$('[data-del-shift]', box).forEach(btn => btn.addEventListener('click', async () => {
    const x = (term.dayShifts || []).find(y => y.id === btn.dataset.delShift); if (!x) return;
    const im = dayShiftImpact(x);
    if (!await confirmBox('ลบการสลับวัน', 'ลบ <b>' + esc(thaiDate(x.date)) + '</b> ออกจากปฏิทินสลับวัน?<br>' +
      'ตารางของวันนั้นจะกลับไปเป็นวันปกติ' +
      (im.checked ? '<br><b>วันนี้มีการเช็กชื่อไปแล้ว ' + im.checked + ' คาบ</b> ข้อมูลที่เช็กไว้จะยังอยู่ แต่จะไม่ตรงกับตารางใหม่' : ''), 'ลบ')) return;
    term.dayShifts = (term.dayShifts || []).filter(y => y.id !== x.id);
    save(true); renderAdmin(); renderTop(); toast('ลบการสลับวันแล้ว', 'ok');
  }));
}

function openDayShiftEditor(existing) {
  const term = currentTerm(true);
  const slots = DB.timetable.slots;
  const slotOptions = sel => slots.map(s => '<option value="' + esc(s.id) + '"' + (String(sel) === String(s.id) ? ' selected' : '') + '>' + esc(s.label) + '</option>').join('');
  const dayOptions = sel => SCHOOL_DAYS.map(d => '<option value="' + d.value + '"' + (num(sel) === d.value ? ' selected' : '') + '>วัน' + esc(d.label) + '</option>').join('');
  const draft = existing ? deepCopy(existing) : { id: uid('shift'), date: DB.ui.attendanceDate || todayISO(), mode: 'day', sourceDay: 5, map: [], name: '' };
  if (!draft.map || !draft.map.length) draft.map = [{ slotId: slots[0] ? slots[0].id : '1', fromDay: 5, fromSlot: '1' }];

  const rowHtml = (m, i) => '<div class="row shift-row" data-shift-row="' + i + '" style="gap:8px;align-items:flex-end;margin-top:8px">' +
    '<div class="pick"><label>คาบของวันนี้</label><select class="sr-slot">' + slotOptions(m.slotId) + '</select></div>' +
    '<div style="padding-bottom:9px;font-weight:800;color:var(--group)">←</div>' +
    '<div class="pick"><label>ใช้ตารางของ</label><select class="sr-day">' + dayOptions(m.fromDay) + '</select></div>' +
    '<div class="pick"><label>คาบ</label><select class="sr-from">' + slotOptions(m.fromSlot) + '</select></div>' +
    '<div class="spacer"></div><button class="sm danger sr-del" title="ลบแถวนี้">✕</button></div>';

  openModal({
    title: (existing ? 'แก้ไข' : 'เพิ่ม') + 'การสลับวันเรียน / สลับคาบ', wide: true,
    bodyHTML: '<div class="grid2"><div class="pick"><label>วันที่ที่มีการสลับ</label><input type="date" id="dsDate" value="' + esc(draft.date) + '"></div>' +
      '<div class="pick"><label>ชื่อ/เหตุผล ที่จะแสดงให้ครูเห็น</label><input id="dsName" value="' + esc(draft.name || '') + '" placeholder="เช่น เรียนชดเชยตารางวันศุกร์"></div></div>' +
      '<div class="pick" style="margin-top:10px"><label>รูปแบบการสลับ</label><select id="dsMode" style="width:100%">' +
        '<option value="day"' + (draft.mode === 'day' ? ' selected' : '') + '>สลับทั้งวัน — วันนี้ใช้ตารางสอนของอีกวันทั้งวัน</option>' +
        '<option value="slots"' + (draft.mode === 'slots' ? ' selected' : '') + '>สลับเฉพาะบางคาบ — เช่น คาบชุมนุมใช้คาบ 1 ของวันศุกร์</option></select></div>' +
      '<div id="dsDayBox" class="pick" style="margin-top:10px"><label>วันนี้ใช้ตารางสอนของ</label><select id="dsSourceDay" style="width:100%">' + dayOptions(draft.sourceDay) + '</select></div>' +
      '<div id="dsSlotsBox" style="margin-top:10px"><label class="hint">ระบุเป็นคู่ ๆ ว่าคาบไหนของวันนี้ ใช้คาบไหนของวันอะไร คาบที่ไม่ได้ระบุจะเรียนตามตารางปกติของวันนั้น</label>' +
        '<div id="dsRows"></div><button class="sm" id="dsAddRow" style="margin-top:8px">+ เพิ่มคาบที่สลับ</button></div>' +
      '<div id="dsPreview" class="notice" style="margin-top:12px"></div>',
    buttons: [{ label: 'ยกเลิก' }, { label: existing ? 'บันทึกการแก้ไข' : 'เพิ่มการสลับวัน', cls: 'primary', act(close, root) {
      const date = $('#dsDate', root).value, mode = $('#dsMode', root).value, name = $('#dsName', root).value.trim();
      if (!date) return toast('กรุณาเลือกวันที่', 'bad');
      if (term.openDate && term.closeDate && (date < term.openDate || date > term.closeDate))
        return toast('วันที่อยู่นอกช่วงเปิด–ปิดภาคเรียน', 'bad');
      const clash = (term.dayShifts || []).find(x => x.date === date && x.id !== draft.id);
      if (clash) return toast('วันที่นี้มีการสลับวันอยู่แล้ว กรุณาแก้ไขรายการเดิมแทน', 'bad');
      const record = { id: draft.id, date: date, mode: mode, name: name, sourceDay: '', map: [] };
      if (mode === 'day') {
        const src = num($('#dsSourceDay', root).value);
        if ((parseISODate(date) || new Date()).getDay() === src) return toast('วันต้นทางตรงกับวันของวันที่เลือกอยู่แล้ว ไม่ต้องสลับ', 'bad');
        record.sourceDay = src;
      } else {
        const rows = $$('[data-shift-row]', root).map(r => ({
          slotId: $('.sr-slot', r).value, fromDay: num($('.sr-day', r).value), fromSlot: $('.sr-from', r).value
        })).filter(m => m.slotId && m.fromSlot);
        if (!rows.length) return toast('กรุณาระบุอย่างน้อย 1 คาบที่สลับ', 'bad');
        const targets = new Set(), sources = new Set();
        for (const m of rows) {
          if (targets.has(String(m.slotId))) return toast('มีคาบของวันนี้ซ้ำกันมากกว่า 1 แถว', 'bad');
          const key = m.fromDay + '::' + m.fromSlot;
          if (sources.has(key)) return toast('มีคาบต้นทางซ้ำกันมากกว่า 1 แถว', 'bad');
          targets.add(String(m.slotId)); sources.add(key);
        }
        record.map = rows;
      }
      term.dayShifts = (term.dayShifts || []).filter(x => x.id !== draft.id).concat([record]);
      save(true); close(); renderAdmin(); renderTop();
      toast((existing ? 'บันทึกการสลับวันแล้ว' : 'เพิ่มการสลับวันแล้ว') + ' • ' + thaiDate(date), 'ok');
    } }],
    onMount(root) {
      const rowsBox = $('#dsRows', root);
      const drawRows = () => {
        rowsBox.innerHTML = draft.map.map(rowHtml).join('');
        $$('.sr-del', rowsBox).forEach((b, i) => b.addEventListener('click', () => {
          if (draft.map.length <= 1) return toast('ต้องมีอย่างน้อย 1 คาบ', 'bad');
          collect(); draft.map.splice(i, 1); drawRows(); preview();
        }));
        $$('select', rowsBox).forEach(sel => sel.addEventListener('change', () => { collect(); preview(); }));
      };
      const collect = () => {
        draft.map = $$('[data-shift-row]', root).map(r => ({
          slotId: $('.sr-slot', r).value, fromDay: num($('.sr-day', r).value), fromSlot: $('.sr-from', r).value
        }));
      };
      const preview = () => {
        const date = $('#dsDate', root).value, mode = $('#dsMode', root).value;
        const holiday = holidayOf(date);
        const shown = mode === 'day'
          ? { mode: 'day', sourceDay: num($('#dsSourceDay', root).value) }
          : { mode: 'slots', map: draft.map };
        const weekday = (parseISODate(date) || new Date()).getDay();
        const dayLabel = (SCHOOL_DAYS.find(x => x.value === weekday) || { label: 'เสาร์-อาทิตย์' }).label;
        // นับคาบที่จะถูกยกมาจริง โดยดูจากตารางของทั้งโรงเรียน
        const all = DB.timetable.entries.filter(e => e.periodId === DB.ui.periodId);
        const moved = all.filter(e => entryRunsOn(e, weekday, shown) && num(e.day) !== weekday).length;
        const stay = all.filter(e => entryRunsOn(e, weekday, shown) && num(e.day) === weekday).length;
        $('#dsPreview', root).innerHTML = '<b>' + esc(thaiDate(date) || '—') + ' (วัน' + esc(dayLabel) + ')</b><br>' +
          esc(dayShiftText(shown)) + '<br>คาบที่ยกมาจากวันอื่น <b>' + moved + '</b> คาบ • คาบเดิมของวันนี้ที่ยังเรียนตามปกติ <b>' + stay + '</b> คาบ' +
          (holiday ? '<br><b style="color:var(--bad)">วันนี้ถูกตั้งเป็นวันหยุด (' + esc(holiday.name || '') + ') อยู่แล้ว ระบบจะยังถือว่าไม่ต้องเช็กชื่อ</b>' : '');
      };
      const applyMode = () => {
        const mode = $('#dsMode', root).value;
        $('#dsDayBox', root).hidden = mode !== 'day';
        $('#dsSlotsBox', root).hidden = mode !== 'slots';
        preview();
      };
      $('#dsAddRow', root).addEventListener('click', () => {
        collect(); draft.map.push({ slotId: slots[0] ? slots[0].id : '1', fromDay: 5, fromSlot: '1' }); drawRows(); preview();
      });
      $('#dsMode', root).addEventListener('change', applyMode);
      $('#dsDate', root).addEventListener('change', preview);
      $('#dsSourceDay', root).addEventListener('change', preview);
      drawRows(); applyMode();
    }
  });
}

/* ---- ตารางครูในหน้าผู้ดูแลระบบ: ค้นหา + เรียงลำดับ ------------------------
   ค่าที่กำลังแก้ไขในแถวจะถูกเก็บเป็นฉบับร่างไว้ก่อน จึงไม่หายเมื่อกรองหรือเรียงใหม่ */
const ADMIN_SORTS = [{ key: 'name', label: 'ชื่อ' }, { key: 'learningArea', label: 'กลุ่มสาระ' },
  { key: 'roles', label: 'บทบาท' }, { key: 'homeroomClassId', label: 'ห้องที่ปรึกษา' }];
const ADMIN_COLUMNS = [{ key: 'name', label: 'ชื่อ' }, { key: 'email', label: 'อีเมล' }, { key: '', label: 'เบอร์โทร' },
  { key: 'learningArea', label: 'กลุ่มสาระ/กลุ่มงาน' }, { key: 'roles', label: 'บทบาท' },
  { key: 'homeroomClassId', label: 'ห้องที่ปรึกษา' }, { key: '', label: '' }];
let adminTeacherDraft = {};
const adminSortKey = () => ADMIN_SORTS.some(x => x.key === DB.ui.adminSort) ? DB.ui.adminSort : 'name';
/** ค่าปัจจุบันของครู โดยใช้ฉบับร่างก่อนถ้ามีการแก้ไขค้างอยู่ */
function adminDraftValue(teacher, field) {
  const d = adminTeacherDraft[teacher.id];
  return d && d[field] !== undefined ? d[field] : teacher[field];
}
/** อ่านค่าจากแถวที่แสดงอยู่เก็บเป็นฉบับร่าง */
function collectAdminTeacherDraft() {
  $$('[data-admin-teacher]').forEach(tr => {
    const t = DB.teachers.find(x => x.id === tr.dataset.adminTeacher); if (!t) return;
    adminTeacherDraft[t.id] = { name: $('.admin-name', tr).value, email: $('.admin-email', tr).value, phone: $('.admin-phone', tr).value,
      learningArea: $('.admin-area', tr).value, homeroomClassId: $('.admin-homeroom', tr).value, roles: $$('.admin-role:checked', tr).map(x => x.value) };
  });
}
function adminTeacherList() {
  const q = String(DB.ui.adminSearch || '').trim().toLowerCase();
  const list = DB.teachers.filter(t => {
    if (!q) return true;
    return [adminDraftValue(t, 'name'), adminDraftValue(t, 'email'), adminDraftValue(t, 'phone'), adminDraftValue(t, 'learningArea')]
      .some(v => String(v || '').toLowerCase().includes(q)) || normalizeName(adminDraftValue(t, 'name')).includes(normalizeName(q));
  });
  const key = adminSortKey(), dir = DB.ui.adminSortDir === 'desc' ? -1 : 1;
  const text = t => {
    if (key === 'roles') return String((adminDraftValue(t, 'roles') || []).map(r => STAFF_ROLES.indexOf(r)).sort((a, b) => a - b)[0]);
    if (key === 'homeroomClassId') return (DB.classes.find(c => c.id === adminDraftValue(t, 'homeroomClassId')) || {}).name || 'ฮฮฮ';
    return String(adminDraftValue(t, key) || 'ฮฮฮ');
  };
  return list.sort((a, b) => text(a).localeCompare(text(b), 'th', { numeric: true }) * dir ||
    String(adminDraftValue(a, 'name') || '').localeCompare(String(adminDraftValue(b, 'name') || ''), 'th'));
}
function renderAdminTeacherRows() {
  const body = $('#adminTeacherRows'); if (!body) return;
  collectAdminTeacherDraft();
  const list = adminTeacherList(), count = $('#adminTeacherCount');
  const roleBox = (t, role, label) => '<label><input type="checkbox" class="admin-role" value="' + role + '"' + ((adminDraftValue(t, 'roles') || []).includes(role) ? ' checked' : '') + '> ' + label + '</label>';
  body.innerHTML = list.length ? list.map(t => '<tr data-admin-teacher="' + t.id + '">' +
    '<td><input class="admin-name" value="' + esc(adminDraftValue(t, 'name') || '') + '"></td>' +
    '<td><input class="admin-email" type="email" value="' + esc(adminDraftValue(t, 'email') || '') + '"></td>' +
    '<td><input class="admin-phone" value="' + esc(adminDraftValue(t, 'phone') || '') + '" style="width:130px"></td>' +
    '<td><select class="admin-area">' + learningAreaOptions(adminDraftValue(t, 'learningArea')) + '</select></td>' +
    '<td>' + roleBox(t, 'teacher', 'ครู') + ' ' + roleBox(t, 'head', 'หัวหน้ากลุ่มสาระฯ') + ' ' + roleBox(t, 'executive', 'ผู้บริหาร') + ' ' + roleBox(t, 'admin', 'แอดมิน') + '</td>' +
    '<td><select class="admin-homeroom"><option value="">— ไม่กำหนด —</option>' + sortedClassList(DB.classes).map(c => '<option value="' + c.id + '"' + (adminDraftValue(t, 'homeroomClassId') === c.id ? ' selected' : '') + '>' + esc(c.name) + ' (' + DB.teachers.filter(x => adminDraftValue(x, 'homeroomClassId') === c.id).length + '/2)</option>').join('') + '</select></td>' +
    '<td><button class="sm danger" data-del-teacher="' + t.id + '" title="ลบครูคนนี้">ลบ</button></td></tr>').join('')
    : '<tr><td colspan="7"><div class="empty">' + (DB.ui.adminSearch ? 'ไม่พบครูที่ตรงกับคำค้น “' + esc(DB.ui.adminSearch) + '”' : 'ยังไม่มีข้อมูลครู') + '</div></td></tr>';
  if (count) count.textContent = 'แสดง ' + list.length + ' จาก ' + DB.teachers.length + ' คน' +
    (DB.ui.adminSearch ? ' • คำค้น “' + DB.ui.adminSearch + '”' : '') +
    ' • เรียงตาม' + ((ADMIN_SORTS.find(x => x.key === adminSortKey()) || {}).label || '') + (DB.ui.adminSortDir === 'desc' ? ' (ฮ→ก)' : ' (ก→ฮ)');
  $$('[data-del-teacher]', body).forEach(btn => btn.addEventListener('click', () => deleteTeacherFromAdmin(btn.dataset.delTeacher)));
}

/** ลบครูออกจากระบบพร้อมข้อมูลที่ผูกกับครูคนนั้น */
async function deleteTeacherFromAdmin(id) {
  const t = DB.teachers.find(x => x.id === id); if (!t) return;
  if (DB.teachers.length === 1) return toast('ต้องมีบุคลากรอย่างน้อย 1 คนในระบบ', 'bad');
  const entries = (DB.timetable.entries || []).filter(e => e.teacherId === id).length;
  const exceptions = (DB.timetable.exceptions || []).filter(e => e.teacherId === id).length;
  const leaves = (DB.timetable.leaveRequests || []).filter(l => l.teacherId === id).length;
  const requests = (DB.timetable.exchangeRequests || []).filter(r => r.requesterTeacherId === id || r.targetTeacherId === id).length;
  const detail = '<div class="notice bad">ลบโปรไฟล์ <b>' + esc(t.name || t.email) + '</b> และข้อมูลที่ผูกกับครูคนนี้</div>' +
    '<div class="tablewrap" style="margin-top:10px"><table><tbody>' +
    '<tr><td>คาบสอนในตารางสอน</td><td><b>' + entries + '</b> คาบ (จะถูกลบ)</td></tr>' +
    '<tr><td>คาบสอนแทน/แลกคาบที่บันทึกไว้</td><td><b>' + exceptions + '</b> คาบ (จะถูกลบ)</td></tr>' +
    '<tr><td>ใบลา</td><td><b>' + leaves + '</b> ใบ (จะถูกลบ)</td></tr>' +
    '<tr><td>คำขอแลกคาบ/สอนแทน</td><td><b>' + requests + '</b> รายการ (จะถูกลบ)</td></tr>' +
    '<tr><td>คะแนนและเวลาเรียนของนักเรียน</td><td>ยังอยู่ครบ ไม่ถูกลบ</td></tr>' +
    '</tbody></table></div>';
  if (!await confirmBox('ลบครูออกจากระบบ', detail, 'ลบครูคนนี้')) return;
  DB.teachers = DB.teachers.filter(x => x.id !== id);
  delete adminTeacherDraft[id];
  DB.timetable.entries = (DB.timetable.entries || []).filter(e => e.teacherId !== id);
  DB.timetable.exceptions = (DB.timetable.exceptions || []).filter(e => e.teacherId !== id);
  DB.timetable.leaveRequests = (DB.timetable.leaveRequests || []).filter(l => l.teacherId !== id);
  DB.timetable.exchangeRequests = (DB.timetable.exchangeRequests || []).filter(r => r.requesterTeacherId !== id && r.targetTeacherId !== id);
  if (DB.ui.teacherId === id) DB.ui.teacherId = DB.teachers[0] ? DB.teachers[0].id : null;
  save(true); render(); toast('ลบครู ' + (t.name || t.email) + ' แล้ว', 'ok');
}

/* ---- คอนโซลผู้ดูแลระบบ ----------------------------------------------------
   เดิมหน้านี้เป็นการ์ด 9 ใบเรียงยาวหน้าเดียว ต้องเลื่อนหาทุกครั้ง และเรื่อง
   เดียวกันยังกระจายอยู่คนละหน้า — ข้อมูลครูอยู่ทั้งหน้านี้และหน้าตั้งค่า
   ปฏิทินภาคเรียนอยู่ในโมดัลของแท็บตารางสอน แต่วันหยุดอยู่หน้านี้
   จึงรวมเป็น 5 กลุ่มงาน ให้สิ่งที่ต้องดูพร้อมกันอยู่หน้าจอเดียวกัน */
const ADMIN_SECTIONS = [
  { key: 'people', icon: '☺', label: 'บุคลากรและสิทธิ์', hint: 'ครู • บทบาท • กลุ่มสาระ • ครูที่ปรึกษา' },
  { key: 'school', icon: '▣', label: 'โครงสร้างโรงเรียน', hint: 'ปี/ภาคเรียน • ชั้น/ห้อง • รายวิชา • ฐานนักเรียน' },
  { key: 'calendar', icon: '▦', label: 'ปฏิทินและตารางสอน', hint: 'เปิด-ปิดภาค • วันหยุด • ตารางสอนทั้งโรงเรียน' },
  { key: 'documents', icon: '▤', label: 'เอกสารและอัตลักษณ์', hint: 'ชื่อ/ตราโรงเรียน • หัวเอกสาร • ผู้ลงนาม' },
  { key: 'system', icon: '⚙', label: 'ระบบและข้อมูลกลาง', hint: 'Firebase • บุคลากรกลาง • ตรวจสุขภาพ • สำรองข้อมูล' }
];
const adminSection = () => ADMIN_SECTIONS.some(x => x.key === DB.ui.adminSection) ? DB.ui.adminSection : 'people';

/** ตัวเลขสรุปด้านบน เปลี่ยนตามกลุ่มงานที่เปิดอยู่ จะได้เห็นเฉพาะสิ่งที่เกี่ยวกับงานตรงหน้า */
function adminMetrics(section) {
  const m = (color, value, label) => '<div class="metric-card" style="--metric:var(--' + color + ')"><div class="metric-value">' + value + '</div><div class="metric-label">' + esc(label) + '</div></div>';
  if (section === 'school') {
    const students = (DB.studentMaster || []).filter(x => x.active !== false).length;
    return m('brand', DB.periods.length, 'ปี/ภาคเรียน') + m('ok', DB.classes.length, 'ชั้นเรียน') +
      m('group', DB.subjects.length, 'รายวิชา') + m('warn', students, 'นักเรียนในฐานข้อมูล');
  }
  if (section === 'calendar') {
    const term = currentTerm(false), entries = (DB.timetable.entries || []).filter(e => e.periodId === DB.ui.periodId);
    const withSchedule = new Set(entries.map(e => e.teacherId)).size;
    const noSchedule = Math.max(0, DB.teachers.length - withSchedule);
    return m(term && term.openDate && term.closeDate ? 'ok' : 'bad', term && term.openDate ? esc(thaiDate(term.openDate)) : '—', 'วันเปิดภาคเรียน') +
      m('brand', sortedHolidays(term).length, 'วันหยุดในปฏิทิน') +
      m('group', ((term || {}).dayShifts || []).length, 'วันที่สลับตาราง') +
      m(noSchedule ? 'warn' : 'ok', noSchedule, 'ครูที่ยังไม่มีตาราง');
  }
  if (section === 'documents') {
    const s = DB.settings, signers = ['headAssessmentName', 'deputyName', 'directorName'].filter(k => String(s[k] || '').trim()).length;
    return m(s.schoolName ? 'ok' : 'bad', s.schoolName ? '✓' : '—', 'ชื่อสถานศึกษา') +
      m(s.logoData ? 'ok' : 'warn', s.logoData ? '✓' : '—', 'ตราโรงเรียน') +
      m(s.printTitle ? 'ok' : 'warn', s.printTitle ? '✓' : '—', 'หัวเอกสาร ปพ.5') +
      m(signers === 3 ? 'ok' : 'warn', signers + '/3', 'ผู้ลงนามที่กรอกแล้ว');
  }
  if (section === 'system') {
    const linked = firebaseReady() && fbSignedIn();
    return m(linked ? 'ok' : 'bad', linked ? 'เชื่อมแล้ว' : 'ยังไม่เชื่อม', 'ฐานข้อมูลกลาง') +
      m('brand', DB.teachers.length, 'บุคลากรในเครื่องนี้') + m('group', (DB.auditLog || []).length, 'บันทึกตรวจสอบ') +
      m('warn', DB.periods.length, 'ชุดข้อมูลปี/ภาค');
  }
  return m('brand', DB.teachers.length, 'บุคลากร') + m('ok', DB.teachers.filter(t => teacherHasRole(t, 'teacher')).length, 'ครูผู้สอน') +
    m('group', DB.teachers.filter(t => t.homeroomClassId).length, 'ครูที่ปรึกษา') +
    m('warn', DB.classes.filter(c => !DB.teachers.some(t => t.homeroomClassId === c.id)).length, 'ห้องยังไม่มีที่ปรึกษา');
}

/* ---- คัดกรองการเช็กชื่อที่อาจโดนบั๊กติ๊กเลื่อนแถว --------------------------
   บั๊กนี้แก้ไปแล้ว แต่ข้อมูลที่บันทึกผิดไปก่อนหน้ายังผิดอยู่ และไม่มีต้นฉบับให้เทียบ

   แล้วเหลือรายการสั้นที่สุดให้ครูไปตรวจซ้ำเอง

   เกิดได้เฉพาะคาบที่ติ๊กคนไม่ได้มาตั้งแต่ 2 คนขึ้นไป เพราะการติ๊กคนแรกคือตัวที่ทำให้
   แถบสรุปสูงขึ้นและดันรายชื่อ ส่วนคาบที่เปิดมาก็มีคนไม่ได้มาอยู่แล้ว (รับช่วงมาจากคาบก่อน)
   แถบสรุปสูงเต็มตั้งแต่เปิด จึงไม่มีการเลื่อน */
const ATT_FIX_AT = '2026-08-19T13:40:51+07:00';   // เวลาที่ปล่อยตัวแก้ขึ้นเว็บ (v56)
function attendanceRecheckScan(cutoffISO) {
  const cut = cutoffISO || ATT_FIX_AT;
  const all = Object.values(DB.timetable.attendance || {});
  const byDayClass = {};
  all.forEach(r => { (byDayClass[r.date + '::' + r.classId] = byDayClass[r.date + '::' + r.classId] || []).push(r); });
  const order = DB.timetable.slots.map(x => String(x.id));
  const out = { total: all.length, old: 0, safeFew: 0, safeInherit: 0, check: [] };
  all.forEach(r => {
    if (!r.checkedAt || String(r.checkedAt) >= cut) return;
    out.old++;
    const st = r.statuses || {};
    const bad = Object.keys(st).filter(k => st[k] && st[k] !== 'present');
    if (bad.length < 2) { out.safeFew++; return; }
    // มีคาบก่อนหน้าของห้องนี้ในวันเดียวกันที่มีคนไม่ได้มาไหม ถ้ามีแปลว่าเปิดมาแถบสรุปเต็มแล้ว
    const at = order.indexOf(String(r.slotId));
    const earlier = (byDayClass[r.date + '::' + r.classId] || []).some(x => {
      if (x === r) return false;
      const xi = order.indexOf(String(x.slotId));
      if (xi < 0 || at < 0 || xi >= at) return false;
      const xs = x.statuses || {};
      return Object.keys(xs).some(k => xs[k] && xs[k] !== 'present');
    });
    if (earlier) { out.safeInherit++; return; }
    out.check.push({ rec: r, bad: bad.length });
  });
  out.check.sort((a, b) => String(b.rec.date).localeCompare(String(a.rec.date)) || b.bad - a.bad);
  return out;
}

/* ============================================================================
   16) ขออนุญาตนำนักเรียนทำกิจกรรม
   ครูลงชื่อกิจกรรม วันที่ คาบ และเลือกนักเรียนด้วยเลขประจำตัว
   นักเรียนที่ถูกเลือกจะขึ้นเป็นสถานะ "กิจกรรม" ให้ครูที่สอนคาบนั้นโดยอัตโนมัติ
   ========================================================================== */

/** กิจกรรมของภาคเรียนที่เลือกอยู่ เรียงวันล่าสุดก่อน */
function activityList(periodId) {
  return (DB.timetable.activities || [])
    .filter(a => !periodId || a.periodId === periodId)
    .sort((a, b) => String(b.date).localeCompare(String(a.date)) || String(b.createdAt).localeCompare(String(a.createdAt)));
}

/** กิจกรรมที่ครอบคลุมนักเรียนคนนี้ ในวันและคาบที่ระบุ */
function activityFor(sid, date, slotId) {
  return (DB.timetable.activities || []).find(a => a.date === date &&
    (a.slotIds || []).map(String).indexOf(String(slotId)) >= 0 &&
    (a.students || []).some(s => String(s.sid) === String(sid))) || null;
}

/** ค้นนักเรียนจากเลขประจำตัว คืนข้อมูลพร้อมห้องที่สังกัด */
function findStudentBySid(sid) {
  const key = String(sid || '').trim();
  if (!key) return null;
  const inClass = studentMatches(key)[0];
  if (inClass) return { sid: key, name: inClass.st.name || '', no: inClass.st.no || '', classId: inClass.cls.id, className: inClass.cls.name };
  const m = (DB.studentMaster || []).find(x => String(x.sid || '').trim() === key);
  if (m) { const cls = DB.classes.find(c => c.id === m.classId);
    return { sid: key, name: m.name || '', no: m.no || '', classId: m.classId || '', className: cls ? cls.name : '' }; }
  return null;
}

/** คาบที่นักเรียนคนนี้มีเรียนจริงในวันนั้น ใช้บอกครูว่ากิจกรรมกระทบวิชาใดบ้าง */
function lessonsForStudent(student, date, slotIds) {
  return effectiveDayEntries(date, true).filter(x => x.entry.classId === student.classId &&
    (slotIds || []).map(String).indexOf(x.slotId) >= 0).map(x => x.entry);
}

/** สรุปว่ากิจกรรมนี้กระทบครูและวิชาใดบ้าง เพื่อแสดงให้เห็นก่อนบันทึก */
function activityImpact(act) {
  const rows = [];
  (act.students || []).forEach(st => {
    lessonsForStudent(st, act.date, act.slotIds).forEach(e => {
      const teacher = DB.teachers.find(t => t.id === e.teacherId), subject = DB.subjects.find(s => s.id === e.subjectId);
      const slot = DB.timetable.slots.find(s => String(s.id) === String(e.slotId));
      let row = rows.find(r => r.entryId === e.id);
      if (!row) { row = { entryId: e.id, slot: slot ? slot.label : String(e.slotId),
        teacher: teacher ? (teacher.name || teacher.email) : 'ไม่พบครู',
        subject: subject ? (subject.code ? subject.code + ' ' : '') + subject.name : 'ไม่พบวิชา',
        className: (DB.classes.find(c => c.id === e.classId) || {}).name || '', count: 0 }; rows.push(row); }
      row.count++;
    });
  });
  return rows.sort((a, b) => String(a.slot).localeCompare(String(b.slot), 'th', { numeric: true }));
}

function saveActivity(act) {
  const list = DB.timetable.activities = DB.timetable.activities || [];
  const at = list.findIndex(x => x.id === act.id);
  if (at >= 0) list[at] = act; else list.push(act);
  save(true);
  if (typeof pushActivityDoc === 'function') pushActivityDoc(act);
}
