/* --- โมดัล --------------------------------------------------------------- */
let modalStack = [];
/** ล็อก/ปลดล็อกการเลื่อนของหน้าเว็บตามจำนวนหน้าต่างที่เปิดอยู่ */
let lockedScrollY = 0;
function syncModalScrollLock() {
  const on = modalStack.length > 0, was = document.body.classList.contains('modal-open');
  if (on && !was) {
    // ยึดหน้าเว็บไว้กับที่ แล้วจำตำแหน่งเดิมไว้คืนตอนปิด
    lockedScrollY = window.scrollY || window.pageYOffset || 0;
    document.body.style.top = (-lockedScrollY) + 'px';
    document.body.classList.add('modal-open');
  } else if (!on && was) {
    document.body.classList.remove('modal-open');
    document.body.style.top = '';
    window.scrollTo(0, lockedScrollY);
  }
  document.documentElement.style.overflow = on ? 'hidden' : '';
}
function openModal(opts) {
  // opts: {title, bodyHTML, buttons:[{label,cls,act(close, root)}], onMount(root), wide}
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML =
    '<div class="modal' + (opts.full ? ' modal-full' : '') + '"' + (opts.wide && !opts.full ? ' style="max-width:1100px"' : '') + '>' +
      '<header>' + esc(opts.title) + '<span class="spacer"></span>' +
        (opts.buttonsTop ? '<span class="modal-acts"></span>' : '') +
        '<button class="x" data-close>&times;</button></header>' +
      '<div class="body">' + (opts.bodyHTML || '') + '</div>' +
      '<footer></footer>' +
    '</div>';
  // ปุ่มไว้บนหัว ใช้กับหน้าที่รายการยาวมาก ครูจะได้ไม่ต้องเลื่อนลงไปหาปุ่มบันทึก
  const foot = opts.buttonsTop ? $('.modal-acts', bg) : $('footer', bg);
  if (opts.buttonsTop) $('footer', bg).remove();
  /* หน้าเว็บด้านหลังยังเลื่อนได้ขณะเปิดหน้าต่าง ทำให้มีแถบเลื่อนซ้อนกันสองอัน
     และเผลอเลื่อนพื้นหลังแทนที่จะเลื่อนรายชื่อ จึงล็อกไว้จนกว่าจะปิดหน้าต่างสุดท้าย */
  const close = () => { bg.remove(); modalStack = modalStack.filter(x => x !== bg); syncModalScrollLock(); };
  (opts.buttons || [{ label: 'ปิด' }]).forEach(b => {
    const btn = document.createElement('button');
    btn.textContent = b.label;
    if (b.cls) btn.className = b.cls;
    btn.addEventListener('click', () => { if (b.act) b.act(close, bg); else close(); });
    foot.appendChild(btn);
  });
  bg.addEventListener('click', e => {
    if (e.target === bg || e.target.hasAttribute('data-close')) close();
  });
  /* เบราว์เซอร์เก่าที่ยังไม่รู้จัก :has() หรือ overflow:clip ฉากหลังจะยังเลื่อนได้
     ถ้าถูกเลื่อน (เช่นเบราว์เซอร์เลื่อนไปหาช่องติ๊กที่โฟกัส) ให้ดึงกลับที่เดิมทันที
     หน้าต่างเช็กชื่อจะได้ไม่ลอยพ้นจอ */
  if (opts.full) bg.addEventListener('scroll', () => {
    if (bg.scrollTop || bg.scrollLeft) { bg.scrollTop = 0; bg.scrollLeft = 0; }
  }, { passive: true });
  $('#modal-root').appendChild(bg);
  modalStack.push(bg);
  syncModalScrollLock();
  if (opts.onMount) opts.onMount(bg, close);
  // หน้าต่างถูกสร้างหลัง render จึงต้องผูกช่องค้นหาให้ตรงนี้ด้วย ไม่งั้นได้รายการเลื่อนของเบราว์เซอร์
  if (typeof bindSearchableSelects === 'function') bindSearchableSelects(bg);
  return { root: bg, close };
}
function confirmBox(title, msg, okLabel) {
  return new Promise(res => {
    openModal({
      title: title,
      bodyHTML: '<div>' + msg + '</div>',
      buttons: [
        { label: 'ยกเลิก', act: c => { c(); res(false); } },
        { label: okLabel || 'ตกลง', cls: 'primary', act: c => { c(); res(true); } }
      ]
    });
  });
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && modalStack.length) { modalStack[modalStack.length - 1].remove(); modalStack.pop(); syncModalScrollLock(); }
});

/* ============================================================================
   1) ZIP / XLSX — อ่านและเขียนไฟล์ Excel โดยไม่พึ่งไลบรารีภายนอก
   .xlsx คือไฟล์ ZIP ที่ข้างในเป็น XML  เบราว์เซอร์ยุคใหม่มี DecompressionStream
   ให้คลายบีบอัด deflate ได้อยู่แล้ว จึงไม่ต้องโหลดไลบรารีจากอินเทอร์เน็ต
   ========================================================================== */

/* --- 1.1 อ่าน ZIP -------------------------------------------------------- */
function unzip(buf) {
  const u8 = new Uint8Array(buf);
  const dv = new DataView(buf);
  let eocd = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 22 - 65535); i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('ไฟล์นี้ไม่ใช่ .xlsx ที่ถูกต้อง (หาโครงสร้าง ZIP ไม่พบ)');
  const count = dv.getUint16(eocd + 10, true);
  let off = dv.getUint32(eocd + 16, true);
  const dec = new TextDecoder('utf-8');
  const files = {};
  for (let i = 0; i < count; i++) {
    if (off + 46 > u8.length || dv.getUint32(off, true) !== 0x02014b50) break;
    const method   = dv.getUint16(off + 10, true);
    const compSize = dv.getUint32(off + 20, true);
    const nameLen  = dv.getUint16(off + 28, true);
    const extraLen = dv.getUint16(off + 30, true);
    const cmtLen   = dv.getUint16(off + 32, true);
    const localOff = dv.getUint32(off + 42, true);
    const name = dec.decode(u8.subarray(off + 46, off + 46 + nameLen));
    const lnLen = dv.getUint16(localOff + 26, true);
    const leLen = dv.getUint16(localOff + 28, true);
    const start = localOff + 30 + lnLen + leLen;
    files[name] = { method: method, data: u8.subarray(start, start + compSize) };
    off += 46 + nameLen + extraLen + cmtLen;
  }
  return files;
}

async function zipText(entry) {
  if (!entry) return null;
  if (entry.method === 0) return new TextDecoder('utf-8').decode(entry.data);
  if (entry.method === 8) {
    if (typeof DecompressionStream === 'undefined')
      throw new Error('เบราว์เซอร์นี้เก่าเกินไป กรุณาใช้ Chrome / Edge / Firefox รุ่นใหม่ หรือบันทึกไฟล์เป็น .csv แทน');
    const blob = new Blob([entry.data.slice().buffer]);
    const s = blob.stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return await new Response(s).text();
  }
  throw new Error('ไฟล์ใช้วิธีบีบอัดที่ไม่รองรับ กรุณาบันทึกใหม่จาก Excel เป็น .xlsx');
}

/* --- 1.2 แปลง XLSX เป็นตาราง 2 มิติ ------------------------------------- */
function colRefToIdx(ref) {
  let n = 0;
  for (let i = 0; i < ref.length; i++) {
    const c = ref.charCodeAt(i);
    if (c >= 65 && c <= 90) n = n * 26 + (c - 64);
    else if (c >= 97 && c <= 122) n = n * 26 + (c - 96);
    else break;
  }
  return n - 1;
}
function idxToColRef(n) {
  let s = ''; n++;
  while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = (n - m - 1) / 26; }
  return s;
}

function parseSheetXml(xml, shared) {
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) throw new Error('อ่านเนื้อหาชีตไม่สำเร็จ');
  const rowsEl = doc.getElementsByTagName('row');
  const rows = [];
  for (let i = 0; i < rowsEl.length; i++) {
    const row = rowsEl[i];
    const rAttr = parseInt(row.getAttribute('r') || '0', 10);
    const rIdx = rAttr > 0 ? rAttr - 1 : rows.length;
    const arr = [];
    const cs = row.children;
    for (let j = 0; j < cs.length; j++) {
      const c = cs[j];
      if (c.nodeName !== 'c') continue;
      const ref = c.getAttribute('r') || '';
      const ci = ref ? colRefToIdx(ref) : arr.length;
      const t = c.getAttribute('t');
      let val = '';
      if (t === 'inlineStr') {
        const isEl = c.getElementsByTagName('is')[0];
        if (isEl) {
          const ts = isEl.getElementsByTagName('t');
          let s = ''; for (let k = 0; k < ts.length; k++) s += ts[k].textContent;
          val = s;
        }
      } else {
        let vEl = null;
        for (let k = 0; k < c.children.length; k++) if (c.children[k].nodeName === 'v') { vEl = c.children[k]; break; }
        const raw = vEl ? vEl.textContent : '';
        if (t === 's') val = shared[parseInt(raw, 10)] !== undefined ? shared[parseInt(raw, 10)] : '';
        else if (t === 'str' || t === 'e' || t === 'b') val = raw;
        else val = raw === '' ? '' : (isFinite(+raw) ? +raw : raw);
      }
      for (let k = arr.length; k < ci; k++) arr[k] = '';
      arr[ci] = val;
    }
    for (let k = rows.length; k < rIdx; k++) rows[k] = [];
    rows[rIdx] = arr;
  }
  for (let i = 0; i < rows.length; i++) if (!rows[i]) rows[i] = [];
  return rows;
}

/** อ่าน .xlsx -> [{name, rows}] */
async function readXlsx(arrayBuffer) {
  const files = unzip(arrayBuffer);
  const shared = [];
  const ssXml = await zipText(files['xl/sharedStrings.xml']);
  if (ssXml) {
    const doc = new DOMParser().parseFromString(ssXml, 'application/xml');
    const sis = doc.getElementsByTagName('si');
    for (let i = 0; i < sis.length; i++) {
      const ts = sis[i].getElementsByTagName('t');
      let s = '';
      for (let k = 0; k < ts.length; k++) {
        if (ts[k].parentNode && ts[k].parentNode.nodeName === 'rPh') continue;
        s += ts[k].textContent;
      }
      shared.push(s);
    }
  }
  // จับคู่ชื่อชีตกับไฟล์ผ่าน relationship id
  const relMap = {};
  const relXml = await zipText(files['xl/_rels/workbook.xml.rels']);
  if (relXml) {
    const rd = new DOMParser().parseFromString(relXml, 'application/xml');
    const rs = rd.getElementsByTagName('Relationship');
    for (let i = 0; i < rs.length; i++) {
      let tgt = rs[i].getAttribute('Target') || '';
      tgt = tgt.replace(/^\/?xl\//, '').replace(/^\.\//, '');
      relMap[rs[i].getAttribute('Id')] = 'xl/' + tgt;
    }
  }
  const out = [];
  const wbXml = await zipText(files['xl/workbook.xml']);
  if (wbXml) {
    const wd = new DOMParser().parseFromString(wbXml, 'application/xml');
    const shs = wd.getElementsByTagName('sheet');
    for (let i = 0; i < shs.length; i++) {
      const name = shs[i].getAttribute('name') || ('ชีต' + (i + 1));
      let rid = null;
      for (const a of Array.from(shs[i].attributes)) if (a.name.endsWith('id')) rid = a.value;
      const path = relMap[rid] || ('xl/worksheets/sheet' + (i + 1) + '.xml');
      const xml = await zipText(files[path]);
      out.push({ name: name, rows: xml ? parseSheetXml(xml, shared) : [] });
    }
  }
  if (!out.length) {
    const xml = await zipText(files['xl/worksheets/sheet1.xml']);
    if (xml) out.push({ name: 'ชีต1', rows: parseSheetXml(xml, shared) });
  }
  if (!out.length) throw new Error('ไม่พบชีตข้อมูลในไฟล์นี้');
  return out;
}

/* --- 1.3 เขียน ZIP (แบบไม่บีบอัด) และสร้าง .xlsx ------------------------ */
const CRC_TABLE = (function () {
  const t = new Uint32Array(256);
  for (let i = 0; i < 256; i++) {
    let c = i;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[i] = c >>> 0;
  }
  return t;
})();
function crc32(u8) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function zipStore(entries) {
  const enc = new TextEncoder();
  const parts = [], central = [];
  let offset = 0;
  for (const e of entries) {
    const nb = enc.encode(e.name);
    const crc = crc32(e.data);
    const lh = new Uint8Array(30 + nb.length);
    const dv = new DataView(lh.buffer);
    dv.setUint32(0, 0x04034b50, true); dv.setUint16(4, 20, true);
    dv.setUint16(6, 0x0800, true);     dv.setUint16(8, 0, true);
    dv.setUint16(10, 0, true);         dv.setUint16(12, 0x21, true);
    dv.setUint32(14, crc, true);
    dv.setUint32(18, e.data.length, true); dv.setUint32(22, e.data.length, true);
    dv.setUint16(26, nb.length, true); dv.setUint16(28, 0, true);
    lh.set(nb, 30);
    parts.push(lh, e.data);

    const cd = new Uint8Array(46 + nb.length);
    const cv = new DataView(cd.buffer);
    cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true);
    cv.setUint16(8, 0x0800, true);     cv.setUint16(10, 0, true);
    cv.setUint16(12, 0, true);         cv.setUint16(14, 0x21, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, e.data.length, true); cv.setUint32(24, e.data.length, true);
    cv.setUint16(28, nb.length, true); cv.setUint32(42, offset, true);
    cd.set(nb, 46);
    central.push(cd);
    offset += lh.length + e.data.length;
  }
  const cdSize = central.reduce((a, b) => a + b.length, 0);
  const eo = new Uint8Array(22);
  const ev = new DataView(eo.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(8, entries.length, true); ev.setUint16(10, entries.length, true);
  ev.setUint32(12, cdSize, true); ev.setUint32(16, offset, true);
  return new Blob(parts.concat(central, [eo]),
    { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}

const escXml = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '');

/**
 * สร้างไฟล์ .xlsx
 * sheets: [{ name, cols:[กว้าง...], freeze:{rows,cols}, rows: [ [cell,...] ] }]
 * cell: ตัวเลข | ข้อความ | null | {v, s} โดย s คือหมายเลขสไตล์ 0..4
 *   สไตล์ 0=ปกติ 1=หัวตาราง 2=ตัวหนา 3=ตัวหนากึ่งกลาง(ตัวเลข) 4=สีเทาเล็ก
 */
function buildXlsx(sheets) {
  const enc = new TextEncoder();
  const B = s => enc.encode(s);
  const files = [];

  const cellXml = (ref, cell) => {
    let v = cell, s = 0;
    if (cell && typeof cell === 'object' && !Array.isArray(cell)) { v = cell.v; s = cell.s || 0; }
    const sa = s ? ' s="' + s + '"' : '';
    if (v === null || v === undefined || v === '') return '<c r="' + ref + '"' + sa + '/>';
    if (typeof v === 'number' && isFinite(v)) return '<c r="' + ref + '"' + sa + '><v>' + v + '</v></c>';
    return '<c r="' + ref + '"' + sa + ' t="inlineStr"><is><t xml:space="preserve">' + escXml(v) + '</t></is></c>';
  };

  sheets.forEach((sh, si) => {
    let maxC = 0;
    sh.rows.forEach(r => { if (r && r.length > maxC) maxC = r.length; });
    const dim = 'A1:' + idxToColRef(Math.max(0, maxC - 1)) + Math.max(1, sh.rows.length);
    let x = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
      '<dimension ref="' + dim + '"/><sheetViews><sheetView workbookViewId="0"';
    if (si === 0) x += ' tabSelected="1"';
    x += '>';
    const fz = sh.freeze;
    if (fz && (fz.rows || fz.cols)) {
      x += '<pane' + (fz.cols ? ' xSplit="' + fz.cols + '"' : '') + (fz.rows ? ' ySplit="' + fz.rows + '"' : '') +
        ' topLeftCell="' + idxToColRef(fz.cols || 0) + ((fz.rows || 0) + 1) + '" activePane="bottomRight" state="frozen"/>';
    }
    x += '</sheetView></sheetViews><sheetFormatPr defaultRowHeight="16.5"/>';
    if (sh.cols && sh.cols.length) {
      x += '<cols>';
      sh.cols.forEach((w, i) => { x += '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + w + '" customWidth="1"/>'; });
      x += '</cols>';
    }
    x += '<sheetData>';
    sh.rows.forEach((row, ri) => {
      if (!row) return;
      x += '<row r="' + (ri + 1) + '">';
      row.forEach((cell, ci) => { x += cellXml(idxToColRef(ci) + (ri + 1), cell); });
      x += '</row>';
    });
    x += '</sheetData></worksheet>';
    files.push({ name: 'xl/worksheets/sheet' + (si + 1) + '.xml', data: B(x) });
  });

  files.push({ name: '[Content_Types].xml', data: B(
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
    '<Default Extension="xml" ContentType="application/xml"/>' +
    '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
    sheets.map((s, i) => '<Override PartName="/xl/worksheets/sheet' + (i + 1) +
      '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join('') +
    '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
    '</Types>') });

  files.push({ name: '_rels/.rels', data: B(
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
    '</Relationships>') });

  files.push({ name: 'xl/workbook.xml', data: B(
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" ' +
    'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>' +
    sheets.map((s, i) => '<sheet name="' + escXml(String(s.name).slice(0, 31).replace(/[\\\/\?\*\[\]:]/g, '_')) +
      '" sheetId="' + (i + 1) + '" r:id="rId' + (i + 1) + '"/>').join('') +
    '</sheets></workbook>') });

  files.push({ name: 'xl/_rels/workbook.xml.rels', data: B(
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    sheets.map((s, i) => '<Relationship Id="rId' + (i + 1) +
      '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet' + (i + 1) + '.xml"/>').join('') +
    '<Relationship Id="rIdS" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +
    '</Relationships>') });

  files.push({ name: 'xl/styles.xml', data: B(
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
    '<fonts count="4">' +

/* --- 1.4 CSV ------------------------------------------------------------- */
function parseCsv(text) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = [];
  let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else {
      if (c === '"') q = true;
      else if (c === ',') { row.push(cell); cell = ''; }
      else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
      else if (c === '\r') { /* ข้าม */ }
      else cell += c;
    }
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.map(r => r.map(v => {
    const t = String(v).trim();
    return t !== '' && isFinite(Number(t)) && /^-?[\d.]+$/.test(t) ? Number(t) : t;
  }));
}

function classLevel(name) {
  const text = String(name || '').replace(/\s+/g, '');
  const m = text.match(/(อนุบาล|อ|ประถม|ป|มัธยม|ม|ปวช|ปวส)\.?([1-6])/i);
  if (!m) return '';
  const prefix = /^(อนุบาล|อ)$/i.test(m[1]) ? 'อ.' : /^(ประถม|ป)$/i.test(m[1]) ? 'ป.' : /^(มัธยม|ม)$/i.test(m[1]) ? 'ม.' : m[1].toUpperCase() + '.';

}

function normalizeBook(b) {

  for (const key in d) if (b[key] === undefined) b[key] = d[key];
  b.meta = b.meta || {};
  for (const key in d.meta) if (b.meta[key] === undefined) b.meta[key] = d.meta[key];
  b.assessments = b.assessments || { traits: {}, reading: {} };
  b.componentScores = b.componentScores || {};

  if (!hadCollectSections) {

    // สมุดเดิมไม่มีการแยกช่วง: เก็บไว้ฝั่งก่อนกลางภาคทั้งหมดเพื่อไม่ให้ผลการเรียนย้อนหลังเปลี่ยน
    b.weights.before = legacyCollect; b.weights.after = 0;
  }
  b.weights.collect = num(b.weights.before) + num(b.weights.after);
  (b.items || []).forEach(it => {
    it.components = Array.isArray(it.components) ? it.components : [];

const KSA_COMPONENTS = [{ key: 'K', label: 'K • ความรู้' }, { key: 'S', label: 'S • ทักษะ' }, { key: 'A', label: 'A • เจตคติ' }];
function itemComponents(item) { return Array.isArray(item && item.components) ? item.components.filter(c => c && c.key && num(c.rawMax) > 0 && num(c.max) >= 0) : []; }
function itemScoreSection(item) { return item && item.scoreSection === 'after' ? 'after' : 'before'; }
function itemScoreComplete(book, sid, item) {
  const components = itemComponents(item);
  if (!components.length) return has(((book.scores[sid] || {})[item.id]));
  const values = (((book.componentScores || {})[sid] || {})[item.id] || {});
  return components.every(c => has(values[c.key]));
}
function itemScoreValue(book, sid, item) {
  const components = itemComponents(item);
  if (!components.length) return (book.scores[sid] || {})[item.id];
  const values = (((book.componentScores || {})[sid] || {})[item.id] || {});
  if (!components.some(c => has(values[c.key]))) return '';
  return components.reduce((sum, c) => sum + (has(values[c.key]) && num(c.rawMax) > 0 ? num(values[c.key]) * num(c.max) / num(c.rawMax) : 0), 0);
}

  book.scores[sid] = book.scores[sid] || {};
  const total = itemScoreValue(book, sid, item);
  if (total === '') delete book.scores[sid][item.id]; else book.scores[sid][item.id] = total;
  return total;
}
/**
 * คืนค่าผลคำนวณของนักเรียนหนึ่งคน
 * ปกติ:  ถ่วงน้ำหนัก = ปัดครึ่งขึ้น(ดิบ × น้ำหนัก ÷ เต็ม)  แล้วรวมได้ 100
 * โหมด "เฉพาะที่กรอกแล้ว": นับคะแนนเต็มเฉพาะหัวข้อที่มีคะแนน และตัดส่วนที่ยังไม่สอบออก
 *                            แล้วเทียบสัดส่วนกลับเป็น 100 (ใช้ดูผลระหว่างภาค)
 */
function calcRow(book, st) {
  const partial = !!book.partialMode;
  const passPct = num(book.passPercent);
  const sc = book.scores[st.sid] || {};
  const itemRetakes = (book.itemRetakes || {})[st.sid] || {};
  const unitFailed = {};
  const sectionStats = {
    before: { raw: 0, max: 0, filled: 0 },
    after: { raw: 0, max: 0, filled: 0 }
  };
  for (const it of book.items) {
    const original = itemScoreValue(book, st.sid, it);
    const g = itemScoreComplete(book, st.sid, it);
    const failed = it.kind === 'unit' && g && num(it.max) > 0 && num(original) * 100 / num(it.max) < passPct;
    unitFailed[it.id] = failed;
    const v = failed && has(itemRetakes[it.id]) ? itemRetakes[it.id] : original;
    const stat = sectionStats[itemScoreSection(it)];
    if (g) { stat.raw += num(v); stat.filled++; }
    if (!partial || g) stat.max += num(it.max);
  }
  const rawBefore = sectionStats.before.raw, maxBefore = sectionStats.before.max, filledBefore = sectionStats.before.filled;
  const rawAfter = sectionStats.after.raw, maxAfter = sectionStats.after.max, filledAfter = sectionStats.after.filled;
  const rawC = rawBefore + rawAfter, maxC = maxBefore + maxAfter, filled = filledBefore + filledAfter;
  const ex = book.exam[st.sid] || {};
  const useRetake = !!book.exams.retakeEnabled;
  const midMax = num(book.exams.midMax), finMax = num(book.exams.finalMax);
  const midFailed = has(ex.mid) && midMax > 0 && num(ex.mid) * 100 / midMax < passPct;
  const retakeUsed = useRetake && midFailed && has(ex.retake);
  // ใช้คะแนนเดิมถ้ายังไม่ซ่อม และใช้คะแนนซ่อมแทนเมื่อกรอกแล้ว (เฉพาะผู้ที่ไม่ผ่านกลางภาค)
  const midRaw = retakeUsed ? num(ex.retake) : num(ex.mid);
  const finRaw = num(ex.final); // ปลายภาคไม่มีการซ่อม

  const W = book.weights;
  const parts = [
    { raw: rawBefore, max: maxBefore, w: num(W.before), active: maxBefore > 0 && (!partial || filledBefore > 0) },
    { raw: midRaw,   max: midMax,    w: num(W.mid),    active: midMax > 0 && (!partial || has(ex.mid) || has(ex.retake)) },
    { raw: rawAfter, max: maxAfter,  w: num(W.after),  active: maxAfter > 0 && (!partial || filledAfter > 0) },
    { raw: finRaw,   max: finMax,    w: num(W.final),  active: finMax > 0 && (!partial || has(ex.final)) }
  ];
  // คะแนนถ่วงน้ำหนักก่อนปัดเศษ ใช้บวกเป็นคะแนนรวม แล้วค่อยปัดครั้งเดียว
  // (ตรงกับสมุดคะแนนเดิม เช่น 10.588 + 7.5 = 18.088 -> รวม 18 ทั้งที่ปัดแยกได้ 11 + 8 = 19)
  const exact = parts.map(p => p.max > 0 ? p.raw * p.w / p.max : 0);
  const wv = exact.map(rnd);                      // ตัวเลขรายส่วนที่แสดงในตาราง
  let sumExact = 0, actW = 0;
  parts.forEach((p, i) => { if (p.active) { sumExact += exact[i]; actW += p.w; } });
  const scaled = actW > 0 ? sumExact * 100 / actW : 0;   // เทียบกลับเป็นเต็ม 100
  const total = rnd(scaled);

  const pass = p => p.max > 0 ? (p.raw * 100 / p.max >= passPct) : null;

  let baseGrade = '–';
  for (const g of book.gradeScale) if (total >= num(g[0])) { baseGrade = g[1]; break; }
  const complete = (book.items.length > 0 || midMax > 0 || finMax > 0) && book.items.every(it => itemScoreComplete(book, st.sid, it)) &&
    (midMax <= 0 || has(ex.mid)) && (finMax <= 0 || has(ex.final));
  const remedy = (book.resultRemedy || {})[st.sid] || '';
  const grade = baseGrade === '0' && complete && !partial && remedy === 'passed' ? '1' : baseGrade;

  return {
    rawC: rawC, maxC: maxC, filled: filled, unitFailed: unitFailed,
    rawBefore: rawBefore, maxBefore: maxBefore, filledBefore: filledBefore,
    rawAfter: rawAfter, maxAfter: maxAfter, filledAfter: filledAfter,
    midRaw: midRaw, midMax: midMax, finRaw: finRaw, finMax: finMax,
    rawMid: num(ex.mid), rawRetake: num(ex.retake), midFailed: midFailed, retakeUsed: retakeUsed,
    wBefore: wv[0], wM: wv[1], wAfter: wv[2], wF: wv[3], wC: rnd(exact[0] + exact[2]),
    total: total, activeWeight: actW, pct: scaled,
    passBefore: pass(parts[0]), passM: pass(parts[1]), passAfter: pass(parts[2]), passF: pass(parts[3]), passC: pass({ raw: rawC, max: maxC }),
    baseGrade: baseGrade, grade: grade, remedy: remedy, complete: complete,
    passed: baseGrade !== '0' && baseGrade !== '–' ? true : (complete && !partial && remedy === 'passed')
  };
}

function enableRightDragScroll() {
  let drag = null;
  document.addEventListener('pointerdown', e => {
    if (e.button !== 2) return;
    const box = e.target.closest('.tablewrap');
    if (!box || box.scrollWidth <= box.clientWidth) return;
    e.preventDefault(); drag = { box: box, x: e.clientX, left: box.scrollLeft };
    box.classList.add('right-dragging');
    try { box.setPointerCapture(e.pointerId); } catch (err) { /* ไม่เป็นไร */ }
  });
  document.addEventListener('pointermove', e => {
    if (!drag) return;
    drag.box.scrollLeft = drag.left - (e.clientX - drag.x);
  });
  const stop = () => { if (drag) drag.box.classList.remove('right-dragging'); drag = null; };
  document.addEventListener('pointerup', stop); document.addEventListener('pointercancel', stop);
  document.addEventListener('contextmenu', e => { if (e.target.closest('.tablewrap')) e.preventDefault(); });
}

/* ---- เรียงชั้นเรียนตามเลขจริง -------------------------------------------
   เรียงแบบตัวอักษรจะได้ ม.1/1, ม.1/10, ม.1/11, ม.1/2 ซึ่งหาห้องยาก
   จึงแยกเลขชั้นกับเลขห้องออกมาเทียบเป็นตัวเลข */
function classOrderKey(name) {
  const m = /(\d+)\s*\/\s*(\d+)/.exec(String(name || ''));

/* ---- ช่องเลือกที่พิมพ์ค้นหาได้ ---------------------------------------------

const SEARCHABLE_MIN = 12;
function openSelectSearch(sel) {
  const opts = Array.from(sel.options).map((o, i) => ({ i: i, value: o.value, label: o.textContent, disabled: o.disabled }));
  const modal = openModal({
    title: (sel.dataset.searchTitle || 'เลือกรายการ'), wide: true,
    bodyHTML: '<div class="pick"><label>พิมพ์เพื่อค้นหา</label>' +
      '<input id="selSearchBox" type="search" placeholder="พิมพ์บางส่วนก็พอ เช่น 4/3 หรือ สุภ" style="width:100%" autocomplete="off"></div>' +
      '<div class="hint" id="selSearchCount" style="margin-top:8px"></div>' +
      '<div class="tablewrap tall" style="margin-top:6px"><div id="selSearchList" class="select-list"></div></div>',
    buttons: [{ label: 'ปิด' }],
    onMount(root, close) {
      const box = $('#selSearchBox', root), list = $('#selSearchList', root), count = $('#selSearchCount', root);
      const draw = () => {
        const q = box.value.trim().toLowerCase();
        const hit = opts.filter(o => !o.disabled && (!q || o.label.toLowerCase().indexOf(q) >= 0));
        count.textContent = 'พบ ' + hit.length + ' จาก ' + opts.filter(o => !o.disabled).length + ' รายการ';
        list.innerHTML = hit.length
          ? hit.map(o => '<button class="select-item' + (o.value === sel.value ? ' on' : '') + '" data-pick="' + o.i + '">' + esc(o.label) + '</button>').join('')
          : '<div class="empty">ไม่พบรายการที่ตรงกับที่พิมพ์</div>';
        $$('[data-pick]', list).forEach(b => b.addEventListener('click', () => {
          sel.selectedIndex = num(b.dataset.pick);
          close();
          sel.dispatchEvent(new Event('change', { bubbles: true }));
        }));
      };
      box.addEventListener('input', draw);
      // กด Enter เมื่อเหลือรายการเดียว = เลือกเลย ไม่ต้องละมือจากแป้นพิมพ์
      box.addEventListener('keydown', e => {
        if (e.key !== 'Enter') return;
        const only = $$('[data-pick]', list);
        if (only.length === 1) { e.preventDefault(); only[0].click(); }
      });
      draw(); setTimeout(() => box.focus(), 60);
    }
  });
  return modal;
}
/** ดักช่องเลือกทั้งหน้า ถ้าตัวเลือกเยอะให้เปิดแผ่นค้นหาแทน */
function bindSearchableSelects(root) {
  $$('select', root || document).forEach(sel => {
    if (sel.dataset.searchBound) return;
    sel.dataset.searchBound = '1';
    const open = e => {
      if (sel.disabled || sel.options.length < SEARCHABLE_MIN) return;
      e.preventDefault(); sel.blur(); openSelectSearch(sel);
    };
    sel.addEventListener('mousedown', open);
    sel.addEventListener('touchstart', open, { passive: false });
    sel.addEventListener('keydown', e => {
      if (sel.options.length < SEARCHABLE_MIN) return;
      if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowDown') { e.preventDefault(); openSelectSearch(sel); }
    });
  });
}

/* แท็บใดเป็นของบทบาทใด — ตั้งค่าและฐานนักเรียนย้ายไปเป็นงานของผู้ดูแลระบบ */
const TAB_ROLE = { settings: 'admin', students: 'admin', admin: 'admin', executive: 'executive', leaves: 'executive', head: 'head' };
const roleOfTab = tab => TAB_ROLE[tab] || 'teacher';
/* หน้าไหนต้องใช้ตัวเลือกอะไรบ้าง — บนมือถือจะซ่อนตัวที่หน้านั้นไม่ได้ใช้
   เพื่อให้หัวเรื่องของหน้าขึ้นมาอยู่บนสุดโดยไม่ต้องเลื่อนผ่านแถบเลือกยาว ๆ */
const TAB_PICKERS = {
  dashboard: ['period', 'class', 'subject'], scores: ['period', 'class', 'subject'],
  items: ['period', 'class', 'subject'], indicators: ['period', 'class', 'subject'],
  groups: ['period', 'class', 'subject'], assess: ['period', 'class', 'subject'],
  summary: ['period', 'class', 'subject'], students: ['period', 'class'],
  attendance: ['period'], exchange: ['period'], schedule: ['period'], activities: ['period'],
  head: ['period'], executive: ['period'], leaves: ['period'], admin: ['period'], settings: ['period']
};
const pickersForTab = tab => TAB_PICKERS[tab] || ['period', 'class', 'subject'];
const homeTabOfRole = role => role === 'executive' ? 'executive' : role === 'admin' ? 'admin' : role === 'head' ? 'head' : 'dashboard';

/* ---------- เมนูและการนำทาง ----------------------------------------------
   แถบบนเหลือเฉพาะสิ่งที่ใช้บ่อย ปุ่มอื่นย้ายเข้าเมนู ⋯
   บนมือถือใช้แถบล่าง 5 ปุ่ม ส่วนหน้าที่เหลือเปิดจากปุ่ม "เพิ่มเติม" */
const TAB_SHORT = { dashboard: 'ภาพรวม', attendance: 'เช็กชื่อ', exchange: 'แลกคาบ', scores: 'คะแนน',
  groups: 'คะแนนกลุ่ม', assess: 'คุณลักษณะ', summary: 'สรุป ปพ.5', settings: 'โปรไฟล์ครู', students: 'นักเรียน',
  schedule: 'ตารางสอน', items: 'หัวข้อคะแนน', indicators: 'ตัวชี้วัด', activities: 'กิจกรรม', head: 'กลุ่มสาระ',
  executive: 'ผู้บริหาร', leaves: 'อนุมัติลา', admin: 'ผู้ดูแลระบบ' };
const TAB_ICON = { dashboard: '◈', attendance: '◷', exchange: '⇄', scores: '✎', groups: '◉', assess: '☑',
  summary: '▤', settings: '⚙', students: '☺', schedule: '▦', items: '☰', indicators: '◇', activities: '★', head: '◆',
  executive: '◎', leaves: '✈', admin: '⚙' };
/* หมวดของเมนู "ไปที่หน้า" — เรียงตามลำดับที่ครูใช้งานจริงในหนึ่งวัน
   เดิมเป็นปุ่ม 17 อันเรียงติดกันไม่มีหัวข้อ ต้องกวาดตาอ่านทีละอันกว่าจะเจอ */
const TAB_SECTIONS = [
  { label: 'งานประจำวัน', tabs: ['dashboard', 'attendance', 'exchange', 'activities'] },
  { label: 'คะแนนและ ปพ.5', tabs: ['scores', 'items', 'indicators', 'groups', 'assess', 'summary'] },
  { label: 'ข้อมูลโรงเรียน', tabs: ['students', 'schedule', 'settings'] },
  { label: 'บริหารและอนุมัติ', tabs: ['head', 'executive', 'leaves', 'admin'] }
];

/* งานหลักของแต่ละบทบาท ใช้จัดปุ่มบนแถบล่างของมือถือ */
const PRIMARY_TABS = { teacher: ['dashboard', 'attendance', 'scores', 'exchange'],
  head: ['head', 'dashboard', 'attendance', 'scores'],
  executive: ['executive', 'leaves', 'dashboard', 'summary'],
  admin: ['admin', 'students', 'schedule', 'settings'] };

/* แท็บที่ปักหมุดไว้บนแถบเสมอ ที่เหลือเก็บในเมนู เพื่อให้แถบบนโล่งและหาของง่าย */
const PINNED_TABS = ['dashboard', 'attendance', 'scores', 'groups'];
const isPinnedTab = (tab, mode) => PINNED_TABS.indexOf(tab) >= 0 || (mode !== 'teacher' && tab === homeTabOfRole(mode));
/* ทุกหน้าที่บทบาทนี้เข้าได้ (รวมที่อยู่ในเมนู) */
const allowedTabs = () => $$('#tabs button').map(b => b.dataset.tab).filter(t => canSeeTab(t, DB.ui.staffMode || 'teacher'));
const visibleTabButtons = () => $$('#tabs button').filter(b => allowedTabs().indexOf(b.dataset.tab) >= 0);

/** ปุ่ม ☰ ข้างแถบแท็บ — โชว์เฉพาะเมื่อมีหน้าอื่นให้ไป */
function renderTabsMenu() {
  const btn = $('#tabsMore'); if (!btn) return;
  const mode = DB.ui.staffMode || 'teacher';
  btn.hidden = !allowedTabs().filter(t => !isPinnedTab(t, mode)).length;
  btn.classList.toggle('primary', allowedTabs().indexOf(DB.ui.tab) >= 0 && !isPinnedTab(DB.ui.tab, mode));
}

function renderBottomNav() {
  const nav = $('#bottomNav'); if (!nav) return;
  const visible = visibleTabButtons().map(b => b.dataset.tab);
  if (!visible.length) { nav.hidden = true; nav.innerHTML = ''; return; }
  const mode = DB.ui.staffMode || 'teacher';
  const primary = (PRIMARY_TABS[mode] || PRIMARY_TABS.teacher).filter(t => visible.indexOf(t) >= 0).slice(0, 4);
  visible.forEach(t => { if (primary.length < 4 && primary.indexOf(t) < 0) primary.push(t); });
  const badgeOf = tab => {
    const btn = $$('#tabs button').find(b => b.dataset.tab === tab), span = btn && btn.querySelector('span');
    return span && span.textContent.trim() ? '<span class="bn-dot"></span>' : '';
  };
  nav.hidden = false;
  nav.innerHTML = primary.map(t => '<button data-bottom-tab="' + t + '"' + (t === DB.ui.tab ? ' class="active"' : '') + '>' +
      '<span class="bn-ico">' + (TAB_ICON[t] || '▸') + badgeOf(t) + '</span>' + esc(TAB_SHORT[t] || t) + '</button>').join('') +
    '<button data-tab-sheet="1"' + (primary.indexOf(DB.ui.tab) < 0 ? ' class="active"' : '') + '><span class="bn-ico">☰</span>เพิ่มเติม</button>';
  $$('[data-bottom-tab]', nav).forEach(b => b.addEventListener('click', () => setTab(b.dataset.bottomTab)));
  $('[data-tab-sheet]', nav).addEventListener('click', openTabSheet);
}

/** แผ่นเมนูรวมทุกหน้าที่บทบาทนี้เข้าได้
   สร้างเป็นชั้นบนสุดของหน้าและลบทิ้งเมื่อปิด จึงไม่มีทางค้างอยู่ใต้ส่วนอื่น */
function openTabSheet() {
  closeTabSheet();
  const tabs = allowedTabs();
  const sheet = document.createElement('div');
  sheet.className = 'tabsheet';
  sheet.innerHTML = '<div class="tabsheet-inner"><div class="tabsheet-handle"></div>' +
    '<div class="tabsheet-head"><b>ไปที่หน้า</b><span class="hint">' + esc(roleLabel(DB.ui.staffMode || 'teacher')) + '</span>' +
    '<button class="sm tabsheet-close" data-sheet-close="1" aria-label="ปิดเมนู">✕</button></div>' +
    (function () {
      const left = tabs.slice();
      const groups = TAB_SECTIONS.map(sec => {
        const mine = sec.tabs.filter(t => { const at = left.indexOf(t); if (at < 0) return false; left.splice(at, 1); return true; });
        return { label: sec.label, tabs: mine };
      });
      if (left.length) groups.push({ label: 'อื่น ๆ', tabs: left });   // หน้าที่เพิ่มใหม่ยังไม่ได้จัดหมวด จะได้ไม่หายไปเงียบ ๆ
      return groups.filter(g => g.tabs.length).map(g =>
        '<div class="tabsheet-sec">' + esc(g.label) + '</div><div class="tabsheet-grid">' +
        g.tabs.map(t => '<button data-goto="' + t + '"' + (t === DB.ui.tab ? ' class="active"' : '') + '>' +
          '<span class="ts-ico">' + (TAB_ICON[t] || '▸') + '</span>' + esc(TAB_SHORT[t] || t) + '</button>').join('') +
        '</div>').join('');
    })() +
    '<div class="tabsheet-tools"><button class="sm" data-sheet-act="search">⌕ ค้นหานักเรียน</button>' +
    '<button class="sm" data-sheet-act="theme">◐ สลับโหมดสี</button>' +
    '<button class="sm" data-sheet-act="pullschool">⤓ ดึงฐานข้อมูลจากส่วนกลาง</button>' +
    '<button class="sm danger" data-sheet-act="logout">⏻ ออกจากระบบ</button></div>' +
    '<div class="tabsheet-foot"><span class="hint" data-app-version></span><div class="spacer"></div>' +
    '<button class="sm" id="sheetRefresh">ตรวจหาเวอร์ชันใหม่</button></div></div>';
  document.body.appendChild(sheet);
  const btn = $('#tabsMore'); if (btn) btn.setAttribute('aria-expanded', 'true');
  sheet.addEventListener('pointerdown', e => { if (e.target === sheet) closeTabSheet(); });
  sheet.addEventListener('click', e => { if (e.target === sheet) closeTabSheet(); });
  $$('[data-sheet-close]', sheet).forEach(b => b.addEventListener('click', closeTabSheet));
  $$('[data-goto]', sheet).forEach(b => b.addEventListener('click', () => { closeTabSheet(); setTab(b.dataset.goto); }));
  $$('[data-sheet-act]', sheet).forEach(b => b.addEventListener('click', () => {
    const act = b.dataset.sheetAct; closeTabSheet();
    if (act === 'search') return openStudentSearch();
    if (act === 'theme') { const t = $('#btnTheme'); if (t) t.click(); return; }
    if (act === 'pullschool') { setTab('dashboard'); setTimeout(() => { const b = $('#btnPullSchool'); if (b) { b.scrollIntoView({ block: 'center' }); b.click(); } }, 250); return; }
    if (act === 'logout') { const t = $('#btnStaffLogout'); if (t) t.click(); }
  }));
  const refresh = $('#sheetRefresh', sheet);
  if (refresh) refresh.addEventListener('click', () => forceAppRefresh(refresh));
  renderAppVersionChips(); askAppVersion();
}

/** ปิดแผ่นเมนูถ้าเปิดค้างอยู่ — เรียกได้ทุกที่โดยไม่ต้องรู้ว่าเปิดอยู่ไหม */
function toggleMoreMenu(open) {
  if (open === false) { closeTabSheet(); return; }
  if ($('.tabsheet')) closeTabSheet(); else openTabSheet();
}
function closeTabSheet() {
  const sheet = $('.tabsheet'); if (sheet) sheet.remove();
  const btn = $('#tabsMore'); if (btn) btn.setAttribute('aria-expanded', 'false');
}

/** ชิปบอกว่ากำลังใช้งานเป็นใครและบทบาทอะไร */
function renderWhoChip() {
  const chip = $('#whoChip'); if (!chip) return;
  const me = curTeacher();
  if (!me) { chip.hidden = true; return; }
  chip.hidden = false;
  chip.innerHTML = '<b>' + esc(me.name || me.email || 'ผู้ใช้งาน') + '</b> • ' + esc(roleLabel(DB.ui.staffMode || 'teacher'));
}

/* แอดมินเข้าได้ทุกหน้า • หัวหน้ากลุ่มสาระและผู้บริหารก็สอนหนังสือ จึงเห็นงานของครูด้วย
   ส่วนหน้าที่เป็นของบทบาทเฉพาะ จะเห็นเมื่อสวมบทบาทนั้นเท่านั้น */
function canSeeTab(tab, mode) {
  return mode === 'admin' || roleOfTab(tab) === mode || roleOfTab(tab) === 'teacher';
}

function applyRoleVisibility() {
  const mode = DB.ui.staffMode || 'teacher';
  const canSee = tab => canSeeTab(tab, mode);
  if (!canSee(DB.ui.tab || 'dashboard')) DB.ui.tab = homeTabOfRole(mode);
  $$('#tabs button').forEach(btn => {
    const tab = btn.dataset.tab;
    // แถบแท็บโชว์เฉพาะงานหลัก ที่เหลืออยู่ในเมนูข้าง ๆ
    btn.hidden = !canSee(tab) || !isPinnedTab(tab, mode);
    btn.classList.toggle('active', tab === DB.ui.tab);
  });
  renderTabsMenu();
  $$('section.tabpane').forEach(p => p.classList.toggle('active', p.id === 'pane-' + DB.ui.tab));
  // ข้อมูลหลักของโรงเรียน (ปี/ภาค ชั้นเรียน รายวิชา) แก้ได้เฉพาะผู้ดูแลระบบ
  ['#btnPeriods', '#btnClasses', '#btnSubjects'].forEach(sel => { const el = $(sel); if (el) el.hidden = mode !== 'admin'; });
  renderWhoChip();
  renderBottomNav();
}

function setStaffMode(mode) {
  const teacher = curTeacher();
  if (teacher && !teacherHasRole(teacher, mode)) return toast('โปรไฟล์นี้ไม่มีสิทธิ์ ' + roleLabel(mode), 'bad');
  DB.ui.staffMode = mode;
  setTab(homeTabOfRole(mode));
}

function setTab(t) {
  DB.ui.tab = t; save();
  $$('#tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === t));
  $$('section.tabpane').forEach(p => p.classList.toggle('active', p.id === 'pane-' + t));
  closeTabSheet();
  window.scrollTo({ top: 0, behavior: 'smooth' });
  render();
}

/** ปุ่มพิมพ์เอกสารรวม — ใช้ได้ทั้งหน้าภาพรวมและศูนย์แลกคาบ */
function bindMergeDocButton(root) {
  const btn = $('#swapMergeDoc', root); if (!btn) return;
  const picks = $$('[data-swap-pick]', root), all = $('#swapPickAll', root), count = $('#swapPickCount', root);
  const sync = () => {
    const n = picks.filter(x => x.checked).length;
    if (count) count.textContent = n ? '(' + n + ')' : '';
    if (all) all.textContent = n === picks.length && picks.length ? 'ล้างที่เลือก' : 'เลือกทั้งหมด (' + picks.length + ')';
  };
  picks.forEach(x => x.addEventListener('change', sync));
  if (all) all.addEventListener('click', () => {
    const turnOn = picks.filter(x => x.checked).length < picks.length;
    picks.forEach(x => { x.checked = turnOn; }); sync();
  });
  sync();
  btn.addEventListener('click', () => {
    const ids = $$('[data-swap-pick]', root).filter(x => x.checked).map(x => x.dataset.swapPick);
    if (!ids.length) return toast('ติ๊กเลือกคำขอที่ต้องการรวมก่อน', 'bad');
    openMergedExchangeDocument(ids);
  });
}

/** ย่อ/ขยายกล่องได้ทุกกล่องที่มีหัวข้อ และจำสถานะไว้ */
function initCollapsibles(root) {
  $$('.card', root || document).forEach(card => {
    if (card.dataset.collapsible) return;
    const head = Array.from(card.querySelectorAll('h3')).find(h => h.closest('.card') === card);
    if (!head) return;
    /* แถวบนสุดที่ครอบหัวข้ออยู่ ต้องไม่ถูกซ่อนตอนย่อ ไม่งั้นกล่องหายทั้งใบจนกดคืนไม่ได้
       เดิมอาศัยว่าหัวข้ออยู่ในลูกตัวแรกเสมอ ซึ่งไม่จริงกับกล่องที่จัดหัวเป็นแบบอื่น */
    let headRow = head; while (headRow.parentElement && headRow.parentElement !== card) headRow = headRow.parentElement;
    headRow.classList.add('card-head-row');
    if (!Array.from(card.children).some(el => el !== headRow)) return;   // ไม่มีอะไรให้ย่อ ก็ไม่ต้องมีปุ่ม
    const key = (DB.ui.tab || '') + '::' + head.textContent.trim().slice(0, 40);
    card.dataset.collapsible = key;
    const btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'sm card-collapse'; btn.textContent = '▾'; btn.title = 'ย่อ/ขยายกล่องนี้';
    head.appendChild(btn);
    if ((DB.ui.collapsed || {})[key]) card.classList.add('collapsed');
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const on = card.classList.toggle('collapsed');
      DB.ui.collapsed = DB.ui.collapsed || {};
      if (on) DB.ui.collapsed[key] = true; else delete DB.ui.collapsed[key];
      save();
    });
  });
}

function render() {
  renderTop();
  const t = DB.ui.tab || 'dashboard';
  if (t === 'dashboard') renderDashboard();
  else if (t === 'students') renderStudents();
  else if (t === 'schedule') renderSchedule();
  else if (t === 'attendance') renderAttendancePage();
  else if (t === 'exchange') renderExchangeCenter();
  else if (t === 'items') renderItems();
  else if (t === 'indicators') renderIndicators();
  else if (t === 'scores') renderScores();
  else if (t === 'groups') renderGroups();
  else if (t === 'assess') renderAssessments();
  else if (t === 'summary') renderSummary();
  else if (t === 'settings') renderSettings();
  else if (t === 'activities') renderActivities();
  else if (t === 'head') renderHeadArea();
  else if (t === 'executive') renderExecutive();
  else if (t === 'leaves') renderLeaveApprovals();
  else if (t === 'admin') renderAdmin();
  initCollapsibles();
  bindSearchableSelects();
  updateSyncFab();
  renderSyncChip();
}

/** ข้อความเมื่อยังไม่เลือกชั้น/วิชา */
function gateMsg(needSubject) {
  const missing = [];
  if (!curPeriod()) missing.push('ปี/ภาคเรียน');
  if (!curClass()) missing.push('ชั้นเรียน');
  if (needSubject && !curSubject()) missing.push('วิชา');
  if (!missing.length) return null;
  return '<div class="empty">กรุณาเลือก<b> ' + missing.join(' และ ') + ' </b>ที่แถบด้านบนก่อน<br>' +
    '<span class="hint">ยังไม่มีรายการ? กดปุ่ม “จัดการ” ข้างช่องเลือกเพื่อเพิ่มใหม่</span></div>';
}

function applyTheme(theme) {
  const value = theme === 'dark' ? 'dark' : 'light';
  // ปิดเอฟเฟกต์ค่อย ๆ เปลี่ยนสีระหว่างสลับธีมชั่วขณะ
  // ไม่งั้นสีพื้นของปุ่มที่กำลังเปลี่ยนอยู่จะค้างค่าเดิม กลายเป็นตัวหนังสือสีขาวบนพื้นขาวจนอ่านไม่ออก
  const root = document.documentElement;
  root.classList.add('theme-switching');
  root.dataset.theme = value;
  requestAnimationFrame(() => requestAnimationFrame(() => root.classList.remove('theme-switching')));
  const btn = $('#btnTheme'); if (btn) { btn.textContent = value === 'dark' ? '☀' : '◐'; btn.title = value === 'dark' ? 'ใช้โหมดสว่าง' : 'ใช้โหมดมืด'; }
}

function toggleTheme() {
  DB.settings.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  applyTheme(DB.settings.theme); save(true);
}

function openStudentSearch() {
  if (syncMasterFromClasses()) save(true);
  const all = (DB.studentMaster || []).filter(m => m.active !== false);
  const modal = openModal({ title: 'ค้นหานักเรียนทุกห้อง', wide: true,
    bodyHTML: '<div class="pick"><label>ค้นหาจากชื่อ เลขประจำตัว หรือห้อง</label><input id="globalStudentSearch" type="text" placeholder="พิมพ์อย่างน้อย 1 ตัวอักษร" style="width:100%"></div><div id="globalSearchResults" style="margin-top:12px"></div>',
    buttons: [{ label: 'ปิด' }],
    onMount(root, close) {
      const input = $('#globalStudentSearch', root), results = $('#globalSearchResults', root);
      const draw = () => {
        const q = input.value.trim().toLowerCase();
        const found = (q ? all.filter(m => {
          const cls = DB.classes.find(c => c.id === m.classId);
          return [m.name, m.sid, m.no, cls ? cls.name : ''].some(v => String(v || '').toLowerCase().includes(q));
        }) : all).slice(0, 60);
        results.innerHTML = found.length ? '<div class="search-results">' + found.map(m => {
          const cls = DB.classes.find(c => c.id === m.classId), initial = String(m.name || '?').trim().slice(0, 1);
          return '<button class="search-result" data-search-mid="' + m.id + '"><span class="student-avatar">' + esc(initial) + '</span><span><b>' + esc(m.name || 'ยังไม่ระบุชื่อ') + '</b><span class="hint" style="display:block">เลขที่ ' + esc(m.no || '–') + ' • ' + esc(m.sid || 'ไม่มีรหัส') + ' • ' + esc(cls ? cls.name : 'ยังไม่จัดห้อง') + '</span></span><span class="spacer"></span><span>เปิด ›</span></button>';
        }).join('') + '</div>' : '<div class="empty">ไม่พบนักเรียนที่ค้นหา</div>';
        $$('[data-search-mid]', results).forEach(btn => btn.addEventListener('click', () => {
          const m = all.find(x => x.id === btn.dataset.searchMid); if (!m || !m.classId) return toast('นักเรียนคนนี้ยังไม่ถูกจัดเข้าห้อง', 'bad');
          DB.ui.classId = m.classId; DB.ui.studentView = 'class'; DB.ui.focusStudentSid = m.sid; close(); setTab('students');
        }));
      };
      input.addEventListener('input', draw); draw(); input.focus();
    }
  });
  return modal;
}

/* ---------- ศูนย์แจ้งเตือน: งานที่รอเราอนุญาต รับรอง หรือตอบรับ -------------
   ครู เห็นคำขอที่ส่งถึงตัวเองและกิจกรรมที่กระทบคาบสอนของตัวเอง
   หัวหน้ากลุ่มสาระ เห็นใบลาที่รอความเห็น • ผู้บริหาร เห็นใบลาที่รออนุมัติ
   ทุกคนเห็นรายการของบทบาทที่ตนมี โดยไม่ต้องสลับบทบาทไปหาเอง */
const teacherNameOf = id => (DB.teachers.find(t => t.id === id) || {}).name || 'ครู';

/** ครูที่สอนคาบซึ่งถูกกิจกรรมนี้ดึงนักเรียนออกไป */
function activityTeacherIds(act) {
  const ids = new Set();
  (act.students || []).forEach(st => lessonsForStudent(st, act.date, act.slotIds || []).forEach(e => { if (e.teacherId) ids.add(e.teacherId); }));
  return Array.from(ids);
}
const activityAcked = (act, teacherId) => !!((act.ack || {})[teacherId]);

/** กดรับทราบกิจกรรมที่มาดึงนักเรียนในคาบของเรา */
function acknowledgeActivity(id) {
  const act = (DB.timetable.activities || []).find(a => a.id === id); if (!act) return;
  const me = curTeacher(); if (!me) return;
  act.ack = Object.assign({}, act.ack || {}); act.ack[me.id] = new Date().toISOString();
  saveActivity(act); render();
  toast('รับทราบกิจกรรมแล้ว', 'ok');
}

function pendingApprovals() {
  const me = curTeacher(); if (!me || !curPeriod()) return [];
  const swaps = DB.timetable.exchangeRequests || [], leaves = DB.timetable.leaveRequests || [];
  const list = [];

  // --- งานของครูทุกคน ---
  const incoming = swaps.filter(r => r.targetTeacherId === me.id && r.status === 'pending');
  if (incoming.length) list.push({ tone: 'bad', icon: '⇄', role: 'teacher', tab: 'exchange',
    title: 'คำขอแลกคาบ/สอนแทนรอคุณตอบรับ ' + incoming.length + ' รายการ',
    detail: incoming.slice(0, 3).map(r => 'จาก ' + teacherNameOf(r.requesterTeacherId) + ' • ' + thaiDate(r.sourceDate || r.date)).join(' • ') });

  const acts = (DB.timetable.activities || []).filter(a => a.periodId === DB.ui.periodId &&
    activityTeacherIds(a).indexOf(me.id) >= 0 && a.teacherId !== me.id && !activityAcked(a, me.id));
  acts.forEach(a => list.push({ tone: 'warn', icon: '★', role: 'teacher', tab: 'activities',
    title: 'กิจกรรม “' + (a.name || 'ไม่ระบุชื่อ') + '” ขอเวลาเรียนในคาบของคุณ',
    detail: thaiDate(a.date) + ' • ผู้ขอ ' + teacherNameOf(a.teacherId) + ' • นักเรียน ' + (a.students || []).length + ' คน',
    ackId: a.id }));

  // ลากิจ/ไปราชการ เป็นธุระของครูเอง จึงเตือนให้ไปแลกคาบด้วยตัวเอง
  const mySelfCover = myUncoveredSelfPeriods();
  if (mySelfCover.length) {
    const kinds = Array.from(new Set(mySelfCover.map(r => (EXCHANGE_REASONS.find(x => x.value === r.reason) || {}).label).filter(Boolean)));
    list.push({ tone: 'bad', icon: '⇄', role: 'teacher', tab: 'exchange',
      title: 'ต้องแลกคาบเอง ' + totalSlotCount(mySelfCover) + ' คาบ',
      detail: (kinds.length ? kinds.join(' • ') + ' — ' : '') + 'ยังไม่มีครูรับดูแล กรุณาเลือกครูท่านอื่นก่อนถึงวันลา' });
  }
  const myHeadWait = swaps.filter(r => r.requesterTeacherId === me.id && r.status === 'unassigned' &&
    r.leaveRequestId && leaveCoverMode(leaves.find(l => l.id === r.leaveRequestId)) === 'head');
  if (myHeadWait.length) list.push({ tone: 'warn', icon: '◆', role: 'teacher', tab: 'exchange',
    title: 'รอหัวหน้ากลุ่มสาระจัดครูให้ ' + totalSlotCount(myHeadWait) + ' คาบ',
    detail: 'คุณเลือกให้หัวหน้ากลุ่มสาระจัดครูแทน ยังไม่ต้องดำเนินการเอง' });

  const myDraft = leaves.filter(l => l.teacherId === me.id && ['draft', 'rejected'].indexOf((l.approval || {}).status || 'draft') >= 0);
  if (myDraft.length) list.push({ tone: 'warn', icon: '✈', role: 'teacher', tab: 'exchange',
    title: 'ใบลาของคุณยังไม่ได้ส่งให้ผู้บริหาร ' + myDraft.length + ' ใบ',
    detail: myDraft.slice(0, 3).map(l => thaiDate(l.fromDate)).join(' • ') });

  // --- เตือนสำรองข้อมูล เพราะคะแนนและการเช็กชื่อยังอยู่ในเครื่องนี้ ---
  const lastBackup = DB.settings.lastBackupAt ? new Date(DB.settings.lastBackupAt).getTime() : 0;
  const backupDays = lastBackup ? Math.floor((Date.now() - lastBackup) / 86400000) : 999;
  if (!bookSyncOn() && backupDays >= 7 && Object.keys(DB.books || {}).length)
    list.push({ tone: 'warn', icon: '⤓', role: 'teacher', tab: 'summary',
      title: lastBackup ? 'ไม่ได้สำรองข้อมูลมา ' + backupDays + ' วันแล้ว' : 'ยังไม่เคยสำรองข้อมูลในเครื่องนี้',
      detail: 'คะแนนและการเช็กชื่อเก็บอยู่ในเครื่องนี้เท่านั้น ถ้าล้างเบราว์เซอร์หรือเปลี่ยนเครื่องจะหายทั้งหมด' });

  // --- งานของหัวหน้ากลุ่มสาระ ---
  if (teacherHasRole(me, 'head')) {
    const area = teacherArea(me);
    const waiting = leaves.filter(l => (l.headApproval || {}).status === 'waiting' &&
      teacherArea(DB.teachers.find(t => t.id === l.teacherId)) === area);
    if (waiting.length) list.push({ tone: 'warn', icon: '◆', role: 'head', tab: 'head',
      title: 'ใบลารอความเห็นหัวหน้ากลุ่มสาระ ' + waiting.length + ' ใบ',
      detail: waiting.slice(0, 3).map(l => teacherNameOf(l.teacherId) + ' • ' + thaiDate(l.fromDate)).join(' • ') });
    const queue = headCoverQueue(area);
    if (queue.length) list.push({ tone: 'bad', icon: '⇄', role: 'head', tab: 'head',
      title: 'คาบรอคุณจัดครูสอนแทน ' + queue.length + ' คาบ',
      detail: queue.slice(0, 3).map(x => (x.teacher.name || 'ครู') + ' • ' + thaiDate(x.req.sourceDate || x.req.date)).join(' • ') });
  }

  // --- งานของผู้บริหาร ---
  if (teacherHasRole(me, 'executive')) {
    const submitted = leaves.filter(l => (l.approval || {}).status === 'submitted');
    if (submitted.length) list.push({ tone: 'bad', icon: '✓', role: 'executive', tab: 'leaves',
      title: 'ใบลารอผู้บริหารอนุมัติ ' + submitted.length + ' ใบ',
      detail: submitted.slice(0, 3).map(l => teacherNameOf(l.teacherId) + ' • ' + thaiDate(l.fromDate)).join(' • ') });
    const unassigned = swaps.filter(r => r.status === 'unassigned');
    if (unassigned.length) list.push({ tone: 'warn', icon: '◎', role: 'executive', tab: 'leaves',
      title: 'คาบที่ยังไม่มีครูดูแล ' + unassigned.length + ' คาบ',
      detail: 'ต้องจัดครูสอนแทนให้ครบก่อนถึงวันลา' });
  }
  return list;
}

  const items = pendingApprovals();
  if (!items.length) return '';
  return '<div class="card alert-card"><div class="row"><div><h3 style="margin:0">แจ้งเตือนที่ต้องดำเนินการ</h3>' +

      '<span class="badge bad">' + items.length + ' รายการ</span></div>' +

function bindApprovalCard(pane) {
  const items = pendingApprovals();
  $$('[data-approval-go]', pane).forEach(btn => btn.addEventListener('click', () => {
    const x = items[num(btn.dataset.approvalGo)]; if (!x) return;
    const me = curTeacher();
    if (x.role !== 'teacher' && me && teacherHasRole(me, x.role) && (DB.ui.staffMode || 'teacher') !== x.role) {
      DB.ui.staffMode = x.role;   // สลับบทบาทให้อัตโนมัติ จะได้ไม่ต้องหาเอง
    }
    setTab(x.tab);
  }));
  $$('[data-ack-act]', pane).forEach(btn => btn.addEventListener('click', () => acknowledgeActivity(btn.dataset.ackAct)));
}

/* ============================================================================
   5) จัดการชั้นเรียน / วิชา
   ========================================================================== */
/* ---- ผลกระทบก่อนลบ --------------------------------------------------------
   ข้อความว่า "พร้อมคะแนนทั้งหมด" ไม่ได้บอกว่ามากแค่ไหน ครูจึงกดลบโดยไม่รู้ว่าเสียอะไร
   นับของจริงที่จะหายไปให้ดูก่อน  kind: 'class' | 'subject' | 'period'
   (คีย์ของสมุดคะแนนคือ classId::subjectId::periodId) */
function deleteImpact(kind, id) {
  const at = kind === 'class' ? 0 : kind === 'subject' ? 1 : 2;
  const books = Object.keys(DB.books || {}).filter(k => k.split('::')[at] === id);
  let scores = 0;
  books.forEach(k => {
    const b = DB.books[k] || {};
    Object.keys(b.scores || {}).forEach(sid => { scores += Object.keys(b.scores[sid] || {}).length; });
    Object.keys(b.exam || {}).forEach(sid => { scores += Object.keys(b.exam[sid] || {}).length; });
  });
  const hit = e => kind === 'class' ? e.classId === id : kind === 'subject' ? e.subjectId === id : e.periodId === id;
  const entries = (DB.timetable.entries || []).filter(hit).concat((DB.timetable.exceptions || []).filter(hit));
  const ids = new Set(entries.map(e => e.id));
  const attendance = Object.values(DB.timetable.attendance || {}).filter(r => ids.has(r.entryId)).length;
  return {
    books: books.length, scores: scores, entries: entries.length, attendance: attendance,
    rooms: kind === 'subject' ? new Set(books.map(k => k.split('::')[0])).size : 0,
    students: kind === 'class' ? ((DB.classes.find(c => c.id === id) || {}).students || []).length : 0
  };
}
/** ดาวน์โหลดไฟล์สำรองก่อนลบของที่กู้คืนไม่ได้
    ชื่อไฟล์บอกว่าสำรองก่อนลบอะไร จะได้หาเจอตอนต้องกู้คืนจริง
    ทำก่อนแตะข้อมูลทุกครั้ง ถ้าดาวน์โหลดไม่สำเร็จก็ยังไม่ลบอะไรเลย */
function backupBeforeDelete(what) {
  const blob = new Blob([JSON.stringify(DB, null, 1)], { type: 'application/json' });
  const d = new Date(), p = n => String(n).padStart(2, '0');
  const safe = String(what || 'ลบข้อมูล').replace(/[\\/:*?"<>|]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 44);
  download(blob, 'ก่อนลบ_' + safe + '_' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) +
    '_' + p(d.getHours()) + p(d.getMinutes()) + '.json');
  DB.settings.lastBackupAt = new Date().toISOString();
  toast('สำรองข้อมูลลงไฟล์ก่อนลบแล้ว', 'ok');
}

/** บรรทัดสรุปผลกระทบ แสดงเฉพาะตัวที่มีจริง จะได้ไม่รกด้วยเลขศูนย์ */
function deleteImpactHtml(im) {
  const n = v => Number(v).toLocaleString('th-TH');
  const bits = [];
  if (im.students) bits.push('รายชื่อนักเรียน <b>' + n(im.students) + '</b> คน');
  if (im.rooms) bits.push('ห้องที่เรียนวิชานี้ <b>' + n(im.rooms) + '</b> ห้อง');
  if (im.books) bits.push('สมุดคะแนน <b>' + n(im.books) + '</b> เล่ม');
  if (im.scores) bits.push('คะแนนที่กรอกไว้ <b>' + n(im.scores) + '</b> ช่อง');
  if (im.entries) bits.push('คาบในตารางสอน <b>' + n(im.entries) + '</b> คาบ');
  if (im.attendance) bits.push('บันทึกเช็กชื่อ <b>' + n(im.attendance) + '</b> คาบ');
  if (!bits.length) return '<div class="notice ok" style="margin-top:10px">ยังไม่มีข้อมูลผูกอยู่กับรายการนี้ ลบได้ปลอดภัย ' +
    '<span class="hint">(ระบบยังดาวน์โหลดไฟล์สำรองให้ก่อนลบอยู่ดี)</span></div>';
  return '<div class="notice bad" style="margin-top:10px"><b>สิ่งที่จะถูกลบไปด้วย</b><br>' + bits.join(' • ') +
    '<br><span class="hint">การลบนี้ย้อนกลับไม่ได้ — ระบบจะดาวน์โหลดไฟล์สำรองให้อัตโนมัติก่อนลบ ' +
    'เก็บไฟล์นั้นไว้ ถ้าลบผิดให้กู้คืนได้ที่แท็บสรุป</span></div>';
}

const ATT_PICK_ORDER = ['present', 'late', 'leave', 'activity', 'absent'];
function sessionTypeLabel(type) {

}
function attendanceOutcome(pct) {
  if (pct === null || pct === undefined) return { key: 'blank', label: 'ยังไม่มีข้อมูล', cls: '' };
  if (pct < 60) return { key: 'repeat', label: 'เรียนซ้ำ', cls: 'bad' };
  if (pct < 80) return { key: 'ms', label: 'มส', cls: 'warn' };
  return { key: 'pass', label: 'ผ', cls: 'ok' };
}
function attendanceOutcomeBadge(pct) {
  const o = attendanceOutcome(pct);
  return '<span class="badge ' + o.cls + '">' + o.label + (pct === null || pct === undefined ? '' : ' • ' + fmt(pct, 1) + '%') + '</span>';
}

function currentTerm(create) {
  if (!curPeriod()) return null;
  const id = curPeriod().id;
  if (!DB.timetable.terms[id] && create) DB.timetable.terms[id] = { openDate: '', closeDate: '', holidays: [], dayShifts: [], minAttendance: 80 };
  return DB.timetable.terms[id] || null;
}

function dateForWeekday(baseISO, weekday) {
  const d = parseISODate(baseISO) || parseISODate(todayISO());
  const diff = weekday - d.getDay();
  d.setDate(d.getDate() + diff);
  return isoDate(d);
}

/* ---- ขอบเขตห้อง/วิชาตามตารางสอนของครูผู้ใช้งาน --------------------------
   บทบาทครูจะเลือกได้เฉพาะห้องและวิชาที่ตนมีคาบสอนจริงในภาคเรียนที่เลือก
   (รวมคาบสอนแทน/แลกคาบ และห้องที่ตนเป็นครูที่ปรึกษา) */
function teacherScope(teacher) {
  const me = teacher || curTeacher();
  if (!me) return null;
  const pairs = new Set(), classIds = new Set(), subjectIds = new Set();
  const add = e => { if (!e || e.teacherId !== me.id) return; if (e.classId) classIds.add(e.classId); if (e.subjectId) subjectIds.add(e.subjectId); if (e.classId && e.subjectId) pairs.add(e.classId + '::' + e.subjectId); };
  (DB.timetable.entries || []).filter(e => e.periodId === DB.ui.periodId).forEach(add);
  (DB.timetable.exceptions || []).filter(e => e.periodId === DB.ui.periodId).forEach(add);
  if (me.homeroomClassId) classIds.add(me.homeroomClassId);
  return { pairs: pairs, classIds: classIds, subjectIds: subjectIds, empty: !pairs.size && !classIds.size };
}
/** จำกัดรายการเฉพาะบทบาทครูและเมื่อมีตารางสอนแล้ว (ครูที่ยังไม่มีตารางจะไม่ถูกล็อก) */
function scopeForTeacher() {
  if ((DB.ui.staffMode || 'teacher') !== 'teacher') return null;
  const scope = teacherScope(); if (!scope || scope.empty) return null;
  return scope;
}
function scopedClasses() {

function scheduledDates(entry, untilISO) {
  const term = (DB.timetable.terms || {})[entry && entry.periodId ? entry.periodId : DB.ui.periodId] || null;
  if (!term || !term.openDate || !term.closeDate) return [];
  const start = parseISODate(term.openDate), close = parseISODate(term.closeDate);
  const until = parseISODate(untilISO);
  if (!start || !close) return [];
  const end = until && until < close ? until : close;
  const holidays = new Set((term.holidays || []).map(h => h.date));
  // การสลับวันของโรงเรียนย้ายคาบไปอยู่คนละวัน จำนวนคาบทั้งภาคและ % เวลาเรียนจึงต้องนับตามนี้ด้วย
  const shifts = {}; (term.dayShifts || []).forEach(x => { if (x && x.date) shifts[x.date] = x; });
  const out = [], d = new Date(start); let guard = 0;
  while (d <= end && guard++ < 500) {
    const key = isoDate(d);
    if (!holidays.has(key) && entryRunsOn(entry, d.getDay(), shifts[key])) out.push(key);
    d.setDate(d.getDate() + 1);
  }
  return out;
}

function previousAttendanceSnapshot(entry, date) {

  if (currentIndex <= 0) return null;
  const candidates = Object.values(DB.timetable.attendance || {}).filter(r => r.date === date && r.periodId === entry.periodId && r.classId === entry.classId && order.indexOf(String(r.slotId)) >= 0 && order.indexOf(String(r.slotId)) < currentIndex && r.statuses);
  candidates.sort((a, b) => order.indexOf(String(b.slotId)) - order.indexOf(String(a.slotId)) || String(b.checkedAt || '').localeCompare(String(a.checkedAt || '')));
  return candidates[0] || null;
}

function holidayOf(date, periodId) {

  if (!term || !date) return null;
  return (term.holidays || []).find(h => h.date === date) || null;

/** เรียงวันหยุดตามวันที่ และตัดรายการที่ไม่ใช่รูปแบบวันที่ออก */
function sortedHolidays(term) {

    .filter(h => h && /^\d{4}-\d{2}-\d{2}$/.test(h.date))
    .sort((a, b) => a.date.localeCompare(b.date));

/* ---- สลับวันเรียน / สลับคาบของโรงเรียน -----------------------------------
   บางสัปดาห์โรงเรียนยกตารางของอีกวันมาเรียน เช่น เอาคาบวันศุกร์มาเรียนวันพุธ
   ทำให้สัปดาห์นั้นมีคาบวันศุกร์สองรอบ หรือเปลี่ยนคาบชุมนุมเป็นคาบ 1 ของวันศุกร์
   ผู้ดูแลระบบกำหนดไว้ในปฏิทินภาคเรียน (term.dayShifts) จึงถูกส่งขึ้นส่วนกลาง
   พร้อมวันหยุดโดยอัตโนมัติ ครูทุกคนเห็นตรงกันทันทีโดยไม่ต้องแก้ตารางของตัวเอง
     mode 'day'   ทั้งวันใช้ตารางของ sourceDay
     mode 'slots' เฉพาะคาบที่ระบุใน map = [{ slotId, fromDay, fromSlot }]
   วันหยุดมาก่อนเสมอ ถ้าวันนั้นเป็นวันหยุดก็ยังไม่ต้องเช็กชื่อ */
function dayShiftOf(date, periodId) {
  const term = (DB.timetable.terms || {})[periodId || DB.ui.periodId];
  if (!term || !date) return null;
  return (term.dayShifts || []).find(x => x && x.date === date) || null;
}
const dayShiftRows = shift => (((shift || {}).map) || []).filter(m => m && m.slotId && m.fromDay !== '' && m.fromDay != null && m.fromSlot);

/** คาบนี้มีเรียนในวันนั้นหรือไม่ เมื่อคิดการสลับวัน/สลับคาบแล้ว */
function entryRunsOn(entry, weekday, shift) {
  if (!shift) return num(entry.day) === weekday;
  if (shift.mode === 'day') return num(entry.day) === num(shift.sourceDay);
  const rows = dayShiftRows(shift);
  if (rows.some(m => num(entry.day) === num(m.fromDay) && String(entry.slotId) === String(m.fromSlot))) return true;
  return num(entry.day) === weekday && !rows.some(m => String(m.slotId) === String(entry.slotId));
}

/** คาบประจำที่ใช้จริงในวันนั้น คืน [{ entry, slotId, from }]
    slotId = ช่องคาบที่แสดงบนตารางของวันนั้น • from = คาบต้นทางที่ถูกยกมา (null คือคาบปกติของวันนั้นเอง) */
function effectiveDayEntries(date, allTeachers) {
  const weekday = (parseISODate(date) || new Date()).getDay();
  const list = scheduleEntries(allTeachers), shift = dayShiftOf(date);
  const plain = e => ({ entry: e, slotId: String(e.slotId), from: null });
  if (!shift) return list.filter(e => num(e.day) === weekday).map(plain);
  if (shift.mode === 'day') {
    const src = num(shift.sourceDay);
    return list.filter(e => num(e.day) === src)
      .map(e => ({ entry: e, slotId: String(e.slotId), from: { day: src, slotId: String(e.slotId), mode: 'day' } }));
  }
  const rows = dayShiftRows(shift), taken = new Set(rows.map(m => String(m.slotId))), out = [];
  list.forEach(e => {
    rows.forEach(m => {
      if (num(e.day) === num(m.fromDay) && String(e.slotId) === String(m.fromSlot))
        out.push({ entry: e, slotId: String(m.slotId), from: { day: num(m.fromDay), slotId: String(m.fromSlot), mode: 'slots' } });
    });
    if (num(e.day) === weekday && !taken.has(String(e.slotId))) out.push(plain(e));
  });
  return out;
}

/** คาบของวันนั้นพร้อมตัวแปลงว่าแต่ละคาบไปตกอยู่ช่องไหนของตารางวันนี้ */
function dayEntryIndex(date, allTeachers) {
  const list = effectiveDayEntries(date, allTeachers), slotOf = {};

  return { list: list, entries: list.map(x => x.entry), slotFor: e => slotOf[e.id] || String(e.slotId) };
}

function sessionIsDue(date, entry) {
  const today = todayISO();
  if (date < today) return true;
  if (date > today) return false;
  const slot = DB.timetable.slots.find(s => s.id === String(entry.slotId));
  if (!slot) return true;
  const now = new Date();
  return now.getHours() * 60 + now.getMinutes() >= timeToMinutes(slot.end);
}

function missedAttendanceItems() {
  if (!curPeriod()) return [];
  const term = currentTerm(false);
  if (!term || !term.openDate || !term.closeDate) return [];

  const out = [];
  scheduleEntries().forEach(entry => scheduledDates(entry, until).forEach(date => {
    const key = attendanceKey(entry.id, date);
    if (!hiddenRegularEntryIds(date).has(entry.id) && sessionIsDue(date, entry) && !DB.timetable.attendance[key]) out.push({ entry: entry, date: date });
  }));

  (DB.timetable.exceptions || []).filter(e => e.periodId === DB.ui.periodId && e.teacherId === teacherId && e.date && e.date <= until).forEach(entry => {

}

function adjacentAttendanceEntries(entry) {
  if (String(entry.slotId) === 'assembly') return [entry];
  const order = DB.timetable.slots.map(s => s.id), all = scheduleEntries();
  const sameAt = index => all.find(e => e.day === entry.day && e.subjectId === entry.subjectId && e.classId === entry.classId && e.slotId === order[index]);
  let at = order.indexOf(String(entry.slotId)), left = at, right = at;
  while (left > 1 && sameAt(left - 1)) left--;
  while (right < order.length - 1 && sameAt(right + 1)) right++;
  const out = [];
  for (let i = left; i <= right; i++) { const e = sameAt(i); if (e) out.push(e); }
  return out.length ? out : [entry];
}

/* ---- ผู้ดูแลระบบดู/แก้ตารางของครูคนอื่น -----------------------------------
   ครูทั่วไปเห็นของตัวเองเสมอ ผู้ดูแลระบบเลือกได้ว่าจะดูของใคร
   คาบที่เพิ่มใหม่จะยกให้ครูคนที่กำลังดูอยู่ ไม่ใช่คนที่ล็อกอิน */
function scheduleViewTeacher() {
  const me = curTeacher();
  if ((DB.ui.staffMode || 'teacher') !== 'admin') return me;
  const picked = DB.teachers.find(t => t.id === DB.ui.scheduleTeacherId);
  return picked || me || DB.teachers[0] || null;
}
/** คาบของครูที่กำลังดูอยู่ ในปี/ภาคที่เลือก */
function scheduleViewEntries() {
  const t = scheduleViewTeacher();
  const list = DB.timetable.entries.filter(e => e.periodId === DB.ui.periodId);
  return t ? list.filter(e => e.teacherId === t.id) : list;
}
/** คาบที่ชนกันถ้าจะวางคาบนี้ลงไป — ครูสอนซ้อน หรือห้องเรียนถูกจองไปแล้ว */
function scheduleClash(day, slotId, teacherId, classId, exceptId) {
  const same = DB.timetable.entries.filter(e => e.periodId === DB.ui.periodId &&
    num(e.day) === num(day) && String(e.slotId) === String(slotId) && e.id !== exceptId);
  const teacherHit = teacherId ? same.find(e => e.teacherId === teacherId) : null;
  const classHit = classId ? same.find(e => e.classId === classId && e.teacherId !== teacherId) : null;
  return { teacher: teacherHit || null, cls: classHit || null };
}

/* ---- คาบ HomeRoom เข้าแถวเช้าของครูที่ปรึกษา -----------------------------
   ครูที่ปรึกษาเช็กชื่อตอนเช้าครั้งเดียว คาบ 1-9 ของห้องนั้นจะรับช่วงสถานะไปต่อทั้งวัน
   (ดู previousAttendanceSnapshot) ครูคนถัดไปแค่ยืนยันคนที่มาสายหรือมาทีหลัง
   คาบนี้ไม่ใช่คาบสอน จึงถูกกันออกจากภาระงานสอนและการหาครูสอนแทน */
const HOMEROOM_PLACE = 'ระดับ';
function homeroomSubject(create) {
  let sub = DB.subjects.find(x => /^homeroom$/i.test(String(x.name || '').trim()));
  if (!sub && create) { sub = { id: uid('s'), code: '', name: 'HomeRoom', gradeLevels: [] }; DB.subjects.push(sub); }
  return sub || null;
}
/** ห้องไหนควรมีคาบ HomeRoom และใครเป็นคนเช็ก
    หนึ่งห้องมีครูที่ปรึกษาได้ 2 คน แต่สร้างให้คนแรกคนเดียว เพราะเช็กชื่อซ้ำสองคนไม่มีประโยชน์ */
function homeroomPlan() {
  const byClass = {};
  DB.teachers.filter(t => t.homeroomClassId).forEach(t => {
    const cid = t.homeroomClassId;
    if (!DB.classes.some(c => c.id === cid)) return;
    (byClass[cid] = byClass[cid] || []).push(t);
  });
  const plan = [], extra = [];
  Object.keys(byClass).forEach(cid => {
    const list = byClass[cid].slice().sort((a, b) => String(a.name || '').localeCompare(String(b.name || ''), 'th'));
    plan.push({ classId: cid, teacher: list[0] });
    list.slice(1).forEach(t => extra.push(t));
  });
  return { plan: plan, extra: extra };
}
/** สร้างคาบ HomeRoom จันทร์–ศุกร์ ช่องเข้าแถวเช้า ให้ทุกห้องที่มีครูที่ปรึกษา
    เรียกซ้ำได้ ห้องที่มีอยู่แล้วจะข้าม และถ้าครูที่ปรึกษาเปลี่ยนจะย้ายเจ้าของให้ */
function buildHomeroomEntries() {
  const period = curPeriod(); if (!period) return null;
  const sub = homeroomSubject(true);
  const info = homeroomPlan();
  let added = 0, moved = 0, kept = 0;
  info.plan.forEach(p => {
    SCHOOL_DAYS.forEach(d => {
      const found = (DB.timetable.entries || []).find(e => e.periodId === period.id &&
        String(e.slotId) === 'assembly' && e.classId === p.classId && num(e.day) === d.value);
      if (found) {
        if (found.teacherId !== p.teacher.id) { found.teacherId = p.teacher.id; moved++; }
        else kept++;
        if (!found.room) found.room = HOMEROOM_PLACE;
        if (!found.subjectId) found.subjectId = sub.id;
        return;
      }
      DB.timetable.entries.push({ id: uid('tt'), periodId: period.id, teacherId: p.teacher.id,
        day: d.value, slotId: 'assembly', subjectId: sub.id, classId: p.classId, room: HOMEROOM_PLACE });
      added++;
    });
  });
  return { added: added, moved: moved, kept: kept, rooms: info.plan.length, extra: info.extra,
    noAdvisor: DB.classes.filter(c => !DB.teachers.some(t => t.homeroomClassId === c.id)).length };
}

function openExchangeRequest(date, targetSlotId, preferredClassId) {
  const me = curTeacher(); if (!me) return toast('กรุณาเลือกโปรไฟล์ครูก่อน', 'bad');
  const dayIdx = dayEntryIndex(date, true), all = dayIdx.entries, slotFor = dayIdx.slotFor;
  const targets = all.filter(e => e.teacherId !== me.id && slotFor(e) === String(targetSlotId) && (!preferredClassId || e.classId === preferredClassId));
  if (!targets.length) return toast('ไม่พบครูคนอื่นที่สอนห้องนี้ในคาบที่เลือก', 'bad');
  const label = e => {
    const t = DB.teachers.find(x => x.id === e.teacherId), s = DB.subjects.find(x => x.id === e.subjectId), c = DB.classes.find(x => x.id === e.classId), slot = DB.timetable.slots.find(x => x.id === slotFor(e));
    return (slot ? slot.label + ' • ' : '') + (c ? c.name + ' • ' : '') + (s ? (s.code ? s.code + ' ' : '') + s.name : 'ไม่พบวิชา') + ' • ' + (t ? t.name : 'ไม่พบครู');
  };
  const sourceFor = target => all.filter(e => e.teacherId === me.id && e.classId === target.classId && e.subjectId !== target.subjectId && slotFor(e) !== slotFor(target));
  openModal({ title: 'ส่งคำขอแลกคาบ • ' + thaiDate(date), bodyHTML:
    '<div class="notice">เลือกคาบของครูปลายทางและคาบของคุณ ระบบจะส่งคำขอไปที่หน้าภาพรวมของครูคนนั้น</div>' +
    '<div class="pick" style="margin-top:12px"><label>คาบของครูปลายทาง</label><select id="exchangeTarget" style="width:100%">' + targets.map(e => '<option value="' + e.id + '">' + esc(label(e)) + '</option>').join('') + '</select></div>' +
    '<div class="pick" style="margin-top:10px"><label>คาบของฉันที่จะนำไปแลก</label><select id="exchangeSource" style="width:100%"></select></div>' +
    '<div class="pick" style="margin-top:10px"><label>ข้อความถึงครูปลายทาง</label><input id="exchangeNote" style="width:100%" placeholder="เช่น ขอแลกเนื่องจากติดประชุม"></div>',
    buttons: [{ label: 'ยกเลิก' }, { label: 'ส่งคำขอ', cls: 'primary', act(close, root) {
      const target = targets.find(e => e.id === $('#exchangeTarget', root).value), source = all.find(e => e.id === $('#exchangeSource', root).value);
      if (!target || !source) return toast('ไม่พบคาบของคุณที่ใช้แลกในห้องเดียวกัน', 'bad');
      DB.timetable.exchangeRequests.push({ id: uid('swap'), periodId: DB.ui.periodId, date: date, classId: target.classId, requesterTeacherId: me.id, targetTeacherId: target.teacherId, requesterEntryId: source.id, targetEntryId: target.id, note: $('#exchangeNote', root).value.trim(), status: 'pending', createdAt: new Date().toISOString() });
      save(true); close(); renderDashboard(); toast('ส่งคำขอแลกคาบแล้ว', 'ok');
    } }],
    onMount(root) {
      const refresh = () => { const target = targets.find(e => e.id === $('#exchangeTarget', root).value), choices = target ? sourceFor(target) : []; $('#exchangeSource', root).innerHTML = choices.length ? choices.map(e => '<option value="' + e.id + '">' + esc(label(e)) + '</option>').join('') : '<option value="">— ไม่มีคาบของคุณในห้องนี้ —</option>'; };
      $('#exchangeTarget', root).addEventListener('change', refresh); refresh();
    }
  });

function respondExchangeRequest(id, accept) {
  if (blockAdminApproval()) return;
  const req = (DB.timetable.exchangeRequests || []).find(r => r.id === id); if (!req || req.status !== 'pending') return;
  req.status = accept ? 'accepted' : 'rejected'; req.respondedAt = new Date().toISOString();
  if (accept) {
    const source = DB.timetable.entries.find(e => e.id === req.requesterEntryId), target = DB.timetable.entries.find(e => e.id === req.targetEntryId);
    if (!source || !target) return toast('คาบที่ขอแลกถูกแก้ไขหรือลบไปแล้ว', 'bad');
    [
      { base: source, slotId: target.slotId, teacherId: source.teacherId },
      { base: target, slotId: source.slotId, teacherId: target.teacherId }
    ].forEach(x => DB.timetable.exceptions.push({ id: uid('xswap'), periodId: req.periodId, date: req.date, day: (parseISODate(req.date) || new Date()).getDay(), slotId: String(x.slotId), teacherId: x.teacherId, subjectId: x.base.subjectId, classId: x.base.classId, room: x.base.room || '', sessionType: 'exchange', exchangeRequestId: req.id, note: req.note || '' }));
  }
  save(true); renderDashboard(); toast(accept ? 'ยอมรับคำขอ ตารางวันดังกล่าวเปลี่ยนแล้ว' : 'ปฏิเสธคำขอแล้ว', accept ? 'ok' : '');
}

  { value: 'personal', label: 'ลากิจส่วนตัว' }, { value: 'sick', label: 'ลาป่วย' },
  { value: 'maternity', label: 'ลาคลอดบุตร' },

  return found ? found.label + (req.reason === 'other' && req.reasonOther ? ' — ' + req.reasonOther : '') : (req.reasonOther || 'ไม่ระบุเหตุผล');
}
function weekSchoolDates(baseISO) {
  const d = parseISODate(baseISO) || parseISODate(todayISO()), monday = new Date(d);
  monday.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return [0, 1, 2, 3, 4].map(n => { const x = new Date(monday); x.setDate(monday.getDate() + n); return isoDate(x); });
}
function entryDateInWeek(entry, baseISO) {
  return weekSchoolDates(baseISO)[Math.max(0, Math.min(4, num(entry.day) - 1))];
}
/* ตอนค้นหาคู่แลก/สลับคาบ ระบบเช็กความว่างหลายพันครั้ง จึงจำคาบประจำของแต่ละวันไว้ชั่วคราว */
let _dayEntryCache = null;
function dayEntriesCached(date) {
  if (!_dayEntryCache) return effectiveDayEntries(date, true);
  if (!_dayEntryCache[date]) _dayEntryCache[date] = effectiveDayEntries(date, true);
  return _dayEntryCache[date];
}
function teacherBusyAt(teacherId, date, slotId, exceptEntryId) {
  const regular = dayEntriesCached(date).some(x => x.entry.teacherId === teacherId && x.slotId === String(slotId) && x.entry.id !== exceptEntryId);
  const special = (DB.timetable.exceptions || []).some(e => e.teacherId === teacherId && e.date === date && String(e.slotId) === String(slotId));
  return regular || special;
}
function entryPeriodKind(entry) {
  const order = DB.timetable.slots.map(s => String(s.id)), at = order.indexOf(String(entry.slotId)), all = scheduleEntries(true);
  const paired = [at - 1, at + 1].some(i => i >= 0 && all.some(e => e.id !== entry.id && e.periodId === entry.periodId && e.teacherId === entry.teacherId && e.day === entry.day && e.classId === entry.classId && e.subjectId === entry.subjectId && String(e.slotId) === order[i]));
  if (paired) return { rank: 0, label: 'คาบคู่ต่อเนื่อง' };
  const n = num(entry.slotId); return { rank: n && n % 2 === 0 ? 1 : 2, label: n && n % 2 === 0 ? 'คาบคู่' : 'คาบเดี่ยว/คาบคี่' };
}
/* ---- ใครรับผิดชอบหาครูดูแลคาบ -------------------------------------------
   ลากิจและไปราชการเป็นธุระของครูเอง จึงต้องแลกคาบเอง ระบบเตือนให้ไปจัดการ
   ลาป่วยและลาคลอดเลือกได้ ว่าจะแลกเองหรือให้หัวหน้ากลุ่มสาระจัดครูแทนให้ */
const SELF_COVER_REASONS = ['personal', 'official'];
const mustCoverSelf = reason => SELF_COVER_REASONS.indexOf(reason) >= 0;
const leaveCoverMode = leave => mustCoverSelf((leave || {}).reason) ? 'self' : ((leave || {}).coverageMode === 'head' ? 'head' : 'self');
const coverModeLabel = mode => mode === 'head' ? 'หัวหน้ากลุ่มสาระจัดให้' : 'แลกคาบเอง';

/* ลำดับที่หัวหน้ากลุ่มสาระควรเลือกครูมาสอนแทน จากใกล้เคียงที่สุดไปไกลที่สุด */
const COVER_TIERS = [
  { key: 'sameAreaSameLevel', rank: 1, label: 'กลุ่มสาระเดียวกัน • สอนระดับชั้นเดียวกัน', desc: 'ใกล้เคียงที่สุด สอนต่อได้ทันที' },
  { key: 'sameAreaOtherLevel', rank: 2, label: 'กลุ่มสาระเดียวกัน • คนละระดับชั้น', desc: 'เนื้อหาเดียวกัน แต่ไม่ได้สอนระดับนี้' },
  { key: 'otherAreaSameLevel', rank: 3, label: 'ต่างกลุ่มสาระ • สอนระดับชั้นเดียวกัน', desc: 'ใช้เมื่อในกลุ่มสาระไม่มีใครว่าง' },
  { key: 'anyFree', rank: 4, label: 'ครูอื่นที่ว่างตรงคาบ', desc: 'ทางเลือกสุดท้าย' }
];
const coverTierOf = key => COVER_TIERS.find(x => x.key === key) || COVER_TIERS[3];

/** ระดับชั้นที่ครูคนนี้สอนอยู่ในภาคเรียนที่เลือก */
function teacherGradeLevels(teacherId, periodId) {
  const pid = periodId || DB.ui.periodId, out = new Set();
  (DB.timetable.entries || []).filter(e => e.teacherId === teacherId && e.periodId === pid).forEach(e => {
    const cls = DB.classes.find(c => c.id === e.classId), lv = classLevel(cls ? cls.name : '');
    if (lv) out.add(lv);

}
/** ภาระสอนแทน/แลกคาบที่ครูคนนี้รับไปแล้วในภาคนี้ ใช้กระจายงานให้ทั่วถึง */
function coverLoadOf(teacherId) {

    r.periodId === DB.ui.periodId && ['pending', 'accepted'].indexOf(r.status) >= 0).length;
}

/** ครูที่ว่างตรงคาบนั้น จัดกลุ่มตามลำดับความเหมาะสมให้หัวหน้ากลุ่มสาระเลือก */
function headCoverCandidates(source, date) {
  if (!source) return [];
  const owner = DB.teachers.find(t => t.id === source.teacherId);
  const area = teacherArea(owner) || learningAreaOf(source.subjectId, source.periodId);
  const cls = DB.classes.find(c => c.id === source.classId), level = classLevel(cls ? cls.name : '');
  return DB.teachers.filter(t => t.id !== source.teacherId && teacherHasRole(t, 'teacher') &&
      t.active !== false && !teacherBusyAt(t.id, date, source.slotId, ''))
    .map(t => {
      const sameArea = !!area && area !== 'ยังไม่ระบุกลุ่มสาระ' && teacherLearningAreas(t.id).has(area);
      const sameLevel = !!level && teacherGradeLevels(t.id).has(level);
      const key = sameArea && sameLevel ? 'sameAreaSameLevel' : sameArea ? 'sameAreaOtherLevel'
        : sameLevel ? 'otherAreaSameLevel' : 'anyFree';
      return { teacher: t, key: key, tier: coverTierOf(key), load: coverLoadOf(t.id), sameArea: sameArea, sameLevel: sameLevel };
    })
    .sort((a, b) => a.tier.rank - b.tier.rank || a.load - b.load ||
      String(a.teacher.name || '').localeCompare(String(b.teacher.name || ''), 'th'));
}

/** คาบที่รอหัวหน้ากลุ่มสาระจัดครู — เฉพาะใบลาที่เจ้าตัวเลือกให้หัวหน้าจัดให้ */
function headCoverQueue(area) {

  const byId = new Map(leaves.map(l => [l.id, l]));

      ['unassigned', 'rejected'].indexOf(r.status) >= 0 && byId.has(r.leaveRequestId))
    .filter(r => { const t = DB.teachers.find(x => x.id === r.requesterTeacherId); return !area || teacherArea(t) === area; })
    .map(r => ({ req: r, leave: byId.get(r.leaveRequestId), teacher: DB.teachers.find(x => x.id === r.requesterTeacherId) || {} }))
    .sort((a, b) => String(a.req.sourceDate || a.req.date).localeCompare(String(b.req.sourceDate || b.req.date)) ||
      num(a.req.slotId) - num(b.req.slotId));
