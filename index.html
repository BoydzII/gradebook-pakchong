    save(true); renderItems();
  }));
  $$('#gsTable [data-gdel]').forEach(btn => btn.addEventListener('click', () => {
    b.gradeScale.splice(+btn.dataset.gdel, 1); save(true); renderItems();
  }));
  $('#btnAddGrade').addEventListener('click', () => {
    b.gradeScale.push([0, '0']);
    b.gradeScale.sort((a, c) => num(c[0]) - num(a[0]));
    save(true); renderItems();
  });
  $('#btnResetGrade').addEventListener('click', () => {
    b.gradeScale = defaultBook().gradeScale; save(true); renderItems();
  });
}

/* ============================================================================
   8) แท็บกรอกคะแนน
   ========================================================================== */
function renderScores() {
  const pane = $('#pane-scores');
  const gate = gateMsg(true);
  if (gate) { pane.innerHTML = '<div class="card">' + gate + '</div>'; return; }
  const b = curBook(true);
  const sts = curStudents().slice().sort((a, c) => a.no - c.no);
  if (!sts.length) { pane.innerHTML = '<div class="card"><div class="empty">ยังไม่มีรายชื่อนักเรียน — ไปที่แท็บ <b>นักเรียน</b> เพื่อนำเข้ารายชื่อก่อน</div></div>'; return; }
  if (!b.items.length && !num(b.exams.midMax) && !num(b.exams.finalMax)) {
    pane.innerHTML = '<div class="card"><div class="empty">ยังไม่มีหัวข้อคะแนน — ไปที่แท็บ <b>หัวข้อคะแนน</b> เพื่อเพิ่มก่อน</div></div>'; return;
  }

  // สร้างคอลัมน์จริงและหัวตารางสองชั้น: ชื่อหัวข้อ > K/S/A
  const cols = [], headGroups = [];
  const addItemColumns = it => {
    let gname = null;
    if (it.kind === 'group') {
      const gs = b.groupSets.find(g => g.id === it.groupSetId);
      gname = gs ? gs.name : 'ยังไม่เลือกชุดกลุ่ม';
    }
    const components = itemComponents(it), section = itemScoreSection(it), start = cols.length;
    if (components.length) {
      components.forEach(comp => cols.push({ key: 'ksa:' + it.id + ':' + comp.key, type: 'ksa', itemId: it.id, item: it, comp: comp,
        label: comp.key, max: num(comp.rawMax), givenMax: num(comp.max), section: section, part: section, threshold: true }));
    } else {
      cols.push({ key: 'it:' + it.id, type: 'item', itemId: it.id, item: it, label: 'คะแนน', max: num(it.max), grp: it.kind === 'group',
        section: section, part: section, unit: it.kind === 'unit', threshold: true, gname: gname });
    }
    headGroups.push({ label: it.name, span: cols.length - start, item: it, section: section, part: section, grp: it.kind === 'group', gname: gname });
    if (it.kind === 'unit') {
      cols.push({ key: 'rt:' + it.id, type: 'retake', itemId: it.id, item: it, label: 'คะแนนซ่อม', max: num(it.max), unit: true, retake: true, part: section, threshold: true });
      headGroups.push({ label: 'ซ่อม ' + it.name, span: 1, retake: true, part: section });
    }
  };
  b.items.filter(it => itemScoreSection(it) === 'before').forEach(addItemColumns);
  cols.push({ key: 'calc:before', type: 'sectionTotal', section: 'before', part: 'before', label: 'คะแนนรวม', max: num(b.weights.before) });
  headGroups.push({ label: 'รวมก่อนกลางภาค', span: 1, total: true, section: 'before', part: 'before' });
  if (num(b.exams.midMax)) { cols.push({ key: 'ex:mid', type: 'exam', label: 'คะแนน', max: num(b.exams.midMax), part: 'mid', sep: true, threshold: true }); headGroups.push({ label: 'สอบกลางภาค', span: 1, exam: true, part: 'mid' }); }
  if (num(b.exams.midMax) && b.exams.retakeEnabled) { cols.push({ key: 'ex:retake', type: 'exam', label: 'คะแนนซ่อม', max: num(b.exams.midMax), part: 'mid', threshold: true }); headGroups.push({ label: 'สอบซ่อมกลางภาค', span: 1, exam: true, part: 'mid' }); }
  b.items.filter(it => itemScoreSection(it) === 'after').forEach(addItemColumns);
  cols.push({ key: 'calc:after', type: 'sectionTotal', section: 'after', part: 'after', label: 'คะแนนรวม', max: num(b.weights.after) });
  headGroups.push({ label: 'รวมหลังกลางภาค', span: 1, total: true, section: 'after', part: 'after' });
  if (num(b.exams.finalMax)) { cols.push({ key: 'ex:final', type: 'exam', label: 'คะแนน', max: num(b.exams.finalMax), part: 'final', sep: !num(b.exams.midMax), threshold: true }); headGroups.push({ label: 'สอบปลายภาค', span: 1, exam: true, part: 'final' }); }

  /* ---- ซ่อน/แสดงคะแนนแต่ละส่วน ------------------------------------------
     ตัดคอลัมน์ของส่วนที่ปิดไว้ออกตั้งแต่ตอนสร้าง ทั้งหัวตารางและช่องกรอก
     จึงยังเดินด้วยลูกศร วางจาก Excel และคำนวณได้ตามปกติ เพราะเลขคอลัมน์
     ถูกไล่ใหม่ให้ตรงกับที่เห็นจริง ไม่ใช่แค่ซ่อนด้วย CSS แล้วเหลือช่องผี
     คอลัมน์สรุปท้ายตาราง (กลาง ปลาย รวม เกรด) ยังอยู่เสมอ เพราะเป็นผลลัพธ์ ไม่ใช่ช่องกรอก */
  const SCORE_PARTS = [{ key: 'before', label: 'ก่อนกลางภาค' }, { key: 'mid', label: 'กลางภาค' },
    { key: 'after', label: 'หลังกลางภาค' }, { key: 'final', label: 'ปลายภาค' }];
  DB.ui.scoreParts = DB.ui.scoreParts || {};
  const partOn = k => DB.ui.scoreParts[k] !== false;          // ไม่เคยตั้งค่า = แสดงทุกส่วน
  const hasPart = {}; cols.forEach(c => { if (c.part && c.type !== 'sectionTotal') hasPart[c.part] = true; });
  const usableParts = SCORE_PARTS.filter(p => hasPart[p.key]);
  for (let i = cols.length - 1; i >= 0; i--) if (cols[i].part && !partOn(cols[i].part)) cols.splice(i, 1);
  for (let i = headGroups.length - 1; i >= 0; i--) if (headGroups[i].part && !partOn(headGroups[i].part)) headGroups.splice(i, 1);
  const hiddenParts = usableParts.filter(p => !partOn(p.key));
  const partToggleHtml = usableParts.length < 2 ? '' :
    '<div class="part-toggle"><span class="pt-label">แสดงคะแนนส่วน</span>' +
    usableParts.map(p => '<button data-part="' + p.key + '" class="' + (partOn(p.key) ? 'on' : '') + '" title="' +
      (partOn(p.key) ? 'กดเพื่อซ่อน' : 'กดเพื่อแสดง') + esc(p.label) + '">' + esc(p.label) + '</button>').join('') +
    (hiddenParts.length ? '<button data-part-all="1">แสดงทั้งหมด</button>' +
      '<span class="pt-hidden">ซ่อนอยู่ ' + hiddenParts.length + ' ส่วน</span>' : '') + '</div>';

  const head =
    '<tr>' +
    '<th class="c-no" rowspan="2">เลขที่</th><th class="c-name" rowspan="2">ชื่อ-นามสกุล</th>' +
    headGroups.map(g => '<th colspan="' + g.span + '" class="score-group-head ' + (g.item ? 'item-group-head ' + g.section : '') + (g.total ? 'section-total ' + g.section : '') + (g.grp ? ' grpcol' : '') + '" title="' + esc(g.label + (g.gname ? ' • คะแนนกลุ่ม: ' + g.gname : '')) + '">' +
      '<span class="item-title">' + esc(g.label) + '</span>' + (g.item ? '<span class="hmax">' + (g.section === 'after' ? 'หลังกลางภาค' : 'ก่อนกลางภาค') + ' • รวมได้ ' + fmt(g.item.max) + '</span>' : '') + '</th>').join('') +
    '<th class="calc-head" rowspan="2">กลาง<span class="hmax">เต็ม ' + fmt(b.weights.mid) + '</span></th>' +
    '<th class="calc-head" rowspan="2">ปลาย<span class="hmax">เต็ม ' + fmt(b.weights.final) + '</span></th>' +
    '<th class="calc-head" rowspan="2">รวม<span class="hmax">เต็ม 100</span></th>' +
    '<th class="calc-head" rowspan="2">เกรด</th></tr>' +
    '<tr>' + cols.map(c => '<th class="' + (c.type === 'ksa' ? 'ksa-subhead ' : '') + (c.type === 'sectionTotal' ? 'section-total ' + c.section + ' ' : '') + (c.grp ? 'grpcol ' : '') + (c.sep ? 'sepcol' : '') + '">' +
      esc(c.label) + (c.type === 'ksa' ? '<span class="hmax">' + fmt(c.max) + '</span>' : '<span class="hmax">เต็ม ' + fmt(c.max) + '</span>') + '</th>').join('') + '</tr>';

  const rowHtml = (st, ri) => {
    const sc = b.scores[st.sid] || {};
    const itemRetakes = b.itemRetakes[st.sid] || {};
    const ex = b.exam[st.sid] || {};
    const r = calcRow(b, st);
    return '<tr data-sid="' + esc(st.sid) + '">' +
      '<td class="c-no">' + esc(st.no) + '</td>' +
      '<td class="c-name" title="' + esc(st.name) + '">' + esc(st.name || '(ไม่มีชื่อ)') + '</td>' +
      cols.map((c, ci) => {
        const item = c.itemId ? b.items.find(it => it.id === c.itemId) : null;
        if (c.type === 'sectionTotal') {
          const sectionFailed = c.section === 'after' ? r.filledAfter > 0 && r.passAfter === false : r.filledBefore > 0 && r.passBefore === false;
          return '<td class="calc section-total ' + c.section + ' sepcol' + (sectionFailed ? ' score-fail' : '') + '" data-calc="' + c.section + '">' + fmt(c.section === 'after' ? r.wAfter : r.wBefore) + '</td>';
        }
        const values = item ? (((b.componentScores || {})[st.sid] || {})[item.id] || {}) : {};
        const v = c.type === 'ksa' ? values[c.comp.key] : c.key.startsWith('it:') ? itemScoreValue(b, st.sid, item) :
          (c.key.startsWith('rt:') ? itemRetakes[c.key.slice(3)] : ex[c.key.slice(3)]);
        const over = has(v) && num(v) > c.max;
        const scoredTotal = item ? itemScoreValue(b, st.sid, item) : v;
        const componentFailed = c.type === 'ksa' && has(v) && c.max > 0 && num(v) * 100 / c.max < num(b.passPercent);
        const failExam = c.type === 'ksa' ? componentFailed : c.threshold && has(scoredTotal) && (item ? num(item.max) : c.max) > 0 && num(scoredTotal) * 100 / (item ? num(item.max) : c.max) < num(b.passPercent);
        const disabled = (c.key === 'ex:retake' && !r.midFailed) || (c.retake && !r.unitFailed[c.itemId]);
        if (c.type === 'ksa') {
          return '<td class="ksa-cell"><input class="cell ksa-raw' + (over ? ' over' : '') + (failExam ? ' fail' : '') + '" type="text" inputmode="decimal" data-r="' + ri + '" data-c="' + ci + '" data-key="' + c.key + '" data-item="' + c.itemId + '" data-comp="' + c.comp.key + '" data-rawmax="' + c.max + '" value="' + (has(v) ? esc(v) : '') + '" title="คะแนนดิบเต็ม ' + fmt(c.max) + '"></td>';
        }
        return '<td class="' + (c.grp ? 'gcell ' : '') + (c.sep ? 'sepcol' : '') + '">' +
          '<input class="cell' + (over ? ' over' : '') + (failExam ? ' fail' : '') + '" type="text" inputmode="decimal" ' +
          'data-r="' + ri + '" data-c="' + ci + '" data-key="' + c.key + '" data-max="' + c.max + '" ' +
          (c.threshold ? 'data-threshold="1" ' : '') +
          (disabled ? 'disabled title="กรอกซ่อมได้เมื่อคะแนน' + (c.retake ? 'สอบรายหน่วย' : 'กลางภาค') + 'ต่ำกว่าเกณฑ์เท่านั้น" ' : '') +
          'value="' + (has(v) ? esc(v) : '') + '"></td>';
      }).join('') +
      '<td class="calc' + ((has(ex.mid) || has(ex.retake)) && r.passM === false ? ' score-fail' : '') + '" data-calc="mid">' + fmt(r.wM) + '</td>' +
      '<td class="calc' + (has(ex.final) && r.passF === false ? ' score-fail' : '') + '" data-calc="final">' + fmt(r.wF) + '</td>' +
      '<td class="calc" data-calc="total">' + fmt(r.total) + '</td>' +
      '<td class="calc" data-calc="grade"><span class="badge ' + (r.passed ? 'ok' : 'bad') + '">' + esc(r.grade) + '</span></td>' +
      '</tr>';
  };

  pane.innerHTML =
    '<div class="card">' +
      '<div class="row">' +
        '<h3 style="margin:0">กรอกคะแนน <span class="sub">' + esc(curSubject().name) + ' • ' + esc(curClass().name) + ' • ' + sts.length + ' คน</span></h3>' +
        '<div class="spacer"></div>' +
        '<label title="เหมาะกับการดูผลระหว่างภาค: ไม่นับคะแนนเต็มของหัวข้อที่ยังไม่ได้กรอก และตัดการสอบที่ยังไม่ถึงออก">' +
          '<input type="checkbox" id="pmode"' + (b.partialMode ? ' checked' : '') + '> คิดคะแนนเฉพาะส่วนที่กรอกแล้ว</label>' +
      '</div>' +
      '<div class="hint" style="margin-top:6px">' +
        'เดินด้วยลูกศร ↑↓←→ • กด Enter เพื่อลงช่องถัดไป • เว้นว่าง = ยังไม่ได้กรอก (ไม่ใช่ 0) • ' +
        '<b>คัดลอกคะแนนทั้งคอลัมน์จาก Excel มาวางได้</b> คลิกช่องแรกแล้วกด Ctrl+V ระบบจะเติมลงมาตามลำดับแถว • ' +
        '<span class="badge grp">ช่องสีม่วง</span> คือคะแนนกลุ่ม • <span class="badge bad">ตัวแดง</span> ต่ำกว่าเกณฑ์ 60% รายส่วน • คะแนนตกยังนำมารวมตามจริง และเมื่อกรอกซ่อมจะใช้คะแนนซ่อมแทนโดยอัตโนมัติ' +
      '</div>' + termLockNotice() + partToggleHtml +
      (b.partialMode ? '<div class="notice" style="margin-top:8px">กำลังใช้โหมด “เฉพาะส่วนที่กรอกแล้ว” — คะแนนรวมเป็นการประมาณการระหว่างภาค ไม่ใช่คะแนนสุดท้าย</div>' : '') +
    '</div>' +
    '<div class="tablewrap tall"><table class="grid" id="scGrid"><thead>' + head + '</thead><tbody>' +
      sts.map(rowHtml).join('') + '</tbody></table></div>';

  lockPaneFields(pane, 'input.cell');
  $('#pmode').addEventListener('change', e => { b.partialMode = e.target.checked; save(true); renderScores(); });
  $$('[data-part]', pane).forEach(btn => btn.addEventListener('click', () => {
    const k = btn.dataset.part;
    DB.ui.scoreParts = DB.ui.scoreParts || {};
    DB.ui.scoreParts[k] = DB.ui.scoreParts[k] === false;      // ปิดอยู่ก็เปิด เปิดอยู่ก็ปิด
    save(); renderScores();
  }));
  const showAll = $('[data-part-all]', pane);
  if (showAll) showAll.addEventListener('click', () => { DB.ui.scoreParts = {}; save(); renderScores(); });

  const grid = $('#scGrid');
  const cellAt = (r, c) => grid.querySelector('input.cell:not(:disabled)[data-r="' + r + '"][data-c="' + c + '"]');
  const seekCell = (r, c, dr, dc) => {
    while (r >= 0 && r < sts.length && c >= 0 && c < cols.length) {
      const found = cellAt(r, c); if (found) return found;
      r += dr; c += dc;
    }
    return null;
  };

  grid.addEventListener('input', e => {
    const inp = e.target;
    if (blockClosedTerm()) { inp.value = ''; return; }
    if (inp.classList.contains('ksa-raw')) {
      const tr = inp.closest('tr'), sid = tr.dataset.sid, item = b.items.find(it => it.id === inp.dataset.item);
      if (!item) return;
      const raw = inp.value.trim().replace(/[^\d.\-]/g, ''); if (raw !== inp.value.trim()) inp.value = raw;
      b.componentScores[sid] = b.componentScores[sid] || {}; b.componentScores[sid][item.id] = b.componentScores[sid][item.id] || {};
      if (raw === '') delete b.componentScores[sid][item.id][inp.dataset.comp]; else b.componentScores[sid][item.id][inp.dataset.comp] = num(raw);
      inp.classList.toggle('over', raw !== '' && num(raw) > num(inp.dataset.rawmax));
      inp.classList.toggle('fail', raw !== '' && num(inp.dataset.rawmax) > 0 && num(raw) * 100 / num(inp.dataset.rawmax) < num(b.passPercent));
      syncItemComponentTotal(b, sid, item);
      updateRowCalc(tr, sid); save(); return;
    }
    if (!inp.classList.contains('cell')) return;
    const tr = inp.closest('tr'), sid = tr.dataset.sid, key = inp.dataset.key;
    const raw = inp.value.trim().replace(/[^\d.\-]/g, '');
    if (raw !== inp.value.trim()) inp.value = raw;
    const val = raw === '' ? '' : num(raw);
    if (key.startsWith('it:')) {
      b.scores[sid] = b.scores[sid] || {};
      const itId = key.slice(3);
      if (val === '') delete b.scores[sid][itId]; else b.scores[sid][itId] = val;
      const it = b.items.find(x => x.id === itId);
      if (it && it.kind === 'unit') {
        const canRetake = val !== '' && num(it.max) > 0 && num(val) * 100 / num(it.max) < num(b.passPercent);
        if (!canRetake && b.itemRetakes[sid]) delete b.itemRetakes[sid][itId];
      }
    } else if (key.startsWith('rt:')) {
      b.itemRetakes[sid] = b.itemRetakes[sid] || {};
      if (val === '') delete b.itemRetakes[sid][key.slice(3)]; else b.itemRetakes[sid][key.slice(3)] = val;
    } else {
      b.exam[sid] = b.exam[sid] || {};
      if (val === '') delete b.exam[sid][key.slice(3)]; else b.exam[sid][key.slice(3)] = val;
      if (key === 'ex:mid') {
        const canRetake = val !== '' && num(b.exams.midMax) > 0 && num(val) * 100 / num(b.exams.midMax) < num(b.passPercent);
        if (!canRetake) delete b.exam[sid].retake;
      }
    }
    inp.classList.toggle('over', raw !== '' && num(raw) > num(inp.dataset.max));
    inp.classList.toggle('fail', inp.dataset.threshold === '1' && raw !== '' && num(inp.dataset.max) > 0 && num(raw) * 100 / num(inp.dataset.max) < num(b.passPercent));
    updateRowCalc(tr, sid);
    save();
  });

  function updateRowCalc(tr, sid) {
    const st = sts.find(s => s.sid === sid);
    if (!st) return;
    const r = calcRow(b, st);
    const ex = b.exam[sid] || {};
    const sc = b.scores[sid] || {}, itemRetakes = b.itemRetakes[sid] || {};
    b.items.filter(it => it.kind === 'unit').forEach(it => {
      const originalInp = tr.querySelector('input[data-key="it:' + it.id + '"]');
      const retakeInp = tr.querySelector('input[data-key="rt:' + it.id + '"]');
      if (originalInp) originalInp.classList.toggle('fail', has(sc[it.id]) && num(sc[it.id]) * 100 / num(it.max) < num(b.passPercent));
      if (retakeInp) {
        retakeInp.disabled = !r.unitFailed[it.id];
        if (!r.unitFailed[it.id] && retakeInp.value) retakeInp.value = '';
        retakeInp.title = r.unitFailed[it.id] ? 'คะแนนซ่อมนี้จะใช้แทนคะแนนสอบรายหน่วยเดิม' : 'กรอกซ่อมได้เมื่อคะแนนสอบรายหน่วยต่ำกว่าเกณฑ์เท่านั้น';
        retakeInp.classList.toggle('fail', has(itemRetakes[it.id]) && num(itemRetakes[it.id]) * 100 / num(it.max) < num(b.passPercent));
      }
    });
    const midInp = tr.querySelector('input[data-key="ex:mid"]');
    const retakeInp = tr.querySelector('input[data-key="ex:retake"]');
    const finalInp = tr.querySelector('input[data-key="ex:final"]');
    if (midInp) midInp.classList.toggle('fail', has(ex.mid) && num(ex.mid) * 100 / num(b.exams.midMax) < num(b.passPercent));
    if (retakeInp) {
      retakeInp.disabled = !r.midFailed;
      if (!r.midFailed && retakeInp.value) retakeInp.value = '';
      retakeInp.title = r.midFailed ? 'คะแนนซ่อมนี้จะใช้แทนคะแนนกลางภาคเดิม' : 'กรอกซ่อมได้เมื่อคะแนนกลางภาคต่ำกว่าเกณฑ์เท่านั้น';
      retakeInp.classList.toggle('fail', has(ex.retake) && num(ex.retake) * 100 / num(b.exams.midMax) < num(b.passPercent));
    }
    if (finalInp) finalInp.classList.toggle('fail', has(ex.final) && num(ex.final) * 100 / num(b.exams.finalMax) < num(b.passPercent));
    const calcValues = { before: r.wBefore, mid: r.wM, after: r.wAfter, final: r.wF, total: r.total };
    Object.keys(calcValues).forEach(key => { const cell = $('[data-calc="' + key + '"]', tr); if (cell) cell.textContent = fmt(calcValues[key]); });
    const beforeCell = $('[data-calc="before"]', tr), afterCell = $('[data-calc="after"]', tr), midCell = $('[data-calc="mid"]', tr), finalCell = $('[data-calc="final"]', tr);
    if (beforeCell) beforeCell.classList.toggle('score-fail', r.filledBefore > 0 && r.passBefore === false);
    if (afterCell) afterCell.classList.toggle('score-fail', r.filledAfter > 0 && r.passAfter === false);
    if (midCell) midCell.classList.toggle('score-fail', (has(ex.mid) || has(ex.retake)) && r.passM === false);
    if (finalCell) finalCell.classList.toggle('score-fail', has(ex.final) && r.passF === false);
    const gradeCell = $('[data-calc="grade"]', tr);
    if (gradeCell) gradeCell.innerHTML = '<span class="badge ' + (r.passed ? 'ok' : 'bad') + '">' + esc(r.grade) + '</span>';
  }

  grid.addEventListener('keydown', e => {
    const inp = e.target;
    if (!inp.classList.contains('cell')) return;
    const r = +inp.dataset.r, c = +inp.dataset.c;
    let t = null;
    if (e.key === 'ArrowDown' || e.key === 'Enter') t = seekCell(r + 1, c, 1, 0);
    else if (e.key === 'ArrowUp') t = seekCell(r - 1, c, -1, 0);
    else if (e.key === 'ArrowLeft' && inp.selectionStart === 0) t = seekCell(r, c - 1, 0, -1);
    else if (e.key === 'ArrowRight' && inp.selectionStart === inp.value.length) t = seekCell(r, c + 1, 0, 1);
    else if (e.key === 'Tab' && !e.shiftKey) { t = seekCell(r, c + 1, 0, 1) || seekCell(r + 1, 0, 0, 1); }
    else if (e.key === 'Tab' && e.shiftKey) { t = seekCell(r, c - 1, 0, -1) || seekCell(r - 1, cols.length - 1, 0, -1); }
    else return;
    if (t) { e.preventDefault(); t.focus(); t.select(); }
    else if (e.key === 'Enter') e.preventDefault();
  });
  /* ---- วางคะแนนจาก Excel ทั้งคอลัมน์ -------------------------------------
     ครูหลายคนคิดคะแนนในไฟล์ Excel ก่อนแล้วค่อยมากรอก ห้องละ 40 คนถ้าพิมพ์ทีละช่อง
     ทั้งช้าและพลาดง่าย จึงรับการวางหลายบรรทัดมาเติมลงมาตามลำดับแถวเลย
     ยึด "แถวที่เท่าไร" เป็นหลัก ไม่ใช่ "ช่องว่างถัดไป" เพราะถ้าเจอช่องที่กรอกไม่ได้
     (เช่นช่องซ่อมของคนที่ไม่ตก) แล้วเลื่อนไปเติมช่องถัดไป คะแนนจะไปตกผิดคนทั้งคอลัมน์
     รองรับหลายคอลัมน์ด้วย เพราะ Excel คั่นคอลัมน์ด้วยแท็บอยู่แล้ว */
  grid.addEventListener('paste', e => {
    const inp = e.target;
    if (!inp || !inp.classList || !inp.classList.contains('cell')) return;
    if (blockClosedTerm()) { e.preventDefault(); return; }
    const data = e.clipboardData || window.clipboardData;
    const text = data ? data.getData('text') : '';
    if (!text) return;
    const block = text.replace(/\r\n?/g, '\n').replace(/\n+$/, '').split('\n').map(line => line.split('\t'));
    if (block.length === 1 && block[0].length === 1) return;      // ค่าเดียว ปล่อยให้วางตามปกติ
    e.preventDefault();
    const r0 = num(inp.dataset.r), c0 = num(inp.dataset.c);
    const anyCellAt = (r, c) => grid.querySelector('input.cell[data-r="' + r + '"][data-c="' + c + '"]');
    let filled = 0, locked = 0, outside = 0;
    block.forEach((line, i) => line.forEach((raw, j) => {
      const cell = cellAt(r0 + i, c0 + j);
      const value = String(raw == null ? '' : raw).trim().replace(/,/g, '');
      if (!cell) {
        if (value !== '') { if (anyCellAt(r0 + i, c0 + j)) locked++; else outside++; }
        return;
      }
      cell.value = value;
      cell.dispatchEvent(new Event('input', { bubbles: true }));
      filled++;
    }));
    save(true);
    const landing = cellAt(Math.min(r0 + block.length - 1, sts.length - 1), c0) || inp;
    landing.focus(); landing.select();
    const skipped = [];
    if (locked) skipped.push('ช่องที่ยังกรอกไม่ได้ ' + locked + ' ค่า (เช่นช่องซ่อมของคนที่ไม่ตก)');
    if (outside) skipped.push('เลยขอบตาราง ' + outside + ' ค่า');
    toast('วางคะแนนแล้ว ' + filled + ' ช่อง' + (skipped.length ? ' • ข้าม ' + skipped.join(' และ ') : ''),
      skipped.length ? 'warn' : 'ok');
  });
  grid.addEventListener('focusin', e => { if (e.target.classList.contains('cell')) e.target.select(); });
}

/* ============================================================================
   9) แท็บกลุ่ม
   ========================================================================== */
function parseNoRange(text, maxNo) {
  const out = new Set();
  String(text).split(/[,\s]+/).forEach(part => {
    if (!part) return;
    const m = part.match(/^(\d+)\s*-\s*(\d+)$/);
    if (m) { for (let i = +m[1]; i <= +m[2]; i++) if (i >= 1 && i <= maxNo) out.add(i); }
    else { const n = parseInt(part, 10); if (n >= 1 && n <= maxNo) out.add(n); }
  });
  return Array.from(out).sort((a, b) => a - b);
}

/** ชุดกลุ่มเดิมของห้องปัจจุบัน (รวมทุกวิชา) สำหรับนำกลับมาใช้ซ้ำ */
function groupCopySources() {
  const currentSubjectId = DB.ui.subjectId;
  const currentPeriodId = DB.ui.periodId;
  const sources = [];
  Object.keys(DB.books).forEach(key => {
    const parts = key.split('::');
    if (parts[0] !== DB.ui.classId || parts.length < 3) return;
    const subjectId = parts[1], periodId = parts[2];
    const subject = DB.subjects.find(s => s.id === subjectId);
    const period = DB.periods.find(p => p.id === periodId);
    const sourceBook = DB.books[key] || {};
    (sourceBook.groupSets || []).forEach(gs => {
      if (!(gs.groups || []).length) return;
      sources.push({
        subjectId: subjectId,
        subjectName: subject ? ((subject.code ? subject.code + ' ' : '') + subject.name) : 'วิชาที่ถูกลบ',
        periodName: period ? ('ปี ' + period.academicYear + ' ภาค ' + period.semester) : 'ช่วงเวลาที่ถูกลบ',
        current: subjectId === currentSubjectId && periodId === currentPeriodId,
        set: gs
      });
    });
  });
  return sources.sort((a, b) => Number(b.current) - Number(a.current) || a.subjectName.localeCompare(b.subjectName, 'th'));
}

function uniqueGroupSetName(b, wanted) {
  const base = String(wanted || 'ชุดกลุ่ม').trim() || 'ชุดกลุ่ม';
  const used = new Set(b.groupSets.map(gs => String(gs.name || '').trim()));
  if (!used.has(base)) return base;
  let i = 2;
  while (used.has(base + ' ' + i)) i++;
  return base + ' ' + i;
}

/** ทำสำเนาโครงสร้างกลุ่มโดยออก id ใหม่ และไม่พาคะแนนกลุ่มเดิมมาด้วย */
function cloneGroupSet(b, sourceSet, wantedName) {
  const validNos = new Set(curStudents().map(s => num(s.no)));
  const assigned = new Set();
  const groups = (sourceSet.groups || []).map((g, i) => {
    const members = [];
    (g.members || []).forEach(rawNo => {
      const n = num(rawNo);
      if (validNos.has(n) && !assigned.has(n)) { assigned.add(n); members.push(n); }
    });
    members.sort((a, c) => a - c);
    return { id: uid('g'), name: g.name || ('กลุ่มที่ ' + (i + 1)), members: members };
  });
  const copy = {
    id: uid('gs'),
    name: uniqueGroupSetName(b, wantedName || ((sourceSet.name || 'ชุดกลุ่ม') + ' (สำเนา)')),
    groups: groups
  };
  b.groupSets.push(copy);
  return copy;
}

function openCopyGroups(b) {
  const sources = groupCopySources();
  if (!sources.length) return toast('ยังไม่มีชุดกลุ่มเดิมที่มีสมาชิกให้คัดลอก', 'bad');

    '<option value="' + i + '">' + esc((src.current ? 'วิชานี้/ภาคนี้' : src.subjectName + ' • ' + src.periodName) + ' — ' + src.set.name +
      ' (' + src.set.groups.length + ' กลุ่ม)') + '</option>').join('');
  openModal({
    title: 'คัดลอกชุดกลุ่มเดิม',
    bodyHTML:
      '<div class="pick" style="margin-bottom:12px"><label>ชุดกลุ่มต้นฉบับ</label>' +
        '<select id="cgSource" style="width:100%">' + optionHtml + '</select></div>' +
      '<div class="pick"><label>ชื่อชุดกลุ่มใหม่</label>' +
        '<input type="text" id="cgName" style="width:100%"></div>' +
      '<div class="notice" id="cgPreview" style="margin-top:12px"></div>' +
      '<div class="hint" style="margin-top:8px">คัดลอกเฉพาะชื่อกลุ่มและสมาชิกของห้องนี้ คะแนนกลุ่มเดิมจะไม่ถูกคัดลอกมาด้วย</div>',
    onMount: root => {
      const select = $('#cgSource', root), name = $('#cgName', root), preview = $('#cgPreview', root);
      const update = () => {
        const src = sources[Math.max(0, num(select.value))];
        const memberCount = new Set((src.set.groups || []).flatMap(g => g.members || [])).size;
        name.value = uniqueGroupSetName(b, (src.set.name || 'ชุดกลุ่ม') + ' (สำเนา)');
        preview.textContent = 'จะสร้าง ' + src.set.groups.length + ' กลุ่ม จากสมาชิกเดิม ' + memberCount + ' คน';
      };
      select.addEventListener('change', update);
      update();
    },
    buttons: [{ label: 'ยกเลิก' }, { label: 'คัดลอก', cls: 'primary', act: (close, root) => {
      const src = sources[Math.max(0, num($('#cgSource', root).value))];
      if (!src) return;
      const copied = cloneGroupSet(b, src.set, $('#cgName', root).value);
      save(true); close(); renderGroups();
      toast('คัดลอกเป็น “' + copied.name + '” แล้ว', 'ok');
    } }]
  });
}

function renderGroups() {

  if (gate) { pane.innerHTML = '<div class="card">' + gate + '</div>'; return; }

  const sts = curStudents().slice().sort((a, c) => a.no - c.no);
  const byNo = {}; sts.forEach(s => byNo[s.no] = s);
  const maxNo = sts.reduce((a, s) => Math.max(a, num(s.no)), 0) || MAX_STUDENTS;
  const presentationCounts = {};
  Object.keys(b.presenters || {}).forEach(itId => {
    Object.keys(b.presenters[itId] || {}).forEach(gid => {
      (b.presenters[itId][gid] || []).forEach(sid => { presentationCounts[sid] = (presentationCounts[sid] || 0) + 1; });
    });
  });

  if (!sts.length) { pane.innerHTML = '<div class="card"><div class="empty">ยังไม่มีรายชื่อนักเรียน — นำเข้ารายชื่อที่แท็บ <b>นักเรียน</b> ก่อน</div></div>'; return; }

  const setsHtml = b.groupSets.map(gs => {
    const used = {};
    gs.groups.forEach(g => g.members.forEach(n => { used[n] = (used[n] || 0) + 1; }));
    const missing = sts.filter(s => !used[s.no]).map(s => s.no);
    const dup = Object.keys(used).filter(n => used[n] > 1);
    const gitems = b.items.filter(it => it.kind === 'group' && it.groupSetId === gs.id);

    return '<div class="card" data-gs="' + gs.id + '">' +
      '<h3><input type="text" class="gs-name" value="' + esc(gs.name) + '" style="font-weight:700;min-width:220px">' +
        '<span class="badge grp">' + gs.groups.length + ' กลุ่ม</span>' +
        (gitems.length ? '<span class="badge">ใช้กับ ' + gitems.length + ' หัวข้อ</span>'
                       : '<span class="badge warn">ยังไม่มีหัวข้อคะแนนที่ใช้ชุดนี้</span>') +
        '<div class="spacer"></div>' +
        '<button class="sm" data-addgrp="' + gs.id + '">+ เพิ่มกลุ่ม</button> ' +
        '<button class="sm" data-auto="' + gs.id + '">แบ่งอัตโนมัติ</button> ' +
        '<button class="sm" data-copygs="' + gs.id + '" title="ทำสำเนาชื่อกลุ่มและสมาชิก โดยไม่คัดลอกคะแนน">ทำสำเนา</button> ' +
        '<button class="sm danger" data-delgs="' + gs.id + '">ลบชุดนี้</button>' +
      '</h3>' +
      (missing.length ? '<div class="notice">ยังไม่ได้จัดกลุ่ม: เลขที่ ' + missing.join(', ') + '</div>' : '') +
      (dup.length ? '<div class="notice bad">เลขที่อยู่หลายกลุ่ม: ' + dup.join(', ') + '</div>' : '') +
      (gs.groups.length ? gs.groups.map((g, gi) =>
        '<div class="grpcard" data-g="' + g.id + '">' +
          '<div class="ghead">' +
            '<input type="text" class="gname" value="' + esc(g.name) + '">' +
            '<span class="badge">' + g.members.length + ' คน</span>' +
            '<input type="text" class="grange" placeholder="พิมพ์เลขที่ เช่น 1-5, 8" value="' + esc(g.members.join(', ')) + '" style="flex:1;min-width:170px">' +
            '<button class="sm danger" data-delgrp="' + g.id + '">ลบกลุ่ม</button>' +
          '</div>' +
          '<div class="chips">' + sts.map(s => {
            const on = g.members.indexOf(s.no) >= 0;
            const taken = !on && used[s.no];
            return '<div class="chip' + (on ? ' on' : '') + (taken ? ' taken' : '') + '" data-no="' + s.no + '" title="' +
              esc(s.no + ' ' + s.name + (taken ? ' (อยู่กลุ่มอื่นแล้ว)' : '')) + '">' + s.no + '</div>';
          }).join('') + '</div>' +
          '<div class="memlist">' + (g.members.length
            ? g.members.map(n => byNo[n] ? esc(byNo[n].name || ('เลขที่ ' + n)) : ('เลขที่ ' + n + ' (ไม่พบ)')).join(' • ')
            : 'ยังไม่มีสมาชิก') + '</div>' +
          (gitems.length ?
            '<div>' +
            gitems.map(it => {
              const v = (b.gscores[it.id] || {})[g.id];
              const selected = ((b.presenters[it.id] || {})[g.id] || []);
              const members = g.members.map(n => byNo[n]).filter(Boolean);
              const all = members.length && members.every(s => selected.indexOf(s.sid) >= 0);
              return '<div class="group-assess">' +
                '<div class="row tight"><div class="pick"><label>' + esc(it.name) + ' (เต็ม ' + fmt(num(it.max)) + ')</label>' +
                  '<input type="text" class="gscore" data-it="' + it.id + '" data-g="' + g.id + '" value="' +
                  (has(v) ? esc(v) : '') + '" style="width:70px;text-align:center"></div>' +
                  '<span class="hint">ผู้นำเสนอ:</span>' +
                  '<button class="sm' + (all ? ' primary' : '') + '" data-allpresent data-it="' + it.id + '" data-g="' + g.id + '">ทั้งกลุ่ม' + (all ? ' ✓' : '') + '</button>' +
                  members.map(s => '<button class="presenter-chip' + (selected.indexOf(s.sid) >= 0 ? ' on' : '') + '" data-presenter data-it="' + it.id + '" data-g="' + g.id + '" data-sid="' + esc(s.sid) + '" title="' + esc(s.name) + '">' + esc(s.no) + '</button>').join('') +
                '</div></div>';
            }).join('') +
            '<div class="present-stats"><b>สถิติสะสม:</b> ' + g.members.map(n => {
              const s = byNo[n]; return s ? esc(s.no + ' ' + s.name) + ' <span class="badge' + ((presentationCounts[s.sid] || 0) ? ' ok' : ' warn') + '">' + (presentationCounts[s.sid] || 0) + ' ครั้ง</span>' : '';
            }).filter(Boolean).join(' • ') + '</div>' +
            '</div>' : '') +
        '</div>').join('')
        : '<div class="empty">ยังไม่มีกลุ่มในชุดนี้ — กด “+ เพิ่มกลุ่ม” หรือ “แบ่งอัตโนมัติ”</div>') +
    '</div>';
  }).join('');

  pane.innerHTML =
    '<div class="card">' +
      '<h3>การจัดกลุ่ม <span class="sub">' + esc(curSubject().name) + ' • ' + esc(curClass().name) + '</span></h3>' +
      '<div class="row">' +
        '<button class="primary" id="btnAddGs">+ สร้างชุดกลุ่มใหม่</button>' +
        '<button id="btnCopyGs">คัดลอกจากชุดเดิม</button>' +
        '<span class="hint">หนึ่งวิชาสร้างได้หลาย “ชุดกลุ่ม” เช่น กลุ่มการทดลอง / กลุ่มรายงาน แล้วผูกกับหัวข้อคะแนนที่แท็บ <b>หัวข้อคะแนน</b> (เลือกประเภทเป็น “กลุ่ม”)</span>' +
      '</div>' +
    '</div>' +
    (b.groupSets.length ? setsHtml : '<div class="card"><div class="empty">ยังไม่มีชุดกลุ่ม<br><span class="hint">กด “+ สร้างชุดกลุ่มใหม่” เพื่อเริ่ม</span></div></div>');

  /* --- เหตุการณ์ --- */
  $('#btnAddGs').addEventListener('click', () => {
    b.groupSets.push({ id: uid('gs'), name: 'ชุดกลุ่มที่ ' + (b.groupSets.length + 1), groups: [] });
    save(true); renderGroups();
  });
  $('#btnCopyGs').addEventListener('click', () => openCopyGroups(b));
  $$('[data-copygs]').forEach(btn => btn.addEventListener('click', () => {
    const source = b.groupSets.find(gs => gs.id === btn.dataset.copygs);
    if (!source) return;
    const copied = cloneGroupSet(b, source);
    save(true); renderGroups();
    toast('ทำสำเนาเป็น “' + copied.name + '” แล้ว (ไม่คัดลอกคะแนน)', 'ok');
  }));
  $$('.gs-name').forEach(inp => inp.addEventListener('change', () => {
    const gs = b.groupSets.find(x => x.id === inp.closest('[data-gs]').dataset.gs);
    if (gs) { gs.name = inp.value.trim() || gs.name; save(true); renderGroups(); }
  }));
  $$('[data-delgs]').forEach(btn => btn.addEventListener('click', async () => {
    const gs = b.groupSets.find(x => x.id === btn.dataset.delgs);
    if (!await confirmBox('ลบชุดกลุ่ม', 'ลบ <b>' + esc(gs.name) + '</b> และการจัดกลุ่มทั้งหมดในชุดนี้?<br><span class="hint">คะแนนที่ลงให้นักเรียนไปแล้วจะยังอยู่</span>', 'ลบ')) return;
    b.groupSets = b.groupSets.filter(x => x.id !== gs.id);
    b.items.forEach(it => { if (it.groupSetId === gs.id) { it.groupSetId = ''; it.kind = 'individual'; } });
    save(true); renderGroups();
  }));
  $$('[data-addgrp]').forEach(btn => btn.addEventListener('click', () => {
    const gs = b.groupSets.find(x => x.id === btn.dataset.addgrp);
    gs.groups.push({ id: uid('g'), name: 'กลุ่มที่ ' + (gs.groups.length + 1), members: [] });
    save(true); renderGroups();
  }));
  $$('[data-delgrp]').forEach(btn => btn.addEventListener('click', () => {
    const gsId = btn.closest('[data-gs]').dataset.gs;
    const gs = b.groupSets.find(x => x.id === gsId);
    gs.groups = gs.groups.filter(g => g.id !== btn.dataset.delgrp);
    save(true); renderGroups();
  }));
  $$('.gname').forEach(inp => inp.addEventListener('change', () => {
    const gs = b.groupSets.find(x => x.id === inp.closest('[data-gs]').dataset.gs);
    const g = gs.groups.find(x => x.id === inp.closest('[data-g]').dataset.g);
    if (g) { g.name = inp.value.trim() || g.name; save(true); renderGroups(); }
  }));
  $$('.grange').forEach(inp => inp.addEventListener('change', () => {
    const gs = b.groupSets.find(x => x.id === inp.closest('[data-gs]').dataset.gs);
    const g = gs.groups.find(x => x.id === inp.closest('[data-g]').dataset.g);
    g.members = parseNoRange(inp.value, Math.max(maxNo, MAX_STUDENTS)).filter(n => byNo[n]);
    save(true); reapplyGroupScores(b, gs, g, byNo); renderGroups();
  }));
  $$('.chip').forEach(ch => ch.addEventListener('click', () => {
    const gs = b.groupSets.find(x => x.id === ch.closest('[data-gs]').dataset.gs);
    const g = gs.groups.find(x => x.id === ch.closest('[data-g]').dataset.g);
    const n = +ch.dataset.no;
    const i = g.members.indexOf(n);
    if (i >= 0) g.members.splice(i, 1);
    else {
      gs.groups.forEach(o => { if (o !== g) o.members = o.members.filter(m => m !== n); }); // อยู่ได้กลุ่มเดียว
      g.members.push(n); g.members.sort((a, c) => a - c);
    }
    save(true); reapplyGroupScores(b, gs, g, byNo); renderGroups();
  }));
  lockPaneFields(pane, '.gscore');
  $$('.gscore').forEach(inp => inp.addEventListener('change', () => {
    if (blockClosedTerm()) return renderGroups();
    const gsId = inp.closest('[data-gs]').dataset.gs;
    const gs = b.groupSets.find(x => x.id === gsId);
    const g = gs.groups.find(x => x.id === inp.dataset.g);
    const itId = inp.dataset.it;
    const it = b.items.find(x => x.id === itId);
    const raw = inp.value.trim();
    b.gscores[itId] = b.gscores[itId] || {};
    if (raw === '') delete b.gscores[itId][g.id];
    else b.gscores[itId][g.id] = num(raw);
    // ลงคะแนนให้สมาชิกทุกคน
    g.members.forEach(n => {
      const st = byNo[n]; if (!st) return;
      b.scores[st.sid] = b.scores[st.sid] || {};
      if (raw === '') delete b.scores[st.sid][itId];
      else b.scores[st.sid][itId] = num(raw);
    });
    save(true);
    toast(raw === '' ? 'ล้างคะแนนกลุ่ม ' + g.name : 'ลง ' + raw + ' คะแนนให้ ' + g.name + ' ' + g.members.length + ' คน' +
      (num(raw) > num(it.max) ? ' (เกินคะแนนเต็ม!)' : ''), num(raw) > num(it.max) ? 'bad' : 'ok');
  }));
  $$('[data-presenter]').forEach(btn => btn.addEventListener('click', () => {
    const itId = btn.dataset.it, gId = btn.dataset.g, sid = btn.dataset.sid;
    b.presenters[itId] = b.presenters[itId] || {};
    const selected = b.presenters[itId][gId] = (b.presenters[itId][gId] || []).slice();
    const i = selected.indexOf(sid);
    if (i >= 0) selected.splice(i, 1); else selected.push(sid);
    save(true); renderGroups();
  }));
  $$('[data-allpresent]').forEach(btn => btn.addEventListener('click', () => {
    const itId = btn.dataset.it, gId = btn.dataset.g;
    const gs = b.groupSets.find(x => x.id === btn.closest('[data-gs]').dataset.gs);
    const g = gs && gs.groups.find(x => x.id === gId); if (!g) return;
    const memberSids = g.members.map(n => byNo[n] && byNo[n].sid).filter(Boolean);
    b.presenters[itId] = b.presenters[itId] || {};
    const old = b.presenters[itId][gId] || [];
    b.presenters[itId][gId] = memberSids.length && memberSids.every(sid => old.indexOf(sid) >= 0) ? [] : memberSids;
    save(true); renderGroups();
  }));
  $$('[data-auto]').forEach(btn => btn.addEventListener('click', () => autoSplit(b, btn.dataset.auto, sts)));
}

/** ลงคะแนนกลุ่มซ้ำให้สมาชิกล่าสุด (ใช้เมื่อสมาชิกเปลี่ยน) */
function reapplyGroupScores(b, gs, g, byNo) {
  b.items.filter(it => it.kind === 'group' && it.groupSetId === gs.id).forEach(it => {
    const v = (b.gscores[it.id] || {})[g.id];
    if (!has(v)) return;
    g.members.forEach(n => {
      const st = byNo[n]; if (!st) return;
      b.scores[st.sid] = b.scores[st.sid] || {};
      b.scores[st.sid][it.id] = num(v);
    });
  });
  save(true);
}

function autoSplit(b, gsId, sts) {
  const gs = b.groupSets.find(x => x.id === gsId);
  openModal({
    title: 'แบ่งกลุ่มอัตโนมัติ — ' + gs.name,
    bodyHTML:
      '<div class="row" style="margin-bottom:10px">' +
        '<label><input type="radio" name="asMode" value="count" checked> กำหนดจำนวนกลุ่ม</label>' +
        '<input type="text" id="asN" value="8" style="width:70px;text-align:center">' +
      '</div>' +
      '<div class="row" style="margin-bottom:10px">' +
        '<label><input type="radio" name="asMode" value="size"> กำหนดจำนวนคนต่อกลุ่ม</label>' +
        '<input type="text" id="asS" value="5" style="width:70px;text-align:center">' +
      '</div>' +
      '<div class="row" style="margin-bottom:10px">' +
        '<label><input type="radio" name="asOrder" value="no" checked> เรียงตามเลขที่</label>' +
        '<label><input type="radio" name="asOrder" value="rand"> สุ่ม</label>' +
      '</div>' +
      '<div class="row"><label><input type="checkbox" id="asName" checked> ตั้งชื่อกลุ่มเป็น “กลุ่มที่ 1, 2, 3…”</label></div>' +
      '<div class="notice" style="margin-top:10px">การแบ่งใหม่จะแทนที่กลุ่มเดิมทั้งหมดในชุดนี้ (นักเรียน ' + sts.length + ' คน)</div>',
    buttons: [{ label: 'ยกเลิก' }, { label: 'แบ่งกลุ่ม', cls: 'primary', act: (close, root) => {
      const mode = ($$('input[name=asMode]', root).find(r => r.checked) || {}).value;
      const order = ($$('input[name=asOrder]', root).find(r => r.checked) || {}).value;
      const nos = sts.map(s => s.no);
      if (order === 'rand') for (let i = nos.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = nos[i]; nos[i] = nos[j]; nos[j] = t; }
      let k;
      if (mode === 'count') k = Math.max(1, Math.round(num($('#asN', root).value)));
      else { const sz = Math.max(1, Math.round(num($('#asS', root).value))); k = Math.max(1, Math.ceil(nos.length / sz)); }
      const groups = Array.from({ length: k }, (_, i) => ({ id: uid('g'), name: 'กลุ่มที่ ' + (i + 1), members: [] }));
      // แบ่งเป็นช่วงติดกัน (1-5, 6-10, …) ขนาดใกล้เคียงกัน กลุ่มแรก ๆ รับเศษที่เหลือ
      const base = Math.floor(nos.length / k), rem = nos.length % k;
      let p = 0;
      groups.forEach((g, i) => { const sz = base + (i < rem ? 1 : 0); g.members = nos.slice(p, p + sz); p += sz; });
      groups.forEach(g => g.members.sort((a, c) => a - c));
      const keepName = !$('#asName', root).checked;
      if (keepName) groups.forEach((g, i) => { if (gs.groups[i]) g.name = gs.groups[i].name; });
      gs.groups = groups;
      b.gscores = b.gscores || {};
      b.items.filter(it => it.groupSetId === gs.id).forEach(it => { delete b.gscores[it.id]; });
      save(true); close(); renderGroups();
      toast('แบ่งเป็น ' + k + ' กลุ่มแล้ว', 'ok');
    } }]
  });
}

const TRAIT_ITEMS = [

  'อยู่อย่างพอเพียง', 'มุ่งมั่นในการทำงาน', 'รักความเป็นไทย', 'มีจิตสาธารณะ'
];
const READING_ITEMS = [
  'คัดสรรสื่อและอ่านเพื่อหาข้อมูลตามวัตถุประสงค์',
  'จับประเด็นสำคัญ ประเด็นสนับสนุน และประเด็นโต้แย้ง',

  'สรุป อภิปราย แสดงความคิดเห็น และถ่ายทอดด้วยการเขียน'
];
const ASSESS_LEVELS = [
  { value: 0, label: 'ไม่ผ่าน', cls: 'bad' }, { value: 1, label: 'ผ่าน', cls: 'warn' },
  { value: 2, label: 'ดี', cls: 'ok' }, { value: 3, label: 'ดีเยี่ยม', cls: 'ok' }
];
const assessmentConfig = type => type === 'traits'
  ? { type: 'traits', title: 'คุณลักษณะอันพึงประสงค์', items: TRAIT_ITEMS, excellent: 5, good: 5 }
  : { type: 'reading', title: 'การอ่าน คิดวิเคราะห์ และเขียน', items: READING_ITEMS, excellent: 4, good: 4 };

/** สรุปโดยนับจำนวนระดับ ไม่ใช้คะแนนรวมและไม่ใช้ค่าเฉลี่ย */
function assessmentResult(values, config) {
  const counts = [0, 0, 0, 0];
  let filled = 0;
  for (let i = 0; i < config.items.length; i++) {
    const v = values && values[i];
    if (v === 0 || v === 1 || v === 2 || v === 3) { counts[v]++; filled++; }
  }
  if (filled < config.items.length) return { counts: counts, filled: filled, level: null, label: 'ยังไม่ครบ' };
  let level;
  if (counts[0] > 0) level = 0;
  else if (counts[1] === 0 && counts[3] >= config.excellent) level = 3;
  else if (counts[1] === 0 || counts[2] + counts[3] >= config.good) level = 2;
  else level = 1;
  return { counts: counts, filled: filled, level: level, label: ASSESS_LEVELS[level].label };
}

function assessmentBadge(result) {
  if (result.level === null) return '<span class="badge">ยังไม่ครบ (' + result.filled + ')</span>';
  const lv = ASSESS_LEVELS[result.level];
  return '<span class="badge ' + lv.cls + '">' + result.level + ' ' + lv.label + '</span>';
}

function assessmentDistribution(b, sts, type) {
  const config = assessmentConfig(type), dist = { 0: 0, 1: 0, 2: 0, 3: 0, blank: 0 };
  sts.forEach(st => {
    const r = assessmentResult((b.assessments[type] || {})[st.sid] || [], config);
    if (r.level === null) dist.blank++; else dist[r.level]++;
  });
  return dist;
}

function assessmentStatsHtml(b, sts, type) {

    '<div class="stat"><div class="v">' + d[2] + '</div><div class="k">ดี (2)</div></div>' +
    '<div class="stat"><div class="v">' + d[1] + '</div><div class="k">ผ่าน (1)</div></div>' +
    '<div class="stat"><div class="v">' + d[0] + '</div><div class="k">ไม่ผ่าน (0)</div></div>' +
    '<div class="stat"><div class="v">' + d.blank + '</div><div class="k">ยังประเมินไม่ครบ</div></div>';
}

    '<div class="row noprint" style="padding:10px;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px">' +
      '<label><input type="checkbox" data-checkall-assess data-type="' + type + '"> เลือกทั้งห้อง</label>' +
      '<div class="pick" style="min-width:240px"><label>หัวข้อที่จะให้คะแนน</label><select data-bulk-topic style="width:100%">' +
        config.items.map((item, i) => '<option value="' + i + '">' + (i + 1) + '. ' + esc(item) + '</option>').join('') + '</select></div>' +
      '<div class="pick"><label>ระดับ</label><select data-bulk-level><option value="3">3 ดีเยี่ยม</option><option value="2">2 ดี</option><option value="1">1 ผ่าน</option><option value="0">0 ไม่ผ่าน</option></select></div>' +

    '<div class="notice">สรุปด้วยการนับจำนวนระดับ 0–3 ไม่ใช้ค่าเฉลี่ย • ดีเยี่ยมต้องได้ระดับ 3 อย่างน้อย ' + config.excellent + ' ข้อ และไม่มีข้อใดต่ำกว่าระดับ 2</div>' +

      sts.map(st => {

        const r = assessmentResult(values, config);
        return '<tr class="assess-row" data-type="' + type + '" data-sid="' + esc(st.sid) + '"><td class="a-no"><label><input type="checkbox" class="assess-pick"> ' + esc(st.no) + '</label></td>' +

          config.items.map((item, i) => '<td><select class="assess-cell" data-i="' + i + '">' + opts(values[i]) + '</select></td>').join('') +
          '<td class="a-c3 count3">' + r.counts[3] + '</td><td class="a-c2">' + r.counts[2] + '</td>' +
          '<td class="a-c1">' + r.counts[1] + '</td><td class="a-c0 count0">' + r.counts[0] + '</td>' +
          '<td class="a-result">' + assessmentBadge(r) + '</td></tr>';
      }).join('') + '</tbody></table></div></div>';

function renderAssessments() {
  const pane = $('#pane-assess'), gate = gateMsg(true);
  if (gate) { pane.innerHTML = '<div class="card">' + gate + '</div>'; return; }
  const b = curBook(true), sts = curStudents().slice().sort((a, c) => a.no - c.no);
  if (!sts.length) { pane.innerHTML = '<div class="card"><div class="empty">ยังไม่มีรายชื่อนักเรียน</div></div>'; return; }
  pane.innerHTML = '<div class="card noprint"><div class="row"><h3 style="margin:0">ประเมินคุณภาพผู้เรียน <span class="sub">' +
    esc(curSubject().name) + ' • ' + esc(curClass().name) + '</span></h3><div class="spacer"></div><button id="btnPrintAssess">พิมพ์</button></div>' +
    '<div class="hint" style="margin-top:6px">ระดับ 3 = ดีเยี่ยม • 2 = ดี • 1 = ผ่าน • 0 = ไม่ผ่าน • “–” = ยังไม่ประเมิน</div>' + termLockNotice() + '</div>' +
    assessmentSectionHtml(b, sts, 'traits') + assessmentSectionHtml(b, sts, 'reading');
  lockPaneFields(pane, '.assess-cell');

  $$('.assess-cell', pane).forEach(sel => sel.addEventListener('change', () => {
    if (blockClosedTerm()) return renderAssessments();
    const tr = sel.closest('.assess-row'), type = tr.dataset.type, sid = tr.dataset.sid, i = +sel.dataset.i;
    b.assessments[type][sid] = (b.assessments[type][sid] || []).slice();
    b.assessments[type][sid][i] = sel.value === '' ? null : +sel.value;
    const r = assessmentResult(b.assessments[type][sid], assessmentConfig(type));
    $('.a-c3', tr).textContent = r.counts[3]; $('.a-c2', tr).textContent = r.counts[2];
    $('.a-c1', tr).textContent = r.counts[1]; $('.a-c0', tr).textContent = r.counts[0];
    $('.a-result', tr).innerHTML = assessmentBadge(r);
    $('#assessStats-' + type).innerHTML = assessmentStatsHtml(b, sts, type);
    save();
  }));
  $$('[data-fill-assess]', pane).forEach(btn => btn.addEventListener('click', () => {
    const type = btn.dataset.type, level = +btn.dataset.fillAssess, config = assessmentConfig(type);
    sts.forEach(st => {
      const arr = b.assessments[type][st.sid] = (b.assessments[type][st.sid] || []).slice();
      for (let i = 0; i < config.items.length; i++) if (!(arr[i] === 0 || arr[i] === 1 || arr[i] === 2 || arr[i] === 3)) arr[i] = level;
    });
    save(true); renderAssessments(); toast('เติมระดับ ' + level + ' ในช่องว่างแล้ว', 'ok');
  }));
  $$('[data-checkall-assess]', pane).forEach(master => master.addEventListener('change', () => {
    const section = master.closest('[data-assess-section]');
    $$('.assess-pick', section).forEach(ch => { ch.checked = master.checked; });
    $$('[data-checkall-assess]', section).forEach(ch => { if (ch !== master) ch.checked = master.checked; ch.indeterminate = false; });
  }));
  $$('.assess-pick', pane).forEach(ch => ch.addEventListener('change', () => {
    const section = ch.closest('[data-assess-section]'), picks = $$('.assess-pick', section);
    const n = picks.filter(x => x.checked).length;
    $$('[data-checkall-assess]', section).forEach(master => { master.checked = n === picks.length; master.indeterminate = n > 0 && n < picks.length; });
  }));
  $$('[data-apply-assess]', pane).forEach(btn => btn.addEventListener('click', () => {
    const section = btn.closest('[data-assess-section]'), type = section.dataset.assessSection;
    const index = +$('[data-bulk-topic]', section).value, level = +$('[data-bulk-level]', section).value;
    const picked = $$('.assess-row', section).filter(tr => $('.assess-pick', tr).checked);
    if (!picked.length) return toast('กรุณาติ๊กเลือกนักเรียนก่อน', 'bad');
    picked.forEach(tr => {
      const sid = tr.dataset.sid, arr = b.assessments[type][sid] = (b.assessments[type][sid] || []).slice();
      arr[index] = level;
    });
    save(true); renderAssessments(); toast('ให้ระดับ ' + level + ' จำนวน ' + picked.length + ' คนแล้ว', 'ok');
  }));
  $$('[data-clear-assess]', pane).forEach(btn => btn.addEventListener('click', async () => {
    const type = btn.dataset.type, config = assessmentConfig(type);
    if (!await confirmBox('ล้างผลประเมิน', 'ล้างข้อมูล <b>' + config.title + '</b> ของนักเรียนทั้งห้อง?', 'ล้าง')) return;
    b.assessments[type] = {}; save(true); renderAssessments();
  }));
  $('#btnPrintAssess').addEventListener('click', () => window.print());
}

   11) แท็บสรุป + ส่งออก
   ========================================================================== */
function attendanceStudentResult(classId, subjectId, st, periodId) {
  const pid = periodId || DB.ui.periodId, term = (DB.timetable.terms || {})[pid] || null;
  const entries = DB.timetable.entries.filter(e => e.periodId === pid && e.classId === classId && e.subjectId === subjectId);
  const specials = (DB.timetable.exceptions || []).filter(e => e.periodId === pid && e.classId === classId && e.subjectId === subjectId);
  const records = Object.values(DB.timetable.attendance).filter(r => entries.concat(specials).some(e => e.id === r.entryId));
  const regularRecords = records.filter(r => entries.some(e => e.id === r.entryId));
  const counts = { present: 0, late: 0, leave: 0, activity: 0, absent: 0 };
  records.forEach(r => { const v = (r.statuses || {})[st.sid]; if (counts[v] !== undefined) counts[v]++; });
  const checked = counts.present + counts.late + counts.leave + counts.activity + counts.absent;
  const attended = counts.present + counts.late + counts.activity;
  const pct = checked ? attended * 100 / checked : null;
  const planned = entries.reduce((n, e) => n + scheduledDates(e).length, 0);
  const min = term && term.minAttendance != null ? num(term.minAttendance) : 80;
  const closed = !!(term && term.closeDate && todayISO() >= term.closeDate);
  const complete = planned > 0 && regularRecords.length >= planned;
  const outcome = attendanceOutcome(pct);
  return { counts: counts, checked: checked, attended: attended, pct: pct, planned: planned, min: min,
    outcome: outcome.key, atRisk: pct !== null && pct < 80, isMS: closed && complete && pct !== null && pct < 80, isRepeat: pct !== null && pct < 60 };
}

function summaryRows(b, sts, classId, subjectId) {
  return sts.map(st => ({ st: st, r: calcRow(b, st), att: attendanceStudentResult(classId, subjectId, st) }));
}

      '<div class="row" style="margin-top:10px;flex-wrap:wrap"><button class="sm primary" data-sum-act="pushbooks">ส่งขึ้นตอนนี้</button>' +
      '<button class="sm" data-sum-act="pullbooks">ดึงจากส่วนกลางมาทับเครื่องนี้</button>' +
      '<span class="hint">ซิงก์ล่าสุด: ' + esc(last) + '</span></div>') + '</div>';

function bindSummaryTools(pane) {
  $$('[data-sum-act]', pane).forEach(btn => btn.addEventListener('click', async () => {
    const act = btn.dataset.sumAct;
    if (act === 'courseinfo') return editCourseInfo();
    if (act === 'backup') return backup();
    if (act === 'restore') return restore();
    if (act === 'pushbooks') {
      btn.disabled = true;
      try { const n = await pushMyBooks(); toast('ส่งสมุดคะแนนขึ้นส่วนกลางแล้ว ' + n + ' รายการ', 'ok'); renderSummary(); }
      catch (e) { toast(fbErrorMessage(e), 'bad'); btn.disabled = false; }
      return;
    }
    if (act === 'pullbooks') {
      if (!await confirmBox('ดึงจากส่วนกลาง', 'คะแนนและการเช็กชื่อในเครื่องนี้จะถูกทับด้วยข้อมูลบนส่วนกลาง ควรกดสำรองข้อมูลก่อน', 'ดึงและทับข้อมูล')) return;
      btn.disabled = true;
      try { const n = await pullMyBooks(); toast('ดึงข้อมูลลงเครื่องแล้ว ' + n + ' รายการ', 'ok'); }
      catch (e) { toast(fbErrorMessage(e), 'bad'); btn.disabled = false; }
    }
  }));
  const toggle = $('#bookSyncOn', pane);
  if (toggle) toggle.addEventListener('change', () => {
    DB.cloud.syncBooks = toggle.checked; save(true); renderSyncChip();
    toast(toggle.checked ? 'เปิดการซิงก์แล้ว ระบบจะส่งขึ้นให้อัตโนมัติ' : 'ปิดการซิงก์แล้ว', toggle.checked ? 'ok' : '');
    renderSummary();
  });
}

  const teacher = curTeacher(), cls = curClass(), sub = curSubject(), period = curPeriod(), s = DB.settings;

  const parts = [
    { label: 'ก่อนกลางภาค', w: num(W.before), val: r => r.wBefore },
    { label: 'กลางภาค', w: num(W.mid), val: r => r.wM },
    { label: 'หลังกลางภาค', w: num(W.after), val: r => r.wAfter },
    { label: 'ปลายภาค', w: num(W.final), val: r => r.wF }
  ];
  // การกระจายเกรด เรียงจากมากไปน้อยตามเกณฑ์ที่ตั้งไว้ ใช้เป็นสรุปท้ายใบ
  const gradeOrder = b.gradeScale.map(g => g[1]).filter((v, i, a) => a.indexOf(v) === i);
  const dist = {}; gradeOrder.forEach(g => { dist[g] = 0; });
  rows.forEach(x => { const g = x.r.grade; if (dist[g] === undefined) dist[g] = 0; dist[g]++; });
  const headName = headNameOfArea(teacherArea(teacher)) || s.headLearningName || '';

  const cell = (r, p) => '<td class="num"><b>' + fmt(p.val(r)) + '</b></td>';

  return '<div class="card score-sheet"><div class="row noprint"><div><h3 style="margin:0">คะแนนสำหรับกรอก SGS</h3>' +
      '<div class="hint">เรียงตามลำดับช่องที่ต้องคีย์ — ก่อนกลางภาค • กลางภาค • หลังกลางภาค • ปลายภาค • รวม • เกรด' +
      '<br>ส่งออกเป็น Excel ได้ ถ้าอยากคัดลอกทีละคอลัมน์ไปวางแทนการคีย์ทีละช่อง</div></div>' +
      '<div class="spacer"></div><button id="btnPreviewScores">ดูตัวอย่างก่อนพิมพ์</button>' +
      '<button id="btnSgsXlsx">ส่งออก Excel (.xlsx)</button>' +
      '<button class="primary" id="btnPrintScores">พิมพ์คะแนน SGS</button></div>' +

    '<div class="ss-head">' +
      (s.logoData ? '<img class="ss-logo" src="' + s.logoData + '" alt="">' : '') +
      '<div><div class="ss-school">' + esc(s.schoolName || '') + '</div>' +
      '<div class="ss-title">คะแนนสำหรับกรอก SGS</div>' +
      '<div class="ss-meta">' + esc((sub ? (sub.code ? sub.code + ' ' : '') + sub.name : '')) +
        (cls ? ' • ชั้น ' + esc(cls.name) : '') +
        (period ? ' • ปีการศึกษา ' + esc(period.academicYear) + ' ภาคเรียนที่ ' + esc(period.semester) : '') + '</div>' +
      '<div class="ss-meta">ครูผู้สอน ' + esc(teacher ? teacher.name || teacher.email : (b.meta.teacherName || '—')) +
        ' • นักเรียน ' + rows.length + ' คน</div></div></div>' +

    '<div class="tablewrap"><table class="ss-table"><thead><tr>' +
      '<th class="num">เลขที่</th><th>เลขประจำตัว</th><th>ชื่อ-นามสกุล</th>' +
      parts.map(p => '<th class="num">' + esc(p.label) + '<span class="ss-full">เต็ม ' + fmt(p.w) + '</span></th>').join('') +
      '<th class="num">รวม<span class="ss-full">เต็ม 100</span></th><th class="num">เกรด</th>' +
      '</tr></thead><tbody>' +
      (rows.length ? rows.map(x => '<tr>' +
        '<td class="num">' + esc(x.st.no) + '</td><td>' + esc(x.st.sid) + '</td><td>' + esc(x.st.name) + '</td>' +
        parts.map(p => cell(x.r, p)).join('') +

    '<div class="ss-foot"><div class="ss-dist"><b>สรุปผลการเรียน</b> ' +

/** ส่งออกใบคะแนน SGS เป็น Excel — คอลัมน์ตรงกับใบพิมพ์ทุกช่อง ไม่เพิ่มไม่ลด
    เพราะจุดประสงค์เดียวกันคือคีย์เข้า SGS ให้ตรงช่อง ตัวเลขส่วนเกินทำให้คีย์ผิด
    ต่างกันแค่ตรงนี้ส่งค่าเป็นตัวเลขจริง ไม่ใช่ข้อความ จะได้คัดลอกทั้งคอลัมน์ไปวางได้ */
function exportSgsWorkbook() {
  const b = curBook(true), cls = curClass(), sub = curSubject(), period = curPeriod();
  const sts = curStudents().slice().sort((a, c) => num(a.no) - num(c.no));
  if (!sts.length) return toast('ยังไม่มีรายชื่อนักเรียนในชั้นนี้', 'bad');
  const rows = summaryRows(b, sts, cls.id, sub.id);
  const W = b.weights;
  const parts = [
    { label: 'ก่อนกลางภาค', w: num(W.before), val: r => r.wBefore },
    { label: 'กลางภาค', w: num(W.mid), val: r => r.wM },
    { label: 'หลังกลางภาค', w: num(W.after), val: r => r.wAfter },
    { label: 'ปลายภาค', w: num(W.final), val: r => r.wF }
  ];
  const H = v => ({ v: v, s: 1 });
  const teacher = curTeacher();
  const head = ['เลขที่', 'เลขประจำตัว', 'ชื่อ-นามสกุล']
    .concat(parts.map(p => p.label + ' (เต็ม ' + fmt(p.w) + ')'))
    .concat(['รวม (เต็ม 100)', 'เกรด']).map(H);
  const body = rows.map(x => [num(x.st.no), x.st.sid, x.st.name]
    .concat(parts.map(p => { const v = p.val(x.r); return isFinite(v) ? Number(Number(v).toFixed(2)) : ''; }))
    .concat([isFinite(x.r.total) ? Number(Number(x.r.total).toFixed(2)) : '', String(x.r.grade)]));
  const infoRows = [
    [H('คะแนนสำหรับกรอก SGS'), ''],
    ['สถานศึกษา', DB.settings.schoolName || ''],
    ['ปีการศึกษา', period.academicYear], ['ภาคเรียน', period.semester],
    ['รหัสวิชา', sub.code || ''], ['รายวิชา', sub.name],
    ['ชั้น/ห้อง', cls.name], ['หน่วยกิต', b.meta.credits || ''],
    ['ครูผู้สอน', teacher ? (teacher.name || teacher.email) : (b.meta.teacherName || '')],
    ['จำนวนนักเรียน', rows.length],
    ['วันที่ส่งออก', thaiDate(todayISO())]
  ];
  const sheets = [
    /* ชีตคะแนนเริ่มที่แถวแรกเลย ไม่มีหัวกระดาษคั่น ครูจะได้ลากคลุมทั้งคอลัมน์ไปวางใน SGS ได้ทันที
       ข้อมูลรายวิชาแยกไปอีกชีตเพื่อไม่ให้ไปดันแถวของตาราง */
    { name: 'กรอก SGS', rows: [head].concat(body),
      cols: [8, 15, 30, 17, 14, 17, 14, 15, 9], freeze: { rows: 1, cols: 3 } },
    { name: 'ข้อมูลรายวิชา', rows: infoRows, cols: [22, 40], freeze: { rows: 0, cols: 0 } }
  ];
  const safe = v => String(v || '').replace(/[\\\/:*?"<>|]/g, '_');
  const fn = 'SGS_' + safe(sub.code || sub.name) + '_' + safe(cls.name) +
    '_ปี' + safe(period.academicYear) + '_ภาค' + safe(period.semester) + '.xlsx';
  try {
    download(buildXlsx(sheets), fn);
    toast('ส่งออก ' + fn, 'ok');
  } catch (e) {
    toast('ส่งออกไม่สำเร็จ: ' + (e.message || e), 'bad');
  }
}

  if (!sts.length) { pane.innerHTML = '<div class="card"><div class="empty">ยังไม่มีรายชื่อนักเรียน</div></div>' + summaryToolsCard(); bindSummaryTools(pane); return; }

  const rows = summaryRows(b, sts, curClass().id, curSubject().id);
  const pcts = rows.map(x => x.r.total);
  const avg = pcts.reduce((a, v) => a + v, 0) / (pcts.length || 1);
  const nFail = rows.filter(x => !x.r.passed).length;
  const dist = {};
  rows.forEach(x => { dist[x.r.grade] = (dist[x.r.grade] || 0) + 1; });

  const coverGradeLevels = ['4', '3.5', '3', '2.5', '2', '1.5', '1', '0', 'ร', 'มส'];

    const out = {}; coverGradeLevels.forEach(g => out[g] = 0);

    return out;

          '<option value="passed"' + (x.r.remedy === 'passed' ? ' selected' : '') + '>ผ่าน (เกรด 1)</option>' +

  pane.insertAdjacentHTML('beforeend', summaryToolsCard());

  if (btnSgs) btnSgs.addEventListener('click', exportSgsWorkbook);

/* --- สร้างไฟล์ Excel ----------------------------------------------------- */
function exportWorkbook(groupsOnly) {
  const b = curBook(true);
  const cls = curClass(), sub = curSubject(), period = curPeriod();
  const sts = curStudents().slice().sort((a, c) => a.no - c.no);
  if (!sts.length) return toast('ไม่มีข้อมูลให้ส่งออก', 'bad');

  const H = v => ({ v: v, s: 1 });      // สไตล์หัวตาราง
  const G = v => ({ v: v, s: 4 });      // สไตล์ตัวเล็กสีเทา
  const sheets = [];
  sheets.push({ name: 'ข้อมูล ปพ.5', rows: [
    [H('ข้อมูล ปพ.5'), ''],
    ['สถานศึกษา', DB.settings.schoolName || ''],
    ['ปีการศึกษา', period.academicYear], ['ภาคเรียน', period.semester],
    ['ชั้น/ห้อง', cls.name], ['รหัสวิชา', sub.code || ''], ['รายวิชา', sub.name],
    ['กลุ่มสาระการเรียนรู้', b.meta.learningArea || ''], ['ครูผู้สอน', b.meta.teacherName || ''],
    ['จำนวนหน่วยกิต', b.meta.credits || ''], ['เวลาเรียน (คาบ/สัปดาห์)', b.meta.hoursPerWeek || ''],
    ['เวลาเรียนรวม (ชั่วโมง)', b.meta.totalHours || ''],
    ['คาบตามตารางสอน/ปฏิทิน', attendanceStudentResult(cls.id, sub.id, sts[0]).planned]
  ], cols: [25, 38], freeze: { rows: 0, cols: 0 } });

  /* ---- ชีต 1: คะแนน ---- */
  if (!groupsOnly) {
    const itemCols = [];
    b.items.forEach(it => {
      const components = itemComponents(it);
      if (components.length) {
        components.forEach(component => itemCols.push({ item: it, component: component, retake: false }));
        itemCols.push({ item: it, ksaTotal: true, retake: false });
      } else itemCols.push({ item: it, retake: false });
      if (it.kind === 'unit') itemCols.push({ item: it, retake: true });
    });
    const head1 = ['เลขที่', 'เลขประจำตัว', 'ชื่อ-นามสกุล', 'ชั้น/ห้อง'].map(H);
    const head2 = ['', '', '', 'คะแนนเต็ม →'].map(G);
    itemCols.forEach(col => {
      const it = col.item;
      const sectionLabel = itemScoreSection(it) === 'after' ? 'หลังกลางภาค' : 'ก่อนกลางภาค';
      const label = (col.component ? it.name + ' ' + col.component.key + ' (ดิบ)' : col.ksaTotal ? it.name + ' (คะแนนที่ให้)' : (col.retake ? 'ซ่อม ' : '') + it.name + (it.kind === 'group' ? ' (กลุ่ม)' : '') + (it.kind === 'unit' ? ' (สอบรายหน่วย)' : '')) + ' [' + sectionLabel + ']';
      head1.push(H(label)); head2.push(G(col.component ? num(col.component.rawMax) : num(it.max)));
    });
    const useMid = num(b.exams.midMax) > 0, useFin = num(b.exams.finalMax) > 0;
    if (useMid) { head1.push(H('สอบกลางภาค')); head2.push(G(num(b.exams.midMax))); }
    if (useMid && b.exams.retakeEnabled) { head1.push(H('สอบซ่อมกลางภาค')); head2.push(G(num(b.exams.midMax))); }
    if (useFin) { head1.push(H('สอบปลายภาค')); head2.push(G(num(b.exams.finalMax))); }
    ['ก่อนกลางภาค (เต็ม ' + fmt(b.weights.before) + ')', 'กลางภาค (เต็ม ' + fmt(b.weights.mid) + ')', 'หลังกลางภาค (เต็ม ' + fmt(b.weights.after) + ')', 'ปลายภาค (เต็ม ' + fmt(b.weights.final) + ')',
     'ผลก่อนกลาง', 'ผลกลางภาค', 'ผลหลังกลาง', 'ผลปลายภาค', 'รวมทั้งหมด (เต็ม 100)', 'เกรด', 'ผล', 'แก้ผล 0', 'หมายเหตุ']
      .forEach((h, i) => { head1.push(H(h)); head2.push(G(i < 4 ? num([b.weights.before, b.weights.mid, b.weights.after, b.weights.final][i]) : '')); });

    const rows = [head1, head2];
    sts.forEach(st => {
      const r = calcRow(b, st);
      const sc = b.scores[st.sid] || {}, itemRetakes = b.itemRetakes[st.sid] || {}, ex = b.exam[st.sid] || {};
      const row = [st.no, st.sid, st.name, cls.name];
      itemCols.forEach(col => {
        const v = col.component ? ((((b.componentScores || {})[st.sid] || {})[col.item.id] || {})[col.component.key]) : col.retake ? itemRetakes[col.item.id] : itemScoreValue(b, st.sid, col.item);
        row.push(has(v) ? num(v) : '');
      });
      if (useMid) row.push(has(ex.mid) ? num(ex.mid) : '');
      if (useMid && b.exams.retakeEnabled) row.push(has(ex.retake) ? num(ex.retake) : '');
      if (useFin) row.push(has(ex.final) ? num(ex.final) : '');
      const P = v => v === null ? '' : (v ? 'ผ่าน' : 'ไม่ผ่าน');
      row.push(r.wBefore, r.wM, r.wAfter, r.wF, P(r.passBefore), P(r.passM), P(r.passAfter), P(r.passF),
        r.total, r.grade, r.passed ? 'ผ่าน' : 'ไม่ผ่าน',
        r.remedy === 'passed' ? 'ผ่าน (เกรด 1)' : (r.remedy === 'failed' ? 'ซ่อมแล้วไม่ผ่าน' : ''), b.notes[st.sid] || '');
      rows.push(row);
    });

    const cols = [7, 13, 30, 10].concat(itemCols.map(() => 11));
    if (useMid) cols.push(13);
    if (useMid && b.exams.retakeEnabled) cols.push(15);
    if (useFin) cols.push(13);
    cols.push(12, 12, 12, 12, 11, 11, 11, 11, 15, 8, 10, 16, 18);
    sheets.push({ name: 'คะแนน', rows: rows, cols: cols, freeze: { rows: 2, cols: 3 } });
  }

  if (!groupsOnly) {
    ['traits', 'reading'].forEach(type => {
      const config = assessmentConfig(type);
      const rows = [['เลขที่', 'เลขประจำตัว', 'ชื่อ-นามสกุล'].concat(config.items)
        .concat(['จำนวนระดับ 3', 'จำนวนระดับ 2', 'จำนวนระดับ 1', 'จำนวนระดับ 0', 'ผลประเมินรวม']).map(H)];
      sts.forEach(st => {
        const values = (b.assessments[type] || {})[st.sid] || [];
        const r = assessmentResult(values, config);
        rows.push([st.no, st.sid, st.name].concat(config.items.map((x, i) =>
          values[i] === 0 || values[i] === 1 || values[i] === 2 || values[i] === 3 ? values[i] : ''))
          .concat([r.counts[3], r.counts[2], r.counts[1], r.counts[0], r.level === null ? 'ยังไม่ครบ' : r.level + ' ' + r.label]));
      });
      sheets.push({ name: type === 'traits' ? 'คุณลักษณะ' : 'อ่านคิดวิเคราะห์', rows: rows,
        cols: [7, 13, 28].concat(config.items.map(() => 18)).concat([12, 12, 12, 12, 16]), freeze: { rows: 1, cols: 3 } });
    });

    const attRows = [['เลขที่', 'เลขประจำตัว', 'ชื่อ-นามสกุล', 'มา', 'สาย', 'ลา', 'กิจกรรม', 'ขาด', 'เข้าเรียน/คาบที่เช็ก', 'ร้อยละเวลาเรียน', 'สถานะ'].map(H)];
    sts.forEach(st => {
      const a = attendanceStudentResult(cls.id, sub.id, st);
      attRows.push([st.no, st.sid, st.name, a.counts.present, a.counts.late, a.counts.leave, a.counts.activity, a.counts.absent,
        a.attended + '/' + a.checked, a.pct === null ? '' : Number(a.pct.toFixed(2)), attendanceOutcome(a.pct).label]);
    });
    sheets.push({ name: 'เวลาเรียน', rows: attRows, cols: [7, 13, 28, 8, 8, 8, 10, 8, 16, 16, 16], freeze: { rows: 1, cols: 3 } });
  }

  /* ---- ชีต: ใบแบ่งกลุ่ม ---- */
  const byNo = {}, bySid = {}; sts.forEach(s => { byNo[s.no] = s; bySid[s.sid] = s; });
  const grows = [];
  if (b.groupSets.length) {
    b.groupSets.forEach(gs => {
      const gitems = b.items.filter(it => it.kind === 'group' && it.groupSetId === gs.id);
      grows.push([{ v: 'ชุดกลุ่ม: ' + gs.name, s: 2 }]);
      const groupHeads = ['ชื่อกลุ่ม', 'เลขที่', 'เลขประจำตัว', 'ชื่อ-นามสกุล'];
      gitems.forEach(it => { groupHeads.push(it.name + ' (เต็ม ' + fmt(num(it.max)) + ')'); groupHeads.push('ผู้นำเสนอ — ' + it.name); });
      grows.push(groupHeads.map(H));
      gs.groups.forEach(g => {
        if (!g.members.length) { grows.push([g.name, '', '', '(ยังไม่มีสมาชิก)']); return; }
        g.members.forEach((n, i) => {
          const st = byNo[n];
          const row = [i === 0 ? g.name : '', n, st ? st.sid : '', st ? st.name : '(ไม่พบนักเรียน)'];
          gitems.forEach(it => {
            const v = (b.gscores[it.id] || {})[g.id];
            row.push(i === 0 ? (has(v) ? num(v) : '') : '');
            const presenterNames = (((b.presenters[it.id] || {})[g.id]) || []).map(sid => bySid[sid] ? bySid[sid].name : sid).join(', ');
            row.push(i === 0 ? presenterNames : '');
          });
          grows.push(row);
        });
      });
      grows.push([]);
    });
  } else {
    grows.push([{ v: 'ยังไม่มีการจัดกลุ่มในวิชานี้', s: 2 }]);
  }
  const maxGroupItems = b.groupSets.reduce((mx, gs) => Math.max(mx, b.items.filter(it => it.kind === 'group' && it.groupSetId === gs.id).length), 0);
  const groupCols = [18, 7, 13, 30]; for (let i = 0; i < maxGroupItems; i++) groupCols.push(14, 30);
  sheets.push({ name: 'ใบแบ่งกลุ่ม', rows: grows, cols: groupCols, freeze: { rows: 0, cols: 0 } });

  const safe = s => String(s || '').replace(/[\\\/:*?"<>|]/g, '_');
  const fn = (groupsOnly ? 'ใบแบ่งกลุ่ม_' : 'คะแนน_') +
    safe(sub.code || sub.name) + '_' + safe(cls.name) + '_ปี' + safe(period.academicYear) + '_ภาค' + safe(period.semester) + '.xlsx';
  try {
    download(buildXlsx(sheets), fn);
    toast('ส่งออก ' + fn, 'ok');
  } catch (e) {
    toast('ส่งออกไม่สำเร็จ: ' + (e.message || e), 'bad');
  }
}

/* ============================================================================
   12) ตั้งค่าโรงเรียน เอกสาร และตราโรงเรียน
   ========================================================================== */
function imageFileToDataUrl(file, maxSize) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const scale = Math.min(1, (maxSize || 600) / Math.max(img.width, img.height));
      const canvas = document.createElement('canvas'); canvas.width = Math.max(1, Math.round(img.width * scale)); canvas.height = Math.max(1, Math.round(img.height * scale));
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height); URL.revokeObjectURL(url);
      resolve(canvas.toDataURL('image/png', 0.92));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('อ่านไฟล์รูปไม่สำเร็จ')); };
    img.src = url;
  });
}

/** ตัดพื้นหลังสีขาวรอบ ๆ ตราออกให้โปร่งใส
    ไล่จากขอบภาพเข้าไปเรื่อย ๆ (flood fill) จึงลบเฉพาะพื้นที่ล้อมรอบตรา
    ส่วนสีขาวที่อยู่ในตัวตราเองจะไม่ถูกลบ */
function removeWhiteBackground(dataUrl, tolerance) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const w = img.width, h = img.height;
      const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0);
      let data;
      try { data = ctx.getImageData(0, 0, w, h); } catch (e) { return reject(new Error('อ่านข้อมูลรูปไม่ได้')); }
      const px = data.data, lim = tolerance == null ? 238 : tolerance;
      const isWhite = i => px[i] >= lim && px[i + 1] >= lim && px[i + 2] >= lim && px[i + 3] > 8;
      const seen = new Uint8Array(w * h), stack = [];
      for (let x = 0; x < w; x++) { stack.push(x, 0, x, h - 1); }
      for (let y = 0; y < h; y++) { stack.push(0, y, w - 1, y); }
      let cleared = 0;
      while (stack.length) {
        const y = stack.pop(), x = stack.pop();
        if (x < 0 || y < 0 || x >= w || y >= h) continue;
        const p = y * w + x; if (seen[p]) continue;
        seen[p] = 1;
        const i = p * 4; if (!isWhite(i)) continue;
        px[i + 3] = 0; cleared++;
        stack.push(x + 1, y, x - 1, y, x, y + 1, x, y - 1);
      }
      ctx.putImageData(data, 0, 0);
      // ตัดขอบโปร่งใสส่วนเกินออก ให้ตราเต็มกรอบพอดี
      let minX = w, minY = h, maxX = -1, maxY = -1;
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        if (px[(y * w + x) * 4 + 3] > 8) { if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y; }
      }
      if (maxX < 0) return resolve({ dataUrl: dataUrl, cleared: 0 });
      const out = document.createElement('canvas');
      out.width = maxX - minX + 1; out.height = maxY - minY + 1;
      out.getContext('2d').drawImage(canvas, minX, minY, out.width, out.height, 0, 0, out.width, out.height);
      resolve({ dataUrl: out.toDataURL('image/png'), cleared: cleared });
    };
    img.onerror = () => reject(new Error('อ่านรูปไม่สำเร็จ'));
    img.src = dataUrl;
  });
}

function learningAreaOf(subjectId, periodId) {
  for (const key of Object.keys(DB.books || {})) {
    const parts = key.split('::');
    if (parts[1] === subjectId && (!periodId || parts[2] === periodId)) {
      const area = (((DB.books[key] || {}).meta || {}).learningArea || '').trim(); if (area) return area;
    }
  }
  return 'ยังไม่ระบุกลุ่มสาระ';
}

function attendanceExecutiveData() {
  const statusKeys = ATTENDANCE_STATUSES.map(s => s.value), statuses = Object.fromEntries(statusKeys.map(k => [k, 0])), areas = {}, risks = new Map();
  const records = Object.values(DB.timetable.attendance || {}).filter(r => r.periodId === DB.ui.periodId);
  records.forEach(r => {
    const areaName = learningAreaOf(r.subjectId, r.periodId), subject = DB.subjects.find(s => s.id === r.subjectId) || { id: r.subjectId, code: '', name: 'ไม่พบวิชา' };
    if (!areas[areaName]) areas[areaName] = { checked: 0, statuses: Object.fromEntries(statusKeys.map(k => [k, 0])), subjects: {} };
    if (!areas[areaName].subjects[subject.id]) areas[areaName].subjects[subject.id] = { subject: subject, checked: 0, statuses: Object.fromEntries(statusKeys.map(k => [k, 0])) };
    Object.entries(r.statuses || {}).forEach(([sid, status]) => {
      if (!statuses.hasOwnProperty(status)) return;
      statuses[status]++; areas[areaName].statuses[status]++; areas[areaName].subjects[subject.id].statuses[status]++;
      areas[areaName].checked++; areas[areaName].subjects[subject.id].checked++;
      const rk = [r.classId, r.subjectId, sid].join('::'); if (!risks.has(rk)) risks.set(rk, { sid: sid, classId: r.classId, subject: subject, total: 0, attend: 0 });
      const risk = risks.get(rk); risk.total++; if (status !== 'absent') risk.attend++;
    });
  });
  return { records: records, statuses: statuses, areas: areas, risks: Array.from(risks.values()).map(x => Object.assign(x, { pct: x.total ? x.attend * 100 / x.total : null })).filter(x => x.pct < 80).sort((a, b) => a.pct - b.pct) };
}

      ranking.map((r, i) => '<tr><td>' + (i + 1) + '</td><td><b>' + esc(r.name) + '</b></td><td>' + esc(r.area || '—') + '</td><td>' + r.substitute + '</td><td>' + r.exchange + '</td><td><b>' + r.total + '</b></td></tr>').join('') + '</tbody></table></div>' : '<div class="empty">ยังไม่มีการรับสอนแทนหรือแลกคาบ</div>') + '</div>' +
    '<div class="card"><h3>ประวัติใบลาทั้งหมด</h3>' + (leaves.length ? '<div class="alert-list">' + leaves.slice(0, 60).map(leaveRow).join('') + '</div>' : '<div class="empty">ยังไม่มีข้อมูลการลา</div>') + '</div>';

}

/* ---- ข้อมูลนักเรียนสำหรับผู้บริหาร ----------------------------------------
   ผังห้องของโรงเรียน: ม.ต้น ห้องปกติคือห้อง 5–14 (ห้อง 1–4 เป็นห้องเรียนพิเศษ)
   ม.ปลาย ห้องปกติคือห้อง 4–14 (ห้อง 1–3 เป็นห้องเรียนพิเศษ)
   ห้องปกติทุกห้องควรมีนักเรียนเต็มตาม MAX_STUDENTS คน จึงตรวจเฉพาะห้องปกติ */
const REGULAR_ROOMS = { lower: [5, 14], upper: [4, 14] };
const ROOM_KIND_LABEL = { regular: 'ห้องปกติ', special: 'ห้องเรียนพิเศษ', other: 'นอกผังห้องปกติ', sub: 'ห้องเรียนย่อย' };

function classRoomNo(name) { const m = String(name || '').match(/\/\s*(\d{1,2})/); return m ? parseInt(m[1], 10) : 0; }
function classBand(level) { return ['ม.1', 'ม.2', 'ม.3'].includes(level) ? 'lower' : ['ม.4', 'ม.5', 'ม.6'].includes(level) ? 'upper' : ''; }
/** ตัวอักษรต่อท้ายเลขห้อง เช่น ม.4/9ญ คือห้องเรียนย่อยของ ม.4/9 ไม่ใช่ห้องใหม่ */
function classRoomSuffix(name) { const m = String(name || '').replace(/\s+/g, '').match(/\/\d{1,2}(.*)$/); return m ? m[1] : ''; }
function classRoomKind(cls) {
  const level = classLevel(cls && cls.name), band = classBand(level), room = classRoomNo(cls && cls.name);
  const suffix = classRoomSuffix(cls && cls.name), baseName = level && room ? level + '/' + room : String((cls && cls.name) || '');
  const info = { level: level, band: band, room: room, suffix: suffix, baseName: baseName, isSub: !!suffix };
  if (suffix) return Object.assign(info, { kind: 'sub' });
  if (!band || !room) return Object.assign(info, { kind: 'other' });
  const r = REGULAR_ROOMS[band];
  return Object.assign(info, { kind: room < r[0] ? 'special' : room <= r[1] ? 'regular' : 'other' });
}
const isSubRoom = cls => !!classRoomSuffix(cls && cls.name);
const levelSortKey = level => { const m = String(level || '').match(/^(อ|ป|ม|ปวช|ปวส)\.(\d)$/); return m ? ['อ', 'ป', 'ม', 'ปวช', 'ปวส'].indexOf(m[1]) * 10 + num(m[2]) : 999; };

/** รวมรายชื่อนักเรียนทุกห้อง ผูกกับข้อมูลฐานกลาง (เพศ/สถานะ) */
function schoolRosterRows() {
  const master = new Map();
  (DB.studentMaster || []).forEach(m => { const k = String(m.sid || '').trim(); if (k) master.set(k, m); });
  const rows = [];
  (DB.classes || []).forEach(cls => {
    const info = classRoomKind(cls);
    if (info.isSub) return;   // ห้องเรียนย่อยเป็นนักเรียนกลุ่มเดียวกับห้องหลัก นับซ้ำไม่ได้
    (cls.students || []).forEach(st => {
      const m = master.get(String(st.sid || '').trim()) || {};
      rows.push({ sid: String(st.sid || ''), no: st.no || '', name: st.name || '', cls: cls, className: cls.name || '',
        level: info.level, room: info.room, kind: info.kind, gender: m.gender || '', active: m.active !== false, statusText: m.statusText || '' });
    });
  });
  return rows;
}

/** สรุปการเช็กชื่อรายนักเรียนในภาคเรียนที่เลือก พร้อมแยกเป็นรายวัน */
function studentAttendanceIndex() {
  const idx = new Map();
  Object.values(DB.timetable.attendance || {}).forEach(r => {
    if (r.periodId !== DB.ui.periodId || !r.date) return;
    Object.entries(r.statuses || {}).forEach(([sid, status]) => {
      if (!idx.has(sid)) idx.set(sid, { total: 0, absent: 0, days: new Map() });
      const e = idx.get(sid); e.total++; if (status === 'absent') e.absent++;
      const d = e.days.get(r.date) || { total: 0, absent: 0 };
      d.total++; if (status === 'absent') d.absent++; e.days.set(r.date, d);
    });
  });
  return idx;
}

/** นักเรียนที่ขาดเรียนเต็มวันติดต่อกันเกิน minDays วัน
    นับเฉพาะวันที่มีการเช็กชื่อและขาดทุกคาบของวันนั้น ถ้าเว้นช่วงเกิน 14 วันถือว่าคนละช่วง */
function absenceStreaks(minDays) {
  const idx = studentAttendanceIndex(), byRow = new Map(), out = [];
  schoolRosterRows().forEach(r => { if (r.sid) byRow.set(r.sid, r); });
  // เด็กที่มีชื่อเฉพาะในห้องเรียนย่อย ให้แสดงชื่อห้องหลักแทน จะได้ไม่ขึ้นว่าไม่ระบุห้อง
  (DB.classes || []).filter(isSubRoom).forEach(cls => {
    const info = classRoomKind(cls);
    (cls.students || []).forEach(st => {
      const key = String(st.sid || ''); if (!key || byRow.has(key)) return;
      byRow.set(key, { sid: key, no: st.no || '', name: st.name || '', className: info.baseName, level: info.level, cls: cls });
    });
  });
  const gap = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 86400000);
  idx.forEach((e, sid) => {
    const dates = Array.from(e.days.keys()).sort();
    let run = [], best = null;
    const flush = () => { if (run.length && (!best || run.length > best.length)) best = { length: run.length, from: run[0], to: run[run.length - 1] }; run = []; };
    dates.forEach(d => {
      const day = e.days.get(d);
      if (!(day.total > 0 && day.absent === day.total)) return flush();
      if (run.length && gap(run[run.length - 1], d) > 14) flush();
      run.push(d);
    });
    flush();
    if (!best || best.length <= minDays) return;
    const row = byRow.get(sid) || {};
    out.push({ sid: sid, name: row.name || sid, no: row.no || '', className: row.className || '', level: row.level || '',
      classId: row.cls ? row.cls.id : '', days: best.length, from: best.from, to: best.to,
      rate: e.total ? (e.total - e.absent) * 100 / e.total : null });
  });
  return out.sort((a, b) => b.days - a.days || String(a.className).localeCompare(String(b.className), 'th'));
}

/** ตรวจจำนวนนักเรียนของทุกห้องเทียบกับเกณฑ์ห้องปกติ */
function classCapacityAudit() {
  return (DB.classes || []).filter(cls => !isSubRoom(cls)).map(cls => {
    const info = classRoomKind(cls), count = (cls.students || []).length;
    return Object.assign({ cls: cls, name: cls.name || '', count: count,
      target: info.kind === 'regular' ? MAX_STUDENTS : null,
      diff: info.kind === 'regular' ? count - MAX_STUDENTS : 0 }, info);
  }).sort((a, b) => levelSortKey(a.level) - levelSortKey(b.level) || a.room - b.room || String(a.name).localeCompare(String(b.name), 'th'));
}

function homeroomTeacherName(classId) {
  const t = (DB.teachers || []).find(x => x.homeroomClassId === classId);
  return t ? (t.name || t.email || '') : '';
}
const streakSeverity = d => d > 15 ? 'var(--bad)' : d > 10 ? 'var(--warn)' : 'var(--group)';
const dateRangeText = (a, b) => a === b ? thaiDate(a) : thaiDate(a) + ' – ' + thaiDate(b);

/** แผงทั้งสามของหน้าผู้บริหาร: เฝ้าระวังการขาดเรียน • ห้องที่ไม่ครบ • ข้อมูลนักเรียนทั้งหมด */
function execStudentPanels() {
