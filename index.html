/** คาบของฉันที่ยังไม่มีคนดูแล และเป็นความรับผิดชอบของฉันเอง */
function myUncoveredSelfPeriods() {

  const leaves = new Map((DB.timetable.leaveRequests || []).filter(l => l.teacherId === me.id).map(l => [l.id, l]));
  return (DB.timetable.exchangeRequests || []).filter(r => r.requesterTeacherId === me.id &&

function teacherLearningAreas(teacherId) {
  const areas = new Set(), teacher = DB.teachers.find(t => t.id === teacherId);
  if (teacherArea(teacher)) areas.add(teacherArea(teacher));   // กลุ่มสาระที่ระบุในโปรไฟล์มาก่อน
  scheduleEntries(true).filter(e => e.teacherId === teacherId).forEach(e => areas.add(learningAreaOf(e.subjectId, e.periodId)));
  return areas;

/** เบอร์โทรของครูที่จับคู่กันได้ แสดงเป็นลิงก์กดโทรทันทีบนมือถือ */
function teacherPhoneHtml(teacher) {

/* คาบเข้าแถว/โฮมรูมเป็นงานของครูที่ปรึกษาห้องนั้นโดยตรง จึงไม่เข้าระบบแลกคาบและสอนแทน */
function isHomeroomEntry(entry) {
  if (!entry) return true;
  if (String(entry.slotId) === 'assembly') return true;
  const subject = DB.subjects.find(x => x.id === entry.subjectId) || {};
  return /homeroom|โฮมรูม|เข้าแถว/i.test(String(subject.name || '') + ' ' + String(subject.code || ''));
}
const shiftISODate = (iso, days) => { const d = parseISODate(iso); if (!d) return iso; d.setDate(d.getDate() + days); return isoDate(d); };
/* แลกคาบเลือกได้ 3 ช่วง: ก่อน 1 สัปดาห์ • สัปดาห์เดียวกัน • สัปดาห์ถัดไป

const EXCHANGE_WEEK_OFFSETS = [-1, 0, 1];
const weekOffsetLabel = w => w < 0 ? 'สัปดาห์ก่อน' : w === 0 ? 'สัปดาห์นี้' : 'สัปดาห์หน้า';
/** วัน/เดือน แบบตัวเลขสั้น ๆ ใช้บนชิปเลือกวัน */
const shortDayMonth = iso => { const d = parseISODate(iso); return d ? d.getDate() + '/' + (d.getMonth() + 1) : iso; };

/** คาบที่ติดกันของครูคนเดียวกัน ห้องเดียวกัน วิชาเดียวกัน = หนึ่งคาบคู่
    ต่างจาก adjacentAttendanceEntries ตรงที่มองครูทุกคน ใช้หาคู่ของอีกฝ่ายได้ */
let _blockIndex = null;   // ทำดัชนีคาบคู่ไว้ก่อน เพราะการหาคู่แลกคาบเรียก entryBlock หลายร้อยครั้ง
function buildBlockIndex() {
  const order = DB.timetable.slots.map(x => String(x.id)), byId = {}, groups = new Map();
  scheduleEntries(true).forEach(e => {
    if (String(e.slotId) === 'assembly' || order.indexOf(String(e.slotId)) < 0) { byId[e.id] = [e]; return; }
    const key = [e.teacherId, num(e.day), e.classId, e.subjectId].join('|');
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(e);
  });
  groups.forEach(list => {
    list.sort((a, b) => order.indexOf(String(a.slotId)) - order.indexOf(String(b.slotId)));
    let run = [];
    const flush = () => { const done = run; done.forEach(e => { byId[e.id] = done; }); run = []; };
    list.forEach(e => {
      if (run.length && order.indexOf(String(run[run.length - 1].slotId)) + 1 !== order.indexOf(String(e.slotId))) flush();
      run.push(e);
    });
    flush();
  });

}
function entryBlock(entry) {
  if (!entry || String(entry.slotId) === 'assembly') return entry ? [entry] : [];
  if (_blockIndex && _blockIndex[entry.id]) return _blockIndex[entry.id];
  const order = DB.timetable.slots.map(x => String(x.id)), all = scheduleEntries(true);
  const at = (i) => all.find(e => e.periodId === entry.periodId && e.teacherId === entry.teacherId &&
    num(e.day) === num(entry.day) && e.classId === entry.classId && e.subjectId === entry.subjectId && String(e.slotId) === order[i]);
  let i = order.indexOf(String(entry.slotId)), left = i, right = i;
  if (i < 0) return [entry];
  while (left > 0 && at(left - 1)) left--;
  while (right < order.length - 1 && at(right + 1)) right++;
  const out = [];
  for (let k = left; k <= right; k++) { const e = at(k); if (e) out.push(e); }
  return out.length ? out : [entry];
}
const blockLabel = block => block.length > 1 ? 'คาบคู่ต่อเนื่อง ' + block.length + ' คาบ' : 'คาบเดี่ยว';
/** ครูคนนี้ว่างตลอดทุกคาบของคาบคู่นี้ไหม */
function teacherFreeForBlock(teacherId, date, block, exceptIds) {
  const skip = exceptIds || [];
  return block.every(e => !teacherBusyAt(teacherId, date, e.slotId, skip[block.indexOf(e)] || ''));
}

/* ---- แลกคาบ • สลับคาบ • สอนแทน ต่างกันที่วิธีหาคู่ -------------------------
   สลับคาบ = ครูอีกคนสอน "ห้องเดียวกัน" คนละวัน เอาคาบมาสลับกันตรง ๆ ห้องยังได้เรียนครบทั้งสองวิชา
   แลกคาบ  = ครูอีกคน "ว่างตรงคาบเรา" และเราก็ "ว่างตรงคาบเขา" จึงแลกกันไปสอนคนละคาบ
   สอนแทน  = ครูที่ว่างมาคุมให้ ไม่ต้องสอนคืน
   ทุกกรณีคาบคู่ต้องย้ายพร้อมกันทั้งก้อน จึงจับคู่เฉพาะก้อนที่ยาวเท่ากัน และนับเป็น 2 คาบเสมอ */
const SWAP_KINDS = {
  swap:  { label: 'สลับคาบ', tone: 'swap',  base: 0,   tag: '⇄ สลับคาบ — ห้องเดียวกัน เลขคาบตรงกัน คนละวัน', send: 'ส่งคำขอสลับคาบ' },
  trade: { label: 'แลกคาบ',  tone: 'trade', base: 500, tag: '⇆ แลกคาบ — เขาว่างคาบเรา เราไปสอนคืนคาบเขา', send: 'ส่งคำขอแลกคาบ' }
};
const swapKindOf = req => ((req || {}).swapKind === 'trade' ? 'trade' : 'swap');
/** ป้ายวิธีจัดคาบของคำขอหนึ่งรายการ ใช้ให้ตรงกันทุกหน้าจอและในเอกสาร */
const coverageKindLabel = req => (((req || {}).type || 'exchange') !== 'exchange' ? 'สอนแทน' : SWAP_KINDS[swapKindOf(req)].label);
/** จำนวนคาบจริงของคำขอ — คาบคู่นับเป็น 2 คาบ ไม่ใช่ 1 รายการ */
const requestSlotCount = req => Math.max(1, num((req || {}).slotCount) || ((req || {}).blockEntryIds || []).length);
const totalSlotCount = list => (list || []).reduce((n, r) => n + requestSlotCount(r), 0);
const leavePeriodCount = leave => totalSlotCount((DB.timetable.exchangeRequests || []).filter(r => r.leaveRequestId === (leave || {}).id));
const toneOfCandidate = c => (c && c.mode === 'exchange' ? SWAP_KINDS[c.swapKind === 'trade' ? 'trade' : 'swap'].tone : 'sub');
/** ช่วงคาบแบบอ่านง่าย คาบคู่แสดงเป็น "คาบ 1-2" ไม่ใช่ "คาบ 1" */
function slotSpanText(block) {
  const order = DB.timetable.slots.map(x => String(x.id));
  const ids = (block || []).map(e => String(e.slotId)).sort((a, b) => order.indexOf(a) - order.indexOf(b));
  if (!ids.length) return '';
  if (ids.length > 1) return 'คาบ ' + ids[0] + '-' + ids[ids.length - 1];
  return (DB.timetable.slots.find(x => String(x.id) === ids[0]) || {}).label || ('คาบ ' + ids[0]);
}

function findCoverageCandidates(source, sourceDate) {
  if (!source || isHomeroomEntry(source)) return [];
  _blockIndex = buildBlockIndex(); _dayEntryCache = {};
  try { return coverageCandidateList(source, sourceDate); }
  finally { _blockIndex = null; _dayEntryCache = null; }
}
function coverageCandidateList(source, sourceDate) {
  const sourceTeacher = DB.teachers.find(t => t.id === source.teacherId);
  const myArea = teacherArea(sourceTeacher) || learningAreaOf(source.subjectId, source.periodId);
  const areaKnown = !!myArea && myArea !== 'ยังไม่ระบุกลุ่มสาระ';
  const srcLevel = classLevel((DB.classes.find(c => c.id === source.classId) || {}).name);
  const all = scheduleEntries(true);
  const srcBlock = entryBlock(source), srcIds = srcBlock.map(e => e.id);
  const srcSlotKey = srcBlock.map(e => String(e.slotId)).join('-');
  const areaCache = {}, sameAreaAs = id => {
    if (!(id in areaCache)) areaCache[id] = areaKnown && teacherLearningAreas(id).has(myArea);
    return areaCache[id];
  };
  const levelCache = {}, teachesMyLevel = id => {
    if (!(id in levelCache)) levelCache[id] = !!srcLevel && teacherGradeLevels(id, source.periodId).has(srcLevel);
    return levelCache[id];
  };
  /* ครูจะรับคาบแทนกันได้จริงต้องอยู่กลุ่มสาระเดียวกัน ระบบจึงไม่เสนอครูต่างกลุ่มให้เลย
     ถ้าโรงเรียนยังไม่ได้กรอกกลุ่มสาระของครู ก็กรองไม่ได้ จึงปล่อยผ่านไว้ก่อน
     กรณีตกลงข้ามกลุ่มสาระกันเอง ให้ครูบันทึกเป็นคาบสอนแทนเองในแท็บเช็กชื่อของวันนั้น */
  const canCover = id => !areaKnown || sameAreaAs(id);
  const out = [], seen = new Set();
  const addBlock = (kindKey, teacher, tgtBlock, tierText) => {
    if (tgtBlock.length !== srcBlock.length) return;                  // คาบคู่ต้องแลกกับคาบคู่ที่ยาวเท่ากัน ไม่งั้นเหลือคาบค้างข้างเดียว
    if (tgtBlock.some(e => srcIds.indexOf(e.id) >= 0)) return;
    const key = kindKey + '|' + teacher.id + '|' + num(tgtBlock[0].day) + '|' + tgtBlock.map(e => e.slotId).join('-');
    if (seen.has(key)) return; seen.add(key);
    const head = tgtBlock[0], kind = entryPeriodKind(head), tgtIds = tgtBlock.map(e => e.id);
    EXCHANGE_WEEK_OFFSETS.forEach(week => {
      const targetDate = shiftISODate(entryDateInWeek(head, sourceDate), week * 7);
      if (targetDate === sourceDate) return;                                              // ห้ามสลับในวันเดียวกัน
      if (targetDate < todayISO()) return;                                                // ผ่านไปแล้ว
      if (holidayOf(targetDate, source.periodId)) return;                                 // ตรงกับวันหยุด
      if (!teacherFreeForBlock(teacher.id, sourceDate, srcBlock, tgtIds)) return;          // เขาต้องว่างทุกคาบที่จะมาสอนแทนเรา
      if (!teacherFreeForBlock(source.teacherId, targetDate, tgtBlock, srcIds)) return;    // เราต้องว่างทุกคาบที่ต้องไปสอนคืน
      out.push({ mode: 'exchange', swapKind: kindKey, teacher: teacher, targetEntry: head, targetBlock: tgtBlock, sourceBlock: srcBlock,
        targetDate: targetDate, weekAhead: week, kind: kind,
        rank: SWAP_KINDS[kindKey].base + Math.abs(week) * 10 + (week < 0 ? 5 : 0) + kind.rank,
        tier: SWAP_KINDS[kindKey].label + ' • ' + tierText + ' • ' + weekOffsetLabel(week) +
          (srcBlock.length > 1 ? ' • ' + blockLabel(srcBlock) : '') });
    });
  };
  /* สลับคาบกับแลกคาบใช้ครูกลุ่มเดียวกัน คือครูที่สอน "ห้องเดียวกัน" กับคาบที่เราจะจัด
     ห้องนั้นจึงยังได้เรียนครบทุกวิชาของตัวเอง ไม่มีวิชาแปลกปลอมโผล่เข้ามา
     ต่างกันที่เลขคาบ — ตรงกัน = สลับคาบ (ยกคาบข้ามวันมาสลับที่กันตรง ๆ)
                       ไม่ตรงกัน = แลกคาบ (เขาว่างตรงคาบที่เราลา จึงมาคุมให้ แล้วเราไปสอนคืนคาบของเขา)
     ทั้งสองแบบ addBlock ตรวจให้แล้วว่าอีกฝ่ายว่างตรงคาบเรา และเราว่างตรงคาบเขา */
  all.filter(e => e.periodId === source.periodId && e.teacherId && e.teacherId !== source.teacherId &&
      e.classId === source.classId && e.subjectId !== source.subjectId && srcIds.indexOf(e.id) < 0 && !isHomeroomEntry(e))
    .forEach(target => {
      const teacher = DB.teachers.find(t => t.id === target.teacherId); if (!teacher) return;
      const tgtBlock = entryBlock(target), aligned = tgtBlock.map(e => String(e.slotId)).join('-') === srcSlotKey;
      addBlock(aligned ? 'swap' : 'trade', teacher, tgtBlock,
        aligned ? 'ห้องเดียวกัน • เลขคาบตรงกัน' : 'ห้องเดียวกัน • เขาว่างตรงคาบที่เราลา');
    });
  out.sort((a, b) => a.rank - b.rank || num(a.targetEntry.slotId) - num(b.targetEntry.slotId));
  if (out.length) return capCoverageOptions(out);
  /* ไม่มีใครแลกหรือสลับได้ จึงเหลือทางเลือกสุดท้ายคือขอให้มาสอนแทน โดยไม่ต้องสอนคืน
     สอนแทนดูแค่คาบว่าง แต่ต้องอยู่กลุ่มสาระเดียวกัน และเรียงครูที่สอนระดับชั้นเดียวกันขึ้นก่อน */
  const freeTeachers = DB.teachers.filter(t => t.id !== source.teacherId && teacherHasRole(t, 'teacher') &&
    canCover(t.id) && teacherFreeForBlock(t.id, sourceDate, srcBlock));
  return freeTeachers.map(t => {
    const level = teachesMyLevel(t.id);
    return { mode: 'substitute', swapKind: '', teacher: t, targetEntry: null, sourceBlock: srcBlock, targetDate: sourceDate,
      sameArea: sameAreaAs(t.id), sameLevel: level,
      rank: (level ? 100 : 150) + Math.min(40, coverLoadOf(t.id)),
      tier: 'ขอสอนแทน • กลุ่มสาระเดียวกัน' +
        (srcLevel ? (level ? ' • สอนระดับ ' + srcLevel + ' อยู่แล้ว' : ' • ไม่ได้สอนระดับ ' + srcLevel) : '') +
        (srcBlock.length > 1 ? ' • ' + blockLabel(srcBlock) : '') };
  }).sort((a, b) => a.rank - b.rank || String(a.teacher.name || '').localeCompare(String(b.teacher.name || ''), 'th'));
}
/** ตัดตัวเลือกที่เกินความจำเป็นออก ไม่ให้รายการยาวจนหาของจริงไม่เจอ */
function capCoverageOptions(list) {
  const perGroup = {}, teachers = { swap: new Set(), trade: new Set() }, out = [];
  list.forEach(o => {
    const kind = o.swapKind === 'trade' ? 'trade' : 'swap', key = kind + '|' + o.teacher.id;
    if (!teachers[kind].has(o.teacher.id) && teachers[kind].size >= (kind === 'trade' ? 12 : 30)) return;
    perGroup[key] = (perGroup[key] || 0) + 1;
    if (perGroup[key] > (kind === 'trade' ? 6 : 9)) return;
    teachers[kind].add(o.teacher.id); out.push(o);
  });
  return out;
}
/** แถบคาบของครูหนึ่งคนในวันหนึ่ง ใช้ดูว่าวันนั้นแน่นแค่ไหนและคาบที่จะจัดอยู่ตรงไหน
   เขียว = ว่าง • แดง = มีคาบสอนอยู่แล้ว • กล่องสีตามวิธีจัด (ม่วง = แลกคาบ, ส้มอำพัน = สลับคาบ, ฟ้าเขียว = สอนแทน)
   ทึบ = คาบที่ยกให้ครูอีกฝ่าย • เส้นประอ่อน = คาบที่ต้องไปสอนคืน • คาบคู่ล้อมกรอบเป็นก้อนเดียว */
function slotStripHtml(teacherId, date, markSlotIds, pickBySlot, tone, role) {
  const mark = (markSlotIds || []).map(String), picks = pickBySlot || {};
  const slots = DB.timetable.slots.filter(x => String(x.id) !== 'assembly');
  const kindCls = (tone || 'trade') + ' ' + (role === 'take' ? 'take' : 'give');
  const markNote = tone === 'pick' ? 'คาบที่เลือกไว้จัดการ' : role === 'take' ? 'คาบที่ฉันต้องไปสอนคืน' : 'คาบที่ยกให้ครูท่านนี้';
  let busy = 0, html = '', i = 0;
  while (i < slots.length) {
    const id = String(slots[i].id), label = slots[i].label || ('คาบ ' + id);
    if (mark.indexOf(id) >= 0) {
      let j = i;
      while (j + 1 < slots.length && mark.indexOf(String(slots[j + 1].id)) >= 0) j++;
      const run = slots.slice(i, j + 1);
      const boxes = run.map(x => '<span class="slot-box mark ' + kindCls + '" title="' +
        esc((x.label || ('คาบ ' + x.id)) + ' • ' + markNote) + '">' + esc(String(x.id)) + '</span>').join('');
      html += run.length > 1
        ? '<span class="slot-block ' + kindCls + '" title="' + esc('คาบคู่ ' + run.length + ' คาบ ย้ายพร้อมกัน นับเป็น ' + run.length + ' คาบ') + '">' +
            boxes + '<span class="blk-tag">คาบคู่ ' + run.length + ' คาบ</span></span>'
        : boxes;
      i = j + 1; continue;
    }
    const taken = teacherBusyAt(teacherId, date, id, '');
    if (taken) busy++;
    const canPick = picks[id] !== undefined;
    const note = canPick ? 'กดเพื่อเลือกคาบนี้' : taken ? 'ไม่ว่าง มีคาบสอนอยู่แล้ว' : 'ว่าง';
    html += '<span class="slot-box ' + (taken ? 'busy' : 'free') + (canPick ? ' pickable" data-pick-index="' + picks[id] + '' : '') +
      '" title="' + esc(label + ' • ' + note) + '">' + esc(id) + '</span>';
    i++;
  }
  return '<div class="slot-strip">' + html + '<span class="slot-count">ติดสอน ' + busy + '/' + slots.length + ' คาบ</span></div>';
}
function slotLegendHtml() {
  return '<div class="slot-legend"><span class="k"><i class="free"></i>คาบว่าง</span>' +
    '<span class="k"><i class="busy"></i>ไม่ว่าง</span>' +
    '<span class="k"><i class="mark trade give"></i><i class="mark trade take"></i>แลกคาบ (ยกให้ / สอนคืน)</span>' +
    '<span class="k"><i class="mark swap give"></i><i class="mark swap take"></i>สลับคาบ (ยกให้ / สอนคืน)</span>' +
    '<span class="k"><i class="mark sub give"></i>สอนแทน</span>' +
    '<span class="k"><i class="mark pick give"></i>คาบที่เลือกไว้จัดการ</span>' +
    '<span class="k"><i class="blk"></i>กรอบประ = คาบคู่ นับเป็น 2 คาบ</span></div>';
}

/** รวมตัวเลือกของครูคนเดียวกันไว้การ์ดเดียว แล้วให้ครูคลิกเลือกคาบเองได้
   เดิมครูคนหนึ่งขึ้นหลายการ์ดตามจำนวนคาบที่แลกได้ ทำให้รายการยาวและดูซ้ำ */
/** ชิปเลือกวัน แยกเป็นแถวตามสัปดาห์ ให้เห็นว่าเลือกได้ 3 ช่วง */
function weekPickerHtml(group) {
  return EXCHANGE_WEEK_OFFSETS.map(week => {
    const opts = group.options.map((o, oi) => ({ o: o, oi: oi })).filter(x => x.o.weekAhead === week);
    if (!opts.length) return '';
    return '<div class="pick-week"><div class="pick-week-label">' + esc(weekOffsetLabel(week)) + '</div><div class="pick-chips">' +
      opts.map(x => '<button class="pick-chip' + (x.oi === group.pick ? ' on' : '') + '" data-pick-group="' + esc(group.key) + '" data-pick-index="' + x.oi + '">' +
        '<b>' + esc(shortDayMonth(x.o.targetDate)) + '</b> ' + esc(slotSpanText(x.o.targetBlock || [x.o.targetEntry])) + '</button>').join('') +
      '</div></div>';
  }).join('');
}

/** คาบไหนในวันนั้นที่กดเลือกได้บ้าง (มีตัวเลือกจริงรองรับ) */
function slotPicksFor(group, date) {
  const map = {};
  group.options.forEach((o, oi) => { if (o.targetDate === date) (o.targetBlock || [o.targetEntry]).forEach(e => { map[String(e.slotId)] = oi; }); });
  return map;
}

/* ครูคนเดียวอาจทั้งสลับคาบและแลกคาบได้ จึงต้องแยกการ์ดตามวิธี ไม่งั้นสีกับปุ่มจะไม่ตรงกับตัวเลือกที่เลือกไว้ */
function candidateGroups(list) {
  const picks = DB.ui.exchangeChoice || {}, groups = [], byKey = {};
  (list || []).forEach(c => {
    const key = (c.mode === 'exchange' ? (c.swapKind === 'trade' ? 'trade' : 'swap') : 'sub') + ':' + c.teacher.id;
    if (!byKey[key]) { byKey[key] = { key: key, teacherId: c.teacher.id, options: [], pick: 0 }; groups.push(byKey[key]); }
    byKey[key].options.push(c);
  });
  groups.forEach(g => { const want = num(picks[g.key]); g.pick = want >= 0 && want < g.options.length ? want : 0; });
  return groups;
}

function sourceEntryText(entry, date) {
  const subject = DB.subjects.find(s => s.id === entry.subjectId), cls = DB.classes.find(c => c.id === entry.classId), slot = DB.timetable.slots.find(s => s.id === String(entry.slotId));
  return thaiDate(date) + ' • ' + (slot ? slot.label : '') + ' • ' + (cls ? cls.name : 'ไม่พบห้อง') + ' • ' + (subject ? (subject.code ? subject.code + ' ' : '') + subject.name : 'ไม่พบวิชา');
}
function createCoverageRequest(source, sourceDate, candidate, reason, reasonOther, note, leaveRequestId) {
  const srcBlock = (candidate && candidate.sourceBlock) || entryBlock(source);
  const tgtBlock = (candidate && candidate.targetBlock) || (candidate && candidate.targetEntry ? [candidate.targetEntry] : []);
  const req = { id: uid('swap'), periodId: source.periodId, type: candidate && candidate.mode || 'substitute', swapKind: (candidate && candidate.swapKind) || '', sourceDate: sourceDate, date: sourceDate, targetDate: candidate && candidate.targetDate || sourceDate, classId: source.classId,
    blockEntryIds: srcBlock.map(e => e.id), targetBlockEntryIds: tgtBlock.map(e => e.id), slotCount: srcBlock.length,
    requesterTeacherId: source.teacherId, targetTeacherId: candidate && candidate.teacher ? candidate.teacher.id : '', requesterEntryId: source.id, targetEntryId: candidate && candidate.targetEntry ? candidate.targetEntry.id : '',
    reason: reason || 'other', reasonOther: reasonOther || '', note: note || '', tier: candidate ? candidate.tier : 'ยังไม่พบครูว่าง', leaveRequestId: leaveRequestId || '', status: candidate ? 'pending' : 'unassigned', createdAt: new Date().toISOString() };
  DB.timetable.exchangeRequests.push(req); return req;
}
function hiddenRegularEntryIds(date) {
  const ids = new Set();
  (DB.timetable.exchangeRequests || []).filter(r => r.status === 'accepted').forEach(r => {
    const sourceDate = r.sourceDate || r.date, targetDate = r.targetDate || r.date;
    const src = (r.blockEntryIds && r.blockEntryIds.length ? r.blockEntryIds : [r.requesterEntryId]).filter(Boolean);
    const tgt = (r.targetBlockEntryIds && r.targetBlockEntryIds.length ? r.targetBlockEntryIds : [r.targetEntryId]).filter(Boolean);
    if (sourceDate === date) src.forEach(id => ids.add(id));
    if ((r.type || 'exchange') === 'exchange' && targetDate === date) tgt.forEach(id => ids.add(id));
  });
  return ids;
}

function openExchangeRequest(date, targetSlotId, preferredClassId) {
  DB.ui.exchangeDate = date || todayISO(); DB.ui.exchangeClassId = preferredClassId || '';
  const own = (effectiveDayEntries(DB.ui.exchangeDate).find(x => x.slotId === String(targetSlotId)) || {}).entry;
  DB.ui.exchangeSourceEntryId = own ? own.id : ''; save(true); setTab('exchange');
}

function respondExchangeRequest(id, accept) {
  if (blockAdminApproval()) return;
  const req = (DB.timetable.exchangeRequests || []).find(r => r.id === id); if (!req || req.status !== 'pending') return;
  const source = DB.timetable.entries.find(e => e.id === req.requesterEntryId), target = DB.timetable.entries.find(e => e.id === req.targetEntryId), sourceDate = req.sourceDate || req.date, targetDate = req.targetDate || req.date;
  if (accept && !source) return toast('คาบต้นทางถูกแก้ไขหรือลบไปแล้ว', 'bad');
  if (accept && (req.type || 'exchange') === 'exchange' && !target) return toast('คาบปลายทางถูกแก้ไขหรือลบไปแล้ว', 'bad');
  req.status = accept ? 'accepted' : 'rejected'; req.respondedAt = new Date().toISOString();
  // คาบคู่ต้องย้ายไปพร้อมกันทุกคาบ ไม่งั้นจะเหลือคาบค้างที่ไม่มีใครสอน
  const idsToEntries = ids => (ids || []).map(id => DB.timetable.entries.find(e => e.id === id)).filter(Boolean);
  const srcBlock = idsToEntries(req.blockEntryIds).length ? idsToEntries(req.blockEntryIds) : (source ? [source] : []);
  const tgtBlock = idsToEntries(req.targetBlockEntryIds).length ? idsToEntries(req.targetBlockEntryIds) : (target ? [target] : []);
  const noteText = exchangeReasonLabel(req) + (req.note ? ' • ' + req.note : '');
  const addException = (kind, base, date, slotId, teacherId) => DB.timetable.exceptions.push({ id: uid(kind),
    periodId: req.periodId, date: date, day: (parseISODate(date) || new Date()).getDay(), slotId: String(slotId),
    teacherId: teacherId, subjectId: base.subjectId, classId: base.classId, room: base.room || '',
    sessionType: kind === 'xswap' ? 'exchange' : 'substitute', exchangeRequestId: req.id, note: noteText });
  if (accept && (req.type || 'exchange') === 'exchange' && swapKindOf(req) === 'trade') {
    /* แลกคาบ — คนละห้องกัน คาบจึงอยู่ที่เดิมทั้งสองฝั่ง เปลี่ยนแค่คนสอน
       เขามาสอนคาบเราในวันที่เราไม่อยู่ แล้วเราไปสอนคาบของเขาคืนในวันที่ตกลงกัน
       ถ้าย้ายคาบข้ามวันแบบสลับคาบ ห้องจะได้เรียนวิชาที่ไม่ใช่ของตัวเอง */
    srcBlock.forEach(e => addException('xswap', e, sourceDate, e.slotId, target.teacherId));
    tgtBlock.forEach(e => addException('xswap', e, targetDate, e.slotId, source.teacherId));
  } else if (accept && (req.type || 'exchange') === 'exchange') {
    // สลับคาบ — ห้องเดียวกัน จึงยกคาบข้ามวันมาสลับกันได้จริง ห้องยังได้เรียนครบทั้งสองวิชา
    srcBlock.forEach((e, i) => { const slot = (tgtBlock[i] || tgtBlock[0]).slotId; addException('xswap', e, targetDate, slot, source.teacherId); });
    tgtBlock.forEach((e, i) => { const slot = (srcBlock[i] || srcBlock[0]).slotId; addException('xswap', e, sourceDate, slot, target.teacherId); });
  } else if (accept) {
    srcBlock.forEach(e => addException('xsub', e, sourceDate, e.slotId, req.targetTeacherId));
  }
  if (req.leaveRequestId) {
    const leave = (DB.timetable.leaveRequests || []).find(l => l.id === req.leaveRequestId), linked = leave ? (DB.timetable.exchangeRequests || []).filter(r => r.leaveRequestId === leave.id) : [];
    if (leave) leave.coverageStatus = linked.length && linked.every(r => r.status === 'accepted') ? 'covered' : linked.some(r => r.status === 'rejected' || r.status === 'unassigned') ? 'attention' : 'pending';
  }
  save(true); pushRequestDoc('swap', req);
  if (req.leaveRequestId) pushRequestDoc('leave', (DB.timetable.leaveRequests || []).find(l => l.id === req.leaveRequestId));
  render(); toast(accept ? ((req.type || 'exchange') === 'exchange' ? 'ยอมรับคำขอและปรับตารางแล้ว' : 'รับสอนแทนและเพิ่มคาบแล้ว') : 'ปฏิเสธคำขอแล้ว', accept ? 'ok' : '');
}

/* ---------- ลบคำขอ พร้อมเก็บหลักฐาน ---------------------------------------
   ลบแล้วรายการหายจากทุกหน้าจอ แต่ยังตรวจสอบย้อนหลังได้ว่าใครลบ เมื่อไร เพราะอะไร
   บนส่วนกลางใช้การทำเครื่องหมาย deleted เพื่อไม่ให้ข้อมูลไหลกลับลงมาตอนซิงก์ */
function logAudit(action, summary, detail) {
  const me = curTeacher() || {};
  const entry = { id: uid('audit'), at: new Date().toISOString(), action: action, summary: summary || '',
    byId: me.id || '', byName: me.name || '', byEmail: me.email || DB.cloud.accountEmail || '', detail: detail || {} };
  DB.auditLog = (DB.auditLog || []).concat([entry]);
  if (DB.auditLog.length > 500) DB.auditLog = DB.auditLog.slice(-500);
  if (firebaseReady() && fbSignedIn()) fbDb.collection('audits').doc(entry.id).set(fbPlain(entry)).catch(() => {});
  return entry;
}

function markDeletedOnCloud(kind, item, reason) {
  if (!firebaseReady() || !fbSignedIn() || !item || !item.id) return;
  const me = curTeacher() || {};
  fbDb.collection(kind === 'leave' ? 'leaves' : 'swaps').doc(item.id)
    .set({ status: 'deleted', deletedAt: new Date().toISOString(), deletedBy: me.name || me.email || '', deleteReason: reason || '' }, { merge: true })
    .catch(e => toast('ลบบนส่วนกลางไม่สำเร็จ: ' + fbErrorMessage(e), 'bad'));
}

/** ลบได้เมื่อเป็นเจ้าของคำขอ หรือเป็นผู้ดูแลระบบ — ผู้ดูแลระบบต้องระบุเหตุผล */
function canDeleteRequest(ownerTeacherId) {
  const me = curTeacher(); if (!me) return { ok: false };
  const mine = ownerTeacherId === me.id, admin = teacherHasRole(me, 'admin');
  return { ok: mine || admin, mine: mine, admin: admin, needReason: !mine };
}

function askDeleteReason(title, warnHTML, needReason, onConfirm) {
  openModal({ title: title,
    bodyHTML: (warnHTML || '') +
      '<div class="pick" style="margin-top:10px"><label>เหตุผลในการลบ' + (needReason ? ' (จำเป็น)' : ' (ไม่บังคับ)') + '</label>' +
      '<input id="deleteReason" style="width:100%" placeholder="เช่น ส่งผิดคาบ / ครูยกเลิกการลา"></div>' +
      '<div class="hint" style="margin-top:8px">ระบบจะบันทึกชื่อผู้ลบ วันเวลา และเหตุผลไว้เป็นหลักฐานในประวัติการลบ</div>',
    buttons: [{ label: 'ยกเลิก' }, { label: 'ยืนยันการลบ', cls: 'danger', act(close, root) {
      const reason = $('#deleteReason', root).value.trim();
      if (needReason && !reason) return toast('ผู้ดูแลระบบต้องระบุเหตุผลก่อนลบ', 'bad');
      close(); onConfirm(reason);
    } }],
    onMount(root) { $('#deleteReason', root).focus(); } });
}

function deleteExchangeRequest(id) {
  const req = (DB.timetable.exchangeRequests || []).find(r => r.id === id); if (!req) return;
  const perm = canDeleteRequest(req.requesterTeacherId);
  if (!perm.ok) return toast('ลบได้เฉพาะคำขอของตัวเอง หรือโดยผู้ดูแลระบบ', 'bad');
  const owner = (DB.teachers.find(t => t.id === req.requesterTeacherId) || {}).name || 'ครู';
  const kind = coverageKindLabel(req);
  const entry = DB.timetable.entries.find(e => e.id === req.requesterEntryId);
  const accepted = req.status === 'accepted';
  askDeleteReason('ลบคำขอ' + kind,
    '<div class="notice' + (accepted ? ' bad' : '') + '">ผู้ขอ: <b>' + esc(owner) + '</b>' +
      (entry ? '<br>' + esc(sourceEntryText(entry, req.sourceDate || req.date)) : '') +
      (accepted ? '<br><b>คำขอนี้ยอมรับแล้ว</b> การลบจะคืนตารางสอนของวันนั้นกลับเป็นคาบเดิม' : '') + '</div>',
    perm.needReason, function (reason) {
      DB.timetable.exceptions = (DB.timetable.exceptions || []).filter(e => e.exchangeRequestId !== req.id);
      DB.timetable.exchangeRequests = (DB.timetable.exchangeRequests || []).filter(r => r.id !== req.id);
      const leave = req.leaveRequestId ? (DB.timetable.leaveRequests || []).find(l => l.id === req.leaveRequestId) : null;
      if (leave) leave.requestIds = (leave.requestIds || []).filter(x => x !== req.id);

  if (blockAdminApproval()) return;

  // ลากิจและไปราชการต้องแลกคาบเอง ประเภทอื่นเลือกให้หัวหน้ากลุ่มสาระจัดให้ได้

    approval: { status: 'draft', by: '', at: '', note: '' }, headApproval: { status: 'none', by: '', at: '', note: '' }, createdAt: new Date().toISOString() };
  DB.timetable.leaveRequests.push(leave); const d = parseISODate(from), end = parseISODate(to); let affected = 0, guard = 0;
  while (d && end && d <= end && guard++ < 370) {
    const date = isoDate(d), day = d.getDay();
    // คาบเข้าแถว/โฮมรูมไม่ต้องหาคนแลกหรือสอนแทน
    // คาบที่ติดกันของห้องและวิชาเดียวกัน นับเป็นคาบคู่เดียว ส่งคำขอครั้งเดียว

      if (doneIds.has(source.id)) return;

      leave.requestIds.push(req.id); affected += block.length;
    });
    d.setDate(d.getDate() + 1);
  }
  if (!affected) leave.coverageStatus = 'none'; save(true);
  pushRequestDoc('leave', leave);
  (DB.timetable.exchangeRequests || []).filter(r => r.leaveRequestId === leave.id).forEach(r => pushRequestDoc('swap', r));
  renderExchangeCenter(); renderTop();
  toast(coverageMode === 'head'

    : 'บันทึกการลาแล้ว • ส่งเข้าระบบจัดคาบ ' + affected + ' คาบ ' + (mustCoverSelf(reason) ? '(ประเภทนี้ต้องแลกคาบเอง)' : ''), 'ok');
}

/* ---- การลา: นับวัน สถิติ เอกสาร และสายอนุมัติ ---------------------------- */
/** นับเฉพาะวันจันทร์–ศุกร์ในช่วงที่ลา */
/* ไปราชการไม่ใช่การลา จึงไม่นับเป็นวันลา แต่ยังต้องหาครูดูแลคาบเหมือนกัน
   และใช้เอกสารคนละแบบกับใบลา */
const isOfficialTrip = leave => (leave || {}).reason === 'official';
const leaveKindLabel = leave => isOfficialTrip(leave) ? 'ไปราชการ' : 'การลา';
const leaveDocTitle = leave => isOfficialTrip(leave) ? 'บันทึกขออนุญาตไปราชการ' : 'ใบลา';

function leaveDays(leave) {
  const start = parseISODate(leave.fromDate), end = parseISODate(leave.toDate || leave.fromDate);
  if (!start || !end || end < start) return 0;
  let n = 0, guard = 0, d = new Date(start);
  while (d <= end && guard++ < 400) { const w = d.getDay(); if (w >= 1 && w <= 5) n++; d.setDate(d.getDate() + 1); }
  return n;
}
const leaveApprovalLabel = status => ({ draft: 'ยังไม่ส่ง', submitted: 'รอผู้บริหารอนุมัติ', approved: 'อนุมัติแล้ว', rejected: 'ไม่อนุมัติ' }[status] || 'ยังไม่ส่ง');
const leaveApprovalBadge = status => '<span class="badge ' + (status === 'approved' ? 'ok' : status === 'rejected' ? 'bad' : status === 'submitted' ? 'warn' : '') + '">' + leaveApprovalLabel(status) + '</span>';

/** สรุปการลารายครู: จำนวนครั้งแยกประเภท รวมครั้ง รวมวัน และคาบที่มีผู้สอนแทน */
function leaveStatsByTeacher(periodId) {
  const rows = new Map();
  (DB.timetable.leaveRequests || []).filter(l => !periodId || l.periodId === periodId).forEach(l => {
    const teacher = DB.teachers.find(t => t.id === l.teacherId);
    if (!teacher) return;   // ใบลาที่ไม่มีเจ้าของแล้ว ไม่นำมาคิดสถิติ ใช้ปุ่มล้างในหน้าผู้ดูแลระบบแทน
    if (!rows.has(l.teacherId)) rows.set(l.teacherId, { teacher: teacher, name: teacher.name || 'ไม่พบครู', area: teacherArea(teacher), times: 0, days: 0, byType: {}, periods: 0, covered: 0, pending: 0 });
    const row = rows.get(l.teacherId), type = exchangeReasonLabel(l).split(' — ')[0];
    row.times++; row.days += leaveDays(l); row.byType[type] = (row.byType[type] || 0) + 1;
    const linked = (DB.timetable.exchangeRequests || []).filter(r => r.leaveRequestId === l.id);
    row.periods += totalSlotCount(linked); row.covered += totalSlotCount(linked.filter(r => r.status === 'accepted')); row.pending += totalSlotCount(linked.filter(r => r.status !== 'accepted'));
  });
  return Array.from(rows.values()).sort((a, b) => b.days - a.days || b.times - a.times);
}
/** จัดอันดับครูที่รับสอนแทน/รับแลกคาบมากที่สุด */
function coverageRanking(periodId) {
  const rows = new Map();
  (DB.timetable.exchangeRequests || []).filter(r => r.status === 'accepted' && (!periodId || r.periodId === periodId)).forEach(r => {
    if (!r.targetTeacherId) return;
    if (!rows.has(r.targetTeacherId)) { const t = DB.teachers.find(x => x.id === r.targetTeacherId); if (!t) return; rows.set(r.targetTeacherId, { name: t.name || 'ไม่พบครู', area: teacherArea(t), substitute: 0, exchange: 0 }); }
    const row = rows.get(r.targetTeacherId);
    if ((r.type || 'exchange') === 'exchange') row.exchange += requestSlotCount(r); else row.substitute += requestSlotCount(r);
  });
  return Array.from(rows.values()).map(r => Object.assign(r, { total: r.substitute + r.exchange })).sort((a, b) => b.total - a.total || b.substitute - a.substitute);
}

/* ---- แบบฟอร์มราชการตามต้นฉบับของโรงเรียน ------------------------------- */
const THAI_MONTHS = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน',
  'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
/** แยกวันที่ไทยเป็น วัน / เดือน / พ.ศ. สำหรับกรอกลงช่องในแบบฟอร์ม */
function thaiDateParts(iso) {
  const d = parseISODate(iso);
  return d ? { day: d.getDate(), month: THAI_MONTHS[d.getMonth()], year: d.getFullYear() + 543 } : { day: '', month: '', year: '' };
}
/** ช่องเติมข้อความบนเส้นประ */
function fill(value, width) {

}
/** ช่องเติมที่ยืดแบ่งพื้นที่ที่เหลือในบรรทัดเอง ใช้กับบรรทัดที่มีคลาส doc-flow
    weight คือสัดส่วนความยาวเส้นประเทียบกับช่องอื่นในบรรทัดเดียวกัน */
function flow(value, weight) {
  return '<span class="doc-fill" style="flex-grow:' + (weight || 1) + '">' + esc(value == null ? '' : String(value)) + '</span>';
}
const nowrap = text => '<span class="nw">' + esc(text) + '</span>';
/** ช่องติ๊กเลือก */
function tick(checked, label) {

const schoolFullName = () => (DB.settings.schoolName || 'โรงเรียน') + (DB.settings.schoolLocation ? ' ' + DB.settings.schoolLocation : '');

/** แบบใบลาป่วย ลากิจส่วนตัว และลาคลอดบุตร — ตามแบบฟอร์มของโรงเรียน */
function leaveDocumentHtml(leave) {
  const s = DB.settings, teacher = DB.teachers.find(t => t.id === leave.teacherId) || {};
  const kind = leave.reason, from = thaiDateParts(leave.fromDate), to = thaiDateParts(leave.toDate || leave.fromDate);
  const days = leaveDays(leave), created = thaiDateParts(String(leave.createdAt || '').slice(0, 10) || leave.fromDate);
  const reasonText = exchangeReasonLabel(leave);

  // การลาครั้งก่อนหน้าของครูคนนี้ ใช้เติมช่อง "ข้าพเจ้าได้ลา...ครั้งสุดท้าย"
  const mine = (DB.timetable.leaveRequests || []).filter(l => l.teacherId === leave.teacherId && l.id !== leave.id)
    .sort((a, b) => String(b.fromDate).localeCompare(String(a.fromDate)));
  const last = mine[0] || null, lastFrom = last ? thaiDateParts(last.fromDate) : null, lastTo = last ? thaiDateParts(last.toDate || last.fromDate) : null;

  // สถิติการลาแยกประเภท: ลามาแล้ว / ครั้งนี้ / รวม
  const types = [{ key: 'sick', label: 'ลาป่วย' }, { key: 'personal', label: 'ลากิจส่วนตัว' }, { key: 'maternity', label: 'ลาคลอดบุตร' }];
  const statRows = types.map(t => {
    const before = mine.filter(l => l.reason === t.key);
    const beforeDays = before.reduce((a, l) => a + leaveDays(l), 0);
    const now = kind === t.key ? 1 : 0, nowDays = kind === t.key ? days : 0;
    return '<tr><td class="lt">' + esc(t.label) + '</td><td>' + (before.length || '') + '</td><td>' + (beforeDays || '') + '</td>' +
      '<td>' + (nowDays || '') + '</td><td>' + ((before.length + now) || '') + '</td><td>' + ((beforeDays + nowDays) || '') + '</td></tr>';
  }).join('');

  const head = leave.headApproval || {}, approval = leave.approval || {};
  const headName = (DB.teachers.find(t => t.id === head.by) || {}).name || headNameOfArea(teacherArea(teacher)) || s.headLearningName || '';
  const decided = approval.at ? thaiDateParts(String(approval.at).slice(0, 10)) : { day: '', month: '', year: '' };

  return '<div class="doc-sheet form-sheet">' +

/* ครูบางคนอยากได้ชื่อวิชาเต็มและหมายเหตุคาบคู่ไว้ในเอกสาร บางคนว่ารกและทำให้เกินหนึ่งหน้า
   จึงให้เลือกเองตอนพรีวิว แล้วจำค่าไว้ใช้ครั้งต่อไป ค่าเริ่มต้นคือแบบกระชับ */
const memoDetailOn = () => !!DB.ui.memoDetail;
const memoDetailToggleHtml = () =>
  '<label class="doc-opt"><input type="checkbox" id="memoDetailToggle"' + (memoDetailOn() ? ' checked' : '') + '>' +
  'ใส่รายละเอียดเพิ่มในตาราง — ชื่อวิชาเต็ม • วิธีจัดคาบ • หมายเหตุคาบคู่</label>' +
  '<div class="hint" style="margin-bottom:8px">ปิดไว้จะได้เอกสารกระชับ ลงกระดาษแผ่นเดียวง่ายกว่า • ช่อง “คาบที่” ยังบอกช่วงคาบคู่ เช่น คาบ 3-4 อยู่แล้ว</div>';

/** บันทึกข้อความขอสับเปลี่ยน/แลกคาบสอน — ตามแบบฟอร์มของโรงเรียน
    รับได้ทั้งคำขอเดียวและหลายคำขอ (เช่น ทุกคาบของใบลาหนึ่งใบ) */
function exchangeMemoHtml(requests, leave) {
  const s = DB.settings, list = [].concat(requests).filter(Boolean);
  const first = list[0] || {};
  const requester = DB.teachers.find(t => t.id === (leave ? leave.teacherId : first.requesterTeacherId)) || {};
  const official = leave ? leave.reason === 'official' : first.reason === 'official';
  const personal = leave ? leave.reason === 'personal' : first.reason === 'personal';
  const dates = list.map(r => r.sourceDate || r.date).filter(Boolean).sort();
  const from = thaiDateParts(leave ? leave.fromDate : dates[0]);
  const to = thaiDateParts(leave ? (leave.toDate || leave.fromDate) : dates[dates.length - 1]);
  const created = thaiDateParts(String((leave || first).createdAt || '').slice(0, 10) || dates[0]);
  const note = (leave && (leave.note || leave.reasonOther)) || first.note || '';

  /* คาบคู่ต้องขึ้นเป็นช่วง เช่น "คาบ 1-2" และนับเป็น 2 คาบ ไม่ใช่ 1 รายการ ไม่งั้นยอดในเอกสารขาด */
  const entriesOf = (ids, fallback) => {
    const found = (ids || []).map(id => DB.timetable.entries.find(e => e.id === id)).filter(Boolean);
    return found.length ? found : (fallback ? [fallback] : []);
  };
  const detail = memoDetailOn();
  const rows = list.map(r => {
    const src = DB.timetable.entries.find(e => e.id === r.requesterEntryId) || null;
    const dst = DB.timetable.entries.find(e => e.id === r.targetEntryId) || null;
    const srcBlock = entriesOf(r.blockEntryIds, src), dstBlock = entriesOf(r.targetBlockEntryIds, dst);
    const cover = DB.teachers.find(t => t.id === r.targetTeacherId);
    const info = e => ({
      /* แบบกระชับใช้รหัสวิชาอย่างเดียว ซึ่งระบุวิชาได้ครบอยู่แล้วและไม่ตกบรรทัด */
      subject: (function () { const sub = DB.subjects.find(x => x.id === e.subjectId); if (!sub) return '';
        return detail ? (sub.code ? sub.code + ' ' : '') + sub.name : (sub.code || sub.name); })(),
      cls: (DB.classes.find(c => c.id === e.classId) || {}).name || ''
    });
    const a = info(src || {}), b = dst ? info(dst) : null;
    const srcDate = thaiDateParts(r.sourceDate || r.date), dstDate = dst ? thaiDateParts(r.targetDate || r.date) : null;
    const pairNote = n => detail && n > 1 ? '<div class="memo-sub">คาบคู่ นับ ' + n + ' คาบ</div>' : '';
    return '<tr><td>' + (srcDate.day ? srcDate.day + '/' + (parseISODate(r.sourceDate || r.date).getMonth() + 1) + '/' + srcDate.year : '') + '</td>' +
      '<td>' + esc(slotSpanText(srcBlock)) + pairNote(srcBlock.length) + '</td>' +
      '<td class="lt">' + esc(a.subject) + '</td><td>' + esc(a.cls) + '</td>' +
      '<td class="lt">' + esc(cover ? cover.name || cover.email : '') +
        (cover && detail ? '<div class="memo-sub">' + esc(coverageKindLabel(r)) + '</div>' : '') + '</td>' +
      '<td>' + (dstDate ? dstDate.day + '/' + (parseISODate(r.targetDate || r.date).getMonth() + 1) + '/' + dstDate.year : '') + '</td>' +
      '<td>' + esc(b ? b.cls : '') + '</td><td class="lt">' + esc(b ? b.subject : '') + '</td>' +
      '<td>' + (b ? esc(slotSpanText(dstBlock)) + pairNote(dstBlock.length) : '') + '</td>' +
      '<td></td></tr>';
  }).join('');

/** rebuild = ฟังก์ชันสร้าง HTML ใหม่ ใส่มาเมื่อเอกสารนั้นมีตัวเลือกให้ปรับก่อนพิมพ์ */
function openDocumentPreview(title, html, rebuild) {

  const box = h => '<div id="docPreviewBox" style="max-height:64vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:8px">' + h + '</div>';
  openModal({ title: title, wide: true,
    bodyHTML: (rebuild ? memoDetailToggleHtml() : '') + box(html),
    buttons: [{ label: 'ปิด' }, { label: 'พิมพ์เอกสาร', cls: 'primary', act(close) { close(); printDocument(current); } }],
    onMount(root) {

/** ส่งใบลาเข้าสายอนุมัติ: หัวหน้ากลุ่มสาระรับรองก่อน แล้วผู้บริหารอนุมัติ */
function submitLeaveForApproval(id) {
  if (blockAdminApproval()) return;
  const leave = (DB.timetable.leaveRequests || []).find(l => l.id === id); if (!leave) return;
  const teacher = DB.teachers.find(t => t.id === leave.teacherId), area = teacherArea(teacher);
  const hasHead = area && DB.teachers.some(t => teacherHasRole(t, 'head') && teacherArea(t) === area && t.id !== leave.teacherId);
  leave.approval = { status: 'submitted', by: '', at: '', note: '' };
  leave.headApproval = { status: hasHead ? 'waiting' : 'none', by: '', at: '', note: '' };
  save(true); pushRequestDoc('leave', leave); render();
  toast(hasHead ? 'ส่งใบลาให้หัวหน้ากลุ่มสาระและผู้บริหารแล้ว' : 'ส่งใบลาให้ผู้บริหารอนุมัติแล้ว', 'ok');
}
function decideLeave(id, decision, kind) {
  if (blockAdminApproval()) return;
  const leave = (DB.timetable.leaveRequests || []).find(l => l.id === id); if (!leave) return;
  const me = curTeacher(); if (!me) return toast('กรุณาเลือกโปรไฟล์ผู้ใช้งาน', 'bad');
  openModal({ title: (kind === 'head' ? 'ความเห็นหัวหน้ากลุ่มสาระ' : 'พิจารณาใบลา') + ' • ' + (DB.teachers.find(t => t.id === leave.teacherId) || {}).name,
    bodyHTML: '<div class="pick"><label>บันทึกความเห็น (ไม่บังคับ)</label><input id="leaveDecisionNote" style="width:100%" placeholder="เช่น อนุญาตตามที่เสนอ"></div>',
    buttons: [{ label: 'ยกเลิก' }, { label: decision === 'approve' ? 'ยืนยัน' : 'ยืนยันไม่อนุมัติ', cls: decision === 'approve' ? 'primary' : 'danger', act(close, root) {
      const note = $('#leaveDecisionNote', root).value.trim(), stamp = { by: me.id, at: new Date().toISOString(), note: note };
      if (kind === 'head') leave.headApproval = Object.assign({ status: decision === 'approve' ? 'endorsed' : 'rejected' }, stamp);
      else leave.approval = Object.assign({ status: decision === 'approve' ? 'approved' : 'rejected' }, stamp);
      save(true); pushRequestDoc('leave', leave); close(); render(); toast('บันทึกผลการพิจารณาแล้ว', decision === 'approve' ? 'ok' : '');
    } }] });
}

/* ---- สรุปว่าวันนั้นจัดคนครบทุกคาบหรือยัง --------------------------------
   ครูที่ลาหลายคาบต้องรู้ว่าเหลือคาบไหนที่ยังไม่มีใครรับ ไม่ใช่ไล่ดูทีละใบ
   คืนสถานะรายคาบ: สลับแล้ว / สอนแทนแล้ว / รอตอบรับ / ยังไม่ได้จัด */
function exchangeDayStatus(date) {
  const me = curTeacher(); if (!me) return { rows: [], done: 0, waiting: 0, todo: 0 };
  const mine = effectiveDayEntries(date).map(x => x.entry)
    .filter(e => e.teacherId === me.id && !isHomeroomEntry(e));
  const reqs = (DB.timetable.exchangeRequests || []).filter(r => (r.sourceDate || r.date) === date);
  const rows = mine.map(e => {
    const req = reqs.find(r => (r.blockEntryIds && r.blockEntryIds.indexOf(e.id) >= 0) || r.requesterEntryId === e.id);
    const slot = DB.timetable.slots.find(x => String(x.id) === String(e.slotId));
    const cls = DB.classes.find(c => c.id === e.classId), sub = DB.subjects.find(x => x.id === e.subjectId);
    const who = req ? DB.teachers.find(t => t.id === req.targetTeacherId) : null;
    let state = 'todo';
    if (req) state = req.status === 'accepted' ? 'done' : req.status === 'rejected' ? 'todo' : 'waiting';
    return { entry: e, req: req || null, state: state, who: who,
      slot: slot ? slot.label : '', className: cls ? cls.name : '',
      subject: sub ? (sub.code ? sub.code + ' ' : '') + sub.name : '',
      mode: req ? coverageKindLabel(req) : '' };
  }).sort((a, b) => DB.timetable.slots.findIndex(x => String(x.id) === String(a.entry.slotId)) -
                    DB.timetable.slots.findIndex(x => String(x.id) === String(b.entry.slotId)));
  return { rows: rows,
    done: rows.filter(r => r.state === 'done').length,
    waiting: rows.filter(r => r.state === 'waiting').length,
    todo: rows.filter(r => r.state === 'todo').length };
}

  const chip = r => r.state === 'done'

      : r.state === 'waiting'
      ? '<span class="badge warn">' + esc('รอตอบรับ' + (r.mode ? ' • ' + r.mode : '')) + '</span>'

      '<div class="spacer"></div><span class="badge ' + (st.todo ? 'bad' : 'ok') + '">' +
      (st.todo ? 'ยังเหลือ ' + st.todo + ' คาบ' : 'จัดครบแล้ว') + '</span></div>' +
    '<div class="setup-progress" style="margin-top:10px"><i style="width:' + pct + '%"></i></div>' +
    '<div class="row" style="margin-top:8px"><span class="badge ok">ตกลงแล้ว ' + st.done + '</span>' +
      '<span class="badge warn">รอตอบรับ ' + st.waiting + '</span>' +
      '<span class="badge ' + (st.todo ? 'bad' : '') + '">ยังไม่ได้จัด ' + st.todo + '</span></div>' +
    '<div class="tablewrap" style="margin-top:10px"><table><thead><tr><th>คาบ</th><th>วิชา / ห้อง</th><th>วิธีจัด</th><th>ผู้รับ</th></tr></thead><tbody>' +
    st.rows.map(r => '<tr><td><b>' + esc(r.slot) + '</b></td><td>' + esc(r.subject) + '<br><span class="hint">' + esc(r.className) + '</span></td>' +
      '<td>' + chip(r) + '</td><td>' + esc(r.who ? (r.who.name || r.who.email) : '—') + '</td></tr>').join('') +
    '</tbody></table></div></div>';

/* ---- ตัวกรองคาบค้างเช็กชื่อ ------------------------------------------------
   พอเปิดภาคเรียนมาสักพัก รายการนี้ยาวเป็นร้อยคาบ เดิมแสดงเรียงตามวันที่
   แล้วตัดที่ 80 รายการเฉย ๆ ครูจึงหาคาบที่ต้องการไม่เจอ และไม่รู้ว่าค้างตรงไหนมากสุด
   จึงให้กรองตามเดือน/ห้อง/วิชา แล้วจัดกลุ่มพร้อมนับยอดให้เห็นภาพ */
const MISS_GROUPS = [{ key: 'date', label: 'วันที่' }, { key: 'month', label: 'เดือน' },
  { key: 'class', label: 'ห้อง' }, { key: 'subject', label: 'วิชา' }];
const MISS_LIMIT = 300;
const missGroupKey = () => MISS_GROUPS.some(g => g.key === DB.ui.missGroup) ? DB.ui.missGroup : 'date';
const missMonthOf = iso => String(iso || '').slice(0, 7);
const thaiMonthLabel = iso => {
  const d = parseISODate(iso);
  return d ? d.toLocaleDateString('th-TH', { month: 'long', year: 'numeric' }) : '—';
};
const missClassName = e => (DB.classes.find(c => c.id === e.classId) || { name: 'ไม่พบห้อง' }).name;
const missSubject = e => DB.subjects.find(s => s.id === e.subjectId) || { code: '', name: 'ไม่พบวิชา' };
const missSubjectName = e => { const s = missSubject(e); return (s.code ? s.code + ' ' : '') + s.name; };

/** ตัวเลือกของช่องกรอง สร้างจากรายการที่ค้างจริง พร้อมยอดในวงเล็บ
    เดือน/ห้อง/วิชาที่ไม่มีคาบค้างจะไม่ขึ้นให้เลือก จะได้ไม่ต้องไล่หาในตัวเลือกที่ว่างเปล่า */
function missOptions(list, keyOf, labelOf, selected, allLabel) {
  const count = {}, label = {};
  list.forEach(x => { const k = keyOf(x); if (!k) return; count[k] = (count[k] || 0) + 1; label[k] = labelOf(x); });
  const keys = Object.keys(count).sort();
  return '<option value="">' + esc(allLabel) + ' (' + list.length + ')</option>' +
    keys.map(k => '<option value="' + esc(k) + '"' + (String(selected) === k ? ' selected' : '') + '>' +
      esc(label[k]) + ' (' + count[k] + ')</option>').join('');
}

/** รายการที่เหลือหลังกรอง */
function missedFiltered(missed) {
  const month = DB.ui.missMonth || '', cls = DB.ui.missClass || '', sub = DB.ui.missSubject || '';
  return missed.filter(x =>
    (!month || missMonthOf(x.date) === month) &&
    (!cls || x.entry.classId === cls) &&
    (!sub || x.entry.subjectId === sub));
}

function missedCardHtml(missed) {
  const shown = missedFiltered(missed), group = missGroupKey();
  const filtering = !!(DB.ui.missMonth || DB.ui.missClass || DB.ui.missSubject);
  const head = '<div class="row"><h3 style="margin:0">คาบค้างเช็กชื่อ</h3>' +
    '<span class="badge ' + (missed.length ? 'bad' : 'ok') + '">' + missed.length + '</span>' +
    '<div class="spacer"></div>' + (filtering ? '<button class="sm" id="missClear">ล้างตัวกรอง</button>' : '') + '</div>';
  if (!missed.length) return '<div class="card">' + head + '<div class="empty" style="margin-top:10px">ไม่มีคาบค้างเช็ก</div></div>';

  const tools = '<div class="row" style="margin-top:10px;align-items:flex-end">' +
    '<div class="pick"><label>เดือน</label><select id="missMonth">' +
      missOptions(missed, x => missMonthOf(x.date), x => thaiMonthLabel(x.date), DB.ui.missMonth, 'ทุกเดือน') + '</select></div>' +
    '<div class="pick"><label>ห้อง</label><select id="missClass">' +
      missOptions(missed, x => x.entry.classId, x => missClassName(x.entry), DB.ui.missClass, 'ทุกห้อง') + '</select></div>' +
    '<div class="pick"><label>วิชา</label><select id="missSubject">' +
      missOptions(missed, x => x.entry.subjectId, x => missSubjectName(x.entry), DB.ui.missSubject, 'ทุกวิชา') + '</select></div>' +
    '<div class="pick"><label>จัดกลุ่มตาม</label><div class="sort-group">' +
      MISS_GROUPS.map(g => '<button class="sm' + (group === g.key ? ' active' : '') + '" data-miss-group="' + g.key + '">' +
        esc(g.label) + '</button>').join('') + '</div></div></div>';

  if (!shown.length) return '<div class="card">' + head + tools +
    '<div class="empty" style="margin-top:10px">ไม่มีคาบค้างเช็กที่ตรงกับตัวกรองนี้<br><span class="hint">ลองเลือก “ทุกเดือน” หรือ “ทุกห้อง”</span></div></div>';

  const itemHtml = x => {
    const slot = DB.timetable.slots.find(t => t.id === String(x.entry.slotId));
    return '<div class="alert-item"><div><b>' + thaiDate(x.date) + '</b><br><span class="hint">' +
      esc(slot ? slot.label : '') + ' • ' + esc(missSubjectName(x.entry)) + ' • ' + esc(missClassName(x.entry)) +
      '</span></div><div class="spacer"></div><button class="sm primary" data-missed-entry="' + x.entry.id +
      '" data-date="' + x.date + '">เช็กชื่อ</button></div>';
  };

  let listHtml = '', counted = 0;
  if (group === 'date') {
    listHtml = '<div class="alert-list" style="margin-top:10px">' +
      shown.slice(0, MISS_LIMIT).map(itemHtml).join('') + '</div>';
    counted = Math.min(shown.length, MISS_LIMIT);
  } else {
    const keyOf = x => group === 'month' ? missMonthOf(x.date) : group === 'class' ? x.entry.classId : x.entry.subjectId;
    const labelOf = x => group === 'month' ? thaiMonthLabel(x.date) : group === 'class' ? missClassName(x.entry) : missSubjectName(x.entry);
    const buckets = {}, labels = {};
    shown.forEach(x => { const k = keyOf(x) || '—'; (buckets[k] = buckets[k] || []).push(x); labels[k] = labelOf(x); });
    // กลุ่มที่ค้างเยอะที่สุดขึ้นก่อน ครูจะได้เห็นว่าต้องไปตามตรงไหนมากสุด
    const keys = Object.keys(buckets).sort((a, b) => buckets[b].length - buckets[a].length || String(labels[a]).localeCompare(String(labels[b]), 'th'));
    listHtml = keys.map(k => {
      const items = buckets[k], take = items.slice(0, Math.max(0, MISS_LIMIT - counted));
      counted += take.length;
      return '<div class="miss-group"><div class="miss-group-head"><b>' + esc(labels[k]) + '</b>' +
        '<span class="badge">' + items.length + ' คาบ</span></div>' +
        (take.length ? '<div class="alert-list">' + take.map(itemHtml).join('') + '</div>' : '') +
        (take.length < items.length ? '<div class="hint" style="margin-top:6px">ยังไม่ได้แสดงอีก ' + (items.length - take.length) + ' คาบในกลุ่มนี้</div>' : '') +
        '</div>';
    }).join('');
  }

  const summary = '<div class="hint" style="margin-top:10px">แสดง ' + counted + ' จาก ' + shown.length + ' คาบที่ตรงตัวกรอง' +
    (shown.length !== missed.length ? ' • ค้างทั้งหมด ' + missed.length + ' คาบ' : '') +
    (counted < shown.length ? ' — เลือกเดือนหรือห้องเพื่อดูให้ครบ' : '') + '</div>';

  return '<div class="card">' + head + tools + summary + listHtml + '</div>';
}

    const picked = effective.find(x => x.entry.id === id);
    openAttendance(e, date, !!e.sessionType || !!(picked && picked.from && picked.from.mode === 'slots'), picked ? picked.slotId : null);
  }));
  $$('[data-delete-special]', pane).forEach(btn => btn.addEventListener('click', async ev => {
    ev.stopPropagation(); const e = specials.find(x => x.id === btn.dataset.deleteSpecial); if (!e) return;

    DB.timetable.exceptions = DB.timetable.exceptions.filter(x => x.id !== e.id); delete DB.timetable.attendance[attendanceKey(e.id, date)]; save(true); renderAttendancePage();
  }));
  $$('[data-missed-entry]', pane).forEach(btn => btn.addEventListener('click', () => {

function syncMasterFromClasses() {
  DB.studentMaster = DB.studentMaster || [];
  let changed = false;
  DB.studentMaster.forEach(m => { if (!m.id) { m.id = uid('mst'); changed = true; } });
  DB.classes.forEach(cls => (cls.students || []).forEach(st => {
    const sid = String(st.sid || '').trim();
    let m = sid ? DB.studentMaster.find(x => String(x.sid || '').trim() === sid) : null;
    if (!m) m = DB.studentMaster.find(x => x.sourceClassId === cls.id && String(x.sourceStudentId || '') === String(st.sid || st.no || st.name));
    if (!m) {
      DB.studentMaster.push({ id: uid('mst'), sid: sid, no: st.no || '', name: st.name || '', classId: cls.id, active: true,
        sourceClassId: cls.id, sourceStudentId: String(st.sid || st.no || st.name) });
      changed = true;
    } else {
      if (!m.name && st.name) { m.name = st.name; changed = true; }
      if (!m.no && st.no) { m.no = st.no; changed = true; }
      if (!m.classId) { m.classId = cls.id; changed = true; }
      if (m.active === undefined) { m.active = true; changed = true; }
    }
  }));
  return changed;
}

function pullMasterToClass(classId) {
  const cls = DB.classes.find(c => c.id === classId);
  if (!cls) return 0;
  const source = (DB.studentMaster || []).filter(m => m.active !== false && m.classId === classId)
    .sort((a, b) => num(a.no) - num(b.no));
  cls.students = cls.students || [];
  let added = 0;
  source.forEach(m => {
    const sid = String(m.sid || '').trim();
    const found = sid ? cls.students.find(s => String(s.sid || '').trim() === sid) : cls.students.find(s => s.name === m.name);
    if (found) {
      found.name = m.name || found.name; found.no = m.no || found.no; if (sid) found.sid = sid;
    } else if (cls.students.length < MAX_STUDENTS) {
      cls.students.push({ sid: sid || uid('st'), no: m.no || cls.students.length + 1, name: m.name || 'ยังไม่ระบุชื่อ' });
      added++;
    }
  });
  cls.students.sort((a, b) => num(a.no) - num(b.no));
  return added;
}

  }
}

/** ย้ายคะแนนทุกวิชาเมื่อเปลี่ยนเลขประจำตัว */
function migrateSid(oldSid, newSid) {
  Object.keys(DB.books).forEach(k => {
    if (k.split('::')[0] !== DB.ui.classId) return;
    const b = DB.books[k];
    ['scores', 'componentScores', 'itemRetakes', 'exam', 'notes', 'resultRemedy'].forEach(f => {
      if (b[f] && b[f][oldSid] !== undefined) { b[f][newSid] = b[f][oldSid]; delete b[f][oldSid]; }
    });
    Object.keys(b.presenters || {}).forEach(itId => Object.keys(b.presenters[itId] || {}).forEach(gid => {
      b.presenters[itId][gid] = (b.presenters[itId][gid] || []).map(sid => sid === oldSid ? newSid : sid);
    }));
    ['traits', 'reading'].forEach(type => {
      if (b.assessments && b.assessments[type] && b.assessments[type][oldSid] !== undefined) {
        b.assessments[type][newSid] = b.assessments[type][oldSid]; delete b.assessments[type][oldSid];
      }
    });
  });
  Object.values(DB.timetable.attendance || {}).forEach(r => {
    if (r.statuses && r.statuses[oldSid] !== undefined) { r.statuses[newSid] = r.statuses[oldSid]; delete r.statuses[oldSid]; }
  });
  if (DB.studentAccounts && DB.studentAccounts[oldSid]) {
    DB.studentAccounts[newSid] = DB.studentAccounts[oldSid]; delete DB.studentAccounts[oldSid];
  }
}

/* --- ตัวช่วยนำเข้ารายชื่อ ------------------------------------------------ */
const HEAD_PAT = {
  no:   /^(เลขที่|ที่|ลำดับ|ลำดับที่|no\.?|number|ลําดับ)$/i,
  sid:  /(เลขประจำตัว|รหัสนักเรียน|รหัสประจำตัว|เลขประจําตัว|^รหัส$|student\s*id|^id$|^code$)/i,
  name: /(ชื่อ.?-?.?(นามสกุล|สกุล)|^ชื่อ$|ชื่อนักเรียน|full\s*name|^name$)/i,
  room: /(ชั้น|ห้อง|room|class)/i,
  gender: /^(เพศ|sex|gender)$/i,
  status: /(สถานะ|status)/i
};
/* สถานะจากไฟล์ทะเบียน — เอาไว้ตัดคนที่ไม่ได้เรียนอยู่ออกจากห้องอัตโนมัติ */
const STUDENT_ACTIVE_PAT = /กำลังศึกษา|กําลังศึกษา|ปกติ|active|study/i;
const STUDENT_INACTIVE_PAT = /พักการเรียน|ลาออก|ย้าย|จำหน่าย|จําหน่าย|พ้นสภาพ|เสียชีวิต|จบการศึกษา|inactive|left/i;
const studentActiveFromText = value => {
  const t = String(value == null ? '' : value).trim();
  if (!t) return true;
  if (STUDENT_INACTIVE_PAT.test(t)) return false;
  if (STUDENT_ACTIVE_PAT.test(t)) return true;
  return true;
};
const genderFromText = value => {
  const t = String(value == null ? '' : value).trim();
  if (/^(ช|ชาย|ด\.ช|เด็กชาย|นาย|male|m)$/i.test(t)) return 'ชาย';
  if (/^(ญ|หญิง|ด\.ญ|เด็กหญิง|นางสาว|น\.ส\.|female|f)$/i.test(t)) return 'หญิง';
  return '';
};

async function importStudents() {
  const f = await pickFile('.xlsx,.xlsm,.csv,.txt');
  if (!f) return;
  let sheets;
  try {
    if (/\.(csv|txt)$/i.test(f.name)) {
      const txt = await readTextSmart(f);
      sheets = [{ name: f.name, rows: parseCsv(txt) }];
    } else if (/\.xls$/i.test(f.name)) {
      return toast('ไฟล์ .xls รุ่นเก่าไม่รองรับ — เปิดใน Excel แล้วสั่ง Save As เป็น .xlsx ก่อน', 'bad');
    } else {
      sheets = await readXlsx(await f.arrayBuffer());
    }
  } catch (e) {
    return openModal({ title: 'เปิดไฟล์ไม่สำเร็จ', bodyHTML: '<div class="notice bad">' + esc(e.message || e) + '</div>' });
  }
  sheets = sheets.filter(s => s.rows.some(r => r.some(v => String(v).trim() !== '')));
  if (!sheets.length) return toast('ไฟล์นี้ไม่มีข้อมูล', 'bad');
  importWizard(sheets);
}

async function importMasterStudents() {
  const f = await pickFile('.xlsx,.xlsm,.csv,.txt');
  if (!f) return;
  let sheets;
  try {
    if (/\.(csv|txt)$/i.test(f.name)) sheets = [{ name: f.name, rows: parseCsv(await readTextSmart(f)) }];
    else if (/\.xls$/i.test(f.name)) return toast('ไฟล์ .xls รุ่นเก่าไม่รองรับ กรุณาบันทึกเป็น .xlsx ก่อน', 'bad');

  } catch (e) { return toast('เปิดไฟล์ไม่สำเร็จ: ' + (e.message || e), 'bad'); }
  sheets = sheets.filter(s => s.rows.some(r => r.some(v => String(v == null ? '' : v).trim())));
  if (!sheets.length) return toast('ไฟล์นี้ไม่มีข้อมูล', 'bad');
  masterImportWizard(sheets);
}

/** อ่านไฟล์ข้อความ เดา UTF-8 ก่อน ถ้าเพี้ยนลองรหัสไทย windows-874 */
async function readTextSmart(file) {
  const buf = await file.arrayBuffer();
  let txt = new TextDecoder('utf-8', { fatal: false }).decode(buf);
  if (/�/.test(txt)) {
    try { txt = new TextDecoder('windows-874').decode(buf); } catch (e) { /* ใช้ค่าเดิม */ }
  }
  return txt;
}

function detectHeader(rows) {
  let best = { row: 0, score: -1, map: {} };
  const limit = Math.min(rows.length, 12);
  for (let r = 0; r < limit; r++) {
    const map = {}; let score = 0;
    (rows[r] || []).forEach((cell, ci) => {
      const t = String(cell == null ? '' : cell).replace(/\s+/g, '').trim();
      if (!t) return;
      for (const key of ['no', 'sid', 'name', 'room', 'gender', 'status']) {
        if (map[key] === undefined && HEAD_PAT[key].test(t)) { map[key] = ci; score += (key === 'name' ? 2 : 1); }
      }
    });
    if (score > best.score) best = { row: r, score: score, map: map };
  }
  return best;
}

      }

    };

    return {

          '<label class="hint">แถวหัวตาราง</label><input type="text" id="iwHead" value="' + (det.row + 1) + '" style="width:64px;text-align:center">' +
          '<span class="hint">(แถวที่มีคำว่า “เลขที่ / รหัส / ชื่อ”)</span>' +
        '</div>' +
        '<div class="row" style="margin-bottom:6px">' +
          '<div class="pick"><label>เลขที่</label><select id="iwNo">' + colOpts(det.map.no) + '</select></div>' +
          '<div class="pick"><label>เลขประจำตัว</label><select id="iwSid">' + colOpts(det.map.sid) + '</select></div>' +
          '<div class="pick"><label>ชื่อ-นามสกุล</label><select id="iwName">' + colOpts(det.map.name) + '</select></div>' +
        '</div>' +
        '<div class="hint" style="margin-bottom:10px">ตัวอย่าง 6 แถวแรกหลังหัวตาราง — ตรวจว่าคอลัมน์ตรงกันก่อนกดนำเข้า</div>' +
        '<div class="tablewrap" style="max-height:230px"><table><thead><tr>' +
          Array.from({ length: width }, (_, i) => '<th>' + idxToColRef(i) + '<br><span class="hint">' +
            esc(String(headRow[i] == null ? '' : headRow[i]).slice(0, 18)) + '</span></th>').join('') +
        '</tr></thead><tbody>' +
        preview.map(r => '<tr>' + Array.from({ length: width }, (_, i) =>
          '<td style="white-space:nowrap;max-width:170px;overflow:hidden;text-overflow:ellipsis">' +
          esc(String(r[i] == null ? '' : r[i]).slice(0, 26)) + '</td>').join('') + '</tr>').join('') +
        '</tbody></table></div>' +
        '<div class="row" style="margin-top:12px">' +
          '<label><input type="radio" name="iwMode" value="replace" checked> แทนที่รายชื่อเดิมทั้งหมด</label>' +
          '<label><input type="radio" name="iwMode" value="append"> เพิ่มต่อท้าย (ข้ามเลขประจำตัวที่มีอยู่แล้ว)</label>' +
        '</div>' +
        '<div id="iwMsg"></div>'
    };
  };

  const first = build();
  const m = openModal({
    title: 'นำเข้ารายชื่อนักเรียน', wide: true, bodyHTML: first.html,
    buttons: [
      { label: 'ยกเลิก' },
      { label: 'นำเข้า', cls: 'primary', act: (close, root) => doImport(root, close) }
    ],
    onMount(root) { wire(root); }
  });

  function wire(root) {
    const sh = $('#iwSheet', root);
    if (sh) sh.addEventListener('change', () => {
      si = +sh.value;
      const b = build();
      $('.body', root).innerHTML = b.html;
      wire(root);
    });
    const hd = $('#iwHead', root);
    if (hd) hd.addEventListener('change', () => {
      const rows = sheets[si].rows;
      const r = Math.max(0, Math.min(rows.length - 1, Math.round(num(hd.value)) - 1));
      // สร้างใหม่โดยล็อกแถวหัวตารางตามที่ผู้ใช้กำหนด
      const saveDetect = detectHeader;
      const rowCells = rows[r] || [];
      const map = {};
      rowCells.forEach((cell, ci) => {
        const t = String(cell == null ? '' : cell).replace(/\s+/g, '').trim();
        if (!t) return;
        for (const key of ['no', 'sid', 'name', 'room'])
          if (map[key] === undefined && HEAD_PAT[key].test(t)) map[key] = ci;
      });
      const width = rows.reduce((a, rr) => Math.max(a, rr.length), 0);
      ['No:no', 'Sid:sid', 'Name:name'].forEach(pair => {
        const [id, key] = pair.split(':');
        const sel = $('#iw' + id, root);
        if (sel) sel.value = map[key] === undefined ? '-1' : String(map[key]);
      });
      $('#iwMsg', root).innerHTML = '<div class="hint" style="margin-top:8px">ใช้แถวที่ ' + (r + 1) + ' เป็นหัวตาราง</div>';
      hd.value = r + 1;
      void saveDetect; void width;
    });
  }

  function doImport(root, close) {
    const rows = sheets[si].rows;
    const headRow = Math.max(0, Math.round(num($('#iwHead', root).value)) - 1);
    const cNo = +$('#iwNo', root).value, cSid = +$('#iwSid', root).value, cName = +$('#iwName', root).value;
    if (cName < 0 && cSid < 0) return toast('ต้องเลือกอย่างน้อยคอลัมน์ชื่อ หรือ เลขประจำตัว', 'bad');
    const mode = ($$('input[name=iwMode]', root).find(r => r.checked) || {}).value || 'replace';

    const cls = curClass();
    const out = [];
    const seen = new Set(mode === 'append' ? cls.students.map(s => String(s.sid)) : []);
    // ชื่อซ้ำ: เทียบกับรายชื่อเดิมในห้อง (เมื่อเพิ่มต่อท้าย) และซ้ำกันเองในไฟล์
    const seenNames = new Map(mode === 'append' ? cls.students.filter(s => s.name).map(s => [normalizeName(s.name), 'มีอยู่แล้วในห้องนี้']) : []);
    const duplicates = [];
    let autoNo = mode === 'append' ? cls.students.reduce((a, s) => Math.max(a, num(s.no)), 0) : 0;
    let skippedDup = 0, blank = 0;

    for (let r = headRow + 1; r < rows.length; r++) {
      const row = rows[r] || [];
      const name = cName >= 0 ? String(row[cName] == null ? '' : row[cName]).trim() : '';
      let sid = cSid >= 0 ? String(row[cSid] == null ? '' : row[cSid]).trim() : '';
      let no = cNo >= 0 ? Math.round(num(row[cNo])) : 0;
      if (!name && !sid) { blank++; continue; }
      if (!/[^\s\d.]/.test(name) && !sid) { blank++; continue; }   // แถวที่ไม่มีชื่อจริง
      if (!no) no = ++autoNo; else autoNo = Math.max(autoNo, no);
      if (!sid) sid = 'NO' + no;
      if (seen.has(sid)) { skippedDup++; continue; }
      const nameKey = normalizeName(name);
      if (nameKey && seenNames.has(nameKey)) { duplicates.push(['แถว ' + (r + 1), name, sid, seenNames.get(nameKey)]); continue; }
      if (nameKey) seenNames.set(nameKey, 'ซ้ำกับแถว ' + (r + 1) + ' ในไฟล์เดียวกัน');
      seen.add(sid);
      out.push({ no: no, sid: sid, name: name });
    }

    if (!out.length) return toast('ไม่พบแถวข้อมูลนักเรียน — ลองเปลี่ยนแถวหัวตารางหรือคอลัมน์', 'bad');

    const base = mode === 'append' ? cls.students.slice() : [];
    let over = 0;
    const room = MAX_STUDENTS - base.length;
    let take = out;
    if (out.length > room) { over = out.length - room; take = out.slice(0, Math.max(0, room)); }

    cls.students = base.concat(take).sort((a, b) => a.no - b.no);
    syncMasterFromClasses();
    save(true);
    close();
    render();

    let msg = 'นำเข้า ' + take.length + ' คน';
    if (skippedDup) msg += ' • ข้ามเลขประจำตัวซ้ำ ' + skippedDup;
    if (duplicates.length) msg += ' • ข้ามชื่อซ้ำ ' + duplicates.length;
    if (blank) msg += ' • ข้ามแถวว่าง ' + blank;
    toast(msg, duplicates.length ? 'warn' : 'ok');
    duplicateReport('รายชื่อนักเรียนที่มีอยู่แล้ว', ['แถวในไฟล์', 'ชื่อ-นามสกุล', 'เลขประจำตัว', 'สาเหตุ'], duplicates);
    if (over) {
      openModal({
        title: 'เกินจำนวนที่รับได้',
        bodyHTML: '<div class="notice">ชั้นเรียนหนึ่งห้องรับได้ไม่เกิน <b>' + MAX_STUDENTS + ' คน</b> — ' +
          'นำเข้าแล้ว ' + take.length + ' คน และ<b>ไม่ได้นำเข้าอีก ' + over + ' คน</b><br>' +
          'หากรายชื่อชุดนี้เป็นของหลายห้อง กรุณาแยกไฟล์ตามห้อง แล้วนำเข้าทีละชั้น</div>'
      });
    }
  }
}

      item.components = components;
      if (components.length) item.max = components.reduce((sum, c) => sum + num(c.max), 0);
      Object.keys(b.componentScores || {}).forEach(sid => syncItemComponentTotal(b, sid, item));
      save(true); close(); renderItems(); toast(components.length ? 'เปิดใช้ K/S/A แล้ว คะแนนเต็มรวม ' + fmt(item.max) : 'ปิด K/S/A และกลับไปใช้คะแนนรวม', 'ok');
    } }]
  });
}

/* ---------- นำรูปแบบหัวข้อคะแนนไปใช้ซ้ำ ------------------------------------
   สมุดคะแนนหนึ่งเล่มผูกกับ ห้อง + วิชา + ปี/ภาค จึงคัดลอกข้ามห้องและข้ามครูได้
   ตราบใดที่เป็นวิชาเดียวกัน */
function bookKeyOf(classId, subjectId, periodId) { return classId + '::' + subjectId + '::' + periodId; }

/** เล่มอื่นที่เป็นวิชาเดียวกันและมีหัวข้อคะแนนแล้ว ใช้เป็นต้นแบบได้ */
function itemTemplateSources() {
  const subjectId = DB.ui.subjectId, here = bookKey(), out = [];
  Object.keys(DB.books || {}).forEach(key => {
    const parts = key.split('::'); if (parts[1] !== subjectId || key === here) return;
    const book = DB.books[key]; if (!book || !(book.items || []).length) return;
    const cls = DB.classes.find(c => c.id === parts[0]), period = DB.periods.find(x => x.id === parts[2]);
    out.push({ key: key, label: (cls ? cls.name : 'ห้องที่ถูกลบ') + (period ? ' • ปี ' + period.academicYear + '/' + period.semester : '') +
      ' • ' + (book.items || []).length + ' หัวข้อ' + (book.meta && book.meta.teacherName ? ' • ' + book.meta.teacherName : ''), items: (book.items || []).length });
  });
  return out;
}

/** ห้องอื่นที่เรียนวิชานี้ในปี/ภาคเดียวกัน จากตารางสอนของทั้งโรงเรียน */
function classesSharingSubject() {
  const subjectId = DB.ui.subjectId, periodId = DB.ui.periodId, ids = new Set();
  (DB.timetable.entries || []).filter(e => e.periodId === periodId && e.subjectId === subjectId).forEach(e => ids.add(e.classId));
  return Array.from(ids).map(id => DB.classes.find(c => c.id === id)).filter(c => c && c.id !== DB.ui.classId);
}

function copyItemsToClasses(classIds) {
  const from = curBook(true); if (!from) return 0;
  let n = 0;
  classIds.forEach(cid => {
    const key = bookKeyOf(cid, DB.ui.subjectId, DB.ui.periodId);
    const target = DB.books[key] = normalizeBook(DB.books[key] || defaultBook());
    target.items = deepCopy(from.items);
    target.weights = deepCopy(from.weights);
    target.exams = deepCopy(from.exams);
    target.passPercent = from.passPercent;
    target.gradeScale = deepCopy(from.gradeScale);
    n++;
  });
  save(true);
  return n;
}

/* ---------- ซิงก์รูปแบบหัวข้อคะแนนขึ้นส่วนกลาง ------------------------------
   สมุดคะแนนซิงก์เฉพาะของเจ้าของและต้องเปิดสวิตช์เอง ครูที่เปลี่ยนเครื่อง
   หรือครูที่สอนวิชาเดียวกัน จึงไม่เคยเห็นรูปแบบหัวข้อคะแนนของกันและกัน
   ที่นี่แยกเก็บเฉพาะ "โครงหัวข้อคะแนน" ไม่มีคะแนนนักเรียนติดไปด้วย */
const itemTemplateDocId = () => fbStaffId(myEmailForSync()) + '__' + String(DB.ui.subjectId || '').replace(/[^A-Za-z0-9_-]/g, '_');
const itemSyncReady = () => !!(firebaseReady() && fbSignedIn() && myEmailForSync());

/** โครงที่ส่งขึ้น — หัวข้อ สัดส่วน คะแนนสอบ เกณฑ์ผ่าน และเกณฑ์ตัดเกรด */
function itemTemplatePayload(book) {
  return { items: deepCopy(book.items || []), weights: deepCopy(book.weights || {}),
    exams: deepCopy(book.exams || {}), passPercent: book.passPercent,
    gradeScale: deepCopy(book.gradeScale || []), partialMode: !!book.partialMode };
}
function applyItemTemplate(book, tpl) {
  book.items = deepCopy(tpl.items || []);
  if (tpl.weights) book.weights = deepCopy(tpl.weights);
  if (tpl.exams) book.exams = deepCopy(tpl.exams);
  if (tpl.passPercent !== undefined) book.passPercent = tpl.passPercent;
  if (tpl.gradeScale && tpl.gradeScale.length) book.gradeScale = deepCopy(tpl.gradeScale);
  if (tpl.partialMode !== undefined) book.partialMode = !!tpl.partialMode;
}

let INDICATOR_DB = null, indicatorLoading = null;
const INDICATOR_KIND = { F: 'กลางทาง', S: 'ปลายทาง' };

function loadIndicatorDB() {
  if (INDICATOR_DB) return Promise.resolve(INDICATOR_DB);
  if (!indicatorLoading) indicatorLoading = fetch('./indicators.json')
    .then(r => { if (!r.ok) throw new Error('โหลดฐานตัวชี้วัดไม่สำเร็จ (' + r.status + ')'); return r.json(); })
    .then(d => { INDICATOR_DB = d; return d; })
    .catch(e => { indicatorLoading = null; throw e; });
  return indicatorLoading;
}

/** ระดับชั้นของตัวชี้วัดตรงกับห้องนี้ไหม — ม.4-6 ใช้ได้ทั้งสามชั้น */
function indicatorLevelMatch(itemLevel, classLevelName) {
  if (!classLevelName) return true;
  if (itemLevel === classLevelName) return true;
  return itemLevel === 'ม.4-6' && ['ม.4', 'ม.5', 'ม.6'].indexOf(classLevelName) >= 0;
}
/** เดากลุ่มสาระของวิชานี้จากสมุดคะแนน โปรไฟล์ครู หรือกลุ่มสาระที่ตั้งไว้ */
function guessIndicatorArea(db) {
  const b = curBook(false);
  // learningAreaOf คืน "ยังไม่ระบุกลุ่มสาระ" เมื่อหาไม่เจอ ต้องข้ามไป ไม่งั้นจะบังค่าจากโปรไฟล์ครู
  const real = v => { const t = String(v || '').trim(); return t && t !== NO_AREA_LABEL && t !== 'ยังไม่ระบุกลุ่มสาระ' ? t : ''; };
  const area = real(b && b.meta && b.meta.learningArea) || real(learningAreaOf(DB.ui.subjectId, DB.ui.periodId)) || real(teacherArea(curTeacher()));
  const norm = x => String(x || '').replace(/\s+/g, '');
  const found = (db.areas || []).find(a => norm(a.name) === norm(area));
  return found ? found.code : '';
}

function bindIndicatorPage(pane) {
  const b = curBook(true), rows = indicatorRows();
  const commit = () => { save(true); renderIndicators(); };
  $$('tr[data-ind]', pane).forEach(tr => {
    const r = rows.find(x => x.id === tr.dataset.ind); if (!r) return;
    const bind = (sel, key, numeric) => { const el = $(sel, tr); if (!el) return;
      el.addEventListener('change', () => { r[key] = numeric ? (el.value.trim() === '' ? '' : num(el.value)) : el.value; save(true); }); };
    bind('.ind-code', 'code'); bind('.ind-text', 'text'); bind('.ind-kind', 'kind');
    bind('.ind-hours', 'hours', true); bind('.ind-score', 'score', true);
  });
  const move = (id, dir) => { const i = rows.findIndex(x => x.id === id), j = i + dir;
    if (i < 0 || j < 0 || j >= rows.length) return;
    rows.splice(j, 0, rows.splice(i, 1)[0]); commit(); };
  $$('[data-ind-up]', pane).forEach(x => x.addEventListener('click', () => move(x.dataset.indUp, -1)));
  $$('[data-ind-down]', pane).forEach(x => x.addEventListener('click', () => move(x.dataset.indDown, 1)));
  $$('[data-ind-del]', pane).forEach(x => x.addEventListener('click', () => {
    b.indicators = rows.filter(r => r.id !== x.dataset.indDel); commit(); }));
  const add = $('#indAddBlank', pane);
  if (add) add.addEventListener('click', () => { rows.push(newIndicatorRow({})); commit(); });
  const clear = $('#indClear', pane);
  if (clear) clear.addEventListener('click', async () => {
    if (!await confirmBox('ล้างตัวชี้วัดทั้งหมด', 'ลบตัวชี้วัดทั้ง ' + rows.length + ' ข้อของวิชานี้ ย้อนกลับไม่ได้', 'ล้างทั้งหมด')) return;
    b.indicators = []; commit(); toast('ล้างตัวชี้วัดแล้ว', 'ok');
  });
  const share = $('#indShare', pane);
  if (share) share.addEventListener('click', shareIndicatorSet);
  $('#indPickCore', pane).addEventListener('click', openIndicatorPicker);
  $('#indPasteOwn', pane).addEventListener('click', openIndicatorPaste);
  $('#indFromTeacher', pane).addEventListener('click', openIndicatorFromTeachers);
  $('#indCopyRooms', pane).addEventListener('click', openIndicatorCopyRooms);
}

function newIndicatorRow(x) {
  return { id: uid('ind'), code: x.code || '', text: x.text || '', kind: x.kind === 'S' ? 'S' : 'F',
    hours: x.hours == null ? '' : x.hours, score: x.score == null ? '' : x.score,
    src: x.src || 'own', std: x.std || '', strand: x.strand || '' };
}
function addIndicatorRows(list, mode) {
  const b = curBook(true), rows = indicatorRows();
  if (mode === 'replace') b.indicators = [];
  const have = new Set(indicatorRows().map(r => (r.code || '') + '|' + (r.text || '')));
  let added = 0;
  list.forEach(x => { const key = (x.code || '') + '|' + (x.text || '');
    if (have.has(key)) return; have.add(key); b.indicators.push(newIndicatorRow(x)); added++; });
  save(true);
  return added;
}

/* ---------- พิมพ์เอง / วางจาก Excel (วิชาเพิ่มเติม) ---------- */
function parseIndicatorPaste(text, existingCodes) {
  const out = [];
  String(text || '').split(/\r?\n/).forEach(line => {
    if (!line.trim()) return;
    const cells = line.split('\t').map(x => x.trim());
    if (cells.length >= 2) {
      out.push({ code: cells[0], text: cells[1], kind: /ปลาย|summ/i.test(cells[2] || '') ? 'S' : 'F',
        hours: cells[3] !== undefined && cells[3] !== '' ? num(cells[3]) : '',
        score: cells[4] !== undefined && cells[4] !== '' ? num(cells[4]) : '' });
    } else {
      out.push({ code: '', text: cells[0], kind: 'F' });
    }
  });
  // บรรทัดที่ไม่ได้ใส่รหัสมา ให้เลขอัตโนมัติเป็น ผ 1, ผ 2 ...
  // ต้องข้ามรหัสที่มีอยู่แล้วในชุดนี้และที่ครูพิมพ์มาเอง ไม่งั้นจะได้รหัสซ้ำกัน
  const used = new Set(out.map(x => x.code).filter(Boolean).concat(existingCodes || []));
  let n = 0;
  out.forEach(x => { if (x.code) return;
    do { n++; } while (used.has('ผ ' + n));
    x.code = 'ผ ' + n; used.add(x.code); });
  return out;
}
function openIndicatorPaste() {
  openModal({ title: 'พิมพ์เอง หรือวางจาก Excel', wide: true, bodyHTML:
    '<div class="exec-note">วางจาก Excel ได้ทั้งตาราง หนึ่งบรรทัดต่อหนึ่งข้อ คั่นช่องด้วยแท็บตามลำดับ<br>' +
    '<b>รหัส • ตัวชี้วัด/ผลการเรียนรู้ • ประเภท (กลางทาง/ปลายทาง) • เวลา (ชม.) • คะแนน</b><br>' +
    'ถ้าพิมพ์เองบรรทัดละข้อโดยไม่ใส่รหัส ระบบจะให้เลขเป็น ผ 1 ผ 2 ให้อัตโนมัติ</div>' +
    '<textarea id="ipPaste" rows="12" style="width:100%;font-family:inherit" placeholder="ผ 1&#9;อธิบายหลักการทำงานของวงจรไฟฟ้าเบื้องต้น&#9;กลางทาง&#9;4&#9;10"></textarea>' +
    '<div class="hint" id="ipPasteCount" style="margin-top:8px">ยังไม่มีข้อมูล</div>',
    onMount(root) {
      const ta = $('#ipPaste', root), out = $('#ipPasteCount', root);
      const have = indicatorRows().map(r => r.code);
      const upd = () => { const n = parseIndicatorPaste(ta.value, have).length;
        out.textContent = n ? 'อ่านได้ ' + n + ' ข้อ' : 'ยังไม่มีข้อมูล'; };
      ta.addEventListener('input', upd); ta.focus();
    },
    buttons: [{ label: 'ยกเลิก' },
      { label: 'เพิ่มต่อท้าย', cls: 'primary', act(close, root) {
        const list = parseIndicatorPaste($('#ipPaste', root).value, indicatorRows().map(r => r.code));
        if (!list.length) return toast('ยังไม่ได้ใส่ข้อมูล', 'bad');
        const n = addIndicatorRows(list, 'append'); close(); renderIndicators();
        toast('เพิ่มตัวชี้วัด ' + n + ' ข้อ', 'ok');
      } }] });
}

    } }] : [{ label: 'ปิด' }] });
}

          const p = l.split(',');

          const mx = p.length > 1 ? num(p[1]) : 10;

    else if (el.classList.contains('i-max')) it.max = Math.max(0, num(el.value));

      it.kind = el.value;
      if (it.kind === 'group' && itemComponents(it).length) it.components = [];

  }));
  $$('#itTable [data-ksa]').forEach(btn => btn.addEventListener('click', () => {
    const item = b.items.find(x => x.id === btn.dataset.ksa); if (item && item.kind !== 'group') openItemKsaConfig(item);
  }));
  $$('#itTable [data-down]').forEach(btn => btn.addEventListener('click', () => {
    const i = b.items.findIndex(x => x.id === btn.dataset.down);
    if (i >= 0 && i < b.items.length - 1) { const t = b.items[i + 1]; b.items[i + 1] = b.items[i]; b.items[i] = t; save(true); renderItems(); }
  }));
  $$('#itTable [data-del]').forEach(btn => btn.addEventListener('click', async () => {
    const it = b.items.find(x => x.id === btn.dataset.del);
    if (!await confirmBox('ลบหัวข้อ', 'ลบ <b>' + esc(it.name) + '</b> พร้อมคะแนนของนักเรียนทุกคนในหัวข้อนี้?', 'ลบ')) return;

    Object.keys(b.scores).forEach(sid => { delete b.scores[sid][it.id]; });
    Object.keys(b.itemRetakes || {}).forEach(sid => { delete b.itemRetakes[sid][it.id]; });
    Object.keys(b.componentScores || {}).forEach(sid => { if (b.componentScores[sid]) delete b.componentScores[sid][it.id]; });
    delete b.gscores[it.id];
    delete b.presenters[it.id];
    save(true); renderItems();
  }));

  const bindNum = (sel, setter) => {
    const el = $(sel); if (!el) return;
    el.addEventListener('change', () => { setter(num(el.value)); save(true); renderItems(); });
  };
  bindNum('#exMid', v => b.exams.midMax = Math.max(0, v));
  bindNum('#exFin', v => b.exams.finalMax = Math.max(0, v));
  bindNum('#wBefore', v => { b.weights.before = Math.max(0, v); b.weights.collect = num(b.weights.before) + num(b.weights.after); });
  bindNum('#wM', v => b.weights.mid = Math.max(0, v));
  bindNum('#wAfter', v => { b.weights.after = Math.max(0, v); b.weights.collect = num(b.weights.before) + num(b.weights.after); });
  bindNum('#wF', v => b.weights.final = Math.max(0, v));
  bindNum('#passP', v => b.passPercent = Math.min(100, Math.max(0, v)));
  $('#exRetake').addEventListener('change', e => { b.exams.retakeEnabled = e.target.checked; save(true); renderItems(); });

  $$('#gsTable input').forEach(el => el.addEventListener('change', () => {
