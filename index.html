      const found = findStudentBySid(sid);
      if (!found) { missing.push(sid); return; }
      draft.students.push(found); added++;
    });
    save();
    let msg = 'เพิ่ม ' + added + ' คน';
    if (dup.length) msg += ' • ซ้ำ ' + dup.length;
    if (missing.length) msg += ' • ไม่พบเลขประจำตัว ' + missing.join(', ');
    toast(msg, missing.length ? 'warn' : 'ok');
    renderActivities();
    const box = $('#actSid'); if (box) box.focus();
  };
  $('#actAdd', pane).addEventListener('click', () => { keep(); addSids($('#actSid', pane).value); });
  $('#actSid', pane).addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); keep(); addSids(e.target.value); } });
  $$('[data-act-del]', pane).forEach(btn => btn.addEventListener('click', () => {
    keep(); draft.students = draft.students.filter(s => String(s.sid) !== String(btn.dataset.actDel)); save(); renderActivities();
  }));
  $('#actClear', pane).addEventListener('click', () => { keep(); draft.students = []; save(); renderActivities(); });

  $('#actSave', pane).addEventListener('click', () => {
    keep();
    if (!draft.name.trim()) return toast('กรุณากรอกชื่อกิจกรรม', 'bad');
    if (!draft.slotIds.length) return toast('กรุณาเลือกคาบที่ทำกิจกรรม', 'bad');
    if (!draft.students.length) return toast('กรุณาเลือกนักเรียนอย่างน้อย 1 คน', 'bad');
    const act = { id: draft.id || uid('act'), periodId: DB.ui.periodId, name: draft.name.trim(), date: draft.date,
      slotIds: draft.slotIds.slice(), students: draft.students.slice(), place: draft.place.trim(), note: draft.note.trim(),
      teacherId: (curTeacher() || {}).id || '', createdAt: draft.createdAt || new Date().toISOString() };
    saveActivity(act);
    DB.ui.activityDraft = { name: '', date: act.date, slotIds: [], students: [], place: '', note: '' };
    save(true); renderActivities();
    const n = activityImpact(act).length;
    toast('บันทึกกิจกรรมแล้ว • มีผลกับ ' + n + ' คาบเรียน', 'ok');
  });

  $$('[data-act-print]', pane).forEach(b => b.addEventListener('click', () => openActivityDocument(b.dataset.actPrint)));
  $$('[data-act-edit]', pane).forEach(b => b.addEventListener('click', () => {
    const a = (DB.timetable.activities || []).find(x => x.id === b.dataset.actEdit); if (!a) return;
    DB.ui.activityDraft = { id: a.id, name: a.name, date: a.date, slotIds: (a.slotIds || []).slice(),
      students: (a.students || []).slice(), place: a.place || '', note: a.note || '', createdAt: a.createdAt };
    save(); renderActivities(); toast('นำกิจกรรมมาแก้ไข กด “บันทึก” เพื่อยืนยัน', 'ok');
  }));
  $$('[data-act-remove]', pane).forEach(b => b.addEventListener('click', async () => {
    const a = (DB.timetable.activities || []).find(x => x.id === b.dataset.actRemove); if (!a) return;
    if (!await confirmBox('ลบกิจกรรม', 'ลบ <b>' + esc(a.name) + '</b> วันที่ ' + esc(thaiDate(a.date)) +
      '?<br>สถานะ “กิจกรรม” ที่ยังไม่ได้บันทึกการเช็กชื่อจะหายไปด้วย', 'ลบกิจกรรม')) return;
    DB.timetable.activities = (DB.timetable.activities || []).filter(x => x.id !== a.id);
    save(true); if (typeof removeActivityDoc === 'function') removeActivityDoc(a.id);
    renderActivities(); toast('ลบกิจกรรมแล้ว', 'ok');
  }));
}

/* ============================================================================
   13) Google Login
   ========================================================================== */
let googleAccessToken = '';
const GOOGLE_SCOPES = 'openid email profile';
/* การเข้าสู่ระบบด้วยบัญชีโรงเรียนต้องการแค่การยืนยันตัวตน ไม่ต้องขอสิทธิ์ Drive/Sheets
   จึงตั้งค่าใน Google Cloud ง่ายกว่า และหน้าขออนุญาตของครูก็สั้นลง */
const GOOGLE_SCOPES_IDENTITY = 'openid email profile';
let googleIdentityToken = '';

function ensureGoogleToken(scope) {
  const identityOnly = scope === GOOGLE_SCOPES_IDENTITY;
  if (identityOnly && googleIdentityToken) return Promise.resolve(googleIdentityToken);
  if (!identityOnly && googleAccessToken) return Promise.resolve(googleAccessToken);
  if (identityOnly && googleAccessToken) return Promise.resolve(googleAccessToken);   // สิทธิ์เต็มครอบคลุมอยู่แล้ว
  if (!DB.cloud.clientId) return Promise.reject(new Error('กรุณากรอก Google OAuth Client ID ก่อน'));
  if (!window.google || !google.accounts || !google.accounts.oauth2) return Promise.reject(new Error('ยังโหลดบริการ Google ไม่เสร็จ กรุณารอสักครู่แล้วลองใหม่'));
  return new Promise((resolve, reject) => {
    const client = google.accounts.oauth2.initTokenClient({
      client_id: DB.cloud.clientId,
      scope: scope || GOOGLE_SCOPES,
      prompt: 'select_account',
      callback(resp) {
        if (resp && resp.access_token) {
          if (identityOnly) googleIdentityToken = resp.access_token; else googleAccessToken = resp.access_token;
          resolve(resp.access_token);
        }
        else reject(new Error((resp && resp.error_description) || 'Google ไม่อนุญาตการเข้าถึง'));
      },
      error_callback(err) { reject(new Error((err && err.message) || 'เปิดหน้าลงชื่อเข้าใช้ Google ไม่สำเร็จ')); }
    });
    client.requestAccessToken();
  });
}

async function cloudApi(url, options) {
  const token = await ensureGoogleToken();
  const opts = Object.assign({}, options || {});
  opts.headers = Object.assign({}, opts.headers || {}, { Authorization: 'Bearer ' + token });
  const res = await fetch(url, opts);
  if (res.status === 401) googleAccessToken = '';
  if (!res.ok) {
    let detail = ''; try { detail = (await res.json()).error.message; } catch (e) { detail = await res.text(); }
    throw new Error(detail || ('Google API HTTP ' + res.status));
  }
  if (res.status === 204) return {};
  return res.json();
}

async function googleLogin() {
  await ensureGoogleToken();
  const me = await cloudApi('https://openidconnect.googleapis.com/v1/userinfo');
  DB.cloud.accountEmail = me.email || '';
  const matchedTeacher = DB.teachers.find(t => t.email && String(t.email).toLowerCase() === String(me.email || '').toLowerCase());
  if (matchedTeacher) {
    DB.ui.teacherId = matchedTeacher.id;
    if (!teacherHasRole(matchedTeacher, DB.ui.staffMode)) DB.ui.staffMode = matchedTeacher.roles[0] || 'teacher';
  }
  save(true);
  render();
  return me;
}

/* ============================================================================
   13.1) ระบบบุคลากรกลาง — เข้าสู่ระบบได้จากทุกอุปกรณ์
   ใช้คู่กับไฟล์ appsscript-gradebook.gs ที่ติดตั้งบน Google Sheet ของโรงเรียน
   ========================================================================== */
const staffApiUrl = () => String((DB.cloud || {}).staffApiUrl || '').trim();
const staffToken = () => String((DB.cloud || {}).staffToken || '');

/** เรียก API ของ Apps Script — ส่งเป็น text/plain เพื่อเลี่ยง preflight ที่ Apps Script ไม่รองรับ */
async function staffApi(action, payload) {
  const url = staffApiUrl();
  if (!url) throw new Error('ยังไม่ได้ตั้งค่าลิงก์ระบบบุคลากรกลาง');
  const body = Object.assign({ action: action }, payload || {});
  const res = await fetch(url, { method: 'POST', redirect: 'follow',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  if (!res.ok) throw new Error('เชื่อมต่อไม่สำเร็จ (HTTP ' + res.status + ')');
  let data;
  try { data = await res.json(); }
  catch (e) { throw new Error('คำตอบจากเซิร์ฟเวอร์ไม่ถูกต้อง อาจยังไม่ได้ตั้งสิทธิ์เข้าถึงเป็น “ทุกคน”'); }
  if (!data.ok) throw new Error(data.error || 'ทำรายการไม่สำเร็จ');
  return data;
}

/** อ่านบทบาทจากส่วนกลางให้ได้ทุกรูปแบบที่คนกรอกจริง
    รองรับทั้ง array และข้อความคั่นด้วยจุลภาค รวมถึงชื่อบทบาทภาษาไทย */
function normalizeRoles(value) {
  const map = { teacher: 'teacher', ครู: 'teacher', head: 'head', 'หัวหน้ากลุ่มสาระ': 'head', 'หัวหน้ากลุ่มสาระฯ': 'head',
    'หัวหน้ากลุ่ม': 'head', executive: 'executive', 'ผู้บริหาร': 'executive', director: 'executive',
    admin: 'admin', 'ผู้ดูแลระบบ': 'admin', 'แอดมิน': 'admin' };
  // แยกคำในทุกกรณี รวมถึง array ที่มีสมาชิกเดียวแต่ใส่หลายบทบาทรวมกัน เช่น ["teacher head admin"]
  const raw = Array.isArray(value) ? value : [value];
  const list = raw.reduce((acc, x) => acc.concat(String(x == null ? '' : x).split(/[,\s]+/)), []);
  const out = list.map(x => map[String(x).trim().toLowerCase()] || map[String(x).trim()])
    .filter(x => STAFF_ROLES.indexOf(x) >= 0);
  return Array.from(new Set(out));
}

/** นำรายชื่อจากส่วนกลางมาลงเครื่อง จับคู่ด้วยอีเมลเป็นหลัก */
function mergeCentralStaff(list) {
  let added = 0, updated = 0;
  (list || []).forEach(item => {
    const email = String(item.email || '').trim().toLowerCase();
    if (!email) return;
    let t = DB.teachers.find(x => String(x.email || '').toLowerCase() === email) ||
            DB.teachers.find(x => item.name && normalizeName(x.name) === normalizeName(item.name));
    if (!t) { t = { id: item.id || canonicalTeacherId(item) || uid('teacher'), email: email, homeroomClassId: '' }; DB.teachers.push(t); added++; }
    else updated++;
    t.email = email;
    if (Array.isArray(item.legacyIds) && item.legacyIds.length)
      t.legacyIds = Array.from(new Set((t.legacyIds || []).concat(item.legacyIds)));
    t.name = item.name || t.name || email;
    const roles = normalizeRoles(item.roles);
    t.roles = roles.length ? roles : (t.roles || ['teacher']);
    t.learningArea = item.learningArea || t.learningArea || '';
    t.phone = item.phone || t.phone || '';
    // เก็บ "ชื่อห้อง" ไว้ด้วย เพราะรายชื่อห้องอาจยังซิงก์มาไม่ถึงตอนนี้
    if (item.homeroom) t.homeroomName = item.homeroom;
    const cls = DB.classes.find(c => c.name === (item.homeroom || t.homeroomName));
    if (cls) t.homeroomClassId = cls.id;
  });
  // รับรหัสเก่าจากส่วนกลางมาเก็บไว้ก่อน แล้วค่อยจัดรหัสในเครื่องให้เป็นแบบเดียวกัน
  rememberTeacherIdMap(teacherIdMapFromCentral(list));
  normalizeTeacherIds();
  applyStoredTeacherIdMap();
  return { added: added, updated: updated };
}

/** จับคู่ครูที่ปรึกษากับห้องเรียน หลังรายชื่อห้องซิงก์มาถึงภายหลัง */
function resolveHomerooms() {
  let fixed = 0;
  DB.teachers.forEach(t => {
    if (t.homeroomClassId || !t.homeroomName) return;
    const cls = DB.classes.find(c => c.name === t.homeroomName);
    if (cls) { t.homeroomClassId = cls.id; fixed++; }
  });
  return fixed;
}

/** เข้าสู่ระบบด้วยบัญชี Google ของโรงเรียน แล้วรับสิทธิ์จากส่วนกลาง */
async function loginWithCentralStaff(preferRole) {
  const accessToken = await ensureGoogleToken(GOOGLE_SCOPES_IDENTITY);
  const res = await staffApi('login', { accessToken: accessToken });
  DB.cloud.staffToken = res.token;
  DB.cloud.accountEmail = res.staff.email;
  mergeCentralStaff([res.staff]);
  // ดึงรายชื่อทั้งหมดมาด้วย เพื่อให้เห็นครูคนอื่นในระบบใบลาและภาพรวม
  try { const all = await staffApi('staffList', { token: res.token }); mergeCentralStaff(all.staff); }
  catch (e) { /* ดึงไม่ได้ก็ยังเข้าใช้งานได้ */ }
  const me = DB.teachers.find(t => String(t.email || '').toLowerCase() === res.staff.email);
  if (!me) throw new Error('จับคู่โปรไฟล์ไม่สำเร็จ');
  DB.ui.teacherId = me.id;
  save(true);
  return { teacher: me, role: preferRole && teacherHasRole(me, preferRole) ? preferRole : me.roles[0] };
}

/* ---- ตรวจสุขภาพการเชื่อมต่อส่วนกลาง --------------------------------------
   ใช้ตอบสามคำถามที่ทำให้ระบบล่มบ่อยที่สุด: ชุดข้อมูลไหนใหญ่เกินเพดานเอกสาร
   สิทธิ์ตรงไหนถูกปฏิเสธ และของบนส่วนกลางตรงกับในเครื่องนี้หรือยัง */
const FB_DOC_LIMIT = 1000000;
const byteSize = obj => { try { return new Blob([JSON.stringify(obj)]).size; } catch (e) { return 0; } };
const kb = n => (n / 1024).toFixed(n > 102400 ? 0 : 1) + ' KB';
/** อีเมลที่ซ้ำกัน เอกสารบนส่วนกลางใช้อีเมลเป็นรหัส คนหลังจึงทับคนแรก */
function staffEmailDuplicates() {
  const seen = new Map(), out = [];
  DB.teachers.forEach(t => {
    const k = fbStaffId(t.email); if (!String(t.email || '').trim()) return;
    if (seen.has(k)) out.push({ email: t.email, names: [seen.get(k), t.name || t.email] }); else seen.set(k, t.name || t.email);
  });
  return out;
}

/** ขนาดจริงของแต่ละชุดข้อมูลที่จะส่งขึ้น เทียบกับเพดาน 1 เอกสารของ Firestore */
function centralPayloadRows() {
  const withEmail = DB.teachers.filter(t => String(t.email || '').trim());
  const noEmail = DB.teachers.length - withEmail.length;
  const dupes = staffEmailDuplicates();
  const docSizes = withEmail.map(t => byteSize(fbTeacherDoc(t)));
  const staffProblem = noEmail ? 'ไม่มีอีเมล ' + noEmail + ' คน จึงส่งขึ้นไม่ได้และเข้าสู่ระบบไม่ได้'
    : dupes.length ? 'อีเมลซ้ำ ' + dupes.length + ' รายการ ข้อมูลจะทับกันบนส่วนกลาง' : '';
  const rows = [
    { label: 'บุคลากรและสิทธิ์ใช้งาน', doc: 'staff/{อีเมล} • แยกเอกสารรายคน',
      size: docSizes.length ? Math.max.apply(null, docSizes) : 0, problem: staffProblem,
      hint: 'ส่งขึ้นได้ ' + withEmail.length + ' คน จากทั้งหมด ' + DB.teachers.length + ' คน • รวมทุกคน ' +
        kb(docSizes.reduce((a, b) => a + b, 0)) + ' • ขนาดที่วัดคือเอกสารรายคนที่ใหญ่ที่สุด' },
    { label: 'ห้องเรียนและรายชื่อนักเรียน', doc: 'shared/classes', size: byteSize({ items: DB.classes }),
      hint: DB.classes.length + ' ห้อง • นักเรียน ' + DB.classes.reduce((a, c) => a + (c.students || []).length, 0) + ' คน' },
    { label: 'รายวิชา', doc: 'shared/subjects', size: byteSize({ items: DB.subjects }), hint: DB.subjects.length + ' วิชา' },
    { label: 'ปี/ภาคเรียน', doc: 'shared/periods', size: byteSize({ items: DB.periods }), hint: DB.periods.length + ' ภาค' },
    { label: 'ตั้งค่าโรงเรียน', doc: 'shared/settings', size: byteSize({ value: DB.settings }),
      hint: DB.settings.logoData ? 'มีรูปตราโรงเรียนฝังอยู่ ' + kb(byteSize(DB.settings.logoData)) : 'ไม่มีรูปฝังอยู่' }
  ];
  (DB.periods || []).forEach(p => {
    const entries = (DB.timetable.entries || []).filter(e => e.periodId === p.id);
    rows.push({ label: 'ตารางสอน ปี ' + p.academicYear + ' ภาค ' + p.semester, doc: 'timetable/' + p.id,
      size: byteSize({ entries: entries, exceptions: (DB.timetable.exceptions || []).filter(e => e.periodId === p.id), term: (DB.timetable.terms || {})[p.id] || null }),
      hint: entries.length + ' คาบ' });
  });
  return rows;
}

/** ลองอ่านและเขียนจริงทีละคอลเลกชัน เพื่อให้เห็นรหัสข้อผิดพลาดที่แท้จริง */
async function centralHealthCheck() {
  const out = [];
  const step = async (label, fn) => {
    try { out.push({ label: label, ok: true, info: await fn() }); }
    catch (e) { out.push({ label: label, ok: false, info: (e && e.code ? e.code + ' • ' : '') + fbErrorMessage(e) }); }
  };
  const server = ref => ref.get({ source: 'server' });
  const email = myEmailForSync();

  await step('อีเมลที่ใช้เชื่อมต่อ', async () => {
    if (!email) throw new Error('โปรไฟล์ครูที่เลือกอยู่ยังไม่มีอีเมล ระบบจึงไม่รู้ว่าคุณเป็นใครบนส่วนกลาง');
    return email;
  });
  await step('โปรไฟล์ของฉันในคอลเลกชัน staff (ประตูเข้าสู่ระบบ)', async () => {
    if (!email) throw new Error('ยังไม่มีอีเมล');
    const d = await server(fbDb.collection('staff').doc(fbStaffId(email)));
    if (!d.exists) throw new Error('ไม่พบอีเมลนี้ใน staff — คนที่ไม่มีชื่อในนี้จะเข้าสู่ระบบไม่ได้ทุกคน ให้กด “ส่งรายชื่อบุคลากรขึ้น”');
    const x = d.data() || {};
    if (x.active === false) throw new Error('มีชื่ออยู่ แต่ถูกตั้งเป็นไม่ใช้งาน (active = false)');
    return 'สิทธิ์ ' + ((x.roles || []).join(', ') || 'ยังไม่กำหนด');
  });
  // อ่านรายชื่อบนส่วนกลางครั้งเดียว แล้วใช้ตรวจต่อหลายข้อ
  let remote = null;
  try { remote = await server(fbDb.collection('staff')); } catch (e) { remote = null; }
  const remoteMap = new Map();
  if (remote) remote.docs.forEach(d => remoteMap.set(d.id, d.data() || {}));

  await step('จำนวนบุคลากรบนส่วนกลาง', async () => {
    if (!remote) throw new Error('อ่านคอลเลกชัน staff ไม่ได้ — ตรวจว่าวางกฎจากไฟล์ firestore.rules แล้ว');
    const local = DB.teachers.filter(t => t.email).length;
    const inactive = remote.docs.filter(d => (d.data() || {}).active === false).length;
    if (remote.size < local) throw new Error('ส่วนกลางมี ' + remote.size + ' คน แต่ในเครื่องนี้มี ' + local + ' คน — ยังส่งขึ้นไม่ครบ คนที่ขาดจะเข้าสู่ระบบไม่ได้');
    return remote.size + ' คน' + (inactive ? ' • ปิดใช้งาน ' + inactive + ' คน' : '') + ' • ในเครื่องนี้ ' + local + ' คน';
  });
  await step('ครูที่มีอีเมลแต่ยังไม่มีชื่อบนส่วนกลาง', async () => {
    if (!remote) throw new Error('อ่านคอลเลกชัน staff ไม่ได้');
    const missing = DB.teachers.filter(t => String(t.email || '').trim() && !remoteMap.has(fbStaffId(t.email)));
    if (missing.length) throw new Error(missing.length + ' คนเข้าสู่ระบบไม่ได้ เช่น ' +
      missing.slice(0, 5).map(t => t.name || t.email).join(', ') + (missing.length > 5 ? ' และอีก ' + (missing.length - 5) + ' คน' : '') +
      ' — กดปุ่ม “ส่งรายชื่อบุคลากรขึ้น”');
    return 'ครูทุกคนที่มีอีเมลมีชื่อบนส่วนกลางครบ';
  });
  await step('ครูที่ยังไม่มีอีเมลในเครื่องนี้', async () => {
    const none = DB.teachers.filter(t => !String(t.email || '').trim());
    if (none.length) throw new Error(none.length + ' คนไม่มีอีเมล จึงส่งขึ้นส่วนกลางไม่ได้และเข้าสู่ระบบไม่ได้ เช่น ' +
      none.slice(0, 5).map(t => t.name || '(ยังไม่มีชื่อ)').join(', '));
    return 'ครูทุกคนมีอีเมลครบ';
  });
  await step('อีเมลซ้ำกัน', async () => {
    const d = staffEmailDuplicates();
    if (d.length) throw new Error(d.length + ' รายการ ข้อมูลจะทับกันบนส่วนกลาง เช่น ' + d.slice(0, 3).map(x => x.email).join(', '));
    return 'ไม่มีอีเมลซ้ำ';
  });
  await step('ชื่อบนส่วนกลางที่ไม่มีในเครื่องนี้', async () => {
    if (!remote) throw new Error('อ่านคอลเลกชัน staff ไม่ได้');
    const localIds = new Set(DB.teachers.filter(t => t.email).map(t => fbStaffId(t.email)));
    const extra = remote.docs.filter(d => !localIds.has(d.id));
    if (extra.length) throw new Error(extra.length + ' คนมีบนส่วนกลางแต่ไม่มีในเครื่องนี้ เช่น ' +
      extra.slice(0, 5).map(d => d.id).join(', ') + ' — เครื่องนี้อาจมีรายชื่อเก่ากว่าส่วนกลาง');
    return 'ตรงกันทั้งสองฝั่ง';
  });

  const sharedChecks = [['classes', 'ห้องเรียน', () => DB.classes.length], ['subjects', 'รายวิชา', () => DB.subjects.length], ['periods', 'ปี/ภาคเรียน', () => DB.periods.length]];
  for (const [docId, label, localFn] of sharedChecks) {
    await step('ข้อมูลกลาง • ' + label, async () => {
      const d = await server(fbDb.collection('shared').doc(docId));
      if (!d.exists) throw new Error('ยังไม่มีเอกสารนี้บนส่วนกลาง เครื่องอื่นจึงดึง' + label + 'ไปไม่ได้');
      const n = ((d.data() || {}).items || []).length, local = localFn();
      if (n !== local) throw new Error('ส่วนกลางมี ' + n + ' รายการ แต่เครื่องนี้มี ' + local + ' รายการ — ไม่ตรงกัน');
      return n + ' รายการ ตรงกับเครื่องนี้';
    });
  }
  await step('ข้อมูลกลาง • ตั้งค่าโรงเรียน', async () => {
    const d = await server(fbDb.collection('shared').doc('settings'));
    if (!d.exists) throw new Error('ยังไม่มีเอกสารนี้บนส่วนกลาง');
    return 'มีอยู่ • ' + kb(byteSize(d.data() || {}));
  });
  if (DB.ui.periodId) await step('ตารางสอนของภาคที่เลือก', async () => {
    const d = await server(fbDb.collection('timetable').doc(DB.ui.periodId));
    if (!d.exists) throw new Error('ยังไม่มีตารางสอนของภาคนี้บนส่วนกลาง');
    const n = ((d.data() || {}).entries || []).length, local = (DB.timetable.entries || []).filter(e => e.periodId === DB.ui.periodId).length;
    if (n !== local) throw new Error('ส่วนกลาง ' + n + ' คาบ • เครื่องนี้ ' + local + ' คาบ — ไม่ตรงกัน');
    return n + ' คาบ ตรงกับเครื่องนี้';
  });
  await step('ผลการเรียนคงค้าง (ต้องวางกฎ firestore.rules รุ่นใหม่ก่อน)', async () => {
    const snap = await server(fbDb.collection('pendingResults'));
    return snap.size + ' รายการ';
  });
  await step('รหัสครูตรงกับตารางสอนและใบลา', async () => {
    const m = mismatchedTeacherRefs(), total = m.entries + m.leaves + m.swaps;
    if (total) throw new Error('ตารางสอน ' + m.entries + ' คาบ • ใบลา ' + m.leaves + ' ใบ • คำขอแลกคาบ ' + m.swaps +
      ' รายการ อ้างถึงรหัสครูที่ไม่มีในเครื่องนี้ — ตารางสอนจะไม่ขึ้นให้ครูเห็น กดปุ่ม “ซ่อมรหัสครู” ในการ์ดด้านบน');
    return 'รหัสครูตรงกันทั้งหมด';
  });
  await step('รูปแบบรหัสครู', async () => {
    const old = DB.teachers.filter(t => String(t.email || '').trim() && t.id !== canonicalTeacherId(t));
    if (old.length) throw new Error(old.length + ' คนยังใช้รหัสแบบเก่าที่สร้างในเครื่องนี้เอง เครื่องอื่นจะจับคู่ไม่ได้ — กด “ซ่อมรหัสครู”');
    return 'ทุกคนใช้รหัสที่อ้างจากอีเมลแล้ว';
  });
  await step('ทดสอบเขียนจริง', async () => {
    const ref = fbDb.collection('shared').doc('_healthcheck');
    await ref.set({ at: new Date().toISOString(), by: email || '' });
    await ref.delete();
    return 'เขียนและลบได้ตามปกติ';
  });

  // ตารางรายคน ใช้ชี้ตัวได้เลยว่าใครเข้าสู่ระบบไม่ได้เพราะอะไร
  const staffRows = DB.teachers.slice().sort((a, b) => String(a.name || '').localeCompare(String(b.name || ''), 'th')).map(t => {
    const mail = String(t.email || '').trim(), id = mail ? fbStaffId(mail) : '', r = id ? remoteMap.get(id) : null;
    return { name: t.name || '(ยังไม่มีชื่อ)', email: mail, roles: (t.roles || []).map(roleLabel).join(', '),
      onCentral: !!r, active: r ? r.active !== false : null,
      note: !mail ? 'ไม่มีอีเมล — ส่งขึ้นไม่ได้และเข้าสู่ระบบไม่ได้'
        : !remote ? 'อ่านส่วนกลางไม่ได้ ตรวจไม่ได้'
        : !r ? 'ยังไม่มีชื่อบนส่วนกลาง — เข้าสู่ระบบไม่ได้'
        : r.active === false ? 'ถูกตั้งเป็นไม่ใช้งาน — เข้าสู่ระบบไม่ได้'
        : 'เข้าสู่ระบบได้' };
  });
  if (remote) {
    const localIds = new Set(DB.teachers.filter(t => t.email).map(t => fbStaffId(t.email)));
    remote.docs.filter(d => !localIds.has(d.id)).forEach(d => { const x = d.data() || {};
      staffRows.push({ name: x.name || '(ไม่มีชื่อ)', email: d.id, roles: (x.roles || []).join(', '),
        onCentral: true, active: x.active !== false, note: 'มีบนส่วนกลางแต่ไม่มีในเครื่องนี้' });
    });
  }
  return { steps: out, staff: staffRows };
}

function renderHealthCard() {
  const box = $('#adminHealthBox'); if (!box) return;
  const rows = centralPayloadRows(), over = rows.filter(r => r.size > FB_DOC_LIMIT);
  const ready = firebaseReady() && fbSignedIn();
  box.innerHTML = '<div class="exec-head"><div><div class="exec-eyebrow">CONNECTION HEALTH</div><h3>ตรวจสุขภาพการเชื่อมต่อส่วนกลาง</h3></div><div class="spacer"></div>' +
    '<span class="badge ' + (over.length ? 'bad' : 'ok') + '">' + (over.length ? over.length + ' ชุดใหญ่เกินเพดาน' : 'ขนาดข้อมูลผ่านทุกชุด') + '</span>' +
    '<button class="primary" id="healthRun"' + (ready ? '' : ' disabled') + '>ทดสอบการเชื่อมต่อจริง</button></div>' +
    '<div class="exec-note">Firestore เก็บได้เอกสารละ 1,024 KB ถ้าชุดไหนเกิน ชุดนั้นจะส่งขึ้นไม่ได้เลย ' +
    'เครื่องอื่นก็จะดึงข้อมูลชุดนั้นไปไม่ได้ตามไปด้วย' + (ready ? '' : '<br><span class="badtext">ยังไม่ได้เข้าสู่ระบบด้วยบัญชีโรงเรียน จึงทดสอบการเชื่อมต่อไม่ได้</span>') + '</div>' +
    '<div class="tablewrap"><table><thead><tr><th>ชุดข้อมูล</th><th>เอกสารปลายทาง</th><th class="numcell">ขนาด</th><th>เทียบเพดาน</th><th>ผล</th></tr></thead><tbody>' +
    rows.map(r => {
      const pct = Math.min(100, r.size * 100 / FB_DOC_LIMIT), over = r.size > FB_DOC_LIMIT, bad = over || !!r.problem;
      return '<tr><td><b>' + esc(r.label) + '</b><div class="hint">' + esc(r.hint || '') + '</div></td>' +
        '<td><code>' + esc(r.doc) + '</code></td><td class="numcell">' + esc(kb(r.size)) + '</td>' +
        '<td><div class="cap-bar" style="--capc:' + (over ? 'var(--bad)' : pct > 70 ? 'var(--warn)' : 'var(--ok)') + '"><i style="width:' + fmt(pct, 0) + '%"></i></div></td>' +
        '<td class="' + (bad ? 'badtext' : 'oktext') + '">' + esc(over ? 'ใหญ่เกิน ส่งไม่ขึ้น' : r.problem || 'ผ่าน') + '</td></tr>';
    }).join('') + '</tbody></table></div>' +
    (over.length ? '<div class="notice" style="margin-top:10px">ชุดที่ใหญ่เกินต้องลดขนาดก่อน เช่น ย่อรูปตราโรงเรียนในหน้าตั้งค่า ' +
      'หรือย้ายนักเรียนที่พ้นสภาพออกจากห้อง แล้วกดส่งขึ้นใหม่</div>' : '') +
    '<div id="healthResult" style="margin-top:12px"></div>';
  const btn = $('#healthRun', box);
  if (btn) btn.addEventListener('click', async () => {
    const out = $('#healthResult', box);
    btn.disabled = true; out.innerHTML = '<div class="hint">กำลังทดสอบการเชื่อมต่อ...</div>';
    const res = await centralHealthCheck(), steps = res.steps, staff = res.staff || [];
    const bad = steps.filter(x => !x.ok).length;
    const blocked = staff.filter(x => x.note !== 'เข้าสู่ระบบได้' && x.note !== 'มีบนส่วนกลางแต่ไม่มีในเครื่องนี้');
    out.innerHTML = '<div class="exec-sum"><span>ผ่าน <b>' + (steps.length - bad) + '</b></span><span>มีปัญหา <b>' + bad + '</b></span>' +
      '<span>บุคลากร <b>' + staff.length + '</b> คน</span><span>เข้าสู่ระบบไม่ได้ <b>' + blocked.length + '</b> คน</span></div>' +
      '<div class="tablewrap"><table><thead><tr><th>รายการที่ตรวจ</th><th>ผล</th></tr></thead><tbody>' +
      steps.map(x => '<tr><td><b>' + esc(x.label) + '</b></td><td class="' + (x.ok ? 'oktext' : 'badtext') + '">' +
        (x.ok ? '✓ ' : '✕ ') + esc(x.info) + '</td></tr>').join('') + '</tbody></table></div>' +
      (staff.length ? '<details class="exec-more"' + (blocked.length ? ' open' : '') + '><summary>ข้อมูลบุคลากรรายคน ' + staff.length + ' คน' +
        (blocked.length ? ' • เข้าสู่ระบบไม่ได้ ' + blocked.length + ' คน' : ' • เข้าสู่ระบบได้ทุกคน') + '</summary>' +
        '<div class="tablewrap"><table><thead><tr><th>ชื่อ</th><th>อีเมล</th><th>สิทธิ์</th><th>บนส่วนกลาง</th><th>สถานะเข้าสู่ระบบ</th></tr></thead><tbody>' +
        staff.map(x => { const okRow = x.note === 'เข้าสู่ระบบได้';
          return '<tr><td><b>' + esc(x.name) + '</b></td><td>' + esc(x.email || '—') + '</td><td>' + esc(x.roles || '—') + '</td>' +
            '<td>' + (x.onCentral ? '<span class="badge ok">มี</span>' : '<span class="badge bad">ไม่มี</span>') + '</td>' +
            '<td class="' + (okRow ? 'oktext' : 'badtext') + '">' + esc(x.note) + '</td></tr>'; }).join('') +
        '</tbody></table></div></details>' : '');
    btn.disabled = false;
  });
}

/** ล้างใบลาและคำขอที่ไม่มีเจ้าของ — ใช้เก็บกวาดข้อมูลทดสอบที่ค้างอยู่ */
function renderMaintainCard() {
  const box = $('#adminMaintainBox'); if (!box) return;
  const o = orphanLeaveData(), total = o.leaves.length + o.requests.length;
  const mm = mismatchedTeacherRefs(), mismatch = mm.entries + mm.leaves + mm.swaps;
  if (mismatch) {
    // ห้ามล้างตอนรหัสยังไม่ตรง เพราะใบลาจริงจะดูเหมือนไม่มีเจ้าของแล้วโดนลบทิ้ง
    box.innerHTML = '<div class="row"><div><h3 style="margin:0">รหัสครูไม่ตรงกับข้อมูลในเครื่องนี้</h3>' +
      '<div class="hint">ข้อมูลบางส่วนอ้างถึงรหัสครูที่ไม่มีในเครื่องนี้ ตารางสอนจึงไม่ขึ้นให้ครูเห็น และใบลาขึ้นว่าไม่พบครู</div></div>' +
      '<div class="spacer"></div><button class="primary" id="adminFixTeacherIds">ซ่อมรหัสครู</button></div>' +
      '<div class="exec-sum" style="margin-top:12px"><span>ตารางสอน <b>' + mm.entries + '</b> คาบ</span>' +
      '<span>ใบลา <b>' + mm.leaves + '</b> ใบ</span><span>คำขอแลกคาบ <b>' + mm.swaps + '</b> รายการ</span></div>' +
      '<div class="notice">ระบบซ่อนปุ่มล้างข้อมูลไว้ก่อน เพราะตอนนี้ใบลาจริงจะดูเหมือนไม่มีเจ้าของ ถ้าล้างตอนนี้ข้อมูลจริงจะหาย<br>' +
      'กดซ่อมรหัสครูก่อน แล้วกดส่งตารางสอนขึ้นส่วนกลางใหม่อีกครั้ง เครื่องอื่นจะได้รับรหัสที่ถูกต้อง</div>';
    $('#adminFixTeacherIds', box).addEventListener('click', async () => {
      if (!await confirmBox('ซ่อมรหัสครูให้ตรงกันทุกเครื่อง',
        'ระบบจะเปลี่ยนรหัสครูให้อ้างอิงจากอีเมล ซึ่งได้ค่าเดียวกันทุกเครื่อง แล้วตามแก้ตารางสอน ใบลา คำขอแลกคาบ ' +
        'การเช็กชื่อ และผลการเรียนคงค้างให้ชี้ไปที่รหัสใหม่ ควรกดสำรองข้อมูลไว้ก่อน', 'ซ่อมเลย')) return;
      const r = normalizeTeacherIds(), more = applyStoredTeacherIdMap();
      save(true); renderAdmin(); render();
      toast('ซ่อมรหัสครู ' + r.renamed + ' คน • แก้จุดที่อ้างถึง ' + (r.fixed + more) + ' จุด', 'ok');
    });
    return;
  }
  box.innerHTML = '<div class="row"><div><h3 style="margin:0">ดูแลความสะอาดของข้อมูล</h3>' +
    '<div class="hint">ใบลาและคำขอสอนแทนที่อ้างถึงครูซึ่งไม่มีในระบบแล้ว มักเป็นข้อมูลทดสอบที่ค้างอยู่ ระบบซ่อนไว้ไม่ให้กวนสถิติ แต่ยังอยู่ในเครื่อง</div></div>' +
    '<div class="spacer"></div><span class="badge ' + (total ? 'warn' : 'ok') + '">' + total + ' รายการ</span>' +
    (total ? '<button class="danger" id="adminPurgeOrphan">ล้างข้อมูลที่ไม่มีเจ้าของ</button>' : '') + '</div>' +
    (total ? '<div class="tablewrap" style="margin-top:12px"><table><thead><tr><th>ประเภท</th><th>รหัสครูที่อ้างถึง</th><th>ช่วงวันที่</th><th class="numcell">คาบ</th></tr></thead><tbody>' +
      o.leaves.slice(0, 30).map(l => '<tr><td>ใบลา</td><td>' + esc(l.teacherId || '—') + '</td><td>' + esc(thaiDate(l.fromDate) + (l.toDate !== l.fromDate ? ' – ' + thaiDate(l.toDate) : '')) + '</td><td class="numcell">' + ((l.requestIds || []).length) + '</td></tr>').join('') +
      o.requests.slice(0, 30).map(r => '<tr><td>คำขอสอนแทน/แลกคาบ</td><td>' + esc(r.requesterTeacherId || '—') + '</td><td>' + esc(thaiDate(r.date)) + '</td><td class="numcell">1</td></tr>').join('') +
      '</tbody></table></div>' : '<div class="empty" style="margin-top:12px">ไม่มีข้อมูลค้างที่ไม่มีเจ้าของ</div>');
  const btn = $('#adminPurgeOrphan', box);
  if (btn) btn.addEventListener('click', async () => {
    if (!await confirmBox('ล้างข้อมูลที่ไม่มีเจ้าของ', 'จะลบใบลา ' + o.leaves.length + ' ใบ และคำขอ ' + o.requests.length + ' รายการออกถาวร ย้อนกลับไม่ได้ ควรกดสำรองข้อมูลไว้ก่อน', 'ลบถาวร')) return;
    const leaveIds = new Set(o.leaves.map(l => l.id)), reqIds = new Set(o.requests.map(r => r.id));
    o.leaves.forEach(l => (l.requestIds || []).forEach(id => reqIds.add(id)));
    DB.timetable.leaveRequests = (DB.timetable.leaveRequests || []).filter(l => !leaveIds.has(l.id));
    DB.timetable.exchangeRequests = (DB.timetable.exchangeRequests || []).filter(r => !reqIds.has(r.id));
    save(true); renderAdmin();
    toast('ล้างข้อมูลที่ไม่มีเจ้าของแล้ว ' + (leaveIds.size + reqIds.size) + ' รายการ', 'ok');
  });
}

/* ---------- ข้อมูลหลักที่ผู้ดูแลระบบเป็นเจ้าของ ------------------------------
   เดิมมีแต่ปุ่ม "ส่งข้อมูลทั้งหมดขึ้นครั้งแรก" ซึ่งอ่านแล้วเหมือนกดได้หนเดียว
   ผู้ดูแลระบบแก้ห้องหรือตารางสอนทีหลังจึงไม่กล้ากดซ้ำ ข้อมูลบนส่วนกลางเลยค้างเก่า
   ที่นี่เทียบลายเซ็นของแต่ละชุด บอกว่าชุดไหนเปลี่ยนแล้วยังไม่ได้ส่ง และส่งเฉพาะชุดนั้น */
function adminDataSets() {
  const tt = DB.timetable || {};
  return [
    { key: 'staff', group: 'staff', label: 'บุคลากรและสิทธิ์',
      count: DB.teachers.filter(t => t.email).length + ' คน',
      sig: quickSig(JSON.stringify(DB.teachers.filter(t => t.email).map(fbTeacherDoc))) },
    { key: 'classes', group: 'shared', label: 'ห้องเรียนและรายชื่อนักเรียน',
      count: DB.classes.length + ' ห้อง • ' + DB.classes.reduce((n, c) => n + ((c.students || []).length), 0) + ' คน',
      sig: quickSig(JSON.stringify(DB.classes)) },
    { key: 'subjects', group: 'shared', label: 'รายวิชา', count: DB.subjects.length + ' วิชา',
      sig: quickSig(JSON.stringify(DB.subjects)) },
    { key: 'periods', group: 'shared', label: 'ปี/ภาคเรียน', count: DB.periods.length + ' ภาค',
      sig: quickSig(JSON.stringify(DB.periods)) },
    { key: 'settings', group: 'shared', label: 'ตั้งค่าโรงเรียน', count: esc(DB.settings.schoolName || 'ยังไม่ตั้งชื่อ'),
      sig: quickSig(JSON.stringify(DB.settings)) },
    { key: 'timetable', group: 'timetable', label: 'ตารางสอนและปฏิทินภาคเรียน',
      count: (tt.entries || []).length + ' คาบ',
      sig: quickSig(JSON.stringify({ e: tt.entries || [], x: tt.exceptions || [], t: tt.terms || {} })) }
  ];
}
const adminUnsyncedSets = () => { const sigs = (DB.cloud || {}).adminSigs || {}; return adminDataSets().filter(x => sigs[x.key] !== x.sig); };

/** ส่งเฉพาะชุดที่เปลี่ยนไปจากครั้งก่อน กดซ้ำได้ตลอด ไม่ต้องกลัวส่งซ้ำทั้งก้อน */
async function pushAdminChanges(force) {
  const sets = adminDataSets(), sigs = DB.cloud.adminSigs = DB.cloud.adminSigs || {};
  const changed = force ? sets : sets.filter(x => sigs[x.key] !== x.sig);
  if (!changed.length) return { sent: 0, failed: [], nothing: true, labels: [] };
  const groups = [];
  changed.forEach(x => { if (groups.indexOf(x.group) < 0) groups.push(x.group); });
  let sent = 0; const failed = [], okGroups = [];
  for (const g of groups) {
    const r = await pushToFirebase(g);
    sent += r.sent;
    if (r.failed.length) failed.push.apply(failed, r.failed); else okGroups.push(g);
  }
  // จำลายเซ็นเฉพาะชุดที่ส่งขึ้นสำเร็จจริง ชุดที่ล้มจะยังขึ้นว่ารอส่งอยู่
  changed.forEach(x => { if (okGroups.indexOf(x.group) >= 0) sigs[x.key] = x.sig; });
  if (okGroups.length) DB.cloud.lastAdminPush = new Date().toISOString();
  save(true);
  return { sent: sent, failed: failed, labels: changed.map(x => x.label) };
}

      '<tr><td>กำลังรับข้อมูลสด</td><td>' + (fbUnsub.length ? fbUnsub.length + ' รายการ' : 'ยังไม่เริ่ม') + '</td></tr>' +
    '</tbody></table></div>' +

          r.labels.map(x => '<span>' + esc(x) + '</span>').join('') + '</div>' : '');
    }
    catch (e) { html = '<span class="badge bad">' + esc(fbErrorMessage(e)) + '</span>'; }
    renderFirebaseCard(); renderHealthCard();
    const out = $('#fbResult', box); if (out) out.innerHTML = html;
  };
  $('#fbInspect', box).addEventListener('click', async () => {

      'ทำซ้ำได้ทุกครั้งที่แก้ข้อมูล ไม่ใช่การตั้งระบบครั้งแรกเท่านั้น</div>' +
      '<div class="exec-sum">' + pend.map(x => '<span>' + esc(x.label) + '</span>').join('') + '</div>', 'อัปเดตขึ้น')) return;
    await run('อัปเดตขึ้นส่วนกลาง', () => pushAdminChanges(false));
  });
  $('#fbPushStaff', box).addEventListener('click', () => run('ส่งรายชื่อ', async () => {
    const r = await pushToFirebase('staff');
    if (!r.failed.length) {
      const sigs = DB.cloud.adminSigs = DB.cloud.adminSigs || {};
      adminDataSets().filter(x => x.group === 'staff').forEach(x => { sigs[x.key] = x.sig; });
      DB.cloud.lastAdminPush = new Date().toISOString(); save(true);
    }
    return r;
  }));
  $('#fbPushShared', box).addEventListener('click', () => run('ส่งข้อมูลหลัก', async () => {
    const a = await pushToFirebase('shared'), b = await pushToFirebase('timetable');
    const failed = a.failed.concat(b.failed);
    if (!failed.length) {
      const sigs = DB.cloud.adminSigs = DB.cloud.adminSigs || {};
      adminDataSets().filter(x => x.group !== 'staff').forEach(x => { sigs[x.key] = x.sig; });
      DB.cloud.lastAdminPush = new Date().toISOString(); save(true);
    }
    return { sent: a.sent + b.sent, failed: failed };
  }));
  $('#fbPushAll', box).addEventListener('click', async () => {
    if (!await confirmBox('ส่งใหม่ทั้งหมด',
      '<div class="exec-note">ส่งข้อมูลหลักทุกชุดขึ้นใหม่ รวมใบลาและคำขอแลกคาบทั้งหมด ' +
      'ข้อมูลบนส่วนกลางที่ซ้ำกันจะถูกเขียนทับด้วยของเครื่องนี้<br>' +
      'ปกติใช้ปุ่ม <b>อัปเดตขึ้นส่วนกลาง</b> ก็พอ ปุ่มนี้ใช้ตอนตั้งระบบใหม่หรือสงสัยว่าส่วนกลางไม่ครบ</div>', 'ส่งใหม่ทั้งหมด')) return;
    await run('ส่งข้อมูลทั้งหมด', async () => {
      const r = await pushToFirebase();
      if (!r.failed.length) {
        const sigs = DB.cloud.adminSigs = DB.cloud.adminSigs || {};
        adminDataSets().forEach(x => { sigs[x.key] = x.sig; });
        DB.cloud.lastAdminPush = new Date().toISOString(); save(true);
      }
      return r;
    });
  });
}

/* ============================================================================
   13.2) Firebase — ฐานข้อมูลกลางและการเข้าสู่ระบบด้วยบัญชี Google
   ต้องมีชื่ออยู่ในคอลเลกชัน staff ก่อนจึงจะเข้าใช้งานได้
   ข้อมูลที่ซิงก์รอบนี้: บุคลากร ห้องเรียน รายวิชา ปี/ภาค ตารางสอน ใบลา คำขอแลกคาบ
   (การเช็กชื่อและคะแนนในสมุดยังเก็บในเครื่อง จะย้ายในขั้นถัดไป)
   ========================================================================== */
let fbApp = null, fbAuth = null, fbDb = null, fbUser = null, fbUnsub = [], fbApplying = false;

const firebaseConfigured = () => {
  const c = (window.GRADEBOOK_CONFIG || {}).firebase || {};
  return !!(c.apiKey && c.projectId && c.authDomain);
};
const firebaseReady = () => !!fbDb;
const fbSignedIn = () => !!fbUser;
const fbStaffId = email => String(email || '').trim().toLowerCase().replace(/[^a-z0-9@._-]/g, '_');

/** เอกสารกลางที่เก็บข้อมูลชุดเล็กซึ่งใช้ร่วมกันทั้งโรงเรียน */
const FB_SHARED_DOCS = [
  { key: 'classes', doc: 'classes', field: 'items' },
  { key: 'subjects', doc: 'subjects', field: 'items' },
  { key: 'periods', doc: 'periods', field: 'items' },
  { key: 'settings', doc: 'settings', field: 'value' }
];

function initFirebase() {
  if (fbApp) return firebaseReady();
  if (!firebaseConfigured() || !window.firebase) return false;
  try {
    fbApp = firebase.initializeApp(window.GRADEBOOK_CONFIG.firebase);
    fbAuth = firebase.auth();
    fbDb = firebase.firestore();
    // แคชในเครื่อง เพื่อให้เปิดดูข้อมูลได้แม้เน็ตหลุด แล้วค่อยซิงก์เมื่อกลับมาออนไลน์
    if (fbDb.enablePersistence) fbDb.enablePersistence({ synchronizeTabs: true }).catch(() => {});
    fbAuth.onAuthStateChanged(u => { fbUser = u || null; if (!u) stopFirebaseSync(); });
    return true;
  } catch (e) { fbApp = null; fbDb = null; return false; }
}

/** ค้นหาบุคลากรจากอีเมล — ใช้อีเมลเป็นรหัสเอกสารเพื่อค้นเร็วและกันชื่อซ้ำ */
async function fbFindStaff(email) {
  const snap = await fbDb.collection('staff').doc(fbStaffId(email)).get();
  return snap.exists ? Object.assign({ id: snap.id, email: email }, snap.data()) : null;
}

/** แปลงรหัสข้อผิดพลาดของ Firebase เป็นคำอธิบายที่บอกวิธีแก้ได้ทันที */
function fbErrorMessage(e) {
  const code = String((e && e.code) || ''), host = location.hostname || '(ไฟล์ในเครื่อง)';
  if (code === 'auth/unauthorized-domain')
    return 'โดเมน "' + host + '" ยังไม่ได้รับอนุญาต — เปิด Firebase Console → Authentication → Settings → ' +
      'Authorized domains → Add domain แล้วใส่ ' + host + (host === '127.0.0.1' ? ' (หรือเปิดด้วย localhost แทน จะใช้ได้ทันที)' : '');
  if (code === 'auth/operation-not-allowed')
    return 'ยังไม่ได้เปิดการเข้าสู่ระบบด้วย Google — Firebase Console → Authentication → Sign-in method → Google → เปิดใช้งาน';
  if (code === 'auth/popup-blocked') return 'เบราว์เซอร์บล็อกหน้าต่างเข้าสู่ระบบ กรุณาอนุญาตป๊อปอัปของเว็บนี้แล้วลองใหม่';
  if (code === 'auth/popup-closed-by-user' || code === 'auth/cancelled-popup-request') return 'ยกเลิกการเข้าสู่ระบบ';
  if (code === 'auth/network-request-failed') return 'เชื่อมต่ออินเทอร์เน็ตไม่ได้';
  if (code === 'auth/invalid-api-key' || code === 'auth/api-key-not-valid')
    return 'ค่า apiKey ในไฟล์ config.js ไม่ถูกต้อง กรุณาคัดลอกใหม่จาก Firebase Console';
  if (code === 'permission-denied')
    return 'ฐานข้อมูลปฏิเสธการเข้าถึง — ตรวจว่าวางกฎจากไฟล์ firestore.rules แล้ว และมีอีเมลของคุณในคอลเลกชัน staff';
  if (code === 'unavailable') return 'ติดต่อฐานข้อมูลไม่ได้ ตรวจว่าสร้าง Firestore Database แล้ว';
  if (code === 'failed-precondition') return 'ยังไม่ได้สร้าง Firestore Database ในโปรเจกต์นี้';
  return (e && e.message) || 'ทำรายการไม่สำเร็จ';
}

/** เข้าสู่ระบบด้วย Google แล้วตรวจว่ามีชื่อในคอลเลกชัน staff หรือไม่ */
async function firebaseSignIn() {
  if (!initFirebase()) throw new Error('ยังไม่ได้ตั้งค่า Firebase ในไฟล์ config.js');
  const provider = new firebase.auth.GoogleAuthProvider();
  provider.setCustomParameters({ prompt: 'select_account' });
  const cred = await fbAuth.signInWithPopup(provider);
  const email = String((cred.user || {}).email || '').toLowerCase();
  if (!email) { await fbAuth.signOut(); throw new Error('บัญชีนี้ไม่มีอีเมล'); }
  let staff = null;
  try { staff = await fbFindStaff(email); }
  catch (e) { await fbAuth.signOut(); throw new Error('อ่านรายชื่อบุคลากรไม่ได้: ' + e.message); }
  if (!staff) { await fbAuth.signOut(); throw new Error('อีเมล ' + email + ' ยังไม่มีในระบบ กรุณาให้ผู้ดูแลระบบเพิ่มชื่อก่อน'); }
  if (staff.active === false) { await fbAuth.signOut(); throw new Error('บัญชีนี้ถูกปิดการใช้งาน'); }
  fbUser = cred.user;
  try { await fbDb.collection('staff').doc(staff.id).set({ uid: cred.user.uid, lastLogin: new Date().toISOString() }, { merge: true }); }
  catch (e) { /* บันทึกเวลาเข้าใช้ไม่สำเร็จ ไม่ขวางการเข้าระบบ */ }
  mergeCentralStaff([staff]);
  const me = DB.teachers.find(t => String(t.email || '').toLowerCase() === email);
  if (me) DB.ui.teacherId = me.id;
  DB.cloud.accountEmail = email;
  save(true);
  return { staff: staff, teacher: me };
}

async function firebaseSignOut() {
  stopFirebaseSync();
  if (fbAuth) { try { await fbAuth.signOut(); } catch (e) { } }
  fbUser = null;
}

/* ---- รหัสครูต้องเหมือนกันทุกเครื่อง ---------------------------------------
   เดิมรหัสครูสร้างขึ้นในเครื่องใครเครื่องมัน (uid('teacher')) และไม่ได้ส่งขึ้นส่วนกลาง
   เครื่องที่รับรายชื่อมาจากส่วนกลางจึงสร้างรหัสใหม่ของตัวเอง teacherId ในตารางสอน
   ที่เครื่องหนึ่งสร้างไว้จึงไม่ตรงกับครูในอีกเครื่อง ผลคือตารางสอนไม่ขึ้นให้ครูเห็น
   และใบลากับคำขอสอนแทนขึ้นว่า "ไม่พบครู"
   แก้โดยให้รหัสครูมาจากอีเมล ซึ่งได้ค่าเดียวกันทุกเครื่องโดยไม่ต้องตกลงกันก่อน */
const canonicalTeacherId = t => { const m = String((t || {}).email || '').trim(); return m ? 't_' + fbStaffId(m) : ''; };

/** ย้ายทุกจุดที่อ้างถึงรหัสครูเก่าไปเป็นรหัสใหม่ */
function remapTeacherIds(map) {
  if (!map || !map.size) return 0;
  let n = 0;
  const fix = (obj, key) => { const v = obj && obj[key]; if (v && map.has(v) && map.get(v) !== v) { obj[key] = map.get(v); n++; } };
  (DB.timetable.entries || []).forEach(e => fix(e, 'teacherId'));
  (DB.timetable.exceptions || []).forEach(e => fix(e, 'teacherId'));
  Object.values(DB.timetable.attendance || {}).forEach(r => fix(r, 'teacherId'));
  (DB.timetable.leaveRequests || []).forEach(l => fix(l, 'teacherId'));
  (DB.timetable.exchangeRequests || []).forEach(r => { fix(r, 'requesterTeacherId'); fix(r, 'targetTeacherId'); fix(r, 'assignedByHeadId'); });
  (DB.timetable.activities || []).forEach(a => {
    fix(a, 'teacherId');
    if (a.ack) { const out = {}; Object.keys(a.ack).forEach(k => { out[map.get(k) || k] = a.ack[k]; }); a.ack = out; }
  });
  (DB.pendingResults || []).forEach(r => fix(r, 'teacherId'));
  fix(DB.ui, 'teacherId');
  return n;
}

/** เปลี่ยนรหัสครูในเครื่องนี้ให้เป็นรหัสที่อ้างจากอีเมล แล้วตามแก้ทุกจุดที่อ้างถึง
    ครูที่ยังไม่มีอีเมลจะคงรหัสเดิมไว้ เพราะยังหาค่าที่แน่นอนร่วมกันไม่ได้ */
function normalizeTeacherIds() {
  const map = new Map(), taken = new Set(DB.teachers.map(t => t.id));
  let renamed = 0;
  DB.teachers.forEach(t => {
    const canon = canonicalTeacherId(t);
    if (!canon || canon === t.id) return;
    if (taken.has(canon)) return;   // อีเมลซ้ำกัน อย่ายุบครูสองคนให้เป็นคนเดียว
    t.legacyIds = Array.from(new Set((t.legacyIds || []).concat([t.id])));
    map.set(t.id, canon); taken.delete(t.id); taken.add(canon); t.id = canon; renamed++;
  });
  const fixed = remapTeacherIds(map);
  rememberTeacherIdMap(map);
  return { renamed: renamed, fixed: fixed };
}

/** แผนที่รหัสเก่า→รหัสใหม่ ใช้ซ่อมข้อมูลที่เครื่องอื่นส่งขึ้นส่วนกลางไว้ด้วยรหัสเก่า */
function teacherIdMapFromCentral(list) {
  const map = new Map();
  (list || []).forEach(item => {
    const canon = canonicalTeacherId(item); if (!canon) return;
    (item.legacyIds || []).concat(item.id ? [item.id] : []).forEach(old => { if (old && old !== canon) map.set(old, canon); });
  });
  return map;
}
function rememberTeacherIdMap(map) {
  if (!map || !map.size) return;
  DB.cloud = DB.cloud || {};
  DB.cloud.teacherIdMap = Object.assign({}, DB.cloud.teacherIdMap || {}, Object.fromEntries(map));
}
const storedTeacherIdMap = () => new Map(Object.entries((DB.cloud || {}).teacherIdMap || {}));
/** เรียกหลังรับข้อมูลจากส่วนกลางทุกครั้ง เพราะข้อมูลที่เพิ่งมาถึงอาจยังใช้รหัสเก่า */
const applyStoredTeacherIdMap = () => remapTeacherIds(storedTeacherIdMap());

/** ข้อมูลที่อ้างถึงรหัสครูซึ่งไม่มีในเครื่องนี้ — ตัวชี้ว่ารหัสยังไม่ตรงกัน */
function mismatchedTeacherRefs() {
  const ids = new Set(DB.teachers.map(t => t.id));
  const bad = v => v && !ids.has(v);
  return {
    entries: (DB.timetable.entries || []).filter(e => bad(e.teacherId)).length,
    leaves: (DB.timetable.leaveRequests || []).filter(l => bad(l.teacherId)).length,
    swaps: (DB.timetable.exchangeRequests || []).filter(r => bad(r.requesterTeacherId)).length
  };
}
const hasTeacherIdMismatch = () => { const m = mismatchedTeacherRefs(); return m.entries + m.leaves + m.swaps > 0; };

/** แปลงครูในเครื่องเป็นรูปแบบที่เก็บบน Firestore
    ส่งรหัสครูขึ้นไปด้วย พร้อมรหัสเก่าทุกตัว เครื่องอื่นจะได้ซ่อมข้อมูลเดิมของตัวเองได้ */
function fbTeacherDoc(t) {
  return { id: canonicalTeacherId(t) || t.id, legacyIds: t.legacyIds || [],
    name: t.name || '', roles: t.roles || ['teacher'], learningArea: t.learningArea || '',
    phone: t.phone || '', homeroom: (DB.classes.find(c => c.id === t.homeroomClassId) || {}).name || t.homeroomName || '',
    active: t.active !== false };
}

/* ---------- ซิงก์ข้อมูล -------------------------------------------------- */
/** เฝ้าฟังการเปลี่ยนแปลงจากส่วนกลาง แล้วปรับข้อมูลในเครื่องตาม */
function startFirebaseSync() {
  if (!firebaseReady() || !fbSignedIn() || fbUnsub.length) return;
  const apply = fn => { fbApplying = true; try { fn(); } finally { fbApplying = false; } };
  const quiet = () => {};

  fbUnsub.push(fbDb.collection('staff').onSnapshot(snap => apply(() => {
    const list = snap.docs.map(d => Object.assign({ email: d.id }, d.data())).filter(s => s.active !== false);
    mergeCentralStaff(list); save(true); renderTop();
  }), quiet));

  FB_SHARED_DOCS.forEach(def => {
    fbUnsub.push(fbDb.collection('shared').doc(def.doc).onSnapshot(doc => apply(() => {
      const data = doc.exists ? fbDecodeNested(doc.data()[def.field]) : null;
      if (data == null) return;
      if (def.key === 'settings') DB.settings = Object.assign(defaultSettings(), DB.settings, data);
      else if (Array.isArray(data)) DB[def.key] = data;
      if (def.key === 'classes') resolveHomerooms();
      save(true); render();
    }), quiet));
  });

  fbUnsub.push(fbDb.collection('timetable').onSnapshot(snap => apply(() => {
    snap.docs.forEach(d => {
      const t = fbDecodeNested(d.data() || {});
      DB.timetable.entries = (DB.timetable.entries || []).filter(e => e.periodId !== d.id).concat(t.entries || []);
      DB.timetable.exceptions = (DB.timetable.exceptions || []).filter(e => e.periodId !== d.id).concat(t.exceptions || []);
      if (t.term) DB.timetable.terms[d.id] = t.term;
    });
    applyStoredTeacherIdMap();   // ตารางที่เครื่องอื่นส่งขึ้นอาจยังใช้รหัสครูเก่า
    save(true); render();
  }), quiet));

  fbUnsub.push(fbDb.collection('activities').onSnapshot(snap => apply(() => {
    DB.timetable.activities = snap.docs.map(d => Object.assign({}, fbDecodeNested(d.data()), { id: d.id }));
    applyStoredTeacherIdMap();
    save(true); render();
  }), quiet));

  [['leaves', 'leaveRequests'], ['swaps', 'exchangeRequests']].forEach(pair => {
    fbUnsub.push(fbDb.collection(pair[0]).onSnapshot(snap => apply(() => {
      DB.timetable[pair[1]] = snap.docs.map(d => Object.assign({}, fbDecodeNested(d.data()), { id: d.id })).filter(x => x.status !== 'deleted');
      applyStoredTeacherIdMap();
      save(true); render();
    }), quiet));
  });
}

function stopFirebaseSync() { fbUnsub.forEach(fn => { try { fn(); } catch (e) { } }); fbUnsub = []; }

/* ---------- สมุดคะแนนและการเช็กชื่อของครูแต่ละคน --------------------------
   เก็บแยกรายบุคคลใต้ books/{อีเมลของครู} ตามกฎความปลอดภัย เจ้าของเท่านั้นที่เข้าถึงได้
   เปิดใช้เองได้ที่หน้า สรุป/ส่งออก เพื่อให้ครูควบคุมข้อมูลของตัวเอง */
/* เปิดไว้เป็นค่าเริ่มต้น ครูกรอกคะแนนแล้วขึ้นเองโดยไม่ต้องกดอะไร
   ปิดได้ที่หน้าสรุป/ส่งออก ถ้าจงใจไม่อยากให้ขึ้นส่วนกลาง */
const bookSyncOn = () => !(DB.cloud && DB.cloud.syncBooks === false);
const myEmailForSync = () => String((curTeacher() || {}).email || DB.cloud.accountEmail || '').trim().toLowerCase();
const bookDocId = key => String(key).replace(/[^A-Za-z0-9_-]/g, '_');
function myBookRoot() {
  const email = myEmailForSync();
  if (!firebaseReady() || !fbSignedIn() || !email) return null;
  return fbDb.collection('books').doc(fbStaffId(email));
}

/** การเช็กชื่อของฉัน แยกเก็บเป็นรายเดือน กันเอกสารใหญ่เกินเพดานของ Firestore */
function myAttendanceByMonth() {
  const me = curTeacher() || {}, out = {};
  Object.keys(DB.timetable.attendance || {}).forEach(key => {
    const rec = DB.timetable.attendance[key];
    if (!rec || (rec.teacherId && rec.teacherId !== me.id)) return;
    const month = String(rec.date || '').slice(0, 7) || 'ไม่ระบุเดือน';
    (out[month] = out[month] || {})[key] = rec;
  });
  return out;
}

/** ลายเซ็นสั้น ๆ ของข้อมูลก้อนหนึ่ง ใช้เทียบว่าเปลี่ยนไปจากที่ส่งขึ้นครั้งก่อนไหม */
function quickSig(str) {
  let h = 5381;
  for (let i = 0; i < str.length; i++) h = (((h * 33) ^ str.charCodeAt(i)) >>> 0);
  return h.toString(36) + '.' + str.length;
}

/** ส่งสมุดคะแนนและการเช็กชื่อของฉันขึ้นส่วนกลาง
    onlyChanged = true จะส่งเฉพาะเล่ม/เดือนที่แก้ไปจริง ใช้กับการส่งอัตโนมัติ
    เพื่อไม่ให้ยิงเขียนทั้งหมดทุกครั้งที่พิมพ์คะแนนช่องเดียว */
async function pushMyBooks(onlyChanged) {
  const root = myBookRoot();
  if (!root) throw new Error('ต้องเข้าสู่ระบบด้วยบัญชีโรงเรียน และมีอีเมลในโปรไฟล์ครูก่อน');
  const stamp = new Date().toISOString(), jobs = [];
  const sigs = DB.cloud.syncSigs = DB.cloud.syncSigs || {}, fresh = {};
  Object.keys(DB.books || {}).forEach(key => {
    const sig = quickSig(JSON.stringify(DB.books[key])), id = 'b:' + key;
    fresh[id] = sig;
    if (onlyChanged && sigs[id] === sig) return;
    jobs.push(fbSetDoc(root.collection('items').doc(bookDocId(key)),
      { key: key, book: fbPlain(DB.books[key]), updatedAt: stamp }, 'สมุดคะแนน ' + key).then(() => { sigs[id] = sig; }));
  });
  const months = myAttendanceByMonth();
  Object.keys(months).forEach(month => {
    const sig = quickSig(JSON.stringify(months[month])), id = 'a:' + month;
    fresh[id] = sig;
    if (onlyChanged && sigs[id] === sig) return;
    jobs.push(fbSetDoc(root.collection('attendance').doc(month),
      { month: month, records: fbPlain(months[month]), updatedAt: stamp }, 'การเช็กชื่อเดือน ' + month).then(() => { sigs[id] = sig; }));
  });
  if (!onlyChanged || jobs.length)
    jobs.push(root.set({ email: myEmailForSync(), name: (curTeacher() || {}).name || '', updatedAt: stamp }, { merge: true }));
  if (!jobs.length) return 0;             // ไม่มีอะไรเปลี่ยน ไม่ต้องยิงเลย
  await Promise.all(jobs);
  // เล่มที่ถูกลบไปแล้ว ไม่ต้องเก็บลายเซ็นไว้ให้รก
  Object.keys(sigs).forEach(k => { if (fresh[k] === undefined) delete sigs[k]; });
  DB.cloud.lastBookSync = stamp; save(true);
  return jobs.length;
}

/** ยังมีอะไรที่แก้แล้วแต่ยังไม่ได้ส่งขึ้นไหม */
function unsyncedBookCount() {
  const sigs = (DB.cloud || {}).syncSigs || {};
  let n = 0;
  Object.keys(DB.books || {}).forEach(key => { if (sigs['b:' + key] !== quickSig(JSON.stringify(DB.books[key]))) n++; });
  const months = myAttendanceByMonth();
  Object.keys(months).forEach(m => { if (sigs['a:' + m] !== quickSig(JSON.stringify(months[m]))) n++; });
  return n;
}

async function pullMyBooks() {
  const root = myBookRoot();
  if (!root) throw new Error('ต้องเข้าสู่ระบบด้วยบัญชีโรงเรียนก่อน');
  const items = await root.collection('items').get({ source: 'server' });
  let books = 0, records = 0;
  items.docs.forEach(doc => {
    const data = doc.data() || {};
    if (data.key && data.book) { DB.books[data.key] = normalizeBook(fbDecodeNested(data.book)); books++; }
  });
  const months = await root.collection('attendance').get({ source: 'server' });
  months.docs.forEach(doc => {
    const recs = fbDecodeNested((doc.data() || {}).records || {});
    Object.keys(recs).forEach(k => { DB.timetable.attendance[k] = recs[k]; records++; });
  });
  DB.cloud.lastBookSync = new Date().toISOString();
  save(true); render();
  return books + records;
}

let bookSyncTimer = null, bookSyncBusy = false, bookSyncError = '';
/** ส่งขึ้นอัตโนมัติแบบหน่วงเวลา เพื่อไม่ให้ยิงทุกครั้งที่พิมพ์คะแนน */
function queueBookSync() {
  if (!bookSyncOn() || fbApplying || !myBookRoot()) return renderSyncChip();
  renderSyncChip();
  clearTimeout(bookSyncTimer);
  bookSyncTimer = setTimeout(runBookSync, 8000);
}

/** ส่งจริง — เรียกจากตัวจับเวลา หรือเรียกเองตอนจะปิดแอปและตอนกลับมาออนไลน์ */
function runBookSync() {
  if (bookSyncBusy || !bookSyncOn() || fbApplying || !myBookRoot()) return;
  if (!navigator.onLine) { renderSyncChip(); return; }
  clearTimeout(bookSyncTimer);
  bookSyncBusy = true; bookSyncError = ''; renderSyncChip();
  pushMyBooks(true)
    .catch(e => { bookSyncError = fbErrorMessage(e); })
    .then(() => { bookSyncBusy = false; renderSyncChip(); updateSyncFab(); });
}
/** ส่งทันทีโดยไม่รอครบเวลา ใช้ตอนครูสลับหน้าไปทำอย่างอื่นหรือปิดแอป */
function flushBookSync() { if (unsyncedBookCount()) runBookSync(); }

/** ป้ายเล็ก ๆ บนแถบบน บอกว่าที่กรอกไปขึ้นส่วนกลางแล้วหรือยัง */
function renderSyncChip() {
  const chip = $('#syncChip'); if (!chip) return;
  if (!bookSyncOn() || !myBookRoot()) { chip.hidden = true; return; }
  const n = unsyncedBookCount();
  const last = DB.cloud.lastBookSync ? new Date(DB.cloud.lastBookSync).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) : '';
  chip.hidden = false;
  chip.className = 'sync-chip' + (bookSyncBusy ? ' busy' : bookSyncError ? ' bad' : n ? ' wait' : ' ok');
  chip.textContent = bookSyncBusy ? 'กำลังส่งขึ้น...'
    : bookSyncError ? 'ส่งไม่ขึ้น'
    : !navigator.onLine && n ? 'รอเน็ต ' + n + ' รายการ'
    : n ? 'รอส่ง ' + n + ' รายการ'
    : last ? 'ซิงก์แล้ว ' + last : 'ซิงก์อัตโนมัติ';
  chip.title = bookSyncError ? 'ส่งขึ้นส่วนกลางไม่สำเร็จ: ' + bookSyncError
    : 'คะแนนและการเช็กชื่อส่งขึ้นส่วนกลางเองอัตโนมัติ' + (last ? ' • ล่าสุด ' + last : '') + ' • กดเพื่อส่งเดี๋ยวนี้';
}

// กลับมาออนไลน์แล้วส่งที่ค้างไว้ทันที และส่งก่อนสลับไปหน้าอื่นหรือปิดแอป
window.addEventListener('online', flushBookSync);
document.addEventListener('visibilitychange', () => { if (document.hidden) flushBookSync(); });

/** นับยอดข้อมูลที่อยู่บนส่วนกลาง เพื่อเทียบกับในเครื่องว่าตรงกันหรือยัง */
async function fetchCentralCounts() {
  if (!firebaseReady() || !fbSignedIn()) throw new Error('ต้องเข้าสู่ระบบด้วยบัญชีโรงเรียนก่อน จึงจะเทียบกับส่วนกลางได้');
  const fromServer = ref => ref.get({ source: 'server' });
  const out = { at: new Date().toISOString() };
  const staff = await fromServer(fbDb.collection('staff'));
  const activeDocs = staff.docs.filter(d => (d.data() || {}).active !== false);
  out.teachers = activeDocs.length;
  out.staffTotal = staff.size;
  out.staffInactive = staff.size - activeDocs.length;
  out.staffIds = staff.docs.map(d => d.id);          // เก็บไว้เทียบว่าใครยังไม่มีบนส่วนกลาง
  out.staffActiveIds = activeDocs.map(d => d.id);
  const readShared = async (doc, field) => {
    const d = await fromServer(fbDb.collection('shared').doc(doc));
    return d.exists ? fbDecodeNested(d.data()[field]) : null;
  };
  const cls = await readShared('classes', 'items');
  out.classes = Array.isArray(cls) ? cls.length : 0;
  out.students = Array.isArray(cls) ? cls.reduce((n, c) => n + ((c.students || []).length), 0) : 0;
  const subj = await readShared('subjects', 'items');
  out.subjects = Array.isArray(subj) ? subj.length : 0;
  const per = await readShared('periods', 'items');
  out.periods = Array.isArray(per) ? per.length : 0;
  out.entries = 0;
  if (DB.ui.periodId) {
    const tt = await fromServer(fbDb.collection('timetable').doc(DB.ui.periodId));
    if (tt.exists) out.entries = ((fbDecodeNested(tt.data()) || {}).entries || []).length;
  }
  DB.cloud.centralCounts = out; save(true);
  return out;
}

/** แยกให้เห็นว่ายอดครูที่ต่างกันมาจากอะไร และต้องแก้ตรงไหน */
function staffGapReport() {
  const cc = (DB.cloud || {}).centralCounts || null;
  const withEmail = DB.teachers.filter(t => String(t.email || '').trim());
  const noEmail = DB.teachers.filter(t => !String(t.email || '').trim());
  const dupes = staffEmailDuplicates();
  const onCentral = cc && cc.staffIds ? new Set(cc.staffIds) : null;
  const activeOnCentral = cc && cc.staffActiveIds ? new Set(cc.staffActiveIds) : null;
  const notPushed = onCentral ? withEmail.filter(t => !onCentral.has(fbStaffId(t.email))) : [];
  const inactive = activeOnCentral ? withEmail.filter(t => onCentral.has(fbStaffId(t.email)) && !activeOnCentral.has(fbStaffId(t.email))) : [];
  const localIds = new Set(withEmail.map(t => fbStaffId(t.email)));
  const extra = onCentral ? cc.staffIds.filter(id => !localIds.has(id)) : [];
  return { withEmail: withEmail, noEmail: noEmail, dupes: dupes, notPushed: notPushed,
    inactive: inactive, extra: extra, hasCentral: !!onCentral };
}

/** กล่องอธิบายว่าครูหายไปไหน พร้อมบอกว่าต้องกดปุ่มไหน */
function staffGapHtml() {
  const g = staffGapReport(); if (!g.hasCentral) return '';
  const names = list => list.slice(0, 8).map(t => esc(t.name || t.email || '(ไม่มีชื่อ)')).join(', ') +
    (list.length > 8 ? ' และอีก ' + (list.length - 8) + ' คน' : '');
  const rows = [];
  if (g.notPushed.length) rows.push({ n: g.notPushed.length, head: 'มีอีเมลแต่ยังไม่มีบนส่วนกลาง',
    detail: names(g.notPushed), fix: 'ผู้ดูแลระบบกด <b>อัปเดตขึ้นส่วนกลาง</b> หรือ <b>ส่งเฉพาะรายชื่อบุคลากร</b> ที่หน้าผู้ดูแลระบบ' });
  if (g.noEmail.length) rows.push({ n: g.noEmail.length, head: 'ยังไม่มีอีเมลในระบบ จึงส่งขึ้นไม่ได้',
    detail: names(g.noEmail), fix: 'กรอกอีเมลให้ครบที่ <b>ผู้ดูแลระบบ → ข้อมูลครูและสิทธิ์ใช้งาน</b> แล้วค่อยกดส่งขึ้น' });
  if (g.inactive.length) rows.push({ n: g.inactive.length, head: 'มีบนส่วนกลางแต่ถูกตั้งเป็นไม่ใช้งาน',
    detail: names(g.inactive), fix: 'ครูกลุ่มนี้เข้าสู่ระบบไม่ได้ ให้แก้สถานะแล้วส่งขึ้นใหม่' });
  if (g.dupes.length) rows.push({ n: g.dupes.length, head: 'อีเมลซ้ำกัน ข้อมูลจะทับกันบนส่วนกลาง',
    detail: esc(g.dupes.slice(0, 6).map(x => x.email).join(', ')), fix: 'แก้อีเมลให้ไม่ซ้ำก่อนส่งขึ้น' });
  if (g.extra.length) rows.push({ n: g.extra.length, head: 'มีบนส่วนกลางแต่ไม่มีในเครื่องนี้',
    detail: esc(g.extra.slice(0, 8).join(', ')), fix: 'เครื่องนี้มีรายชื่อเก่ากว่า กด <b>ดึงฐานข้อมูลจากส่วนกลาง</b>' });
  if (!rows.length) return '';
  return '<details class="exec-more" open><summary>ทำไมยอดครูไม่ตรง และต้องทำอะไร</summary>' +
    '<div class="gap-list">' + rows.map(r => '<div class="gap-item"><div class="gap-n">' + r.n + '</div>' +
      '<div><b>' + r.head + '</b><div class="hint">' + r.detail + '</div>' +
      '<div class="gap-fix">วิธีแก้: ' + r.fix + '</div></div></div>').join('') + '</div></details>';
}

  { key: 'students', label: 'นักเรียน' }, { key: 'subjects', label: 'รายวิชา' },
  { key: 'periods', label: 'ปี/ภาคเรียน' }, { key: 'entries', label: 'คาบสอนภาคนี้' }
];

/** การ์ดบอกว่าเครื่องนี้มีข้อมูลโรงเรียนครบไหม พร้อมปุ่มดึงลงมาใหม่ */

  const d = schoolDataSummary(), missing = schoolDataMissing();
  const last = (DB.cloud || {}).lastSchoolPull ? new Date(DB.cloud.lastSchoolPull).toLocaleString('th-TH') : '';
  const ready = firebaseReady() && fbSignedIn();
  const cc = (DB.cloud || {}).centralCounts || null;
  const ccAt = cc && cc.at ? new Date(cc.at).toLocaleString('th-TH') : '';

  const inSync = !!cc && SCHOOL_COUNT_ROWS.every(r => d[r.key] === cc[r.key]);
  return '<div class="card" id="schoolDataCard"><div class="exec-head row"><div><div class="exec-eyebrow">SCHOOL DATA</div>' +
    '<h3>ข้อมูลโรงเรียนในเครื่องนี้</h3></div><div class="spacer"></div>' +
    '<span class="badge ' + (inSync ? 'ok' : missing ? 'bad' : 'warn') + '">' +

    '<button id="btnCompareSchool"' + (ready ? '' : ' disabled') + '>เทียบกับส่วนกลาง</button>' +
    '<button class="primary" id="btnPullSchool"' + (ready ? '' : ' disabled') + '>ดึงฐานข้อมูลจากส่วนกลาง</button></div>' +
    (missing && inSync ? '<div class="notice bad">เครื่องนี้ตรงกับส่วนกลางแล้ว แต่<b>ส่วนกลางเองยังไม่มีข้อมูลครบ</b><br>' +
      'ให้ผู้ดูแลระบบกด <b>อัปเดตขึ้นส่วนกลาง</b> ที่หน้าผู้ดูแลระบบก่อน แล้วค่อยกดดึงลงมาใหม่</div>'
      : missing ? '<div class="notice bad">เครื่องนี้ยังไม่มีข้อมูลหลักของโรงเรียน จึงเลือกห้อง วิชา หรือดูตารางสอนไม่ได้<br>' +
      'กดปุ่ม <b>ดึงฐานข้อมูลจากส่วนกลาง</b> เพื่อโหลดลงมา ทำได้เองไม่ต้องรอผู้ดูแลระบบ</div>' : '') +
    (!ready ? '<div class="notice">ยังไม่ได้เข้าสู่ระบบด้วยบัญชีโรงเรียน จึงดึงข้อมูลไม่ได้</div>' : '') +
    '<div class="tablewrap"><table><thead><tr><th>ชุดข้อมูล</th><th class="numcell">ในเครื่องนี้</th>' +
      '<th class="numcell">บนส่วนกลาง</th><th>ผลเทียบ</th></tr></thead><tbody>' +
      SCHOOL_COUNT_ROWS.map(r => {
        const mine = d[r.key], their = cc ? cc[r.key] : null, known = cc && their !== undefined && their !== null;
        const same = known && mine === their, diff = known ? their - mine : 0;
        const note = r.key === 'teachers' && cc
          ? '<div class="hint">มีอีเมล ' + DB.teachers.filter(t => String(t.email || '').trim()).length +
            ' • ไม่มีอีเมล ' + DB.teachers.filter(t => !String(t.email || '').trim()).length +
            (cc.staffInactive ? ' | ส่วนกลางปิดใช้งาน ' + cc.staffInactive : '') + '</div>' : '';
        return '<tr><td><b>' + esc(r.label) + '</b>' + note + '</td><td class="numcell">' + mine + '</td>' +

      }).join('') + '</tbody></table></div>' +
    (cc && SCHOOL_COUNT_ROWS.some(r => d[r.key] !== cc[r.key])
      ? staffGapHtml() +
        (SCHOOL_COUNT_ROWS.filter(r => r.key !== 'teachers').some(r => d[r.key] !== cc[r.key])

    ' • คะแนนและการเช็กชื่อของคุณจะไม่ถูกแตะต้อง</div><div id="pullSchoolResult"></div></div>';
}

/** ผูกปุ่มดึงข้อมูล ใช้ได้ทั้งการ์ดในหน้าภาพรวมและปุ่มในเมนู */
function bindPullSchoolButton(root) {
  const cmp = $('#btnCompareSchool', root);
  if (cmp) cmp.addEventListener('click', async () => {
    cmp.disabled = true; const old = cmp.textContent; cmp.textContent = 'กำลังเทียบ...';
    try {
      const c = await fetchCentralCounts();
      const mine = schoolDataSummary();
      const diff = SCHOOL_COUNT_ROWS.filter(r => mine[r.key] !== c[r.key]);
      render();
      toast(diff.length ? 'ยอดไม่ตรงกัน ' + diff.length + ' ชุด • ' + diff.map(x => x.label).join(', ') : 'ยอดตรงกับส่วนกลางทุกชุด',
        diff.length ? 'bad' : 'ok');
    } catch (e) {
      toast(fbErrorMessage(e), 'bad');
      const b = $('#btnCompareSchool'); if (b) { b.disabled = false; b.textContent = old; }
    }
  });
  const btn = $('#btnPullSchool', root); if (!btn) return;
  btn.addEventListener('click', async () => {
    if (!await confirmBox('ดึงฐานข้อมูลจากส่วนกลาง',
      '<div class="exec-note">โหลดรายชื่อครู ห้องเรียน รายวิชา ปี/ภาคเรียน ตารางสอน ใบลา และคำขอแลกคาบ ' +
      'จากส่วนกลางมาทับข้อมูลหลักในเครื่องนี้<br><b>คะแนนและการเช็กชื่อของคุณไม่ถูกแตะต้อง</b></div>', 'ดึงลงมา')) return;
    const out = $('#pullSchoolResult');
    btn.disabled = true; const old = btn.textContent; btn.textContent = 'กำลังดึง...';
    if (out) out.innerHTML = '<div class="hint" style="margin-top:8px">กำลังดึงข้อมูลจากส่วนกลาง...</div>';
    try {
      const r = await pullSchoolData();
      toast('ดึงข้อมูลลงเครื่องแล้ว • ห้อง ' + r.summary.classes + ' • วิชา ' + r.summary.subjects + ' • คาบ ' + r.summary.entries, 'ok');
      const box = $('#pullSchoolResult');
      if (box) box.innerHTML = '<div class="exec-sum" style="margin-top:10px">' + r.got.map(x => '<span>' + esc(x) + '</span>').join('') + '</div>' +
        (r.failed.length ? '<div class="notice bad" style="margin-top:8px">ดึงไม่ได้ ' + r.failed.length + ' รายการ<br>' +
          r.failed.map(esc).join('<br>') + '</div>' : '');
    } catch (e) {
      toast(fbErrorMessage(e), 'bad');
      const box = $('#pullSchoolResult');
      if (box) box.innerHTML = '<div class="notice bad" style="margin-top:8px">' + esc(fbErrorMessage(e)) + '</div>';
    }
    const b2 = $('#btnPullSchool'); if (b2) { b2.disabled = false; b2.textContent = old; }
  });
}

/* ---------- ดึงฐานข้อมูลโรงเรียนลงเครื่องนี้ --------------------------------
   ปกติข้อมูลกลางไหลลงมาเองผ่านตัวฟังแบบเรียลไทม์ แต่ถ้าตัวฟังไม่ทำงาน
   เช่นเข้าระบบคนละทาง กฎยังไม่อนุญาต หรือเน็ตหลุดตอนเข้าครั้งแรก
   ครูจะเปิดมาแล้วไม่มีห้อง ไม่มีวิชา ไม่มีตารางสอน และแก้เองไม่ได้เลย
   ปุ่มนี้ดึงลงมาตรง ๆ จากเซิร์ฟเวอร์ ไม่เอาจากแคช และบอกว่าได้อะไรมาบ้าง */
function schoolDataSummary() {
  const pid = DB.ui.periodId;
  return {
    teachers: (DB.teachers || []).length,
    classes: (DB.classes || []).length,
    students: (DB.classes || []).reduce((n, c) => n + ((c.students || []).length), 0),
    subjects: (DB.subjects || []).length,
    periods: (DB.periods || []).length,
    entries: (DB.timetable.entries || []).filter(e => !pid || e.periodId === pid).length
  };
}
const schoolDataMissing = () => { const s2 = schoolDataSummary(); return !s2.classes || !s2.subjects || !s2.entries; };

async function pullSchoolData() {
  if (!firebaseReady() || !fbSignedIn()) throw new Error('ต้องเข้าสู่ระบบด้วยบัญชีโรงเรียนก่อน จึงจะดึงข้อมูลลงเครื่องได้');
  const fromServer = ref => ref.get({ source: 'server' });
  const got = [], failed = [];
  const step = async (label, fn) => { try { got.push(label + ' ' + (await fn())); } catch (e) { failed.push(label + ': ' + fbErrorMessage(e)); } };
  fbApplying = true;                       // กันไม่ให้ตัวส่งอัตโนมัติทำงานระหว่างเขียนทับ
  try {
    await step('บุคลากร', async () => {
      const snap = await fromServer(fbDb.collection('staff'));
      const list = snap.docs.map(d => Object.assign({ email: d.id }, fbDecodeNested(d.data()))).filter(x => x.active !== false);
      mergeCentralStaff(list);
      return list.length + ' คน';
    });
    for (const def of FB_SHARED_DOCS) {
      await step(def.key === 'classes' ? 'ห้องเรียน' : def.key === 'subjects' ? 'รายวิชา' : def.key === 'periods' ? 'ปี/ภาคเรียน' : 'ตั้งค่าโรงเรียน', async () => {
        const doc = await fromServer(fbDb.collection('shared').doc(def.doc));
        if (!doc.exists) return 'ยังไม่มีบนส่วนกลาง';
        const data = fbDecodeNested(doc.data()[def.field]);
        if (data == null) return 'ไม่มีข้อมูล';
        if (def.key === 'settings') { DB.settings = Object.assign(defaultSettings(), DB.settings, data); return 'อัปเดตแล้ว'; }
        if (Array.isArray(data)) { DB[def.key] = data; return data.length + ' รายการ'; }
        return 'อัปเดตแล้ว';
      });
    }
    resolveHomerooms();
    await step('ตารางสอน', async () => {
      const snap = await fromServer(fbDb.collection('timetable'));
      let periods = 0, slots = 0;
      snap.docs.forEach(d => {
        const t = fbDecodeNested(d.data() || {});
        DB.timetable.entries = (DB.timetable.entries || []).filter(e => e.periodId !== d.id).concat(t.entries || []);
        DB.timetable.exceptions = (DB.timetable.exceptions || []).filter(e => e.periodId !== d.id).concat(t.exceptions || []);
        if (t.term) DB.timetable.terms[d.id] = t.term;
        periods++; slots += (t.entries || []).length;
      });
      return periods + ' ปี/ภาค • ' + slots + ' คาบ';
    });
    for (const pair of [['leaves', 'leaveRequests', 'ใบลา'], ['swaps', 'exchangeRequests', 'คำขอแลกคาบ'], ['activities', 'activities', 'กิจกรรม']]) {
      await step(pair[2], async () => {
        const snap = await fromServer(fbDb.collection(pair[0]));
        DB.timetable[pair[1]] = snap.docs.map(d => Object.assign({}, fbDecodeNested(d.data()), { id: d.id })).filter(x => x.status !== 'deleted');
        return snap.size + ' รายการ';
      });
    }
    applyStoredTeacherIdMap();             // ข้อมูลที่ดึงมาอาจยังใช้รหัสครูแบบเก่า
    normalizeTeacherIds();
    DB.cloud.lastSchoolPull = new Date().toISOString();
    // เพิ่งดึงมาครบ ยอดทั้งสองฝั่งย่อมเท่ากัน บันทึกไว้เลยจะได้ไม่ต้องอ่านซ้ำ
    if (!failed.length) DB.cloud.centralCounts = Object.assign({ at: DB.cloud.lastSchoolPull }, schoolDataSummary());
  } finally { fbApplying = false; }
  save(true); render();
  return { got: got, failed: failed, summary: schoolDataSummary() };
}

/** อ่านข้อมูลจากเซิร์ฟเวอร์ตรง ๆ (ไม่เอาจากแคชในเครื่อง) เพื่อดูว่าส่งขึ้นไปถึงจริงหรือยัง */
async function inspectFirebase() {

  const staff = await fromServer(fbDb.collection('staff'));

  }
  const tt = await fromServer(fbDb.collection('timetable'));
  rows.push(['ตารางสอน (timetable)', tt.size ? tt.size + ' ปี/ภาค • ' + tt.docs.reduce((n, d) => n + ((d.data().entries || []).length), 0) + ' คาบ' : 'ยังไม่มีบนส่วนกลาง']);
  for (const name of ['leaves', 'swaps', 'activities']) {
    const snap = await fromServer(fbDb.collection(name));
    rows.push([name === 'leaves' ? 'ใบลา (leaves)' : name === 'swaps' ? 'คำขอแลกคาบ (swaps)' : 'กิจกรรม (activities)', snap.size + ' รายการ']);

/** ส่งข้อมูลขึ้นส่วนกลาง — ใช้ตอนตั้งระบบครั้งแรก หรือเมื่อผู้ดูแลระบบแก้ข้อมูลหลัก */
/* ส่งทีละชุดและรายงานผลรายชุด — เดิมใช้ Promise.all ชุดเดียวที่ล้ม
   จะทำให้ทั้งการส่งขึ้นเป็น "ไม่สำเร็จ" ทั้งที่ชุดอื่นขึ้นไปแล้ว
   ผู้ดูแลระบบจึงไม่รู้ว่าจริง ๆ ติดที่ชุดไหน */
async function pushToFirebase(what) {
  if (!firebaseReady() || !fbSignedIn()) throw new Error('ยังไม่ได้เข้าสู่ระบบด้วยบัญชีโรงเรียน');
  const jobs = [];
  const add = (label, p) => jobs.push({ label: label, p: p });
  if (!what || what === 'staff') {
    const list = DB.teachers.filter(t => t.email);
    if (!list.length) throw new Error('ครูทุกคนต้องมีอีเมลก่อนจึงจะส่งขึ้นส่วนกลางได้');
    let batch = fbDb.batch(), n = 0, part = 1;
    list.forEach(t => {
      batch.set(fbDb.collection('staff').doc(fbStaffId(t.email)), fbPlain(fbTeacherDoc(t)), { merge: true });
      if (++n % 400 === 0) { add('รายชื่อบุคลากร ชุดที่ ' + part++, batch.commit()); batch = fbDb.batch(); }
    });
    add('รายชื่อบุคลากร ชุดที่ ' + part, batch.commit());
  }
  if (!what || what === 'shared') {
    add('ห้องเรียนและรายชื่อนักเรียน', fbSetDoc(fbDb.collection('shared').doc('classes'), { items: fbPlain(DB.classes) }, 'ห้องเรียน'));
    add('รายวิชา', fbSetDoc(fbDb.collection('shared').doc('subjects'), { items: fbPlain(DB.subjects) }, 'รายวิชา'));
    add('ปี/ภาคเรียน', fbSetDoc(fbDb.collection('shared').doc('periods'), { items: fbPlain(DB.periods) }, 'ปี/ภาคเรียน'));
    add('ตั้งค่าโรงเรียน', fbSetDoc(fbDb.collection('shared').doc('settings'), { value: fbPlain(DB.settings) }, 'ตั้งค่าโรงเรียน'));
  }
  if (!what || what === 'timetable') {
    DB.periods.forEach(p => add('ตารางสอน ปี ' + p.academicYear + ' ภาค ' + p.semester,
      fbSetDoc(fbDb.collection('timetable').doc(p.id), fbPlain({
        entries: (DB.timetable.entries || []).filter(e => e.periodId === p.id),
        exceptions: (DB.timetable.exceptions || []).filter(e => e.periodId === p.id),
        term: (DB.timetable.terms || {})[p.id] || null
      }), 'ตารางสอนปี ' + p.academicYear + '/' + p.semester)));
  }
  if (!what || what === 'requests') {
    (DB.timetable.leaveRequests || []).forEach(l => add('ใบลา ' + l.id, fbDb.collection('leaves').doc(l.id).set(fbPlain(l))));
    (DB.timetable.exchangeRequests || []).forEach(r => add('คำขอแลกคาบ ' + r.id, fbDb.collection('swaps').doc(r.id).set(fbPlain(r))));
    (DB.timetable.activities || []).forEach(a => add('กิจกรรม ' + a.id, fbDb.collection('activities').doc(a.id).set(fbPlain(a))));
  }
  const settled = await Promise.allSettled(jobs.map(j => j.p));
  const failed = [];
  settled.forEach((r, i) => { if (r.status === 'rejected') failed.push({ label: jobs[i].label, msg: fbErrorMessage(r.reason) }); });
  return { sent: jobs.length - failed.length, failed: failed };
}

/** Firestore จำกัดขนาดเอกสารละ 1 MiB — ตรวจก่อนส่งเพื่อบอกได้ว่าชุดไหนใหญ่เกิน */
function fbSetDoc(ref, data, label) {
  // กันพลาดซ้ำ: ถ้ามีอาร์เรย์ซ้อนหลุดมาถึงตรงนี้ แปลว่าลืมเรียก fbPlain
  data = fbEncodeNested(data);
  const size = new Blob([JSON.stringify(data)]).size;
  if (size > 1000000) return Promise.reject(new Error('ข้อมูล “' + label + '” ใหญ่เกินที่ Firestore รับได้ (' +
    Math.round(size / 1024) + ' KB จากเพดาน 1024 KB) — ลดรูปตราโรงเรียนหรือแยกข้อมูลก่อนส่ง'));
  return ref.set(data);
}

/* Firestore ไม่รับ "อาร์เรย์ซ้อนอาร์เรย์" เลย เช่นเกณฑ์ตัดเกรดที่เก็บเป็น
   [[80,'4'],[75,'3.5']] ทำให้การส่งสมุดคะแนนและรูปแบบหัวข้อคะแนนล้มทั้งก้อน
   ด้วยข้อความ "Nested arrays are not supported"
   แก้โดยห่ออาร์เรย์ชั้นในไว้ในอ็อบเจกต์ตอนส่ง แล้วแกะกลับตอนอ่าน
   ทำที่จุดเดียวนี้ ทุกที่ที่เรียก fbPlain จึงปลอดภัยพร้อมกันหมด */
function fbEncodeNested(v) {
  if (Array.isArray(v)) return v.map(x => Array.isArray(x) ? { __arr: fbEncodeNested(x) } : fbEncodeNested(x));
  if (v && typeof v === 'object') { const o = {}; Object.keys(v).forEach(k => { o[k] = fbEncodeNested(v[k]); }); return o; }
  return v;
}
function fbDecodeNested(v) {
  if (Array.isArray(v)) return v.map(fbDecodeNested);
  if (v && typeof v === 'object') {
    if (Array.isArray(v.__arr)) return fbDecodeNested(v.__arr);
    const o = {}; Object.keys(v).forEach(k => { o[k] = fbDecodeNested(v[k]); }); return o;
  }
  return v;
}
/** คัดลอกข้อมูลไว้ใช้ในเครื่อง — คงรูปแบบเดิมทุกอย่าง ห้ามใช้ตอนส่งขึ้นส่วนกลาง */
function deepCopy(obj) { return JSON.parse(JSON.stringify(obj)); }
/** Firestore รับเฉพาะข้อมูลธรรมดา จึงตัด undefined อ็อบเจกต์แปลก ๆ และอาร์เรย์ซ้อนออกก่อน */
function fbPlain(obj) { return fbEncodeNested(JSON.parse(JSON.stringify(obj))); }

/** ส่งกิจกรรมนักเรียนขึ้นส่วนกลาง เพื่อให้ครูเจ้าของคาบเห็นด้วย */

/** ปรับสีให้อ่อนลง (amt > 0) หรือเข้มขึ้น (amt < 0) สำหรับไล่เฉดในกลีบ */
function shadeHex(hex, amt) {
  const n = parseInt(hex.slice(1), 16), ch = [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  return '#' + ch.map(v => Math.max(0, Math.min(255, Math.round(v + (amt > 0 ? (255 - v) * amt : v * amt))))
    .toString(16).padStart(2, '0')).join('');
}

function roleWheelHtml() {
  const C = 250, R_OUT = 234, R_IN = 118, STEP = 360 / GATEWAY_ROLES.length;
  const BOW = 34;            // องศาที่เส้นแบ่งโค้งไปด้านข้าง ทำให้กลีบเป็นทรงกังหัน
  const n = v => Math.round(v * 100) / 100;
  const polar = (r, deg) => { const a = (deg - 90) * Math.PI / 180; return [C + r * Math.cos(a), C + r * Math.sin(a)]; };
  const pt = (r, deg) => { const [x, y] = polar(r, deg); return n(x) + ' ' + n(y); };
  const thick = R_OUT - R_IN;
  // เส้นแบ่งระหว่างกลีบ ใช้เส้นโค้งชุดเดียวกันทั้งสองข้างเพื่อให้กลีบประกบกันพอดี
  const dividerOut = a => 'C' + pt(R_IN + thick * 0.34, a - BOW * 0.62) + ' ' + pt(R_OUT - thick * 0.30, a - BOW * 0.30) + ' ' + pt(R_OUT, a);
  const dividerIn = a => 'C' + pt(R_OUT - thick * 0.30, a - BOW * 0.30) + ' ' + pt(R_IN + thick * 0.34, a - BOW * 0.62) + ' ' + pt(R_IN, a);
  const petal = (a0, a1) => 'M' + pt(R_IN, a0) + dividerOut(a0) +
    'A' + R_OUT + ' ' + R_OUT + ' 0 0 1 ' + pt(R_OUT, a1) + dividerIn(a1) +
    'A' + R_IN + ' ' + R_IN + ' 0 0 0 ' + pt(R_IN, a0) + 'Z';

  const defs = GATEWAY_ROLES.map((r, i) => '<linearGradient id="wgrad' + i + '" x1="0" y1="0" x2="0.85" y2="1">' +
    '<stop offset="0" stop-color="' + shadeHex(r.color, 0.42) + '"></stop>' +
    '<stop offset="1" stop-color="' + shadeHex(r.color, -0.16) + '"></stop></linearGradient>').join('');

  const petals = GATEWAY_ROLES.map((r, i) => {
    const a0 = i * STEP, a1 = (i + 1) * STEP, mid = a0 + STEP / 2 - BOW * 0.34;
    const [ix, iy] = polar((R_OUT + R_IN) / 2, mid), s = 2.75;
    return '<g class="wheel-seg" data-gateway-role="' + r.role + '" role="button" tabindex="0" aria-label="' + esc(r.label) + '" style="--seg:' + r.color + '">' +
      '<title>' + esc(r.label) + '</title>' +
      '<path class="wheel-fill" fill="url(#wgrad' + i + ')" d="' + petal(a0, a1) + '"></path>' +
      '<g transform="translate(' + n(ix) + ' ' + n(iy) + ')">' +
      '<g class="wheel-icon"><g transform="scale(' + s + ') translate(-12 -12)"><path fill-rule="evenodd" d="' + r.icon + '"></path></g></g>' +
      '</g></g>';
  }).join('');

  return '<div class="role-wheel"><svg viewBox="0 0 500 500" role="group" aria-label="เลือกบทบาทเพื่อเข้าสู่ระบบ">' +
    '<defs>' + defs +
      '<radialGradient id="wheelHubFill" cx="0.5" cy="0.42" r="0.62">' +
      '<stop offset="0" stop-color="var(--panel)"></stop><stop offset="1" stop-color="var(--panel2)"></stop></radialGradient>' +
      '<filter id="wheelShadow" x="-20%" y="-20%" width="140%" height="140%">' +
      '<feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#0f2341" flood-opacity="0.16"></feDropShadow></filter>' +
    '</defs>' +
    '<g class="wheel-rotor" filter="url(#wheelShadow)">' + petals + '</g>' +
    '<circle class="wheel-hub" cx="250" cy="250" r="' + (R_IN - 8) + '"></circle></svg>' +
    '<div class="wheel-center"><div class="wheel-name" id="wheelName"></div></div></div>';
}

async function passwordDigest(value) {
  const text = String(value || '');
  if (window.crypto && crypto.subtle) {
    const bytes = new TextEncoder().encode(text), digest = await crypto.subtle.digest('SHA-256', bytes);
    return 'sha256:' + Array.from(new Uint8Array(digest)).map(x => x.toString(16).padStart(2, '0')).join('');
  }
  let hash = 2166136261;
  for (let i = 0; i < text.length; i++) { hash ^= text.charCodeAt(i); hash = Math.imul(hash, 16777619); }
  return 'local:' + (hash >>> 0).toString(16);
}

function studentMatches(sid) {
  const out = [];
  DB.classes.forEach(cls => {
    const st = (cls.students || []).find(x => String(x.sid || '').trim() === sid);
    if (st) out.push({ cls: cls, st: st });
  });
  return out;
}

function studentSubjectContexts(sid, periodId) {
  const contexts = [];
  studentMatches(sid).forEach(hit => {
    const ids = new Set();
    Object.keys(DB.books).forEach(key => {
      const parts = key.split('::');
      if (parts[0] === hit.cls.id && parts[2] === periodId) ids.add(parts[1]);
    });
    DB.timetable.entries.concat(DB.timetable.exceptions || []).forEach(e => {
      if (e.periodId === periodId && e.classId === hit.cls.id) ids.add(e.subjectId);
    });
    ids.forEach(subjectId => {
      const subject = DB.subjects.find(s => s.id === subjectId); if (!subject) return;
      const key = hit.cls.id + '::' + subjectId + '::' + periodId;
      const book = DB.books[key] ? normalizeBook(DB.books[key]) : defaultBook();
      contexts.push({ cls: hit.cls, st: hit.st, subject: subject, book: book, score: calcRow(book, hit.st), attendance: attendanceStudentResult(hit.cls.id, subjectId, hit.st, periodId) });
    });
  });
  return contexts.sort((a, b) => (a.subject.code || '').localeCompare(b.subject.code || '', 'th') || a.subject.name.localeCompare(b.subject.name, 'th'));
}
