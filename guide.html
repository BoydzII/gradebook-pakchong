<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>วิธีใช้ KruSpace สำหรับครู</title>
<meta name="description" content="แนะนำการใช้งาน KruSpace ในโหมดครูแบบภาพเคลื่อนไหว: เข้าสู่ระบบ ภาพรวม เช็กชื่อ คะแนนและ ปพ.5 แลกคาบและการลา">
<link rel="icon" href="./icons/icon-192.png">
<style>
/* ฟอนต์เดียวกับแอป เก็บในโฟลเดอร์ vendor/fonts จึงเปิดได้แม้ออฟไลน์ */
@font-face{font-family:'Sarabun';font-weight:400;font-display:swap;src:url('./vendor/fonts/sarabun-thai-400.woff2') format('woff2');unicode-range:U+0E01-0E5B,U+200C-200D,U+25CC}
@font-face{font-family:'Sarabun';font-weight:400;font-display:swap;src:url('./vendor/fonts/sarabun-latin-400.woff2') format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+2190-21FF}
@font-face{font-family:'Sarabun';font-weight:700;font-display:swap;src:url('./vendor/fonts/sarabun-thai-700.woff2') format('woff2');unicode-range:U+0E01-0E5B,U+200C-200D,U+25CC}
@font-face{font-family:'Sarabun';font-weight:700;font-display:swap;src:url('./vendor/fonts/sarabun-latin-700.woff2') format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+2190-21FF}
@font-face{font-family:'Sarabun';font-weight:800;font-display:swap;src:url('./vendor/fonts/sarabun-thai-800.woff2') format('woff2');unicode-range:U+0E01-0E5B,U+200C-200D,U+25CC}
@font-face{font-family:'Sarabun';font-weight:800;font-display:swap;src:url('./vendor/fonts/sarabun-latin-800.woff2') format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+2190-21FF}

/* หน้าห่อ: สุดขั้วเรื่องเดียวคือ "จอจำลอง" ตรงกลาง ทุกอย่างรอบ ๆ เงียบ ใช้สีน้ำเงินของแอปเป็นสีเน้นสีเดียว */
:root{--page:#eef2f8;--ink:#142033;--mute:#5d6b80;--line:#d7dfeb;--brand:#1f6feb;--brand2:#6b4fd3;
  --ok:#0f8a53;--ok-bg:#e6f6ee;--bad:#c62828;--bad-bg:#fdecec;--warn:#a05a00;--warn-bg:#fff5e2;--group:#6b3fd4;--group-bg:#f1ecfd;
  --panel:#fff;--panel2:#f7f9fc;--hero:linear-gradient(135deg,#0f5fbb 0%,#1f6feb 52%,#6b4fd3 100%);
  --att-present:#12a05c;--att-late:#c98a00;--att-leave:#4f6bd8;--att-activity:#0d94ad;--att-absent:#d43b3b}
*{box-sizing:border-box;margin:0}
html,body{background:var(--page);color:var(--ink);font-family:'Sarabun',system-ui,sans-serif;font-weight:400}
body{min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:clamp(14px,3vw,36px) clamp(10px,3vw,32px) max(24px,env(safe-area-inset-bottom))}
.head{width:min(1180px,100%);display:flex;align-items:flex-end;gap:16px;margin-bottom:14px}
.head img{width:44px;height:44px;object-fit:contain}
.head h1{font-size:clamp(22px,3.2vw,36px);font-weight:800;line-height:1.2;text-wrap:balance}
.head p{color:var(--mute);font-size:14px;line-height:1.6}
.head a{margin-left:auto;white-space:nowrap;color:var(--brand);font-weight:700;text-decoration:none;font-size:14px;align-self:center}
/* สลับโหมดครู/ผู้บริหาร — ลิงก์ธรรมดา (?mode=exec) ส่งต่อให้คนอื่นได้ตรงโหมด */
.modes{display:inline-flex;border:1px solid var(--line);border-radius:99px;padding:3px;background:var(--panel);align-self:center}
.modes a{margin:0;padding:6px 14px;border-radius:99px;color:var(--mute);font-weight:700;font-size:13.5px;text-decoration:none}
.modes a.on{background:var(--brand);color:#fff}

/* บท: ชิป 4 บท */
.chapters{width:min(1180px,100%);display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.chapters button{font:inherit;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:9px 12px;cursor:pointer;color:var(--ink);position:relative;overflow:hidden}
.chapters button b{display:block;font-size:14.5px;font-weight:700;line-height:1.35}
.chapters button span{font-size:12px;color:var(--mute)}
.chapters button i{position:absolute;left:0;bottom:0;height:3px;background:var(--brand);width:0}
.chapters button.on{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
@media (max-width:640px){.chapters{grid-template-columns:1fr 1fr}.chapters button span{display:none}}

/* จอจำลอง: ออกแบบที่ 1280×720 แล้วย่อทั้งก้อนตามความกว้างจอ (ตัวอักษรข้างในย่อตาม ไม่ตัดบรรทัดใหม่) */
.frame{width:min(1180px,100%);border-radius:18px;overflow:hidden;background:#0d1320;box-shadow:0 20px 50px rgba(16,30,54,.18);position:relative}
.frame-in{position:relative;width:100%}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;background:#f4f6fa;font-size:15px;line-height:1.5}
.caption{width:min(1180px,100%);min-height:92px;padding:14px 4px 6px;display:flex;gap:14px;align-items:flex-start}
.caption .step{flex:none;font-size:12px;font-weight:700;color:#fff;background:var(--brand);border-radius:999px;padding:3px 10px;margin-top:4px;white-space:nowrap}
.caption p{font-size:clamp(16px,2vw,21px);line-height:1.7;font-weight:400;text-wrap:pretty;transition:opacity .25s}
.caption p b{font-weight:700;color:var(--brand)}
.caption p.fade{opacity:0}
.controls{width:min(1180px,100%);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.controls button{font:inherit;border:1px solid var(--line);background:var(--panel);border-radius:10px;min-width:44px;min-height:40px;padding:0 12px;cursor:pointer;color:var(--ink);font-weight:700}
.controls button.primary{background:var(--brand);border-color:var(--brand);color:#fff}
#bVoice.on{background:var(--ok-bg);border-color:#bde5cd;color:var(--ok)}
#bVoice.blocked{animation:pulse 1.4s ease-in-out infinite;border-color:var(--brand);color:var(--brand)}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(31,111,235,.18)}}
.voice-note{width:min(1180px,100%);font-size:13px;color:var(--warn);margin-top:6px}
.bar{flex:1;min-width:140px;height:8px;border-radius:99px;background:#dbe3ef;position:relative;cursor:pointer}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--brand);width:0}
.bar s{position:absolute;top:-3px;bottom:-3px;width:2px;background:#fff;text-decoration:none}
.controls .count{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
.kbd-hint{width:min(1180px,100%);font-size:12.5px;color:var(--mute);margin-top:8px}
@media (hover:none){.kbd-hint{display:none}}
/* มือถือ: หัวหน้าเรียงแนวเดียวกับตรา ซ่อนคำโปรย • แถบความคืบหน้าลงไปเต็มบรรทัดล่างปุ่ม
   จอจำลองย่อจาก 1280px จึงเล็กมากบนมือถือแนวตั้ง แนะนำให้หมุนจอ */
.rotate{display:none;width:min(1180px,100%);font-size:13px;color:var(--mute);margin-top:8px;text-align:center}
@media (max-width:640px){
  .modes{order:4}
  .head{align-items:center;flex-wrap:wrap;gap:10px}
  .head img{width:38px;height:38px}
  .head p{display:none}
  .head a{margin-left:0;flex-basis:100%;order:3}
  .controls .bar{order:9;flex-basis:100%}
  .controls .count{margin-left:auto}
}
@media (max-width:640px) and (orientation:portrait){.rotate{display:block}}

/* ======================= หน้าจอแอปจำลอง (ขนาดจริง 1280×720) ======================= */
.scr{position:absolute;inset:0}
.app-top{height:62px;background:#fff;border-bottom:1px solid #dde3ec;display:flex;align-items:center;gap:14px;padding:0 20px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px}
.brand i{width:32px;height:32px;border-radius:10px;background:var(--brand);display:grid;place-items:center;color:#fff;font-style:normal;font-size:17px}
.brand small{display:block;font-size:11px;color:var(--mute);font-weight:400;line-height:1.1}
.pick{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute)}
.sel{border:1px solid #dde3ec;border-radius:9px;padding:6px 12px;color:var(--ink);background:#fff;font-size:14px;min-width:120px;display:flex;justify-content:space-between;gap:10px}
.sel:after{content:'⌄';color:var(--mute)}
.who{margin-left:auto;border:1px solid #cfe0ff;background:#eef4ff;color:var(--brand);border-radius:99px;padding:5px 14px;font-weight:700;font-size:13px}
.icon{width:38px;height:36px;border:1px solid #dde3ec;border-radius:10px;display:grid;place-items:center;background:#fff;font-size:15px}
.tabs{height:54px;background:#f4f6fa;border-bottom:1px solid #dde3ec;display:flex;align-items:center;gap:6px;padding:0 20px}
.tab{padding:8px 16px;border-radius:99px;font-weight:700;color:var(--mute);font-size:14.5px}
.tab.on{background:var(--brand);color:#fff;box-shadow:0 6px 16px rgba(31,111,235,.24)}
.bell{margin-left:6px;display:inline-flex;align-items:center;gap:6px;border:1px solid #f0c9c9;background:var(--bad-bg);color:var(--bad);border-radius:99px;padding:5px 12px;font-weight:800}
.bell em{font-style:normal;background:var(--bad);color:#fff;border-radius:99px;min-width:21px;height:21px;line-height:21px;text-align:center;font-size:12px;padding:0 6px}
.menu{margin-left:auto}
.pane{position:absolute;left:0;right:0;top:116px;bottom:0;padding:16px 20px;overflow:hidden}
.card{background:#fff;border:1px solid #dde3ec;border-radius:14px;padding:14px 16px;box-shadow:0 1px 2px rgba(16,30,54,.06),0 8px 24px rgba(16,30,54,.06);margin-bottom:12px}
.card h3{font-size:16.5px;font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.hint{color:var(--mute);font-size:13px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid #dde3ec;background:#fff;border-radius:10px;padding:6px 12px;font-weight:700;font-size:13.5px;color:var(--ink)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.badge{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12.5px;font-weight:700;background:#eef2f7;color:var(--mute)}
.badge.ok{background:var(--ok-bg);color:var(--ok)}.badge.bad{background:var(--bad-bg);color:var(--bad)}.badge.warn{background:var(--warn-bg);color:var(--warn)}.badge.grp{background:var(--group-bg);color:var(--group)}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.hero{background:var(--hero);color:#fff;border-radius:14px;padding:18px 22px;margin-bottom:12px}
.hero h1{font-size:23px;font-weight:800}
.hero p{font-size:13.5px;opacity:.85}
.search{display:flex;align-items:center;gap:10px}
.search .inp{flex:1;border:1px solid #dde3ec;border-radius:12px;padding:10px 14px;font-size:16px;color:var(--mute);background:#fff;min-height:46px}
.search .inp.typing{color:var(--ink)}
.search .inp.typing:after{content:'|';animation:blink 1s steps(1) infinite;color:var(--brand);margin-left:1px}
@keyframes blink{50%{opacity:0}}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.metric{background:#fff;border:1px solid #dde3ec;border-left:4px solid var(--c);border-radius:14px;padding:12px 16px}
.metric b{font-size:28px;font-weight:800;display:block;line-height:1.2}
.metric span{font-size:13px;color:var(--mute)}
.two{display:grid;grid-template-columns:1.25fr 1fr;gap:12px}
.today{display:flex;align-items:center;gap:12px;border:1px solid #e6ebf2;border-radius:12px;padding:9px 12px;margin-top:8px}
.today .tm{width:84px;font-size:12.5px;color:var(--mute)}.today .tm b{display:block;color:var(--ink);font-size:14px}
.today.now{border-color:var(--brand);background:#f3f7ff}
.res{border:1px solid #e6ebf2;border-radius:12px;padding:9px 12px;display:flex;align-items:center;gap:10px;margin-top:8px;background:#fff}
.av{width:34px;height:34px;border-radius:11px;background:#e8f0fe;color:var(--brand);display:grid;place-items:center;font-weight:800;flex:none}
.modal-bg{position:absolute;inset:0;background:rgba(10,18,32,.42);display:grid;place-items:center;z-index:20;animation:fadeIn .25s}
.modal{background:#fff;border-radius:16px;width:720px;max-height:640px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.3);animation:pop .3s cubic-bezier(.2,.9,.3,1.2)}
.modal header{padding:14px 18px;border-bottom:1px solid #e6ebf2;font-weight:800;font-size:17px;display:flex}
.modal header:after{content:'×';margin-left:auto;color:var(--mute)}
.modal .body{padding:16px 18px}
.modal footer{padding:12px 18px;border-top:1px solid #e6ebf2;display:flex;justify-content:flex-end;gap:8px}
@keyframes fadeIn{from{opacity:0}}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.toast{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);background:#142033;color:#fff;border-radius:12px;padding:10px 18px;font-weight:700;z-index:40;animation:toastIn .3s}
.toast.ok{background:var(--ok)}
@keyframes toastIn{from{transform:translate(-50%,16px);opacity:0}}
table.g{width:100%;border-collapse:collapse;font-size:14px}
table.g th,table.g td{border-bottom:1px solid #edf1f6;padding:6px 8px;text-align:left}
table.g th{font-size:12.5px;color:var(--mute);font-weight:700;background:#f7f9fc}
table.g td.n,table.g th.n{text-align:center;font-variant-numeric:tabular-nums}
.chk{width:20px;height:20px;border-radius:6px;border:2px solid #c9d3e0;display:inline-block;vertical-align:middle;position:relative;background:#fff}
.chk.on{background:var(--c);border-color:var(--c)}
.chk.on:after{content:'✓';color:#fff;position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:800;line-height:1}
.slotgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.slotcell{border:1px solid #e1e7f0;border-radius:12px;padding:10px;min-height:94px;background:#fff;font-size:13px}
.slotcell b{display:block;font-size:14px}
.slotcell.mine{border-color:#b9d0ff;background:#f3f7ff}
.slotcell.done{border-color:#bfe6d0;background:var(--ok-bg)}
.scoregrid td.in{width:74px}
.cellin{border:1px solid #dde3ec;border-radius:8px;height:30px;display:grid;place-items:center;font-variant-numeric:tabular-nums;font-weight:700}
.cellin.cur{border-color:var(--brand);box-shadow:0 0 0 3px rgba(31,111,235,.2)}
.dist{display:flex;align-items:flex-end;gap:14px;height:150px;padding:6px 10px 0}
.dist div{flex:1;background:linear-gradient(to top,var(--brand),#7aa7ff);border-radius:8px 8px 0 0;height:0;transition:height 1.1s cubic-bezier(.2,.8,.2,1);position:relative}
.dist div span{position:absolute;bottom:-24px;left:0;right:0;text-align:center;font-weight:800;font-size:14px;color:var(--ink)}
.dist div em{position:absolute;top:-22px;left:0;right:0;text-align:center;font-style:normal;font-size:12.5px;color:var(--mute)}
.mode{display:flex;gap:10px;margin-bottom:12px}
.mode div{flex:1;border:1px solid #dde3ec;border-radius:14px;padding:12px 14px;background:#fff;font-weight:800}
.mode div span{display:block;font-weight:400;font-size:13px;color:var(--mute)}
.mode div.on{border-color:var(--brand);box-shadow:0 0 0 2px rgba(31,111,235,.25);background:#f3f7ff}
.cand{border:1px solid #e6ebf2;border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px;margin-top:8px}
.sheet{background:#fff;width:470px;height:600px;margin:0 auto;box-shadow:0 20px 50px rgba(0,0,0,.25);padding:40px 46px;font-family:'Sarabun',serif;font-size:14px;line-height:1.75;animation:pop .45s cubic-bezier(.2,.9,.3,1.1)}
.sheet h4{text-align:center;font-size:22px;font-weight:800;margin:4px 0 12px}
.sheet .l{height:9px;background:#e9edf3;border-radius:4px;margin:9px 0}
.krut{width:52px;height:52px;border-radius:50%;margin:0 auto;background:#c89b3c;opacity:.85}
.menu-sheet{position:absolute;right:20px;top:120px;width:430px;background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.25);padding:14px;z-index:15;animation:pop .3s}
.menu-sheet .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.menu-sheet .grid div{border:1px solid #e1e7f0;border-radius:12px;padding:10px 12px;font-weight:700}
.vbtn{border:1px solid #bde5cd;background:var(--ok-bg);color:var(--ok);border-radius:10px;padding:6px 12px;font-weight:800;font-size:13.5px}
.vbtn.old{background:var(--bad);border-color:var(--bad);color:#fff}

.console{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:12px}
.ctab{background:#fff;border:1px solid #dde3ec;border-radius:14px;padding:9px 11px;font-size:13px}
.ctab b{display:block;font-size:13.5px}.ctab span{font-size:11.5px;color:var(--mute)}
.ctab.on{border-color:var(--brand);box-shadow:0 0 0 2px rgba(31,111,235,.2);background:#f3f7ff}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.tile{border:1px solid #dde3ec;border-radius:14px;padding:12px 14px;background:#fff;display:flex;flex-direction:column;gap:2px}
.tile b{font-size:30px;font-weight:800;line-height:1.15}
.tile span{font-size:13px}.tile em{font-style:normal;font-size:12.5px;color:var(--brand);font-weight:700;margin-top:4px}
.tile.alert{border-color:#f0c9c9;background:#fff8f8}.tile.alert b{color:var(--bad)}
.stack{display:flex;height:34px;border-radius:10px;overflow:hidden;background:#eef2f7}
.stack i{display:block;height:100%;width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.stack i.grow{width:var(--w)}
.hbar{display:grid;grid-template-columns:190px 1fr 70px;align-items:center;gap:10px;margin:7px 0;font-size:13.5px}
.hbar i{height:14px;border-radius:99px;background:#eef2f7;overflow:hidden;display:block}
.hbar b{display:block;height:100%;width:0;background:var(--brand);border-radius:99px;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.hbar b.grow{width:var(--w)}
.hbar em{font-style:normal;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
/* หน้าทางเข้าจำลอง (ใช้ภาพจริงของแอป) */
.gw{position:absolute;inset:0;background:#0c0b10;color:#f4f1f8;overflow:hidden}
.gw:before{content:'';position:absolute;inset:-40px;background:url(./icons/gateway-roles.jpg) center 70%/cover;filter:blur(26px) brightness(.3)}
.gw-top{position:relative;display:flex;align-items:center;gap:12px;padding:22px 40px}
.gw-top img{width:42px;height:42px}
.gw-top b{font-size:19px;font-weight:800;display:block}.gw-top span{font-size:13px;color:#a59fb3}
.gw-stage{position:relative;display:flex;width:560px;height:560px;margin:0 auto;--L:48px}
.gw-slot{position:relative;flex:1 1 0;min-width:0;clip-path:polygon(var(--L) 0,100% 0,calc(100% - var(--L)) 100%,0 100%);background:#1b1822;transition:flex-grow .45s,filter .35s,background .3s}
.gw-slot + .gw-slot{margin-left:calc(10px - var(--L))}
.gw-slot .art{position:absolute;inset:2px;overflow:hidden;clip-path:polygon(calc(var(--L) + 1px) 0,100% 0,calc(100% - var(--L) - 1px) 100%,0 100%)}
.gw-slot img{position:absolute;height:760px;top:-205px;left:50%;transform:translateX(calc(var(--fx) * -100%));transition:transform .6s}
.gw-slot .art:after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(8,7,12,.95) 8%,transparent 55%)}
.gw-slot .lab{position:absolute;left:16px;right:40px;bottom:22px;z-index:2}
.gw-slot .en{font-size:10px;font-weight:800;letter-spacing:.05em;color:var(--c);line-height:1.3}
.gw-slot .en:first-letter{font-size:200%}
.gw-slot .th{font-size:23px;font-weight:800;line-height:1.2;white-space:nowrap}
.gw-slot .th.long{font-size:18px}
.gw-slot.on .th.long{font-size:22px}
.gw-slot .go{display:inline-block;margin-top:8px;background:var(--c);color:#0c0b10;font-weight:800;padding:6px 12px;font-size:13px;opacity:0;transition:opacity .3s}
.gw-stage.picked .gw-slot:not(.on){filter:brightness(.45) grayscale(.6)}
.gw-slot.on{flex-grow:1.9;background:var(--c)}
/* ช่องที่ถูกบีบตอนเลือกช่องอื่น: ซ่อนชื่ออังกฤษ ชื่อไทยเล็กลง ไม่ให้ขอบเฉียงตัดตัวอักษร */
.gw-stage.picked .gw-slot:not(.on) .en{visibility:hidden}
.gw-stage.picked .gw-slot:not(.on) .th{font-size:17px}
.gw-stage.picked .gw-slot:not(.on) .th.long{font-size:14px}
.gw-slot.on .go{opacity:1}
.gw-slot.on img{transform:translateX(calc(var(--fx) * -100%)) scale(1.05)}

/* ตัวชี้ + ไฮไลต์ */
#cursor{position:absolute;left:0;top:0;width:30px;height:30px;z-index:60;pointer-events:none;transition:transform .75s cubic-bezier(.45,.05,.25,1);transform:translate(640px,400px)}
#cursor svg{width:30px;height:30px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35))}
.ripple{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;border:3px solid var(--brand);z-index:59;pointer-events:none;animation:ripple .6s ease-out forwards}
@keyframes ripple{to{transform:scale(3.4);opacity:0}}
#hl{position:absolute;z-index:55;border:3px solid #ffb020;border-radius:14px;box-shadow:0 0 0 9999px rgba(10,18,32,.28),0 0 22px rgba(255,176,32,.6);pointer-events:none;opacity:0;transition:all .45s cubic-bezier(.3,.8,.3,1)}
#hl.on{opacity:1}
.title-card ~ #cursor{display:none}
/* การ์ดปิดท้าย/เปิดบท */
.title-card{position:absolute;inset:0;background:var(--hero);color:#fff;display:grid;place-content:center;text-align:center;padding:40px}
.title-card small{font-size:18px;opacity:.85;letter-spacing:.02em}
.title-card h2{font-size:64px;font-weight:800;line-height:1.2;margin:8px 0 10px}
.title-card p{font-size:20px;opacity:.9;max-width:760px;margin:0 auto;line-height:1.7}
.title-card .num{font-size:120px;font-weight:800;opacity:.18;position:absolute;right:60px;bottom:10px;line-height:1}
@media (prefers-reduced-motion:reduce){#cursor,#hl,.gw-slot,.gw-slot img,.dist div{transition:none!important}.modal,.modal-bg,.toast,.sheet,.menu-sheet{animation:none!important}}
</style>

<body>
<header class="head">
  <img src="./icons/school-logo.png" alt="" onerror="this.style.display='none'">
  <div><h1 id="gTitle">วิธีใช้ KruSpace สำหรับครู</h1><p id="gSub">ภาพเคลื่อนไหวแนะนำงานประจำของครู 4 เรื่อง • กดเลือกบท หรือกดเล่นดูต่อกันทั้งหมด</p></div>
  <nav class="modes" aria-label="เลือกโหมด"><a href="./guide.html" id="mTeacher">โหมดครู</a><a href="./guide.html?mode=exec" id="mExec">โหมดผู้บริหาร</a></nav>
  <a href="./">เปิดแอป KruSpace ›</a>
</header>
<nav class="chapters" id="chapters"></nav>
<div class="frame"><div class="frame-in" id="frameIn"><div id="stage" aria-live="off"></div></div></div>
<div class="caption"><span class="step" id="stepTag">1/1</span><p id="cap"></p></div>
<div class="controls">
  <button id="bPrev" title="ขั้นก่อนหน้า" aria-label="ขั้นก่อนหน้า">⏮</button>
  <button id="bPlay" class="primary" title="เล่น/หยุด" aria-label="เล่นหรือหยุด">⏸</button>
  <button id="bNext" title="ขั้นถัดไป" aria-label="ขั้นถัดไป">⏭</button>
  <div class="bar" id="bar"><i id="barFill"></i></div>
  <span class="count" id="count"></span>
  <button id="bSpeed" title="ความเร็ว">1×</button>
  <button id="bVoice" title="เสียงบรรยายภาษาไทย" aria-pressed="false">🔇 เปิดเสียงบรรยาย</button>
</div>
<p class="voice-note" id="voiceNote" hidden></p>
<p class="rotate">📱 หมุนมือถือเป็นแนวนอนเพื่อดูภาพใหญ่ขึ้น</p>
<p class="kbd-hint">แป้นลัด: เว้นวรรค = เล่น/หยุด • ← → = ย้อน/ถัดไปทีละขั้น • ข้อมูลในภาพเป็นข้อมูลสมมติ</p>

<script>
'use strict';
/* ============================================================================
   ตัวเล่น: แต่ละ "ขั้น" วาดหน้าจอเริ่มต้นของตัวเองใหม่ทั้งหมด (build) แล้วเล่นท่าทาง (run)
   ขั้นจึงไม่พึ่งขั้นก่อนหน้า กดข้ามไปขั้นไหนก็ได้หน้าจอถูกต้องเสมอ
   การเล่นแต่ละรอบมีเลขประจำรอบ (run token) ถ้ากดข้ามกลางคัน รอบเก่าจะหยุดเองที่ await ถัดไป
   ========================================================================== */
const stage = document.getElementById('stage'), capEl = document.getElementById('cap');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let speed = 1, playing = true, cur = 0, token = 0, resumeWait = null;

/* ---------------- ย่อจอจำลองให้พอดีกรอบ ---------------- */
const frameIn = document.getElementById('frameIn');
function fit() {
  const w = frameIn.parentElement.clientWidth, s = w / 1280;
  stage.style.transform = 'scale(' + s + ')';
  frameIn.style.height = Math.round(720 * s) + 'px';
}
addEventListener('resize', fit);

/* ---------------- เครื่องมือของแต่ละขั้น ---------------- */
const $ = s => stage.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
class Stop extends Error {}
function api(my) {
  const alive = () => { if (my !== token) throw new Stop(); };
  const wait = async ms => {
    let left = ms / speed;
    while (left > 0) { alive(); if (!playing) { await new Promise(r => { resumeWait = r; }); continue; } const t = Math.min(left, 120); await sleep(t); left -= t; }
    alive();
  };
  /* จุดที่หาไม่เจอจดไว้ใน __guideMissing — ถ้าแก้หน้าจอจำลองแล้วลืมแก้ขั้นที่อ้างถึง จะตรวจเจอได้ */
  const center = sel => { const el = typeof sel === 'string' ? $(sel) : sel; if (!el) { (window.__guideMissing = window.__guideMissing || []).push(cur + ':' + sel); return null; } const s = stage.getBoundingClientRect(), r = el.getBoundingClientRect(), k = s.width / 1280;
    return { x: (r.left - s.left + r.width / 2) / k, y: (r.top - s.top + r.height / 2) / k, w: r.width / k, h: r.height / k, l: (r.left - s.left) / k, t: (r.top - s.top) / k }; };
  const cursor = () => document.getElementById('cursor');
  return {
    wait,
    /* เปลี่ยนคำบรรยายกลางขั้น: รอเสียงพากย์ประโยคก่อนหน้าจบก่อน ภาพกับเสียงจะได้ไปด้วยกัน */
    async cap(html) { while (Voice.on && !Voice.blocked && voiceBusy()) await wait(150);
      capEl.classList.add('fade'); setTimeout(() => { capEl.innerHTML = html; capEl.classList.remove('fade'); }, reduce ? 0 : 180); speak(html); },
    async move(sel, ms = 800) { const c = center(sel); if (!c) return; cursor().style.transitionDuration = (reduce ? 0 : ms / speed) + 'ms';
      cursor().style.transform = 'translate(' + (c.x - 6) + 'px,' + (c.y - 4) + 'px)'; await wait(ms); },
    async click(sel) { if (sel) await this.move(sel); const c = center(sel || cursor()); const cs = cursor().style.transform.match(/-?[\d.]+/g) || [0, 0];
      const r = document.createElement('span'); r.className = 'ripple'; r.style.left = (+cs[0] + 6) + 'px'; r.style.top = (+cs[1] + 4) + 'px'; stage.appendChild(r);
      setTimeout(() => r.remove(), 700); await wait(260); },
    hl(sel, pad = 6) { const el = document.getElementById('hl'); if (!sel) { el.classList.remove('on'); return; } const c = center(sel); if (!c) return;
      Object.assign(el.style, { left: (c.l - pad) + 'px', top: (c.t - pad) + 'px', width: (c.w + pad * 2) + 'px', height: (c.h + pad * 2) + 'px' }); el.classList.add('on'); },
    async type(sel, text, per = 90) { const el = $(sel); el.classList.add('typing'); el.textContent = ''; for (const ch of Array.from(text)) { el.textContent += ch; await wait(per); } },
    toast(msg, kind) { const t = document.createElement('div'); t.className = 'toast ' + (kind || ''); t.textContent = msg; stage.appendChild(t); setTimeout(() => t.remove(), 2200 / speed); },
    set(sel, fn) { const el = $(sel); if (el) fn(el); },
    html(sel, h) { const el = $(sel); if (el) el.innerHTML = h; },
    modal(title, body, foot) { const d = document.createElement('div'); d.className = 'modal-bg'; d.id = 'mbg';
      d.innerHTML = '<div class="modal"><header>' + title + '</header><div class="body">' + body + '</div>' + (foot ? '<footer>' + foot + '</footer>' : '') + '</div>'; stage.appendChild(d); },
    closeModal() { const m = $('#mbg'); if (m) m.remove(); }
  };
}

/* ---------------- เสียงบรรยาย ----------------
   หลัก: ไฟล์เสียงที่อัดไว้ล่วงหน้าด้วยเสียง neural ภาษาไทย (guide-audio/*.mp3 จาก tools/make_guide_audio.py)
   ทุกเครื่องได้เสียงเดียวกัน ลื่นเหมือนคนพูด ไม่ขึ้นกับว่าเครื่องมีเสียงไทยหรือไม่
   สำรอง: คำบรรยายที่ยังไม่มีไฟล์ (เพิ่งแก้ข้อความ) ใช้เสียงไทยของเครื่องผ่าน Web Speech API
   ชื่อไฟล์ = แฮชของข้อความที่พูด แก้คำบรรยายเมื่อไหร่ ไฟล์เดิมไม่ตรงอีก จึงไม่มีทางเล่นเสียงผิดประโยค
   เบราว์เซอร์ไม่ยอมให้เว็บเปิดเสียงเองก่อนผู้ใช้แตะหน้า จึงต้องกดปุ่มเปิดเสียงครั้งแรก แล้วจำค่าไว้ */
const Voice = { on: false, voice: null, blocked: false, ok: 'speechSynthesis' in window };
const Clips = { map: {}, audio: new Audio(), playing: false };
Clips.audio.preload = 'auto';
Clips.audio.onended = () => { Clips.playing = false; };
Clips.audio.onerror = () => { const was = Clips.playing; Clips.playing = false; if (was && Clips.html) webSpeak(Clips.html); };
const VOICE_KEY = 'kruspace.guide.voice';
function pickThaiVoice() {
  if (!Voice.ok) return null;
  const rank = v => /natural|premwadee|niwat/i.test(v.name) ? 3 : /google/i.test(v.name) ? 2 : 1;
  return speechSynthesis.getVoices().filter(v => /^th/i.test(v.lang)).sort((a, b) => rank(b) - rank(a))[0] || null;
}
/* คำบรรยายเขียนให้คนอ่าน มีตัวย่อและสัญลักษณ์ที่อ่านออกเสียงผิด จึงแปลงเป็นคำพูดก่อน
   เว้นวรรคในภาษาไทยคือจุดหยุดหายใจของเครื่องอ่าน จึงแทนสัญลักษณ์คั่นด้วยเว้นวรรคเดียว ไม่ใส่จุลภาคซ้อน */
const SAY = [[/ปี\/ภาค(เรียน)?/g, 'ปีการศึกษาและภาคเรียน'], [/KruSpace/g, 'ครูสเปซ'], [/ปพ\.\s?5/g, 'ปอพอห้า'], [/SGS/g, 'เอสจีเอส'], [/CSV/g, 'ซีเอสวี'], [/Google/g, 'กูเกิล'], [/Excel/g, 'เอ็กเซล'],
  [/ม\.(\d)\/(\d+)/g, 'มอ$1 ทับ $2'], [/ม\.(\d)/g, 'มอ$1'], [/(\d+)\/(\d+)/g, '$1 จาก $2'], [/(\d+(?:\.\d+)?)\s*%/g, '$1 เปอร์เซ็นต์'],
  [/ ร /g, ' ร. '], [/(\d{1,2}):(\d{2}) น\./g, '$1 นาฬิกา $2 นาที'], [/(\d+)×/g, '$1 เท่า'],
  [/☰/g, 'เมนู'], [/[•·—]/g, ' '], [/→/g, ' '], [/\s*\/\s*/g, ' หรือ '], [/–/g, ' ถึง '], [/\+/g, ' และ '], [/[“”"()]/g, ''],
  [/[\u{1F300}-\u{1FAFF}\u2600-\u27BF\uFE0F]/gu, ' ']];
function speakable(html) {
  let t = html.replace(/<[^>]+>/g, '').replace(/&nbsp;/g, ' ').replace(/&[a-z]+;/g, ' ');
  SAY.forEach(([re, to]) => { t = t.replace(re, to); });
  return t.replace(/\s+/g, ' ').trim();
}
/* แฮช FNV-1a 32 บิตของข้อความที่พูด — ต้องตรงกับที่สคริปต์อัดเสียงใช้ตั้งชื่อไฟล์ */
function sayKey(text) { let h = 0x811c9dc5; for (const ch of text) { h ^= ch.codePointAt(0); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(16).padStart(8, '0'); }
/* ไฟล์เสียงผูกกับ "ข้อความคำบรรยายดิบ" (ไม่ใช่ข้อความที่แปลงแล้ว) — บทพากย์เขียนด้วยมือแยกไว้ใน tools/guide_voice/script.json
   index.json = { แฮชข้อความดิบ: ชื่อไฟล์ } • ชื่อไฟล์ = แฮชของบทพากย์ อัดใหม่เมื่อไหร่ชื่อไฟล์เปลี่ยน แคชเก่าไม่ค้าง */
const plainOf = html => html.replace(/<[^>]+>/g, '').replace(/&nbsp;/g, ' ').replace(/\s+/g, ' ').trim();
const clipOf = html => Clips.map[sayKey(plainOf(html))];
const clipUrl = file => './guide-audio/' + file;
fetch('./guide-audio/index.json').then(r => r.ok ? r.json() : {}).then(m => { Clips.map = m || {}; voiceUi(); }).catch(() => {});
function voiceBusy() { return Clips.playing || (Voice.ok && (speechSynthesis.speaking || speechSynthesis.pending)); }
function stopVoice() { Clips.audio.pause(); Clips.playing = false; if (Voice.ok) speechSynthesis.cancel(); }
function speak(html) {
  if (!Voice.on) return;
  const file = clipOf(html);
  if (file) {
    const a = Clips.audio; a.src = clipUrl(file); a.playbackRate = speed === 1 ? 1 : 1.25; Clips.playing = true;
    Clips.html = html;   // เผื่อไฟล์เปิดไม่ได้ (ออฟไลน์/ไฟล์หาย) จะได้ให้เสียงของเครื่องพูดประโยคเดิมแทน ไม่เงียบไปเฉย ๆ
    a.play().then(() => { if (Voice.blocked) { Voice.blocked = false; voiceUi(); } })
      .catch(e => { if (e && e.name === 'NotAllowedError') { Clips.playing = false; Voice.blocked = true; voiceUi(); } });   // ไฟล์เสีย → onerror พูดแทนให้ (ที่เดียว ไม่ซ้ำ)
    return;
  }
  webSpeak(html);
}
function webSpeak(html) {
  if (!Voice.on || !Voice.voice) return;
  const u = new SpeechSynthesisUtterance(speakable(html));
  u.voice = Voice.voice; u.lang = Voice.voice.lang || 'th-TH'; u.rate = speed === 1 ? 1 : 1.3;
  u.onerror = e => { if (e.error === 'not-allowed') { Voice.blocked = true; voiceUi(); } };
  u.onstart = () => { if (Voice.blocked) { Voice.blocked = false; voiceUi(); } };
  speechSynthesis.speak(u);
}
/* โหลดเสียงของขั้นถัดไปไว้ก่อน ระหว่างขั้นจะได้ไม่เงียบรอโหลด (service worker เก็บไว้ในแคชให้ด้วย) */
function prefetchVoice(html) { if (!Voice.on || !html) return; const f = clipOf(html); if (f) fetch(clipUrl(f)).catch(() => {}); }
function pauseVoice(on) { if (Clips.playing) { if (on) Clips.audio.play().catch(() => {}); else Clips.audio.pause(); } if (Voice.ok) { if (on) speechSynthesis.resume(); else speechSynthesis.pause(); } }
function voiceUi() {
  const b = document.getElementById('bVoice'), note = document.getElementById('voiceNote');
  const hasClips = Object.keys(Clips.map).length > 0;
  if (!Voice.ok && !hasClips) { b.hidden = true; return; }
  b.hidden = false;
  b.classList.toggle('on', Voice.on && !Voice.blocked); b.classList.toggle('blocked', Voice.on && Voice.blocked);
  b.setAttribute('aria-pressed', String(Voice.on));
  b.textContent = !Voice.on ? '🔇 เปิดเสียงบรรยาย' : Voice.blocked ? '🔊 แตะเพื่อเริ่มเสียง' : '🔊 เสียงบรรยาย';
  const noVoice = Voice.on && !hasClips && !Voice.voice;
  note.hidden = !noVoice; if (noVoice) note.textContent = 'โหลดไฟล์เสียงไม่ได้ และเครื่องนี้ไม่มีเสียงภาษาไทย ลองต่ออินเทอร์เน็ตแล้วเปิดใหม่';
}
function setVoice(on) {
  Voice.on = on; Voice.blocked = false; Voice.voice = Voice.voice || pickThaiVoice();
  try { localStorage.setItem(VOICE_KEY, on ? '1' : '0'); } catch (e) { /* โหมดส่วนตัว — ไม่จำค่า */ }
  stopVoice();
  if (on) speak(capEl.innerHTML);
  voiceUi();
}
if (Voice.ok) {
  Voice.voice = pickThaiVoice();
  speechSynthesis.onvoiceschanged = () => { Voice.voice = Voice.voice || pickThaiVoice(); voiceUi(); };
}
try { Voice.on = localStorage.getItem(VOICE_KEY) === '1'; } catch (e) { Voice.on = false; }

/* ---------------- ชิ้นส่วนหน้าจอแอป ---------------- */
const TABS = ['ภาพรวม', 'เช็กชื่อ', 'แลกคาบ / การลา', 'กรอกคะแนน', 'หัวข้อคะแนน', 'สรุป / ส่งออก'];
function shell(active, paneHtml, opt = {}) {
  return '<div class="scr"><div class="app-top"><div class="brand"><i>S</i><span>KruSpace<small>ศูนย์จัดการงานชั้นเรียนแบบครบวงจร</small></span></div>' +
    '<div class="pick">ปี/ภาค <span class="sel" id="pPeriod">2569 • ภาค 2</span></div>' +
    /* ผู้บริหารดูทั้งโรงเรียน แถบบนจึงมีแค่ปี/ภาค เหมือนแอปจริง (TAB_PICKERS.executive) */
    (opt.exec ? '' : '<div class="pick">ชั้น <span class="sel" id="pClass">ม.2/3 (38 คน)</span></div>' +
    '<div class="pick">วิชา <span class="sel" id="pSubject" style="min-width:190px">ว22102 วิทยาศาสตร์ 4</span></div>') +
    '<span class="who">' + (opt.exec ? 'ผอ.ประเสริฐ มั่นคง • ผู้บริหาร' : 'ครูสมใจ ใจดี • ครู') + '</span><span class="icon">⌕</span><span class="icon">◐</span></div>' +
    '<div class="tabs">' + (opt.tabs || TABS).map(t => '<span class="tab' + (t === active ? ' on' : '') + '" data-tab="' + t + '">' + t + '</span>').join('') +
    '<span class="bell" id="bell">🔔<em id="bellN">' + (opt.bell == null ? 2 : opt.bell) + '</em></span><span class="icon menu" id="menuBtn">☰</span></div>' +

    '<div class="card" id="cands" style="opacity:' + (showCands ? 1 : .25) + ';transition:opacity .5s"><h3>2. ครูที่ระบบแนะนำ</h3><div class="row" style="gap:6px"><span class="badge grp">ทั้งหมด 3</span><span class="badge">สลับคาบ</span><span class="badge">แลกคาบ</span><span class="badge">สอนแทน</span></div>' +
    [['ครูวิไล สุขใจ', 'แลกคาบ • จันทร์ 6 ต.ค. คาบ 2 ม.2/1', 'C1'], ['ครูประเสริฐ ดีงาม', 'สอนแทน • ว่างคาบ 3', 'C2'], ['ครูอรทัย แสงดี', 'สลับคาบ • ศุกร์ คาบ 5', 'C3']]
      .map(c => '<div class="cand"><span class="av">' + c[0].slice(3, 4) + '</span><div><b>' + c[0] + '</b><div class="hint">' + c[1] + '</div></div><span class="sp"></span><span class="btn primary" id="send' + c[2] + '">ส่งคำขอ</span></div>').join('') + '</div></div>';
}
const IND = [['ว 2.1 ม.2/1', 'อธิบายองค์ประกอบของวงจรไฟฟ้าอย่างง่ายจากหลักฐานเชิงประจักษ์', 'F'], ['ว 2.1 ม.2/2', 'ใช้โวลต์มิเตอร์และแอมมิเตอร์วัดปริมาณทางไฟฟ้า', 'F'],
  ['ว 2.3 ม.2/3', 'คำนวณพลังงานไฟฟ้าของเครื่องใช้ไฟฟ้า', 'F'], ['ว 2.3 ม.2/4', 'ออกแบบการใช้เครื่องใช้ไฟฟ้าอย่างประหยัดและปลอดภัย', 'S']];
function indPage(withRows) {
  const acts = [['indCore', 'เลือกจากหลักสูตร', 'วิชาพื้นฐาน • ติ๊กเลือกจากฐานตัวชี้วัดของโรงเรียน'], ['indIpst', 'เลือกผลการเรียนรู้ สสวท.', 'วิชาเพิ่มเติม ม.ปลาย'], ['indPaste', 'พิมพ์เอง / วางจาก Excel', 'วิชาเพิ่มเติม • วางทีเดียวทั้งตาราง'],
    ['indFrom', 'ขอจากครูท่านอื่น', 'หยิบชุดของครูที่สอนวิชาเดียวกัน'], ['indCopy', 'คัดลอกไปห้องอื่น', 'ใช้ชุดเดียวกันกับห้องอื่น']];
  return '<div class="hero" style="padding:14px 22px"><p>LEARNING INDICATORS</p><h1>ตัวชี้วัด / ผลการเรียนรู้</h1><p>ว22102 วิทยาศาสตร์ 4 • ม.2/3</p></div>' +
    '<div class="card"><h3>เพิ่มตัวชี้วัดเข้าวิชานี้</h3><div class="tiles" id="indActions">' + acts.map(x => '<div class="tile" id="' + x[0] + '"><b style="font-size:16px">' + x[1] + '</b><span class="hint">' + x[2] + '</span></div>').join('') + '</div></div>' +
    '<div class="card"><div class="row"><h3 style="margin:0">ชุดตัวชี้วัดของวิชานี้</h3><span class="sp"></span><span class="btn" id="indShare">แชร์ให้เพื่อนครู</span></div>' +
    (withRows ? '<div class="row" id="indSum" style="gap:14px;margin:8px 0;flex-wrap:wrap"><span class="badge">รวม 4 ข้อ</span><span class="badge">กลางทาง 3</span><span class="badge grp">ปลายทาง 1</span><span class="badge">รวมเวลา 14 ชม.</span><span class="badge">รวมคะแนน 40</span></div>' +
      '<table class="g" id="indTable"><thead><tr><th class="n">ที่</th><th>รหัส</th><th>ตัวชี้วัด / ผลการเรียนรู้</th><th>ประเภท</th><th class="n">เวลา</th><th class="n">คะแนน</th></tr></thead><tbody>' +
      IND.map((r, i) => '<tr><td class="n">' + (i + 1) + '</td><td>' + r[0] + '</td><td>' + r[1] + '</td><td><span class="badge ' + (r[2] === 'S' ? 'grp' : '') + '" id="k' + i + '">' + (r[2] === 'S' ? 'ปลายทาง' : 'กลางทาง') + '</span></td><td class="n">' + [3, 3, 4, 4][i] + '</td><td class="n">' + [10, 10, 10, 10][i] + '</td></tr>').join('') + '</tbody></table>'
      : '<div class="hint" style="padding:14px 0">ยังไม่มีตัวชี้วัดในวิชานี้ — เลือกจากหลักสูตรถ้าเป็นวิชาพื้นฐาน หรือพิมพ์เองถ้าเป็นวิชาเพิ่มเติม</div>') + '</div>';
}
function leavePage() {
  return '<div class="mode"><div>แลกคาบปกติ<span>สลับคาบ แลกคาบ หรือหาครูสอนแทน</span></div><div class="on">ลา / ไปราชการ<span>แจ้งการลาแล้วจัดคาบที่ติดให้ครบ</span></div></div>' +
    '<div class="card" style="max-width:820px"><h3>แจ้งการลา / ขออนุญาตไปราชการ</h3><div class="row" style="gap:8px;flex-wrap:wrap">' +
    ['ลากิจส่วนตัว', 'ลาป่วย', 'ลาป่วย (พบแพทย์ตามนัด)', 'ไปราชการ'].map((t, i) => '<span class="cand" style="margin:0;padding:8px 14px"' + (i === 1 ? ' id="lvSick"' : '') + '>' + t + '</span>').join('') + '</div>' +
    '<div class="row" style="margin-top:12px;gap:14px"><span>ตั้งแต่ <span class="sel" style="display:inline-flex">6 ต.ค. 2569</span></span><span>ถึง <span class="sel" style="display:inline-flex">6 ต.ค. 2569</span></span><span class="hint">1 วัน • มีคาบสอน 3 คาบ</span></div>' +
    '<div class="row" style="margin-top:14px"><span class="sp"></span><span class="btn primary" id="lvSend">ส่งใบลา</span></div></div>';
}

/* ---------------- ควบคุมการเล่น ---------------- */
const chaps = document.getElementById('chapters');
chaps.style.gridTemplateColumns = matchMedia('(max-width:640px)').matches ? '' : 'repeat(' + CH.length + ',1fr)';
chaps.innerHTML = CH.map((c, i) => '<button data-ch="' + i + '"><b>' + (i + 1) + '. ' + c.t + '</b><span>' + c.d + '</span><i></i></button>').join('');
const firstOf = ch => STEPS.findIndex(s => s.ch === ch);
function ui() {
  const s = STEPS[cur], inCh = STEPS.filter(x => x.ch === s.ch), k = inCh.indexOf(s);
  document.getElementById('stepTag').textContent = 'บท ' + (s.ch + 1) + ' • ' + (k + 1) + '/' + inCh.length;
  document.getElementById('count').textContent = (cur + 1) + '/' + STEPS.length;
  document.getElementById('barFill').style.width = ((cur + 1) / STEPS.length * 100) + '%';
  document.getElementById('bPlay').textContent = playing ? '⏸' : '▶';
  chaps.querySelectorAll('button').forEach((b, i) => { b.classList.toggle('on', i === s.ch);
    const n = STEPS.filter(x => x.ch === i).length, done = i < s.ch ? n : i === s.ch ? k + 1 : 0; b.querySelector('i').style.width = (done / n * 100) + '%'; });
}
async function go(i) {
  cur = Math.max(0, Math.min(STEPS.length - 1, i)); const my = ++token;
  if (resumeWait) { const r = resumeWait; resumeWait = null; r(); }
  const s = STEPS[cur];
  stage.innerHTML = s.build() + cursorSvg;
  stopVoice();
  capEl.innerHTML = s.cap; ui(); speak(s.cap);
  if (STEPS[cur + 1]) prefetchVoice(STEPS[cur + 1].cap);
  try {
    const A = api(my);
    await s.run(A);
    while (Voice.on && !Voice.blocked && voiceBusy()) await A.wait(150);   // พูดให้จบก่อนไปขั้นถัดไป
    if (my !== token) return;
    await api(my).wait(900);
    if (cur < STEPS.length - 1) go(cur + 1); else { playing = false; ui(); }
  } catch (e) { if (!(e instanceof Stop)) console.error(e); }
}
function toggle() { playing = !playing; if (Voice.on) pauseVoice(playing);
  if (playing && resumeWait) { const r = resumeWait; resumeWait = null; r(); } if (playing && cur === STEPS.length - 1 && !resumeWait) go(cur); ui(); }
document.getElementById('bPlay').onclick = toggle;
document.getElementById('bPrev').onclick = () => go(cur - 1);
document.getElementById('bNext').onclick = () => go(cur + 1);
document.getElementById('bSpeed').onclick = e => { speed = speed === 1 ? 1.5 : 1; e.target.textContent = speed + '×'; };
document.getElementById('bVoice').onclick = () => setVoice(!(Voice.on && !Voice.blocked));
voiceUi();
chaps.onclick = e => { const b = e.target.closest('button'); if (b) { playing = true; go(firstOf(+b.dataset.ch)); } };
document.getElementById('bar').onclick = e => { const r = e.currentTarget.getBoundingClientRect(); go(Math.floor((e.clientX - r.left) / r.width * STEPS.length)); };
addEventListener('keydown', e => {
  if (e.key === ' ') { e.preventDefault(); toggle(); }
  else if (e.key === 'ArrowRight') go(cur + 1);
  else if (e.key === 'ArrowLeft') go(cur - 1);
});
/* หยุดเมื่อสลับไปแท็บอื่น กลับมาค่อยเล่นต่อ ครูจะได้ไม่พลาดขั้นที่ยังไม่ได้ดู */
document.addEventListener('visibilitychange', () => { if (document.hidden && playing) toggle(); });
fit();
/* ?ch=2 เปิดที่บทที่ 2 ได้ ใช้ส่งลิงก์เฉพาะบทในกลุ่มครู */
const startCh = Math.max(1, Math.min(CH.length, parseInt(new URLSearchParams(location.search).get('ch'), 10) || 1)) - 1;
go(firstOf(startCh));
</script>
