  /** ชื่อขึ้นต้นด้วย "รอครู" "ตำแหน่งว่าง" ฯลฯ = ตำแหน่งว่าง (ใช้ตอนนำเข้า) */
  /** ประวัติย้อนกลับ: เก็บสำเนาทั้งโมเดล (snap) ไม่เกิน max ชุด — ตัดชุดเก่าพร้อมทุกรายการใต้มัน (ops ใต้ snap ที่ตัดเป็นการแก้บนโมเดลเก่า ย้อนไปแล้วทับโมเดลใหม่) */
  function trimSnaps(list, max) { let n = 0; for (let i = list.length - 1; i >= 0; i--) if (list[i].snap && ++n > max) { list.splice(0, i + 1); break; } return list; }
  function markTempByName(model, note) { let n = 0; Object.values(model.teachers).forEach(t => { if (!t.temp && TEMP_NAME.test(t.name)) { t.temp = { note: note || '', expect: '' }; n++; } }); return n; }

  /* ---------- ตารางต้นแบบ (เลียนแบบปี/ภาคก่อน) ----------
     เก็บตามชื่อครู/ชื่อห้อง ไม่ใช้ id เพราะโมเดลใหม่ (นำเข้าภาระงาน/ดึงจาก KruSpace/EMS) สร้าง id ใหม่ */
  function makeRef(model, label) {
    const rows = [];
    Object.values(model.entries).forEach(e => { const t = model.teachers[e.teacherId], c = model.classes[e.classId]; if (t && c) rows.push([t.name, c.name, (model.subjects[e.subjectId] || {}).code || '', e.day, e.slot]); });
    return { label: label || ('ปี ' + (model.period.year || '?') + ' ภาค ' + (model.period.semester || '?')), at: new Date().toISOString(), rows: rows };
  }
  function refIndex(ref) {
    const r = { T: new Set(), TC: new Set(), TL: new Set(), TS: new Set() };
    ref.rows.forEach(([tn, cn, , d, s]) => { const x = d + '-' + s; r.T.add(tn); r.TC.add(tn + '|' + cn + '|' + x); r.TL.add(tn + '|' + classInfo(cn).level + '|' + x); r.TS.add(tn + '|' + x); });
    return r;
  }
  /** ผลการเลียนแบบ: คาบของครูที่อยู่ในต้นแบบ ลงช่องเดิมกี่คาบ (ห้องเดิม/ครูเดิม) */
  function mimicStats(model) {
    if (!model.ref || !(model.ref.rows || []).length) return null;
    const ref = refIndex(model.ref), out = { total: 0, sameClass: 0, sameTeacher: 0 };
    Object.values(model.entries).forEach(e => { const t = model.teachers[e.teacherId], c = model.classes[e.classId]; if (!t || !c || !ref.T.has(t.name)) return; const x = e.day + '-' + e.slot; out.total++; if (ref.TC.has(t.name + '|' + c.name + '|' + x)) out.sameClass++; if (ref.TS.has(t.name + '|' + x)) out.sameTeacher++; });
    return out;
  }

  /* ---------- รายชื่อครูจากภายนอก (EMS / ไฟล์บุคลากร) ----------
     list = [{name, email, area, roles:[ชื่อบทบาท]}] — จับคู่อีเมลก่อน แล้วชื่อตรงตัว (normName) ห้ามเดา
     ชื่อที่คล้าย (ต่างแค่คำนำหน้า/ช่องว่าง) ไม่เพิ่มซ้ำ แต่รายงานให้ตรวจ ; ไม่ลบครูที่มีอยู่ */
  function mergeStaff(model, list) {
    const strip = n => normName(n).replace(/^((ว่าที่\s*ร\.?ต\.?\s*(หญิง)?|ดร\.|นางสาว|น\.ส\.|นาย|นาง|ครู)\s*)+/, '').replace(/\s/g, '');
    const byE = {}, byN = {}, bare = {};
    Object.values(model.teachers).forEach(t => { if (t.email) byE[t.email.toLowerCase()] = t; byN[t.name] = t; (bare[strip(t.name)] || (bare[strip(t.name)] = [])).push(t); });
    const res = { added: [], updated: [], same: 0, similar: [], skipped: 0 };
    if (!model.roles) model.roles = [];
    (list || []).forEach(x => {
      const name = normName(x.name), em = String(x.email || '').trim().toLowerCase(), area = normName(x.area || '');
      if (!name || TEMP_NAME.test(name)) { res.skipped++; return; }   // ตำแหน่งว่างจาก EMS ไม่ใช่ครู (ถ้ารับครูจริงแล้วจะไม่ถูกเพิ่มกลับ)
      let t = (em && byE[em]) || byN[name];
      if (t && em && byE[em] && byE[em] !== byN[name] && byN[name]) { res.similar.push({ name: name, with: t.name, why: 'อีเมลเป็นของ ' + t.name }); return; }
      if (!t) {
        const near = bare[strip(name)];
        if (near && near.length) { res.similar.push({ name: name, with: near.map(n => n.name).join(', '), why: 'ชื่อคล้าย' }); return; }
        const id = 'tn:' + name;
        t = model.teachers[id] = { id: id, name: name, email: em, area: area, unavail: [], roles: [] };
        byN[name] = t; if (em) byE[em] = t; (bare[strip(name)] || (bare[strip(name)] = [])).push(t);
        res.added.push(name);
      } else {
        const ch = [];
        if (em && !t.email) { t.email = em; byE[em] = t; ch.push('อีเมล'); }
        if (area && !t.area) { t.area = area; ch.push('กลุ่มสาระ'); }
        if (ch.length) res.updated.push(t.name + ' (' + ch.join(', ') + ')'); else res.same++;
      }
      (x.roles || []).map(r => normName(r).replace(/ฯ$/, '')).filter(r => r && !/^(ครู|ครูผู้สอน|teacher|admin|ผู้ดูแลระบบ|บุคลากร.*|ตำแหน่งว่าง.*|vacant)$/i.test(r)).forEach(r => { if (!t.roles) t.roles = []; if (!t.roles.includes(r)) t.roles.push(r); if (!model.roles.includes(r)) model.roles.push(r); });
    });
    return res;
  }

  /** อ่านไฟล์บุคลากร (.xlsx/.csv) — มีหัวตาราง (ชื่อ/อีเมล/กลุ่มสาระ) หรือไม่มีหัวแบบไฟล์ของ EMS (คำนำหน้า ชื่อ สกุล อีเมล โทร ตำแหน่ง กลุ่ม)
      เอาเฉพาะครู/ผู้บริหาร (ตำแหน่งที่มีคำว่า ครู/ผู้อำนวยการ หรือไม่มีคอลัมน์ตำแหน่ง) */
  function parseStaffRows(rows) {
    rows = (rows || []).filter(r => r && r.some(x => String(x == null ? '' : x).trim()));
    const PRE = /^(นาย|นางสาว|นาง|น\.ส\.|ว่าที่.*|ดร\.?|mr\.?|mrs\.?|ms\.?|miss)$/i, s = (r, i) => i >= 0 && r[i] != null ? String(r[i]).trim() : '';
    let hi = rows.findIndex((r, i) => i < 5 && r.some(x => /ชื่อ|name/i.test(String(x))) && !r.some(x => /@/.test(String(x))));
    let ci;
    if (hi >= 0) {
      const h = rows[hi].map(normHead), col = (re, not) => h.findIndex(x => re.test(x) && !(not && not.test(x)));
      ci = { pre: col(/^คำนำหน้า/), last: col(/^(นามสกุล|สกุล)$/), n: col(/^(ชื่อ-?สกุล|ชื่อ-?นามสกุล|ชื่อครู|ชื่อ|name|ชื่อผู้สอน)/i, /สกุล$|^นามสกุล/), e: col(/อีเมล|e-?mail|mail/i), d: col(/กลุ่มสาระ|กลุ่มงาน|ฝ่าย|dept/i), r: col(/บทบาท|role/i), pos: col(/ตำแหน่ง/) };
      if (ci.n < 0) ci.n = col(/ชื่อ/, /สกุล$|^นามสกุล/);
    } else {
      const sample = rows.slice(0, 60), score = re => { const n = Math.max(...sample.map(r => r.length)), a = []; for (let i = 0; i < n; i++) a.push(sample.filter(r => re.test(String(r[i] == null ? '' : r[i]).trim())).length); const m = Math.max(...a); return m > 0 ? a.indexOf(m) : -1; };
      const pre = score(PRE);
      ci = { pre: pre, n: pre >= 0 ? pre + 1 : 0, last: pre >= 0 ? pre + 2 : 1, e: score(/^[^@\s]+@[^@\s]+\.[^@\s]+$/), pos: score(/ครู|ผู้อำนวยการ|เจ้าหน้าที่|ลูกจ้าง|พนักงาน|นักการ/), d: score(/^(กลุ่ม|งาน|ฝ่าย)/), r: -1 };
      if (ci.d === ci.pos) ci.d = -1;
    }
    const out = [];
    rows.slice(hi + 1).forEach(r => {
      const pos = s(r, ci.pos);
      if (ci.pos >= 0 && pos && !/ครู|ผู้อำนวยการ/.test(pos)) return;
      const name = normName((s(r, ci.pre) + s(r, ci.n) + (ci.last >= 0 && s(r, ci.last) ? ' ' + s(r, ci.last) : '')).trim());
      if (!name || /@/.test(name)) return;
      out.push({ name: name, email: s(r, ci.e).toLowerCase(), area: normName(s(r, ci.d).replace(/^กลุ่มสาระการเรียนรู้\s*/, '')), roles: ci.r >= 0 && s(r, ci.r) ? s(r, ci.r).split(/[,،、/]+/).map(x => x.trim()).filter(Boolean) : [] });
    });
    return out;
  }

  /* ---------- ภาระงานสอน (ก่อนจัดตาราง) ----------
     หัวหน้ากลุ่มสาระกรอก "ใครสอนวิชาอะไร ห้องไหน กี่คาบ/สัปดาห์ คาบคู่กี่ชุด" ไม่ต้องมีวัน/คาบ
     นำเข้าแล้วกลายเป็นบัตรในถาด (pool) รอให้ลากวางหรือจัดอัตโนมัติ
     คงของเดิมไว้: ครู (เวลาไม่ว่าง/บทบาท) ห้อง สถานที่ ตั้งค่า เงื่อนไข ประชุม และกิจกรรมร่วมที่ไม่ระบุครู */
  const LOAD_HEAD = ['กลุ่มสาระ', 'ชื่อครู', 'อีเมลครู', 'รหัสวิชา', 'ชื่อวิชา', 'ห้องเรียน', 'คาบ/สัปดาห์', 'คาบคู่ (ชุด)', 'สถานที่', 'หมายเหตุ'];

  /** สรุปภาระงานจากตารางที่มีอยู่ (คาบที่ลงแล้ว + บัตรในถาด) เป็นแถวแม่แบบ — ใช้ภาค 1 เป็นร่างของภาค 2 */
  function exportLoadRows(model, area) {
    // หนึ่งแถวต่อ ครู|วิชา|ห้อง|สถานที่ — วิชาที่ใช้หลายสถานที่ (Lab + ห้องปกติ) ไม่หายไปเหลือห้องเดียว
    const g = new Map(), key = x => x.teacherId + '|' + x.subjectId + '|' + x.classId + '|' + (x.room || '');
    const at = k => g.get(k) || g.set(k, { t: '', s: '', c: '', room: '', slots: [], cards: [] }).get(k);
    Object.values(model.entries).forEach(e => { if (!e.teacherId) return; const r = at(key(e)); r.t = e.teacherId; r.s = e.subjectId; r.c = e.classId; r.room = e.room || ''; r.slots.push(e); });
    Object.values(model.pool).forEach(p => { if (!p.teacherId) return; const r = at(key(p)); r.t = p.teacherId; r.s = p.subjectId; r.c = p.classId; r.room = p.room || ''; r.cards.push(p); });
    const out = [];
    g.forEach(r => {
      const t = model.teachers[r.t] || {}, s = model.subjects[r.s] || {}, c = model.classes[r.c] || {};
      const ar = t.area || s.area || '';
      if (area && ar !== area) return;
      // คาบคู่ = คาบติดกันวันเดียวกัน สถานที่เดียวกัน (แยกกลุ่มตามสถานที่แล้ว) จับคู่ทีละสอง (3 คาบติด = คู่ 1 + เดี่ยว 1)
      let dbl = 0; const by = {};
      r.slots.forEach(e => { (by[e.day] || (by[e.day] = [])).push(e.slot); });
      Object.values(by).forEach(a => { a.sort((x, y) => x - y); for (let i = 0; i + 1 < a.length; i++) if (a[i + 1] === a[i] + 1) { dbl++; i++; } });
      let per = r.slots.length;
      r.cards.forEach(p => { const sp = p.span || 1; per += sp; dbl += Math.floor(sp / 2); });
      out.push([ar, t.name || '', t.email || '', s.code || '', s.name || '', c.name || '', per, dbl, r.room, '']);
    });
    out.sort((a, b) => a[0].localeCompare(b[0], 'th') || a[1].localeCompare(b[1], 'th') || a[3].localeCompare(b[3], 'th') || a[5].localeCompare(b[5], 'th', { numeric: true }));
    return [LOAD_HEAD].concat(out);
  }

  /** files = [{name, rows}] ; base = โมเดลเดิม (ภาคก่อน) — คืน { model, issues:[{file,row,level:'bad'|'warn',msg}], stats } */
  function parseLoad(files, base) {
    const model = base ? JSON.parse(JSON.stringify(base)) : newModel();
    model.entries = {}; model.pool = {}; model.cloud = null;
    if (base) Object.values(base.entries).forEach(e => { if (!e.teacherId) model.entries[e.id] = JSON.parse(JSON.stringify(e)); });   // กิจกรรมร่วมคงไว้
    if (base) Object.values(base.pool || {}).forEach(p => { if (!p.teacherId) model.pool[p.id] = JSON.parse(JSON.stringify(p)); });   // บัตรกิจกรรมร่วมในถาดก็คงไว้
    const hasT = !!(base && Object.keys(base.teachers || {}).length), hasC = !!(base && Object.keys(base.classes || {}).length);   // ข้อมูลเดิมว่าง = ไม่เตือน "ไม่มีในข้อมูลเดิม"
    migrate(model);
    const issues = [], add = (f, row, level, msg) => issues.push({ file: f, row: row, level: level, msg: msg });
    const byEmail = {}, byName = {}, bare = {};
    const strip = n => normName(n).replace(/^(ว่าที่\s*ร\.?ต\.?\s*(หญิง)?|ดร\.|นางสาว|น\.ส\.|นาย|นาง|ครู)\s*/, '').replace(/\s/g, '');
    const indexT = t => { if (t.email) byEmail[t.email.toLowerCase()] = t; byName[t.name] = t; (bare[strip(t.name)] || (bare[strip(t.name)] = [])).push(t); };
    Object.values(model.teachers).forEach(indexT);
    // ห้องเรียน: เทียบด้วยชื่อมาตรฐาน ม.4/9ญ (ไม่มีช่องว่าง) — "ม 4/9", "ม.4/9 ญ" จึงเป็นห้องเดียวกับของเดิม
    const canonC = n => { const ci = classInfo(n); return ci.level ? 'ม.' + ci.level + '/' + ci.room + ci.suffix.replace(/\s/g, '') : normName(n); };
    const byC = {}; Object.values(model.classes).forEach(c => { byC[canonC(c.name)] = c; });
    const seen = {}, pairT = {}, newT = {};
    let rowsN = 0;
    (files || []).forEach(f => {
      const rows = f.rows || [];
      let h = rows.findIndex((r, i) => i < 6 && (r || []).some(x => /รหัสวิชา/.test(String(x))));
      if (h < 0) { add(f.name, 0, 'bad', 'ไม่พบแถวหัวตาราง (ต้องมีคอลัมน์ “รหัสวิชา”) — ข้ามไฟล์นี้'); return; }
      // หาหัวตรงตัวก่อน แล้วค่อยหาแบบมีคำ — not = หัวที่ห้ามจับ (เช่น คาบ/สัปดาห์ ห้ามจับ "จำนวนคาบคู่")
      const heads = rows[h].map(normHead), col = (ns, not) => { const ws = ns.map(normHead), okH = x => !not || !not.test(x), i = heads.findIndex(x => okH(x) && ws.includes(x)); return i >= 0 ? i : heads.findIndex(x => okH(x) && ws.some(n => x.includes(n))); };
      const ix = { area: col(['กลุ่มสาระ']), teacher: col(['ชื่อครู', 'ครูผู้สอน']), email: col(['อีเมล', 'email']), code: col(['รหัสวิชา']), subj: col(['ชื่อวิชา', 'รายวิชา']),
        cls: col(['ห้องเรียน', 'ชั้นเรียน']), per: col(['คาบ/สัปดาห์', 'คาบต่อสัปดาห์', 'จำนวนคาบ'], /คู่/), dbl: col(['คาบคู่']), room: col(['สถานที่', 'ห้องสอน']) };
      const miss = [['ชื่อครู', ix.teacher], ['รหัสวิชา', ix.code], ['ห้องเรียน', ix.cls], ['คาบ/สัปดาห์', ix.per]].filter(x => x[1] < 0).map(x => x[0]);
      if (miss.length) { add(f.name, h + 1, 'bad', 'ขาดคอลัมน์: ' + miss.join(', ') + ' — ข้ามไฟล์นี้'); return; }
      const get = (r, i) => i >= 0 && r[i] != null ? String(r[i]).trim() : '';
      rows.slice(h + 1).forEach((r, n) => {
        const row = h + n + 2, tname = normName(get(r, ix.teacher)), code = normName(get(r, ix.code)), cname = normName(get(r, ix.cls));
        const perS = get(r, ix.per), dblS = get(r, ix.dbl);
        if (!tname && !code && !cname && !perS) return;
        rowsN++;
        if (!tname || !code || !cname) { add(f.name, row, 'bad', 'ขาด' + [!tname && 'ชื่อครู', !code && 'รหัสวิชา', !cname && 'ห้องเรียน'].filter(Boolean).join(' ') + ' (ข้ามแถวนี้)'); return; }
        const cuB = (model.curriculum || {})[normName(get(r, ix.code)).replace(/\s/g, '')], per = Number(perS);
        // ช่องคาบคู่ว่าง + คาบตรงกับหลักสูตร → ใช้รูปแบบแบ่งคาบของหลักสูตร
        const dbl = dblS === '' ? (cuB && cuB.periods === per ? (cuB.block || []).filter(x => x === 2).length : 0) : Number(dblS);
        if (!Number.isInteger(per) || per < 1 || per > 20) { add(f.name, row, 'bad', 'คาบ/สัปดาห์ “' + perS + '” ไม่ใช่จำนวนเต็ม 1–20 (ข้ามแถวนี้)'); return; }
        if (!Number.isInteger(dbl) || dbl < 0 || dbl * 2 > per) { add(f.name, row, 'bad', 'คาบคู่ ' + dblS + ' ชุด เกินคาบ/สัปดาห์ ' + per + ' (ข้ามแถวนี้)'); return; }
        // ครู: อีเมลก่อน แล้วชื่อตรงตัว — ไม่เดาชื่อคล้าย แค่บอกให้ตรวจ
        const em = get(r, ix.email).toLowerCase();
        // อีเมลตรงแต่ชื่อในแถวเป็นอีกคน (เช่น แก้ชื่อครูในแม่แบบที่เติมจากภาคก่อนแต่ลืมแก้อีเมล) — ไม่เดาว่าใครถูก
        const byE = em && byEmail[em];
        if (byE && strip(byE.name) !== strip(tname)) { add(f.name, row, 'bad', 'อีเมล ' + em + ' เป็นของครู “' + byE.name + '” แต่ชื่อในแถวเป็น “' + tname + '” — ข้ามแถวนี้ (แก้ชื่อหรืออีเมลให้ตรงกัน)'); return; }
        const ci = classInfo(cname), cn = canonC(cname);
        let cl = byC[cn];
        if (!cl && !ci.level) { add(f.name, row, 'bad', 'ห้องเรียน “' + cname + '” ไม่อยู่ในรูปแบบ ม.x/y (เช่น ม.4/1, ม.4/9ญ) — ข้ามแถวนี้'); return; }
        let t = byE || byName[tname];
        if (!t) {
          const tid = 'tn:' + tname;
          t = model.teachers[tid] = { id: tid, name: tname, email: em, area: normName(get(r, ix.area)), unavail: [], roles: [] };
          const near = (bare[strip(tname)] || []).filter(x => x !== t);
          newT[tid] = 1;
          if (hasT && !TEMP_NAME.test(tname)) add(f.name, row, 'warn', 'ครู “' + tname + '” ไม่มีในข้อมูลเดิม — เพิ่มเป็นครูใหม่' + (near.length ? ' (ชื่อคล้าย: ' + near.map(x => x.name).join(', ') + ' ตรวจการสะกด)' : ''));
          indexT(t);
        } else if (em && !t.email) t.email = em;
        if (!t.area && get(r, ix.area)) t.area = normName(get(r, ix.area));
        if (!cl) {

  /** ตรวจช่องปลายทาง: กฎชน + กิจกรรมร่วมต้องวางในมุมมองห้อง/สถานที่ + วิชาที่ให้ระบบเลือกสถานที่ต้องมีห้องว่าง */
  function dropCheck(d, day, slot) {
    if (d.joint && S.mode === 'teacher') return { ok: false, why: ['กิจกรรมร่วมวางในมุมมองห้องเรียนหรือสถานที่'] };

  /* ---------- สลับคาบ: บัตรที่เลือก (A) ↔ บัตรในช่องปลายทาง (B) ของมุมมองนี้ — คาบคู่ย้ายทั้งก้อน ตรวจชนทั้งสองฝั่งก่อน ---------- */
  function doSwap(d2, s2, bid) {
    const m = M(), A = TT.moveUnit(m, S.idx, S.swap); S.swap = '';
    if (!A.length) return render();
    // B = บัตรที่คลิก (ช่องที่มีหลายบัตร เช่น สถานที่ใช้ร่วม/กลุ่มย่อยพี่น้อง) ไม่งั้นบัตรแรกในช่อง
    const at = viewEntries().filter(e => e.day === d2 && e.slot === s2), bId = bid && m.entries[bid] ? bid : at.length ? at[0].id : '', B = bId ? TT.moveUnit(m, S.idx, bId) : [];
    const aIds = new Set(A.map(x => x.id)); if (B.some(x => aIds.has(x.id))) { render(); return toast('เลือกช่องอื่นที่ไม่ใช่บัตรเดิม', true); }
    if (A.concat(B).some(x => x.locked)) { render(); return toast('มีคาบที่ล็อกอยู่ ปลดล็อกก่อน', true); }
    const offA = A.map(x => x.slot - Math.min(...A.map(y => y.slot))), offB = B.map(x => x.slot - Math.min(...B.map(y => y.slot)));
    const d1 = A[0].day, sA = Math.min(...A.map(x => x.slot)), sB = B.length ? Math.min(...B.map(x => x.slot)) : s2;
    // วันเดียวกันแต่ยาวไม่เท่ากัน: สลับลำดับในช่วงเดิม (ก้อนที่ขึ้นหน้ายึดคาบแรก ก้อนหลังยึดคาบท้าย) กันสองก้อนทับกันเอง
    const lA = Math.max(...offA) + 1, lB = B.length ? Math.max(...offB) + 1 : 0; let pA = sB, pB = sA;
    if (B.length && d1 === d2 && lA !== lB) {
      if (sA < sB + lB && sB < sA + lA) { render(); return toast('บล็อกยาวไม่เท่ากันซ้อนช่วงเดียวกัน — ลากย้ายแทน', true); }
      if (sA < sB) pA = sB + lB - lA; else pB = sA + lA - lB;
    }
    const A2 = A.map((x, i) => Object.assign({}, x, { day: d2, slot: pA + offA[i] })), B2 = B.map((x, i) => Object.assign({}, x, { day: d1, slot: pB + offB[i] }));
    // ตรวจ: เอา A,B ออกจากดัชนี วาง A ใหม่ชั่วคราว แล้วตรวจ B ใหม่ (กันสองก้อนชนกันเอง) แล้วคืนดัชนีเดิม
    const all = A.concat(B); all.forEach(x => S.idx.remove(x));
    const blkA = A2.slice(); blkA.offs = offA;
    let r = S.idx.canPlace(blkA, d2, pA), r2 = { ok: true, why: [] };
    if (r.ok && B2.length) { A2.forEach(x => S.idx.add(x)); const blkB = B2.slice(); blkB.offs = offB; r2 = S.idx.canPlace(blkB, d1, pB); A2.forEach(x => S.idx.remove(x)); }
    all.forEach(x => S.idx.add(x));

  /* ---------- จัดอัตโนมัติ (Worker) ---------- */
  function solveInWorker(payload) {
    return new Promise(res => {
      let done = false; const fallback = () => { if (done) return; done = true; setTimeout(() => res(TT.runSolve(payload)), 30); };
      try {
        const src = document.getElementById('core').textContent + ';self.onmessage=function(e){postMessage(TT.runSolve(e.data))}';
        const w = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
        w.onmessage = e => { done = true; w.terminate(); res(e.data); };
        w.onerror = () => { w.terminate(); fallback(); };
        w.postMessage(payload);
      } catch (e) { fallback(); }
    });
  }
  const lightModel = (entries, pool) => { const m = M(); return { settings: m.settings, teachers: m.teachers, classes: m.classes, subjects: m.subjects, locations: m.locations, meetings: m.meetings || {}, roles: m.roles || [], ref: m.ref || null, entries: entries, pool: pool }; };

  async function runAuto(scope) {
    const m = M(); if (S.busy) return;
    let entries = Object.assign({}, m.entries), pool = Object.assign({}, m.pool), remove = [];
    // เงื่อนไข "ล็อกคาบสำคัญ": ล็อกคาบที่ตรงก่อนถอน ไม่ให้ระบบย้าย และบันทึกการล็อกไว้เมื่อกดใช้ผล
    const match = TT.ruleMatcher(m), lockRules = (m.settings.solveRules || []).filter(r => r.on && r.type === 'lock' && !TT.ruleEmpty(r.sel));
    const lockIds = new Set(Object.values(m.entries).filter(e => !e.locked && lockRules.some(r => match(r.sel, e))).map(e => e.id));
    const isLocked = x => x.locked || lockIds.has(x.id);
    if (scope) {   // จัดใหม่: ถอนของที่ไม่ล็อกในขอบเขตออกมาเป็นการ์ดก่อน
      const inScope = e => scope === 'all' || (S.mode === 'teacher' ? e.teacherId === S.sel.teacher : S.mode === 'class' ? (S.idx.rel[S.sel.class] || new Set()).has(e.classId) && e.classId === S.sel.class : e.room === S.sel.loc);
      const seen = new Set();
      Object.values(m.entries).filter(e => e.teacherId && inScope(e) && !isLocked(e)).forEach(e => {
        if (seen.has(e.id)) return; const blk = TT.blockOf(m, S.idx, e.id).filter(x => !isLocked(x) && inScope(x)); if (!blk.length) return;
        blk.forEach(x => { seen.add(x.id); delete entries[x.id]; remove.push(x.id); });
        const id = TT.nextId(m, 'p'); pool[id] = { id: id, teacherId: e.teacherId, subjectId: e.subjectId, classId: e.classId, room: e.room, span: blk.length };
      });
    }
    const ids = Object.keys(pool); if (!ids.length) return toast('ไม่มีคาบให้จัด');
    const onRules = (m.settings.solveRules || []).filter(r => r.on), hardN = onRules.filter(r => r.hard).length;
    S.busy = 'auto'; modal('กำลังจัดตาราง…', '<p>ระบบกำลังลองวางบัตรวิชา ' + ids.length + ' ใบ โดยไม่ให้ชนกัน ใช้เวลาไม่กี่วินาที</p>', []);
    const res = await solveInWorker({ model: lightModel(entries, pool), cardIds: ids, timeMs: ids.length > 600 ? 20000 : 8000, seed: (Date.now() % 100000) + 1 });
    S.busy = ''; $('#modalRoot').innerHTML = '';

    modal('ผลการจัดอัตโนมัติ', '<div class="kpis"><div><b class="num">' + okN + '</b><span>ใบที่จัดลงได้</span></div><div><b class="num ' + (badN ? 'bad' : '') + '">' + badN + '</b><span>ใบที่ยังหาที่ลงไม่ได้</span></div></div>' +
      (onRules.length ? '<p class="q">ใช้เงื่อนไข ' + onRules.length + ' ข้อ' + (lockIds.size ? ' · ล็อกคาบสำคัญ ' + lockIds.size + ' คาบ' : '') + '</p>' : '') +

      '<p class="q">ทุกใบที่ลงจะไม่ชนกับครู ห้องเรียน สถานที่ หรือเวลาที่ครูไม่ว่าง' + (remove.length ? ' · จะถอน ' + remove.length + ' คาบเดิมที่ไม่ล็อกออกก่อนแล้วจัดใหม่' : '') + ' · ยืนยันแล้วย้อนกลับได้ด้วย Ctrl+Z</p>', [

  function editCurriculum(t) {

    if (!window.firebase) { await scriptLoad('../vendor/firebase-app-compat.js'); await scriptLoad('../vendor/firebase-auth-compat.js'); await scriptLoad('../vendor/firebase-firestore-compat.js'); }

    S.fb = { auth: firebase.auth(app), db: firebase.firestore(app), user: null, admin: false, periods: [] };
    S.fb.auth.onAuthStateChanged(async u => { S.fb.user = u; S.fb.admin = false; if (u) { try { const d = await S.fb.db.collection('staff').doc(TT.fbStaffId(u.email)).get(); S.fb.admin = !!(d.exists && (d.data().roles || []).includes('admin')); } catch (e) { /* อ่านสิทธิ์ไม่ได้ */ } } if (S.tab === 'sync') render(); });

  const decodeNested = v => Array.isArray(v) ? v.map(decodeNested) : v && typeof v === 'object' ? (Array.isArray(v.__arr) ? decodeNested(v.__arr) : Object.keys(v).reduce((o, k) => { o[k] = decodeNested(v[k]); return o; }, {})) : v;
  async function fetchCloud(periodId) {
    const db = S.fb.db, sh = async n => { const d = await db.collection('shared').doc(n).get({ source: 'server' }); return d.exists ? decodeNested(d.data().items) || [] : []; };
    const staffSnap = await db.collection('staff').get({ source: 'server' });
    const staff = staffSnap.docs.map(d => Object.assign({ email: d.id }, d.data())).filter(s => s.active !== false);
    const [classes, subjects, periods] = await Promise.all([sh('classes'), sh('subjects'), sh('periods')]);
    let timetable = null;
    if (periodId) { const d = await db.collection('timetable').doc(periodId).get({ source: 'server' }); timetable = d.exists ? decodeNested(d.data()) : { entries: [], exceptions: [], term: null }; }
    return { staff: staff, classes: classes.map(c => ({ id: c.id, name: c.name })), subjects: subjects, periods: periods, timetable: timetable };
  }

      case 'emsStaff': { const h = lsJ(EK_IN); if (!h || !(h.staff || []).length) return toast('ยังไม่มีรายชื่อจาก EMS — ในหน้า EMS (ตั้งค่าโรงเรียน › ตารางสอนทั้งโรงเรียน) กด “ส่งตาราง/รายชื่อครูให้แอปจัด” ก่อน', true); return staffMergeDialog(h.staff, 'EMS'); }
      case 'staffIn': return $('#staffFile').click();
      case 'loadIn': { const inp = $('#loadFile'); if (inp) return inp.click(); S.tab = 'set'; render(); return setTimeout(() => $('#loadFile').click(), 50); }
      case 'xlsxMatrix': return XLSX.writeFile(matrixWorkbook(), 'ตารางรายคนรายห้อง-' + (m.period.year || '') + '.xlsx');
      case 'jsonOut': return dl('สำรองตารางสอน-' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify(m), 'application/json');
      case 'demo': return demo();
      case 'addJoint': return jointDialog();
      case 'lunch': { const v = el.dataset.v; m.settings.lunch = v === 'split' ? Object.assign({}, TT.DEFAULT_LUNCH) : { 1: +v, 2: +v, 3: +v, 4: +v, 5: +v, 6: +v }; changed(); render(); return toast('ตั้งพักเที่ยงแล้ว · คาบที่ตกเวลาพัก ' + TT.report(m).lunch.length); }
      case 'addRole': return addRole(); case 'delRole': return delRole(el.dataset.role); case 'giveRole': return giveRole(el.dataset.role); case 'takeRole': return takeRole(el.dataset.role, el.dataset.tid);
      case 'addMtg': return addMeeting(); case 'delMtg': return delMeeting(el.dataset.mid); case 'quickRole': $('#nrN').value = el.dataset.v; return addRole();
      case 'addSubj': return addSubject(); case 'addLoc': return addLocation(); case 'addCls': return addClassRoom();
      case 'delSubj': return delSubject(el.dataset.sid); case 'delLoc': return delLocation(el.dataset.lid);
      case 'moreRes': S.resLimit = (S.resLimit || 100) + 200; return render();
      case 'wipe': return modal('ล้างข้อมูลในเครื่องนี้?', '<p>ลบตารางและรายชื่อที่เก็บในเบราว์เซอร์นี้ทั้งหมด รวมสำเนาสำหรับย้อนกลับ — ย้อนกลับไม่ได้ (ข้อมูลใน KruSpace ไม่ถูกแตะ)</p>', [{ label: 'ยกเลิก' }, { label: 'ล้าง', cls: 'bad', act: () => { useModel(TT.newModel()); idbPut('lastSnap', null); idbPut('model', M()); render(); toast('ล้างแล้ว — ข้อมูลในเครื่องนี้ถูกลบหมด (ย้อนกลับไม่ได้)'); } }]);   // ไม่เก็บสำเนา: เครื่องใช้ร่วมกัน คนถัดไปต้องกู้ไม่ได้
      case 'fbStart': return fbInit().then(() => render()).catch(e => toast('เชื่อมต่อไม่สำเร็จ: ' + e.message, true));
      case 'fbLogin': return fbInit().then(() => S.fb.auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())).catch(e => toast('เข้าสู่ระบบไม่สำเร็จ: ' + e.message, true));
      case 'fbLogout': return S.fb.auth.signOut().then(() => { S.fb.periods = []; render(); });
      case 'fbPeriods': return fbPeriods(); case 'fbLoad': return fbLoad(el.dataset.pid); case 'fbPublish': return fbPublish();
    }
  }
  /* fbStart ต้องเริ่มระบบก่อนถึงจะแสดงปุ่มเข้าสู่ระบบ */
  const _da = doAct;

  /* ================= เริ่มต้น ================= */
  (async function boot() {
    const saved = await idbGet('model');
    if (saved && saved.entries) { try { useModel(saved); } catch (e) { useModel(TT.newModel()); } } else useModel(TT.newModel());
    if (S.model.settings.maxSlot === undefined) S.model.settings = TT.newModel().settings;
    const ls = await idbGet('lastSnap'); if (ls && ls.snap) S.hist.undo.push({ label: ls.label + ' (ครั้งล่าสุด)', snap: ls.snap });
    render();
    window.__TT = { S: S, render: render };   // ไว้ตรวจในเบราว์เซอร์
  })();
})();

</script>
</body>
</html>
