<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>จัดตารางสอน · KruSpace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f3ee; --panel: #fbfaf7; --ink: #1a211d; --ink2: #5b655f; --line: #d9d5cb; --line2: #ece8de;
  --accent: #0d6b4d; --accent-ink: #fff; --bad: #c22f1f; --bad-bg: #fbe3df; --ok-bg: #dcefe4; --warn: #9a6a00;
  --w-quiet: 300; --w-body: 400; --w-loud: 800;
  --r: 4px;
  --f: 'Sarabun', 'Leelawadee UI', 'Noto Sans Thai', Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12160f; --panel: #181d16; --ink: #e7eae2; --ink2: #98a294; --line: #2c3429; --line2: #212820;
    --accent: #52c79a; --accent-ink: #08130e; --bad: #ff8b7a; --bad-bg: #3a1c17; --ok-bg: #173226; --warn: #e1b04a;
  }
}
:root[data-theme="dark"] {
  --bg: #12160f; --panel: #181d16; --ink: #e7eae2; --ink2: #98a294; --line: #2c3429; --line2: #212820;
  --accent: #52c79a; --accent-ink: #08130e; --bad: #ff8b7a; --bad-bg: #3a1c17; --ok-bg: #173226; --warn: #e1b04a;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: var(--w-body) 15px/1.7 var(--f); }
button, input, select { font: inherit; color: inherit; }
b, .loud { font-weight: var(--w-loud); }
.q { font-weight: var(--w-quiet); color: var(--ink2); }
.num { font-variant-numeric: tabular-nums; }

/* ---------- แถบบน ---------- */
header.top { display: flex; align-items: baseline; gap: 28px; padding: 14px 24px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
header.top h1 { margin: 0; font-size: 26px; font-weight: var(--w-loud); line-height: 1.3; white-space: nowrap; }
header.top .per { font-weight: var(--w-quiet); color: var(--ink2); }
nav.tabs { display: flex; gap: 22px; flex: 1; flex-wrap: wrap; }
nav.tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 0 7px; cursor: pointer; color: var(--ink2); font-size: 15px; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-color: var(--accent); font-weight: var(--w-loud); }
.tools { display: flex; gap: 6px; align-items: center; padding-bottom: 8px; margin-left: auto; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: var(--r); padding: 3px 12px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--ink2); }
.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: var(--w-loud); }
.btn.bad { color: var(--bad); }
.btn[disabled] { opacity: .4; cursor: default; }
.btn.sm { padding: 0 8px; font-size: 13px; }

/* ---------- โครงหน้า จัดตาราง ---------- */
main { padding: 0; }
.work { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: calc(100vh - 62px); }
aside.rail { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; max-height: calc(100vh - 62px); position: sticky; top: 0; align-self: start; }
.seg { display: flex; border-bottom: 1px solid var(--line); }
.seg button { flex: 1; border: 0; background: none; padding: 8px 0; cursor: pointer; color: var(--ink2); border-bottom: 3px solid transparent; }
.seg button[aria-pressed="true"] { color: var(--ink); font-weight: var(--w-loud); border-color: var(--ink); }
.rail input[type=search] { margin: 10px 12px; padding: 5px 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); }
.list { overflow: auto; flex: 1; padding-bottom: 12px; }
.list .grp { padding: 10px 14px 2px; font-size: 13px; color: var(--ink2); font-weight: var(--w-quiet); }
.list button { display: flex; width: 100%; gap: 8px; justify-content: space-between; background: none; border: 0; text-align: left; padding: 2px 14px; cursor: pointer; line-height: 1.6; }
.list button:hover { background: var(--line2); }
.list button[aria-current="true"] { background: var(--ink); color: var(--bg); }
.list .n { color: var(--ink2); font-size: 13px; }
.list button[aria-current="true"] .n { color: var(--bg); opacity: .7; }
.list .dot { color: var(--bad); font-weight: var(--w-loud); }
.stage { padding: 18px 24px 60px; min-width: 0; }
.stage h2 { margin: 0; font-size: 34px; line-height: 1.35; font-weight: var(--w-loud); text-wrap: balance; }
.stage .sub { margin: 0 0 14px; color: var(--ink2); font-weight: var(--w-quiet); }

/* ---------- กริดตาราง ---------- */
table.grid { border-collapse: collapse; width: 100%; table-layout: fixed; background: var(--panel); }
.grid th, .grid td { border: 1px solid var(--line); padding: 0; height: 74px; vertical-align: top; }
.grid thead th { height: auto; padding: 4px 2px; font-weight: var(--w-body); background: var(--bg); }
.grid thead th small { display: block; color: var(--ink2); font-weight: var(--w-quiet); font-size: 12px; line-height: 1.3; }
.grid tbody th { width: 74px; font-weight: var(--w-loud); background: var(--bg); vertical-align: middle; text-align: center; }
.grid td.drop-ok { background: var(--ok-bg); outline: 2px solid var(--accent); outline-offset: -2px; }
.grid td.drop-no { background: var(--bad-bg); }
.grid td.un { background: repeating-linear-gradient(135deg, transparent 0 6px, var(--line2) 6px 7px); }
.grid td.un::after { content: '✕ ไม่ว่าง'; display: block; text-align: center; color: var(--ink2); font-size: 12px; padding-top: 24px; }
.blk { --h: 200; position: relative; height: 100%; padding: 3px 6px 3px 9px; border-left: 5px solid hsl(var(--h) 45% 48%); background: hsl(var(--h) 55% 95%); cursor: grab; font-size: 13px; line-height: 1.4; overflow: hidden; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .blk { background: hsl(var(--h) 25% 17%); } }
:root[data-theme="dark"] .blk { background: hsl(var(--h) 25% 17%); }
.blk .a { font-weight: var(--w-loud); font-size: 13.5px; display: block; }
.blk .b, .blk .c { display: block; color: var(--ink2); font-weight: var(--w-body); }
.blk.bad { background: var(--bad-bg); border-left-color: var(--bad); }
.blk.sel { outline: 2px solid var(--ink); outline-offset: -2px; }
.blk .lk { position: absolute; right: 4px; top: 1px; font-size: 11px; color: var(--ink2); }
.blk + .blk { border-top: 1px dashed var(--line); }
.blk.dragging { opacity: .35; }
.bar { margin: 10px 0 0; display: flex; gap: 8px; align-items: center; min-height: 32px; flex-wrap: wrap; }
.bar .info { margin-right: auto; }

.tray { margin-top: 26px; border-top: 1px solid var(--ink); padding-top: 8px; }
.tray.over { background: var(--ok-bg); }
.tray h3 { margin: 0; font-size: 20px; font-weight: var(--w-loud); }
.tray .cards { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; min-height: 42px; }
.tray .blk { width: 190px; height: auto; min-height: 56px; border: 1px solid var(--line); border-left: 5px solid hsl(var(--h) 45% 48%); }
.tray .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; }

/* ---------- ตรวจชน / อาคาร / ตั้งค่า ---------- */
.page { padding: 22px 24px 70px; max-width: 1180px; }
.page h2 { margin: 0 0 4px; font-size: 34px; font-weight: var(--w-loud); line-height: 1.35; }
.page h3 { margin: 34px 0 6px; font-size: 20px; font-weight: var(--w-loud); border-top: 1px solid var(--ink); padding-top: 8px; }
.kpis { display: flex; gap: 0; margin: 14px 0 0; flex-wrap: wrap; }
.kpis div { padding: 0 28px 0 0; margin-right: 28px; border-right: 1px solid var(--line); }
.kpis div:last-child { border: 0; }
.kpis b { display: block; font-size: 44px; line-height: 1.1; font-weight: var(--w-loud); font-variant-numeric: tabular-nums; }
.kpis b.bad { color: var(--bad); }
.kpis span { color: var(--ink2); font-size: 14px; }
table.t { border-collapse: collapse; width: 100%; }
.t th { text-align: left; font-weight: var(--w-quiet); color: var(--ink2); font-size: 13px; border-bottom: 1px solid var(--ink); padding: 3px 8px 3px 0; }
.t td { border-bottom: 1px solid var(--line2); padding: 3px 8px 3px 0; vertical-align: top; }
.t td.r, .t th.r { text-align: right; font-variant-numeric: tabular-nums; }
a.go { color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.ok { color: var(--accent); font-weight: var(--w-loud); }
.bldgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 0 40px; }
.heat { border-collapse: collapse; margin: 6px 0 10px; }
.heat td { width: 30px; height: 22px; text-align: center; font-size: 11px; border: 1px solid var(--bg); color: var(--ink); }
.heat th { font-size: 11px; font-weight: var(--w-quiet); color: var(--ink2); padding: 0 4px; }
.bar1 { height: 6px; background: var(--line2); }
.bar1 i { display: block; height: 100%; background: var(--accent); }
.form { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px 16px; margin-top: 8px; }
.form label { display: block; font-size: 13px; color: var(--ink2); }
.form input, .form select { width: 100%; padding: 4px 8px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); }
.note { border-left: 4px solid var(--warn); padding: 4px 12px; background: var(--panel); margin: 10px 0; }
.note.bad { border-color: var(--bad); }
.note.ok { border-color: var(--accent); }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 6px 18px; border-radius: var(--r); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 50; max-width: 90vw; }
#toast.on { opacity: 1; }
#toast.bad { background: var(--bad); color: #fff; }
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 40; padding: 16px; }
.modal { background: var(--bg); border: 1px solid var(--ink); max-width: 640px; width: 100%; max-height: 90vh; overflow: auto; padding: 18px 22px; }
.modal h3 { margin: 0 0 8px; font-size: 22px; font-weight: var(--w-loud); border: 0; padding: 0; }
.modal .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
.empty { padding: 40px 0; color: var(--ink2); }
.empty h2 { color: var(--ink); }
.cols { display: grid; grid-template-columns: 2fr 5fr; gap: 40px; }

/* ---------- พิมพ์ ---------- */
#printArea { display: none; }
.sheet { page-break-after: always; break-after: page; padding: 0; }
.sheet h1 { margin: 0; font-size: 20px; font-weight: var(--w-loud); }
.sheet .s { margin: 0 0 6px; font-size: 13px; color: #444; }
.sheet table { border-collapse: collapse; width: 100%; table-layout: fixed; }
.sheet th, .sheet td { border: 1px solid #333; padding: 2px 4px; font-size: 11.5px; line-height: 1.3; height: 15mm; vertical-align: top; color: #000; }
.sheet thead th { height: auto; background: #eee; font-weight: 500; }
.sheet thead small { display: block; font-weight: 300; font-size: 10px; }
.sheet tbody th { width: 16mm; background: #eee; text-align: center; vertical-align: middle; }
.sheet td b { font-weight: 800; display: block; }
.sheet .leg { margin-top: 8px; font-size: 11px; columns: 2; }
.prev .sheet { border: 1px solid var(--line); padding: 14px; margin: 14px 0; background: #fff; color: #000; max-width: 1050px; }
@media print {
  @page { size: A4 landscape; margin: 10mm; }
  body { background: #fff; }
  #app, #toast, #modalRoot { display: none !important; }
  #printArea { display: block; }
}
@media (max-width: 900px) {
  .work { grid-template-columns: 1fr; }
  aside.rail { position: static; max-height: 300px; border-right: 0; border-bottom: 1px solid var(--line); }
  .stage h2, .page h2 { font-size: 26px; }
  .stage { padding: 14px 10px 50px; overflow-x: auto; }
  table.grid { min-width: 820px; }
  header.top { padding: 10px 12px 0; gap: 12px; }
  .cols { grid-template-columns: 1fr; gap: 10px; }
}

/* ---------- ส่วนเพิ่ม: กิจกรรมร่วม พักเที่ยง ภาพรวม วิชาและสถานที่ ---------- */
.blk.act { border-left-style: double; border-left-width: 6px; }
.blk.act .b { font-style: italic; }
.grid td.lunch { background: repeating-linear-gradient(45deg, transparent 0 5px, var(--line2) 5px 6px); }
.grid td.lunch::after { content: 'พักเที่ยง'; display: block; text-align: center; color: var(--ink2); font-size: 12px; padding-top: 26px; }
.subseg { display: inline-flex; border: 1px solid var(--ink); margin: 12px 0 4px; }
.subseg button { background: none; border: 0; padding: 3px 18px; cursor: pointer; color: var(--ink2); }
.subseg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); font-weight: var(--w-loud); }
details.ov { border-top: 1px solid var(--line); padding: 4px 0; }
details.ov summary { cursor: pointer; padding: 3px 0; }
details.ov .cols { grid-template-columns: auto 1fr; padding: 8px 0 12px; align-items: start; }
.chips { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; padding: 3px 0; border-bottom: 1px solid var(--line2); }
.chips .lvall { min-width: 110px; }
.chip { border: 1px solid var(--line); padding: 0 8px; border-radius: var(--r); cursor: pointer; }
input.cell, select.cell { width: 100%; min-width: 70px; padding: 1px 6px; border: 1px solid transparent; background: transparent; border-radius: var(--r); }
input.cell:hover, select.cell:hover, input.cell:focus, select.cell:focus { border-color: var(--line); background: var(--panel); }
input.cell.s { max-width: 100px; }
.chipb { border: 1px solid var(--line); background: none; padding: 0 6px; margin: 1px 2px 1px 0; font-size: 12px; cursor: pointer; border-radius: var(--r); color: var(--ink2); }
.chipb[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: var(--w-loud); }
#chgLoc { max-width: 200px; }

.blk.mtg { --h: 40; cursor: default; background: repeating-linear-gradient(135deg, var(--panel) 0 7px, var(--line2) 7px 8px); border-left: 5px solid var(--warn); }
.blk.mtg .a { color: var(--warn); }
.t td.bad { color: var(--bad); font-weight: var(--w-loud); }
.grid td > .blk:not(:only-child) { height: auto; min-height: 36px; }
.grid td > .blk:not(:only-child) .c { display: none; }

/* แท็บอยู่บรรทัดเดียว: แคบเกินให้เลื่อนแนวนอนเฉพาะแถบแท็บ */
header.top { flex-wrap: nowrap; gap: 20px; align-items: flex-end; }
header.top h1 { font-size: 22px; padding-bottom: 6px; flex: none; }
nav.tabs { flex-wrap: nowrap; gap: 16px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs button { flex: none; white-space: nowrap; }
.tools { flex: none; }
.tools .per { white-space: nowrap; }
@media (max-width: 900px) { header.top { gap: 10px; } header.top h1 { font-size: 18px; } .tools .per { display: none; } }
@media (max-width: 760px) { header.top { flex-wrap: wrap; } nav.tabs { order: 3; flex: 1 0 100%; } .tools { margin-left: auto; } }
nav.tabs { gap: 13px; } nav.tabs button { font-size: 14px; }
@media (max-width: 1050px) { .tools .per { display: none; } }
@media (max-width: 1050px) and (min-width: 761px) { header.top { gap: 12px; padding-left: 16px; padding-right: 16px; } header.top h1 { font-size: 20px; } nav.tabs { gap: 11px; } .tools .btn { padding: 3px 8px; } }

</style>
</head>
<body>
<div id="app"></div>
<div id="printArea"></div>
<div id="toast" role="status"></div>
<div id="modalRoot"></div>
<script src="vendor/xlsx.full.min.js"></script>
<script src="../config.js"></script>
<script id="core">
/* ตรรกะล้วน ไม่แตะ DOM — ใช้ทั้งในหน้าเว็บ, Web Worker และ selftest ใน Node */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.TT = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const DAYS = [
    { v: 1, label: 'จันทร์', short: 'จ.' }, { v: 2, label: 'อังคาร', short: 'อ.' }, { v: 3, label: 'พุธ', short: 'พ.' },
    { v: 4, label: 'พฤหัสบดี', short: 'พฤ.' }, { v: 5, label: 'ศุกร์', short: 'ศ.' }
  ];
  const DEFAULT_TIMES = ['08:30', '09:20', '10:10', '11:00', '11:50', '12:40', '13:30', '14:20', '15:10'];
  const XLS_HEAD = ['ปีการศึกษา', 'ภาคเรียน', 'อีเมลครู', 'ชื่อครู', 'เบอร์โทร', 'กลุ่มสาระ', 'วัน', 'คาบ', 'รหัสวิชา', 'ชื่อวิชา', 'ห้องเรียน', 'สถานที่'];

  const LOC_KINDS = ['ห้องเรียนทั่วไป', 'พลศึกษา/สนาม', 'ดนตรี', 'นาฏศิลป์', 'ศิลปะ', 'ห้องปฏิบัติการ (Lab)', 'คอมพิวเตอร์', 'การงานอาชีพ', 'อื่น ๆ'];
  const DEFAULT_LUNCH = { 1: 4, 2: 4, 3: 4, 4: 5, 5: 5, 6: 5 };
  function inferLocKind(name) {
    name = String(name || '');
    if (/^ห้อง\s*\d/.test(name)) return LOC_KINDS[0];
    if (/ดนตรี/.test(name)) return 'ดนตรี';
    if (/นาฏ/.test(name)) return 'นาฏศิลป์';
    if (/ศิลป/.test(name)) return 'ศิลปะ';
    if (/ฟุตบอล|กรีฑา|บาส|แบด|ลีลาศ|วอลเลย์|ว่ายน้ำ|สนาม|ยิม|พละ|โดม/.test(name)) return 'พลศึกษา/สนาม';
    if (/lab|แล็บ|ปฏิบัติการ|เคมี|ฟิสิกส์|ชีว/i.test(name)) return 'ห้องปฏิบัติการ (Lab)';
    if (/คอม/.test(name)) return 'คอมพิวเตอร์';
    if (/การงาน/.test(name)) return 'การงานอาชีพ';
    return 'อื่น ๆ';
  }
  /** เติมฟิลด์ที่โมเดลรุ่นเก่าไม่มี */
  function migrate(model) {
    const st = model.settings;
    if (!st.lunch) { st.lunch = Object.assign({}, DEFAULT_LUNCH); if ((st.noBlockAfter || []).join() === '4') st.noBlockAfter = []; }
    if (!st.noBlockAfter) st.noBlockAfter = [];
    if (!model.roles) model.roles = [];
    if (!model.meetings) model.meetings = {};
    Object.values(model.teachers).forEach(t => { if (!t.roles) t.roles = []; });
    Object.values(model.subjects).forEach(x => { if (!x.kind) x.kind = 'normal'; if (!x.locKinds) x.locKinds = []; });
    Object.keys(model.locations).forEach(k => { const l = model.locations[k]; if (!l.name) l.name = k; if (!l.kind) l.kind = inferLocKind(k); });
    return model;
  }

  /* ---------- ชื่อและข้อความ ---------- */
  /** ยุบช่องว่างซ้ำ และแปลง ํา (U+0E4D U+0E32) เป็น ำ — ไฟล์โรงเรียนและ PDF ใช้ไม่เหมือนกัน */
  function normName(s) {
    return String(s == null ? '' : s).replace(/ํา/g, 'ำ').replace(/[\s ]+/g, ' ').trim();
  }
  const normHead = s => normName(s).replace(/\s/g, '').toLowerCase();
  const fbStaffId = email => String(email || '').trim().toLowerCase().replace(/[^a-z0-9@._-]/g, '_');

  function dayFromText(t) {
    t = normName(t);
    const n = parseInt(t, 10);
    if (n >= 1 && n <= 5 && /^\d$/.test(t)) return n;
    const map = { 'จันทร์': 1, 'จ': 1, 'จ.': 1, 'อังคาร': 2, 'อ': 2, 'อ.': 2, 'พุธ': 3, 'พ': 3, 'พ.': 3, 'พฤหัสบดี': 4, 'พฤหัส': 4, 'พฤ': 4, 'พฤ.': 4, 'ศุกร์': 5, 'ศ': 5, 'ศ.': 5 };
    return map[t] || 0;
  }
  function slotFromText(t) {
    t = normName(t);
    if (/เข้าแถว|homeroom/i.test(t)) return 0;
    return /^\d+$/.test(t) && +t >= 1 && +t <= 12 ? +t : -1;
  }

  /* ---------- ห้องเรียน / อาคาร ---------- */
  /** ม.4/9ญ → ระดับ 4, ห้อง 9, กลุ่มย่อย ญ (แม่ = ม.4/9) */
  function classInfo(name) {
    const m = /^ม\.?\s*(\d)\s*\/\s*(\d+)\s*(.*)$/.exec(normName(name));
    if (!m) return { level: 0, room: 0, suffix: '', parent: '' };
    return { level: +m[1], room: +m[2], suffix: m[3] || '', parent: m[3] ? 'ม.' + m[1] + '/' + m[2] : '' };
  }
  /** เลขหลักแรกของห้อง 3 หลัก = อาคาร ที่เหลือ (การงาน1, ฟุตบอล ฯลฯ) = ห้องพิเศษ/สนาม */
  function defaultBuilding(loc) {
    const m = /(?:^|\s)(\d)\d\d\s*$/.exec(normName(loc));
    return m ? m[1] : 'X';
  }
  const buildingOf = (model, loc) => (model.locations[loc] && model.locations[loc].building) || defaultBuilding(loc);
  const buildingName = (model, b) => (model.settings.buildings && model.settings.buildings[b]) || (b === 'X' ? 'ห้องพิเศษ/สนาม' : 'อาคาร ' + b);

  /* ---------- โมเดล ---------- */
  function newModel() {
    return {
      version: 1, school: 'โรงเรียนปากช่อง', period: { year: '', semester: '', id: '' },
      settings: { maxPerDay: 7, maxSlot: 9, noBlockAfter: [], lunch: Object.assign({}, DEFAULT_LUNCH), times: DEFAULT_TIMES.slice(), buildings: {} },
      teachers: {}, classes: {}, subjects: {}, locations: {}, entries: {}, pool: {}, roles: [], meetings: {}, seq: 0, cloud: null
    };
  }
  const nextId = (model, p) => p + (++model.seq).toString(36) + Math.random().toString(36).slice(2, 5);

  /** สร้างความสัมพันธ์ห้องแม่/กลุ่มย่อย: rel[id] = ห้องที่ชนกับห้องนี้ (ตัวเอง แม่ ลูก) */
  function classRelations(model) {
    const byName = {};
    Object.values(model.classes).forEach(c => { byName[c.name] = c; });
    const rel = {};
    Object.values(model.classes).forEach(c => { rel[c.id] = new Set([c.id]); });
    Object.values(model.classes).forEach(c => {
      const p = classInfo(c.name).parent, pc = p && byName[p];
      if (pc) { c.parentId = pc.id; rel[c.id].add(pc.id); rel[pc.id].add(c.id); } else delete c.parentId;
    });
    return rel;
  }

  /** อ่านตาราง (อาร์เรย์ของแถว) รูปแบบเดียวกับไฟล์ "พร้อมนำเข้า" ของ KruSpace */
  function parseRows(rows, prev) {
    if (!rows || rows.length < 2) throw new Error('ไม่พบข้อมูลในชีต');
    const heads = rows[0].map(normHead);
    const col = names => heads.findIndex(h => names.some(n => h.includes(normHead(n))));
    const ix = {
      year: col(['ปีการศึกษา']), sem: col(['ภาคเรียน']), email: col(['อีเมลครู', 'email']), teacher: col(['ชื่อครู', 'ครูผู้สอน']),
      phone: col(['เบอร์โทร']), area: col(['กลุ่มสาระ']), day: col(['วัน']), slot: col(['คาบ']),
      code: col(['รหัสวิชา']), subj: col(['ชื่อวิชา', 'รายวิชา']), cls: col(['ห้องเรียน', 'ชั้นเรียน']), room: col(['สถานที่', 'ห้องสอน'])
    };
    const miss = [['ชื่อครู', ix.teacher], ['วัน', ix.day], ['คาบ', ix.slot], ['รหัสวิชา', ix.code], ['ห้องเรียน', ix.cls]].filter(x => x[1] < 0).map(x => x[0]);
    if (miss.length) throw new Error('ขาดคอลัมน์สำคัญ: ' + miss.join(', '));
    const model = newModel();
    if (prev) { model.school = prev.school; model.settings = prev.settings; }
    const issues = [], seenT = {};
    const get = (r, i) => i >= 0 && r[i] != null ? String(r[i]).trim() : '';
    rows.slice(1).forEach((r, n) => {
      const tname = normName(get(r, ix.teacher)), cname = normName(get(r, ix.cls)), code = normName(get(r, ix.code));
      if (!tname && !cname && !code) return;
      const day = dayFromText(get(r, ix.day)), slot = slotFromText(get(r, ix.slot));
      if (!tname || !cname || !code || !day || slot < 1) { issues.push({ row: n + 2, msg: 'ข้อมูลไม่ครบหรือวัน/คาบไม่ถูกต้อง (ข้ามแถวนี้)' }); return; }
      if (!model.period.year) { model.period.year = get(r, ix.year); model.period.semester = get(r, ix.sem); }
      const tid = 'tn:' + tname;
      const t = model.teachers[tid] || (model.teachers[tid] = { id: tid, name: tname, email: '', area: '', unavail: [] });
      const em = get(r, ix.email).toLowerCase();
      if (em && !t.email) t.email = em;
      if (!t.area && get(r, ix.area)) t.area = normName(get(r, ix.area));
      seenT[tid] = 1;
      const cid = 'c:' + cname;
      if (!model.classes[cid]) { const ci = classInfo(cname); model.classes[cid] = { id: cid, name: cname, level: ci.level, room: ci.room }; }
      const sid = 's:' + code;
      if (!model.subjects[sid]) model.subjects[sid] = { id: sid, code: code, name: normName(get(r, ix.subj)) || code, area: t.area };
      const loc = normName(get(r, ix.room));
      if (loc && !model.locations[loc]) model.locations[loc] = { name: loc, building: defaultBuilding(loc), kind: inferLocKind(loc) };
      model.seq++;
      const id = 'e' + model.seq.toString(36);
      model.entries[id] = { id: id, teacherId: tid, subjectId: sid, classId: cid, day: day, slot: slot, room: loc };
    });
    classRelations(model);
    migrate(model);
    // วิชาที่ใช้สถานที่พิเศษ (สนาม ห้องดนตรี ฯลฯ) จำประเภทไว้ ให้ตัวจัดอัตโนมัติเลือกห้องว่างให้ได้
    Object.values(model.entries).forEach(e => { const l = model.locations[e.room], sb = model.subjects[e.subjectId]; if (l && sb && l.kind !== LOC_KINDS[0] && l.kind !== 'อื่น ๆ' && !sb.locKinds.includes(l.kind)) sb.locKinds.push(l.kind); });
    return { model: model, issues: issues };
  }

  /** ชีต "กิจกรรมร่วม": วัน คาบ รหัสวิชา ชื่อวิชา ห้องเรียน สถานที่ — ไม่มีครู */
  function parseActivities(model, rows) {
    if (!rows || rows.length < 2) return 0;
    const heads = rows[0].map(normHead), col = n => heads.findIndex(h => h.includes(normHead(n)));
    const ix = { day: col('วัน'), slot: col('คาบ'), code: col('รหัสวิชา'), subj: col('ชื่อวิชา'), cls: col('ห้องเรียน'), room: col('สถานที่') };
    if (ix.day < 0 || ix.slot < 0 || ix.code < 0 || ix.cls < 0) return 0;
    const get = (r, i) => i >= 0 && r[i] != null ? String(r[i]).trim() : '';
    let n = 0;
    rows.slice(1).forEach(r => {
      const day = dayFromText(get(r, ix.day)), slot = slotFromText(get(r, ix.slot)), code = normName(get(r, ix.code)), cname = normName(get(r, ix.cls));
      if (!day || slot < 1 || !code || !cname) return;
      const cid = 'c:' + cname; if (!model.classes[cid]) { const ci = classInfo(cname); model.classes[cid] = { id: cid, name: cname, level: ci.level, room: ci.room }; }
      const sid = 's:' + code; if (!model.subjects[sid]) model.subjects[sid] = { id: sid, code: code, name: normName(get(r, ix.subj)) || code, area: '', kind: 'activity', locKinds: [] };
      const loc = normName(get(r, ix.room)); if (loc && !model.locations[loc]) model.locations[loc] = { name: loc, building: defaultBuilding(loc), kind: inferLocKind(loc) };
      model.seq++; const id = 'e' + model.seq.toString(36);
      model.entries[id] = { id: id, teacherId: '', subjectId: sid, classId: cid, day: day, slot: slot, room: loc, grp: 'g' + day + '-' + slot + '-' + code };
      n++;
    });
    classRelations(model);
    return n;
  }
  /** ชีต "ประชุม": ชื่อการประชุม บทบาท วัน คาบ จำนวนคาบ สถานที่ + ชีต "บทบาทครู": ชื่อครู บทบาท */
  function exportMeetingRows(model) {
    const rows = [['ชื่อการประชุม/ภารกิจ', 'บทบาทที่ต้องเข้า', 'วัน', 'คาบ', 'จำนวนคาบ', 'สถานที่']];
    Object.values(model.meetings).sort((a, b) => a.day - b.day || a.slot - b.slot).forEach(m => rows.push([m.name, (m.roles || []).join(', '), DAYS[m.day - 1].label, String(m.slot), String(m.span || 1), m.room || '']));
    return rows;
  }
  function exportRoleRows(model) {
    const rows = [['ชื่อครู', 'อีเมลครู', 'บทบาท']];
    Object.values(model.teachers).filter(t => (t.roles || []).length).sort((a, b) => a.name.localeCompare(b.name, 'th')).forEach(t => rows.push([t.name, t.email, t.roles.join(', ')]));
    return rows;
  }
  function parseMeetings(model, mRows, rRows) {
    let n = 0;
    if (rRows && rRows.length > 1) {
      const h = rRows[0].map(normHead), ci = { n: h.findIndex(x => x.includes('ชื่อครู')), e: h.findIndex(x => x.includes('อีเมล')), r: h.findIndex(x => x.includes('บทบาท')) };
      const byMail = {}, byName = {}; Object.values(model.teachers).forEach(t => { if (t.email) byMail[t.email] = t; byName[normName(t.name)] = t; });
      rRows.slice(1).forEach(r => {
        const t = (ci.e >= 0 && byMail[String(r[ci.e] || '').trim().toLowerCase()]) || byName[normName(r[ci.n])]; if (!t || ci.r < 0) return;
        String(r[ci.r] || '').split(',').map(normName).filter(Boolean).forEach(x => { if (!model.roles.includes(x)) model.roles.push(x); if (!t.roles.includes(x)) t.roles.push(x); });
      });
    }
    if (mRows && mRows.length > 1) {
      const h = mRows[0].map(normHead), ix = { n: h.findIndex(x => x.includes('ชื่อการประชุม')), r: h.findIndex(x => x.includes('บทบาท')), d: h.findIndex(x => x === 'วัน'), s: h.findIndex(x => x === 'คาบ'), p: h.findIndex(x => x.includes('จำนวนคาบ')), l: h.findIndex(x => x.includes('สถานที่')) };
      mRows.slice(1).forEach(r => {
        const name = normName(r[ix.n]), day = dayFromText(r[ix.d]), slot = slotFromText(r[ix.s]); if (!name || !day || slot < 1) return;
        const roles = String(r[ix.r] || '').split(',').map(normName).filter(Boolean); roles.forEach(x => { if (!model.roles.includes(x)) model.roles.push(x); });
        model.seq++; const id = 'm' + model.seq.toString(36);
        model.meetings[id] = { id: id, name: name, roles: roles, day: day, slot: slot, span: Math.max(1, +r[ix.p] || 1), room: normName(r[ix.l]) }; n++;
      });
    }
    return n;
  }
  function exportActivityRows(model) {
    const rows = [['วัน', 'คาบ', 'รหัสวิชา', 'ชื่อวิชา', 'ห้องเรียน', 'สถานที่']];
    Object.values(model.entries).filter(e => !e.teacherId).map(e => ({ e: e, s: model.subjects[e.subjectId], c: model.classes[e.classId] })).filter(x => x.s && x.c)
      .sort((a, b) => a.e.day - b.e.day || a.e.slot - b.e.slot || a.s.code.localeCompare(b.s.code) || a.c.name.localeCompare(b.c.name, 'th'))
      .forEach(x => rows.push([DAYS[x.e.day - 1].label, String(x.e.slot), x.s.code, x.s.name, x.c.name, x.e.room]));
    return rows;
  }

  /** ส่งออกเป็นแถวรูปแบบเดียวกับไฟล์พร้อมนำเข้า (เรียงครู วัน คาบ) */
  function exportRows(model) {
    const rows = [XLS_HEAD.slice()];
    Object.values(model.entries).map(e => ({ e: e, t: model.teachers[e.teacherId], s: model.subjects[e.subjectId], c: model.classes[e.classId] }))
      .filter(x => x.t && x.s && x.c)
      .sort((a, b) => a.t.name.localeCompare(b.t.name, 'th') || a.e.day - b.e.day || a.e.slot - b.e.slot)
      .forEach(x => rows.push([model.period.year, model.period.semester, x.t.email, x.t.name, '', x.t.area, DAYS[x.e.day - 1].label, String(x.e.slot), x.s.code, x.s.name, x.c.name, x.e.room]));
    return rows;
  }

  /** ครูที่ต้องเข้าประชุม = ครูที่มีบทบาทตรงกับบทบาทที่ประชุมกำหนด */
  function meetingTeachers(model, mt) {
    const rs = mt.roles || [];
    return Object.values(model.teachers).filter(t => (t.roles || []).some(r => rs.includes(r)));
  }

  /* ---------- ดัชนีตรวจชน ---------- */
  const K = (d, s, id) => d + '|' + s + '|' + id;
  function push(map, k, id) { (map.get(k) || map.set(k, []).get(k)).push(id); }
  function pull(map, k, id) { const a = map.get(k); if (!a) return; const i = a.indexOf(id); if (i >= 0) a.splice(i, 1); if (!a.length) map.delete(k); }

  class Index {
    constructor(model) {
      this.m = model; this.rel = classRelations(model);
      this.T = new Map(); this.C = new Map(); this.L = new Map(); this.perDay = new Map(); this.M = new Map();
      Object.values(model.entries).forEach(e => this.add(e));
      this.buildMeetings();
    }
    /** ช่องที่ครูติดประชุม/ภารกิจ: K(วัน,คาบ,ครู) → {name, room, id} */
    buildMeetings() {
      this.M = new Map();
      Object.values(this.m.meetings || {}).forEach(mt => { const ts = meetingTeachers(this.m, mt); for (let k = 0; k < (mt.span || 1); k++) ts.forEach(t => this.M.set(K(mt.day, mt.slot + k, t.id), { id: mt.id, name: mt.name, room: mt.room || '' })); });
    }
    sharedLoc(loc) { const l = this.m.locations[loc]; return !loc || (l && l.shared); }
    add(e) {
      if (e.teacherId) { push(this.T, K(e.day, e.slot, e.teacherId), e.id); const k = e.teacherId + '|' + e.day; this.perDay.set(k, (this.perDay.get(k) || 0) + 1); }
      push(this.C, K(e.day, e.slot, e.classId), e.id);
      if (!this.sharedLoc(e.room)) push(this.L, K(e.day, e.slot, e.room), e.id);
    }
    remove(e) {
      if (e.teacherId) { pull(this.T, K(e.day, e.slot, e.teacherId), e.id); const k = e.teacherId + '|' + e.day; const n = (this.perDay.get(k) || 1) - 1; if (n > 0) this.perDay.set(k, n); else this.perDay.delete(k); }
      pull(this.C, K(e.day, e.slot, e.classId), e.id);
      if (!this.sharedLoc(e.room)) pull(this.L, K(e.day, e.slot, e.room), e.id);
    }
    /** คืนสิ่งที่ชนสำหรับคาบ 1 ช่อง (ไม่นับ id ใน ignore) */
    clash(x, day, slot, ignore) {
      const out = { teacher: [], cls: [], loc: [] }, ok = id => !(ignore && ignore.has(id));
      if (x.teacherId) (this.T.get(K(day, slot, x.teacherId)) || []).forEach(id => { if (ok(id)) out.teacher.push(id); });
      const rel = this.rel[x.classId] || [x.classId];
      rel.forEach(cid => (this.C.get(K(day, slot, cid)) || []).forEach(id => { if (ok(id)) out.cls.push(id); }));
      if (!this.sharedLoc(x.room)) (this.L.get(K(day, slot, x.room)) || []).forEach(id => { if (ok(id)) out.loc.push(id); });
      return out;
    }
    /** พักเที่ยงของระดับชั้นของห้องนี้ตรงกับคาบนี้ไหม */
    lunchAt(classId, slot) { const c = this.m.classes[classId], l = (this.m.settings.lunch || {})[c ? c.level : 0]; return !!l && l === slot; }
    /** ตรวจว่าวางบล็อกได้ไหม — block[i] อยู่ที่คาบ slot + (block.offs ? block.offs[i] : i) (หลายห้องพร้อมกันใช้ offs ซ้ำได้) */
    canPlace(block, day, slot, ignore) {
      const st = this.m.settings, why = [], off = i => (block.offs ? block.offs[i] : i);
      if (day < 1 || day > 5) return { ok: false, why: ['วันไม่ถูกต้อง'] };
      let mx = 0; block.forEach((b, i) => { mx = Math.max(mx, off(i)); });
      if (slot < 1 || slot + mx > st.maxSlot) return { ok: false, why: ['เกินจำนวนคาบต่อวัน'] };
      for (let k = 1; k <= mx; k++) if ((st.noBlockAfter || []).includes(slot + k - 1)) return { ok: false, why: ['คาบคู่ข้ามช่วงพักไม่ได้'] };
      block.forEach((b, i) => {
        const s = slot + off(i), t = b.teacherId && this.m.teachers[b.teacherId];
        if (t && (t.unavail || []).includes(day + '-' + s)) why.push('ครูไม่ว่างคาบนี้');
        if (t && this.M.has(K(day, s, t.id))) why.push('ครูติดประชุม/ภารกิจคาบนี้');
        if (this.lunchAt(b.classId, s)) why.push('คาบพักเที่ยงของระดับชั้นนี้');
        const c = this.clash(b, day, s, ignore);
        if (c.teacher.length) why.push('ครูมีสอนคาบนี้แล้ว');
        if (c.cls.length) why.push('ห้องเรียนมีเรียนคาบนี้แล้ว');
        if (c.loc.length) why.push('สถานที่ถูกใช้แล้ว');
      });
      return { ok: !why.length, why: Array.from(new Set(why)) };
    }
    /** สถานที่ชนิดที่ต้องการที่ว่างทุกคาบของบล็อก (ไว้ให้ระบบเลือกให้) */
    freeLocations(kinds, day, slot, span, ignore) {
      return Object.keys(this.m.locations).filter(n => { const l = this.m.locations[n]; if (!kinds.includes(l.kind) || l.shared) return false; for (let k = 0; k < span; k++) if ((this.L.get(K(day, slot + k, n)) || []).some(id => !(ignore && ignore.has(id)))) return false; return true; });
    }
    /** คาบที่ชนกันทั้งหมดในโมเดล (รายงาน) */
    allClashes() {
      const res = { teacher: [], cls: [], loc: [] };
      this.T.forEach((ids, k) => { if (ids.length > 1) res.teacher.push({ key: k, ids: ids.slice() }); });
      this.L.forEach((ids, k) => { if (ids.length > 1) res.loc.push({ key: k, ids: ids.slice() }); });
      const seen = new Set();
      this.C.forEach((ids, k) => {
        const [d, s] = k.split('|'), cid = k.slice(d.length + s.length + 2);
        const all = [];
        (this.rel[cid] || [cid]).forEach(r => (this.C.get(K(d, s, r)) || []).forEach(id => all.push(id)));
        const uniq = Array.from(new Set(all));
        if (uniq.length > 1) { const sig = d + '|' + s + '|' + uniq.sort().join(','); if (!seen.has(sig)) { seen.add(sig); res.cls.push({ key: k, ids: uniq }); } }
      });
      return res;
    }
  }

  /** หน่วยที่ลากด้วยกัน: กิจกรรมร่วม (grp เดียวกัน หลายห้องพร้อมกัน) หรือบล็อกคาบต่อเนื่องของครู */
  function moveUnit(model, idx, id) {
    const e = model.entries[id]; if (!e) return [];
    if (!e.grp) return blockOf(model, idx, id);
    const all = Object.values(model.entries).filter(x => x.grp === e.grp && x.day === e.day).sort((a, b) => a.slot - b.slot || a.classId.localeCompare(b.classId));
    const mn = all[0].slot; all.offs = all.map(x => x.slot - mn);
    return all;
  }
  /** บล็อกคาบต่อเนื่อง (ครู วิชา ห้อง สถานที่ เดียวกัน คาบติดกัน) ที่ entry นี้อยู่ */
  function blockOf(model, idx, id) {
    const e = model.entries[id]; if (!e) return [];
    const same = o => o && o.subjectId === e.subjectId && o.classId === e.classId && o.room === e.room && o.day === e.day;
    if (!e.teacherId) return [e];
    const find = s => { const a = idx.T.get(K(e.day, s, e.teacherId)); const o = a && model.entries[a[0]]; return same(o) ? o : null; };
    const noB = model.settings.noBlockAfter || [];
    let lo = e.slot, hi = e.slot;
    while (!noB.includes(lo - 1) && find(lo - 1)) lo--;
    while (!noB.includes(hi) && find(hi + 1)) hi++;
    const out = []; for (let s = lo; s <= hi; s++) out.push(find(s) || e);
    return out;
  }

  /* ---------- ตรวจรายงานคุณภาพ ---------- */
  function report(model) {
    const idx = new Index(model), cl = idx.allClashes(), st = model.settings;
    const over = [];

    if (k === 'e') { const cur = m.entries[id]; if (cur) S.idx.remove(cur); if (val) { m.entries[id] = clone(val); S.idx.add(m.entries[id]); } else delete m.entries[id]; }
    else if (k === 'p') { if (val) m.pool[id] = clone(val); else delete m.pool[id]; }
    else if (k === 't') { if (m.teachers[id]) m.teachers[id].unavail = clone(val) || []; }
  }
  function tx(label, fn) {
    const ops = [], get = (k, id) => clone(k === 'e' ? M().entries[id] : k === 'p' ? M().pool[id] : (M().teachers[id] || {}).unavail);
    const set = (k, id, val) => { ops.push({ k: k, id: id, before: get(k, id), after: clone(val) }); applyStore(k, id, val); };
    fn({ setE: (id, v) => set('e', id, v), setP: (id, v) => set('p', id, v), setT: (id, v) => set('t', id, v) });
    if (!ops.length) return;
    S.hist.undo.push({ label: label, ops: ops }); if (S.hist.undo.length > 300) S.hist.undo.shift(); S.hist.redo = [];
    changed(); render();
  }
  function undo() { const h = S.hist.undo.pop(); if (!h) return toast('ไม่มีอะไรให้ย้อน'); h.ops.slice().reverse().forEach(o => applyStore(o.k, o.id, o.before)); S.hist.redo.push(h); changed(); render(); toast('ย้อนกลับ: ' + h.label); }
  function redo() { const h = S.hist.redo.pop(); if (!h) return; h.ops.forEach(o => applyStore(o.k, o.id, o.after)); S.hist.undo.push(h); changed(); render(); toast('ทำซ้ำ: ' + h.label); }
  document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && /INPUT|SELECT|TEXTAREA/.test(e.target.tagName) === false) { if (e.key === 'z') { e.preventDefault(); undo(); } else if (e.key === 'y') { e.preventDefault(); redo(); } } });

  /* ---------- ลากวาง ---------- */
  function dragBlock(el) {
    const m = M();
    if (el.dataset.pool) {
      const c = m.pool[el.dataset.id]; if (!c) return null;
      const cids = c.classIds || [c.classId], b = [], offs = [];
      for (let k = 0; k < c.span; k++) cids.forEach(cid => { b.push({ teacherId: c.teacherId || '', subjectId: c.subjectId, classId: cid, room: c.room }); offs.push(k); });
      b.offs = offs;
      const kinds = !c.room && (m.subjects[c.subjectId] || {}).locKinds || [];
      return { kind: 'pool', id: c.id, block: b, ignore: new Set(), flex: kinds.length ? kinds : null, span: c.span, joint: !c.teacherId };
    }
    const blk = TT.moveUnit(m, S.idx, el.dataset.id);
    if (!blk.length) return null;
    return { kind: 'entry', id: el.dataset.id, block: blk, ignore: new Set(blk.map(x => x.id)), joint: !blk[0].teacherId };
  }
  /** ตรวจช่องปลายทาง: กฎชน + กิจกรรมร่วมต้องวางในมุมมองห้อง/สถานที่ + วิชาที่ให้ระบบเลือกสถานที่ต้องมีห้องว่าง */
  function dropCheck(d, day, slot) {
    if (d.joint && S.mode === 'teacher') return { ok: false, why: ['กิจกรรมร่วมวางในมุมมองห้องเรียนหรือสถานที่'] };
    const r = S.idx.canPlace(d.block, day, slot, d.ignore);
    if (r.ok && d.flex && !S.idx.freeLocations(d.flex, day, slot, d.span).length) return { ok: false, why: ['ไม่มีสถานที่ว่างตามประเภทที่กำหนด'] };
    return r;
  }
  function markDrop() {
    const d = S.drag; if (!d) return;
    $$('#gridBox td[data-d]').forEach(td => {
      const r = dropCheck(d, +td.dataset.d, +td.dataset.s);
      td.classList.toggle('drop-ok', r.ok); td.classList.toggle('drop-no', !r.ok); td.title = r.ok ? '' : r.why.join(' · ');
    });
  }
  function clearDrop() { S.drag = null; $$('#gridBox td').forEach(td => td.classList.remove('drop-ok', 'drop-no')); $$('.dragging').forEach(x => x.classList.remove('dragging')); const t = $('#tray'); if (t) t.classList.remove('over'); }
  function makeEntries(api, c, day, slot, room) {
    const m = M(), cids = c.classIds || [c.classId], grp = c.teacherId ? undefined : TT.nextId(m, 'g');
    for (let k = 0; k < c.span; k++) cids.forEach(cid => { const id = TT.nextId(m, 'e'); api.setE(id, { id: id, teacherId: c.teacherId || '', subjectId: c.subjectId, classId: cid, room: room != null ? room : c.room, day: day, slot: slot + k, grp: grp }); });
  }
  function bindGrid(root) {
    root.addEventListener('dragstart', e => {
      const b = e.target.closest && e.target.closest('.blk'); if (!b) return;
      S.drag = dragBlock(b); if (!S.drag) return;
      e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', b.dataset.id);
      setTimeout(() => { b.classList.add('dragging'); markDrop(); }, 0);
    });
    root.addEventListener('dragend', clearDrop);
    root.addEventListener('dragover', e => {
      if (!S.drag) return;
      const td = e.target.closest('#gridBox td[data-d]'), tray = e.target.closest('#tray');
      if (td && td.classList.contains('drop-ok')) e.preventDefault();
      if (tray && S.drag.kind === 'entry') { e.preventDefault(); tray.classList.add('over'); } else { const t = $('#tray'); if (t) t.classList.remove('over'); }
    });
    root.addEventListener('drop', e => {
      const d = S.drag; if (!d) return;
      const td = e.target.closest('#gridBox td[data-d]'), tray = e.target.closest('#tray');
      e.preventDefault();
      if (tray && d.kind === 'entry') { const b = d.block; clearDrop(); if (b.some(x => x.locked)) return toast('บัตรนี้ล็อกอยู่ ปลดล็อกก่อน', true); unplace(b); return; }
      if (!td) return clearDrop();
      const day = +td.dataset.d, slot = +td.dataset.s, r = dropCheck(d, day, slot);
      if (!r.ok) { clearDrop(); return toast('วางไม่ได้: ' + r.why.join(' · '), true); }
      if (d.kind === 'entry' && d.block.some(x => x.locked)) { clearDrop(); return toast('บัตรนี้ล็อกอยู่ ปลดล็อกก่อน', true); }
      const blk = d.block, kind = d.kind, id = d.id; clearDrop();
      if (kind === 'entry') tx('ย้ายคาบ', api => { blk.forEach((x, i) => api.setE(x.id, Object.assign({}, x, { day: day, slot: slot + (blk.offs ? blk.offs[i] : i) }))); });
      else tx('วางคาบ', api => { const c = M().pool[id]; let room = c.room; if (d.flex) { const fl = S.idx.freeLocations(d.flex, day, slot, c.span); room = fl[Math.floor(Math.random() * fl.length)]; } makeEntries(api, c, day, slot, room); api.setP(id, null); });
    });
  }
  function unplace(blk) {
    const m = M(), f = blk[0], joint = !f.teacherId;
    tx('ถอนคาบ', api => {
      blk.forEach(x => api.setE(x.id, null)); const id = TT.nextId(m, 'p');
      if (joint) { const cids = Array.from(new Set(blk.map(x => x.classId))); api.setP(id, { id: id, teacherId: '', subjectId: f.subjectId, classId: cids[0], classIds: cids, room: f.room, span: new Set(blk.map(x => x.slot)).size }); }
      else api.setP(id, { id: id, teacherId: f.teacherId, subjectId: f.subjectId, classId: f.classId, room: f.room, span: blk.length });
    });
  }

  /* ---------- จัดอัตโนมัติ (Worker) ---------- */
  function solveInWorker(payload) {
    return new Promise(res => {
      let done = false; const fallback = () => { if (done) return; done = true; setTimeout(() => res(TT.runSolve(payload)), 30); };
      try {
        const src = document.getElementById('core').textContent + ';self.onmessage=function(e){postMessage(TT.runSolve(e.data))}';
        const w = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
        w.onmessage = e => { done = true; w.terminate(); res(e.data); };
        w.onerror = () => { w.terminate(); fallback(); };
        w.postMessage(payload);
      } catch (e) { fallback(); }
    });
  }
  const lightModel = (entries, pool) => { const m = M(); return { settings: m.settings, teachers: m.teachers, classes: m.classes, subjects: m.subjects, locations: m.locations, entries: entries, pool: pool }; };

  async function runAuto(scope) {
    const m = M(); if (S.busy) return;
    let entries = Object.assign({}, m.entries), pool = Object.assign({}, m.pool), remove = [];
    if (scope) {   // จัดใหม่: ถอนของที่ไม่ล็อกในขอบเขตออกมาเป็นการ์ดก่อน
      const inScope = e => scope === 'all' || (S.mode === 'teacher' ? e.teacherId === S.sel.teacher : S.mode === 'class' ? (S.idx.rel[S.sel.class] || new Set()).has(e.classId) && e.classId === S.sel.class : e.room === S.sel.loc);
      const seen = new Set();
      Object.values(m.entries).filter(e => e.teacherId && inScope(e) && !e.locked).forEach(e => {
        if (seen.has(e.id)) return; const blk = TT.blockOf(m, S.idx, e.id).filter(x => !x.locked && inScope(x)); if (!blk.length) return;
        blk.forEach(x => { seen.add(x.id); delete entries[x.id]; remove.push(x.id); });
        const id = TT.nextId(m, 'p'); pool[id] = { id: id, teacherId: e.teacherId, subjectId: e.subjectId, classId: e.classId, room: e.room, span: blk.length };
      });
    }
    const ids = Object.keys(pool); if (!ids.length) return toast('ไม่มีคาบให้จัด');
    S.busy = 'auto'; modal('กำลังจัดตาราง…', '<p>ระบบกำลังลองวางบัตรวิชา ' + ids.length + ' ใบ โดยไม่ให้ชนกัน ใช้เวลาไม่กี่วินาที</p>', []);
    const res = await solveInWorker({ model: lightModel(entries, pool), cardIds: ids, timeMs: ids.length > 600 ? 20000 : 8000, seed: (Date.now() % 100000) + 1 });
    S.busy = ''; $('#modalRoot').innerHTML = '';
    const okN = res.placed.length, badN = res.failed.length;
    modal('ผลการจัดอัตโนมัติ', '<div class="kpis"><div><b class="num">' + okN + '</b><span>ใบที่จัดลงได้</span></div><div><b class="num ' + (badN ? 'bad' : '') + '">' + badN + '</b><span>ใบที่ยังหาที่ลงไม่ได้</span></div></div>' +
      '<p class="q">ทุกใบที่ลงจะไม่ชนกับครู ห้องเรียน สถานที่ หรือเวลาที่ครูไม่ว่าง' + (remove.length ? ' · จะถอน ' + remove.length + ' คาบเดิมที่ไม่ล็อกออกก่อนแล้วจัดใหม่' : '') + ' · ยืนยันแล้วย้อนกลับได้ด้วย Ctrl+Z</p>', [
      { label: 'ยกเลิก' },
      { label: 'ใช้ผลนี้', cls: 'pri', act: () => {
        tx(scope ? 'จัดใหม่อัตโนมัติ' : 'จัดอัตโนมัติ', api => {
          remove.forEach(id => api.setE(id, null));
          const placed = new Map(res.placed.map(p => [p.cardId, p]));
          Object.keys(pool).forEach(id => { const c = pool[id], p = placed.get(id); if (p) { makeEntries(api, c, p.day, p.slot, p.room); if (m.pool[id]) api.setP(id, null); } else if (!m.pool[id]) api.setP(id, c); });
        });
        toast('จัดลง ' + okN + ' ใบ' + (badN ? ' · ค้าง ' + badN : ''));
      } }]);
  }

  function ovBld() {

      const ls = by[b].sort(sortTh), heat = {}; let total = 0;

  function matrixWorkbook() {
    const m = M(), wb = XLSX.utils.book_new(), n = slotsN(), used = new Set();
    const add = (name, ents, kind, tid) => {
      let nm = String(name).replace(/[\\/?*\[\]:]/g, '-').slice(0, 28), k = 1; while (used.has(nm)) nm = nm.slice(0, 25) + '_' + (++k); used.add(nm);
      const rows = [['', ...Array.from({ length: n }, (_, i) => 'คาบ ' + (i + 1))]];
      DAYS.forEach(d => rows.push([d.label, ...Array.from({ length: n }, (_, i) => ents.filter(e => e.day === d.v && e.slot === i + 1).map(e => { const s = m.subjects[e.subjectId] || {}, c = m.classes[e.classId] || {}, t = m.teachers[e.teacherId] || {}; return (s.code || '') + ' ' + (s.name || '') + ' ' + (kind === 'teacher' ? c.name : shortName(t.name)) + (e.room ? ' ' + e.room : ''); }).concat(tid ? [mtgAt(tid, d.v, i)].filter(Boolean) : []).join(' / '))]));
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), nm);
    };
    const mtgAt = (tid, d, i) => { const x = S.idx.M.get(TT.K(d, i + 1, tid)); return x ? '📌 ' + x.name : ''; };
    Object.values(m.teachers).sort((a, b) => sortTh(a.name, b.name)).forEach(t => { const e = Object.values(m.entries).filter(x => x.teacherId === t.id); if (e.length) add('ครู ' + shortName(t.name), e, 'teacher', t.id); });
    classList().forEach(c => add('ห้อง ' + c.name.replace('ม.', 'ม'), Object.values(m.entries).filter(e => (S.idx.rel[c.id] || new Set([c.id])).has(e.classId)), 'class'));
    return wb;
  }

    const m = TT.newModel(); m.period = { year: '2569', semester: '1', id: '' }; m.school = 'โรงเรียนตัวอย่าง';

    const cls = ['ม.1/1', 'ม.1/2', 'ม.1/3', 'ม.2/1', 'ม.2/2', 'ม.2/3']; cls.forEach(c => { const ci = TT.classInfo(c); m.classes['c:' + c] = { id: 'c:' + c, name: c, level: ci.level, room: ci.room }; });
    areas.forEach((a, i) => { m.subjects['s:' + codes[i] + '1101'] = { id: 's:' + codes[i] + '1101', code: codes[i] + '1101', name: a.split(' ')[0].slice(0, 22), area: a }; });

    TT.classRelations(m); m.seq = 0;
    const locs = Object.keys(m.locations); let pi = 0;
    cls.forEach((c, ci) => areas.forEach((a, i) => { const t = Object.values(m.teachers).filter(x => x.area === a)[ci % 3]; for (let k = 0; k < per[i]; k++) { const id = 'p' + (++pi); m.pool[id] = { id: id, teacherId: t.id, subjectId: 's:' + codes[i] + '1101', classId: 'c:' + c, room: locs[ci * 2 % locs.length], span: 1 }; } }));

  async function fbInit() {
    if (S.fb) return S.fb;
    if (!window.GRADEBOOK_CONFIG || !GRADEBOOK_CONFIG.firebase || !GRADEBOOK_CONFIG.firebase.apiKey) throw new Error('ไม่พบ config.js ของ KruSpace');
    if (!window.firebase) { await scriptLoad('../vendor/firebase-app-compat.js'); await scriptLoad('../vendor/firebase-auth-compat.js'); await scriptLoad('../vendor/firebase-firestore-compat.js'); }
    const app = firebase.apps.length ? firebase.app() : firebase.initializeApp(GRADEBOOK_CONFIG.firebase);
    S.fb = { auth: firebase.auth(app), db: firebase.firestore(app), user: null, admin: false, periods: [] };
    S.fb.auth.onAuthStateChanged(async u => { S.fb.user = u; S.fb.admin = false; if (u) { try { const d = await S.fb.db.collection('staff').doc(TT.fbStaffId(u.email)).get(); S.fb.admin = !!(d.exists && (d.data().roles || []).includes('admin')); } catch (e) { /* อ่านสิทธิ์ไม่ได้ */ } } if (S.tab === 'sync') render(); });
    return S.fb;
  }
  const decodeNested = v => Array.isArray(v) ? v.map(decodeNested) : v && typeof v === 'object' ? (Array.isArray(v.__arr) ? decodeNested(v.__arr) : Object.keys(v).reduce((o, k) => { o[k] = decodeNested(v[k]); return o; }, {})) : v;
  async function fetchCloud(periodId) {
    const db = S.fb.db, sh = async n => { const d = await db.collection('shared').doc(n).get({ source: 'server' }); return d.exists ? decodeNested(d.data().items) || [] : []; };
    const staffSnap = await db.collection('staff').get({ source: 'server' });
    const staff = staffSnap.docs.map(d => Object.assign({ email: d.id }, d.data())).filter(s => s.active !== false);
    const [classes, subjects, periods] = await Promise.all([sh('classes'), sh('subjects'), sh('periods')]);
    let timetable = null;
    if (periodId) { const d = await db.collection('timetable').doc(periodId).get({ source: 'server' }); timetable = d.exists ? decodeNested(d.data()) : { entries: [], exceptions: [], term: null }; }
    return { staff: staff, classes: classes.map(c => ({ id: c.id, name: c.name })), subjects: subjects, periods: periods, timetable: timetable };
  }

      const id = S.sel.teacher, key = td.dataset.d + '-' + td.dataset.s, cur = (M().teachers[id].unavail || []).slice(), i = cur.indexOf(key);
      if (i >= 0) cur.splice(i, 1); else cur.push(key);
      tx('เวลาไม่ว่างของครู', api => api.setT(id, cur));
    }
  });
  document.addEventListener('input', e => {
    const t = e.target;
    if (t.id === 'flt') { S.filter = t.value; $('#list').innerHTML = railHTML(); }
    if (t.id === 'rsq') { S.rq = t.value; const pos = t.selectionStart; render(); const n = $('#rsq'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }
    if (t.id === 'rlq') { S.rl = t.value; const pos = t.selectionStart; render(); const n = $('#rlq'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }
  });
  document.addEventListener('change', e => {
    const t = e.target, m = M(), st = m.settings;
    if (t.dataset.lvall) { $$('.jsC[data-lv="' + t.dataset.lvall + '"]').forEach(x => { x.checked = t.checked; }); return; }
    if (t.id === 'chgLoc') { const blk = TT.moveUnit(m, S.idx, S.selBlock), v = t.value; return tx('เปลี่ยนสถานที่', api => blk.forEach(x => api.setE(x.id, Object.assign({}, x, { room: v })))); }
    if (t.dataset.lunch) { st.lunch = Object.assign({}, st.lunch); st.lunch[t.dataset.lunch] = +t.value || 0; changed(); updateBad(); toast('บันทึกแล้ว · คาบที่ตกเวลาพัก ' + TT.report(m).lunch.length); return; }
    if (t.dataset.mf) return editMeeting(t);
    if (t.dataset.sf) return editSubject(t);
    if (t.dataset.lf) return editLocation(t);
    if (t.id === 'allPool') { S.showAllPool = t.checked; render(); }
    else if (t.id === 'rlk') { S.rlk = t.value; render(); }
    else if (t.id === 'pk') { S.printKind = t.value; S.printScope = 'one'; render(); }
    else if (t.id === 'ps') { S.printScope = t.value; render(); }
    else if (t.dataset.set) {
      const k = t.dataset.set, v = t.value;
      if (k === 'school') m.school = v; else if (k === 'year') m.period.year = v; else if (k === 'semester') m.period.semester = v;
      else if (k === 'noBlockAfter') st.noBlockAfter = v.split(',').map(x => +x.trim()).filter(x => x > 0);
      else st[k] = Math.max(1, Math.min(12, +v || st[k]));
      changed(); toast('บันทึกแล้ว');
    } else if (t.dataset.time !== undefined) { st.times = st.times || []; st.times[+t.dataset.time] = t.value; changed(); }
    else if (t.dataset.bname) { st.buildings = st.buildings || {}; st.buildings[t.dataset.bname] = t.value; changed(); toast('บันทึกแล้ว'); }
    else if (t.id === 'fileIn' && t.files[0]) { loadXlsxFile(t.files[0]); t.value = ''; }
    else if (t.id === 'jsonFile' && t.files[0]) { t.files[0].text().then(x => { try { const j = JSON.parse(x); if (!j.entries || !j.teachers) throw new Error('ไม่ใช่ไฟล์สำรองของแอปนี้'); useModel(j); changed(); render(); toast('กู้ข้อมูลแล้ว'); } catch (er) { toast(er.message, true); } }); t.value = ''; }
  });
  function doAct(a, el) {
    const m = M();
    switch (a) {
      case 'undo': return undo(); case 'redo': return redo();
      case 'auto': return runAuto(null); case 'reshuffle': return modal('จัดใหม่?', '<p>ถอนคาบที่ไม่ล็อกในขอบเขตนี้ออก แล้วให้ระบบจัดลงใหม่ ดูผลก่อนยืนยันได้</p>', [{ label: 'ยกเลิก' }, { label: 'จัดใหม่ทั้งโรงเรียน', act: () => { runAuto('all'); } }, { label: 'จัดใหม่เฉพาะที่เลือก', cls: 'pri', act: () => { runAuto('sel'); } }]);
      case 'addLoad': return addLoadDialog();
      case 'unavailOn': S.unavailMode = true; return render(); case 'unavailOff': S.unavailMode = false; return render();
      case 'lock': { const blk = TT.moveUnit(m, S.idx, S.selBlock), v = !blk.some(x => x.locked); return tx(v ? 'ล็อก' : 'ปลดล็อก', api => blk.forEach(x => api.setE(x.id, Object.assign({}, x, { locked: v || undefined })))); }
      case 'unplace': { const blk = TT.moveUnit(m, S.idx, S.selBlock); if (blk.some(x => x.locked)) return toast('บัตรนี้ล็อกอยู่', true); S.selBlock = ''; return unplace(blk); }
      case 'del': { const blk = TT.moveUnit(m, S.idx, S.selBlock); S.selBlock = ''; return tx('ลบคาบ', api => blk.forEach(x => api.setE(x.id, null))); }
      case 'print': { $('#printArea').innerHTML = printIds().map(id => sheetHTML(S.printKind, id)).join(''); return setTimeout(() => window.print(), 60); }
      case 'open': case 'jsonIn': { const inp = $(a === 'open' ? '#fileIn' : '#jsonFile'); if (inp) return inp.click(); S.tab = 'set'; render(); return setTimeout(() => $(a === 'open' ? '#fileIn' : '#jsonFile').click(), 50); }
      case 'xlsx': { const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(TT.exportRows(m)), 'ตารางสอน'); const ar = TT.exportActivityRows(m); if (ar.length > 1) XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(ar), 'กิจกรรมร่วม'); const mr = TT.exportMeetingRows(m); if (mr.length > 1) { XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(mr), 'ประชุม'); XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(TT.exportRoleRows(m)), 'บทบาทครู'); } return XLSX.writeFile(wb, 'ตารางสอน-' + (m.period.year || 'ใหม่') + '-' + (m.period.semester || '') + '-ส่งออก.xlsx'); }
      case 'xlsxMatrix': return XLSX.writeFile(matrixWorkbook(), 'ตารางรายคนรายห้อง-' + (m.period.year || '') + '.xlsx');
      case 'jsonOut': return dl('สำรองตารางสอน-' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify(m), 'application/json');
      case 'demo': return demo();
      case 'addJoint': return jointDialog();
      case 'lunch': { const v = el.dataset.v; m.settings.lunch = v === 'split' ? Object.assign({}, TT.DEFAULT_LUNCH) : { 1: +v, 2: +v, 3: +v, 4: +v, 5: +v, 6: +v }; changed(); render(); return toast('ตั้งพักเที่ยงแล้ว · คาบที่ตกเวลาพัก ' + TT.report(m).lunch.length); }
      case 'addRole': return addRole(); case 'delRole': return delRole(el.dataset.role); case 'giveRole': return giveRole(el.dataset.role); case 'takeRole': return takeRole(el.dataset.role, el.dataset.tid);
      case 'addMtg': return addMeeting(); case 'delMtg': return delMeeting(el.dataset.mid); case 'quickRole': $('#nrN').value = el.dataset.v; return addRole();
      case 'addSubj': return addSubject(); case 'addLoc': return addLocation(); case 'addCls': return addClassRoom();
      case 'delSubj': return delSubject(el.dataset.sid); case 'delLoc': return delLocation(el.dataset.lid);
      case 'moreRes': S.resLimit = (S.resLimit || 100) + 200; return render();
      case 'wipe': return modal('ล้างข้อมูลในเครื่องนี้?', '<p>ลบตารางและรายชื่อที่เก็บในเบราว์เซอร์นี้ทั้งหมด (ข้อมูลใน KruSpace ไม่ถูกแตะ)</p>', [{ label: 'ยกเลิก' }, { label: 'ล้าง', cls: 'bad', act: () => { useModel(TT.newModel()); idbPut('model', M()); render(); toast('ล้างแล้ว'); } }]);
      case 'fbStart': return fbInit().then(() => render()).catch(e => toast('เชื่อมต่อไม่สำเร็จ: ' + e.message, true));
      case 'fbLogin': return fbInit().then(() => S.fb.auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())).catch(e => toast('เข้าสู่ระบบไม่สำเร็จ: ' + e.message, true));
      case 'fbLogout': return S.fb.auth.signOut().then(() => { S.fb.periods = []; render(); });
      case 'fbPeriods': return fbPeriods(); case 'fbLoad': return fbLoad(el.dataset.pid); case 'fbPublish': return fbPublish();
    }
  }
  /* fbStart ต้องเริ่มระบบก่อนถึงจะแสดงปุ่มเข้าสู่ระบบ */
  const _da = doAct;

  /* ================= เริ่มต้น ================= */
  (async function boot() {
    const saved = await idbGet('model');
    if (saved && saved.entries) { try { useModel(saved); } catch (e) { useModel(TT.newModel()); } } else useModel(TT.newModel());
    if (S.model.settings.maxSlot === undefined) S.model.settings = TT.newModel().settings;
    render();
    window.__TT = { S: S, render: render };   // ไว้ตรวจในเบราว์เซอร์
  })();
})();

</script>
</body>
</html>
