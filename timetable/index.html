<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>จัดตารางสอน · KruSpace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f3ee; --panel: #fbfaf7; --ink: #1a211d; --ink2: #5b655f; --line: #d9d5cb; --line2: #ece8de;
  --accent: #0d6b4d; --accent-ink: #fff; --bad: #c22f1f; --bad-bg: #fbe3df; --ok-bg: #dcefe4; --warn: #9a6a00;
  --w-quiet: 300; --w-body: 400; --w-loud: 800;
  --r: 4px;
  --f: 'Sarabun', 'Leelawadee UI', 'Noto Sans Thai', Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12160f; --panel: #181d16; --ink: #e7eae2; --ink2: #98a294; --line: #2c3429; --line2: #212820;
    --accent: #52c79a; --accent-ink: #08130e; --bad: #ff8b7a; --bad-bg: #3a1c17; --ok-bg: #173226; --warn: #e1b04a;
  }
}
:root[data-theme="dark"] {
  --bg: #12160f; --panel: #181d16; --ink: #e7eae2; --ink2: #98a294; --line: #2c3429; --line2: #212820;
  --accent: #52c79a; --accent-ink: #08130e; --bad: #ff8b7a; --bad-bg: #3a1c17; --ok-bg: #173226; --warn: #e1b04a;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: var(--w-body) 15px/1.7 var(--f); }
button, input, select { font: inherit; color: inherit; }
b, .loud { font-weight: var(--w-loud); }
.q { font-weight: var(--w-quiet); color: var(--ink2); }
.num { font-variant-numeric: tabular-nums; }

/* ---------- แถบบน ---------- */
header.top { display: flex; align-items: baseline; gap: 28px; padding: 14px 24px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
header.top h1 { margin: 0; font-size: 26px; font-weight: var(--w-loud); line-height: 1.3; white-space: nowrap; }
header.top .per { font-weight: var(--w-quiet); color: var(--ink2); }
nav.tabs { display: flex; gap: 22px; flex: 1; flex-wrap: wrap; }
nav.tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 0 7px; cursor: pointer; color: var(--ink2); font-size: 15px; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-color: var(--accent); font-weight: var(--w-loud); }
.tools { display: flex; gap: 6px; align-items: center; padding-bottom: 8px; margin-left: auto; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: var(--r); padding: 3px 12px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--ink2); }
.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: var(--w-loud); }
.btn.bad { color: var(--bad); }
.btn[disabled] { opacity: .4; cursor: default; }
.btn.sm { padding: 0 8px; font-size: 13px; }

/* ---------- โครงหน้า จัดตาราง ---------- */
main { padding: 0; }
.work { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: calc(100vh - 62px); }
aside.rail { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; max-height: calc(100vh - 62px); position: sticky; top: 0; align-self: start; }
.seg { display: flex; border-bottom: 1px solid var(--line); }
.seg button { flex: 1; border: 0; background: none; padding: 8px 0; cursor: pointer; color: var(--ink2); border-bottom: 3px solid transparent; }
.seg button[aria-pressed="true"] { color: var(--ink); font-weight: var(--w-loud); border-color: var(--ink); }
.rail input[type=search] { margin: 10px 12px; padding: 5px 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); }
.list { overflow: auto; flex: 1; padding-bottom: 12px; }
.list .grp { padding: 10px 14px 2px; font-size: 13px; color: var(--ink2); font-weight: var(--w-quiet); }
.list button { display: flex; width: 100%; gap: 8px; justify-content: space-between; background: none; border: 0; text-align: left; padding: 2px 14px; cursor: pointer; line-height: 1.6; }
.list button:hover { background: var(--line2); }
.list button[aria-current="true"] { background: var(--ink); color: var(--bg); }
.list .n { color: var(--ink2); font-size: 13px; }
.list button[aria-current="true"] .n { color: var(--bg); opacity: .7; }
.list .dot { color: var(--bad); font-weight: var(--w-loud); }
.stage { padding: 18px 24px 60px; min-width: 0; }
.stage h2 { margin: 0; font-size: 34px; line-height: 1.35; font-weight: var(--w-loud); text-wrap: balance; }
.stage .sub { margin: 0 0 14px; color: var(--ink2); font-weight: var(--w-quiet); }

/* ---------- กริดตาราง ---------- */
table.grid { border-collapse: collapse; width: 100%; table-layout: fixed; background: var(--panel); }
.grid th, .grid td { border: 1px solid var(--line); padding: 0; height: 74px; vertical-align: top; }
.grid thead th { height: auto; padding: 4px 2px; font-weight: var(--w-body); background: var(--bg); }
.grid thead th small { display: block; color: var(--ink2); font-weight: var(--w-quiet); font-size: 12px; line-height: 1.3; }
.grid tbody th { width: 74px; font-weight: var(--w-loud); background: var(--bg); vertical-align: middle; text-align: center; }
.grid td.drop-ok { background: var(--ok-bg); outline: 2px solid var(--accent); outline-offset: -2px; }
.grid td.drop-no { background: var(--bad-bg); }
.grid td.un { background: repeating-linear-gradient(135deg, transparent 0 6px, var(--line2) 6px 7px); }
.grid td.un::after { content: '✕ ไม่ว่าง'; display: block; text-align: center; color: var(--ink2); font-size: 12px; padding-top: 24px; }
.blk { --h: 200; position: relative; height: 100%; padding: 3px 6px 3px 9px; border-left: 5px solid hsl(var(--h) 45% 48%); background: hsl(var(--h) 55% 95%); cursor: grab; font-size: 13px; line-height: 1.4; overflow: hidden; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .blk { background: hsl(var(--h) 25% 17%); } }
:root[data-theme="dark"] .blk { background: hsl(var(--h) 25% 17%); }
.blk .a { font-weight: var(--w-loud); font-size: 13.5px; display: block; }
.blk .b, .blk .c { display: block; color: var(--ink2); font-weight: var(--w-body); }
.blk.bad { background: var(--bad-bg); border-left-color: var(--bad); }
.blk.sel { outline: 2px solid var(--ink); outline-offset: -2px; }
.blk .lk { position: absolute; right: 4px; top: 1px; font-size: 11px; color: var(--ink2); }
.blk + .blk { border-top: 1px dashed var(--line); }
.blk.dragging { opacity: .35; }
.bar { margin: 10px 0 0; display: flex; gap: 8px; align-items: center; min-height: 32px; flex-wrap: wrap; }
.bar .info { margin-right: auto; }

.tray { margin-top: 26px; border-top: 1px solid var(--ink); padding-top: 8px; }
.tray.over { background: var(--ok-bg); }
.tray h3 { margin: 0; font-size: 20px; font-weight: var(--w-loud); }
.tray .cards { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; min-height: 42px; }
.tray .blk { width: 190px; height: auto; min-height: 56px; border: 1px solid var(--line); border-left: 5px solid hsl(var(--h) 45% 48%); }
.tray .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; }

/* ---------- ตรวจชน / อาคาร / ตั้งค่า ---------- */
.page { padding: 22px 24px 70px; max-width: 1180px; }
.page h2 { margin: 0 0 4px; font-size: 34px; font-weight: var(--w-loud); line-height: 1.35; }
.page h3 { margin: 34px 0 6px; font-size: 20px; font-weight: var(--w-loud); border-top: 1px solid var(--ink); padding-top: 8px; }
.kpis { display: flex; gap: 0; margin: 14px 0 0; flex-wrap: wrap; }
.kpis div { padding: 0 28px 0 0; margin-right: 28px; border-right: 1px solid var(--line); }
.kpis div:last-child { border: 0; }
.kpis b { display: block; font-size: 44px; line-height: 1.1; font-weight: var(--w-loud); font-variant-numeric: tabular-nums; }
.kpis b.bad { color: var(--bad); }
.kpis span { color: var(--ink2); font-size: 14px; }
table.t { border-collapse: collapse; width: 100%; }
.t th { text-align: left; font-weight: var(--w-quiet); color: var(--ink2); font-size: 13px; border-bottom: 1px solid var(--ink); padding: 3px 8px 3px 0; }
.t td { border-bottom: 1px solid var(--line2); padding: 3px 8px 3px 0; vertical-align: top; }
.t td.r, .t th.r { text-align: right; font-variant-numeric: tabular-nums; }
a.go { color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.ok { color: var(--accent); font-weight: var(--w-loud); }
.bldgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 0 40px; }
.heat { border-collapse: collapse; margin: 6px 0 10px; }
.heat td { width: 30px; height: 22px; text-align: center; font-size: 11px; border: 1px solid var(--bg); color: var(--ink); }
.heat th { font-size: 11px; font-weight: var(--w-quiet); color: var(--ink2); padding: 0 4px; }
.bar1 { height: 6px; background: var(--line2); }
.bar1 i { display: block; height: 100%; background: var(--accent); }
.form { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px 16px; margin-top: 8px; }
.form label { display: block; font-size: 13px; color: var(--ink2); }
.form input, .form select { width: 100%; padding: 4px 8px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); }
.note { border-left: 4px solid var(--warn); padding: 4px 12px; background: var(--panel); margin: 10px 0; }
.note.bad { border-color: var(--bad); }
.note.ok { border-color: var(--accent); }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 6px 18px; border-radius: var(--r); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 50; max-width: 90vw; }
#toast.on { opacity: 1; }
#toast.bad { background: var(--bad); color: #fff; }
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 40; padding: 16px; }
.modal { background: var(--bg); border: 1px solid var(--ink); max-width: 640px; width: 100%; max-height: 90vh; overflow: auto; padding: 18px 22px; }
.modal h3 { margin: 0 0 8px; font-size: 22px; font-weight: var(--w-loud); border: 0; padding: 0; }
.modal .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
.empty { padding: 40px 0; color: var(--ink2); }
.empty h2 { color: var(--ink); }
.cols { display: grid; grid-template-columns: 2fr 5fr; gap: 40px; }

/* ---------- พิมพ์ ---------- */
#printArea { display: none; }
.sheet { page-break-after: always; break-after: page; padding: 0; }
.sheet h1 { margin: 0; font-size: 20px; font-weight: var(--w-loud); }
.sheet .s { margin: 0 0 6px; font-size: 13px; color: #444; }
.sheet table { border-collapse: collapse; width: 100%; table-layout: fixed; }
.sheet th, .sheet td { border: 1px solid #333; padding: 2px 4px; font-size: 11.5px; line-height: 1.3; height: 15mm; vertical-align: top; color: #000; }
.sheet thead th { height: auto; background: #eee; font-weight: 500; }
.sheet thead small { display: block; font-weight: 300; font-size: 10px; }
.sheet tbody th { width: 16mm; background: #eee; text-align: center; vertical-align: middle; }
.sheet td b { font-weight: 800; display: block; }
.sheet .leg { margin-top: 8px; font-size: 11px; columns: 2; }
.prev .sheet { border: 1px solid var(--line); padding: 14px; margin: 14px 0; background: #fff; color: #000; max-width: 1050px; }
@media print {
  @page { size: A4 landscape; margin: 10mm; }
  body { background: #fff; }
  #app, #toast, #modalRoot { display: none !important; }
  #printArea { display: block; }
}
@media (max-width: 900px) {
  .work { grid-template-columns: 1fr; }
  aside.rail { position: static; max-height: 300px; border-right: 0; border-bottom: 1px solid var(--line); }
  .stage h2, .page h2 { font-size: 26px; }
  .stage { padding: 14px 10px 50px; overflow-x: auto; }
  table.grid { min-width: 820px; }
  header.top { padding: 10px 12px 0; gap: 12px; }
  .cols { grid-template-columns: 1fr; gap: 10px; }
}

/* ---------- ส่วนเพิ่ม: กิจกรรมร่วม พักเที่ยง ภาพรวม วิชาและสถานที่ ---------- */
.blk.act { border-left-style: double; border-left-width: 6px; }
.blk.act .b { font-style: italic; }
.grid td.lunch { background: repeating-linear-gradient(45deg, transparent 0 5px, var(--line2) 5px 6px); }
.grid td.lunch::after { content: 'พักเที่ยง'; display: block; text-align: center; color: var(--ink2); font-size: 12px; padding-top: 26px; }
.subseg { display: inline-flex; border: 1px solid var(--ink); margin: 12px 0 4px; }
.subseg button { background: none; border: 0; padding: 3px 18px; cursor: pointer; color: var(--ink2); }
.subseg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); font-weight: var(--w-loud); }
details.ov { border-top: 1px solid var(--line); padding: 4px 0; }
details.ov summary { cursor: pointer; padding: 3px 0; }
details.ov .cols { grid-template-columns: auto 1fr; padding: 8px 0 12px; align-items: start; }
.chips { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; padding: 3px 0; border-bottom: 1px solid var(--line2); }
.chips .lvall { min-width: 110px; }
.chip { border: 1px solid var(--line); padding: 0 8px; border-radius: var(--r); cursor: pointer; }
input.cell, select.cell { width: 100%; min-width: 70px; padding: 1px 6px; border: 1px solid transparent; background: transparent; border-radius: var(--r); }
input.cell:hover, select.cell:hover, input.cell:focus, select.cell:focus { border-color: var(--line); background: var(--panel); }
input.cell.s { max-width: 100px; }
.chipb { border: 1px solid var(--line); background: none; padding: 0 6px; margin: 1px 2px 1px 0; font-size: 12px; cursor: pointer; border-radius: var(--r); color: var(--ink2); }
.chipb[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: var(--w-loud); }
#chgLoc { max-width: 200px; }

.blk.mtg { --h: 40; cursor: default; background: repeating-linear-gradient(135deg, var(--panel) 0 7px, var(--line2) 7px 8px); border-left: 5px solid var(--warn); }
.blk.mtg .a { color: var(--warn); }
.t td.bad { color: var(--bad); font-weight: var(--w-loud); }
.grid td > .blk:not(:only-child) { height: auto; min-height: 36px; }
.grid td > .blk:not(:only-child) .c { display: none; }

/* แท็บอยู่บรรทัดเดียว: แคบเกินให้เลื่อนแนวนอนเฉพาะแถบแท็บ */
header.top { flex-wrap: nowrap; gap: 20px; align-items: flex-end; }
header.top h1 { font-size: 22px; padding-bottom: 6px; flex: none; }
nav.tabs { flex-wrap: nowrap; gap: 16px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs button { flex: none; white-space: nowrap; }
.tools { flex: none; }
.tools .per { white-space: nowrap; }
@media (max-width: 900px) { header.top { gap: 10px; } header.top h1 { font-size: 18px; } .tools .per { display: none; } }
@media (max-width: 760px) { header.top { flex-wrap: wrap; } nav.tabs { order: 3; flex: 1 0 100%; } .tools { margin-left: auto; } }
nav.tabs { gap: 13px; } nav.tabs button { font-size: 14px; }
@media (max-width: 1050px) { .tools .per { display: none; } }
@media (max-width: 1050px) and (min-width: 761px) { header.top { gap: 12px; padding-left: 16px; padding-right: 16px; } header.top h1 { font-size: 20px; } nav.tabs { gap: 11px; } .tools .btn { padding: 3px 8px; } }

/* เงื่อนไขก่อนจัดอัตโนมัติ */
.rules { display: grid; gap: 6px; margin: 8px 0; }
.rule { border: 1px solid var(--line); border-radius: var(--r); padding: 6px 10px; background: var(--panel); }
.rule.on { border-color: var(--accent); box-shadow: inset 4px 0 0 var(--accent); }
.rule .rh { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.rule .rsum { margin: 2px 0 0 24px; font-size: 13px; }
.rule details { margin: 4px 0 0 24px; }
.rule summary { cursor: pointer; font-size: 13px; color: var(--ink2); }
.rform { margin-top: 6px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.rf { margin-top: 6px; font-size: 13px; }
.rf > b { display: block; font-weight: var(--w-loud); color: var(--ink2); }
.rf input[type=text], .rf input:not([type]) { width: 100%; padding: 4px 8px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); }
.rchips { display: flex; flex-wrap: wrap; gap: 4px 6px; }
.rchip { border: 1px solid var(--line); border-radius: var(--r); padding: 0 8px; cursor: pointer; font-size: 13px; }
.rchip input { margin-right: 4px; }
.rcheck { align-self: end; }

/* คาบชั่วคราว: ตำแหน่งว่าง (รอครู) = ลายทางสีเตือน · สอนแทน = ขอบประสีเตือน */
.blk.tmp { background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--warn) 16%, var(--panel)) 0 8px, var(--panel) 8px 16px); border-left-color: var(--warn); border-left-style: dashed; }
.blk.cov { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--warn) 70%, transparent); border-left-color: var(--warn); }
.blk.bad.tmp, .blk.bad.cov { background: var(--bad-bg); }
/* โหมดมืด: กฎ .blk ของโหมดมืด (บรรทัดบน) เจาะจงกว่า จึงต้องใส่ลายทาง/สีแดงซ้ำด้วยตัวเลือกเดียวกัน — .bad ไว้หลังสุดให้ชนะ .tmp */
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .blk.tmp { background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--warn) 16%, var(--panel)) 0 8px, var(--panel) 8px 16px); } :root:not([data-theme="light"]) .blk.bad { background: var(--bad-bg); } }
:root[data-theme="dark"] .blk.tmp { background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--warn) 16%, var(--panel)) 0 8px, var(--panel) 8px 16px); }
:root[data-theme="dark"] .blk.bad { background: var(--bad-bg); }
.blk .tb { position: absolute; right: 3px; bottom: 2px; font-size: 10.5px; line-height: 1.2; padding: 0 4px; border-radius: 3px; background: var(--warn); color: var(--panel); font-weight: var(--w-loud); }
.blk .lk + .tb { bottom: 2px; }
.tbadge { color: var(--warn); font-weight: var(--w-loud); white-space: nowrap; }
td .bad, span.bad { color: var(--bad); }
@media print { .blk .tb { background: none; color: inherit; border: 1px solid; } }

/* ตารางรวมรายวัน */
.wallbox { overflow-x: auto; }
table.wall { border-collapse: collapse; width: 100%; min-width: 900px; font-size: 12px; background: var(--panel); }
table.wall th, table.wall td { border: 1px solid var(--line); padding: 2px 4px; vertical-align: top; line-height: 1.3; }
table.wall thead th { position: sticky; top: 0; background: var(--line2); z-index: 1; }
table.wall thead small, table.wall tbody th small { display: block; font-weight: 300; font-size: 10.5px; color: var(--ink2); }
table.wall tbody th { text-align: left; white-space: nowrap; background: var(--line2); position: sticky; left: 0; }
table.wall td[style] { background: hsl(var(--h) 55% 95%); border-left: 3px solid hsl(var(--h) 45% 48%); }
table.wall td b { display: block; font-weight: var(--w-loud); }
table.wall td.lunch { background: var(--line2); color: var(--ink2); text-align: center; }
table.wall td.mtg { color: var(--warn); }
table.wall td.tmp { background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--warn) 16%, var(--panel)) 0 8px, var(--panel) 8px 16px); }
table.wall td.bad { background: var(--bad-bg); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) table.wall td[style] { background: hsl(var(--h) 25% 17%); } }
:root[data-theme="dark"] table.wall td[style] { background: hsl(var(--h) 25% 17%); }
/* หัวกระดาษ/ลงนาม/หลายตารางต่อแผ่น */
.phead { display: flex; gap: 10px; align-items: center; margin-bottom: 4px; }
.phead img { height: 16mm; width: auto; }
.psign { display: flex; justify-content: space-around; gap: 12px; margin-top: 10mm; font-size: 12px; color: #000; }
.psign div { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.psetup { margin: 8px 0 14px; } .psetup summary { cursor: pointer; font-weight: var(--w-loud); }
.ppage { page-break-after: always; break-after: page; display: grid; gap: 4mm; }
/* A4 แนวนอน ขอบ 10 มม. = พื้นที่ 277×190 มม. · 2 = 1×2 · 4 = 2×2 · 6 = 3×2 (89×93 มม./ตาราง) · 8 = 2×4 (136×46 มม./ตาราง) */
.ppage.pp2 { grid-template-columns: 1fr; } .ppage.pp4 { grid-template-columns: 1fr 1fr; } .ppage.pp6 { grid-template-columns: 1fr 1fr 1fr; } .ppage.pp8 { grid-template-columns: 1fr 1fr; gap: 2mm 4mm; }
.sheet.mini { page-break-after: auto; break-after: auto; break-inside: avoid; }
.sheet.mini h1 { font-size: 11px; line-height: 1.25; } .sheet.mini .s { font-size: 8.5px; line-height: 1.25; margin: 0 0 2px; } .sheet.mini .phead { margin-bottom: 2px; } .sheet.mini .phead img { height: 7mm; } .sheet.mini .af { display: none; }
.sheet.mini th, .sheet.mini td { font-size: 7.5px; height: auto; padding: 1px 2px; line-height: 1.15; } .sheet.mini tbody th { width: 9mm; } .sheet.mini thead small { font-size: 6.5px; } .sheet.mini hr { margin: 1px 0; border: 0; border-top: 1px solid #999; }
.ppage.pp2 .sheet.mini td { height: 11mm; font-size: 9px; } .ppage.pp4 .sheet.mini td { height: 8mm; } .ppage.pp6 .sheet.mini td, .ppage.pp8 .sheet.mini td { height: 5mm; font-size: 6.5px; overflow: hidden; } .ppage.pp6 .sheet.mini th, .ppage.pp8 .sheet.mini th { font-size: 6.5px; }
/* 6/8 ต่อแผ่น ช่องแคบ: แสดงรหัสวิชา ไม่แสดงชื่อวิชา/สอนแทน ตัดบรรทัดยาวทิ้ง (คาบละไม่เกิน 3 บรรทัด) · 8 ต่อแผ่น: รหัส+บรรทัด 2 ในบรรทัดเดียว ไม่มีสถานที่/เวลาคาบ */
.ppage.pp6 .sheet.mini .nm, .ppage.pp6 .sheet.mini .cv, .ppage.pp8 .sheet.mini .nm, .ppage.pp8 .sheet.mini .cv, .ppage.pp8 .sheet.mini .l3, .ppage.pp8 .sheet.mini thead small { display: none; }
.ppage.pp6 .sheet.mini .l2, .ppage.pp6 .sheet.mini .l3 { display: block; white-space: nowrap; } .ppage.pp8 .sheet.mini td { white-space: nowrap; } .ppage.pp8 .sheet.mini td b { display: inline; } .ppage.pp8 .sheet.mini .l2 { margin-left: 2px; }
.sheet.mini .leg { display: none; }
.wallsheet table.wall { min-width: 0; font-size: 8.5px; color: #000; background: #fff; }
.wallsheet table.wall th, .wallsheet table.wall td { border-color: #333; padding: 1px 2px; }
.wallsheet table.wall thead th { position: static; } .wallsheet table.wall tbody th { position: static; }
.sheet.mini .psign { display: none; }
/* พิมพ์ตารางรวมรายวัน: สีตายตัวแบบกระดาษ (กฎโหมดมืดของ td[style] เจาะจงกว่า จึงต้อง !important) */
.wallsheet table.wall th { background: #eee; color: #000; } .wallsheet table.wall small { color: #444; }
.wallsheet table.wall td[style] { background: hsl(var(--h) 55% 95%) !important; }
.wallsheet table.wall td.lunch { background: #eee; color: #333; } .wallsheet table.wall td.mtg { color: #7a5400; }
.wallsheet table.wall td.bad { background: #fbe3df !important; } .wallsheet table.wall td.tmp { background: repeating-linear-gradient(135deg, #f3e7cc 0 8px, #fff 8px 16px) !important; }
.sheet .leg.leg3 { columns: 3; font-size: 10px; }

/* คาบที่ครูรับไว้แทนตำแหน่งว่าง = สีส้ม (ต่างจากคาบรอครูที่เป็นลายทางเหลือง) */
:root { --cov: #c2410c; --cov-bg: #ffedd5; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --cov: #fb923c; --cov-bg: #431407; } }
:root[data-theme="dark"] { --cov: #fb923c; --cov-bg: #431407; }
.blk.cov, :root .blk.cov { background: var(--cov-bg); border-left-color: var(--cov); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--cov) 75%, transparent); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .blk.cov { background: var(--cov-bg); } }
:root[data-theme="dark"] .blk.cov { background: var(--cov-bg); }
/* สอนแทนที่ชนกัน: สีแดงต้องชนะสีส้ม (กฎ .cov ด้านบนเจาะจงเท่ากันและอยู่หลัง .blk.bad.cov) */
.blk.bad.cov, :root .blk.bad.cov, :root[data-theme="dark"] .blk.bad.cov { background: var(--bad-bg); border-left-color: var(--bad); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--bad) 75%, transparent); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .blk.bad.cov { background: var(--bad-bg); } }
.blk.cov .tb { background: var(--cov); color: #fff; }
table.wall td.cov, :root table.wall td.cov[style] { background: var(--cov-bg) !important; border-left-color: var(--cov); }
.wallsheet table.wall td.cov, :root .wallsheet table.wall td.cov[style] { background: #ffedd5 !important; }
table.wall td .cv { display: block; max-width: 18em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 10.5px; font-weight: 700; color: var(--cov); }
.wallsheet table.wall td .cv { max-width: 10em; font-size: 7.5px; color: #c2410c; }
.sheet td.cov { background: #ffedd5; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.sheet .cv i, .sheet td.cov i { color: #c2410c; font-style: normal; font-weight: 700; }

<body>
<div id="app"></div>
<div id="printArea"></div>
<div id="toast" role="status"></div>

<script src="vendor/xlsx.full.min.js"></script>

<script id="core">
/* ตรรกะล้วน ไม่แตะ DOM — ใช้ทั้งในหน้าเว็บ, Web Worker และ selftest ใน Node */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.TT = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const DAYS = [
    { v: 1, label: 'จันทร์', short: 'จ.' }, { v: 2, label: 'อังคาร', short: 'อ.' }, { v: 3, label: 'พุธ', short: 'พ.' },
    { v: 4, label: 'พฤหัสบดี', short: 'พฤ.' }, { v: 5, label: 'ศุกร์', short: 'ศ.' }
  ];
  const DEFAULT_TIMES = ['08:30', '09:20', '10:10', '11:00', '11:50', '12:40', '13:30', '14:20', '15:10'];
  const XLS_HEAD = ['ปีการศึกษา', 'ภาคเรียน', 'อีเมลครู', 'ชื่อครู', 'เบอร์โทร', 'กลุ่มสาระ', 'วัน', 'คาบ', 'รหัสวิชา', 'ชื่อวิชา', 'ห้องเรียน', 'สถานที่'];

  const LOC_KINDS = ['ห้องเรียนทั่วไป', 'พลศึกษา/สนาม', 'ดนตรี', 'นาฏศิลป์', 'ศิลปะ', 'ห้องปฏิบัติการ (Lab)', 'คอมพิวเตอร์', 'การงานอาชีพ', 'อื่น ๆ'];
  const DEFAULT_LUNCH = { 1: 4, 2: 4, 3: 4, 4: 5, 5: 5, 6: 5 };
  function inferLocKind(name) {
    name = String(name || '');
    if (/^ห้อง\s*\d/.test(name)) return LOC_KINDS[0];
    if (/ดนตรี/.test(name)) return 'ดนตรี';
    if (/นาฏ/.test(name)) return 'นาฏศิลป์';
    if (/ศิลป/.test(name)) return 'ศิลปะ';
    if (/ฟุตบอล|กรีฑา|บาส|แบด|ลีลาศ|วอลเลย์|ว่ายน้ำ|สนาม|ยิม|พละ|โดม/.test(name)) return 'พลศึกษา/สนาม';
    if (/lab|แล็บ|ปฏิบัติการ|เคมี|ฟิสิกส์|ชีว/i.test(name)) return 'ห้องปฏิบัติการ (Lab)';
    if (/คอม/.test(name)) return 'คอมพิวเตอร์';
    if (/การงาน/.test(name)) return 'การงานอาชีพ';
    return 'อื่น ๆ';
  }
  /** เติมฟิลด์ที่โมเดลรุ่นเก่าไม่มี */
  function migrate(model) {
    const st = model.settings;
    if (!st.lunch) { st.lunch = Object.assign({}, DEFAULT_LUNCH); if ((st.noBlockAfter || []).join() === '4') st.noBlockAfter = []; }
    if (!st.noBlockAfter) st.noBlockAfter = [];
    if (!model.roles) model.roles = [];
    if (!model.meetings) model.meetings = {};
    if (!model.curriculum) model.curriculum = {};
    if (!Array.isArray(st.solveRules)) st.solveRules = defaultSolveRules();
    else defaultSolveRules().forEach(r => { if (!st.solveRules.some(x => x.id === r.id)) st.solveRules.push(r); });   // เงื่อนไขที่เพิ่มในเวอร์ชันหลัง
    Object.values(model.teachers).forEach(t => { if (!t.roles) t.roles = []; });
    Object.values(model.subjects).forEach(x => { if (!x.kind) x.kind = 'normal'; if (!x.locKinds) x.locKinds = []; });
    Object.keys(model.locations).forEach(k => { const l = model.locations[k]; if (!l.name) l.name = k; if (!l.kind) l.kind = inferLocKind(k); });
    return model;
  }

  /* ---------- ชื่อและข้อความ ---------- */
  /** ยุบช่องว่างซ้ำ และแปลง ํา (U+0E4D U+0E32) เป็น ำ — ไฟล์โรงเรียนและ PDF ใช้ไม่เหมือนกัน */
  function normName(s) {
    return String(s == null ? '' : s).replace(/ํา/g, 'ำ').replace(/[\s ]+/g, ' ').trim();
  }
  const normHead = s => normName(s).replace(/\s/g, '').toLowerCase();
  const fbStaffId = email => String(email || '').trim().toLowerCase().replace(/[^a-z0-9@._-]/g, '_');

  function dayFromText(t) {
    t = normName(t);
    const n = parseInt(t, 10);
    if (n >= 1 && n <= 5 && /^\d$/.test(t)) return n;
    const map = { 'จันทร์': 1, 'จ': 1, 'จ.': 1, 'อังคาร': 2, 'อ': 2, 'อ.': 2, 'พุธ': 3, 'พ': 3, 'พ.': 3, 'พฤหัสบดี': 4, 'พฤหัส': 4, 'พฤ': 4, 'พฤ.': 4, 'ศุกร์': 5, 'ศ': 5, 'ศ.': 5 };
    return map[t] || 0;
  }
  function slotFromText(t) {
    t = normName(t);
    if (/เข้าแถว|homeroom/i.test(t)) return 0;
    return /^\d+$/.test(t) && +t >= 1 && +t <= 12 ? +t : -1;
  }

  /* ---------- ห้องเรียน / อาคาร ---------- */
  /** ม.4/9ญ → ระดับ 4, ห้อง 9, กลุ่มย่อย ญ (แม่ = ม.4/9) */
  function classInfo(name) {
    const m = /^ม\.?\s*(\d)\s*\/\s*(\d+)\s*(.*)$/.exec(normName(name));
    if (!m) return { level: 0, room: 0, suffix: '', parent: '' };
    return { level: +m[1], room: +m[2], suffix: m[3] || '', parent: m[3] ? 'ม.' + m[1] + '/' + m[2] : '' };
  }
  /** เลขหลักแรกของห้อง 3 หลัก = อาคาร ที่เหลือ (การงาน1, ฟุตบอล ฯลฯ) = ห้องพิเศษ/สนาม */
  /** ประเภทวิชาจากรหัส: เลขหลักที่ 3 — 1 = พื้นฐาน (ว31101) 2 = เพิ่มเติม (ว32201) อื่น ๆ = กิจกรรม */
  function subjectType(code) { const m = String(code || '').match(/^\D*\d\d(\d)\d\d/); return !m ? '' : m[1] === '1' ? 'basic' : m[1] === '2' ? 'extra' : 'other'; }
  /** กลุ่มย่อย (ห้องที่มีตัวอักษรต่อท้าย เช่น ม.4/9ญ) แยกเรียนได้เฉพาะวิชาเพิ่มเติม — วิชาพื้นฐานต้องเรียนรวมที่ห้องแม่ */
  /** มีห้องแม่อยู่จริงในโมเดล (ม.4/1 EP ที่ไม่มี ม.4/1 = ห้องหลัก ไม่ใช่กลุ่มย่อย) — parseLoad เรียกก่อน classRelations จึงหาชื่อเองด้วย */
  const hasParent = (model, c) => { const p = classInfo(c.name).parent; return !!p && (!!model.classes[c.parentId] || Object.values(model.classes).some(x => x.name === p)); };
  const subBasic = (model, x) => { const c = model.classes[x.classId]; return !!(c && hasParent(model, c) && subjectType((model.subjects[x.subjectId] || {}).code) === 'basic'); };

  function defaultBuilding(loc) {
    const m = /(?:^|\s)(\d)\d\d\s*$/.exec(normName(loc));
    return m ? m[1] : 'X';
  }
  const buildingOf = (model, loc) => (model.locations[loc] && model.locations[loc].building) || defaultBuilding(loc);
  const buildingName = (model, b) => (model.settings.buildings && model.settings.buildings[b]) || (b === 'X' ? 'ห้องพิเศษ/สนาม' : 'อาคาร ' + b);

  /* ---------- โมเดล ---------- */
  function newModel() {
    return {
      version: 1, school: 'โรงเรียนปากช่อง', period: { year: '', semester: '', id: '' },
      settings: { maxPerDay: 7, maxSlot: 9, noBlockAfter: [], lunch: Object.assign({}, DEFAULT_LUNCH), times: DEFAULT_TIMES.slice(), buildings: {} },
      teachers: {}, classes: {}, subjects: {}, locations: {}, entries: {}, pool: {}, roles: [], meetings: {}, seq: 0, cloud: null
    };
  }
  const nextId = (model, p) => p + (++model.seq).toString(36) + Math.random().toString(36).slice(2, 5);

  /** สร้างความสัมพันธ์ห้องแม่/กลุ่มย่อย: rel[id] = ห้องที่ชนกับห้องนี้ (ตัวเอง แม่ ลูก) */
  function classRelations(model) {
    const byName = {};
    Object.values(model.classes).forEach(c => { byName[c.name] = c; });
    const rel = {};
    Object.values(model.classes).forEach(c => { rel[c.id] = new Set([c.id]); });
    Object.values(model.classes).forEach(c => {
      const p = classInfo(c.name).parent, pc = p && byName[p];
      if (pc) { c.parentId = pc.id; rel[c.id].add(pc.id); rel[pc.id].add(c.id); } else delete c.parentId;
    });
    return rel;
  }

  /* ---------- เงื่อนไขก่อนจัดอัตโนมัติ (settings.solveRules) ----------
     ผู้จัดตารางติ๊กเลือกก่อนกดจัด เช่น ห้อง Lab ให้วิชาวิทย์ก่อน หัวหน้ากลุ่มสาระเน้นคาบเช้า ล็อกคาบสำคัญ
     แต่ละข้อมี "ควร" (คิดเป็นคะแนนโทษ ตัวจัดเลี่ยงเมื่อทำได้) กับ "ต้อง" (ตัดช่องที่ผิดทิ้ง ถ้าลงไม่ได้จะค้างในถาด)
     ใช้เฉพาะตอนจัดอัตโนมัติ — ลากวางเองไม่ถูกบังคับ ครูผู้จัดยังตัดสินใจเองได้
     sel = { areas, codes, levels, classes, roles } เงื่อนไขในช่องเดียวกันเป็น "หรือ" ต่างช่องเป็น "และ" ช่องว่าง = ทั้งหมด */
  const RULE_WEIGHT = 6;
  function defaultSolveRules() {
    return [
      { id: 'labSci', on: false, type: 'reserve', kind: 'ห้องปฏิบัติการ (Lab)', first: true, sel: { areas: ['วิทยาศาสตร์'] }, label: 'ห้องปฏิบัติการ (Lab) สงวนให้วิชาวิทยาศาสตร์ และจัดวิชาวิทย์ก่อน' },
      { id: 'sciClassAm', on: false, type: 'time', mode: 'prefer', hard: false, days: [], from: 1, to: 4, sel: { areas: ['วิทยาศาสตร์', 'คณิตศาสตร์'], classes: [] }, label: 'ห้องเรียนแผนวิทย์-คณิต เรียนวิทย์/คณิตช่วงเช้า' },
      { id: 'headAm', on: false, type: 'time', mode: 'prefer', hard: false, days: [], from: 1, to: 4, sel: { roles: ['หัวหน้ากลุ่มสาระ'] }, label: 'หัวหน้ากลุ่มสาระเน้นสอนคาบเช้า' },
      { id: 'coreAm', on: false, type: 'time', mode: 'prefer', hard: false, days: [], from: 1, to: 4, sel: { areas: ['ภาษาไทย', 'คณิตศาสตร์', 'วิทยาศาสตร์', 'ภาษาต่างประเทศ'] }, label: 'วิชาหลักเรียนช่วงเช้า' },
      { id: 'peNoon', on: false, type: 'time', mode: 'avoid', hard: false, days: [], from: 4, to: 6, sel: { areas: ['สุขศึกษาและพลศึกษา'] }, label: 'พลศึกษาเลี่ยงคาบเที่ยง (แดดจัด)' },
      { id: 'lockKey', on: false, type: 'lock', sel: { areas: [], codes: [] }, label: 'ล็อกคาบที่ลงแล้วของวิชา/กลุ่มสาระที่เลือก ไม่ให้ระบบย้าย' },
      { id: 'once', on: true, type: 'oncePerDay', hard: false, label: 'วิชาเดียวกันเรียนไม่เกินวันละ 1 ครั้งต่อห้อง (คาบคู่นับเป็นครั้งเดียว)' },
      { id: 'maxDay', on: false, type: 'maxDay', hard: true, n: 6, label: 'ครูสอนไม่เกินวันละ N คาบ' },
      { id: 'maxRun', on: false, type: 'maxRun', hard: true, n: 4, label: 'ครูสอนติดกันไม่เกิน N คาบ' },
      { id: 'closed', on: false, type: 'time', mode: 'avoid', hard: true, days: [3], from: 7, to: 9, sel: {}, label: 'เว้นช่วงเวลาทั้งโรงเรียน (เช่น PLC)' },
      { id: 'mimic', on: false, type: 'mimic', hard: false, label: 'เลียนแบบตารางต้นแบบ (ปี/ภาคก่อน) — ครูคนเดิมลงวัน/คาบเดิม' }
    ];
  }
  /** ตัวตรวจว่าบัตร/คาบตรงกับ sel ไหม — ใช้ทั้งตัวจัดและหน้าจอ (ล็อกก่อนจัด) */
  function ruleMatcher(model) {
    const cache = new Map();
    const info = c => {
      const key = (c.subjectId || '') + '|' + (c.teacherId || '') + '|' + (c.classId || (c.classIds || [])[0] || '');
      let i = cache.get(key); if (i) return i;
      const s = model.subjects[c.subjectId] || {}, t = model.teachers[c.teacherId] || {}, cl = model.classes[c.classId || (c.classIds || [])[0]] || {};
      i = { area: s.area || t.area || '', code: s.code || '', level: cl.level || 0, cls: cl.name || '', roles: t.roles || [] };
      cache.set(key, i); return i;
    };
    const any = a => !a || !a.length;
    // กลุ่มสาระเทียบแบบมีคำอยู่ในชื่อ ไฟล์โรงเรียนเขียนทั้ง "วิทยาศาสตร์" และ "วิทยาศาสตร์และเทคโนโลยี"
    return (sel, c) => {
      if (!sel) return true; const i = info(c);
      return (any(sel.areas) || sel.areas.some(a => a && i.area.includes(a)))
        && (any(sel.codes) || sel.codes.includes(i.code))
        && (any(sel.levels) || sel.levels.map(Number).includes(i.level))
        && (any(sel.classes) || sel.classes.includes(i.cls))
        && (any(sel.roles) || sel.roles.some(r => i.roles.includes(r)));
    };
  }
  const ruleEmpty = sel => !sel || !['areas', 'codes', 'levels', 'classes', 'roles'].some(k => (sel[k] || []).length);

  /** อ่านตาราง (อาร์เรย์ของแถว) รูปแบบเดียวกับไฟล์ "พร้อมนำเข้า" ของ KruSpace */
  function parseRows(rows, prev) {
    if (!rows || rows.length < 2) throw new Error('ไม่พบข้อมูลในชีต');
    const heads = rows[0].map(normHead);
    const col = names => heads.findIndex(h => names.some(n => h.includes(normHead(n))));
    const ix = {
      year: col(['ปีการศึกษา']), sem: col(['ภาคเรียน']), email: col(['อีเมลครู', 'email']), teacher: col(['ชื่อครู', 'ครูผู้สอน']),
      phone: col(['เบอร์โทร']), area: col(['กลุ่มสาระ']), day: col(['วัน']), slot: col(['คาบ']),
      code: col(['รหัสวิชา']), subj: col(['ชื่อวิชา', 'รายวิชา']), cls: col(['ห้องเรียน', 'ชั้นเรียน']), room: col(['สถานที่', 'ห้องสอน']), cv: col(['สอนแทน'])
    };
    const miss = [['ชื่อครู', ix.teacher], ['วัน', ix.day], ['คาบ', ix.slot], ['รหัสวิชา', ix.code], ['ห้องเรียน', ix.cls]].filter(x => x[1] < 0).map(x => x[0]);
    if (miss.length) throw new Error('ขาดคอลัมน์สำคัญ: ' + miss.join(', '));
    const model = newModel();
    if (prev) { model.school = prev.school; model.settings = prev.settings; }
    const issues = [], seenT = {}, covs = [];
    const get = (r, i) => i >= 0 && r[i] != null ? String(r[i]).trim() : '';
    rows.slice(1).forEach((r, n) => {
      const tname = normName(get(r, ix.teacher)), cname = normName(get(r, ix.cls)), code = normName(get(r, ix.code));
      if (!tname && !cname && !code) return;
      const day = dayFromText(get(r, ix.day)), slot = slotFromText(get(r, ix.slot));
      if (!tname || !cname || !code || !day || slot < 1) { issues.push({ row: n + 2, msg: 'ข้อมูลไม่ครบหรือวัน/คาบไม่ถูกต้อง (ข้ามแถวนี้)' }); return; }
      if (!model.period.year) { model.period.year = get(r, ix.year); model.period.semester = get(r, ix.sem); }
      const tid = 'tn:' + tname;
      const t = model.teachers[tid] || (model.teachers[tid] = { id: tid, name: tname, email: '', area: '', unavail: [] });
      const em = get(r, ix.email).toLowerCase();
      if (em && !t.email) t.email = em;
      if (!t.area && get(r, ix.area)) t.area = normName(get(r, ix.area));
      seenT[tid] = 1;
      const cid = 'c:' + cname;
      if (!model.classes[cid]) { const ci = classInfo(cname); model.classes[cid] = { id: cid, name: cname, level: ci.level, room: ci.room }; }
      const sid = 's:' + code;
      if (!model.subjects[sid]) model.subjects[sid] = { id: sid, code: code, name: normName(get(r, ix.subj)) || code, area: t.area };
      const loc = normName(get(r, ix.room));
      if (loc && !model.locations[loc]) model.locations[loc] = { name: loc, building: defaultBuilding(loc), kind: inferLocKind(loc) };
      model.seq++;
      const id = 'e' + model.seq.toString(36);
      model.entries[id] = { id: id, teacherId: tid, subjectId: sid, classId: cid, day: day, slot: slot, room: loc };
      // คอลัมน์ "สอนแทน (ตำแหน่งว่าง)" จาก EMS: คาบที่ครูรับไว้แทนครูที่ยังไม่มา
      const cvn = normName(get(r, ix.cv));
      if (cvn && cvn !== tname) covs.push({ id: id, name: cvn, area: t.area || '', row: n + 2 });
    });
    // ตั้งตำแหน่งว่างหลังอ่านครบทุกแถว — ชื่อที่เป็นครูจริง (มีแถวของตัวเอง/มีอีเมล ชื่อไม่ใช่ "รอครู …") ห้ามกลายเป็นตำแหน่งว่าง
    const wasTemp = name => !!(prev && Object.values(prev.teachers || {}).some(x => x.temp && x.name === name));
    covs.forEach(c => {
      const vid = 'tn:' + c.name, v = model.teachers[vid];
      if (v && (seenT[vid] || v.email) && !v.temp && !TEMP_NAME.test(c.name) && !wasTemp(c.name)) { issues.push({ row: c.row, warn: true, msg: 'ช่องสอนแทน “' + c.name + '” เป็นครูที่มีคาบของตัวเอง ไม่ใช่ตำแหน่งว่าง (ไม่ตั้งเป็นคาบสอนแทน)' }); return; }
      if (!v) model.teachers[vid] = { id: vid, name: c.name, email: '', area: c.area, unavail: [], roles: [], temp: { note: 'จาก EMS', expect: '' } }; else if (!v.temp) v.temp = { note: 'จาก EMS', expect: '' };
      model.entries[c.id].cover = vid;
    });
    classRelations(model);
    migrate(model);
    // วิชาที่ใช้สถานที่พิเศษ (สนาม ห้องดนตรี ฯลฯ) จำประเภทไว้ ให้ตัวจัดอัตโนมัติเลือกห้องว่างให้ได้
    Object.values(model.entries).forEach(e => { const l = model.locations[e.room], sb = model.subjects[e.subjectId]; if (l && sb && l.kind !== LOC_KINDS[0] && l.kind !== 'อื่น ๆ' && !sb.locKinds.includes(l.kind)) sb.locKinds.push(l.kind); });
    // ตำแหน่งว่างที่เคยตั้งไว้ในข้อมูลเดิม คงสถานะไว้ (ชื่อเดียวกัน)
    if (prev) Object.values(prev.teachers || {}).forEach(t => { if (t.temp && model.teachers['tn:' + t.name]) model.teachers['tn:' + t.name].temp = JSON.parse(JSON.stringify(t.temp)); });
    markTempByName(model, 'จากชื่อในไฟล์');
    return { model: model, issues: issues };
  }

  /** ชีต "กิจกรรมร่วม": วัน คาบ รหัสวิชา ชื่อวิชา ห้องเรียน สถานที่ — ไม่มีครู */
  function parseActivities(model, rows) {
    if (!rows || rows.length < 2) return 0;
    const heads = rows[0].map(normHead), col = n => heads.findIndex(h => h.includes(normHead(n)));
    const ix = { day: col('วัน'), slot: col('คาบ'), code: col('รหัสวิชา'), subj: col('ชื่อวิชา'), cls: col('ห้องเรียน'), room: col('สถานที่') };
    if (ix.day < 0 || ix.slot < 0 || ix.code < 0 || ix.cls < 0) return 0;
    const get = (r, i) => i >= 0 && r[i] != null ? String(r[i]).trim() : '';
    let n = 0;
    rows.slice(1).forEach(r => {
      const day = dayFromText(get(r, ix.day)), slot = slotFromText(get(r, ix.slot)), code = normName(get(r, ix.code)), cname = normName(get(r, ix.cls));
      if (!day || slot < 1 || !code || !cname) return;
      const cid = 'c:' + cname; if (!model.classes[cid]) { const ci = classInfo(cname); model.classes[cid] = { id: cid, name: cname, level: ci.level, room: ci.room }; }
      const sid = 's:' + code; if (!model.subjects[sid]) model.subjects[sid] = { id: sid, code: code, name: normName(get(r, ix.subj)) || code, area: '', kind: 'activity', locKinds: [] };
      const loc = normName(get(r, ix.room)); if (loc && !model.locations[loc]) model.locations[loc] = { name: loc, building: defaultBuilding(loc), kind: inferLocKind(loc) };
      model.seq++; const id = 'e' + model.seq.toString(36);
      model.entries[id] = { id: id, teacherId: '', subjectId: sid, classId: cid, day: day, slot: slot, room: loc, grp: 'g' + day + '-' + slot + '-' + code };
      n++;
    });

    return n;
  }
  /** ชีต "ประชุม": ชื่อการประชุม บทบาท วัน คาบ จำนวนคาบ สถานที่ + ชีต "บทบาทครู": ชื่อครู บทบาท */
  function exportMeetingRows(model) {
    const rows = [['ชื่อการประชุม/ภารกิจ', 'บทบาทที่ต้องเข้า', 'วัน', 'คาบ', 'จำนวนคาบ', 'สถานที่']];
    Object.values(model.meetings).sort((a, b) => a.day - b.day || a.slot - b.slot).forEach(m => rows.push([m.name, (m.roles || []).join(', '), DAYS[m.day - 1].label, String(m.slot), String(m.span || 1), m.room || '']));
    return rows;
  }
  function exportRoleRows(model) {
    const rows = [['ชื่อครู', 'อีเมลครู', 'บทบาท']];
    Object.values(model.teachers).filter(t => (t.roles || []).length).sort((a, b) => a.name.localeCompare(b.name, 'th')).forEach(t => rows.push([t.name, t.email, t.roles.join(', ')]));
    return rows;
  }
  function parseMeetings(model, mRows, rRows) {
    let n = 0;
    if (rRows && rRows.length > 1) {
      const h = rRows[0].map(normHead), ci = { n: h.findIndex(x => x.includes('ชื่อครู')), e: h.findIndex(x => x.includes('อีเมล')), r: h.findIndex(x => x.includes('บทบาท')) };
      const byMail = {}, byName = {}; Object.values(model.teachers).forEach(t => { if (t.email) byMail[t.email] = t; byName[normName(t.name)] = t; });
      rRows.slice(1).forEach(r => {
        const t = (ci.e >= 0 && byMail[String(r[ci.e] || '').trim().toLowerCase()]) || byName[normName(r[ci.n])]; if (!t || ci.r < 0) return;
        String(r[ci.r] || '').split(',').map(normName).filter(Boolean).forEach(x => { if (!model.roles.includes(x)) model.roles.push(x); if (!t.roles.includes(x)) t.roles.push(x); });
      });
    }
    if (mRows && mRows.length > 1) {
      const h = mRows[0].map(normHead), ix = { n: h.findIndex(x => x.includes('ชื่อการประชุม')), r: h.findIndex(x => x.includes('บทบาท')), d: h.findIndex(x => x === 'วัน'), s: h.findIndex(x => x === 'คาบ'), p: h.findIndex(x => x.includes('จำนวนคาบ')), l: h.findIndex(x => x.includes('สถานที่')) };
      mRows.slice(1).forEach(r => {
        const name = normName(r[ix.n]), day = dayFromText(r[ix.d]), slot = slotFromText(r[ix.s]); if (!name || !day || slot < 1) return;
        const roles = String(r[ix.r] || '').split(',').map(normName).filter(Boolean); roles.forEach(x => { if (!model.roles.includes(x)) model.roles.push(x); });
        model.seq++; const id = 'm' + model.seq.toString(36);
        model.meetings[id] = { id: id, name: name, roles: roles, day: day, slot: slot, span: Math.max(1, +r[ix.p] || 1), room: normName(r[ix.l]) }; n++;
      });
    }
    return n;
  }
  function exportActivityRows(model) {
    const rows = [['วัน', 'คาบ', 'รหัสวิชา', 'ชื่อวิชา', 'ห้องเรียน', 'สถานที่']];
    Object.values(model.entries).filter(e => !e.teacherId).map(e => ({ e: e, s: model.subjects[e.subjectId], c: model.classes[e.classId] })).filter(x => x.s && x.c)
      .sort((a, b) => a.e.day - b.e.day || a.e.slot - b.e.slot || a.s.code.localeCompare(b.s.code) || a.c.name.localeCompare(b.c.name, 'th'))
      .forEach(x => rows.push([DAYS[x.e.day - 1].label, String(x.e.slot), x.s.code, x.s.name, x.c.name, x.e.room]));
    return rows;

  /** ส่งออกเป็นแถวรูปแบบเดียวกับไฟล์พร้อมนำเข้า (เรียงครู วัน คาบ) */
  function exportRows(model) {
    const rows = [XLS_HEAD.slice()];
    Object.values(model.entries).map(e => ({ e: e, t: model.teachers[e.teacherId], s: model.subjects[e.subjectId], c: model.classes[e.classId] }))
      .filter(x => x.t && x.s && x.c)
      .sort((a, b) => a.t.name.localeCompare(b.t.name, 'th') || a.e.day - b.e.day || a.e.slot - b.e.slot)
      .forEach(x => rows.push([model.period.year, model.period.semester, x.t.email, x.t.name, '', x.t.area, DAYS[x.e.day - 1].label, String(x.e.slot), x.s.code, x.s.name, x.c.name, x.e.room]));
    return rows;
  }

  /** ครูที่ต้องเข้าประชุม = ครูที่มีบทบาทตรงกับบทบาทที่ประชุมกำหนด */
  function meetingTeachers(model, mt) {
    const rs = mt.roles || [];
    return Object.values(model.teachers).filter(t => (t.roles || []).some(r => rs.includes(r)));
  }

  /* ---------- ดัชนีตรวจชน ---------- */
  const K = (d, s, id) => d + '|' + s + '|' + id;
  function push(map, k, id) { (map.get(k) || map.set(k, []).get(k)).push(id); }
  function pull(map, k, id) { const a = map.get(k); if (!a) return; const i = a.indexOf(id); if (i >= 0) a.splice(i, 1); if (!a.length) map.delete(k); }

  class Index {
    constructor(model) {
      this.m = model; this.rel = classRelations(model);
      this.T = new Map(); this.C = new Map(); this.L = new Map(); this.perDay = new Map(); this.M = new Map();
      Object.values(model.entries).forEach(e => this.add(e));
      this.buildMeetings();
    }
    /** ช่องที่ครูติดประชุม/ภารกิจ: K(วัน,คาบ,ครู) → {name, room, id} */
    buildMeetings() {
      this.M = new Map();
      Object.values(this.m.meetings || {}).forEach(mt => { const ts = meetingTeachers(this.m, mt); for (let k = 0; k < (mt.span || 1); k++) ts.forEach(t => this.M.set(K(mt.day, mt.slot + k, t.id), { id: mt.id, name: mt.name, room: mt.room || '' })); });
    }
    sharedLoc(loc) { const l = this.m.locations[loc]; return !loc || (l && l.shared); }
    add(e) {
      if (e.teacherId) { push(this.T, K(e.day, e.slot, e.teacherId), e.id); const k = e.teacherId + '|' + e.day; this.perDay.set(k, (this.perDay.get(k) || 0) + 1); }
      push(this.C, K(e.day, e.slot, e.classId), e.id);
      if (!this.sharedLoc(e.room)) push(this.L, K(e.day, e.slot, e.room), e.id);
    }
    remove(e) {
      if (e.teacherId) { pull(this.T, K(e.day, e.slot, e.teacherId), e.id); const k = e.teacherId + '|' + e.day; const n = (this.perDay.get(k) || 1) - 1; if (n > 0) this.perDay.set(k, n); else this.perDay.delete(k); }
      pull(this.C, K(e.day, e.slot, e.classId), e.id);
      if (!this.sharedLoc(e.room)) pull(this.L, K(e.day, e.slot, e.room), e.id);
    }
    /** คืนสิ่งที่ชนสำหรับคาบ 1 ช่อง (ไม่นับ id ใน ignore) */
    clash(x, day, slot, ignore) {
      const out = { teacher: [], cls: [], loc: [] }, ok = id => !(ignore && ignore.has(id));
      if (x.teacherId) (this.T.get(K(day, slot, x.teacherId)) || []).forEach(id => { if (ok(id)) out.teacher.push(id); });
      const rel = this.rel[x.classId] || [x.classId];
      rel.forEach(cid => (this.C.get(K(day, slot, cid)) || []).forEach(id => { if (ok(id)) out.cls.push(id); }));
      if (!this.sharedLoc(x.room)) (this.L.get(K(day, slot, x.room)) || []).forEach(id => { if (ok(id)) out.loc.push(id); });
      return out;
    }
    /** พักเที่ยงของระดับชั้นของห้องนี้ตรงกับคาบนี้ไหม */
    lunchAt(classId, slot) { const c = this.m.classes[classId], l = (this.m.settings.lunch || {})[c ? c.level : 0]; return !!l && l === slot; }
    /** ตรวจว่าวางบล็อกได้ไหม — block[i] อยู่ที่คาบ slot + (block.offs ? block.offs[i] : i) (หลายห้องพร้อมกันใช้ offs ซ้ำได้) */
    canPlace(block, day, slot, ignore) {
      const st = this.m.settings, why = [], off = i => (block.offs ? block.offs[i] : i);
      if (day < 1 || day > 5) return { ok: false, why: ['วันไม่ถูกต้อง'] };
      let mx = 0; block.forEach((b, i) => { mx = Math.max(mx, off(i)); });
      if (slot < 1 || slot + mx > st.maxSlot) return { ok: false, why: ['เกินจำนวนคาบต่อวัน'] };
      for (let k = 1; k <= mx; k++) if ((st.noBlockAfter || []).includes(slot + k - 1)) return { ok: false, why: ['คาบคู่ข้ามช่วงพักไม่ได้'] };
      block.forEach((b, i) => {
        const s = slot + off(i), t = b.teacherId && this.m.teachers[b.teacherId];
        if (t && (t.unavail || []).includes(day + '-' + s)) why.push('ครูไม่ว่างคาบนี้');
        if (t && this.M.has(K(day, s, t.id))) why.push('ครูติดประชุม/ภารกิจคาบนี้');
        if (this.lunchAt(b.classId, s)) why.push('คาบพักเที่ยงของระดับชั้นนี้');
        if (subBasic(this.m, b)) why.push('วิชาพื้นฐานต้องเรียนรวมทั้งห้อง (กลุ่มย่อยแยกเรียนเฉพาะวิชาเพิ่มเติม)');
        const c = this.clash(b, day, s, ignore);
        if (c.teacher.length) why.push('ครูมีสอนคาบนี้แล้ว');
        if (c.cls.length) why.push('ห้องเรียนมีเรียนคาบนี้แล้ว');
        if (c.loc.length) why.push('สถานที่ถูกใช้แล้ว');
      });
      return { ok: !why.length, why: Array.from(new Set(why)) };
    }
    /** สถานที่ชนิดที่ต้องการที่ว่างทุกคาบของบล็อก (ไว้ให้ระบบเลือกให้) */
    freeLocations(kinds, day, slot, span, ignore) {
      return Object.keys(this.m.locations).filter(n => { const l = this.m.locations[n]; if (!kinds.includes(l.kind) || l.shared) return false; for (let k = 0; k < span; k++) if ((this.L.get(K(day, slot + k, n)) || []).some(id => !(ignore && ignore.has(id)))) return false; return true; });
    }
    /** คาบที่ชนกันทั้งหมดในโมเดล (รายงาน) */
    allClashes() {
      const res = { teacher: [], cls: [], loc: [] };
      this.T.forEach((ids, k) => { if (ids.length > 1) res.teacher.push({ key: k, ids: ids.slice() }); });
      this.L.forEach((ids, k) => { if (ids.length > 1) res.loc.push({ key: k, ids: ids.slice() }); });
      const seen = new Set();
      this.C.forEach((ids, k) => {
        const [d, s] = k.split('|'), cid = k.slice(d.length + s.length + 2);
        const all = [];
        (this.rel[cid] || [cid]).forEach(r => (this.C.get(K(d, s, r)) || []).forEach(id => all.push(id)));
        const uniq = Array.from(new Set(all));
        if (uniq.length > 1) { const sig = d + '|' + s + '|' + uniq.sort().join(','); if (!seen.has(sig)) { seen.add(sig); res.cls.push({ key: k, ids: uniq }); } }
      });
      return res;
    }
  }

  /** หน่วยที่ลากด้วยกัน: กิจกรรมร่วม (grp เดียวกัน หลายห้องพร้อมกัน) หรือบล็อกคาบต่อเนื่องของครู */
  function moveUnit(model, idx, id) {
    const e = model.entries[id]; if (!e) return [];
    if (!e.grp) return blockOf(model, idx, id);
    const all = Object.values(model.entries).filter(x => x.grp === e.grp && x.day === e.day).sort((a, b) => a.slot - b.slot || a.classId.localeCompare(b.classId));
    const mn = all[0].slot; all.offs = all.map(x => x.slot - mn);
    return all;
  }
  /** บล็อกคาบต่อเนื่อง (ครู วิชา ห้อง สถานที่ เดียวกัน คาบติดกัน) ที่ entry นี้อยู่ */
  function blockOf(model, idx, id) {
    const e = model.entries[id]; if (!e) return [];
    const same = o => o && o.subjectId === e.subjectId && o.classId === e.classId && o.room === e.room && o.day === e.day;
    if (!e.teacherId) return [e];
    const find = s => { const a = idx.T.get(K(e.day, s, e.teacherId)); const o = a && model.entries[a[0]]; return same(o) ? o : null; };
    const noB = model.settings.noBlockAfter || [];
    let lo = e.slot, hi = e.slot;
    while (!noB.includes(lo - 1) && find(lo - 1)) lo--;
    while (!noB.includes(hi) && find(hi + 1)) hi++;
    const out = []; for (let s = lo; s <= hi; s++) out.push(find(s) || e);
    return out;
  }

  /* ---------- ตรวจรายงานคุณภาพ ---------- */
  function report(model) {
    const idx = new Index(model), cl = idx.allClashes(), st = model.settings;
    const over = [];
    idx.perDay.forEach((n, k) => { if (n > st.maxPerDay) { const i = k.lastIndexOf('|'); over.push({ teacherId: k.slice(0, i), day: +k.slice(i + 1), n: n }); } });
    // ครูข้ามอาคารในคาบติดกัน
    const hop = [];
    Object.values(model.teachers).forEach(t => {
      for (let d = 1; d <= 5; d++) for (let s = 1; s < st.maxSlot; s++) {
        const a = model.entries[(idx.T.get(K(d, s, t.id)) || [])[0]], b = model.entries[(idx.T.get(K(d, s + 1, t.id)) || [])[0]];
        if (a && b && a.room && b.room) { const ba = buildingOf(model, a.room), bb = buildingOf(model, b.room); if (ba !== 'X' && bb !== 'X' && ba !== bb) hop.push({ teacherId: t.id, day: d, slot: s, from: ba, to: bb }); }

    const unav = [];
    Object.values(model.entries).forEach(e => { const t = model.teachers[e.teacherId]; if (t && (t.unavail || []).includes(e.day + '-' + e.slot)) unav.push(e.id); });
    const bad = Object.values(model.entries).filter(e => e.slot > st.maxSlot).map(e => e.id);
    const lunch = Object.values(model.entries).filter(e => idx.lunchAt(e.classId, e.slot)).map(e => e.id);
    const meet = []; Object.values(model.entries).forEach(e => { const x = e.teacherId && idx.M.get(K(e.day, e.slot, e.teacherId)); if (x) meet.push({ entryId: e.id, meeting: x.name }); });
    // กลุ่มย่อย: วิชาพื้นฐานห้ามแยกกลุ่ม และพี่น้องควรเรียนพร้อมกัน (ไม่งั้นนักเรียนอีกกลุ่มว่างคาบ)
    const subBas = Object.values(model.entries).filter(e => subBasic(model, e)).map(e => e.id);
    const subSplit = [];
    siblingGroups(model).forEach((kids, pid) => {
      if (kids.length < 2) return;
      for (let d = 1; d <= 5; d++) for (let s = 1; s <= st.maxSlot; s++) {
        const busy = kids.filter(k => (idx.C.get(K(d, s, k)) || []).length);
        if (busy.length && busy.length < kids.length) subSplit.push({ parentId: pid, day: d, slot: s, busy: busy, idle: kids.filter(k => !busy.includes(k)) });

  /** ห้องแม่ → [กลุ่มย่อย] */
  function siblingGroups(model) {
    const g = new Map(), byName = {};
    Object.values(model.classes).forEach(c => { byName[c.name] = c; });
    Object.values(model.classes).forEach(c => { const p = classInfo(c.name).parent, pc = p && byName[p]; if (pc) (g.get(pc.id) || g.set(pc.id, []).get(pc.id)).push(c.id); });
    return g;
  }

  /* ---------- ตัวช่วยจัดอัตโนมัติ ---------- */
  function rng(seed) { let s = seed >>> 0 || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }

  /**
   * payload = { model, cardIds, timeMs, seed, restarts }  — model ต้องมี entries/pool/classes/teachers/locations/settings
   * card ใน pool = {id, teacherId, subjectId, classId, room, span}
   * คืน { placed:[{cardId,day,slot}], moved:[{entryId,day,slot}], failed:[cardId], ms }
   */
  function runSolve(p) {
    const t0 = Date.now(), model = p.model, st = model.settings, budget = p.timeMs || 4000;
    const ids = p.cardIds || Object.keys(model.pool);
    let best = null, attempt = 0;
    while (attempt === 0 || (Date.now() - t0 < budget && attempt < (p.restarts || 40) && best.failed.length)) {
      const r = solveOnce(model, ids, (p.seed || 7) + attempt * 7919, t0 + budget);
      if (!best || r.failed.length < best.failed.length) best = r;
      attempt++;
    }
    best.ms = Date.now() - t0; best.attempts = attempt;
    return best;
  }

  function solveOnce(model, ids, seed, deadline) {
    const R = rng(seed), st = model.settings;
    // สำเนาโมเดลเบา ๆ เพื่อไม่แตะของจริง
    const work = { settings: st, teachers: model.teachers, classes: model.classes, locations: model.locations, subjects: model.subjects, meetings: model.meetings || {}, roles: model.roles || [], entries: {}, pool: {} };
    const flexKinds = c => (!c.room && work.subjects[c.subjectId] && work.subjects[c.subjectId].locKinds || []);
    Object.values(model.entries).forEach(e => { work.entries[e.id] = e; });
    const idx = new Index(work);
    const auto = new Set();      // entry id ที่วางในรอบนี้ (ขยับได้)
    const cards = ids.map(id => model.pool[id]).filter(Boolean);
    const load = {}; cards.forEach(c => { load[c.teacherId || ''] = (load[c.teacherId || ''] || 0) + c.span; });
    const teacherCount = {}; Object.values(model.entries).forEach(e => { teacherCount[e.teacherId] = (teacherCount[e.teacherId] || 0) + 1; });
    const difficulty = c => (c.span - 1) * 6 + ((teacherCount[c.teacherId] || 0) + (load[c.teacherId] || 0)) / 4 + (c.room && !/^ห้อง/.test(c.room) ? 6 : 0) + R() * 3;
    const rules = (st.solveRules || []).filter(r => r && r.on), match = ruleMatcher(work);
    const timeRules = rules.filter(r => r.type === 'time'), reserves = rules.filter(r => r.type === 'reserve');
    const ruleOf = t => rules.find(r => r.type === t);
    // ตารางต้นแบบ (ปี/ภาคก่อน): ครูคนเดิมควรลงวัน/คาบเดิม — เทียบด้วยชื่อ จึงใช้ข้ามปีได้
    const mimicR = ruleOf('mimic'), ref = mimicR && model.ref && (model.ref.rows || []).length ? refIndex(model.ref) : null;
    const tName = id => (work.teachers[id] || {}).name || '';
    function mimicCost(c, d, s) {
      const tn = tName(c.teacherId); if (!ref.T.has(tn)) return 0;
      const cl = work.classes[c.classId] || {}; let p = 0;
      for (let k = 0; k < c.span; k++) { const x = d + '-' + (s + k); p += ref.TC.has(tn + '|' + cl.name + '|' + x) ? 0 : ref.TL.has(tn + '|' + cl.level + '|' + x) ? 3 : ref.TS.has(tn + '|' + x) ? 6 : 12; }
      return p;
    }
    // กลุ่มย่อยพี่น้อง (ม.4/9ญ กับ ม.4/9ต) ควรเรียนวิชาเพิ่มเติมพร้อมกัน ไม่งั้นนักเรียนอีกกลุ่มว่างคาบ
    const sibOf = {}; siblingGroups(work).forEach(kids => { if (kids.length > 1) kids.forEach(k => { sibOf[k] = kids.filter(x => x !== k); }); });
    const firstOf = c => rules.some(r => (r.type === 'first' || (r.type === 'reserve' && r.first)) && match(r.sel, c)) ? 1 : 0;
    // บัตรที่เงื่อนไขบอกให้จัดก่อน (เช่น วิชาวิทย์จอง Lab) ต้องได้คิวก่อน ไม่งั้นวิชาอื่นแย่งห้องไปหมด
    let queue = cards.slice().sort((a, b) => firstOf(b) - firstOf(a) || difficulty(b) - difficulty(a));
    // กลุ่มย่อยพี่น้องได้คิวต้น ๆ และสลับกันทีละใบ (ญ ต ญ ต …) ให้บัตรใบหลังลงช่องเดียวกับพี่น้องได้
    {
      const isSub = c => !!sibOf[c.classId], byKid = new Map();
      queue.filter(isSub).forEach(c => { (byKid.get(c.classId) || byKid.set(c.classId, []).get(c.classId)).push(c); });
      const inter = [], kids = Array.from(byKid.keys()).sort();
      for (let i = 0; kids.some(k => byKid.get(k).length > i); i++) kids.forEach(k => { const c = byKid.get(k)[i]; if (c) inter.push(c); });
      const firsts = queue.filter(c => firstOf(c) && !isSub(c));
      queue = firsts.concat(inter, queue.filter(c => !firstOf(c) && !isSub(c)));
    }
    const placed = {};           // cardId -> {day,slot,entryIds}
    const ejectedIds = [];
    let seq = 0;

    const mkBlock = (c, day, slot, room) => { const b = [], offs = []; for (let k = 0; k < c.span; k++) (c.classIds || [c.classId]).forEach(cid => { b.push({ id: 'a' + (++seq), teacherId: c.teacherId || '', subjectId: c.subjectId, classId: cid, room: room != null ? room : c.room, day: day, slot: slot + k, cardId: c.id }); offs.push(k); }); b.offs = offs; return b; };
    /* บันทึกทุกการวาง/ถอน ไว้ย้อนกลับ — เดิมตอนย้ายผู้ขวางไม่สำเร็จ คืนผู้ขวางกลับที่เดิมตรง ๆ
       แต่ระหว่างนั้นบัตรอื่นในลูกโซ่อาจย้ายไปลงช่องเดิมแล้ว ผลจึงซ้อนกัน (เจอเมื่อเงื่อนไขแบบ "ต้อง" บีบมาก)
       ย้อนตามบันทึกทีละขั้นได้สภาพก่อนลองทุกประการ ซึ่งไม่ชนแน่นอน */
    const journal = [];
    const put = (c, day, slot, room) => { putRaw(c, day, slot, room); journal.push(['put', c.id]); };
    const unput = c => { const pl = placed[c.id]; if (!pl) return; unputRaw(c); journal.push(['unput', pl]); };
    const rollback = mark => { while (journal.length > mark) { const [op, x] = journal.pop(); if (op === 'put') { if (placed[x]) unputRaw(placed[x].card); } else putRaw(x.card, x.day, x.slot, x.room); } };
    const putRaw = (c, day, slot, room) => { const b = mkBlock(c, day, slot, room); b.forEach(e => { work.entries[e.id] = e; idx.add(e); auto.add(e.id); }); placed[c.id] = { day: day, slot: slot, room: room != null ? room : c.room, ids: b.map(e => e.id), card: c }; };
    const unputRaw = c => { const pl = placed[c.id]; if (!pl) return; pl.ids.forEach(id => { idx.remove(work.entries[id]); delete work.entries[id]; auto.delete(id); }); delete placed[c.id]; };

    const dayEntries = (tid, day) => { const arr = []; for (let s = 1; s <= st.maxSlot; s++) if ((idx.T.get(K(day, s, tid)) || []).length) arr.push(s); return arr; };
    const classDay = (cid, day) => { const arr = []; for (let s = 1; s <= st.maxSlot; s++) if ((idx.C.get(K(day, s, cid)) || []).length) arr.push(s); return arr; };
    const gaps = arr => { if (arr.length < 2) return 0; arr = arr.slice().sort((a, b) => a - b); return arr[arr.length - 1] - arr[0] + 1 - arr.length; };

    const inRange = (r, d, s) => (!r.days || !r.days.length || r.days.map(Number).includes(d)) && s >= r.from && s <= r.to;
    function sameSubjectThatDay(c, d, s0) {
      for (const cid of (c.classIds || [c.classId])) for (const s of classDay(cid, d)) {
        if (s >= s0 - 1 && s <= s0 + c.span) continue;   // ติดกัน = ต่อเป็นคาบคู่ ไม่นับเป็นอีกครั้ง
        const a = idx.C.get(K(d, s, cid)), e = a && work.entries[a[0]]; if (e && e.subjectId === c.subjectId) return true;
      }
      return false;
    }
    function runAround(tid, d, s0, span) {
      const occ = new Set(dayEntries(tid, d)); for (let k = 0; k < span; k++) occ.add(s0 + k);
      let a = s0, b = s0 + span - 1; while (occ.has(a - 1)) a--; while (occ.has(b + 1)) b++;
      return b - a + 1;
    }
    /** เงื่อนไขแบบ "ต้อง" — false = ห้ามลงช่องนี้ */
    function hardOK(c, d, s) {
      for (const r of timeRules) {
        if (!r.hard || !match(r.sel, c)) continue;
        for (let k = 0; k < c.span; k++) { const hit = inRange(r, d, s + k); if (r.mode === 'prefer' ? !hit : hit) return false; }
      }
      if (!c.teacherId) return true;
      if (ref && mimicR.hard && ref.T.has(tName(c.teacherId))) for (let k = 0; k < c.span; k++) if (!ref.TS.has(tName(c.teacherId) + '|' + d + '-' + (s + k))) return false;
      const once = ruleOf('oncePerDay'); if (once && once.hard && sameSubjectThatDay(c, d, s)) return false;
      const md = ruleOf('maxDay'); if (md && md.hard && dayEntries(c.teacherId, d).length + c.span > (+md.n || 99)) return false;
      const mr = ruleOf('maxRun'); if (mr && mr.hard && runAround(c.teacherId, d, s, c.span) > (+mr.n || 99)) return false;
      return true;
    }
    /** เงื่อนไขแบบ "ควร" — คะแนนโทษ ยิ่งมากยิ่งไม่อยากลง */
    function softPenalty(c, d, s) {
      let p = 0;
      for (const r of timeRules) {
        if (r.hard || !match(r.sel, c)) continue;
        for (let k = 0; k < c.span; k++) { const hit = inRange(r, d, s + k); if (r.mode === 'prefer' ? !hit : hit) p += RULE_WEIGHT; }
      }
      if (c.teacherId) {
        const once = ruleOf('oncePerDay'); if (once && !once.hard && sameSubjectThatDay(c, d, s)) p += RULE_WEIGHT * 2;
        const md = ruleOf('maxDay'); if (md && !md.hard) { const over = dayEntries(c.teacherId, d).length + c.span - (+md.n || 99); if (over > 0) p += over * RULE_WEIGHT; }
        const mr = ruleOf('maxRun'); if (mr && !mr.hard) { const over = runAround(c.teacherId, d, s, c.span) - (+mr.n || 99); if (over > 0) p += over * RULE_WEIGHT; }

    }
    /** ห้องที่ถูกสงวนไว้ให้วิชากลุ่มอื่น (เฉพาะบัตรที่ให้ระบบเลือกห้องเอง) */
    const roomOK = (c, name) => { const l = work.locations[name]; return !l || !reserves.some(r => r.kind === l.kind && !match(r.sel, c)); };
    function score(c0, day, slot, room) {
      const c = room != null ? Object.assign({}, c0, { room: room }) : c0;
      let sc = R() * 0.6;
      const te = dayEntries(c.teacherId, day), ce = classDay(c.classId, day);
      const span = []; for (let k = 0; k < c.span; k++) span.push(slot + k);
      sc += (gaps(te.concat(span)) - gaps(te)) * 3;
      sc += (gaps(ce.concat(span)) - gaps(ce)) * 2.5;
      if (te.length + c.span > 6) sc += (te.length + c.span - 6) * 4;
      if (ce.length + c.span > 7) sc += (ce.length + c.span - 7) * 3;
      // วิชาเดียวกันห้องเดียวกันซ้ำวันเดียวกัน (นอกคาบคู่)
      if (c.span === 1) { for (const s of ce) { const a = idx.C.get(K(day, s, c.classId)); const e = a && work.entries[a[0]]; if (e && e.subjectId === c.subjectId) { sc += 8; break; } } }
      // อาคารคาบติดกัน
      const bl = buildingOf(work, c.room);
      [slot - 1, slot + c.span].forEach(s => { const a = idx.T.get(K(day, s, c.teacherId)); const e = a && work.entries[a[0]]; if (e && e.room) { const b2 = buildingOf(work, e.room); if (bl !== 'X' && b2 !== 'X' && b2 !== bl) sc += 5; } });
      // กระจายวันของวิชานี้ในห้องนี้
      let sameDays = 0; for (let d = 1; d <= 5; d++) if (d !== day) for (let s = 1; s <= st.maxSlot; s++) { const a = idx.C.get(K(d, s, c.classId)); const e = a && work.entries[a[0]]; if (e && e.subjectId === c.subjectId) { sameDays++; break; } }
      sc -= sameDays * 1.2;
      sc += softPenalty(c, day, slot);
      const sb = sibOf[c.classId]; if (sb) for (let k = 0; k < c.span; k++) sc += sb.some(x => (idx.C.get(K(day, slot + k, x)) || []).length) ? -14 : 4;
      if (ref && c.teacherId && !mimicR.hard) sc += mimicCost(c, day, slot);
      return sc;
    }

    function candidates(c) {
      const out = [], blk = mkBlock(c, 0, 0);
      const kinds = flexKinds(c);
      for (let d = 1; d <= 5; d++) for (let s = 1; s + c.span - 1 <= st.maxSlot; s++) {
        const r = idx.canPlace(blk, d, s); if (!r.ok) continue;
        if (!hardOK(c, d, s)) continue;
        if (kinds.length) { const fl = idx.freeLocations(kinds, d, s, c.span).filter(n => roomOK(c, n)); if (!fl.length) continue; out.push([d, s, fl[Math.floor(R() * fl.length)]]); }
        else out.push([d, s]);
      }
      return out;
    }
    /** ช่องที่ชนแต่ขยับผู้ขวางออกได้ (เฉพาะที่ระบบวางเองในรอบนี้) */
    function ejectable(c) {
      if (flexKinds(c).length) return [];
      const out = [], blk = mkBlock(c, 0, 0);
      for (let d = 1; d <= 5; d++) for (let s = 1; s + c.span - 1 <= st.maxSlot; s++) {
        const blockers = new Set(); let hard = false;
        for (let k = 0; k < blk.length && !hard; k++) {
          if (idx.lunchAt(blk[k].classId, s + blk.offs[k])) { hard = true; break; }
          const cl = idx.clash(blk[k], d, s + blk.offs[k]);
          [].concat(cl.teacher, cl.cls, cl.loc).forEach(id => { if (auto.has(id)) blockers.add(work.entries[id].cardId); else hard = true; });
        }
        if (hard) continue;
        if (c.teacherId) { let mtg = false; for (let k = 0; k < c.span; k++) if (idx.M.has(K(d, s + k, c.teacherId))) mtg = true; if (mtg) continue; }
        const t = work.teachers[c.teacherId];
        if (t && (t.unavail || []).some(u => { const [ud, us] = u.split('-').map(Number); return ud === d && us >= s && us < s + c.span; })) continue;
        if (c.span > 1 && (st.noBlockAfter || []).some(x => x >= s && x < s + c.span - 1)) continue;
        if (!hardOK(c, d, s)) continue;
        if (blockers.size && blockers.size <= 2) out.push([d, s, Array.from(blockers)]);
      }
      return out.sort((a, b) => a[2].length - b[2].length || R() - 0.5);
    }

    function tryPlace(c, depth) {
      if (Date.now() > deadline || subBasic(work, c)) return false;
      const cands = candidates(c);
      if (cands.length) {
        let bestS = 1e9, bp = null;
        cands.forEach(([d, s, loc]) => { const sc = score(c, d, s, loc); if (sc < bestS) { bestS = sc; bp = [d, s, loc]; } });
        put(c, bp[0], bp[1], bp[2]); return true;
      }
      if (depth <= 0) return false;
      const ej = ejectable(c).slice(0, 12);
      for (const [d, s, blockers] of ej) {
        const saved = blockers.map(id => placed[id]).filter(Boolean), mark = journal.length;
        blockers.forEach(id => unput(placed[id].card));
        put(c, d, s);

        for (const b of saved) { if (tryPlace(b.card, depth - 1)) re.push(b.card); else { ok = false; break; } }

        rollback(mark);
      }
      return false;
    }

    // เลียนแบบต้นแบบ: วางลงช่องเดิมก่อน — ครูเดิมห้องเดิม → ครูเดิมระดับชั้นเดิม → ครูเดิมช่องเดิม
    if (ref) {
      const bySpan = queue.slice().sort((a, b) => b.span - a.span);
      const hasAt = (pre, set, d, s) => set.has(pre + d + '-' + s);
      [['TC', c => tName(c.teacherId) + '|' + (work.classes[c.classId] || {}).name + '|'], ['TL', c => tName(c.teacherId) + '|' + (work.classes[c.classId] || {}).level + '|'], ['TS', c => tName(c.teacherId) + '|']].forEach(([key, pre]) => {
        bySpan.forEach(c => {
          if (placed[c.id] || !c.teacherId || subBasic(work, c) || !ref.T.has(tName(c.teacherId)) || Date.now() > deadline) return;
          const p0 = pre(c), set = ref[key], blk = mkBlock(c, 0, 0), kinds = flexKinds(c);
          for (let d = 1; d <= 5; d++) for (let s = 1; s + c.span - 1 <= st.maxSlot; s++) {
            let all = true; for (let k = 0; k < c.span; k++) if (!hasAt(p0, set, d, s + k)) { all = false; break; }
            if (!all || !idx.canPlace(blk, d, s).ok || !hardOK(c, d, s)) continue;
            if (kinds.length) { const fl = idx.freeLocations(kinds, d, s, c.span).filter(n => roomOK(c, n)); if (!fl.length) continue; put(c, d, s, fl[0]); }
            else put(c, d, s);
            return;
          }
        });
      });
    }
    // กลุ่มย่อยพี่น้อง: จับบัตรเป็นชุด (ญ 1 ใบ + ต 1 ใบ ความยาวเท่ากัน) แล้ววางช่องเดียวกันพร้อมกัน
    {
      const groups = new Map();
      queue.forEach(c => { if (!sibOf[c.classId] || placed[c.id]) return; const pid = work.classes[c.classId].parentId || classInfo(work.classes[c.classId].name).parent; const g = groups.get(pid) || groups.set(pid, new Map()).get(pid); (g.get(c.classId) || g.set(c.classId, []).get(c.classId)).push(c); });
      groups.forEach(g => {
        const lists = Array.from(g.values()).map(a => a.sort((x, y) => y.span - x.span));
        if (lists.length < 2) return;
        for (let i = 0; lists.every(a => a[i]); i++) {
          const bundle = lists.map(a => a[i]); if (bundle.some(c => c.span !== bundle[0].span) || Date.now() > deadline) continue;
          const cands = candidates(bundle[0]).map(x => [x, score(bundle[0], x[0], x[1], x[2])]).sort((a, b) => a[1] - b[1]);
          for (const [[d, s, loc]] of cands) {
            const mark = journal.length; let ok = true;
            for (const c of bundle) {
              if (c === bundle[0]) { put(c, d, s, loc); continue; }
              if (!idx.canPlace(mkBlock(c, 0, 0), d, s).ok || !hardOK(c, d, s)) { ok = false; break; }
              const kinds = flexKinds(c);
              if (kinds.length) { const fl = idx.freeLocations(kinds, d, s, c.span).filter(n => roomOK(c, n)); if (!fl.length) { ok = false; break; } put(c, d, s, fl[0]); } else put(c, d, s);
            }
            if (ok) break; rollback(mark);
          }
        }
      });
    }
    const failed = [];
    queue.forEach(c => { if (!placed[c.id] && !tryPlace(c, 3)) failed.push(c.id); });
    // ลองซ้ำอีกรอบสำหรับที่ค้าง (ตำแหน่งอาจเปลี่ยนไปแล้ว)
    for (let i = failed.length - 1; i >= 0; i--) { const c = model.pool[failed[i]]; if (Date.now() < deadline && tryPlace(c, 4)) failed.splice(i, 1); }
    const placedOut = Object.keys(placed).map(id => ({ cardId: id, day: placed[id].day, slot: placed[id].slot, room: placed[id].room }));
    return { placed: placedOut, failed: failed, moved: [] };
  }

  /* ---------- KruSpace (Firestore) ---------- */
  const numSlot = s => (/^\d+$/.test(String(s)) ? +s : 0);

  /** สร้างโมเดลจากข้อมูลส่วนกลาง (ไม่ดึงรายชื่อนักเรียนมา) */
  function modelFromCloud(cloud, period, prev) {
    const model = newModel();
    if (prev) { model.school = prev.school; model.settings = prev.settings; }
    model.period = { year: String(period.academicYear), semester: String(period.semester), id: period.id };
    const remap = {};
    (cloud.staff || []).forEach(s => {
      const id = s.id || ('t_' + fbStaffId(s.email));
      model.teachers[id] = { id: id, name: normName(s.name), email: String(s.email || '').toLowerCase(), area: s.learningArea || '', unavail: [] };
      (s.legacyIds || []).forEach(o => { remap[o] = id; });
    });
    (cloud.classes || []).forEach(c => { const ci = classInfo(c.name); model.classes[c.id] = { id: c.id, name: normName(c.name), level: ci.level, room: ci.room }; });
    (cloud.subjects || []).forEach(s => { model.subjects[s.id] = { id: s.id, code: s.code || '', name: s.name || s.code || '' }; });
    const skipped = [];
    ((cloud.timetable || {}).entries || []).filter(e => e.periodId === period.id).forEach(e => {
      const slot = numSlot(e.slotId), tid = remap[e.teacherId] || e.teacherId;
      if (!slot) { skipped.push(e); return; }
      if (!model.teachers[tid] || !model.classes[e.classId] || !model.subjects[e.subjectId]) { skipped.push(e); return; }
      const loc = normName(e.room);
      if (loc && !model.locations[loc]) model.locations[loc] = { name: loc, building: defaultBuilding(loc), kind: inferLocKind(loc) };
      model.entries[e.id] = { id: e.id, teacherId: tid, subjectId: e.subjectId, classId: e.classId, day: +e.day, slot: slot, room: loc };
    });
    classRelations(model);
    migrate(model);
    model.cloud = { periodId: period.id, loaded: Date.now() };
    return { model: model, skipped: skipped.length };
  }

  /** จับคู่ครู/ห้อง/วิชาในโมเดลกับข้อมูลส่วนกลาง ตรงตัวเท่านั้น ไม่เดา */
  function matchCloud(model, cloud) {
    const tById = {}, tByMail = {}, tByName = {}, cById = {}, cByName = {}, sById = {}, sByCode = {};
    (cloud.staff || []).forEach(s => { const id = s.id || ('t_' + fbStaffId(s.email)); tById[id] = id; if (s.email) tByMail[String(s.email).toLowerCase()] = id; tByName[normName(s.name)] = tByName[normName(s.name)] === undefined ? id : null; (s.legacyIds || []).forEach(o => { tById[o] = id; }); });
    (cloud.classes || []).forEach(c => { cById[c.id] = c.id; cByName[normName(c.name)] = c.id; });
    (cloud.subjects || []).forEach(s => { sById[s.id] = s.id; if (s.code) sByCode[String(s.code).toLowerCase()] = s.id; });
    const map = { t: {}, c: {}, s: {} }, miss = { teachers: [], classes: [], subjects: [] };
    Object.values(model.teachers).forEach(t => { const id = tById[t.id] || (t.email && tByMail[t.email]) || tByName[normName(t.name)]; if (id) map.t[t.id] = id; else if (!t.temp) miss.teachers.push(t.name); });   // ครูชั่วคราวที่มีบัญชีแล้ว (อัตราจ้าง) ยังจับคู่ตามปกติ
    Object.values(model.classes).forEach(c => { const id = cById[c.id] || cByName[c.name]; if (id) map.c[c.id] = id; else miss.classes.push(c.name); });
    Object.values(model.subjects).forEach(s => { const id = sById[s.id] || (s.code && sByCode[String(s.code).toLowerCase()]); if (id) map.s[s.id] = id; else miss.subjects.push(s.code); });
    return { map: map, missing: miss };
  }

  /** วางแผนเผยแพร่: รายการคาบใหม่ + ตัวเลขเปลี่ยนแปลง (ไม่เขียนอะไรทั้งสิ้น) */
  function planPublish(model, cloud, periodId) {
    const m = matchCloud(model, cloud), tt = cloud.timetable || {}, old = (tt.entries || []).filter(e => e.periodId === periodId);
    const keep = old.filter(e => !numSlot(e.slotId));                       // เข้าแถว/อื่น ๆ ไม่แตะ
    const oldByKey = {}; old.filter(e => numSlot(e.slotId)).forEach(e => { oldByKey[e.teacherId + '|' + e.day + '|' + e.slotId] = e; });
    const missing = m.missing, blocked = missing.teachers.length + missing.classes.length + missing.subjects.length;
    const out = [], stats = { added: 0, changed: 0, same: 0, removed: 0, kept: keep.length };
    const used = new Set();
    stats.activities = 0; stats.vacant = 0;
    Object.values(model.entries).forEach(e => {
      if (!e.teacherId) { stats.activities++; return; }
      if (isTempT(model, e.teacherId) && !m.map.t[e.teacherId]) { stats.vacant++; return; }   // ตำแหน่งว่างยังไม่มีบัญชีใน KruSpace — ขึ้นเมื่อรับครูตัวจริงแล้ว (ครูชั่วคราวที่มีบัญชีอยู่แล้วเผยแพร่ตามปกติ)
      const tid = m.map.t[e.teacherId], cid = m.map.c[e.classId], sid = m.map.s[e.subjectId];
      if (!tid || !cid || !sid) return;
      const key = tid + '|' + e.day + '|' + e.slot, o = oldByKey[key];
      let ne = { id: o ? o.id : 'tt_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4), periodId: periodId, teacherId: tid, day: e.day, slotId: String(e.slot), subjectId: sid, classId: cid, room: e.room || '' };
      if (o) { used.add(key); if (o.subjectId === sid && o.classId === cid && (o.room || '') === (e.room || '')) { stats.same++; ne = Object.assign({}, o); } else stats.changed++; } else stats.added++;
      out.push(ne);
    });
    Object.keys(oldByKey).forEach(k => { if (!used.has(k)) stats.removed++; });
    return { entries: keep.concat(out), stats: stats, missing: missing, blocked: blocked > 0 };
  }
